<!DOCTYPE html>
<html lang="en">
<head>
<script src="/scorr_card_common.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TC Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap');
  /* cc#464: TC Scanner — dark terminal skin, reused from the prior Intraday page */
:root{
    /* cc#1203 push 10: colour tokens moved to the injected contract. SHAPE stays, and --shadow
       stays for the same reason as cockpit - it is this page's own subtle elevation, not the
       contract's 44px drop shadow. --mono is Sora, not a monospace face, in 14 places. */
    --font:'Sora',sans-serif;
    --mono:'Sora',sans-serif;
    --shadow:0 2px 10px rgba(25,40,70,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}

  .model-nav{display:flex;align-items:center;gap:2px;height:46px;background:var(--panel, #121A33);
    border-bottom:1px solid rgba(148,166,210,.14);padding:0 16px;overflow-x:auto;scrollbar-width:none;
    position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(20,35,70,.06)}
  .model-nav::-webkit-scrollbar{display:none}

  .wrap{max-width:1120px;margin:0 auto;padding:12px 18px 40px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .logo{font-weight:800;letter-spacing:.5px;font-size:20px}
  .logo b{color:var(--violet)}
  .tag{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
  .spacer{flex:1}
  .clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut)}
  .clock b{color:var(--txt)}
  .live-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);
    font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--panel2);border:1px solid var(--line2);
    border-radius:20px;padding:4px 11px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--grn);
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .ibtn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--line2);color:var(--mut);font-size:10px;font-weight:700;
    font-family:var(--mono);font-variant-numeric:tabular-nums;cursor:pointer;margin-left:8px}
  .ibtn:hover{color:var(--cyan);border-color:var(--cyan)}
  .info-ov{display:none;position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:95;align-items:center;justify-content:center;padding:20px}
  .info-ov.open{display:flex}
  .info-box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:480px;width:100%;padding:18px 20px;position:relative;max-height:85vh;overflow:auto}
  .info-close{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);cursor:pointer;font-size:14px}

  /* cc#1530 (TC_SCANNER_R1_V1): the four stat tiles take the R1 seg grammar — 10px radius card
     on --well with a glowing left rail per tile (cyan Scanned / green Qualified / plain Buy /
     red Sell). Same ids, same data, new clothes. */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--well,var(--panel));border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim)}
  .card.cy::before{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .card.gr::before{background:var(--grn);box-shadow:0 0 10px var(--grn)}
  .card.rd::before{background:var(--red);box-shadow:0 0 10px var(--red)}
  .card .k{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px;font-weight:600}
  .card .v{font-size:22px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1}
  .card .vs{font-size:10.5px;color:var(--dim);margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* cc#1530: the Buy/Sell switch takes the R1 filled-pill toggle — one bordered group, the
     active side solid --blu with knocked-out text. Same ids/onclick, no behaviour change. */
  .tabs{display:flex;align-items:center;gap:0;margin-bottom:0}
  .tabgrp{display:inline-flex;border-radius:9px;overflow:hidden;border:1px solid var(--line2)}
  .tab{font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;padding:9px 18px;
    background:var(--panel);display:flex;align-items:center;gap:6px;transition:.15s}
  .tab:hover{color:var(--txt)}
  .tab .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10px;opacity:.75;font-weight:600}
  .tab.active{color:#fff;background:var(--blu)}
  .panel{display:none;animation:fade .2s ease;padding-top:16px}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1}}

  .ptitle{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--cyan);
    text-transform:uppercase;margin:4px 0 10px;display:flex;gap:8px;align-items:center}
  .ptitle .ct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--dim);
    border:1px solid var(--line);padding:2px 8px;border-radius:20px;text-transform:none;letter-spacing:0}

  .scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{position:sticky;top:0;background:var(--panel2);color:var(--mut);font-weight:600;
    text-align:right;padding:9px 12px;border-bottom:1px solid var(--line2);
    white-space:nowrap;font-size:11px;letter-spacing:.3px;text-transform:uppercase;
    font-family:var(--mono);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);
    white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--bg2)}
  tr.row-win:hover{background:rgba(47,212,139,.10)}
  tr.row-loss:hover{background:rgba(255,92,108,.14)}
  .sym{font-family:var(--font);font-weight:700;color:var(--txt)}
  .pos{color:var(--grn);font-weight:700}.neg{color:var(--red);font-weight:700}
  .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;
    font-family:var(--font);letter-spacing:.4px;white-space:nowrap}
  .b-buy{background:var(--grn-d);color:var(--grn)}
  .b-sell{background:var(--red-d);color:var(--red)}
  .b-target{background:var(--grn-d);color:var(--grn);border:1px solid var(--grn-bd)}
  .b-sl{background:var(--red-d);color:var(--red);border:1px solid var(--red-bd)}
  .b-open{background:var(--panel2);color:var(--mut);border:1px solid var(--line2)}
  .empty{padding:28px;text-align:center;color:var(--dim);font-size:12px;font-family:var(--font)}
  /* cc#1530: score mini-bar + pass/fail gate chips (R1), and Near Miss as a native <details>
     closed by default — the chevron is the summary's own ::before, no JS toggle to keep in sync. */
  .score{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .sbar{width:52px;height:5px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}
  .sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--cyan)}
  .gate{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:16px;
    border-radius:4px;padding:0 3px;margin-right:3px;font-size:8.5px;font-weight:800;
    font-family:var(--mono)}
  .gate.pass{background:var(--grn-d);color:var(--grn)}
  .gate.fail{background:var(--red-d);color:var(--red)}
  .gate.na{background:var(--panel2);color:var(--dim)}
  .nm{margin-top:18px}
  .nm summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--cyan);text-transform:uppercase}
  .nm summary::-webkit-details-marker{display:none}
  .nm summary::before{content:'\25B8';font-size:10px;transition:transform .15s}
  .nm[open] summary::before{transform:rotate(90deg)}
  .nm .scroll{margin-top:10px}
  /* cc#1686 (founder 04-Sep screenshot): the eligible (BUY/SELL) and Near Miss tables read 2
     notches up. This page has no --type ramp (checked: every size here is a plain px literal, not
     the token scale scorr_v10_signal.html's cc#1502 used for its own "2 notches") — per the card's
     own explicit fallback, that means +2px per element, stated plainly rather than inventing a
     ramp for one page. Scoped to .panel (renderPanel()'s own qual/miss tables) rather than the
     bare table/th/td selectors above, which the hidden ORB AG and Result Radar tables (cc#1226 —
     off the strip, code kept, never mounted since currentSide can no longer reach them) also use;
     this keeps the change to the section actually asked for and touches nothing dead-but-shared.
     Row height/cell padding are NOT hand-set anywhere in the base rules (padding is a fixed
     9px/12px, not text-relative), so the extra line-height from the bigger font is what gives the
     row its room — no clipping at the unchanged padding, confirmed in the scripted render below. */
  .panel table{font-size:14.5px}
  .panel th{font-size:13px}
  .panel td{font-size:14px}
  .panel .badge{font-size:12px}
  .panel .gate{font-size:10.5px;min-width:26px;height:19px;padding:0 4px}

  .mob-cards{display:none;flex-direction:column;gap:8px;margin-top:10px}
  .mob-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .mob-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mob-sym{font-weight:700;font-size:14px;color:var(--txt)}
  .mob-chips{display:flex;flex-wrap:wrap;gap:5px}
  .mob-chip{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11px;padding:3px 8px;border-radius:6px;
    background:var(--bg2);border:1px solid var(--line2);color:var(--txt)}

  footer{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11px;color:var(--dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

  @media(max-width:680px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .scroll table{min-width:520px}
    .mob-cards{display:flex}
    .desktop-tbl{display:none}
  }
  @media(min-width:681px){
    .mob-cards{display:none!important}
    table{min-width:560px}
  }
</style>
</head>
<body>

<nav class="model-nav" id="scorr-nav"></nav>

<div class="wrap">
  <header>
    <div>
      <div class="logo">TC <b>Scanner</b><span class="ibtn" onclick="openInfo()" title="How this works">i</span>
        <span id="hdrBadge" style="display:none;vertical-align:middle;margin-left:8px;font-family:var(--mono);
          font-size:9.5px;font-weight:600;letter-spacing:.13em;padding:3px 8px;border-radius:4px;
          border:1px solid var(--amber);color:var(--amber);background:var(--amber-bg,rgba(245,185,74,.10))"></span></div>
      <div class="tag"><span id="hdrTag">Full Futures Universe</span><span id="hdrCounts"></span></div>
    </div>
    <div class="spacer"></div>
    <div class="clock" id="clock">—</div>
    <div class="live-pill"><span class="live-dot"></span><span id="liveTs">—</span></div>
  </header>

  <!-- cc#1601 (founder 02-Sep 15:08): the four stat tiles (Scanned / Qualified / Buy Qualified /
       Sell Qualified, cc#1229) are GONE — they took a full row above the tables. The two numbers
       that matter now ride in the muted caption under the title (#hdrCounts, painted by
       renderSummary from the same tc_config the tiles read). No box, no row. -->

  <div class="tabs" style="align-items:center">
    <div class="tabgrp">
      <div class="tab active" id="tabBUY" onclick="selectTab('BUY')">▲ Buy <span class="n" id="tabBuyN"></span></div>
      <div class="tab" id="tabSELL" onclick="selectTab('SELL')">▼ Sell <span class="n" id="tabSellN"></span></div>
    </div>
    <!-- cc#772: page-level quick-switch across every registered scanner strategy (reads /api/scanners/registry) -->
    <button id="otherStratBtn" onclick="openStrategies()" title="Jump to another scanner strategy"
            style="margin-left:auto;margin-bottom:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;
                   color:var(--mut);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;
                   padding:5px 11px;cursor:pointer">⋯ Other Strategies</button>
  </div>

  <div class="panel active" id="panelBUY"></div>
  <div class="panel" id="panelSELL"></div>

  <footer>
    <span id="footerLegend">TC Scanner &middot; full futures universe &middot; screener only, not a live signal</span>
    <span id="footerRefresh">Auto-refresh 30s</span>
  </footer>
</div>

<div class="info-ov" id="infoOv" onclick="if(event.target===this)closeInfo()">
  <div class="info-box" id="infoBox">
    <button class="info-close" onclick="closeInfo()">&times;</button>
    <div id="infoTitle" style="font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;margin-bottom:10px">TC Scanner &middot; how it works</div>
    <div id="infoBody" style="font-size:12.5px;line-height:1.7;color:var(--txt)">Loading…</div>
  </div>
</div>

<!-- cc#772: OTHER STRATEGIES quick-switch menu (reads /api/scanners/registry) -->
<div class="info-ov" id="stratOv" onclick="if(event.target===this)closeStrat()">
  <div class="info-box">
    <button class="info-close" onclick="closeStrat()">&times;</button>
    <div style="font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;margin-bottom:6px">Scanner strategies</div>
    <div id="stratBody" style="font-size:12.5px;color:var(--txt)">Loading…</div>
  </div>
</div>

<script>
let data = null;
let currentSide = 'BUY';
const AUTO_MS = 30000;

// cc#1530: cc#1296's hand-rolled toggleMiss() is retired — Near Miss is a native <details>
// element now (closed by default), so the open/closed state and the chevron are the browser's
// own and there is no JS state to fall out of sync. The postMessage below keeps the embed
// frame sized when it opens.

function tick(){
  const ist = new Date(Date.now() + (5*60+30)*60000);
  const hh = String(ist.getUTCHours()).padStart(2,'0');
  const mm = String(ist.getUTCMinutes()).padStart(2,'0');
  const ss = String(ist.getUTCSeconds()).padStart(2,'0');
  const mins = ist.getUTCHours()*60 + ist.getUTCMinutes();
  const dow = ist.getUTCDay();
  const open = dow >= 1 && dow <= 5 && mins >= 555 && mins <= 930;
  document.getElementById('clock').innerHTML =
    `<b>${hh}:${mm}:${ss}</b> IST &nbsp;&middot;&nbsp; <span style="color:${open?'var(--grn)':'var(--dim)'}">NSE ${open?'OPEN':'CLOSED'}</span>`;
}
setInterval(tick, 1000); tick();

// cc#465, re-pointed by cc#1229: modal and header content is FETCHED, never typed, so it cannot
// drift from the thresholds the page actually applies. The SOURCE moved with the engine — it was
// /api/scanners/tc/spec while TC13 ran this page; it is now /api/tc-scanner/config, the one
// TC_SCANNER_CONFIG dict that /check reads too. The rule is the same: no hand-typed numbers here.
let tcSpecCache = null;
/* cc#1229: the modal renders the config's OWN sheet - the same lines /check shows - instead of
   the TC13 check list. tc_scanner_config.rules_sheet() builds those lines from the config dict,
   so this function formats and never states. */
function renderInfoBody(j){
  const sh = (j && j.sheet) || null;
  if(!sh) return '<span style="color:var(--red)">Rules unavailable</span>';
  return sh.lines.map(function(L){
      return '<div style="margin-bottom:11px">'
        + (L.k ? '<div style="font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin-bottom:4px">'+esc(L.k)+'</div>' : '')
        + '<div style="font-size:12.5px;line-height:1.55;color:var(--txt)">'+esc(L.v)+'</div></div>';
    }).join('')
    + '<div style="margin-top:12px;color:var(--dim);font-size:11px">'+esc(sh.footer)+'</div>';
}

function esc(x){ return String(x==null?'':x)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function openInfo(){
  document.getElementById('infoOv').classList.add('open');
  document.getElementById('infoTitle').textContent = 'How these signals are picked';
  const body=document.getElementById('infoBody');
  if(tcSpecCache){ body.innerHTML=renderInfoBody(tcSpecCache); return; }
  body.innerHTML='Loading…';
  const s = await loadSpec();
  body.innerHTML = s ? renderInfoBody(s)
    : '<span style="color:var(--red)">Spec unavailable</span>';
}
function closeInfo(){document.getElementById('infoOv').classList.remove('open');}

function num(v, d=2){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(d); }
function pct(v, d=2){ if(v==null||isNaN(v)) return '—'; const n=Number(v); return (n>=0?'+':'')+n.toFixed(d)+'%'; }
function cls(v){ return Number(v)>=0 ? 'pos' : 'neg'; }

/* cc#1226: two tabs. ORB AG and Result Radar are gone from the STRIP only - their endpoints,
   tables and scheduler jobs are untouched, and loadOrb/loadRadar still run below so both
   observation studies keep writing. They can no longer reach a panel, because currentSide can
   never be ORB or RADAR once the tabs are gone, and every DOM write in those loaders is already
   guarded on currentSide. */
function selectTab(side){
  currentSide = side;
  ['BUY','SELL'].forEach(s=>{
    document.getElementById('tab'+s).className = 'tab' + (side===s?' active':'');
    document.getElementById('panel'+s).className = 'panel' + (side===s?' active':'');
  });
  paintSpecText();
  if (typeof postSize === 'function') postSize();   /* cc#1530: the two sides differ in height */
}

/* cc#1226 established the mechanism and cc#1229 re-pointed its source: the header sub-line and
   the footer legend are RENDERED, never typed. They were hand-written prose repeating the check
   count and the pass bar as literals — true at the time, but a second copy of numbers that lived
   in the engine, and a second copy is what drifts.

   The engine changed under this page, so the source changed with it. cc#1226 read the TC13 spec
   endpoint; cc#1229 reads /api/tc-scanner/config. One copy either way, which is the whole point of
   doing it this way rather than editing the sentence each time the config moves. */
/* cc#1229: the header sub-line and footer legend are RENDERED FROM /api/tc-scanner/config -
   the single TC_SCANNER_CONFIG dict, the same one /check reads. cc#1226 pointed this at the TC13
   spec endpoint because TC13 was the engine; the engine changed, so the source changed with it.
   The MECHANISM is unchanged and that is the point: no number is typed into this file, so the
   text cannot drift from the config the page is actually applying.

   PLACEHOLDERS STILL CARRY NO NUMBERS. A failed fetch leaves only what the page can back up. */
function paintSpecText(){
  const j = tcSpecCache; if(!j || !j.config) return;
  const c = j.config, t = c.score_thresholds || {};
  const bars = (j.buckets||Object.keys(t)).map(b => b + ' ' + t[b]).join(' · ');
  const tag = document.getElementById('hdrTag');
  if (tag) tag.textContent = 'Score /100 · Gated · Config ' + c.version + ' · Full Futures Universe';
  /* cc#1530: the R1 header badge — engine name is the page's own (like TC13's), the config
     version comes from the payload, never typed. Hidden until the config has actually loaded. */
  const hb = document.getElementById('hdrBadge');
  if (hb){ hb.textContent = 'V1.1 · GATED · CONFIG ' + c.version; hb.style.display = 'inline-block'; }
  const leg = document.getElementById('footerLegend');
  if (leg) leg.textContent = 'TC Scanner · full futures universe · score /100 per bucket, bars ' +
      bars + ' · entry gates on sector and monthly RSI · max ' + (c.caps||{}).per_bucket_per_day +
      ' per bucket per day · target +' + (c.exit||{}).target_pct + '% / SL ' + (c.exit||{}).stop_pct +
      '% · screener only, not a live signal';
}

async function loadSpec(){
  if(tcSpecCache){ paintSpecText(); return tcSpecCache; }
  try{
    const r = await fetchWithTimeout('/api/tc-scanner/config');
    tcSpecCache = await r.json();
    paintSpecText();
  }catch(e){ /* placeholders stay; they assert nothing the page cannot back up */ }
  return tcSpecCache;
}

/* ══ cc#1229 · THE PAGE READS THE SCORE100 GATED ENGINE ════════════════════════════════════════
   Founder option B (session_log 29504). /intraday stops presenting the TC13 binary bucket and
   becomes a SECOND SURFACE of the engine /check already runs.

   NO SCORING LIVES HERE. Every number on this page arrives from GET /api/trade-check/v4/scan -
   the same endpoint /check Future Scans calls, unchanged. score100, the per-bucket bar, the gate
   results, the rank in bucket and would_qualify are all computed server-side in tc_v4_scan.py via
   tc_scanner_config.annotate(). This file formats them and does no arithmetic of its own. That is
   the "one engine, one truth, no fork" the card asks for, and it is why the same symbol must read
   identically on both pages: there is only one place the number can come from.

   QUALIFIED MEANS BOTH, and the row says which half failed. A symbol qualifies only when it
   clears its bucket's score bar AND passes all three entry gates for its side AND sits inside the
   per-bucket daily cap. Anything else renders in NEAR MISS with the failing condition named, so a
   row that just missed is readable rather than merely absent. */

function renderSummary(){
  const cfg = (data && data.tc_config) || null;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  /* cc#1601 scope 1: the counts live in the caption line now — "207 scanned · 1 qualified
     (BUY 0 · SELL 1)" — from the same tc_config the tiles used to read. A failed annotation says
     so in the same place rather than printing dashes in four boxes. */
  if (!cfg || cfg.error) {
    set('hdrCounts', cfg && cfg.error ? ' · counts unavailable (annotation failed)' : '');
    set('tabBuyN', ''); set('tabSellN', '');
    return;
  }
  const bb = cfg.by_bucket || {};
  const q = b => ((bb[b] || {}).would_qualify || 0);
  const buyQ = q('BUY-MOM') + q('BUY-REV'), sellQ = q('SELL-MOM') + q('SELL-REV');
  set('hdrCounts', ' · ' + cfg.total + ' scanned · ' + cfg.would_qualify + ' qualified (BUY ' + buyQ + ' · SELL ' + sellQ + ')');
  set('tabBuyN', buyQ);
  set('tabSellN', sellQ);
  set('liveTs', data.as_of || data.computed_at || '—');
}

const GATE_SHORT = { sector_week: 'SW', sector_month: 'SM', rsi_month: 'RSI' };
/* cc#1601 scope 2: Near Miss renders OPEN on every fresh load; a hand-collapse is remembered in
   memory only for this visit (the 30 s refresh re-renders the panel, so the state has to live
   outside the DOM), never in localStorage. */
const NM_OPEN = { BUY: true, SELL: true };
function nmToggle(side, el){ NM_OPEN[side] = !!(el && el.open); if (typeof postSize === 'function') postSize(); }

function gateStrip(x){
  const g = x && x.gate;
  if (!g || !g.gates || !g.gates.length) return '<span style="color:var(--dim)">—</span>';
  /* cc#1530: the R1 gate-chip pair — filled pass/fail boxes. The gate KEY stays on the chip and
     the full text stays in the tooltip: a bare tick tells the reader THAT a gate failed, the key
     tells them WHICH, and dropping that would be a restyle costing information. */
  return g.gates.map(function(one){
    const cls = one.pass === true ? 'pass' : (one.pass === false ? 'fail' : 'na');
    const sh  = GATE_SHORT[one.key] || String(one.key || '?').slice(0,3).toUpperCase();
    return '<span class="gate ' + cls + '" title="' + esc(one.text) + '">' + sh + '</span>';
  }).join('');
}

/* The reason a row is not qualified, in the order the engine applies the tests. Reported from the
   server's own flags - never re-derived here, or the page could disagree with the engine about a
   row while showing the engine's own numbers beside it. */
function missReason(x){
  if (x.bar_met === false) return 'score ' + Number(x.best_score100).toFixed(1) + ' under bar ' + x.bar;
  if (x.bar_met === null)  return 'no score';
  const g = x.gate || {};
  if (g.passed === false)  return 'gate: ' + (g.failing || []).join(', ');
  if (g.passed === null)   return 'gate not measured';
  if (x.within_cap === false) return 'rank ' + x.rank_in_bucket + ', beyond the daily cap';
  return 'not qualified';
}

function scoreCell(x){
  if (x.best_score100 == null) return '<span style="color:var(--dim)">—</span>';
  const col = x.bar_met === true ? 'var(--grn)' : (x.bar_met === false ? 'var(--mut)' : 'var(--dim)');
  /* cc#1530: R1 mini-bar beside the number — fill = score against its own bucket bar, capped at
     100%. No bar value -> no bar drawn (nothing is measured against an unknown threshold). */
  /* cc#1601 scope 3 (TC_SCORE_100_V1, 29138): the number is score100 and prints "/ 100" — never as
     a fraction over the bar. The bar itself is a small muted chip "bar <n>" read from the payload
     (x.bar, the bucket's qualifying threshold — never typed here). The mini-bar fill is score100
     out of 100 with a thin tick at the bar value, so clearing or missing it stays visible. */
  const bar = (x.bar != null && x.bar > 0)
    ? '<div class="sbar"><i style="width:' + Math.min(100, Math.max(0, Number(x.best_score100))).toFixed(0) + '%"></i>'
      + '<em style="position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--txt);opacity:.75;left:' + Math.min(100, Number(x.bar)).toFixed(1) + '%"></em></div>'
    : '<div class="sbar"><i style="width:' + Math.min(100, Math.max(0, Number(x.best_score100))).toFixed(0) + '%"></i></div>';
  const chip = (x.bar != null)
    // cc#1686: +2px, same fallback as the CSS block above (this page has no --type ramp).
    ? '<span class="barchip" style="font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;white-space:nowrap">bar ' + esc(x.bar) + '</span>'
    : '';
  return '<div class="score"><span><b style="color:' + col + '">' + Number(x.best_score100).toFixed(1) + '</b>'
       + '<span style="color:var(--dim);font-size:12px"> / 100</span></span>'
       + chip + bar + '</div>';
}

function renderPanel(side){
  if (!data) return '<div class="empty">No data</div>';
  const all = (data.results || []).filter(r => String(r.best_label || '').indexOf(side) === 0);
  const qual = all.filter(r => r.would_qualify);
  const miss = all.filter(r => !r.would_qualify)
                  .sort((a,b) => (b.best_score100 || 0) - (a.best_score100 || 0)).slice(0, 25);

  const head = '<div class="ptitle">' + side + ' &middot; score /100 gated '
    + '<span class="ct">' + qual.length + ' qualified &middot; ' + all.length + ' scored on this side</span></div>';

  const row = x => '<tr>'
    + '<td class="sym">' + esc(x.symbol) + '</td>'
    + '<td><span class="badge ' + (side === 'SELL' ? 'b-sell' : 'b-buy') + '">' + esc(x.best_label) + '</span></td>'
    + '<td>' + scoreCell(x) + '</td>'
    + '<td>' + gateStrip(x) + '</td>'
    + '<td>' + (x.rank_in_bucket != null ? '#' + x.rank_in_bucket : '—') + '</td>'
    + '<td>' + num(x.cmp) + '</td>'
    + '<td class="' + (x.day_chg != null ? cls(x.day_chg) : '') + '">' + pct(x.day_chg) + '</td>'
    // cc#1686: +2px, same fallback as the CSS block above.
    + '<td style="font-size:13px;color:var(--dim)">' + esc(x.segment || '—') + '</td>'
    + '</tr>';

  const missRow = x => '<tr>'
    + '<td class="sym">' + esc(x.symbol) + '</td>'
    + '<td><span class="badge ' + (side === 'SELL' ? 'b-sell' : 'b-buy') + '">' + esc(x.best_label) + '</span></td>'
    + '<td>' + scoreCell(x) + '</td>'
    + '<td>' + gateStrip(x) + '</td>'
    + '<td colspan="4" style="font-size:13px;color:var(--dim)">' + esc(missReason(x)) + '</td>'
    + '</tr>';

  const qualSection = '<div class="scroll desktop-tbl"><table><thead><tr>'
    + '<th>Symbol</th><th>Bucket</th><th>Score /100 &middot; bar</th><th>Gates</th><th>Rank</th><th>CMP</th><th>Day %</th><th>Sector</th>'
    + '</tr></thead><tbody>'
    + (qual.map(row).join('') || '<tr><td colspan="8" class="empty">No ' + side
       + ' signal clears both its score bar and its gates right now</td></tr>')
    + '</tbody></table></div>';

  // cc#1530: Near Miss is a native <details> (cc#1601: OPEN by default, hand-collapse remembered
  // in memory for the visit) with the existing "N shown,
  // strongest first" chip kept verbatim. Per-side elements as before — both panels stay in the
  // DOM at once. The ontoggle hook keeps the embed frame's height honest when it opens.
  const missSection = '<details class="nm" id="missTbl' + side + '"' + (NM_OPEN[side] ? ' open' : '') + ' ontoggle="nmToggle(\'' + side + '\', this)">'
    + '<summary>Near miss <span class="ct">'
    + miss.length + ' shown, strongest first</span></summary>'
    + '<div class="scroll desktop-tbl"><table><thead><tr>'
    + '<th>Symbol</th><th>Bucket</th><th>Score /100 &middot; bar</th><th>Gates</th><th>Why not</th>'
    + '</tr></thead><tbody>'
    + (miss.map(missRow).join('') || '<tr><td colspan="5" class="empty">Nothing scored on this side</td></tr>')
    + '</tbody></table></div></details>';

  const mob = qual.map(x => '<div class="mob-card">'
    + '<div class="mob-card-head"><span class="mob-sym">' + esc(x.symbol) + '</span>'
    + '<span class="badge ' + (side === 'SELL' ? 'b-sell' : 'b-buy') + '">' + esc(x.best_label) + '</span></div>'
    + '<div class="mob-chips"><span class="mob-chip">' + scoreCell(x) + '</span>'
    + '<span class="mob-chip">' + gateStrip(x) + '</span>'
    + '<span class="mob-chip">CMP ' + num(x.cmp) + '</span>'
    + '<span class="mob-chip ' + (x.day_chg != null ? cls(x.day_chg) : '') + '">' + pct(x.day_chg) + '</span>'
    + '</div></div>').join('');

  return head + qualSection
       + '<div class="mob-cards">' + (qual.length ? mob : '<div class="empty">No qualified ' + side + ' signal</div>') + '</div>'
       + missSection;
}

/* cc#1530 scope 4: when this page runs EMBEDDED (the V8 Dashboard TC Scanner tab, or any
   embed=1 frame), it reports its own rendered height to the parent after every repaint that can
   change it — first load, the Buy/Sell toggle, a Near Miss expand, the 30s refresh. The parent
   sizes the frame from these messages, so the tab never reserves a viewport of dead space over
   short content (the founder's 31-Aug gap) and never clips tall content either. rAF-debounced;
   a no-op when standalone. */
var _psRaf = null;
function postSize(){
  if (window.self === window.top && !new URLSearchParams(location.search).has('embed')) return;
  if (_psRaf) return;
  _psRaf = requestAnimationFrame(function(){
    _psRaf = null;
    try { parent.postMessage({ type: 'tcscan-resize', h: document.body.scrollHeight }, '*'); } catch(e){}
  });
}
window.addEventListener('load', postSize);

function render(){
  if(!data) return;
  renderSummary();
  document.getElementById('panelBUY').innerHTML = renderPanel('BUY');
  document.getElementById('panelSELL').innerHTML = renderPanel('SELL');
  selectTab(currentSide);
  document.getElementById('footerRefresh').textContent = 'Last refreshed ' + new Date().toLocaleTimeString('en-IN',{hour12:false});
  postSize();
}

async function load(silent){
  if(!silent){
    ['panelBUY','panelSELL'].forEach(id=>{
      document.getElementById(id).innerHTML = '<div class="empty" style="padding:40px">Loading…</div>';
    });
  }
  try{
    /* cc#1229: THE SAME ENDPOINT /check Future Scans calls, unextended. Everything this page
       shows - score100, the bucket bar, the gate results, rank in bucket, would_qualify - is
       computed there by tc_scanner_config.annotate(). Pointing a second surface at the identical
       call is what makes "same symbol, same number on both pages" true by construction rather
       than by a check somebody has to remember to run. */
    const r = await fetchWithTimeout('/api/trade-check/v4/scan?side=ALL&limit=250');
    if(!r.ok){ if(!silent) console.error('TC Scanner', r.status); return; }
    data = await r.json();
    render();
  }catch(e){ if(!silent) console.error('TC Scanner error', e); }
}

  const table = `

      </tr></thead><tbody>
        ${openRows||`<tr><td colspan="8" class="empty">No ORB AG signals today &middot; scans continuously, 10:00-15:20 IST</td></tr>`}
      </tbody></table>
    </div>
    <div class="mob-cards">${rows.length?openMob:'<div class="empty">No ORB AG signals today</div>'}</div>`;
  return summary + table;
}

async function loadOrb(silent){
  if(!silent && currentSide==='ORB'){
    document.getElementById('panelORB').innerHTML = '<div class="empty" style="padding:40px">Loading…</div>';
  }
  try{
    const r1 = await fetchWithTimeout('/api/scanners/orb_ag');   // triggers a fresh scan + records qualifiers
    if(!r1.ok){ if(!silent) console.error('ORB AG scan', r1.status); return; }
    const scan = await r1.json();
    if(scan.status === 'outside_window'){
      orbData = { status: 'outside_window', rows: [] };
    } else {
      const r2 = await fetchWithTimeout('/api/scanners/intraday/watchlist?direction=LONG&basket=orb_ag');
      if(!r2.ok){ if(!silent) console.error('ORB AG watchlist', r2.status); return; }
      const wl = await r2.json();
      orbData = { status: 'ok', rows: wl.rows || [] };
    }
    if(currentSide==='ORB') document.getElementById('panelORB').innerHTML = renderOrbPanel();
  }catch(e){ if(!silent) console.error('ORB AG error', e); }
}

// ── cc#772: RESULT RADAR — pre-results OI-positioning observation study ─────────
let radarData = null;
function _rrChip(r){
  const c = r.tag==='WASHED OUT' ? 'var(--grn)' : r.tag==='CROWDED' ? 'var(--red)' : 'var(--mut)';
  const bg = r.tag==='WASHED OUT' ? 'rgba(47,212,139,.14)' : r.tag==='CROWDED' ? 'rgba(240,80,80,.14)' : 'rgba(148,166,210,.14)';
  return `<span style="font-weight:700;font-size:11px;color:${c};background:${bg};border:1px solid ${c};border-radius:5px;padding:2px 7px;white-space:nowrap">${r.tag}</span>`;
}
function _rrGrade(r){
  if(r.direction==null) return '<span style="color:var(--dim)">—</span>';
  if(r.full_signal) return '<span style="font-weight:700;font-size:10px;color:var(--grn);background:rgba(47,212,139,.14);border:1px solid var(--grn);border-radius:5px;padding:2px 6px">FULL SIGNAL</span>';
  return (r.badges||[]).map(b=>`<span style="font-size:10px;color:var(--amber, #c98a12);background:rgba(245,185,74,.16);border:1px solid rgba(245,185,74,.5);border-radius:5px;padding:2px 6px;margin-right:3px;white-space:nowrap">${b}</span>`).join('');
}
function _rrOI(v){ return v!=null ? (Number(v)>=0?'+':'')+Number(v).toLocaleString('en-IN') : '—'; }
function renderRadarPanel(){
  if(!radarData) return '<div class="empty" style="padding:40px">Loading…</div>';
  if(radarData.status==='error') return `<div class="empty" style="padding:40px">Result Radar unavailable: ${radarData.error||''}</div>`;
  const rows = radarData.rows || [];
  const head = `<div class="ptitle" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">Result Radar
      <span class="ct">${rows.length} F&amp;O reporter${rows.length===1?'':'s'} on ${radarData.result_date||'—'} · as of ${radarData.as_of||''}</span>
      <button onclick="openRadarRules()" style="margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cyan);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;cursor:pointer">RULES</button></div>
    <div style="font-size:11px;color:var(--dim);margin:2px 0 8px">${radarData.disclaimer||''}</div>`;
  const trs = rows.map(r=>`<tr>
    <td class="sym">${r.symbol}</td><td>${_rrChip(r)}</td>
    <td class="${r.oi_chg_day!=null?cls(r.oi_chg_day):''}">${_rrOI(r.oi_chg_day)}</td>
    <td class="${r.price_move_t1!=null?cls(r.price_move_t1):''}">${pct(r.price_move_t1)}</td>
    <td>${r.vol_vs_20d!=null?Number(r.vol_vs_20d).toFixed(2)+'×':'—'}</td>
    <td>${num(r.mrsi,1)}</td>
    <td class="${r.ret_1m!=null?cls(r.ret_1m):''}">${pct(r.ret_1m,1)}</td>
    <td class="${r.ret_3m!=null?cls(r.ret_3m):''}">${pct(r.ret_3m,1)}</td>
    <td>${_rrGrade(r)}</td></tr>`).join('');
  const table = `<div class="scroll desktop-tbl"><table><thead><tr>
      <th>Symbol</th><th>Tag</th><th>OI Δ (T-1)</th><th>Move% (T-1)</th><th>Vol×20d</th><th>mRSI</th><th>1M</th><th>3M</th><th>Grade</th>
    </tr></thead><tbody>${trs||`<tr><td colspan="9" class="empty">No F&amp;O stocks reporting the next trading day yet · card populates after 15:00 IST</td></tr>`}</tbody></table></div>
    <div class="mob-cards">${rows.map(r=>`<div class="mob-card"><div class="mob-card-head"><span class="mob-sym">${r.symbol}</span>${_rrChip(r)}</div>
      <div class="mob-chips"><span class="mob-chip ${r.oi_chg_day!=null?cls(r.oi_chg_day):''}">OI ${_rrOI(r.oi_chg_day)}</span>
      <span class="mob-chip ${r.price_move_t1!=null?cls(r.price_move_t1):''}">Move ${pct(r.price_move_t1)}</span>
      <span class="mob-chip">Vol ${r.vol_vs_20d!=null?Number(r.vol_vs_20d).toFixed(2)+'×':'—'}</span>
      <span class="mob-chip">mRSI ${num(r.mrsi,1)}</span></div>
      <div style="margin-top:6px">${_rrGrade(r)}</div></div>`).join('')||'<div class="empty">No reporters next trading day</div>'}</div>`;
  return head + table;
}
async function loadRadar(silent){
  if(!silent && currentSide==='RADAR') document.getElementById('panelRADAR').innerHTML='<div class="empty" style="padding:40px">Loading…</div>';

async function openRadarRules(){

async function openStrategies(){
  document.getElementById('stratOv').classList.add('open');
  const body=document.getElementById('stratBody'); body.innerHTML='Loading…';
  try{
    const s = await (await fetchWithTimeout('/api/scanners/registry')).json();
    body.innerHTML = (s.strategies||[]).map(x=>{
      const here = (x.url==='/scanners' && x.tab);
      const act = here ? `onclick="closeStrat();selectTab('${x.tab}')"` : `onclick="location.href='${x.url}'"`;
      /* cc#1170: a strategy may carry a STATE, and the menu has to show it or the field is
         decoration. A silent engine still opens — its ledger is history worth reading — so the row
         stays clickable and is dimmed and badged rather than removed. Removing it would read as
         deleted, which is not what happened. Any future state renders the same way; nothing here
         is spelled V14. */
      const st = x.state ? `<span style="font-size:9px;font-weight:800;letter-spacing:.08em;
        color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 5px;
        margin-left:7px;vertical-align:middle">${x.state}</span>` : '';
      return `<div ${act} style="padding:10px 12px;border-top:1px solid var(--line);cursor:pointer${x.state?';opacity:.72':''}">
        <div style="font-weight:700">${x.label}${st}${here?' <span style="font-size:10px;color:var(--dim)">(this page)</span>':''}</div>
        <div style="font-size:11.5px;color:var(--dim);margin-top:2px">${x.desc}</div></div>`;
    }).join('');
  }catch(e){ body.innerHTML='<span style="color:var(--red)">Registry unavailable</span>'; }
}
function closeStrat(){ document.getElementById('stratOv').classList.remove('open'); }
