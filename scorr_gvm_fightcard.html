<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorr · GVM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<!-- APP_QA_R4 P5: the same two shared assets P3/P4 link. -->
<link rel="stylesheet" href="/static/scorr_themes.css">
<link rel="stylesheet" href="/static/scorr_appshell.css">
<style>
  :root{--field:#0D1322;--panel:#161F33;--panel-hi:#1C2740;--edge:#26334F;--chalk:#EAF0FA;--muted:#8A97B0;
    --volt:#C8F542;--heat:#FF4D6D;--pulse:#7C5CFF;--cut:16px;--g:#C8F542;--v:#4DD8FF;--m:#FF9F45}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--field, #070B14)}
  body{font-family:'Space Grotesk',sans-serif;color:var(--chalk)}
  .phone{max-width:480px;margin:0 auto;background:var(--field);min-height:100vh;padding-bottom:80px;
    background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px)}
  .num{font-family:'JetBrains Mono',monospace}
  .up{color:var(--volt)}.dn{color:var(--heat)}
  /* cc#1090 P3 · THE SEVEN .card BLOCKS NOW CARRY .slab. This rule is LEFT AS IT STANDS on
     purpose. The shell's ruling-1 override — :root:root:not([data-theme="light"]) .slab, (0,3,0) —
     beats this (0,1,0) rule whatever the source order, so it takes the clip-path off, squares the
     radius to 13px and repaints the face. Deleting the cut here instead would strip it from any
     future block that does NOT take the shell, and the ruling was explicit that it is not a
     licence to do that. The margins survive: .slab sets no margin, so 0 14px 12px still applies.
     Padding does move, 16px -> 13px 15px, which is the shell's own face and now matches every
     other slab in the app. */
  .card{background:var(--panel);border:1px solid var(--edge);margin:0 14px 12px;padding:16px;
    clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
  .eyebrow{display:flex;align-items:center;gap:10px;margin:20px 18px 10px;font-size:11px;font-weight:700;letter-spacing:2.5px;color:var(--muted)}
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
  .skew{font-family:'Archivo Black';transform:skewX(-6deg);text-transform:uppercase;display:inline-block;transform-origin:left center}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .sym{font-family:'Archivo Black';font-size:26px;transform:skewX(-6deg);letter-spacing:.5px}
  .cname{font-size:12px;color:var(--muted);margin-top:2px}
  .verdict{font-family:'JetBrains Mono';font-size:11px;font-weight:800;letter-spacing:1.5px;color:#0D1322;background:var(--volt);
    padding:6px 12px;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);white-space:nowrap}
  .price-row{display:flex;gap:14px;margin-top:10px;font-family:'JetBrains Mono';font-size:13px;flex-wrap:wrap}
  .price-row .lbl{color:var(--muted);font-size:10px;letter-spacing:1px;display:block}
  .gvm-big{display:flex;align-items:flex-end;gap:16px;margin-top:16px}
  .gvm-num{font-family:'Archivo Black';font-size:80px;line-height:.85;transform:skewX(-6deg);color:var(--volt)}
  .badge{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1px;border:1px solid var(--edge);
    background:var(--panel-hi);padding:5px 9px;display:inline-block;margin:0 4px 5px 0;
    clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
  .badge b{color:var(--volt)}
  .pillars{display:flex;gap:10px;margin-top:16px}
  .pillar{flex:1;background:var(--panel-hi);border:1px solid var(--edge);padding:10px;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
  .pillar .tag{font-family:'Archivo Black';font-size:13px;transform:skewX(-6deg)}
  .pillar .sc{font-family:'JetBrains Mono';font-weight:800;font-size:18px;margin:4px 0 7px}
  .bar{height:6px;background:var(--panel, #0E1526);overflow:hidden;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 100%,0 100%)}
  .bar i{display:block;height:100%}
  .p-g .tag,.p-g .sc{color:var(--g)}.p-g .bar i{background:var(--g)}
  .p-v .tag,.p-v .sc{color:var(--v)}.p-v .bar i{background:var(--v)}
  .p-m .tag,.p-m .sc{color:var(--m)}.p-m .bar i{background:var(--m)}
  .punch{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:14px}
  .punch b{color:var(--chalk)}
  .grp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
  .grp-head h3{font-family:'Archivo Black';font-size:15px;transform:skewX(-6deg);letter-spacing:.5px}
  .grp-head .pill-note{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:1px;text-align:right}
  .mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
  .mrow:first-of-type{border-top:none}
  .mrow .name{flex:1.4;font-size:12.5px}
  .mrow .duel{flex:1.6}
  .duel .vals{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:11.5px;font-weight:600}
  .duel .vals .peer{color:var(--muted)}
  .duel .track{height:4px;background:var(--panel, #0E1526);margin-top:4px;position:relative}
  .duel .track i{position:absolute;top:0;bottom:0;left:0}
  .rk{font-family:'JetBrains Mono';font-size:10px;font-weight:800;min-width:34px;text-align:right}
  .rk.top{color:var(--volt)}.rk.low{color:var(--heat)}.rk.mid{color:var(--muted)}
  .sets{display:flex;flex-wrap:wrap;gap:8px}
  .set{font-family:'JetBrains Mono';font-size:11px;font-weight:600;padding:8px 11px;border:1px solid;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
  .set.w{border-color:var(--volt, #3E5A18);background:#18240E;color:var(--volt)}
  .set.l{border-color:#5A2634;background:var(--field, #241019);color:var(--heat, #FF8FA5)}
  .set.na{border-color:var(--edge);background:var(--panel-hi);color:var(--muted)}
  .set b{margin-right:6px;font-weight:800}
  .lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge);font-size:12.5px}
  .lrow:first-of-type{border-top:none}
  .lrow .r{font-family:'JetBrains Mono';font-size:11px;width:22px;color:var(--muted);font-weight:700}
  .lrow .s{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .lbar{flex:1.2;height:5px;background:var(--panel, #0E1526)}
  .lrow .lbar i{display:block;height:100%;background:var(--muted)}
  .lrow .gv{font-family:'JetBrains Mono';font-weight:800;font-size:12.5px;width:40px;text-align:right}
  .lrow.self{background:linear-gradient(90deg,rgba(200,245,66,.08),transparent);margin:0 -16px;padding:8px 16px}
  .lrow.self .s,.lrow.self .gv{color:var(--volt)}
  .lrow.self .lbar i{background:var(--volt)}
  .range{margin-top:6px}
  .range .track{height:6px;background:var(--panel, #0E1526);position:relative;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 100%,0 100%)}
  .range .track i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,var(--heat),var(--m),var(--volt))}
  .range .dotp{position:absolute;top:-4px;width:3px;height:14px;background:var(--chalk)}
  .range .ends{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:10px;color:var(--muted);margin-top:6px}
  .vitals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .vital{background:var(--panel-hi);border:1px solid var(--edge);padding:9px;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
  .vital .lbl{font-size:9.5px;letter-spacing:1.2px;color:var(--muted)}
  .vital .val{font-family:'JetBrains Mono';font-weight:800;font-size:14px;margin-top:4px}
  .vital .sub{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);margin-top:2px}
  .story{font-size:13px;line-height:1.55;color:var(--muted)}
  .story b{color:var(--chalk)}
  .foot{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:.6px;margin:6px 18px 20px}
  .navail{font-size:11.5px;color:var(--muted);font-style:italic;padding:6px 0}
  .trend{display:flex;align-items:center;gap:12px;margin-top:14px}
  .trend svg{flex:1;height:38px}
  .trend .lbl{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:1px}
  #load{padding:40px 20px;text-align:center;color:var(--muted);font-family:'JetBrains Mono';font-size:12px}
  .searchbar{display:flex;gap:8px;margin:14px}
  .searchbar input{flex:1;background:var(--panel);border:1px solid var(--edge);color:var(--chalk);
    padding:10px 12px;font-family:'JetBrains Mono';font-size:14px;text-transform:uppercase}
  .searchbar button{background:var(--pulse);color:#fff;border:none;padding:10px 16px;font-weight:700;
    font-family:'Space Grotesk';clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
</style>
</head>
<body data-theme="goldnight" class="as-shell">
<!-- APP_QA_R5 P6 (was R4 P5): goldnight FORCED this sprint; stored theme read and kept, not applied. Original note: stored theme applied as the first statement inside <body>, before paint. -->
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){/* preserved, not applied while the sprint gate stands */}}catch(e){}
document.body.setAttribute('data-theme','goldnight');})();</script>
<div class="phone">
<!-- APP_QA_R4 P5 · SHELL VARIANT B (section page), ref design_refs/scorr_appshell_R1.html @ a20ae0d.
     gvm2 IS a section, so the GVM tab lights volt (ref rule 3) — unlike the two tool pages. The
     status slot is left empty here rather than invented: the score lives inside the card the page
     builds, and the shell defines the slot without deciding what fills it (ref rule 6). Rule 5
     holds — the search bar, loader and #page are exactly as they were. -->
<div class="as-hdr">
  <a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a>
  <div class="as-pg"><span class="t">GVM &middot; Fight Card</span>
    <div class="s">PEER-BENCHMARKED</div></div>
  <div class="as-slot"></div>
</div>
  <div class="searchbar">
    <input id="symin" placeholder="SYMBOL e.g. KARURVYSYA" autocomplete="off" spellcheck="false">
    <button onclick="go()">GO</button>
  </div>
  <div id="load">LOADING GVM…</div>
  <div id="page" style="display:none"></div>
</div>
<script>
'use strict';
/* cc#1065 v2 — keys mapped from the REAL /api/gvm/company payload (read 21:48 IST, KARURVYSYA).
   benchmark = ARRAY of param objects; trend/percentile/tier1/pivot/volume/delivery/segment_ctx
   under extras; financials.quarterly + shareholding for the charts. Absent -> omitted/dash, never 0. */
var E = function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function g(o){ var v=o; for(var i=1;i<arguments.length;i++){ if(v==null||typeof v!=='object')return null; v=v[arguments[i]]; } return (v===''?null:v); }
function fnum(v,dp){ if(v==null||isNaN(Number(v)))return null; return Number(v).toLocaleString('en-IN',{minimumFractionDigits:dp==null?2:dp,maximumFractionDigits:dp==null?2:dp}); }
function withUnit(v,u){ if(v==null)return '—'; var n=Number(v); var s=(u==='%'||u==='x')?(Math.abs(n)>=100?fnum(n,0):fnum(n,Math.abs(n)<10?2:1)):fnum(n,2); return s+(u||''); }
function sect(title,inner){ return inner?'<div class="eyebrow">'+E(title)+'</div><div class="card slab">'+inner+'</div>':''; }
function na(w){ return '<div class="navail">'+E(w)+' unavailable — flag to Fable</div>'; }
function spark(vals,color){
  var vs=vals.map(Number).filter(function(x){return !isNaN(x)});
  if(vs.length<2)return '';
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs); if(hi===lo){hi+=1;lo-=1;}
  var pts=vs.map(function(v,i){return (i*200/(vs.length-1)).toFixed(0)+','+(36-(v-lo)/(hi-lo)*32).toFixed(1)}).join(' ');
  var last=pts.split(' ').pop().split(',');
  return '<svg viewBox="0 0 200 38" preserveAspectRatio="none"><polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="'+color+'"/></svg>';
}
var PCOLOR={G:'var(--g)',V:'var(--v)',M:'var(--m)'};

function duelRowP(p){
  var n=p.peer_n||12, rank=p.rank;
  var frac=(rank&&n)?Math.max(.15,(n-rank+1)/n):.5;
  var cls=(rank&&n)?(rank<=3?'top':(rank>=n-2?'low':'mid')):'mid';
  var bar=(rank&&n&&rank<=Math.ceil(n*0.6))?PCOLOR[p.pillar]||'var(--g)':'var(--muted)';
  var u=p.unit||'';
  var cv=p.company==null?'—':withUnit(p.company,u), mv=p.peer_median==null?'—':withUnit(p.peer_median,u);
  var beat=p.beats_peer===true;
  return '<div class="mrow"><span class="name">'+E(p.label||p.key)+'</span><div class="duel">'
    +'<div class="vals"><span class="num'+(beat?' up':'')+'">'+E(cv)+'</span><span class="peer num">'+E(mv)+'</span></div>'
    +'<div class="track"><i style="width:'+Math.round(frac*100)+'%;background:'+bar+'"></i></div></div>'
    +'<span class="rk '+cls+' num">'+(rank?'#'+rank:'—')+'</span></div>';
}

function render(d,sym){
  var h='';
  var scores=g(d,'scores')||{};
  if(scores.gvm==null){
    return '<div class="card slab"><div class="sym">'+E(sym)+'</div>'
      +'<div class="punch" style="margin-top:10px"><b>Not scored / symbol not found.</b> Check the symbol spelling — GVM covers 1,787 scored stocks. Try e.g. KARURVYSYA, RELIANCE, HDFCBANK.</div></div>';
  }
  var x=g(d,'extras')||{};
  var pct=g(x,'percentile')||{};
  /* HERO */
  h+='<div class="card slab hero"><div class="hero-top"><div>'
    +'<div class="sym">'+E(d.symbol||sym)+'</div>'
    +'<div class="cname">'+E(d.company_name||'')+(d.segment?' · '+E(d.segment):'')+'</div></div>'
    +(d.verdict?'<div class="verdict">'+E(String(d.verdict).toUpperCase())+'</div>':'')+'</div>'
    +'<div class="price-row num">'
    +(d.price!=null?'<span><span class="lbl">'+E((d.price_label||'LAST').toUpperCase())+'</span>₹'+fnum(d.price,2)+'</span>':'')
    +(d.market_cap!=null?'<span><span class="lbl">MCAP</span>₹'+fnum(d.market_cap,0)+' Cr</span>':'')
    +(d.score_date?'<span><span class="lbl">SCORED</span>'+E(d.score_date)+'</span>':'')+'</div>'
    +'<div class="gvm-big"><div class="gvm-num num">'+fnum(scores.gvm,2)+'</div><div class="gvm-meta">'
    +((d.segment_rank&&d.segment_total)?'<span class="badge"><b>#'+d.segment_rank+'</b> OF '+d.segment_total+' · '+E(String(d.segment||'').toUpperCase())+'</span><br>':'')
    +((pct.universe_rank&&pct.universe_total)?'<span class="badge">TOP <b>'+fnum(pct.top_pct,1)+'%</b> OF '+fnum(pct.universe_total,0)+'</span>':'')
    +(pct.z_score!=null?'<span class="badge">Z <b>'+(pct.z_score>=0?'+':'')+fnum(pct.z_score,2)+'</b></span>':'')
    +'</div></div>'
    +'<div class="pillars">'
    +'<div class="pillar well p-g"><div class="tag">GROWTH</div><div class="sc num">'+fnum(scores.g,2)+'</div><div class="bar"><i style="width:'+Math.min(100,scores.g*10)+'%"></i></div></div>'
    +'<div class="pillar well p-v"><div class="tag">VALUE</div><div class="sc num">'+fnum(scores.v,2)+'</div><div class="bar"><i style="width:'+Math.min(100,scores.v*10)+'%"></i></div></div>'
    +'<div class="pillar well p-m"><div class="tag">MOMENTUM</div><div class="sc num">'+fnum(scores.m,2)+'</div><div class="bar"><i style="width:'+Math.min(100,scores.m*10)+'%"></i></div></div></div>';
  var trend=g(x,'trend');
  if(Array.isArray(trend)&&trend.length>1){
    var sp=spark(trend.map(function(r){return r.gvm}),'#C8F542');
    if(sp)h+='<div class="trend">'+sp+'<span class="lbl">GVM · '+trend.length+' SESSIONS</span></div>';
  }
  if(d.punchline)h+='<div class="punch"><b>'+E(d.punchline)+'</b></div>';
  h+='</div>';

  /* PILLARS from benchmark ARRAY */
  var bench=Array.isArray(d.benchmark)?d.benchmark:[];
  var byP={G:[],V:[],M:[]}, histPe=null;
  bench.forEach(function(p){
    if(!p||p.excluded)return;
    if(p.key==='hist_pe'){histPe=p;}
    if(p.company==null&&p.peer_median==null)return;
    (byP[p.pillar]||(byP[p.pillar]=[])).push(duelRowP(p));
  });
  function pcard(letter,label,score,rows,extra){
    if(!rows.length)return sect('PILLAR '+letter,na('parameters'));
    return '<div class="card slab"><div class="grp-head"><h3 class="skew" style="color:'+PCOLOR[letter]+'">'+label+' · '+fnum(score,2)+'</h3>'
      +'<span class="pill-note">'+(letter==='V'?'LOWER = CHEAPER':letter==='M'?'PRICE IS THE PROOF':'RANK OF '+ (d.segment_total||'PEERS'))+'</span></div>'
      +rows.join('')+(extra||'')+'</div>';
  }
  /* PE re-rating chart from hist_pe.pe_trend */
  var peExtra='';
  if(histPe&&Array.isArray(histPe.pe_trend)&&histPe.pe_trend.length>1){
    var pes=histPe.pe_trend.map(function(r){return r.pe});
    var med=histPe.median_pe, cur=histPe.current_pe;
    var lo=Math.min.apply(null,pes.concat([med||pes[0]]))-.3, hi=Math.max.apply(null,pes.concat([cur||pes[0]]))+.3;
    var Y=function(v){return (38-(v-lo)/(hi-lo)*34).toFixed(1)};
    var pts=pes.map(function(v,i){return (i*200/(pes.length-1)).toFixed(0)+','+Y(v)}).join(' ');
    peExtra='<div class="trend" style="margin-top:12px"><svg viewBox="0 0 200 40" preserveAspectRatio="none">'
      +(med!=null?'<line x1="0" y1="'+Y(med)+'" x2="200" y2="'+Y(med)+'" stroke="#26334F" stroke-dasharray="3,3" stroke-width="1"/>':'')
      +'<polyline fill="none" stroke="#4DD8FF" stroke-width="2" points="'+pts+'"/>'
      +'<circle cx="200" cy="'+Y(pes[pes.length-1])+'" r="3" fill="#4DD8FF"/></svg>'
      +'<span class="lbl">PE · '+pes.length+' QTRS'+(med!=null?'<br>MEDIAN '+fnum(med,1)+'x':'')
      +(histPe.rerating_pct!=null?'<br>RE-RATING '+(histPe.rerating_pct>=0?'+':'')+fnum(histPe.rerating_pct,1)+'%':'')+'</span></div>';
  }
  h+='<div class="eyebrow">THE PILLARS · YOU vs PEER MEDIAN · RANK OF '+(d.segment_total||'PEERS')+'</div>';
  h+=pcard('G','Growth',scores.g,byP.G||[]);
  h+=pcard('V','Value',scores.v,byP.V||[],peExtra);
  h+=pcard('M','Momentum',scores.m,byP.M||[]);

  /* HIGHLIGHT REEL from positives/negatives param arrays */
  function reelPill(p,w){
    var txt=E((p.label||p.key||'').toUpperCase().slice(0,22))+(p.rank?' · #'+p.rank:'');
    return '<span class="set '+(w?'w':'l')+'"><b>'+(w?'W':'L')+'</b>'+txt+'</span>';
  }
  var pos=(d.positives||[]).slice(0,3).map(function(p){return reelPill(p,true)});
  var neg=(d.negatives||[]).slice(0,3).map(function(p){return reelPill(p,false)});
  if(pos.length||neg.length)h+=sect('HIGHLIGHT REEL','<div class="sets">'+pos.join('')+neg.join('')+'</div>');

  /* TAPE FORENSICS from extras */
  var tape='',vit='';
  var vol=g(x,'volume'),del=g(x,'delivery'),t1=g(x,'tier1'),r52=g(x,'range52'),piv=g(x,'pivot');
  if(vol&&(vol.verdict||vol.ratio!=null))vit+='<div class="vital well"><div class="lbl">SMART MONEY</div><div class="val '+(/ACC/i.test(vol.verdict||'')?'up':'dn')+'">'+E((vol.verdict||'—').slice(0,7))+'</div>'+(vol.ratio!=null?'<div class="sub">u/d vol '+fnum(vol.ratio,2)+'x</div>':'')+'</div>';
  if(del&&del.latest!=null)vit+='<div class="vital well"><div class="lbl">DELIVERY</div><div class="val num'+(del.avg!=null&&del.latest>del.avg?' up':'')+'">'+fnum(del.latest,1)+'%</div>'+(del.avg!=null?'<div class="sub">'+(del.days||30)+'d avg '+fnum(del.avg,1)+'%</div>':'')+'</div>';
  if(t1&&t1.passed!=null)vit+='<div class="vital well"><div class="lbl">TIER-1 GATE</div><div class="val num">'+t1.passed+'/'+(t1.total||7)+'</div></div>';
  if(vit)tape+='<div class="vitals">'+vit+'</div>';
  if(t1&&Array.isArray(t1.checks)&&t1.checks.length){
    tape+='<div class="sets" style="margin-top:14px">'+t1.checks.map(function(c){
      var p=(c.pass===true)?'w':(c.pass===false?'l':'na');
      return '<span class="set '+p+'"><b>'+(p==='w'?'W':p==='l'?'L':'—')+'</b>'+E((c.name||'').slice(0,28))+'</span>';}).join('')+'</div>';
  }
  if(r52&&r52.lo!=null&&r52.hi!=null&&d.price!=null){
    var pp2=Math.round(100*(d.price-r52.lo)/((r52.hi-r52.lo)||1));
    tape+='<div class="range" style="margin-top:14px"><div class="track"><i style="width:100%"></i><span class="dotp" style="left:'+Math.max(0,Math.min(100,pp2))+'%"></span></div>'
      +'<div class="ends"><span>52W LO ₹'+fnum(r52.lo,0)+'</span><span style="color:var(--chalk)">₹'+fnum(d.price,0)+' · '+pp2+'% OF RANGE</span><span>HI ₹'+fnum(r52.hi,0)+'</span></div></div>';
  }
  if(piv&&piv.pp!=null&&piv.s2!=null&&piv.r2!=null&&d.price!=null){
    var dp2=Math.max(0,Math.min(100,Math.round(100*(d.price-piv.s2)/((piv.r2-piv.s2)||1))));
    tape+='<div class="range" style="margin-top:16px"><div class="track" style="background:var(--panel, #0E1526)"><i style="width:100%;background:linear-gradient(90deg,var(--heat) 0 20%,transparent 20% 80%,var(--volt) 80% 100%)"></i><span class="dotp" style="left:'+dp2+'%"></span></div>'
      +'<div class="ends num"><span>S2 '+fnum(piv.s2,0)+' · S1 '+fnum(piv.s1,0)+'</span><span style="color:var(--chalk)">PP '+fnum(piv.pp,0)+'</span><span>R1 '+fnum(piv.r1,0)+' · R2 '+fnum(piv.r2,0)+'</span></div></div>';
  }
  if(tape)h+='<div class="eyebrow">TAPE FORENSICS</div><div class="card slab">'+tape+'</div>';

  /* LADDER */
  var lad=Array.isArray(d.ladder)?d.ladder:[];
  if(lad.length){
    var gmax=Math.max.apply(null,lad.map(function(p){return Number(p.gvm)||0}))||10;
    h+='<div class="eyebrow">THE LADDER · '+E(String(d.segment||'PEERS').toUpperCase())+' BY GVM</div><div class="card slab">'
      +lad.map(function(p){
        return '<div class="lrow'+(p.is_self?' self':'')+'"><span class="r num">'+(p.rank||'')+'</span><span class="s">'+E(p.symbol||'')+'</span>'
          +'<div class="lbar"><i style="width:'+Math.round((Number(p.gvm)||0)/gmax*100)+'%"></i></div><span class="gv num">'+(p.gvm!=null?fnum(p.gvm,2):'—')+'</span></div>';
      }).join('')+'</div>';
  }

  /* ARENA */
  var sc=g(x,'segment_ctx');
  if(sc){
    var inner='';
    if(sc.sector_rank!=null)inner+='<div class="vital well"><div class="lbl">SECTOR RANK</div><div class="val num">'+sc.sector_rank+(sc.sector_total?'/'+sc.sector_total:'')+'</div></div>';
    if(sc.mcap_wtd_gvm!=null)inner+='<div class="vital well"><div class="lbl">SECTOR GVM</div><div class="val num">'+fnum(sc.mcap_wtd_gvm,2)+'</div><div class="sub">mcap-weighted</div></div>';
    if(sc.stock_vs_sector!=null)inner+='<div class="vital well"><div class="lbl">VS SECTOR 1M</div><div class="val num '+(sc.stock_vs_sector>=0?'up':'dn')+'">'+(sc.stock_vs_sector>=0?'+':'')+fnum(sc.stock_vs_sector,1)+'pp</div></div>';
    if(inner){
      var line=(sc.month_return_avg!=null)?'<div class="punch" style="margin-top:12px">The sector returned '+(sc.month_return_avg>=0?'+':'')+fnum(sc.month_return_avg,1)+'% this month; this stock '+(sc.stock_vs_sector>=0?'leads':'lags')+' it by '+fnum(Math.abs(sc.stock_vs_sector),1)+'pp.</div>':'';
      h+=sect('THE ARENA · '+String(d.segment||'').toUpperCase()+' AS A SECTOR','<div class="vitals">'+inner+'</div>'+line);
    }
  }

  /* Q1 / RESULT — plain-words block from content.result_analysis */
  var ra=g(d,'content','result_analysis');
  if(ra)h+=sect('LATEST RESULT','<div class="story" style="white-space:pre-line;font-family:\'JetBrains Mono\',monospace;font-size:11.5px">'+E(ra)+'</div>');

  /* FINANCIALS: quarterly Net Profit bars + shareholding lines */
  var fq=g(d,'financials','quarterly'), fs=g(d,'financials','shareholding');
  var finH='';
  if(fq&&Array.isArray(fq.rows)){
    var npRow=fq.rows.filter(function(r){return r.label==='Net Profit'})[0];
    if(npRow&&Array.isArray(npRow.values)&&npRow.values.length){
      var nv=npRow.values.map(Number), mx=Math.max.apply(null,nv)||1, n2=nv.length, bw=Math.max(6,Math.floor(180/n2));
      var bars=nv.map(function(v,i){var hh=Math.max(1,(v/mx)*38); return '<rect x="'+(i*(200/n2)+1).toFixed(1)+'" y="'+(40-hh).toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" fill="#C8F542" opacity="'+(0.45+0.55*i/(n2-1)).toFixed(2)+'"/>'}).join('');
      finH+='<div class="grp-head"><h3 class="skew" style="color:var(--volt)">Net Profit ₹Cr</h3><span class="pill-note num">'+fnum(nv[0],0)+' → '+fnum(nv[n2-1],0)+' · '+n2+' QTRS</span></div>'
        +'<svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width:100%;height:56px">'+bars+'</svg>';
    }
  }
  if(fs&&Array.isArray(fs.rows)){
    function row(lbl){var r=fs.rows.filter(function(q){return q.label===lbl})[0];return r?r.values.map(Number):null;}
    var fii=row('FIIs'),dii=row('DIIs'),pub=row('Public');
    if(fii&&dii&&pub){
      function line2(s,c){var lo=0,hi=Math.max.apply(null,[].concat(fii,dii,pub))*1.05;
        var pts=s.map(function(v,i){return (i*200/(s.length-1)).toFixed(0)+','+(40-(v-lo)/(hi-lo)*36).toFixed(1)}).join(' ');
        return '<polyline fill="none" stroke="'+c+'" stroke-width="2" points="'+pts+'"/>';}
      finH+='<div class="grp-head" style="margin-top:16px"><h3 class="skew" style="font-size:14px">Who Owns It</h3>'
        +'<span class="pill-note"><span style="color:#4DD8FF">FII '+fnum(fii[fii.length-1],1)+'</span> · <span style="color:#C8F542">DII '+fnum(dii[dii.length-1],1)+'</span> · <span style="color:#FF9F45">PUBLIC '+fnum(pub[pub.length-1],1)+'</span></span></div>'
        +'<svg viewBox="0 0 200 40" preserveAspectRatio="none" style="width:100%;height:52px">'+line2(fii,'#4DD8FF')+line2(dii,'#C8F542')+line2(pub,'#FF9F45')+'</svg>';
    }
  }
  if(finH)h+='<div class="eyebrow">FINANCIALS</div><div class="card slab">'+finH+'</div>';

  /* STORY */
  var ov=g(d,'content','overview'), kt=g(d,'content','key_takeaway');
  if(ov||kt)h+=sect('THE STORY','<div class="story">'+(ov?E(ov)+' ':'')+(kt?'<b>The takeaway:</b> '+E(kt):'')+'</div>');

  h+='<div class="foot">GVM '+fnum(scores.gvm,2)+(d.score_date?' · scored '+E(d.score_date):'')+' · peers n='+(d.segment_total||'—')+' · research only, not investment advice</div>';
  return h;
}

function go(){
  var s=(document.getElementById('symin').value||'').trim().toUpperCase();
  if(s) location.search='?symbol='+encodeURIComponent(s);
}
document.getElementById('symin').addEventListener('keydown',function(e){if(e.key==='Enter')go();});

(function init(){
  var sym=(new URLSearchParams(location.search).get('symbol')||'').toUpperCase().trim();
  if(!sym){ document.getElementById('load').textContent='ENTER A SYMBOL ABOVE'; return; }
  document.getElementById('symin').value=sym;
  fetch('/api/gvm/company/'+encodeURIComponent(sym),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d||d.error){ document.getElementById('load').textContent='COULD NOT LOAD: '+((d&&d.error)||'no payload'); return; }
      var root=d.data||d.report||d;
      document.getElementById('page').innerHTML=render(root,sym);
      document.getElementById('load').style.display='none';
      document.getElementById('page').style.display='block';
    })
    .catch(function(e){ document.getElementById('load').textContent='COULD NOT LOAD: '+e; });
})();
</script>
