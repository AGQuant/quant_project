<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorr · GVM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--field:#0D1322;--panel:#161F33;--panel-hi:#1C2740;--edge:#26334F;--chalk:#EAF0FA;--muted:#8A97B0;
    --volt:#C8F542;--heat:#FF4D6D;--pulse:#7C5CFF;--cut:16px;--g:#C8F542;--v:#4DD8FF;--m:#FF9F45}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#070B14}
  body{font-family:'Space Grotesk',sans-serif;color:var(--chalk)}
  .phone{max-width:480px;margin:0 auto;background:var(--field);min-height:100vh;padding-bottom:80px;
    background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px)}
  .num{font-family:'JetBrains Mono',monospace}
  .up{color:var(--volt)}.dn{color:var(--heat)}
  .card{background:var(--panel);border:1px solid var(--edge);margin:0 14px 12px;padding:16px;
    clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
  .eyebrow{display:flex;align-items:center;gap:10px;margin:20px 18px 10px;font-size:11px;font-weight:700;letter-spacing:2.5px;color:var(--muted)}
  .eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
  .skew{font-family:'Archivo Black';transform:skewX(-6deg);text-transform:uppercase;display:inline-block;transform-origin:left center}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .sym{font-family:'Archivo Black';font-size:26px;transform:skewX(-6deg);letter-spacing:.5px}
  .cname{font-size:12px;color:var(--muted);margin-top:2px}
  .verdict{font-family:'JetBrains Mono';font-size:11px;font-weight:800;letter-spacing:1.5px;color:#0D1322;background:var(--volt);
    padding:6px 12px;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);white-space:nowrap}
  .price-row{display:flex;gap:14px;margin-top:10px;font-family:'JetBrains Mono';font-size:13px;flex-wrap:wrap}
  .price-row .lbl{color:var(--muted);font-size:10px;letter-spacing:1px;display:block}
  .gvm-big{display:flex;align-items:flex-end;gap:16px;margin-top:16px}
  .gvm-num{font-family:'Archivo Black';font-size:80px;line-height:.85;transform:skewX(-6deg);color:var(--volt)}
  .badge{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1px;border:1px solid var(--edge);
    background:var(--panel-hi);padding:5px 9px;display:inline-block;margin:0 4px 5px 0;
    clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
  .badge b{color:var(--volt)}
  .pillars{display:flex;gap:10px;margin-top:16px}
  .pillar{flex:1;background:var(--panel-hi);border:1px solid var(--edge);padding:10px;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
  .pillar .tag{font-family:'Archivo Black';font-size:13px;transform:skewX(-6deg)}
  .pillar .sc{font-family:'JetBrains Mono';font-weight:800;font-size:18px;margin:4px 0 7px}
  .bar{height:6px;background:#0E1526;overflow:hidden;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 100%,0 100%)}
  .bar i{display:block;height:100%}
  .p-g .tag,.p-g .sc{color:var(--g)}.p-g .bar i{background:var(--g)}
  .p-v .tag,.p-v .sc{color:var(--v)}.p-v .bar i{background:var(--v)}
  .p-m .tag,.p-m .sc{color:var(--m)}.p-m .bar i{background:var(--m)}
  .punch{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:14px}
  .punch b{color:var(--chalk)}
  .grp-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
  .grp-head h3{font-family:'Archivo Black';font-size:15px;transform:skewX(-6deg);letter-spacing:.5px}
  .grp-head .pill-note{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:1px;text-align:right}
  .mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
  .mrow:first-of-type{border-top:none}
  .mrow .name{flex:1.4;font-size:12.5px}
  .mrow .duel{flex:1.6}
  .duel .vals{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:11.5px;font-weight:600}
  .duel .vals .peer{color:var(--muted)}
  .duel .track{height:4px;background:#0E1526;margin-top:4px;position:relative}
  .duel .track i{position:absolute;top:0;bottom:0;left:0}
  .rk{font-family:'JetBrains Mono';font-size:10px;font-weight:800;min-width:34px;text-align:right}
  .rk.top{color:var(--volt)}.rk.low{color:var(--heat)}.rk.mid{color:var(--muted)}
  .sets{display:flex;flex-wrap:wrap;gap:8px}
  .set{font-family:'JetBrains Mono';font-size:11px;font-weight:600;padding:8px 11px;border:1px solid;
    clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
  .set.w{border-color:#3E5A18;background:#18240E;color:var(--volt)}
  .set.l{border-color:#5A2634;background:#241019;color:#FF8FA5}
  .set.na{border-color:var(--edge);background:var(--panel-hi);color:var(--muted)}
  .set b{margin-right:6px;font-weight:800}
  .lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--edge);font-size:12.5px}
  .lrow:first-of-type{border-top:none}
  .lrow .r{font-family:'JetBrains Mono';font-size:11px;width:22px;color:var(--muted);font-weight:700}
  .lrow .s{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .lbar{flex:1.2;height:5px;background:#0E1526}
  .lrow .lbar i{display:block;height:100%;background:var(--muted)}
  .lrow .gv{font-family:'JetBrains Mono';font-weight:800;font-size:12.5px;width:40px;text-align:right}
  .lrow.self{background:linear-gradient(90deg,rgba(200,245,66,.08),transparent);margin:0 -16px;padding:8px 16px}
  .lrow.self .s,.lrow.self .gv{color:var(--volt)}
  .lrow.self .lbar i{background:var(--volt)}
  .range{margin-top:6px}
  .range .track{height:6px;background:#0E1526;position:relative;clip-path:polygon(0 0,calc(100% - 5px) 0,100% 100%,0 100%)}
  .range .track i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,var(--heat),var(--m),var(--volt))}
  .range .dotp{position:absolute;top:-4px;width:3px;height:14px;background:var(--chalk)}
  .range .ends{display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-size:10px;color:var(--muted);margin-top:6px}
  .vitals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
  .vital{background:var(--panel-hi);border:1px solid var(--edge);padding:9px;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
  .vital .lbl{font-size:9.5px;letter-spacing:1.2px;color:var(--muted)}
  .vital .val{font-family:'JetBrains Mono';font-weight:800;font-size:14px;margin-top:4px}
  .vital .sub{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);margin-top:2px}
  .story{font-size:13px;line-height:1.55;color:var(--muted)}
  .story b{color:var(--chalk)}
  .foot{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:.6px;margin:6px 18px 20px}
  .navail{font-size:11.5px;color:var(--muted);font-style:italic;padding:6px 0}
  .trend{display:flex;align-items:center;gap:12px;margin-top:14px}
  .trend svg{flex:1;height:38px}
  .trend .lbl{font-family:'JetBrains Mono';font-size:10px;color:var(--muted);letter-spacing:1px}
  #load{padding:40px 20px;text-align:center;color:var(--muted);font-family:'JetBrains Mono';font-size:12px}
  .searchbar{display:flex;gap:8px;margin:14px}
  .searchbar input{flex:1;background:var(--panel);border:1px solid var(--edge);color:var(--chalk);
    padding:10px 12px;font-family:'JetBrains Mono';font-size:14px;text-transform:uppercase}
  .searchbar button{background:var(--pulse);color:#fff;border:none;padding:10px 16px;font-weight:700;
    font-family:'Space Grotesk';clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
</style>
</head>
<body>
<div class="phone">
  <div class="searchbar">
    <input id="symin" placeholder="SYMBOL e.g. KARURVYSYA" autocomplete="off" spellcheck="false">
    <button onclick="go()">GO</button>
  </div>
  <div id="load">LOADING GVM…</div>
  <div id="page" style="display:none"></div>
</div>
<script>
'use strict';
/* cc#1065 — live GVM fight card. DATA-HONESTY CONTRACT:
   pick() probes several plausible key spellings; a value that is absent renders as an explicit
   unavailable line or the section is omitted — NEVER a zero, NEVER an invented number. */
var E = function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function pick(o){ for(var i=1;i<arguments.length;i++){ var path=arguments[i].split('.'),v=o,ok=true;
  for(var j=0;j<path.length;j++){ if(v==null||typeof v!=='object'||!(path[j] in v)){ok=false;break;} v=v[path[j]]; }
  if(ok&&v!=null&&v!=='') return v; } return null; }
function fnum(v,dp){ if(v==null||isNaN(Number(v)))return null; return Number(v).toLocaleString('en-IN',{minimumFractionDigits:dp==null?2:dp,maximumFractionDigits:dp==null?2:dp}); }
function sect(title,inner){ return inner?'<div class="eyebrow">'+E(title)+'</div><div class="card">'+inner+'</div>':''; }
function na(what){ return '<div class="navail">'+E(what)+' unavailable in payload — flag to Fable</div>'; }

function duelRow(name, cv, mv, rank, n, color){
  var frac = (rank&&n)? Math.max(.15,(n-rank+1)/n) : .5;
  var cls = (rank&&n)? (rank<=3?'top':(rank>=n-2?'low':'mid')) : 'mid';
  var bar = (rank&&n&&rank<=Math.ceil(n*0.66))?color:'var(--muted)';
  return '<div class="mrow"><span class="name">'+E(name)+'</span><div class="duel">'
    +'<div class="vals"><span class="num">'+E(cv==null?'—':cv)+'</span><span class="peer num">'+E(mv==null?'—':mv)+'</span></div>'
    +'<div class="track"><i style="width:'+Math.round(frac*100)+'%;background:'+bar+'"></i></div></div>'
    +'<span class="rk '+cls+' num">'+(rank?'#'+rank:'—')+'</span></div>';
}
function spark(series, color){
  if(!series||series.length<2) return '';
  var vs=series.map(Number).filter(function(x){return !isNaN(x)});
  if(vs.length<2) return '';
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs); if(hi===lo){hi+=1;lo-=1;}
  var pts=vs.map(function(v,i){return (i*200/(vs.length-1)).toFixed(0)+','+(36-(v-lo)/(hi-lo)*32).toFixed(1)}).join(' ');
  var last=pts.split(' ').pop().split(',');
  return '<svg viewBox="0 0 200 38" preserveAspectRatio="none"><polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+pts+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3" fill="'+color+'"/></svg>';
}

function render(d, sym){
  var h='';
  /* HERO */
  var name=pick(d,'name','company','company_name','header.name')||sym;
  var seg=pick(d,'segment','header.segment','sector')||'';
  var verdict=pick(d,'verdict','rating','header.verdict','rating_label');
  var price=pick(d,'price','cmp','last_price','header.price');
  var mcap=pick(d,'mcap','market_cap','mcap_cr','header.mcap');
  var asof=pick(d,'score_date','as_of','header.score_date','date');
  var gvm=pick(d,'scores.gvm','gvm','gvm_score','scores.total');
  var g=pick(d,'scores.g','g','scores.growth'), v=pick(d,'scores.v','v','scores.value'), m=pick(d,'scores.m','m','scores.momentum');
  var segrank=pick(d,'segment_rank','rank.segment','seg_rank'), segn=pick(d,'segment_count','rank.segment_of','peers_count','n_peers');
  var urank=pick(d,'universe_rank','rank.universe'), un=pick(d,'universe_count','rank.universe_of');
  var z=pick(d,'z','zscore','z_score','percentile_z');
  var punch=pick(d,'punchline','header.punchline','summary_line');
  h+='<div class="card"><div class="hero-top"><div><div class="sym">'+E(sym)+'</div><div class="cname">'+E(name)+(seg?' · '+E(seg):'')+'</div></div>'
    +(verdict?'<div class="verdict">'+E(String(verdict).toUpperCase())+'</div>':'')+'</div>'
    +'<div class="price-row num">'
    +(price!=null?'<span><span class="lbl">LAST</span>₹'+fnum(price,2)+'</span>':'')
    +(mcap!=null?'<span><span class="lbl">MCAP</span>₹'+fnum(mcap,0)+' Cr</span>':'')
    +(asof?'<span><span class="lbl">AS OF</span>'+E(asof)+'</span>':'')+'</div>'
    +(gvm!=null?'<div class="gvm-big"><div class="gvm-num num">'+fnum(gvm,2)+'</div><div>'
      +((segrank&&segn)?'<span class="badge"><b>#'+segrank+'</b> OF '+segn+(seg?' · '+E(String(seg).toUpperCase()):'')+'</span><br>':'')
      +((urank&&un)?'<span class="badge">RANK <b>'+urank+'</b> OF '+fnum(un,0)+'</span>':'')
      +(z!=null?'<span class="badge">Z <b>'+(z>=0?'+':'')+fnum(z,2)+'</b></span>':'')+'</div></div>':na('GVM score'))
    +((g!=null&&v!=null&&m!=null)?'<div class="pillars">'
      +'<div class="pillar p-g"><div class="tag">GROWTH</div><div class="sc num">'+fnum(g,2)+'</div><div class="bar"><i style="width:'+Math.min(100,g*10)+'%"></i></div></div>'
      +'<div class="pillar p-v"><div class="tag">VALUE</div><div class="sc num">'+fnum(v,2)+'</div><div class="bar"><i style="width:'+Math.min(100,v*10)+'%"></i></div></div>'
      +'<div class="pillar p-m"><div class="tag">MOMENTUM</div><div class="sc num">'+fnum(m,2)+'</div><div class="bar"><i style="width:'+Math.min(100,m*10)+'%"></i></div></div></div>':'')
  ;
  var trend=pick(d,'trend','gvm_trend','trend_series','history');
  if(Array.isArray(trend)&&trend.length){
    var series=trend.map(function(x){return (x&&typeof x==='object')?(x.gvm!=null?x.gvm:(x.v!=null?x.v:x.score)):x});
    var sp=spark(series,'#C8F542');
    if(sp) h+='<div class="trend">'+sp+'<span class="lbl">GVM · '+series.length+' SESSIONS</span></div>';
  }
  if(punch) h+='<div class="punch"><b>'+E(punch)+'</b></div>';
  h+='</div>';

  /* PILLAR PARAMETER DUELS */
  var params=pick(d,'benchmark','parameters','benchmark_params','params');
  var groups={G:[],V:[],M:[]};
  if(params&&typeof params==='object'){
    var GK={sales_5y:'Sales 5Y CAGR',sales_3y:'Sales 3Y CAGR',profit_5y:'Profit 5Y CAGR',profit_3y:'Profit 3Y CAGR',qoq_sales:'YoY Sales',qoq_profit:'YoY Profit',opm:'Operating Margin',roce:'ROCE',div_yield:'Dividend Yield',inst_abs:'Instl Holding',inst_chg:'Instl Change'};
    var VK={pe:'PE (TTM)',fwd_pe:'Forward PE',hist_pe:'vs Own 5Y PE',sector_pe:'vs Sector PE',pb:'Price / Book',annual_upside:'FY Upside'};
    var MK={ret_1y:'Return 1Y',ret_3y:'Return 3Y',ret_52w_idx:'52W vs Index',ret_1m:'1M Return',dma_50:'vs 50-DMA',dma_200:'vs 200-DMA',rsi_month:'RSI Monthly',vol_trend:'Volume Trend'};
    function grab(map,arr,color){ for(var k in map){ var p=params[k]; if(!p||typeof p!=='object') continue;
      var cv=pick(p,'company','value','company_value'), mv=pick(p,'median','peer_median','peers_median');
      var rank=pick(p,'rank'), n=pick(p,'of','n','count')||segn;
      if(cv==null&&mv==null) continue;
      arr.push(duelRow(map[k], fnum(cv,typeof cv==='number'&&Math.abs(cv)<100?2:1)||cv, fnum(mv,2)||mv, rank, n, color)); } }
    grab(GK,groups.G,'var(--g)'); grab(VK,groups.V,'var(--v)'); grab(MK,groups.M,'var(--m)');
  }
  function pillarCard(letter,label,score,rows,color,noteTxt){
    if(!rows.length) return sect('PILLAR '+letter, na('parameters'));
    return '<div class="card"><div class="grp-head"><h3 class="skew" style="color:'+color+'">'+label+(score!=null?' · '+fnum(score,2):'')+'</h3><span class="pill-note">'+noteTxt+'</span></div>'+rows.join('')+'</div>';
  }
  h+='<div class="eyebrow">THE PILLARS · YOU vs PEER MEDIAN</div>';
  h+=pillarCard('G','Growth',g,groups.G,'var(--g)','RANK IN SEGMENT');
  h+=pillarCard('V','Value',v,groups.V,'var(--v)','LOWER = CHEAPER');
  h+=pillarCard('M','Momentum',m,groups.M,'var(--m)','PRICE IS THE PROOF');

  /* HIGHLIGHT REEL */
  var pos=pick(d,'positives','highlights.positives')||[], neg=pick(d,'negatives','highlights.negatives')||[];
  if(pos.length||neg.length){
    var reel=pos.slice(0,3).map(function(x){return '<span class="set w"><b>W</b>'+E(typeof x==='string'?x:(x.label||x.text||JSON.stringify(x)).slice(0,40))+'</span>'}).join('')
      +neg.slice(0,3).map(function(x){return '<span class="set l"><b>L</b>'+E(typeof x==='string'?x:(x.label||x.text||JSON.stringify(x)).slice(0,40))+'</span>'}).join('');
    h+=sect('HIGHLIGHT REEL','<div class="sets">'+reel+'</div>');
  }

  /* TAPE FORENSICS */
  var x=pick(d,'extras')||d;
  var volV=pick(x,'volume.verdict','volume.state'), volR=pick(x,'volume.ratio','volume.ud_ratio');
  var delL=pick(x,'delivery.latest','delivery.pct','delivery.value'), delA=pick(x,'delivery.avg','delivery.avg_30d');
  var t1p=pick(x,'tier1.passed','tier1.pass_count'), t1n=pick(x,'tier1.total','tier1.of')||7;
  var t1checks=pick(x,'tier1.checks','tier1.detail');
  var lo52=pick(x,'range52.low','range52.lo'), hi52=pick(x,'range52.high','range52.hi'), posn=pick(x,'range52.position','range52.pct');
  var piv=pick(x,'pivot','pivots');
  var tape='';
  var vit='';
  if(volV!=null||volR!=null) vit+='<div class="vital"><div class="lbl">SMART MONEY</div><div class="val '+(String(volV).match(/ACC/i)?'up':'')+'">'+E(volV||'—')+'</div>'+(volR!=null?'<div class="sub">u/d vol '+fnum(volR,2)+'x</div>':'')+'</div>';
  if(delL!=null) vit+='<div class="vital"><div class="lbl">DELIVERY</div><div class="val num'+(delA!=null&&Number(delL)>Number(delA)?' up':'')+'">'+fnum(delL,1)+'%</div>'+(delA!=null?'<div class="sub">30d avg '+fnum(delA,1)+'%</div>':'')+'</div>';
  if(t1p!=null) vit+='<div class="vital"><div class="lbl">TIER-1 GATE</div><div class="val num">'+t1p+'/'+t1n+'</div></div>';
  if(vit) tape+='<div class="vitals">'+vit+'</div>';
  if(Array.isArray(t1checks)&&t1checks.length){
    tape+='<div class="sets" style="margin-top:14px">'+t1checks.map(function(c){
      var lbl=E((c.label||c.name||c.check||'').toString().slice(0,26));
      var p=(c.pass===true)?'w':(c.pass===false?'l':'na');
      var glyph=p==='w'?'W':(p==='l'?'L':'—');
      return '<span class="set '+p+'"><b>'+glyph+'</b>'+lbl+'</span>';}).join('')+'</div>';
  }
  if(lo52!=null&&hi52!=null&&price!=null){
    var pp=posn!=null?Number(posn):Math.round(100*(price-lo52)/(hi52-lo52));
    tape+='<div class="range" style="margin-top:14px"><div class="track"><i style="width:100%"></i><span class="dotp" style="left:'+Math.max(0,Math.min(100,pp))+'%"></span></div>'
      +'<div class="ends"><span>52W LO ₹'+fnum(lo52,0)+'</span><span style="color:var(--chalk)">₹'+fnum(price,0)+' · '+Math.round(pp)+'%</span><span>HI ₹'+fnum(hi52,0)+'</span></div></div>';
  }
  if(piv&&typeof piv==='object'){
    var PP=pick(piv,'pp','PP'),S1=pick(piv,'s1','S1'),S2=pick(piv,'s2','S2'),R1=pick(piv,'r1','R1'),R2=pick(piv,'r2','R2');
    if(PP!=null&&S2!=null&&R2!=null&&price!=null){
      var span=R2-S2||1, dp=Math.max(0,Math.min(100,Math.round(100*(price-S2)/span)));
      tape+='<div class="range" style="margin-top:16px"><div class="track" style="background:#0E1526"><i style="width:100%;background:linear-gradient(90deg,var(--heat) 0 20%,transparent 20% 80%,var(--volt) 80% 100%)"></i><span class="dotp" style="left:'+dp+'%"></span></div>'
        +'<div class="ends num"><span>S2 '+fnum(S2,0)+' · S1 '+fnum(S1,0)+'</span><span style="color:var(--chalk)">PP '+fnum(PP,0)+'</span><span>R1 '+fnum(R1,0)+' · R2 '+fnum(R2,0)+'</span></div></div>';
    }
  }
  if(tape) h+='<div class="eyebrow">TAPE FORENSICS</div><div class="card">'+tape+'</div>';

  /* LADDER */
  var peers=pick(d,'peers','ladder','peer_ladder');
  if(Array.isArray(peers)&&peers.length){
    var gmax=Math.max.apply(null,peers.map(function(p){return Number(pick(p,'gvm','score','gvm_score'))||0}))||10;
    h+='<div class="eyebrow">THE LADDER'+(seg?' · '+E(String(seg).toUpperCase()):'')+'</div><div class="card">'
      +peers.map(function(p,i){
        var ps=pick(p,'symbol','sym','name')||'?', pg=Number(pick(p,'gvm','score','gvm_score'));
        var self=(String(ps).toUpperCase()===sym.toUpperCase());
        return '<div class="lrow'+(self?' self':'')+'"><span class="r num">'+(pick(p,'rank')||i+1)+'</span><span class="s">'+E(ps)+'</span>'
          +'<div class="lbar"><i style="width:'+(isNaN(pg)?0:Math.round(pg/gmax*100))+'%"></i></div><span class="gv num">'+(isNaN(pg)?'—':fnum(pg,2))+'</span></div>';
      }).join('')+'</div>';
  }

  /* ARENA */
  var sc=pick(d,'segment_ctx','extras.segment_ctx','sector_ctx');
  if(sc){
    var srk=pick(sc,'sector_rank','rank'), sof=pick(sc,'of','sector_of','count'), sgvm=pick(sc,'sector_gvm','mcap_gvm','gvm');
    var vs1m=pick(sc,'stock_vs_sector','vs_sector_1m','delta_1m');
    var inner='';
    if(srk!=null) inner+='<div class="vital"><div class="lbl">SECTOR RANK</div><div class="val num">'+srk+(sof?'/'+sof:'')+'</div></div>';
    if(sgvm!=null) inner+='<div class="vital"><div class="lbl">SECTOR GVM</div><div class="val num">'+fnum(sgvm,2)+'</div><div class="sub">mcap-weighted</div></div>';
    if(vs1m!=null) inner+='<div class="vital"><div class="lbl">VS SECTOR 1M</div><div class="val num '+(vs1m>=0?'up':'dn')+'">'+(vs1m>=0?'+':'')+fnum(vs1m,1)+'pp</div></div>';
    if(inner) h+=sect('THE ARENA','<div class="vitals">'+inner+'</div>');
  }

  /* STORY */
  var ov=pick(d,'content.overview','overview'), kt=pick(d,'content.key_takeaway','key_takeaway','takeaway');
  if(ov||kt) h+=sect('THE STORY','<div class="story">'+(ov?E(ov)+' ':'')+(kt?'<b>The takeaway:</b> '+E(kt):'')+'</div>');

  h+='<div class="foot">'+(gvm!=null?'GVM '+fnum(gvm,2)+' · ':'')+(asof?'as of '+E(asof)+' · ':'')+'research only, not investment advice</div>';
  return h;
}

function go(){
  var s=(document.getElementById('symin').value||'').trim().toUpperCase();
  if(s) location.search='?symbol='+encodeURIComponent(s);
}
document.getElementById('symin').addEventListener('keydown',function(e){if(e.key==='Enter')go();});

(function init(){
  var sym=(new URLSearchParams(location.search).get('symbol')||'').toUpperCase().trim();
  if(!sym){ document.getElementById('load').textContent='ENTER A SYMBOL ABOVE'; return; }
  document.getElementById('symin').value=sym;
  fetch('/api/gvm/company/'+encodeURIComponent(sym),{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d||d.error){ document.getElementById('load').textContent='COULD NOT LOAD: '+((d&&d.error)||'no payload'); return; }
      var root=d.data||d.report||d;
      document.getElementById('page').innerHTML=render(root,sym);
      document.getElementById('load').style.display='none';
      document.getElementById('page').style.display='block';
    })
    .catch(function(e){ document.getElementById('load').textContent='COULD NOT LOAD: '+e; });
})();
</script>
</body>
</html>
