<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screeners · Scorr</title>
<style>
  :root{
    /* cc#1203 push 14: this page was a LIGHT island on a dark site - #f6f8fb ground, white
       panels, #1c2536 text - and every one of its eleven names is a contract name. The block is
       gone, so it now follows the reader's theme in both directions. Its two border names were
       opaque hex where the contract uses rgba; the rgba is what reads correctly on either.
       A SECOND block sat below this one, :root[data-theme="dark"], carrying its own dark palette
       - #0e1420 ground, #141c2b panels. Deleting only the first left that one winning in dark,
       which is why the page still painted rgb(14,20,32) after the first pass. The render check
       caught it; the classifier could not, because it only reads a page's first :root. Both are
       gone now and both themes come from the contract. */
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 64px}
  h1{font-size:19px;font-weight:800;margin:4px 0 2px}
  .sub{font-size:12px;color:var(--mut);margin-bottom:14px;line-height:1.5}
  /* tab strip — horizontally scrollable on mobile, no wrap, per MOBILE_UX_STANDARD_V1 */
  .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:8px 13px;border-radius:9px;border:1px solid var(--line);
       background:var(--panel);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
       min-height:38px;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{border-color:var(--blu)}
  .tab.on{background:var(--blu);border-color:var(--blu);color:#fff}
  .tab .n{font-size:10.5px;font-weight:800;opacity:.72}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .meta{font-size:11px;color:var(--dim);margin:0 0 10px;line-height:1.5}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 8px;
           font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
           border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
  tbody tr:hover{background:var(--card2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .sym{font-weight:800}
  .pos{color:var(--grn)} .neg{color:var(--red)} .zero{color:var(--mut)}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);
            margin-left:5px;vertical-align:middle}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* cc#1516: tap-to-sort headers — same convention as the v10 cards (cc#1430/1437): neutral ↕ on
     every sortable header so a touch reader knows it is tappable, single ▲/▼ on the active one. */
  thead th.srt{cursor:pointer;user-select:none}
  thead th.srt.on{color:var(--txt)}
  .empty{padding:26px 8px;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.6}
  @media(max-width:760px){
    .wrap{padding:12px 10px 64px}
    thead th,tbody td{padding:7px 6px;font-size:12px}
  }
</style>

<div class="wrap">
  <div id="scorr-nav"></div>
  <h1>Screeners</h1>
  <div class="sub">
    Predefined screens, recomputed after each end-of-day run. These are standing views — there is
    nothing to run. <b>Added On</b> is the date a stock first entered the screen and stays fixed for
    as long as it remains a member.
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="meta" id="meta"></div>
    <div class="scroll"><table id="tbl">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table></div>
  </div>
</div>

<script src="/scorr_card_common.js"></script>
<script>
// cc#824 — read-only screener page. Every number here was computed by the nightly job; the only
// live value is CMP/Day%, overlaid server-side through the shared cc#811 resolver so this page can
// never disagree with the GVM or Trade Check card about a price.
var SCREENS = [], CUR = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

// cc#823 number contract, same rule as the R card: absolutes render as integers with Indian
// grouping, growth/change renders with exactly one decimal. Defined once here and used by every
// cell, so a column cannot quietly adopt its own precision.
function fmtLevel(v){
  if(v==null||v===''||isNaN(Number(v))) return '--';
  try{ return Math.round(Number(v)).toLocaleString('en-IN'); }
  catch(e){ return String(Math.round(Number(v))); }
}
function fmtGrowth(v){
  if(v==null||v===''||isNaN(Number(v))) return '--';
  var n=Number(v); return (n>=0?'+':'')+n.toFixed(1)+'%';
}
function cls(v){ return v==null?'zero':(v>0?'pos':(v<0?'neg':'zero')); }
function fmtDate(d){
  if(!d) return '--';
  var t=new Date(d+'T00:00:00');
  if(isNaN(t)) return esc(d);
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return t.getDate()+' '+M[t.getMonth()]+' '+t.getFullYear();
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = SCREENS.map(function(s){
    return '<button class="tab'+(CUR===s.id?' on':'')+'" onclick="pick('+s.id+')">'
      + esc(s.name) + '<span class="n">'+(s.members||0)+'</span></button>';
  }).join('');
}

function pick(id){
  CUR = id; renderTabs();
  // cc#1516 scope 5: sort state does NOT carry across screens — a fresh tab starts in its own
  // server default order.
  SORT.key = null; SORT.dir = 1; VIEW = null;
  document.getElementById('body').innerHTML =
    '<tr><td colspan="20" class="empty">Loading…</td></tr>';
  fetchWithTimeout('/api/screeners/'+id,{headers:{Accept:'application/json'}})
    .then(function(r){return r.json();}).then(renderScreen)
    .catch(function(){
      document.getElementById('body').innerHTML =
        '<tr><td colspan="20" class="empty">Could not load this screen.</td></tr>';
    });
}

/* cc#1516 (session_log 34683 SCREENERS_TABLE_SORT_V1): tap-to-sort on every column, client-side
   over the already-fetched rows — no network call per sort. The sort core is the app's existing
   pattern (scorr_v10_signal.html cc#1430/1437, itself reused from scorr_result_corner): one
   {key, dir} state, nulls always last, ▲/▼ on the active header, neutral ↕ elsewhere. Symbol
   defaults ascending on first tap; every numeric column and Added On default descending. The
   INITIAL order is untouched — SORT.key stays null until the first tap, and _sortByState passes
   the list through unchanged, so first render is exactly the server rank. */
var SORT = { key: null, dir: 1 }, VIEW = null;

function _sortByState(list, state, getters){
  if (!state || !state.key) return list;
  var get = getters[state.key];
  return list.slice().sort(function(a, b){
    var av = get(a), bv = get(b);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;    // nulls sort last regardless of direction — never implies zero
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * state.dir;
    return (av - bv) * state.dir;
  });
}
function scrTh(label, key, extraCls){
  var on = SORT.key === key;
  var arrow = on ? (SORT.dir === 1 ? ' ▲' : ' ▼') : ' ↕';
  return '<th class="srt'+(extraCls?' '+extraCls:'')+(on?' on':'')
    +'" onclick="scrSort(\''+key+'\')">'+esc(label)+arrow+'</th>';
}
function scrSort(key){
  if(!VIEW) return;
  if(SORT.key===key) SORT.dir = -SORT.dir;
  else { SORT.key = key; SORT.dir = VIEW.defDir[key] != null ? VIEW.defDir[key] : -1; }
  paintScreen();
}

function renderScreen(d){
  if(!d || d.status!=='ok'){ return; }
  var cols = d.columns || [];
  var shown = cols.filter(function(c){ return c.key!=='gvm_score'; });   // GVM already has its column
  // Getters return the raw comparable value — numbers as numbers, Added On as the real epoch of
  // first_seen (never the formatted display string, so date order survives a year boundary).
  var getters = {
    SYMBOL: function(r){ return (r.symbol||'').toUpperCase(); },
    CMP:    function(r){ return (r.cmp==null||isNaN(Number(r.cmp)))?null:Number(r.cmp); },
    DAY:    function(r){ return (r.day_pct==null||isNaN(Number(r.day_pct)))?null:Number(r.day_pct); },
    GVM:    function(r){ var v=(r.metrics||{}).gvm_score;
                         return (v==null||isNaN(Number(v)))?null:Number(v); },
    ADDED:  function(r){ if(!r.first_seen) return null;
                         var t=new Date(r.first_seen+'T00:00:00').getTime();
                         return isNaN(t)?null:t; }
  };
  var defDir = { SYMBOL:1, CMP:-1, DAY:-1, GVM:-1, ADDED:-1 };
  var labels = { SYMBOL:'Symbol', CMP:'CMP', DAY:'Day%', GVM:'GVM', ADDED:'Added On' };
  shown.forEach(function(c){
    var k = 'm_'+c.key;   // prefixed so a screen field can never collide with a fixed key
    getters[k] = (function(key){ return function(r){
      var v=(r.metrics||{})[key];
      return (v==null||v===''||isNaN(Number(v)))?null:Number(v);
    };})(c.key);
    defDir[k] = -1; labels[k] = c.label;
  });
  VIEW = { d:d, shown:shown, getters:getters, defDir:defDir, labels:labels };
  paintScreen();
}

function paintScreen(){
  var d = VIEW.d, shown = VIEW.shown;
  // Sr · Symbol (+ C·A·R·D strip) · CMP · Day% · GVM · <screen's own fields> · Added On
  var head = ['<th>Sr</th>', scrTh('Symbol','SYMBOL',''), scrTh('CMP','CMP','num'),
              scrTh('Day%','DAY','num'), scrTh('GVM','GVM','num')];
  shown.forEach(function(c){ head.push(scrTh(c.label,'m_'+c.key,'num')); });
  head.push(scrTh('Added On','ADDED',''));
  document.getElementById('head').innerHTML = head.join('');

  var rows = d.rows || [];
  if(!rows.length){
    document.getElementById('body').innerHTML =
      '<tr><td colspan="'+head.length+'" class="empty">No stocks in this screen yet.<br>'
      + 'Screens fill after the next end-of-day run.</td></tr>';
    document.getElementById('meta').textContent = d.name + ' · 0 members';
    return;
  }
  rows = _sortByState(rows, SORT, VIEW.getters);
  document.getElementById('body').innerHTML = rows.map(function(r,i){
    var m = r.metrics||{};
    var tds = ['<td class="num">'+(i+1)+'</td>'];
    // cc#798: the shared C·A·R·D row strip — never re-implemented per page.
    var strip = (window.ScorrCardRow ? window.ScorrCardRow(r.symbol) : '');
    tds.push('<td class="sym">'+esc(r.symbol)+strip+'</td>');
    tds.push('<td class="num">'+(r.cmp==null?'--':fmtLevel(r.cmp))
             + (r.live?'<span class="live-dot" title="live tick"></span>':'')+'</td>');
    tds.push('<td class="num '+cls(r.day_pct)+'">'+fmtGrowth(r.day_pct)+'</td>');
    tds.push('<td class="num">'+(m.gvm_score==null?'--':Number(m.gvm_score).toFixed(2))+'</td>');
    shown.forEach(function(c){
      var v = m[c.key];
      tds.push('<td class="num'+(c.fmt==='growth'?' '+cls(v):'')+'">'
               + (c.fmt==='growth'?fmtGrowth(v):fmtLevel(v))+'</td>');
    });
    tds.push('<td>'+fmtDate(r.first_seen)+'</td>');
    return '<tr>'+tds.join('')+'</tr>';
  }).join('');
  // The meta line must never claim an order the table is not in: server sort_key until the reader
  // sorts, then the active column + direction.
  document.getElementById('meta').textContent =
    d.name + ' · ' + rows.length + ' stocks · sorted by '
    + (SORT.key ? (VIEW.labels[SORT.key]||SORT.key) + (SORT.dir===1?' ▲':' ▼')
                : (d.sort_key||'GVM'));
}

fetchWithTimeout('/api/screeners',{headers:{Accept:'application/json'}})
  .then(function(r){return r.json();})
  .then(function(d){
    SCREENS = (d && d.screens) || [];
    if(!SCREENS.length){
      document.getElementById('body').innerHTML =
        '<tr><td colspan="20" class="empty">No screens configured.</td></tr>';
      return;
    }
    renderTabs();
    pick(SCREENS[0].id);
    if(d.never_run){
      document.getElementById('meta').textContent =
        'Screens have not been computed yet — they fill after the next end-of-day run.';
    }
  })
  .catch(function(){
    document.getElementById('body').innerHTML =
      '<tr><td colspan="20" class="empty">Could not load screens.</td></tr>';
  });
</script>
</body>
</html>
