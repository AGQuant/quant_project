<!doctype html>
<!-- ══ mobile/qb_holdings.html — View holdings: vertical sortable table for one basket
     (QB_APP_R5_LOCK 42805, founder 10-Sep: "view holdings displays in vertical table with sorting").
     Route /m/qb/holdings?basket=<name> (mobile_qb_holdings.py). Data /api/mobile/qb_app/holdings.
     Tap a column header to sort; tap again to flip. Contract tokens only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Holdings · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<link rel="stylesheet" href="/static/scorr_themes.css">
<link rel="stylesheet" href="/static/scorr_appshell.css">
<script src="/static/scorr_appshell.js" defer></script>
<style>
.qh{font-family:Sora,-apple-system,sans-serif;color:var(--ink);padding-bottom:var(--space-80)}
.qh-asof{padding:var(--space-10) var(--space-16) 0;font-size:var(--type-10);color:var(--muted);letter-spacing:var(--track-em7)}
.qh-asof b{color:var(--ink);font-weight:600}
.wrap{margin:var(--space-12) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:100%;font-size:var(--type-115)}
th{position:sticky;top:0;background:var(--hi);font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em9);text-align:right;padding:var(--space-9) var(--space-8);border-bottom:var(--bw-1) solid var(--edge);white-space:nowrap;cursor:pointer;user-select:none}
th.on{color:var(--brand)}th.on::after{content:" ▾";font-size:var(--type-9)}th.on.asc::after{content:" ▴"}
th:first-child,td:first-child{text-align:left;padding-left:var(--space-12);position:sticky;left:0;background:var(--panel)}
th:first-child{background:var(--hi)}
td{padding:var(--space-8) var(--space-8);border-bottom:var(--bw-1) solid var(--hi);text-align:right;font-weight:600;white-space:nowrap}
td:first-child{font-weight:800}td:first-child small{display:block;font-size:var(--type-9);color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:none}
.pos{color:var(--win)}.neg{color:var(--loss)}
.foot{padding:var(--space-9) var(--space-12);font-size:var(--type-10);color:var(--muted);border-top:var(--bw-1) solid var(--edge)}
.err{margin:var(--space-16);color:var(--muted);font-size:var(--type-12);text-align:center}
.back{color:var(--brand);text-decoration:none;font-size:var(--type-18);font-weight:800}
</style>
</head>
<body data-theme="goldnight">
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){}}catch(e){}
var __r1644=({goldday:'aquawhite',rosenight:'blush',rosewall:'blush',winepurple:'electricviolet',duskviolet:'electricviolet'})[t];if(__r1644){t=__r1644;try{localStorage.setItem('scorr_theme',t);}catch(e){}}document.body.setAttribute('data-theme',(window.SCORR_THEME&&window.SCORR_THEME.resolve)?window.SCORR_THEME.resolve():((t==='goldnight'||t==='dark'||t==='aquawhite'||t==='blush'||t==='ainight'||t==='silvergold'||t==='electricviolet'||t==='indigoash')?t:'goldnight'));
try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;}catch(e){}})();</script>
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t" id="pg-title">Holdings</span></div><div class="as-slot"><a class="back" id="back" href="/m/qb">‹</a></div></div>
<div class="qh">
<div class="qh-asof" id="asof">Loading…</div>
<div id="body"><div class="err">Loading holdings…</div></div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn on" href="/m/dash"><span class="i">◍</span>Dash</a>
</nav>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pct(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(1)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function num(v,d){ if(v==null||isNaN(Number(v))) return '—'; return Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
var COLS=[['symbol','Name',false],['weight_pct','Weight',true],['pnl_pct','P&L',true],['day_pct','Day',true],['gvm','GVM',true],['entry','Entry',true],['stop','Stop',true]];
var ROWS=[], KEY='weight_pct', ASC=false, B='';
function render(){
  var rows=ROWS.slice().sort(function(a,b){ var x=a[KEY], y=b[KEY]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return ASC? x.localeCompare(y) : y.localeCompare(x); return ASC? x-y : y-x; });
  var th=COLS.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=rows.map(function(r){
    return '<tr><td>'+esc(r.symbol)+'<small>'+esc((r.sector||'')+(r.cap&&r.cap!=='—'?' · '+r.cap:''))+'</small></td>'
      +'<td>'+(r.weight_pct!=null?r.weight_pct.toFixed(1)+'%':'—')+'</td>'
      +'<td class="'+cls(r.pnl_pct)+'">'+pct(r.pnl_pct)+'</td>'
      +'<td class="'+cls(r.day_pct)+'">'+pct(r.day_pct)+'</td>'
      +'<td>'+(r.gvm!=null?r.gvm.toFixed(2):'—')+'</td>'
      +'<td>'+num(r.entry,2)+'</td>'
      +'<td>'+num(r.stop,2)+'</td></tr>';
  }).join('');
  document.getElementById('body').innerHTML='<div class="wrap"><div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' holdings · tap a header to sort · P&L from entry · Day vs previous close · GVM at entry</div></div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='symbol'); } render(); });
}
try{ B=new URLSearchParams(location.search).get('basket')||''; }catch(e){}
document.getElementById('back').href='/m/qb'+(B?'?basket='+encodeURIComponent(B):'');
fetch('/api/mobile/qb_app/holdings?basket='+encodeURIComponent(B),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
  if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
  ROWS=d.rows||[]; document.getElementById('pg-title').textContent=d.label+' · holdings';
  document.getElementById('asof').innerHTML='<b>'+esc(d.label)+'</b> · '+d.count+' open · by weight';
  render();
}).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load holdings.</div>'; });
</script>
</body></html>
