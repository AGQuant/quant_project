<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmy(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]+' '+p[0]):String(iso); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function pct(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(1)+'%'; }
function sg(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(2); }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function cr(v){ if(v==null) return '—'; v=Number(v); return v>=100000?'₹'+(v/100000).toFixed(1)+'L Cr':v>=1000?'₹'+(v/1000).toFixed(0)+'k Cr':'₹'+Math.round(v)+' Cr'; }
function vcls(v){ return v==='Good'||v==='Excellent'?'g':(v==='Weak'?'w':''); }
var D=null, SIZE='ALL';
function ladderRow(r,i,cold){
  var top=(r.top||[])[0];
  return '<a class="lr '+(cold?'cold':(vcls(r.verdict)==='g'?'good':''))+'" href="/m/sector?seg='+encodeURIComponent(r.segment)+'"><span class="rk">'+(i+1)+'</span>'
    +'<div><div class="nm">'+esc(r.segment)+'<span class="pill '+vcls(r.verdict)+'">'+esc(r.verdict||'—')+'</span></div>'
    +'<div class="sub">G '+f1(r.g)+' · V '+f1(r.v)+' · M '+f1(r.m)+' · '+r.names+' names'+(top?' · <b>'+esc(top.symbol)+'</b> '+(top.day!=null?'<span class="'+cls(top.day)+'">'+pct(top.day)+'</span>':''):'')+'</div></div>'
    +'<div class="gv"><div class="n">'+f2(r.gvm)+'</div><div class="c '+cls(r.change)+'">'+(r.change==null?'—':sg(r.change))+'</div></div></a>';
}
function renderList(d){
  D=d;
  var rows=d.rows||[];
  var vs=d.verdicts||{}; var good=(vs.Good||0)+(vs.Excellent||0), weak=vs.Weak||0;
  document.getElementById('asof').innerHTML='Scored <b>'+esc(dmy(d.score_date))+'</b> · '+rows.length+' segments · mcap-weighted GVM';
  var h='<div class="km"><div><div class="k">Segments</div><div class="v">'+rows.length+'</div></div><div><div class="k">Good</div><div class="v pos">'+good+'</div></div><div><div class="k">Average</div><div class="v">'+(vs.Average||0)+'</div></div><div><div class="k">Weak</div><div class="v neg">'+weak+'</div></div></div>';
  h+='<div class="sec"><h2>Strongest segments</h2><span class="hint">by GVM · Δ since first score</span></div>';
  h+='<div class="seg" id="sz">'+['ALL','LARGE','MID','SMALL'].map(function(s){return '<span data-s="'+s+'"'+(s===SIZE?' class="on"':'')+'>'+(s==='ALL'?'All':s.charAt(0)+s.slice(1).toLowerCase())+'</span>';}).join('')+'</div>';
  h+='<div class="lad" id="ladder"></div><div class="more" id="lmore"></div>';
  var cold=rows.filter(function(r){return r.gvm!=null&&r.gvm<6;}).sort(function(a,b){return (a.gvm||0)-(b.gvm||0);}).slice(0,5);
  h+='<div class="sec"><h2>Cold segments</h2><span class="hint">GVM under 6 · '+cold.length+'</span></div>';
  h+= cold.length ? '<div class="lad">'+cold.map(function(r,i){return ladderRow(r,i,true);}).join('')+'</div>' : '<div class="card"><div class="emp"><b>No cold segment today</b>Nothing rates under 6.</div></div>';
  var th=d.themes||[];
  h+='<div class="sec"><h2>Emerging themes</h2><span class="hint">'+th.length+' · swipe →</span></div>';
  h+= th.length ? '<div class="rl">'+th.map(function(t){
      return '<div class="tc"><div class="rk">Theme '+t.rank+'</div><div class="nm">'+esc(t.name)+'</div><div class="tg">'+esc(t.tagline||'')+'</div><div class="lst">'+(t.top||[]).map(function(c){return '<div class="r"><b>'+esc(c.symbol)+'</b><span>GVM '+f2(c.gvm)+'</span></div>';}).join('')+'</div></div>';
    }).join('')+'</div>' : '<div class="card"><div class="emp"><b>No themes on record</b>The theme pass has not written any rows yet.</div></div>';
  h+='<div class="note"><b>How to read this.</b> '+esc(d.note||'')+' Tap a segment for its brief, the numbers behind the score and every member.</div>';
  document.getElementById('body').innerHTML=h;
  drawLadder();
  document.getElementById('sz').addEventListener('click', function(e){ var s=e.target.closest('[data-s]'); if(!s) return; SIZE=s.getAttribute('data-s'); this.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',x===s);}); drawLadder(); });
}
function drawLadder(){
  var rows=(D.rows||[]).filter(function(r){ return SIZE==='ALL' || r.size===SIZE; }).sort(function(a,b){ return (b.gvm||0)-(a.gvm||0); });
  var top=rows.slice(0,10);
  document.getElementById('ladder').innerHTML= top.length ? top.map(function(r,i){return ladderRow(r,i,false);}).join('') : '<div class="emp" style="padding:12px">No segment in this size band.</div>';
  document.getElementById('lmore').innerHTML=(rows.length>10?'+'+(rows.length-10)+' more · ':'')+'<a href="/m/sector?view=all">All '+(D.rows||[]).length+' segments, sortable ›</a>';
}
var ROWS=[], KEY='gvm', ASC=false, COLS=[];
function tbl(){
  var rows=ROWS.slice().sort(function(a,b){ var x=a[KEY], y=b[KEY]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return ASC? x.localeCompare(y) : y.localeCompare(x); return ASC? x-y : y-x; });
  var th=COLS.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=rows.map(function(r){ return '<tr>'+COLS.map(function(c,i){ var v=r[c[0]]; var cell=c[2]?c[2](v,r):esc(v==null?'—':v); return '<td'+(i===0?'':'')+'>'+cell+'</td>'; }).join('')+'</tr>'; }).join('');
  document.getElementById('tb').innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' rows · tap a header to sort</div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='segment'||k==='symbol'); } tbl(); });
}
function renderAll(d){
  document.getElementById('pg-title').textContent='All segments'; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='Scored <b>'+esc(dmy(d.score_date))+'</b> · '+(d.rows||[]).length+' segments';
  document.getElementById('body').innerHTML='<div class="wrap" id="tb"></div>';
  ROWS=d.rows||[]; KEY='gvm'; ASC=false;
  COLS=[['segment','Segment',function(v,r){return '<a href="/m/sector?seg='+encodeURIComponent(v)+'">'+esc(v)+'<small>'+esc(r.verdict||'')+(r.size?' · '+r.size.toLowerCase():'')+'</small></a>';}],
        ['gvm','GVM',function(v){return '<span class="'+((v||0)>=7?'gd':'')+'">'+f2(v)+'</span>';}],['g','G',f1],['v','V',f1],['m','M',f1],
        ['change','Δ',function(v){return '<span class="'+cls(v)+'">'+sg(v)+'</span>';}],['names','Names'],['mcap','Mcap',cr]];
  tbl();
}
function renderSeg(d){
  var s=d.scorecard||{}, e=d.evidence||{}, b=d.brief||{};
  document.getElementById('pg-title').textContent=d.segment; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='Scored <b>'+esc(dmy(d.score_date))+'</b> · '+(s.size?s.size.toLowerCase()+' segment · ':'')+e.names+' names';
  var bar=function(l,v){ return '<div class="r"><span class="l">'+l+'</span><div class="bar"><i style="width:'+(v==null?0:Math.min(100,v*10))+'%"></i></div><span class="v">'+f1(v)+'</span></div>'; };
  var h='<div class="hero"><div class="eye">Segment · '+esc(s.verdict||'—')+(d.absorbed&&d.absorbed.length>1?' · covers '+d.absorbed.length+' sub-segments':'')+'</div><div class="nm">'+esc(d.segment)+'</div>'
    +'<div class="big"><div class="r">'+f2(s.gvm)+'</div><div class="n">mcap-weighted GVM<br>Δ since first score <b class="'+cls(s.change)+'">'+sg(s.change)+'</b></div></div>'
    +'<div class="pil">'+bar('G',s.g)+bar('V',s.v)+bar('M',s.m)+'</div></div>';
  h+='<div class="strip"><div><div class="k">Names</div><div class="v">'+e.names+'</div></div><div><div class="k">Mcap</div><div class="v">'+cr(e.mcap)+'</div></div><div><div class="k">Inst. flow</div><div class="v '+cls(e.inst)+'">'+(e.inst==null?'—':pct(e.inst))+'</div></div><div><div class="k">QoQ profit</div><div class="v '+cls(e.qoq)+'">'+(e.qoq==null?'—':pct(e.qoq))+'</div></div></div>';
  if(b.what||b.drivers||b.risks){
    h+='<div class="card"><div class="ch"><span class="t">What it is</span><span class="n">brief</span></div><div class="p">'+esc(b.what||'')+'</div>'+(b.model?'<div class="p mu">'+esc(b.model)+'</div>':'')+'</div>';
    if(b.drivers) h+='<div class="card"><div class="ch"><span class="t">What drives it</span></div><div class="p">'+esc(b.drivers)+'</div></div>';
    if(b.risks) h+='<div class="card"><div class="ch"><span class="t">What can go wrong</span></div><div class="p">'+esc(b.risks)+'</div></div>';
  } else h+='<div class="card"><div class="emp"><b>No brief yet</b>This segment has no written brief on record. The numbers above still stand.</div></div>';
  h+='<div class="sec"><h2>Members</h2><span class="hint">'+(d.members||{}).count+' · by GVM</span></div><div class="wrap" id="tb"></div>';
  h+='<div class="note"><b>One weak giant can sink a segment.</b> The score is weighted by market cap, so read the members table before trusting the headline.</div>';
  document.getElementById('body').innerHTML=h;
  ROWS=(d.members||{}).rows||[]; KEY='gvm'; ASC=false;
  COLS=[['symbol','Name',function(v,r){return esc(v)+'<small>'+esc(r.name||'')+'</small>';}],['gvm','GVM',function(v){return '<span class="'+((v||0)>=8?'gd':'')+'">'+f2(v)+'</span>';}],['g','G',f1],['v','V',f1],['m','M',f1],['pe','P/E',f1],['mcap','Mcap',cr]];
  tbl();
}
var Q={}; try{ var u=new URLSearchParams(location.search); Q.seg=u.get('seg'); Q.view=u.get('view'); }catch(e){}
var url = Q.seg ? '/api/mobile/sector_app/segment?name='+encodeURIComponent(Q.seg) : '/api/mobile/sector_app/list';
fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
  if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
  Q.seg ? renderSeg(d) : (Q.view==='all' ? renderAll(d) : renderList(d));
}).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load sectors.</div>'; });
</script>
