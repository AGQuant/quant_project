<!-- ══ mobile/sector.html — Sector Intel app section. Fable single-mode build 10-Sep-2026 (founder: "read the
     website APIs once for the universe, then build intuitively"). Supersedes the cc#1900 build. ONE page, three views:
       /m/sector             → LADDER: key card, size toggle, strongest segments ranked by mcap-weighted GVM with
                               G·V·M, change since first score and the top name; cold segments; emerging themes rail
       /m/sector?view=all    → every segment, sortable table
       /m/sector?seg=<name>  → one segment: scorecard, evidence strip, the brief in plain words, members table
     Data: /api/mobile/sector_app/list and /segment?name= (sector_app_mobile.py V2), which read the web tab's own
     sector_rotation / sector_brief / sector_themes. Contract tokens only.
     cc#2155 (17-Sep-2026): ladder top 5 per size band, View all control, score/delta split; the ladder row's inner
     classes are si-* because /static/mobile_app.css carries bare .c/.gv/.rk/.more card rules that restyled them; the
     key-metrics card's value cell is si-v for the same reason (bare .v is a card there too). -->

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmy(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]+' '+p[0]):String(iso); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function pct(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(1)+'%'; }
function sg(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(2); }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function cr(v){ if(v==null) return '—'; v=Number(v); return v>=100000?'₹'+(v/100000).toFixed(1)+'L Cr':v>=1000?'₹'+(v/1000).toFixed(0)+'k Cr':'₹'+Math.round(v)+' Cr'; }
function vcls(v){ return v==='Good'||v==='Excellent'?'g':(v==='Weak'?'w':''); }
var D=null, SIZE='ALL';
function ladderRow(r,i,cold){
  var top=(r.top||[])[0];
  return '<a class="lr '+(cold?'cold':(vcls(r.verdict)==='g'?'good':''))+'" href="/m/sector?seg='+encodeURIComponent(r.segment)+'"><span class="si-rk">'+(i+1)+'</span>'
    +'<div><div class="nm">'+esc(r.segment)+'<span class="pill '+vcls(r.verdict)+'">'+esc(r.verdict||'—')+'</span></div>'
    +'<div class="sub">G '+f1(r.g)+' · V '+f1(r.v)+' · M '+f1(r.m)+' · '+r.names+' names'+(top?' · <b>'+esc(top.symbol)+'</b> '+(top.day!=null?'<span class="'+cls(top.day)+'">'+pct(top.day)+'</span>':''):'')+'</div></div>'
    // cc#2231: the change pill (was here) can never populate -- sector_ratings has one score_date and no
    // scheduler produces a second one, and the underlying gvm_history delta join matches at most 1 of 126
    // segments against a single stray 2002 seed row. Removed with its header claim, not hidden behind a
    // flag; see item 4 of cc#2231 for what would have to be true before it can come back.
    +'<div class="si-gv"><div class="si-n">'+f2(r.gvm)+'</div></div></a>';
}
function renderList(d){

  document.getElementById('asof').innerHTML='Scored <b>'+esc(dmy(d.score_date))+'</b> · '+rows.length+' segments · mcap-weighted GVM';
  var h='<div class="km"><div><div class="k">Segments</div><div class="si-v">'+rows.length+'</div></div><div><div class="k">Good</div><div class="si-v pos">'+good+'</div></div><div><div class="k">Average</div><div class="si-v">'+(vs.Average||0)+'</div></div><div><div class="k">Weak</div><div class="si-v neg">'+weak+'</div></div></div>';
  h+='<div class="sec"><h2>Strongest segments</h2><span class="hint">by GVM</span></div>';
  h+='<div class="seg" id="sz">'+['ALL','LARGE','MID','SMALL'].map(function(s){return '<span data-s="'+s+'"'+(s===SIZE?' class="on"':'')+'>'+(s==='ALL'?'All':s.charAt(0)+s.slice(1).toLowerCase())+'</span>';}).join('')+'</div>';
  h+='<div class="lad" id="ladder"></div><div id="lmore"></div>';
  var cold=rows.filter(function(r){return r.gvm!=null&&r.gvm<6;}).sort(function(a,b){return (a.gvm||0)-(b.gvm||0);}).slice(0,5);
  h+='<div class="sec"><h2>Cold segments</h2><span class="hint">GVM under 6 · '+cold.length+'</span></div>';
  h+= cold.length ? '<div class="lad">'+cold.map(function(r,i){return ladderRow(r,i,true);}).join('')+'</div>' : '<div class="card"><div class="emp"><b>No cold segment today</b>Nothing rates under 6.</div></div>';

var Q={}; try{ var u=new URLSearchParams(location.search); Q.seg=u.get('seg'); Q.view=u.get('view'); Q.theme=u.get('theme'); }catch(e){}

/* cc#2206: a failure is diagnosable from the screen -- HTTP status + content-type + the first 120 chars of the body (never the bare
   'Could not load sectors.' that hid a 502-during-deploy, an auth HTML page and a real bug behind one string). One automatic retry
   after 800 ms; then a Retry button that re-runs the SAME fetch (ladder -> /list, segment -> /segment?name=, all -> /list,
   theme -> /theme?name= -- cc#2232), no reload. */
/* cc#2210: the cc#2208 helper, same behaviour. mobile_endpoints._guard answers a logged-out XHR with 401 {error:'unauthorized', login_url:'/login'};
   that body is let through the cc#2206 status ladder above (a 401 is !r.ok, so it used to land in the catch -> auto retry -> a Retry button that
   could never succeed) and handled here FIRST: go to the login page. Every non-auth failure keeps the cc#2206 path unchanged. GOING is a one-shot
   so two fetches cannot both navigate. No return-to param: the app login lands on /m/home (login.html's hidden next=/m/home; login_get reads no

var GOING=false;
function unauth(d){ if(d&&(d.error==='unauthorized'||d.login_url)){ if(!GOING){ GOING=true; var u=(typeof d.login_url==='string'&&d.login_url.charAt(0)==='/')?d.login_url:'/login'; location.replace(u); } return true; } return false; }
function showErr(m, retry){ var az=document.getElementById('asof'); if(az) az.textContent='Not loaded'; document.getElementById('body').innerHTML='<div class="err">'+esc(m)+(retry?'<br><button type="button" class="se-retry" id="se-retry">Retry</button>':'')+'</div>'; var b=document.getElementById('se-retry'); if(b) b.addEventListener('click', function(){ load(0); }); }
function load(attempt){
  fetch(url,{credentials:'same-origin'}).then(function(r){
    var ct=(r.headers.get('content-type')||'').split(';')[0].trim();
    if(r.status===401&&ct==='application/json'){ return r.json().then(function(d){ if(unauth(d)) return null; throw new Error('HTTP 401 application/json — '+JSON.stringify(d).replace(/\s+/g,' ').slice(0,120)); }); }  /* cc#2210 */
    if(!r.ok||ct!=='application/json'){ return r.text().then(function(t){ throw new Error('HTTP '+r.status+(ct?' '+ct:'')+' — '+String(t||'').replace(/\s+/g,' ').trim().slice(0,120)); }); }
    return r.json();

    if(d===null) return;  /* cc#2210: unauth() has already navigated */

  }).catch(function(e){

    if(!attempt){ showErr(m+' · retrying…', false); setTimeout(function(){ load(1); }, 800); return; }

  });
}
