  fetch('/api/health/report_pdf_self/'+encodeURIComponent(PID),{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){

    fetch(d.url,{credentials:'same-origin'}).then(function(pr){ var ct=(pr.headers.get('content-type')||''); if(!pr.ok||ct.indexOf('application/pdf')<0){ fallback(); return; } return pr.blob().then(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=d.filename||'Portfolio_Health.pdf'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000); msg.textContent='Saved '+(d.filename||'the PDF')+'.'; }); }).catch(fallback);

  C.push({key:'highlights', web:'Key Highlights', title:'What stands out', head:(d.highlights||[]).length+'<small> points</small>', verdict:'The section insights, in one place.', body:'<ul class="pf-ul">'+(d.highlights||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'});

  C.push({key:'expert', web:'Expert take', title:'Expert take', head:'<small>Rule-generated · research, not advice</small>', verdict:'', body:'<div class="pf-take">'+esc(d.expert_take||'')+'</div>'});
  /* 20 Breakup tab — rating breakup */
  var rb=d.rating_breakup||[]; var params=[]; rb.forEach(function(r){ if(!params.length&&r.rated&&r.params) params=Object.keys(r.params); });
  var restN=Math.max(0,(d.holdings||[]).length-rb.length), restW=restN?(d.holdings||[]).slice().sort(function(a,b){ return (b.weight||0)-(a.weight||0); }).slice(rb.length).reduce(function(t,x){ return t+(x.weight||0); },0):0;
  C.push({key:'breakup', web:'Breakup tab (rating breakup)', title:'Rating breakup', head:params.length+'<small> parameters × '+rb.length+' holdings</small>', verdict:'Each rating parameter per holding, out of 10. Scroll sideways.'+(restN?' +'+restN+' more holdings ('+f1(restW)+'% weight) not shown, as on the web.':''),
    body:(rb.length&&params.length?'<div class="pf-scroll"><table class="pf-tb"><thead><tr><th>Stock</th>'+params.map(function(k){ return '<th>'+esc(k)+'</th>'; }).join('')+'</tr></thead><tbody>'+rb.map(function(r){ return '<tr><td>'+esc(r.symbol)+'<small>'+f1(r.weight)+'% wt'+(r.rated?'':' · not rated')+'</small></td>'+params.map(function(k){ var v=r.rated?(r.params||{})[k]:null; return '<td>'+(v==null?'—':f1(v))+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>':'<div class="pf-emp">No rating breakup rows.</div>')});
  return C;
}
/* cc#2209: the 20 cards live in SEVEN vertical categories; a horizontal swipe stays inside one category, the page scrolls
   down to the next. CATEGORIES is data -- re-grouping later is a change to this array, not a rewrite. A card whose key
   is not listed here falls into a trailing 'More' group, so a new card can never vanish. */
var CATEGORIES=[
  {title:'Performance',     keys:['snapshot','alpha','oneyear','valuation','risk']},
  {title:'Rating',          keys:['rating','quality']},
  {title:'Composition',     keys:['sectors','size']},
  {title:'Movers',          keys:['winners','gainers','losers']},
  {title:'Watch list',      keys:['upcoming','redflags','replacements','results']},
  {title:'Holdings detail', keys:['holdings','breakup']},
  {title:'Takeaways',       keys:['highlights','expert']}];
function groupCards(C){ var by={}, used={}; C.forEach(function(c){ by[c.key]=c; });
  var out=CATEGORIES.map(function(g){ return {title:g.title, cards:g.keys.map(function(k){ used[k]=true; return by[k]; }).filter(Boolean)}; });
  var rest=C.filter(function(c){ return !used[c.key]; }); if(rest.length) out.push({title:'More', cards:rest});
  return out.filter(function(g){ return g.cards.length; }); }
function bindRail(gi, n){
  var rail=document.getElementById('pf-rail-'+gi), cnt=document.getElementById('pf-rcount-'+gi), dots=document.getElementById('pf-dots-'+gi), cur=0;
  function step(){ var c=rail.querySelector('.pf-rc'); return c?c.getBoundingClientRect().width+12:1; }
  function set(i){ if(i===cur) return; cur=i; cnt.textContent=(i+1)+' / '+n; var ds=dots.querySelectorAll('i'); for(var k=0;k<ds.length;k++) ds[k].classList.toggle('pf-on',k===i); }
  var tick=false; rail.addEventListener('scroll', function(){ if(tick) return; tick=true; requestAnimationFrame(function(){ tick=false; set(Math.max(0,Math.min(n-1,Math.round(rail.scrollLeft/step())))); }); });
  dots.addEventListener('click', function(e){ var ds=Array.prototype.slice.call(dots.querySelectorAll('i')); var i=ds.indexOf(e.target); if(i<0) return; rail.scrollTo({left:i*step(),behavior:'smooth'}); set(i); });
}
function renderReport(){
  hdr('report');
  if(!REP){ document.getElementById('pf-body').innerHTML='<div class="pf-err">Building the report from live prices…</div>'; return; }
  var C=buildCards(REP), p=REP.portfolio||{}, G=groupCards(C);
  document.getElementById('pf-asof').innerHTML='<b>'+esc(shortName(p.name||NAME))+'</b> · '+C.length+' sections in '+G.length+' groups · swipe within a group, scroll down for the next';
  var h='';
  G.forEach(function(g,gi){
    h+='<div class="pf-cat" data-g="'+gi+'"><div class="pf-cath"><h2>'+esc(g.title)+'</h2><span class="pf-rcount" id="pf-rcount-'+gi+'">1 / '+g.cards.length+'</span></div>';
    h+='<div class="pf-dots" id="pf-dots-'+gi+'">'+g.cards.map(function(c,i){ return '<i'+(i===0?' class="pf-on"':'')+'></i>'; }).join('')+'</div>';
    h+='<div class="pf-rail" id="pf-rail-'+gi+'" data-g="'+gi+'">'+g.cards.map(function(c,i){ return '<div class="pf-rc" data-i="'+i+'" data-key="'+esc(c.key)+'"><div class="pf-eye">'+(i+1)+' of '+g.cards.length+' · '+esc(g.title)+'<span>web: '+esc(c.web)+'</span></div><div class="pf-ct">'+esc(c.title)+'</div><div class="pf-hd">'+c.head+'</div>'+(c.verdict?'<div class="pf-vd">'+c.verdict+'</div>':'')+'<div class="pf-bd">'+c.body+'</div></div>'; }).join('')+'</div></div>';
  });
  h+='<div class="pf-hint">Every card is a section of the web Portfolio Health report. Research, not advice.</div>';
  h+='<div class="pf-act" style="margin-top:14px"><a class="pf-btn2" id="pf-pdf" href="#"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>Download PDF</a><div class="pf-msg" id="pf-pdf-msg"></div></div>';
  document.getElementById('pf-body').innerHTML=h;
  G.forEach(function(g,gi){ bindRail(gi, g.cards.length); });
  document.getElementById('pf-pdf').addEventListener('click', function(e){ e.preventDefault(); downloadPdf(); });
  window.pfGo=function(i){ var n=0; for(var gi=0;gi<G.length;gi++){ if(i<n+G[gi].cards.length){ var rail=document.getElementById('pf-rail-'+gi), c=rail.querySelector('.pf-rc'), st=c?c.getBoundingClientRect().width+12:1; rail.scrollTo({left:(i-n)*st}); rail.closest('.pf-cat').scrollIntoView({block:'start'}); return; } n+=G[gi].cards.length; } };
}
/* ═══ CLIENT PICKER (founder 15:15: filter icon -> full page, search on top, every name below) ═══ */
function renderPick(){
  hdr('pick');
  document.getElementById('pf-asof').innerHTML=(CLIENTS?'<b>'+CLIENTS.length+'</b> saved portfolios · tap one to switch':'Loading the list…');
  var h='<div class="pf-search"><input id="pf-q" type="search" placeholder="Search by name" autocomplete="off" aria-label="Search portfolios"></div><div class="pf-list" id="pf-list"></div>';
  document.getElementById('pf-body').innerHTML=h;
  var q=document.getElementById('pf-q'); q.addEventListener('input', drawPick); drawPick(); try{ q.focus(); }catch(e){}
}
function drawPick(){
  var q=(document.getElementById('pf-q').value||'').trim().toLowerCase(), list=document.getElementById('pf-list');
  if(!CLIENTS){ list.innerHTML='<div class="pf-emp" style="padding:12px">Loading…</div>'; return; }
  var rows=CLIENTS.filter(function(c){ return !q||String(c.name||'').toLowerCase().indexOf(q)>-1; });
  list.innerHTML= rows.length ? rows.map(function(c){ return '<a class="pf-cl" href="/m/portfolio?pid='+c.id+'" data-id="'+c.id+'"><div><div class="pf-nm">'+esc(c.name)+'</div><div class="pf-sub">portfolio #'+c.id+(c.id===DEFAULT_PID?' · reference':'')+'</div></div>'+(c.id===PID?'<span class="pf-tick" aria-label="selected">✓</span>':'<span class="pf-mu">›</span>')+'</a>'; }).join('') : '<div class="pf-emp" style="padding:12px">No name matches “'+esc(q)+'”.</div>';
  list.onclick=function(e){ var a=e.target.closest('.pf-cl'); if(!a) return; try{ localStorage.setItem(LS, a.getAttribute('data-id')); }catch(x){} };
}
/* cc#2208: the XHR endpoints answer a logged-out browser with 401 {error:'unauthorized', login_url:'/login'} (mobile_endpoints._guard).
   That is a session state, not a data error -- go to the login page instead of printing it. Plain /login: the app's login flow lands
   every page on /m/home afterwards (login.html's hidden next=/m/home; login_get reads no ?next=), so no return-to param is invented here. */
var GOING=false;
function unauth(d){ if(d&&(d.error==='unauthorized'||d.login_url)){ if(!GOING){ GOING=true; var u=(typeof d.login_url==='string'&&d.login_url.charAt(0)==='/')?d.login_url:'/login'; location.replace(u); } return true; } return false; }
function loadClients(){ if(CLIENTS) return Promise.resolve(CLIENTS); return fetch('/api/mobile/portfolio/clients',{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){ if(unauth(d)) return []; CLIENTS=d.rows||[]; return CLIENTS; }); }
/* ═══ BOOT ═══ */
document.getElementById('pf-filter').addEventListener('click', function(){ if(VIEW==='pick'){ VIEW='snap'; setUrl('snap'); renderSnap(); return; } VIEW='pick'; setUrl('pick'); renderPick(); loadClients().then(function(){ if(VIEW==='pick') renderPick(); }).catch(function(){ document.getElementById('pf-asof').textContent='Could not load the portfolio list.'; }); });
document.getElementById('pf-back').addEventListener('click', function(e){ e.preventDefault(); VIEW='snap'; setUrl('snap'); renderSnap(); window.scrollTo(0,0); });
window.addEventListener('popstate', function(){ var v='snap'; try{ v=new URLSearchParams(location.search).get('view')||'snap'; }catch(e){} VIEW=v; route(); });
function route(){ if(VIEW==='pick'){ renderPick(); loadClients().then(function(){ if(VIEW==='pick') renderPick(); }); } else if(VIEW==='report'){ renderReport(); } else { renderSnap(); } }
function fail(m){ document.getElementById('pf-asof').textContent=''; document.getElementById('pf-body').innerHTML='<div class="pf-err">'+esc(m)+'<br><a class="pf-gd" href="/m/portfolio?pid='+DEFAULT_PID+'">Open the reference portfolio</a></div>'; }
try{ if(Q.pid) localStorage.setItem(LS, String(PID)); }catch(e){}
route();
fetch('/api/mobile/portfolio?pid='+PID,{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
  if(unauth(d)) return;
  if(!d||d.error){ fail('Could not load portfolio #'+PID+(d&&d.error?': '+d.error:'.')); return; }
  SNAP=d; NAME=shortName(d.name); if(VIEW==='snap') renderSnap(); else hdr(VIEW);
}).catch(function(){ fail('Could not load the portfolio.'); });
fetch('/api/mobile/health_app/report?pid='+PID,{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
  if(unauth(d)) return;
  if(!d||d.error){ if(VIEW==='report') fail('Could not build the report'+(d&&d.error?': '+d.error:'.')); return; }
  REP=d; if(!NAME&&d.portfolio) NAME=shortName(d.portfolio.name);
  if(VIEW==='report') renderReport(); else if(VIEW==='snap'&&SNAP) renderSnap();
}).catch(function(){ if(VIEW==='report') fail('Could not build the report.'); });
</script>
