<!-- cc#2027 (founder voice 13-Sep): approving ANY trade always confirms a target and stop loss
     first -- pre-filled when the engine stores a real per-row price, blank and editable when it
     does not. A bottom sheet, matching this page's own idiom (the button row / nav are the only
     other chrome here), not the web wall's centred dialog. -->
<div class="ov" id="apLvlOv" onclick="if(event.target===this)apLvlClose()">
  <div class="ov-box">
    <h2>Approve <span id="apLvlSym"></span></h2>
    <div class="s" id="apLvlMsg">Set a target and stop loss before this approval completes. Edit or leave blank.</div>
    <div class="s" id="apLvlRef" style="margin-top:4px"></div>
    <div class="ov-row"><span>Target price</span><input class="ov-in" type="number" step="0.05" min="0" inputmode="decimal" id="apLvlTarget" placeholder="optional"></div>
    <div class="ov-row"><span>Stop loss</span><input class="ov-in" type="number" step="0.05" min="0" inputmode="decimal" id="apLvlStop" placeholder="optional"></div>
    <button class="btn2" id="apLvlGo" onclick="apLvlConfirm()" style="margin-top:var(--space-12)">Confirm approval</button>
    <button class="btn2" onclick="apLvlClose()" style="margin-top:var(--space-8);background:transparent">Cancel</button>
  </div>
</div>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
var Q={inst:'',status:'open',eng:'',cursor:'',events:[],aw:null,total:null,reqId:0,hdr:null};   /* cc#2059: reqId discards a stale out-of-order load() response, same pattern cc#2056/cc#2058 already use. cc#2071: hdr caches the last FRESH response's header-only fields, read on an append (Load more) call instead of that response's own (empty) copies -- see draw(). */
function inrS(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v), a=Math.abs(x); var t=a>=1e5?(a/1e5).toFixed(2)+' L':Math.round(a).toLocaleString('en-IN'); return (x<0?'−':(s&&x>0?'+':''))+'₹'+t; }
function tsShort(s){ if(!s) return '—'; s=String(s); return dm(s)+(s.length>=16?' '+s.slice(11,16):''); }
function ref(e){ return e.symbol+'@'+((e.entry&&e.entry.ts)||''); }
function dir(e){ return e.side==='SHORT'?'SELL':'BUY'; }
function stateHtml(e){
  var st=e.state||'', a=e.approval||{};
  if(st==='approved') return '<div class="st ok">APPROVED at '+inrS(a.approved_price)+' · '+esc(tsShort(a.approved_at))+(a.pnl_approved!=null?' · since approval <b class="'+cls(a.pnl_approved)+'">'+inrS(a.pnl_approved,true)+'</b>':'')+'</div>';
  if(st==='dismissed') return '<div class="st mu">DISMISSED'+(a.approved_at?' · '+esc(tsShort(a.approved_at)):'')+'</div>';
  if(st==='suppressed-in-position'){ var h=e.suppressed_by||{}; return '<div class="st mu">Already holding '+esc(h.symbol||e.symbol)+' '+esc(h.side||'')+' via '+esc(h.engine||'')+' — no second entry</div>'; }
  if(st==='not-approval-applicable') return '<div class="st mu">Basket position — no approval needed</div>';
  if(e.src==='alert') return '<div class="st ok">Approved trade</div>';
  if(Q.status!=='open') return '';
  var open=!!(Q.aw&&Q.aw.open);
  return '<div class="act" data-id="'+esc(e.id)+'"><button class="ab ap" data-act="approve"'+(open?'':' disabled')+'>Approve at live</button><button class="ab dm" data-act="dismiss">Dismiss</button><span class="am" id="am-'+esc(e.id)+'">'+(open?'':esc((Q.aw&&Q.aw.reason)||'approvals 09:15–15:15 IST'))+'</span></div>';
}
function row(e){
  var open=e.status==='open', px=open?e.cmp:e.exit_price, pn=e.pnl, tagS=e.side==='SHORT'?'s':'b';
  var sub=esc(e.engine||'')+(e.instrument?' · '+esc(e.instrument.toLowerCase()):'')+' · in '+esc(tsShort(e.entry&&e.entry.ts))+(open?'':' · out '+esc(tsShort(e.exit&&e.exit.ts)))+(e.qty!=null?' · '+(e.qty_basis==='one-lot'?'1 lot ('+e.qty+')':e.qty+' qty'):'')+(e.reversal_of?' · <b>reversal</b>':'');
  var right='<div class="n '+cls(pn)+'">'+(pn!=null?inrS(pn,true):(e.pnl_pct!=null?pct(e.pnl_pct,1):'—'))+'</div><div class="c">'+(e.pnl_pct!=null&&pn!=null?pct(e.pnl_pct,1):(open?(e.pnl_basis||''):(e.result||'')))+'</div>';
  return '<div class="row '+(open?ud(pn):(e.result==='WIN'?'up':(e.result==='LOSS'?'dn':'mu')))+'"><div><div class="nm"><a href="/m/check?sym='+encodeURIComponent(e.symbol)+'">'+esc(e.symbol)+'</a><span class="tag '+tagS+'">'+esc(e.side||'')+'</span></div><div class="sub">'+sub+'</div><div class="px">'+inrS(e.entry_price)+' → <b>'+inrS(px)+'</b>'+(open&&!e.cmp?' <span class="mu2">no live price</span>':'')+(!open&&e.note?' · '+esc(e.note):'')+'</div>'+stateHtml(e)+'</div><div class="v">'+right+'</div></div>';
}
function draw(d, append){
  if(!append){
    Q.events=d.events||[];
    /* cc#2071: cache the header-only fields from THIS fresh response -- the backend only
       populates status_counts/by_engine/approval_counts/scope/counts/instruments/closed_summary
       on a no-cursor request; on a Load-more (cursor) page every one of them comes back empty.
       Reading them straight off d (as before this card) rebuilt the whole chip/status/record
       header from that empty data on every Load-more tap and it visibly vanished -- reproduced
       directly in this card's own test, not assumed from reading the code. */
    Q.hdr={status_counts:d.status_counts||{}, by_engine:d.by_engine||{}, approval_counts:d.approval_counts||{},
           scope:d.scope||'', counts:d.counts||{}, instruments:d.instruments||[], closed_summary:d.closed_summary||[]};
  } else { Q.events=Q.events.concat(d.events||[]); }
  Q.aw=d.approval_window||Q.aw; Q.cursor=d.has_more?d.next_cursor:'';
  var hd=Q.hdr||{};   /* append reads the cached fresh header, never this response's own empty copies */
  var sc=hd.status_counts||{}, eng=hd.by_engine||{}, ac=hd.approval_counts||{};
  document.getElementById('asof').innerHTML='<b>'+(sc.open||0)+'</b> open · '+(sc.closed||0)+' closed · '+esc(hd.scope||'')+(ac.pending!=null?' · <b>'+ac.pending+'</b> waiting for you':'')+(ac.approved_today?' · '+ac.approved_today+' approved today':'');
  var h='<div class="seg" id="st"><span data-v="open"'+(Q.status==='open'?' class="on"':'')+'>Open · '+(sc.open||0)+'</span><span data-v="closed"'+(Q.status==='closed'?' class="on"':'')+'>Closed · '+(sc.closed||0)+'</span></div>';
  var ic=hd.counts||{};
  h+='<div class="chips" id="inst"><span class="chip'+(Q.inst===''?' on':'')+'" data-v="">All</span>'+(hd.instruments||[]).map(function(i){return '<span class="chip'+(Q.inst===i?' on':'')+'" data-v="'+i+'">'+i.charAt(0)+i.slice(1).toLowerCase()+(ic[i]!=null?' · '+ic[i]:'')+'</span>';}).join('')+'</div>';
  var engs=Object.keys(eng); if(engs.length>1) h+='<div class="chips" id="eng" style="padding-top:6px"><span class="chip'+(Q.eng===''?' on':'')+'" data-v="">Every engine</span>'+engs.map(function(k){return '<span class="chip'+(Q.eng===k?' on':'')+'" data-v="'+esc(k)+'">'+esc(k)+' · '+eng[k]+'</span>';}).join('')+'</div>';
  var list=Q.events;   /* cc#2059: server now scopes by engine (Q.eng passed on load()), no client-side re-filter */
  h+='<div class="sec"><h2>'+(Q.status==='open'?'Signals and open trades':'Closed trades')+'</h2><span class="hint">'+list.length+(Q.cursor?'+':'')+' · newest first</span></div>';
  h+= list.length ? '<div class="lst">'+list.map(row).join('')+'</div>' : '<div class="emp"><b>Nothing here</b>No '+Q.status+' trade for this filter since 10 Aug.</div>';
  if(Q.cursor) h+='<div style="margin:10px 16px 0"><button class="btn2" id="more">Load more</button></div>';
  if(Q.status==='closed'&&(hd.closed_summary||[]).length){ var cs=hd.closed_summary; h+='<div class="sec"><h2>Record</h2><span class="hint">wins · losses · flat</span></div><div class="lst">'+cs.map(function(r){return '<div class="lr"><div class="nm">'+esc(r.engine)+'<small> · '+esc(String(r.instrument).toLowerCase())+'</small></div><div class="v"><span class="pos">'+r.wins+'</span> · <span class="neg">'+r.losses+'</span> · '+r.flat+'</div><div class="v '+cls(r.rs_total)+'">'+(r.rs_rows?inrS(r.rs_total,true):'—')+'</div></div>';}).join('')+'</div>'; }
  h+='<div class="note"><b>What this wall is.</b> Every engine signal since 10 Aug, newest first. Approve records the live price and puts the trade in My Alerts; Dismiss hides it. One position per symbol and direction — a second signal on a name you hold is held back and says so. Futures P&L is one lot; equity is the position. Research, not advice.</div>';
  document.getElementById('body').innerHTML=h;
  var seg=function(id,fn){ var el=document.getElementById(id); if(!el) return; el.addEventListener('click', function(ev){ var s=ev.target.closest('[data-v]'); if(!s) return; fn(s.getAttribute('data-v')); }); };
  seg('st', function(v){ Q.status=v; Q.eng=''; load(); }); seg('inst', function(v){ Q.inst=v; load(); }); seg('eng', function(v){ Q.eng=v; load(); });   /* cc#2059: was a client-side re-filter of whatever pages happened to be loaded; now a fresh server-scoped load(), same as st/inst */
  var m=document.getElementById('more'); if(m) m.addEventListener('click', function(){ load(true); });
  document.querySelectorAll('.ab').forEach(function(b){ b.addEventListener('click', function(){
    var a=b.getAttribute('data-act'), id=b.closest('.act').getAttribute('data-id');
    if(a==='approve'){ apLvlOpen(id,b); return; }   /* cc#2027: approve always confirms target/SL first */
    act(a, id, b);
  }); });
}
/* ══ cc#2027: target/SL confirmation sheet on Approve, app surface — same two-call sequence as
   trade_wall_web.html (approve_signal, then approved/levels only if a level was entered), same
   pre-fill source. Dismiss is untouched — no sheet, same act() path as before this card. */
var AP_LVL={id:null,btn:null};
/* cc#2120 Part A: "SYMBOL label, last traded VALUE at HH:MM IST", e.g. "CAMS futures, last
   traded 704.35 at 12:20 IST". rp.label already says when a futures row fell back to spot
   ("spot (no futures bar)") or when nothing resolves, so this never prints a spot number as if
   it were futures. */
function apLvlRefTxt(rp,sym){
  if(!rp) return '';
  if(rp.value==null) return rp.note?esc(rp.note):'';
  /* cc#2120: DAY-PRECISION HONESTY RULE -- a STALE-tier price (raw_prices.price_date, no time
     component) must never print a fabricated HH:MM -- slicing chars 11:16 off a bare 10-char date
     string silently yielded a dangling "at  IST" before this check. */
  var t=!rp.ts?'':(rp.ts_precision==='day'?'on '+rp.ts.slice(0,10):'at '+String(rp.ts).slice(11,16)+' IST');
  var txt=esc(sym)+' '+esc(rp.label)+', last traded '+f2(rp.value)+(t?' '+t:'');
  if(rp.stale) txt+=' · stale (>15 min)';
  return txt;
}
function apLvlOpen(id,btn){
  var e=find(id); if(!e) return;
  if(!(Q.aw&&Q.aw.open)){ var m=document.getElementById('am-'+id); if(m) m.textContent='not recorded: '+((Q.aw&&Q.aw.reason)||'approvals 09:15–15:15 IST'); return; }
  AP_LVL.id=id; AP_LVL.btn=btn;
  document.getElementById('apLvlSym').textContent=e.symbol+' · '+dir(e);
  document.getElementById('apLvlTarget').value=''; document.getElementById('apLvlStop').value='';
  document.getElementById('apLvlGo').disabled=false; document.getElementById('apLvlGo').textContent='Confirm approval';
  document.getElementById('apLvlMsg').textContent='checking '+e.engine+' for a stored level…';
  document.getElementById('apLvlRef').textContent='';
  document.getElementById('apLvlOv').classList.add('open');
  fetch('/api/tradewall/prefill-levels?engine='+encodeURIComponent(e.engine||'')+'&symbol='+encodeURIComponent(e.symbol)+'&entry_ts='+encodeURIComponent((e.entry&&e.entry.ts)||'')+'&instrument='+encodeURIComponent(e.instrument||''),{credentials:'same-origin'})
    .then(function(r){return r.json();}).then(function(d){
      if(AP_LVL.id!==id) return;
      if(d&&d.target_price!=null) document.getElementById('apLvlTarget').value=d.target_price;
      if(d&&d.stop_loss!=null) document.getElementById('apLvlStop').value=d.stop_loss;
      document.getElementById('apLvlMsg').textContent=(d&&(d.target_price!=null||d.stop_loss!=null))?('Pre-filled from '+e.engine+' — edit or leave as is.'):'No stored level for this engine — enter manually or leave blank.';
      document.getElementById('apLvlRef').innerHTML=apLvlRefTxt(d&&d.reference_price,e.symbol);
    }).catch(function(){
      if(AP_LVL.id!==id) return;
      document.getElementById('apLvlMsg').textContent='No stored level for this engine — enter manually or leave blank.';
      document.getElementById('apLvlRef').textContent='';
    });
}
function apLvlClose(){ document.getElementById('apLvlOv').classList.remove('open'); AP_LVL.id=null; AP_LVL.btn=null; }
function apLvlConfirm(){
  var id=AP_LVL.id, btn=AP_LVL.btn, e=id&&find(id); if(!e){ apLvlClose(); return; }
  if(!(Q.aw&&Q.aw.open)){ document.getElementById('apLvlMsg').textContent='not recorded: '+((Q.aw&&Q.aw.reason)||'approvals 09:15–15:15 IST'); return; }
  var tRaw=String(document.getElementById('apLvlTarget').value||'').trim(), sRaw=String(document.getElementById('apLvlStop').value||'').trim();
  if(tRaw!==''&&!(parseFloat(tRaw)>0)){ document.getElementById('apLvlMsg').textContent='target must be a positive number'; return; }
  if(sRaw!==''&&!(parseFloat(sRaw)>0)){ document.getElementById('apLvlMsg').textContent='stop loss must be a positive number'; return; }
  var go=document.getElementById('apLvlGo'); go.disabled=true; go.textContent='Approving…';
  document.getElementById('apLvlMsg').textContent='approving at live price…';
  var wrap=btn&&btn.parentNode; if(wrap) wrap.querySelectorAll('button').forEach(function(b){b.disabled=true;});
  var body={source_engine:e.engine, source_ref:ref(e), symbol:e.symbol, direction:dir(e), kind:'entry', approved_via:'app-wall'};
  fetch('/api/alerts/approve_signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'})
    .then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d};});}).then(function(res){
      var d=res.d||{};
      if(!res.ok||d.error||!d.alert){
        document.getElementById('apLvlMsg').textContent='not recorded: '+(d.detail||d.error||('HTTP '+res.status));
        go.disabled=false; go.textContent='Confirm approval';
        if(wrap) wrap.querySelectorAll('button').forEach(function(b){b.disabled=false;});
        return;
      }
      var a=d.alert; e.state=a.status; e.approval={id:a.id,approved_price:a.approved_price,approved_at:a.approved_at,approved_via:a.approved_via,notes:a.notes};
      var finish=function(rowWarn){ apLvlClose(); load(); if(rowWarn){ var m=document.getElementById('am-'+id); if(m) m.textContent=rowWarn; } };
      var lvl={alert_id:a.id, via:'app-wall'}, has=false;
      if(tRaw!==''){ lvl.target_price=parseFloat(tRaw); has=true; }
      if(sRaw!==''){ lvl.stop_loss=parseFloat(sRaw); has=true; }
      if(!has){ finish(); return; }
      fetch('/api/tradewall/approved/levels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lvl),credentials:'same-origin'})
        .then(function(r2){return r2.json();}).then(function(d2){ finish(d2&&d2.error?('approved — target/SL not saved: '+d2.error+' (set it on the web Approved tab)'):null); })
        .catch(function(){ finish('approved — target/SL not saved: network (set it on the web Approved tab)'); });
    }).catch(function(err){
      document.getElementById('apLvlMsg').textContent='not recorded: '+(err&&err.message?err.message:'network');
      go.disabled=false; go.textContent='Confirm approval';
      if(wrap) wrap.querySelectorAll('button').forEach(function(b){b.disabled=false;});
    });
}
function find(id){ for(var i=0;i<Q.events.length;i++) if(String(Q.events[i].id)===String(id)) return Q.events[i]; return null; }
function act(kind,id,btn){
  var e=find(id); if(!e) return; var msg=document.getElementById('am-'+id), wrap=btn.parentNode;
  if(kind==='approve'&&!(Q.aw&&Q.aw.open)){ if(msg) msg.textContent='not recorded: '+((Q.aw&&Q.aw.reason)||'approvals 09:15–15:15 IST'); return; }
  wrap.querySelectorAll('button').forEach(function(b){b.disabled=true;}); if(msg) msg.textContent=kind==='approve'?'approving at live price…':'dismissing…';
  var body={source_engine:e.engine, source_ref:ref(e), symbol:e.symbol, direction:dir(e), kind:'entry'}; if(kind==='approve') body.approved_via='app-wall'; else body.dismissed_via='app-wall';
  fetch('/api/alerts/'+(kind==='approve'?'approve_signal':'dismiss_signal'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}).then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d};});}).then(function(res){
    var d=res.d||{};
    if(!res.ok||d.error||!d.alert){ if(msg) msg.textContent='not recorded: '+(d.detail||d.error||('HTTP '+res.status)); wrap.querySelectorAll('button').forEach(function(b){b.disabled=false;}); return; }
    var a=d.alert; e.state=a.status; e.approval={id:a.id,approved_price:a.approved_price,approved_at:a.approved_at,approved_via:a.approved_via,notes:a.notes};
    load();
  }).catch(function(){ if(msg) msg.textContent='not recorded: network'; wrap.querySelectorAll('button').forEach(function(b){b.disabled=false;}); });
}
function load(more){
  if(!more) document.getElementById('body').innerHTML='<div class="err">Loading…</div>';
  var myReqId=++Q.reqId;   /* cc#2059: discard a stale response if another load() fires before this one resolves */
  fetch('/api/tradewall?limit=40&status='+Q.status+'&instrument='+encodeURIComponent(Q.inst)+'&engine='+encodeURIComponent(Q.eng)+(more&&Q.cursor?'&cursor='+encodeURIComponent(Q.cursor):''),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(myReqId!==Q.reqId) return; if(d.error&&!(d.events||[]).length){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; } draw(d, !!more); }).catch(function(){ if(myReqId!==Q.reqId) return; document.getElementById('body').innerHTML='<div class="err">Could not load the wall.</div>'; });
}
load();
setInterval(function(){ fetch('/api/alerts/approval_window',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(d&&typeof d.open!=='undefined') Q.aw=d; }).catch(function(){}); }, 60000);
</script>
