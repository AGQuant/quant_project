<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wall of Trades · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
<style>
/* cc#991 · Wall of Trades. Every class is `tw-` prefixed, LEAVES INCLUDED. This app has been bitten
   six times by short generic class names (cc#964 .v/.m, cc#966 .m, cc#967 .v, cc#974 .a, cc#986
   .g/.n/.v), and cc#986 proved that scoping a short name under a prefixed parent is not protection
   — mobile_app.css's own rules still win. */
.tw-card{margin:0 12px 8px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px}
.tw-top{display:flex;align-items:baseline;gap:8px}
.tw-ev{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:800;
  letter-spacing:.11em;padding:3px 7px;border-radius:5px;flex:none}
.tw-in{color:var(--grn);background:rgba(47,212,139,.13)}
.tw-out-up{color:var(--grn);background:rgba(47,212,139,.13)}
.tw-out-dn{color:var(--red);background:rgba(255,92,108,.13)}
.tw-out-flat{color:var(--mut);background:var(--panel2)}
.tw-sym{font-size:14px;font-weight:800;letter-spacing:.01em;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tw-when{margin-left:auto;flex:none;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10.5px;color:var(--dim);text-align:right}
.tw-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:7px}
.tw-chip{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:700;
  letter-spacing:.07em;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);
  color:var(--mut)}
.tw-long{color:var(--grn);border-color:rgba(47,212,139,.4)}
.tw-short{color:var(--red);border-color:rgba(255,92,108,.4)}
.tw-px{margin-top:7px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;
  color:var(--mut);display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.tw-px b{color:var(--txt);font-weight:700}
.tw-pnl{margin-left:auto;font-weight:800;font-size:13px}
.tw-note{margin-top:6px;font-size:10px;color:var(--dim);line-height:1.5}
.tw-day{margin:16px 12px 8px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;
  font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tw-sent{padding:18px 2px;text-align:center;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;color:var(--dim)}
/* cc#1295: i-button (other engines not in the 5 primary buckets — QSR today). */
.tw-ibtn{margin:0 12px 10px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel);color:var(--mut);font-size:11px;font-weight:700;font-family:'IBM Plex Mono',ui-monospace,monospace}
.tw-ov{display:none;position:fixed;inset:0;background:rgba(10,15,30,.6);z-index:9998;
  align-items:center;justify-content:center;padding:20px}
.tw-ov.open{display:flex}
.tw-ov-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:380px;
  width:100%;padding:16px}
.tw-ov-h{font-size:14px;font-weight:800;margin-bottom:2px}
.tw-ov-s{font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.5}
.tw-ov-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);
  font-size:12px}
.tw-ov-row:last-child{border-bottom:none}
.tw-ov-close{margin-top:12px;width:100%}
</style>
</head>
<body>
<!--
  cc#991/cc#1295 — WALL OF TRADES. Every position across the live engines, read-only display over
  /api/tradewall; this page computes no money of its own.

  cc#1295 (founder direct 24-Aug, session_log 30420 WALL_OF_TRADES_GROUPS_V2): STATUS (Open|Closed,
  default Open) -> INSTRUMENT (Futures|Equity) -> tagged ENGINE BUCKETS. Every card is one POSITION
  (entry+exit together when closed), not a flat entry/exit event.

  THE HONESTY RULE THIS PAGE OBEYS AND THE READER CAN CHECK: a day-precision position (quant
  baskets, investment scanner — DATE columns with no time) prints its date alone, never a
  fabricated clock time the database does not hold.
-->
<div class="screen">

  <div class="head">
    <h1>Wall of Trades</h1>
    <div class="s" id="sub">loading…</div>
  </div>

  <div class="chips" id="chipsStatus"></div>
  <div class="chips" id="chipsInstrument"></div>
  <div class="chips" id="chipsBucket"></div>
  <button class="tw-ibtn" onclick="openOther()" title="Other engines not in the 5 primary buckets">i &middot; other engines</button>

  <div class="body" id="body">
    <div class="loading">Loading every trade…</div>
  </div>

  <div class="cover" id="cover"></div>
</div>

<div class="tw-ov" id="otherOv" onclick="if(event.target===this)closeOther()">
  <div class="tw-ov-box">
    <div class="tw-ov-h">Other engines</div>
    <div class="tw-ov-s">Engines with a real trade book that are not one of the 5 primary buckets above.</div>
    <div id="otherBody">Loading…</div>
    <button class="chip tw-ov-close" onclick="closeOther()">Close</button>
  </div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/alerts"><span class="i">◬</span>Alerts</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
/* The bottom nav stays FIVE items (card do_not_touch). This page is reached from the home tools
   grid and the /m/v8 More stack, so no tab is marked active — marking one would tell the reader
   they are somewhere they are not. */
/* cc#1295 (founder direct 24-Aug, session_log 30420 WALL_OF_TRADES_GROUPS_V2): the wall moved from
   four flat groups + an Entry/Exit event toggle to STATUS (Open|Closed, default Open) ->
   INSTRUMENT (Futures|Equity) -> tagged ENGINE BUCKETS. Every card is now one POSITION (entry+
   exit together when closed), not a flat entry/exit event — see trade_wall_endpoints.py for why. */
var BUCKETS = { FUTURES: ['V8', 'TC Scanner', 'Index Intel'], EQUITY: ['QB Basket', 'Investment Scanner'] };
var STATE = { events: [], counts: {}, statusCounts: {}, byEngine: {}, total: null,
              status: 'open', instrument: 'FUTURES', bucket: 'V8', asOf: null };
var PAGE  = { cursor: null, more: true, busy: false, obs: null };
var LIMIT = 40;

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x < 0 ? '−' : '') + '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
function pctFmt(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x >= 0 ? '+' : '') + x.toFixed(2) + '%';
}
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return x < 100 ? x.toFixed(2) : Math.round(x).toLocaleString('en-IN');
}
function qty(v){
  if (v === null || v === undefined || isNaN(Number(v))) return null;
  return Math.round(Number(v)).toLocaleString('en-IN');
}

function evClass(e){
  if (e.status === 'open') return 'tw-in';
  if (e.pnl === null || e.pnl === undefined) {
    if (e.pnl_pct === null || e.pnl_pct === undefined) return 'tw-out-flat';
    return Number(e.pnl_pct) > 0 ? 'tw-out-up' : (Number(e.pnl_pct) < 0 ? 'tw-out-dn' : 'tw-out-flat');
  }
  return Number(e.pnl) > 0 ? 'tw-out-up' : (Number(e.pnl) < 0 ? 'tw-out-dn' : 'tw-out-flat');
}

function card(e){
  var sideCls = e.side === 'SHORT' ? 'tw-short' : 'tw-long';
  var isClosed = e.status === 'closed';
  /* cc#1295 verify 5: Closed cards always carry realised P&L — pnl (rupees) when the engine
     sizes positions, else pnl_pct for a signal-only engine (TC Scanner/Investment Scanner).
     An em-dash appears only when the source data itself is incomplete, never fabricated. */
  var pnlHtml = '';
  if (isClosed){
    if (e.pnl !== null && e.pnl !== undefined)
      pnlHtml = '<span class="tw-pnl ' + (Number(e.pnl) >= 0 ? 'pos' : 'neg') + '">' + inr(e.pnl) + '</span>';
    else if (e.pnl_pct !== null && e.pnl_pct !== undefined)
      pnlHtml = '<span class="tw-pnl ' + (Number(e.pnl_pct) >= 0 ? 'pos' : 'neg') + '">' + pctFmt(e.pnl_pct) + '</span>';
    else
      pnlHtml = '<span class="tw-pnl">--</span>';
  }
  var h = '<div class="tw-card slab dense">'
    + '<div class="tw-top">'
      + '<span class="tw-ev ' + evClass(e) + '">' + esc(e.status.toUpperCase()) + '</span>'
      + '<span class="tw-sym">' + esc(e.symbol) + '</span>'
      /* day-precision (quant baskets, investment scanner) prints a date only, no invented clock time */
      + '<span class="tw-when">' + esc(isClosed ? (e.exit.when_full || '--') : (e.entry.when_full || '--')) + '</span>'
    + '</div>'
    + '<div class="tw-meta">'
      + '<span class="tw-chip ' + sideCls + '">' + esc(e.side || '--') + '</span>'
      + '<span class="tw-chip">' + esc(e.engine) + '</span>'
      + (e.result ? '<span class="tw-chip">' + esc(e.result) + '</span>' : '')
    + '</div>'
    + '<div class="tw-px"><span>entry <b>' + px(e.entry_price) + '</b></span>'
      + (isClosed ? '<span>exit <b>' + px(e.exit_price) + '</b></span>' : (qty(e.qty) ? '<span>qty <b>' + qty(e.qty) + '</b></span>' : ''))
      + pnlHtml
    + '</div>';
  if (e.note) h += '<div class="tw-note">' + esc(e.note) + '</div>';
  return h + '</div>';
}

function bucketView(){
  return STATE.events.filter(function(e){ return e.engine === STATE.bucket; });
}

function feedHtml(list){
  var h = '', day = null;
  list.forEach(function(e){
    if (e.day !== day){ day = e.day; h += '<div class="tw-day">' + esc(day || 'undated') + '</div>'; }
    h += card(e);
  });
  return h;
}

function statusChipsHtml(){
  return ['open','closed'].map(function(k){
    var n = (STATE.statusCounts || {})[k];
    return '<button class="chip' + (k === STATE.status ? ' on' : '') + '" onclick="pickStatus(\'' + k + '\')">'
      + (k === 'open' ? 'Open' : 'Closed') + (n == null ? '' : ' <span class="n">' + n + '</span>') + '</button>';
  }).join('');
}
function instrumentChipsHtml(){
  return ['FUTURES','EQUITY'].map(function(k){
    return '<button class="chip' + (k === STATE.instrument ? ' on' : '') + '" onclick="pickInstrument(\'' + k + '\')">'
      + (k.charAt(0) + k.slice(1).toLowerCase()) + '</button>';
  }).join('');
}
function bucketChipsHtml(){
  var list = BUCKETS[STATE.instrument] || [];
  return list.map(function(eng){
    var n = ((STATE.byEngine || {})[eng] || {})[STATE.status] || 0;
    return '<button class="chip' + (eng === STATE.bucket ? ' on' : '') + '" onclick="pickBucket(\'' + eng + '\')">'
      + esc(eng) + ' <span class="n">' + n + '</span></button>';
  }).join('');
}

function sentinelHtml(){
  if (!PAGE.more) return '<div class="tw-sent" id="sentinel">That is the whole wall for this filter.</div>';
  return '<div class="tw-sent" id="sentinel">' + (PAGE.busy ? 'Loading more…' : ' ') + '</div>';
}

function render(){
  document.getElementById('sub').textContent =
    (STATE.total == null ? '--' : STATE.total) + ' positions since 10 Aug 2026, '
    + STATE.status + ', ' + STATE.bucket;
  document.getElementById('chipsStatus').innerHTML = statusChipsHtml();
  document.getElementById('chipsInstrument').innerHTML = instrumentChipsHtml();
  document.getElementById('chipsBucket').innerHTML = bucketChipsHtml();
  var body = document.getElementById('body');
  var view = bucketView();
  if (!view.length){
    /* cc#1295 verify 7: Investment Scanner's Closed bucket is expected to render empty for some
       time — the engine landed its first signal today, no exits proven yet. Honest, not an error. */
    var msg = 'No ' + STATE.status + ' positions for ' + esc(STATE.bucket) + '.';
    if (STATE.bucket === 'Investment Scanner' && STATE.status === 'closed'){
      msg = 'The engine landed its first signal today and has not closed a position yet.';
    }
    body.innerHTML = '<div class="empty"><b>Nothing here yet</b>' + msg + '</div>' + sentinelHtml();
  } else {
    body.innerHTML = feedHtml(view) + sentinelHtml();
  }
  updateCover();
  armSentinel();
}

function updateCover(){
  var el = document.getElementById('cover');
  if (!el) return;
  var view = bucketView();
  var of = ((STATE.byEngine || {})[STATE.bucket] || {})[STATE.status];
  el.textContent = 'showing ' + view.length + ' of ' + (of == null ? '--' : of);
}

/* ══ INFINITE SCROLL — cc#983's pattern, reused, not reinvented ══════════════════════════════
   Keyset cursor, IntersectionObserver with a 400px rootMargin so the wait is invisible, and an
   APPEND rather than a re-render so a scroll never throws away the DOM under the reader's thumb.

   The server call is scoped to (instrument, status); the ENGINE BUCKET is a display filter over
   what that call already returned (cc#1295 — one instrument holds 2-3 buckets, not worth a
   separate fetch per bucket). appendCards() below filters fresh rows by bucket the same way
   render() does, so a scroll and a bucket switch never disagree about what should be on screen. */
function armSentinel(){
  if (PAGE.obs){ PAGE.obs.disconnect(); PAGE.obs = null; }
  var el = document.getElementById('sentinel');
  if (!el || !PAGE.more) return;
  if (!('IntersectionObserver' in window)) return;   // no observer: the page stays one-shot
  PAGE.obs = new IntersectionObserver(function(entries){
    if (entries.some(function(x){ return x.isIntersecting; })) loadMore();
  }, {rootMargin: '400px'});
  PAGE.obs.observe(el);
}

function url(cursor){
  var u = '/api/tradewall?limit=' + LIMIT + '&instrument=' + encodeURIComponent(STATE.instrument)
        + '&status=' + encodeURIComponent(STATE.status);
  if (cursor) u += '&cursor=' + encodeURIComponent(cursor);
  return u;
}

function loadMore(){
  if (PAGE.busy || !PAGE.more || !PAGE.cursor) return;
  PAGE.busy = true;
  var s = document.getElementById('sentinel');
  if (s) s.textContent = 'Loading more…';
  fetchWithTimeout(url(PAGE.cursor))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      PAGE.cursor = d.next_cursor || null;
      PAGE.more   = !!(d.has_more && d.next_cursor);
      /* de-dupe by id even though a keyset cursor should make repeats impossible — a duplicate
         card is the one failure a reader would actually SEE, so it is cheap insurance. */
      var seen = {};
      STATE.events.forEach(function(e){ seen[e.id] = 1; });
      var fresh = (d.events || []).filter(function(e){ return !seen[e.id]; });
      appendCards(fresh.filter(function(e){ return e.engine === STATE.bucket; }));
      STATE.events = STATE.events.concat(fresh);
      PAGE.busy = false;
      var s2 = document.getElementById('sentinel');
      if (s2) s2.outerHTML = sentinelHtml();
      updateCover();
      armSentinel();
    })
    .catch(function(){
      PAGE.busy = false;
      var s3 = document.getElementById('sentinel');
      if (s3) s3.innerHTML = 'Could not load more · '
        + '<button class="chip" onclick="loadMore()">Retry</button>';
    });
}

function appendCards(fresh){
  if (!fresh.length) return;
  var body = document.getElementById('body');
  var sent = document.getElementById('sentinel');
  /* the day heading only repeats when the day actually changes across the join, so an appended
     page cannot print a second heading for the day already on screen */
  var view = bucketView();
  var lastDay = view.length ? view[view.length - 1].day : null;
  var h = '', day = lastDay;
  fresh.forEach(function(e){
    if (e.day !== day){ day = e.day; h += '<div class="tw-day">' + esc(day || 'undated') + '</div>'; }
    h += card(e);
  });
  var frag = document.createElement('div');
  frag.innerHTML = h;
  while (frag.firstChild) body.insertBefore(frag.firstChild, sent);
}

function pickStatus(k){
  if (k === STATE.status) return;
  STATE.status = k; STATE.events = [];
  PAGE.cursor = null; PAGE.more = true; PAGE.busy = false;
  document.getElementById('body').innerHTML = '<div class="loading">Loading…</div>';
  boot(true);
}
function pickInstrument(k){
  if (k === STATE.instrument) return;
  STATE.instrument = k; STATE.bucket = (BUCKETS[k] || [])[0];
  STATE.events = []; PAGE.cursor = null; PAGE.more = true; PAGE.busy = false;
  document.getElementById('body').innerHTML = '<div class="loading">Loading…</div>';
  boot(true);
}
function pickBucket(eng){
  if (eng === STATE.bucket) return;
  /* display filter over what is already loaded for this instrument+status — no refetch */
  STATE.bucket = eng;
  render();
}

function boot(keepCounts){
  fetchWithTimeout(url(null))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      STATE.events = d.events || [];
      /* counts are head-of-feed values over the WHOLE wall, so a filter switch keeps the ones
         it already has rather than blanking the chips. by_engine is refreshed every call since
         it is what each bucket chip needs for its own live count under the active status. */
      if (!keepCounts || STATE.total == null){
        STATE.counts = d.counts || {};
        STATE.statusCounts = d.status_counts || {};
        STATE.total  = d.total;
      }
      STATE.byEngine = d.by_engine || {};
      STATE.asOf  = d.as_of;
      PAGE.cursor = d.next_cursor || null;
      PAGE.more   = !!(d.has_more && d.next_cursor);
      render();
    })
    .catch(function(e){
      document.getElementById('body').innerHTML =
        '<div class="empty"><b>Could not load the wall</b>' + esc(e.message)
        + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
      document.getElementById('sub').textContent = 'failed to load';
    });
}

/* cc#1295: the i-button — engines with a real book that are not one of the 5 primary buckets
   (QSR today, any future minor engine the same way). Loaded lazily on first open, not on boot. */
var OTHER_LOADED = false;
function openOther(){
  document.getElementById('otherOv').classList.add('open');
  if (OTHER_LOADED) return;
  fetchWithTimeout('/api/tradewall/other-engines')
    .then(function(r){ return r.json(); })
    .then(function(d){
      OTHER_LOADED = true;
      var list = d.engines || [];
      document.getElementById('otherBody').innerHTML = list.length
        ? list.map(function(e){
            return '<div class="tw-ov-row"><span>' + esc(e.name) + '</span>'
              + '<span>' + e.open + ' open &middot; ' + e.closed + ' closed</span></div>';
          }).join('')
        : '<div class="empty">No other engines with a trade book right now.</div>';
    })
    .catch(function(e){
      document.getElementById('otherBody').innerHTML =
        '<div class="empty">Could not load — ' + esc(e.message) + '</div>';
    });
}
function closeOther(){ document.getElementById('otherOv').classList.remove('open'); }
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeOther();
});

boot(false);
</script>
</body>
</html>
