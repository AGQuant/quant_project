<style>

.hero{margin:var(--space-12) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-16);padding:var(--space-14);position:relative;overflow:hidden}

.row .nm{font-size:var(--type-125);font-weight:800}.row .nm .tag{display:inline-block;font-size:var(--type-8);font-weight:800;letter-spacing:var(--track-em8);text-transform:uppercase;padding:var(--space-1) var(--space-5);border-radius:var(--radius-8);background:var(--hi);border:var(--bw-1) solid var(--edge);color:var(--muted);margin-left:var(--space-5);vertical-align:middle}

.emp{margin:var(--space-10) var(--space-16) 0;background:var(--panel);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);font-size:var(--type-115);color:var(--muted);line-height:1.6}.emp b{display:block;color:var(--ink);font-size:var(--type-125);font-weight:700;margin-bottom:var(--space-5)}
.card{margin:var(--space-12) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);padding:var(--space-12) var(--space-13)}
.ch{display:flex;align-items:baseline;justify-content:space-between}.ch .t{font-size:var(--type-11);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em11)}.ch .n{font-size:var(--type-11);color:var(--muted)}
.rule{font-size:var(--type-125);line-height:1.6;margin-top:var(--space-8)}.rule b{color:var(--brand)}.rule.mu{color:var(--muted);font-size:var(--type-115)}
.more{font-size:var(--type-11);color:var(--muted);padding:var(--space-8) var(--space-16) 0}.more a{color:var(--brand);font-weight:700;text-decoration:none}
.chips{display:flex;gap:var(--space-6);overflow-x:auto;padding:var(--space-4) var(--space-16) 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:var(--type-10);font-weight:700;color:var(--muted);padding:var(--space-4) var(--space-9);border-radius:var(--radius-20);border:var(--bw-1) solid var(--edge);background:var(--panel)}.chip.on{color:var(--brand);background:color-mix(in srgb, var(--brand) 14%, var(--panel));border-color:color-mix(in srgb, var(--brand) 55%, transparent)}
.gates{display:inline-flex;gap:var(--space-2);vertical-align:middle;margin-left:var(--space-4)}.gates i{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--edge)}.gates i.ok{background:var(--win)}
.note{margin:var(--space-22) var(--space-16) var(--space-8);padding:var(--space-12) var(--space-14);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--muted);line-height:1.65}.note b{color:var(--ink)}
.err{margin:var(--space-16);color:var(--muted);font-size:var(--type-12);text-align:center}
.row{grid-template-columns:1fr 84px}.row .nm a{color:inherit;text-decoration:none}
.px{font-size:var(--type-105);color:var(--muted);margin-top:var(--space-3)}.px b{color:var(--ink);font-weight:800}.mu2{font-size:var(--type-9)}
.st{font-size:var(--type-95);font-weight:700;margin-top:var(--space-5);color:var(--muted)}.st.ok{color:var(--win)}.st b{color:inherit}
.act{display:flex;gap:var(--space-6);align-items:center;margin-top:var(--space-7);flex-wrap:wrap}
.ab{font:inherit;font-size:var(--type-10);font-weight:800;letter-spacing:var(--track-em8);text-transform:uppercase;padding:var(--space-6) var(--space-10);border-radius:var(--radius-10);cursor:pointer}
.ab.ap{background:var(--brand);color:var(--field);border:none}.ab.ap[disabled]{opacity:.35}.ab.dm{background:var(--hi);color:var(--muted);border:var(--bw-1) solid var(--edge)}
.am{font-size:var(--type-9);color:var(--muted)}
.btn2{display:block;width:100%;text-align:center;padding:var(--space-10);border-radius:var(--radius-12);font:inherit;font-size:var(--type-115);font-weight:800;background:var(--hi);color:var(--brand);border:var(--bw-1) solid var(--edge)}
.lr{display:grid;grid-template-columns:1fr 84px 80px;gap:var(--space-8);align-items:center;padding:var(--space-8) var(--space-12);border-bottom:var(--bw-1) solid var(--hi)}.lr:last-child{border-bottom:none}
.lr .nm{font-size:var(--type-115);font-weight:800}.lr .nm small{color:var(--muted);font-weight:600;font-size:var(--type-9)}.lr .v{text-align:right;font-size:var(--type-115);font-weight:800}
</style>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
var Q={inst:'',status:'open',eng:'',cursor:'',events:[],aw:null,total:null};
function inrS(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v), a=Math.abs(x); var t=a>=1e5?(a/1e5).toFixed(2)+' L':Math.round(a).toLocaleString('en-IN'); return (x<0?'−':(s&&x>0?'+':''))+'₹'+t; }
function tsShort(s){ if(!s) return '—'; s=String(s); return dm(s)+(s.length>=16?' '+s.slice(11,16):''); }
function ref(e){ return e.symbol+'@'+((e.entry&&e.entry.ts)||''); }
function dir(e){ return e.side==='SHORT'?'SELL':'BUY'; }
function stateHtml(e){
  var st=e.state||'', a=e.approval||{};
  if(st==='approved') return '<div class="st ok">APPROVED at '+inrS(a.approved_price)+' · '+esc(tsShort(a.approved_at))+(a.pnl_approved!=null?' · since approval <b class="'+cls(a.pnl_approved)+'">'+inrS(a.pnl_approved,true)+'</b>':'')+'</div>';
  if(st==='dismissed') return '<div class="st mu">DISMISSED'+(a.approved_at?' · '+esc(tsShort(a.approved_at)):'')+'</div>';
  if(st==='suppressed-in-position'){ var h=e.suppressed_by||{}; return '<div class="st mu">Already holding '+esc(h.symbol||e.symbol)+' '+esc(h.side||'')+' via '+esc(h.engine||'')+' — no second entry</div>'; }
  if(st==='not-approval-applicable') return '<div class="st mu">Basket position — no approval needed</div>';
  if(e.src==='alert') return '<div class="st ok">Approved trade</div>';
  if(Q.status!=='open') return '';
  var open=!!(Q.aw&&Q.aw.open);
  return '<div class="act" data-id="'+esc(e.id)+'"><button class="ab ap" data-act="approve"'+(open?'':' disabled')+'>Approve at live</button><button class="ab dm" data-act="dismiss">Dismiss</button><span class="am" id="am-'+esc(e.id)+'">'+(open?'':esc((Q.aw&&Q.aw.reason)||'approvals 09:15–15:15 IST'))+'</span></div>';
}
function row(e){
  var open=e.status==='open', px=open?e.cmp:e.exit_price, pn=e.pnl, tagS=e.side==='SHORT'?'s':'b';
  var sub=esc(e.engine||'')+(e.instrument?' · '+esc(e.instrument.toLowerCase()):'')+' · in '+esc(tsShort(e.entry&&e.entry.ts))+(open?'':' · out '+esc(tsShort(e.exit&&e.exit.ts)))+(e.qty!=null?' · '+(e.qty_basis==='one-lot'?'1 lot ('+e.qty+')':e.qty+' qty'):'')+(e.reversal_of?' · <b>reversal</b>':'');
  var right='<div class="n '+cls(pn)+'">'+(pn!=null?inrS(pn,true):(e.pnl_pct!=null?pct(e.pnl_pct,1):'—'))+'</div><div class="c">'+(e.pnl_pct!=null&&pn!=null?pct(e.pnl_pct,1):(open?(e.pnl_basis||''):(e.result||'')))+'</div>';
  return '<div class="row '+(open?ud(pn):(e.result==='WIN'?'up':(e.result==='LOSS'?'dn':'mu')))+'"><div><div class="nm"><a href="/m/check?sym='+encodeURIComponent(e.symbol)+'">'+esc(e.symbol)+'</a><span class="tag '+tagS+'">'+esc(e.side||'')+'</span></div><div class="sub">'+sub+'</div><div class="px">'+inrS(e.entry_price)+' → <b>'+inrS(px)+'</b>'+(open&&!e.cmp?' <span class="mu2">no live price</span>':'')+(!open&&e.note?' · '+esc(e.note):'')+'</div>'+stateHtml(e)+'</div><div class="v">'+right+'</div></div>';
}
function draw(d, append){
  if(!append){ Q.events=d.events||[]; } else { Q.events=Q.events.concat(d.events||[]); }
  Q.aw=d.approval_window||Q.aw; Q.cursor=d.has_more?d.next_cursor:'';
  var sc=d.status_counts||{}, eng=d.by_engine||{}, ac=d.approval_counts||{};
  document.getElementById('asof').innerHTML='<b>'+(sc.open||0)+'</b> open · '+(sc.closed||0)+' closed · '+esc(d.scope||'')+(ac.pending!=null?' · <b>'+ac.pending+'</b> waiting for you':'')+(ac.approved_today?' · '+ac.approved_today+' approved today':'');
  var h='<div class="seg" id="st"><span data-v="open"'+(Q.status==='open'?' class="on"':'')+'>Open · '+(sc.open||0)+'</span><span data-v="closed"'+(Q.status==='closed'?' class="on"':'')+'>Closed · '+(sc.closed||0)+'</span></div>';
  var ic=d.counts||{};
  h+='<div class="chips" id="inst"><span class="chip'+(Q.inst===''?' on':'')+'" data-v="">All</span>'+(d.instruments||[]).map(function(i){return '<span class="chip'+(Q.inst===i?' on':'')+'" data-v="'+i+'">'+i.charAt(0)+i.slice(1).toLowerCase()+(ic[i]!=null?' · '+ic[i]:'')+'</span>';}).join('')+'</div>';
  var engs=Object.keys(eng); if(engs.length>1) h+='<div class="chips" id="eng" style="padding-top:6px"><span class="chip'+(Q.eng===''?' on':'')+'" data-v="">Every engine</span>'+engs.map(function(k){return '<span class="chip'+(Q.eng===k?' on':'')+'" data-v="'+esc(k)+'">'+esc(k)+' · '+eng[k]+'</span>';}).join('')+'</div>';
  var list=Q.eng?Q.events.filter(function(e){return e.engine===Q.eng;}):Q.events;
  h+='<div class="sec"><h2>'+(Q.status==='open'?'Signals and open trades':'Closed trades')+'</h2><span class="hint">'+list.length+(Q.cursor?'+':'')+' · newest first</span></div>';
  h+= list.length ? '<div class="lst">'+list.map(row).join('')+'</div>' : '<div class="emp"><b>Nothing here</b>No '+Q.status+' trade for this filter since 10 Aug.</div>';
  if(Q.cursor) h+='<div style="margin:10px 16px 0"><button class="btn2" id="more">Load more</button></div>';
  if(Q.status==='closed'&&(d.closed_summary||[]).length){ var cs=d.closed_summary; h+='<div class="sec"><h2>Record</h2><span class="hint">wins · losses · flat</span></div><div class="lst">'+cs.map(function(r){return '<div class="lr"><div class="nm">'+esc(r.engine)+'<small> · '+esc(String(r.instrument).toLowerCase())+'</small></div><div class="v"><span class="pos">'+r.wins+'</span> · <span class="neg">'+r.losses+'</span> · '+r.flat+'</div><div class="v '+cls(r.rs_total)+'">'+(r.rs_rows?inrS(r.rs_total,true):'—')+'</div></div>';}).join('')+'</div>'; }
  h+='<div class="note"><b>What this wall is.</b> Every engine signal since 10 Aug, newest first. Approve records the live price and puts the trade in My Alerts; Dismiss hides it. One position per symbol and direction — a second signal on a name you hold is held back and says so. Futures P&L is one lot; equity is the position. Research, not advice.</div>';
  document.getElementById('body').innerHTML=h;
  var seg=function(id,fn){ var el=document.getElementById(id); if(!el) return; el.addEventListener('click', function(ev){ var s=ev.target.closest('[data-v]'); if(!s) return; fn(s.getAttribute('data-v')); }); };
  seg('st', function(v){ Q.status=v; Q.eng=''; load(); }); seg('inst', function(v){ Q.inst=v; load(); }); seg('eng', function(v){ Q.eng=v; draw({events:[],status_counts:sc,by_engine:eng,counts:ic,instruments:d.instruments,scope:d.scope,approval_counts:ac,closed_summary:d.closed_summary,approval_window:Q.aw,has_more:!!Q.cursor,next_cursor:Q.cursor}, true); });
  var m=document.getElementById('more'); if(m) m.addEventListener('click', function(){ load(true); });
  document.querySelectorAll('.ab').forEach(function(b){ b.addEventListener('click', function(){ act(b.getAttribute('data-act'), b.closest('.act').getAttribute('data-id'), b); }); });
}
function find(id){ for(var i=0;i<Q.events.length;i++) if(String(Q.events[i].id)===String(id)) return Q.events[i]; return null; }
function act(kind,id,btn){
  var e=find(id); if(!e) return; var msg=document.getElementById('am-'+id), wrap=btn.parentNode;
  if(kind==='approve'&&!(Q.aw&&Q.aw.open)){ if(msg) msg.textContent='not recorded: '+((Q.aw&&Q.aw.reason)||'approvals 09:15–15:15 IST'); return; }
  wrap.querySelectorAll('button').forEach(function(b){b.disabled=true;}); if(msg) msg.textContent=kind==='approve'?'approving at live price…':'dismissing…';
  var body={source_engine:e.engine, source_ref:ref(e), symbol:e.symbol, direction:dir(e), kind:'entry'}; if(kind==='approve') body.approved_via='app-wall'; else body.dismissed_via='app-wall';
  fetch('/api/alerts/'+(kind==='approve'?'approve_signal':'dismiss_signal'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}).then(function(r){return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d};});}).then(function(res){
    var d=res.d||{};
    if(!res.ok||d.error||!d.alert){ if(msg) msg.textContent='not recorded: '+(d.detail||d.error||('HTTP '+res.status)); wrap.querySelectorAll('button').forEach(function(b){b.disabled=false;}); return; }
    var a=d.alert; e.state=a.status; e.approval={id:a.id,approved_price:a.approved_price,approved_at:a.approved_at,approved_via:a.approved_via,notes:a.notes};
    load();
  }).catch(function(){ if(msg) msg.textContent='not recorded: network'; wrap.querySelectorAll('button').forEach(function(b){b.disabled=false;}); });
}
function load(more){
  if(!more) document.getElementById('body').innerHTML='<div class="err">Loading…</div>';
  fetch('/api/tradewall?limit=40&status='+Q.status+'&instrument='+encodeURIComponent(Q.inst)+(more&&Q.cursor?'&cursor='+encodeURIComponent(Q.cursor):''),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(d.error&&!(d.events||[]).length){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; } draw(d, !!more); }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the wall.</div>'; });
}
load();
setInterval(function(){ fetch('/api/alerts/approval_window',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(d&&typeof d.open!=='undefined') Q.aw=d; }).catch(function(){}); }, 60000);
</script>
