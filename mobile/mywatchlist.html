     honest-empty page: the store now exists (user_watchlists / user_watchlist_items, watchlist_app_mobile.py). Header + "＋ New"

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'mw-pos':(Number(v)<0?'mw-neg':'')); }
function f1(v){ return v==null||isNaN(Number(v))?'—':Number(v).toFixed(1); } function f2(v){ return v==null||isNaN(Number(v))?'—':Number(v).toFixed(2); }
function inr(v){ if(v==null||isNaN(Number(v))) return '—'; return '₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:2}); }
var API='/api/mobile/watchlists', D=null, SHEET=null;
function api(url,opts){ opts=opts||{}; opts.credentials='same-origin'; if(opts.body&&typeof opts.body!=='string'){ opts.headers={'Content-Type':'application/json'}; opts.body=JSON.stringify(opts.body); } return fetch(url,opts).then(function(r){ return r.json().then(function(d){ if(!r.ok||(d&&d.error)) throw new Error((d&&(d.error||d.detail))||('HTTP '+r.status)); return d; }); }); }
function toast(m){ var t=document.createElement('div'); t.className='mw-toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2200); }
function closeSheet(){ if(SHEET){ SHEET.remove(); SHEET=null; } }
function sheet(html, tall){ closeSheet(); SHEET=document.createElement('div'); SHEET.className='mw-ov'; SHEET.innerHTML='<div class="mw-sheet'+(tall?' mw-tall':'')+'" role="dialog" aria-modal="true">'+html+'</div>'; SHEET.addEventListener('click', function(e){ if(e.target===SHEET) closeSheet(); }); var x=SHEET.querySelector('.mw-x'); if(x) x.addEventListener('click', closeSheet); document.body.appendChild(SHEET); return SHEET; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
/* ═══ the rail ═══ */
function card(l){
  var mv=l.top_mover, line = l.count ? (l.priced ? 'avg day <b class="'+cls(l.avg_day_pct)+'">'+pct(l.avg_day_pct,2)+'</b>'+(mv?' · top <b>'+esc(mv.symbol)+'</b> <span class="'+cls(mv.day_pct)+'">'+pct(mv.day_pct,2)+'</span>':'') : 'no live prices yet') : 'empty — tap + on any stock card';
  return '<div class="mw-c" data-id="'+l.id+'" role="button" tabindex="0"><div class="mw-ceye"><span>Watchlist · '+(l.count||0)+' name'+(l.count===1?'':'s')+'</span><button class="mw-more" type="button" data-more="'+l.id+'" aria-label="Rename or delete '+esc(l.name)+'">⋯</button></div><div class="mw-nm">'+esc(l.name)+'</div><div class="mw-sub">'+line+'</div><div class="mw-acc"><span>'+(l.count?esc((l.symbols||[]).slice(0,4).join(' · '))+((l.symbols||[]).length>4?' · +'+((l.symbols||[]).length-4):''):'&nbsp;')+'</span><b>Open ›</b></div></div>';
}
function render(){
  var lists=D.lists||[], names=lists.reduce(function(t,l){ return t+(l.count||0); },0);
  document.getElementById('mw-sub').textContent=lists.length+' of '+(D.max||5)+' lists · '+names+' name'+(names===1?'':'s');
  var nb=document.getElementById('mw-new'); nb.disabled=!D.can_create; nb.title=D.can_create?'New watchlist':(D.max||5)+' of '+(D.max||5)+' used — delete one to make room';
  document.getElementById('mw-asof').innerHTML=lists.length?'<b>'+lists.length+'</b> watchlist'+(lists.length===1?'':'s')+' · prices live · tap a list for its names':'Your own lists, up to '+(D.max||5);
  var host=document.getElementById('mw-body');
  if(!lists.length){ host.innerHTML='<div class="mw-emp">No watchlists yet — tap + on any stock card<span class="mw-mu">Up to '+(D.max||5)+' lists, named by you: Trading, Investment, Sell…</span><button class="mw-btn" type="button" id="mw-new2">＋ New watchlist</button></div>'; document.getElementById('mw-new2').addEventListener('click', openNew); return; }
  host.innerHTML='<div class="mw-rail" id="mw-rail">'+lists.map(card).join('')+'</div><div class="mw-hint">Tap a list for its names · hold a card, or ⋯, to rename or delete</div><div class="mw-note"><b>What each row shows.</b> Rating = the latest GVM score, CMP = the live price, day % vs the previous close, and the % since you added the name. Swipe a row left to remove it.</div>';
  host.querySelectorAll('[data-more]').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); openMore(Number(b.getAttribute('data-more'))); }); });
  host.querySelectorAll('.mw-c').forEach(function(c){ var id=Number(c.getAttribute('data-id')), t=null, held=false;
    var start=function(){ held=false; clearTimeout(t); t=setTimeout(function(){ held=true; openMore(id); },550); }, stop=function(){ clearTimeout(t); };
    c.addEventListener('touchstart', start, {passive:true}); c.addEventListener('touchend', stop); c.addEventListener('touchmove', stop); c.addEventListener('touchcancel', stop); c.addEventListener('mousedown', start); c.addEventListener('mouseup', stop); c.addEventListener('mouseleave', stop); c.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    c.addEventListener('click', function(e){ if(held){ held=false; return; } if(e.target.closest('[data-more]')) return; openList(id); });
    c.addEventListener('keydown', function(e){ if(e.key==='Enter') openList(id); });
  });
}
function load(){ return api(API).then(function(d){ D=d; render(); }).catch(function(e){ document.getElementById('mw-body').innerHTML='<div class="mw-err">Could not load your watchlists: '+esc(e.message)+'</div>'; }); }
/* ═══ new / rename / delete ═══ */
function openNew(){
  if(D&&!D.can_create){ toast((D.max||5)+' of '+(D.max||5)+' watchlists used — delete one to make room.'); return; }
  var s=sheet('<div class="mw-sh"><div class="mw-st">New watchlist<b>Name it</b></div><button class="mw-x" type="button" aria-label="Close">×</button></div><div class="mw-body"><div class="mw-form"><input id="mw-name" maxlength="40" placeholder="Trading, Investment, Sell…" autocomplete="off"><button type="button" id="mw-make">Create</button></div><div class="mw-msg" id="mw-msg">Up to 40 characters. Then tap + on any stock card to fill it.</div></div>');
  var go=function(){ var name=(document.getElementById('mw-name').value||'').trim(); var m=document.getElementById('mw-msg'); if(!name){ m.textContent='Give the watchlist a name.'; m.className='mw-msg mw-bad'; return; } m.textContent='Creating…'; m.className='mw-msg'; api(API,{method:'POST',body:{name:name}}).then(function(){ closeSheet(); toast('Created '+name+'.'); return load(); }).catch(function(e){ m.textContent=e.message; m.className='mw-msg mw-bad'; }); };
  document.getElementById('mw-make').addEventListener('click', go); document.getElementById('mw-name').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } }); try{ document.getElementById('mw-name').focus(); }catch(e){}
}
function listById(id){ return (D.lists||[]).filter(function(l){ return l.id===id; })[0]; }
function openMore(id){
  var l=listById(id); if(!l) return;
  sheet('<div class="mw-sh"><div class="mw-st">Watchlist<b>'+esc(l.name)+'</b></div><button class="mw-x" type="button" aria-label="Close">×</button></div><div class="mw-body"><button class="mw-act" type="button" data-act="rename">Rename</button><div class="mw-form" id="mw-rn" style="display:none"><input id="mw-rname" maxlength="40" value="'+esc(l.name)+'"><button type="button" id="mw-rsave">Save</button></div><button class="mw-act mw-danger" type="button" data-act="delete">Delete this watchlist'+(l.count?' and its '+l.count+' name'+(l.count===1?'':'s'):'')+'</button><div class="mw-msg" id="mw-msg"></div><button class="mw-act mw-cancel" type="button" data-act="cancel">Cancel</button></div>');
  SHEET.querySelector('[data-act="cancel"]').addEventListener('click', closeSheet);
  SHEET.querySelector('[data-act="rename"]').addEventListener('click', function(){ var f=document.getElementById('mw-rn'); f.style.display=f.style.display==='none'?'flex':'none'; try{ document.getElementById('mw-rname').focus(); }catch(e){} });
  var save=function(){ var name=(document.getElementById('mw-rname').value||'').trim(), m=document.getElementById('mw-msg'); if(!name){ m.textContent='Give the watchlist a name.'; m.className='mw-msg mw-bad'; return; } m.textContent='Saving…'; m.className='mw-msg'; api(API+'/'+id,{method:'PATCH',body:{name:name}}).then(function(){ closeSheet(); toast('Renamed to '+name+'.'); return load(); }).catch(function(e){ m.textContent=e.message; m.className='mw-msg mw-bad'; }); };
  document.getElementById('mw-rsave').addEventListener('click', save); document.getElementById('mw-rname').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); save(); } });
  var del=SHEET.querySelector('[data-act="delete"]'); del.addEventListener('click', function(){ if(del.getAttribute('data-armed')!=='1'){ del.setAttribute('data-armed','1'); del.textContent='Tap again to delete '+l.name; return; } del.disabled=true; var m=document.getElementById('mw-msg'); m.textContent='Deleting…'; api(API+'/'+id,{method:'DELETE'}).then(function(){ closeSheet(); toast('Deleted '+l.name+'.'); return load(); }).catch(function(e){ del.disabled=false; m.textContent=e.message; m.className='mw-msg mw-bad'; }); });
}
/* ═══ the names sheet ═══ */
function rowHtml(r){
  return '<tr class="mw-tr" data-mw-sym="'+esc(r.symbol)+'"><td><a href="/m/check?sym='+encodeURIComponent(r.symbol)+'">'+esc(r.symbol)+'<small>'+esc(r.company_name||r.segment||'')+'</small></a></td>'
   +'<td class="'+((r.gvm||0)>=7?'mw-gd':'')+'">'+f1(r.gvm)+(r.verdict?'<small>'+esc(r.verdict)+'</small>':'<small>not rated</small>')+'</td>'
   +'<td>'+inr(r.cmp)+'</td><td class="'+cls(r.day_pct)+'">'+pct(r.day_pct,2)+'</td>'
   +'<td>'+esc(r.added_on||'—')+(r.since_add_pct!=null?'<small class="'+cls(r.since_add_pct)+'">'+pct(r.since_add_pct,1)+' since</small>':'')+'<button class="mw-rm" type="button" data-rm="'+esc(r.symbol)+'" aria-label="Remove '+esc(r.symbol)+'">Remove</button></td></tr>';
}
function openList(id){
  var l=listById(id); if(!l) return;
  var s=sheet('<div class="mw-sh"><div class="mw-st">Watchlist · '+(l.count||0)+' name'+(l.count===1?'':'s')+'<b>'+esc(l.name)+'</b></div><button class="mw-x" type="button" aria-label="Close">×</button></div><div class="mw-body" id="mw-lst"><div class="mw-msg">Loading…</div></div>', true);
  api(API+'/'+id+'/items').then(function(d){
    var host=document.getElementById('mw-lst'); if(!host) return;
    if(!(d.rows||[]).length){ host.innerHTML='<div class="mw-emp">Nothing here yet<span class="mw-mu">Tap + on any stock card and pick '+esc(l.name)+'.</span></div>'; return; }
    host.innerHTML='<table class="mw-tb" id="mw-tb"><thead><tr><th>Stock</th><th>Rating</th><th>CMP</th><th>Day</th><th>Added</th></tr></thead><tbody>'+d.rows.map(rowHtml).join('')+'</tbody></table><div class="mw-foot">'+d.count+' name'+(d.count===1?'':'s')+' · sorted by day % · '+(d.priced||0)+' priced · swipe a row left to remove · tap a name for its check page</div>';
    host.querySelectorAll('.mw-tr').forEach(function(tr){ var x0=null, moved=false;
      tr.addEventListener('touchstart', function(e){ x0=e.touches[0].clientX; moved=false; }, {passive:true});
      tr.addEventListener('touchmove', function(e){ if(x0==null) return; var dx=e.touches[0].clientX-x0; if(dx<-60){ tr.classList.add('mw-sw'); moved=true; } else if(dx>40){ tr.classList.remove('mw-sw'); moved=true; } }, {passive:true});
      tr.addEventListener('touchend', function(){ x0=null; });
      tr.addEventListener('click', function(e){ if(moved){ e.preventDefault(); moved=false; } });
    });
    host.querySelectorAll('[data-rm]').forEach(function(b){ b.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); var sym=b.getAttribute('data-rm'); b.disabled=true; b.textContent='…'; api(API+'/'+id+'/items/'+encodeURIComponent(sym),{method:'DELETE'}).then(function(){ var tr=b.closest('tr'); if(tr) tr.remove(); toast('Removed '+sym+'.'); return load(); }).catch(function(err){ b.disabled=false; b.textContent='Remove'; toast('Could not remove: '+err.message); }); }); });
  }).catch(function(e){ var host=document.getElementById('mw-lst'); if(host) host.innerHTML='<div class="mw-err">Could not load the names: '+esc(e.message)+'</div>'; });
}
document.getElementById('mw-new').addEventListener('click', openNew);
load();
</script>
