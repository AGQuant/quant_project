/* ══ APP_QA_R4 P2 · HOME CONSUMES THE THREE-THEME TOKEN LAYER ═══════════════════════════════
   Ref: design_refs/scorr_home_themes_R1.html @ 80da8c6. Tokens come from
   /static/scorr_themes.css, declared on body[data-theme]. The switch sits in the header.

   WHY THE BRIDGE BELOW EXISTS — measured, not assumed. mobile_app.css declares the app palette
   on `.screen,.bnav`, deliberately (framework 15913: "never bare :root"). A custom property set
   on a NEARER ancestor wins, so anything declared on <body> or :root is shadowed for every
   element inside .screen. Probed in Chromium on the live sheets: at :root --panel is #161F33 and
   --grn is #C8F542, while inside .screen those same names still read #121A33 and #2FD48B. That
   is why the R5 layer never reached the app's content (the cc#1066 symptom), and it is why a
   switch on <body> alone would have moved nothing but the header. The bridge re-declares the
   legacy names ON .screen/.bnav, sourced from the theme layer, so one switch re-skins the page.

   The alias step is not decoration: `.screen{--panel:var(--panel)}` is self-referential and CSS
   drops it. Aliasing on body first gives .screen a different name to read from.

   ON P2's "dark byte-identical" LINE, stated rather than quietly chosen: it cannot hold together
   with "map to the new vars", because the ref's dark values and home's current in-scope values
   are different (--grn #2FD48B vs --win #C8F542, --panel #121A33 vs #161F33). Built to the REF,
   which is the R5 palette every other surface already shows; the exact deltas are listed in the
   cc#1077 result. The token SET is the ref's too — it has one --muted and one --edge, so --mut
   and --dim converge, as do --line and --line2. That is the ref's hierarchy, not a flattening
   introduced here. */
body[data-theme]{
  --t-field:var(--field); --t-panel:var(--panel); --t-hi:var(--hi); --t-edge:var(--edge);
  --t-ink:var(--ink); --t-muted:var(--muted); --t-win:var(--win); --t-loss:var(--loss);
  --t-brand:var(--brand); --t-accent:var(--accent); --t-label:var(--label);
}
.screen,.bnav{
  --bg:var(--t-field); --panel:var(--t-panel); --panel2:var(--t-hi);
  --line:var(--t-edge); --line2:var(--t-edge);
  --txt:var(--t-ink); --mut:var(--t-muted); --dim:var(--t-muted);
  --grn:var(--t-win); --red:var(--t-loss);
  --blu:var(--t-accent); --cyan:var(--t-brand);
}
/* the switch — ref .tswitch, 34x30 buttons, right of the wordmark */
/* APP_QA_R5 P1: the switch is HIDDEN, not removed. Markup and JS stay in place so the return
   next build is deleting this one declaration rather than rebuilding the control. */
.tswitch{display:none !important}
.tswitch{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line2);padding:3px;
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.tswitch button{width:34px;height:30px;border:0;background:transparent;cursor:pointer;font-size:13px;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:800;color:var(--mut);line-height:1}
.tswitch button.on{background:var(--panel2);color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}

/* ══ APP_QA_R5 P2 · GOLD NIGHT RAISED SCALE ═══════════════════════════════════════════════════
   Ref: design_refs/scorr_sprint2_goldnight_R1.html @ cd75e2c. Founder: "font size below also
   increase" — the lower sections were reading small against the raised hero.

   Every size below is the ref's, and 9.5px is the FLOOR: nothing in these sections goes under it.
   Page-scoped on purpose. mobile_app.css sizes these classes for the whole app, and the sprint
   ref is a HOME ref — raising .st or .tool globally would silently re-scale every other screen,
   which is the per-page-vs-shared mistake in the other direction. P7-P10 migrate the other pages
   deliberately, page by page.

   Colour comes from the token layer, not from here: --golddeep is the gold-deep key colour the
   ref uses for stat keys and news age stamps, and it is already the theme's --label under
   goldnight, so these rules ask for the token rather than restating a hex (section D forbids
   touching token values). */
/* THE BOOK — stat values 18px, gold-deep keys */
.st{padding:12px 11px}
.st .k{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--t-label,var(--dim))}
.st .v{font-size:18px}
.trio .st .v{font-size:18px}
/* MY PORTFOLIO — 13px symbol, 12.5px values, 48px min row */
.pfrow{min-height:48px}
.pfrow .sym,.pfrow .s1{font-size:13px;font-weight:800;letter-spacing:.3px}
.pfrow .v,.pfrow .pv{font-size:12.5px;font-weight:700}
/* LIVE NEWS — 13.5px headlines, gold-deep age stamps */
.rnr .rnh,.news .h{font-size:13.5px;line-height:1.45}
.rnr .rnage{font-size:9.5px;color:var(--t-label,var(--dim))}
/* TOOLS — 12px labels, 19px gold-glow icons */
.tool{font-size:12px;padding:14px 6px}
.tool span{font-size:19px;text-shadow:0 0 10px var(--brandglow)}
/* BOTTOM NAV — 11px labels, gold active */
.bnav .bn{font-size:11px}
.bnav .bn .i{font-size:16px}
.bnav .bn.on{color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}
/* APP_QA_R5 P3 · VIX chip chrome — FLAT, identical to a sibling chip, colour in text only.
   The boxed treatment (tinted background + coloured border) is what made a green chip read as a
   badge of approval. Removed for this chip in both states; the red state keeps its red TEXT. */
.hc.vixc{background:transparent;border-color:var(--line2)}
.hc.vixc.bad{background:transparent;border-color:var(--line2);color:var(--red)}


/* cc#900 (founder 08-Aug): the tape lost its look when this page's CSS moved to the shared
   sheet (cc#893 item 3). The ticker's own styling now lives HERE, scoped to this page, so a
   shared-CSS change can never restyle the tape again. Design restored = the original pill:
   SYMBOL + %CHANGE only (founder: "symbol and change") — the price column is dropped; the
   tape reads direction at a glance, exact levels live in the cards below. Marquee behaviour
   (cc#896 batch 3: doubled track, -50% seamless loop, hold to pause) unchanged. */
.tkr{overflow:hidden;padding:8px 0;margin:0 -12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tkr-track{display:flex;gap:8px;width:max-content;padding:0 12px;animation:tkrMove var(--tkr-dur,40s) linear infinite}
.tkr:active .tkr-track,.tkr:hover .tkr-track{animation-play-state:paused}
@keyframes tkrMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tkr-track{animation:none}.tkr{overflow-x:auto}}
.tk{flex:none;display:flex;align-items:baseline;gap:6px;padding:4px 9px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line)}
.tk .n{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tk .d{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:700;white-space:nowrap}

.lgt{flex:1;min-height:34px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;

.v10c .rl{width:3px;border-radius:2px;flex:none;background:var(--mut)}
.v10c.wn .rl{background:var(--volt, #2FD48B)} .v10c.ls .rl{background:var(--heat, #FF5C6C)} .v10c.op .rl{background:var(--pulse, #4D7CFE)}

/* ── cc#907: the V8 Open Book trio overflowed its card on the founder's phone ────────────────
   TWO fixes, because they solve two different halves and either alone still breaks.
   STRUCTURE: a grid item's automatic minimum is its min-content width, so a 1fr track GROWS to
   fit a long value and pushes .trio wider than the card, which then clips it (.c is
   overflow:hidden). min-width:0 removes that automatic minimum, so the three tracks can never
   total more than the card — no horizontal overflow at ANY magnitude, today's or a future one.
   LEGIBILITY: structure alone would only shrink the box and clip the text, so the value is also
   compacted (inrShort).
   FOUNDER FOLLOW-UP 08-Aug: overflow-wrap:anywhere stopped the overflow but let a value BREAK
   ACROSS TWO LINES mid-number, which is just as unreadable — his words, and he is right. Two
   changes fix it properly. The symbol is now ₹ instead of "Rs.", which is 2 characters cheaper on
   every money value in the app, and the cell is white-space:nowrap so a number can never wrap
   again: it either fits on one line or the formatter has failed, and the formatter cannot fail
   because inrShort caps the string.
   MEASURED on a 380px viewport: card content is 324px, a track is (324-16)/3 = 102.7px and a cell
   has ~87px after padding; at 13.5px Plex Mono (~8.1px/char) that is ~10 characters. The widest
   inrShort can produce is 8 — "−₹99,999" / "₹1.43Cr" — so 65px in 87px, and it still fits the

   above already applied, so the pressed state and the page can never disagree on reload. */
(function () {
  var sw = document.getElementById('tsw');
  if (!sw) return;
  function mark() {
    var cur = document.body.getAttribute('data-theme') || 'dark';
    var bs = sw.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) {
      var on = bs[i].getAttribute('data-t') === cur;
      bs[i].classList.toggle('on', on);
      bs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }
  sw.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    document.body.setAttribute('data-theme', b.getAttribute('data-t'));
    try { localStorage.setItem('scorr_theme', b.getAttribute('data-t')); } catch (err) {}
    mark();
  });

})();

<script>
var TREND = { open: null };   /* which chip popup is open: 'adr' | 'pcr' | 'vix' */

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN');
}
function pct(v, dp){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return (x >= 0 ? '+' : '') + x.toFixed(dp == null ? 2 : dp) + '%';
}
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x < 0 ? '\u2212' : '') + '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
function cls(v){ return v == null ? '' : (Number(v) >= 0 ? 'pos' : 'neg'); }
/* cc#907 — Indian short scale for the trio cells. ₹1,42,76,194 is 12 characters and does not
   fit a third of a phone; ₹1.43Cr is 7 and says the same thing at a glance. Two decimals keep
   a lakh readable to the nearest thousand. Below 1L the full figure already fits, so it stays
   exact. The PAYLOAD is untouched — this is display only, and /m/positions still shows every
   rupee (the card is explicit that the book maths must not move). */
function inrShort(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v), sign = x < 0 ? '−' : '', a = Math.abs(x);
  /* decimals shrink as the magnitude grows, so the STRING never does. Measuring the old version
     caught the case the eye misses: ₹100.00Cr is 9 characters and did not fit a 360px phone.
     With this ladder the widest possible output is 8 — "−₹99,999" or "−₹14.3Cr" — which fits
     every cell it is used in, at every viewport down to 320px. */
  if (a >= 1e7){
    var cr = a / 1e7;
    return sign + '₹' + (cr >= 100 ? Math.round(cr) : cr.toFixed(cr >= 10 ? 1 : 2)) + 'Cr';
  }
  if (a >= 1e5){
    var l = a / 1e5;
    return sign + '₹' + l.toFixed(l >= 10 ? 1 : 2) + 'L';
  }
  return sign + '₹' + Math.round(a).toLocaleString('en-IN');
}
function moodColor(m){
  m = (m || '').toLowerCase();
  if (m.indexOf('bullish') > -1) return 'var(--grn)';
  if (m.indexOf('bearish') > -1) return 'var(--red)';
  return 'var(--amber)';
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  /* cc#984: `label` lets a rail read in plain words ("Feed live") while `state` still drives the
     CSS class, so the four shapes stay the four shapes. Rails without a label are unchanged. */
  var txt = r.label || r.state;
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(txt) + '</span>';
}
/* ── chip trend popup: SVG LINE CHART (website chart style) from /api/mobile/trends ─────────
   founder 08-Aug: the cc#894 pickers guessed other endpoints' JSON keys and rendered "--";
   the new endpoint returns ONE shape ({series:[{d,v}]}) so nothing is guessed, and the popup
   draws a real chart instead of text rows. */
var TRENDS = {
  adr: { title: 'ADR' },
  pcr: { title: 'NIFTY PCR' },
  vix: { title: 'INDIA VIX' },
  nifty: { title: 'NIFTY 50' }   /* cc#998: the three Home Nifty chips (Day/Week/Month) all open this one close series */
};
/* cc#908: a point label is a DATE on a daily series and a TIME on an intraday one. One helper
   decides, so the axis, the scrub readout and the tape charts can never disagree about it.
   'HH:MM' is passed through; 'YYYY-MM-DD' loses the year (slice(5)) as it always did. */
function dlab(d){
  d = String(d == null ? '' : d);
  return /^\d{1,2}:\d{2}$/.test(d) ? d : d.slice(5);
}
function trendSvg(series, kind){
  var W = 320, H = 110, PL = 6, PR = 6, PT = 8, PB = 18;
  var vs = series.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var rng = (hi - lo) || 1;
  var n = series.length;
  var xs = function(i){ return PL + (n === 1 ? 0 : i / (n - 1) * (W - PL - PR)); };
  var ys = function(v){ return PT + (1 - (v - lo) / rng) * (H - PT - PB); };
  var pts = series.map(function(p, i){ return xs(i).toFixed(1) + ',' + ys(p.v).toFixed(1); }).join(' ');
  var area = PL + ',' + (H - PB) + ' ' + pts + ' ' + xs(n - 1).toFixed(1) + ',' + (H - PB);
  var d0 = dlab(series[0].d), d1 = dlab(series[n - 1].d);
  var last = series[n - 1].v;
  return '<svg id="tsvg_' + kind + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;display:block;touch-action:none">'
    + '<polygon points="' + area + '" fill="rgba(77,124,254,.14)"/>'
    + '<polyline points="' + pts + '" fill="none" stroke="var(--blu,#4D7CFE)" stroke-width="1.6"/>'
    + '<circle cx="' + xs(n - 1).toFixed(1) + '" cy="' + ys(last).toFixed(1) + '" r="2.6" fill="var(--blu,#4D7CFE)"/>'
    + '<line id="tcx_' + kind + '" x1="0" y1="' + PT + '" x2="0" y2="' + (H - PB) + '" stroke="var(--amber,#F5B94A)" stroke-width="1" stroke-dasharray="3 2" style="display:none"/>'
    + '<circle id="tcd_' + kind + '" r="3.2" fill="var(--amber,#F5B94A)" style="display:none"/>'
    + '<text x="' + PL + '" y="' + (H - 5) + '" font-size="10" fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(d0) + '</text>'
    + '<text x="' + (W - PR) + '" y="' + (H - 5) + '" text-anchor="end" font-size="10" fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(d1) + '</text>'
    + '</svg>';
}
/* founder 08-Aug batch 3: finger scrub — drag inside the chart moves a crosshair and the header
   readout shows THAT day's value + date. touch-action:none keeps the page from scrolling while
   scrubbing; lifting the finger restores the latest reading. */
function wireScrub(kind, series){
  var svg = document.getElementById('tsvg_' + kind);
  var hd  = document.getElementById('trd_' + kind);
  if (!svg || !series.length) return;
  var W = 320, PL = 6, PR = 6, PT = 8, PB = 18, H = 110;
  var vs = series.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var rng = (hi - lo) || 1, n = series.length;
  var cx = document.getElementById('tcx_' + kind), cd = document.getElementById('tcd_' + kind);
  function latest(){ var l = series[n - 1]; if (hd) hd.textContent = Number(l.v).toFixed(2) + ' \u00b7 ' + dlab(l.d); }
  function show(clientX){
    var r = svg.getBoundingClientRect();
    var fx = (clientX - r.left) / r.width * W;
    var i = Math.round((fx - PL) / ((W - PL - PR) / (n - 1 || 1)));
    i = Math.max(0, Math.min(n - 1, i));
    var p = series[i];
    var X = PL + i / (n - 1 || 1) * (W - PL - PR);
    var Y = PT + (1 - (p.v - lo) / rng) * (H - PT - PB);
    cx.setAttribute('x1', X); cx.setAttribute('x2', X); cx.style.display = 'block';
    cd.setAttribute('cx', X); cd.setAttribute('cy', Y); cd.style.display = 'block';
    if (hd) hd.textContent = Number(p.v).toFixed(2) + ' \u00b7 ' + dlab(p.d);
  }
  function hide(){ cx.style.display = 'none'; cd.style.display = 'none'; latest(); }
  svg.addEventListener('touchstart', function(e){ if (e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
  svg.addEventListener('touchmove',  function(e){ if (e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
  svg.addEventListener('touchend', hide);
  svg.addEventListener('mousemove', function(e){ show(e.clientX); });
  svg.addEventListener('mouseleave', hide);
}
/* ── cc#904: MARKET TAPE overlay ───────────────────────────────────────────────────────────
   Tapping the marquee opens every tape symbol as a table: name, last, change %, and the date
   the number is actually from. The tape itself can only show a value; a five-day-old Nikkei
   print looks exactly like this morning's until something states the date.

   has_series comes from the SERVER (mobile_home2), computed from real data: /api/global/history
   reads global_indices, and NIFTY/BANKNIFTY are not in that table, so those two rows carry no
   chart button. The card's rule — never a dead button — is enforced where the truth is known,
   not guessed in the template.

   /api/global/history/{name} returns a FLAT LIST of global_indices rows
   [{name,symbol,category,price,prev_close,chg_pct,quote_date}] — NOT the {series:[{d,v}]} shape
   /api/mobile/trends uses. Verified by reading gvm_market_endpoints.py before writing this, per
   the card. The map to trendSvg's {d,v} is done here, once. */
var TAPE = { rows: [], view: [], open: {} };

/* ══ cc#910: ONE CHART RENDERER, TWO CALLERS ═══════════════════════════════════════════════
   The chip charts (ADR/PCR/VIX) and the tape charts are now the SAME component. Shared
   functions: trendSvg (the SVG), wireScrub (finger crosshair + readout), dlab (point label),
   rangePills + setRange (the window selector) and renderChart (fetch -> draw -> wire). Nothing
   is forked — a tape chart scrubs and switches ranges because it IS the chip chart, so the two
   cannot drift apart later.

   Only the DATA differs, so only the data is per-caller: CHART[key].load(days) returns a
   promise of {series:[{d,v}], note}. The chip loader reads /api/mobile/trends; the tape loader
   reads the global endpoints. Everything after that is common code.

   RANGES ARE PER CHART, not global: a row only offers 1D when an intraday series genuinely
   exists for it (server-supplied intraday_name, resolved from global_intraday itself). India
   VIX and the two domestic rows have none, so they never show a 1D pill — LIVE_DATA_EVERYWHERE
   cuts both ways, and the half that matters more is never drawing a line the data cannot back. */
var CHART = {};

function chipLoader(kind){
  return function(days){
    return fetchWithTimeout('/api/mobile/trends?kind=' + kind + '&days=' + days)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.error) throw new Error(d.error);
        return { series: (d && d.series) || [], note: (d && d.note) || null };
      });
  };
}
/* Tape data. Daily = /api/global/history/{name} (flat global_indices rows, price+quote_date).
   1D = /api/global/intraday/{feed_name} (flat global_intraday rows, close+ts). Both return a
   FLAT LIST, or {error} on failure — verified by reading gvm_market_endpoints.py, not assumed.
   The 1D window is the endpoint's own rolling 24 HOURS, not a calendar day, so it is labelled
   "last 24h" — for Dow or Bitcoin that is the honest description and "today" would not be. */
function tapeLoader(x){
  return function(days){
    /* cc#940: a row with daily_series === false (NIFTY / BANKNIFTY) has ONLY an intraday source,
       so every window it can offer is the intraday one. Everything else keeps the old rule. */
    var intr = (!!x.intraday_name) && (days === 1 || x.daily_series === false);
    var url = intr
      ? '/api/global/intraday/' + encodeURIComponent(x.intraday_name) + '?days=1'
      : '/api/global/history/' + encodeURIComponent(x.name) + '?days=' + days;
    return fetchWithTimeout(url).then(function(r){ return r.json(); }).then(function(rows){
      if (!Array.isArray(rows)) throw new Error((rows && rows.error) || 'no data');
      var series = intr
        ? rows.filter(function(r){ return r && r.close != null && r.ts; })
              .map(function(r){ return { d: String(r.ts).slice(11, 16), v: Number(r.close) }; })
        : rows.filter(function(r){ return r && r.price != null && r.quote_date; })
              .map(function(r){ return { d: String(r.quote_date), v: Number(r.price) }; });
      /* cc#940: the note states the SESSION and where the data actually ends, read off the rows.
         The old text said "Last 24h" on every intraday chart — on a Sunday that was simply untrue,
         and it gave no clue when a feed stopped early. A date the server chose, printed back. */
      var note = null;
      if (intr && rows.length){
        var t0 = String(rows[0].ts || ''), t1 = String(rows[rows.length - 1].ts || '');
        note = 'Session ' + t1.slice(0, 10) + ' · ' + t0.slice(11, 16) + '–' + t1.slice(11, 16)
             + ' · ' + series.length + ' pts';
      }
      return { series: series, note: note };
    });
  };
}

var RANGES_ALL = [[1, '1D'], [7, '7D'], [15, '15D'], [30, '30D']];
var RANGES_DAILY = [[7, '7D'], [15, '15D'], [30, '30D']];
var RANGES_INTRADAY = [[1, '1D']];

function setRange(ev, key, days){
  if (ev) ev.stopPropagation();
  if (!CHART[key]) return;
  CHART[key].days = days;
  // a chip's chosen window survives closing and reopening the popup within the visit
  if (TREND_RANGE.hasOwnProperty(key)) TREND_RANGE[key] = days;
  renderChart(key);
}
function rangePills(key){
  var c = CHART[key];
  return '<div class="rgs">' + c.ranges.map(function(r){
    return '<button class="rg' + (r[0] === c.days ? ' on' : '') + '"'
      + ' onclick="setRange(event,\'' + key + '\',' + r[0] + ')">' + r[1] + '</button>';
  }).join('') + '</div>';
}

/* Draw (or redraw) a registered chart into its host element. */
function renderChart(key){
  var c = CHART[key];
  if (!c) return;
  var el = document.getElementById(c.host);
  if (!el) return;
  var head = function(right){
    return '<div class="trendhd"><span>' + esc(c.title) + '</span>'
      + (right ? '<span id="trd_' + key + '">' + right + '</span>' : '') + '</div>';
  };
  el.innerHTML = '<div class="loading" style="padding:6px 0 0">Loading ' + esc(c.title) + '…</div>';
  var want = c.days;
  c.load(want).then(function(res){
    // a slower earlier request must not overwrite a newer one, and a closed popup draws nothing
    if (CHART[key] !== c || c.days !== want || !c.live()) return;
    var s = res.series || [];
    var note = res.note
      ? '<div class="sum" style="padding:6px 0 0">' + esc(res.note) + '</div>' : '';
    if (s.length < 2){
      el.innerHTML = '<div class="trendbox">' + head('') + rangePills(key)
        + '<div class="sum" style="padding:6px 0 0">Not enough history for this window.</div>'
        + note + '</div>';
      return;
    }
    var last = s[s.length - 1];
    el.innerHTML = '<div class="trendbox">'
      + head(esc(Number(last.v).toFixed(2)) + ' · ' + esc(dlab(last.d)))
      + rangePills(key) + trendSvg(s, key) + note + '</div>';
    wireScrub(key, s);   // rebound on every redraw — a new SVG needs a new binding
  }).catch(function(e){
    if (CHART[key] !== c || !c.live()) return;
    el.innerHTML = '<div class="trendbox">' + head('') + rangePills(key)
      + '<div class="sum" style="padding:6px 0 0">Chart failed: ' + esc(e.message) + '</div></div>';
  });
}

function openTape(){

/* ── cc#939: TICKER TABLE SORTING ─────────────────────────────────────────────────────────────
   Founder: the tape opens a table, keep it, but let him glance-rank it.

   TWO THINGS THAT WOULD HAVE BROKEN IF DONE THE OBVIOUS WAY.

   1. TAPE.rows IS NOT REORDERED. Every open chart is keyed by its row INDEX — TAPE.open[i], the
      host element id 'tpc_' + i, the CHART registry key 'tp' + i, and the onclick tapeChart(i).
      Sorting the array in place would leave an open chart bound to whatever row slid into that
      slot, so a tap on Gold could redraw Nikkei's chart underneath it. Instead TAPE.view holds
      the ORDER (a list of original indices) and rendering walks that; every index-based key stays
      attached to the row it was created for, and a chart can stay open across a re-sort.

   2. THE NUMBERS ARE SORTED, NOT THE TEXT. The card asked to strip the rupee sign, % and commas
      before comparing. That is the right instinct for a table built from rendered strings — but
      this table is rendered FROM the payload, where price and chg_pct are already numbers. So it
      sorts the data and never parses its own output back. num() still strips those characters
      defensively, for the day a value arrives as a string.

   Nulls always sort LAST, in both directions. This page already refuses to tint a null change
   green or red because unknown is not flat (cc#910); ranking an unknown as if it were zero would
   break the same rule at the top of the list. */
var TAPE_SORT = { col: 'chg', dir: -1 };   // founder default: biggest movers on top
var TAPE_COLS = [
  { key: 'nm',  label: 'Symbol', cls: 'h-nm' },
  { key: 'lv',  label: 'Last',   cls: 'h-lv' },
  { key: 'chg', label: 'Chg %',  cls: 'h-cg' }
];

function tapeNum(v){
  if (v == null) return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  var n = Number(String(v).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? null : n;
}

function tapeSortView(){
  var col = TAPE_SORT.col, dir = TAPE_SORT.dir;
  var order = TAPE.rows.map(function(_, i){ return i; });
  order.sort(function(a, b){
    var ra = TAPE.rows[a], rb = TAPE.rows[b];
    if (col === 'nm'){
      var cmp = String(ra.name || '').localeCompare(String(rb.name || ''));
      return cmp * dir || (a - b);
    }
    var va = tapeNum(col === 'lv' ? ra.price : ra.chg_pct);
    var vb = tapeNum(col === 'lv' ? rb.price : rb.chg_pct);
    if (va == null && vb == null) return a - b;
    if (va == null) return 1;      // nulls last, whichever way the arrow points
    if (vb == null) return -1;
    if (va === vb) return a - b;   // stable: ties keep the payload's own order
    return (va < vb ? -1 : 1) * dir;
  });
  TAPE.view = order;
}

function tapeSort(col){
  /* First tap on a new column = descending (the founder's "biggest first" default reading);
     tapping the active column again flips it. */
  if (TAPE_SORT.col === col) TAPE_SORT.dir = -TAPE_SORT.dir;
  else { TAPE_SORT.col = col; TAPE_SORT.dir = -1; }
  renderTape();
}

function tapeHead(){
  return '<div class="tph">' + TAPE_COLS.map(function(c){
    var on = TAPE_SORT.col === c.key;
    return '<button class="' + c.cls + (on ? ' on' : '') + '"'
      + ' aria-label="Sort by ' + esc(c.label) + '"'
      + ' onclick="tapeSort(\'' + c.key + '\')">' + esc(c.label)
      + (on ? '<span class="ar">' + (TAPE_SORT.dir < 0 ? '\u25BC' : '\u25B2') + '</span>' : '')
      + '</button>';
  }).join('') + '<span class="h-sp"></span></div>';
}

function tapeRow(x, i){
  var chart = x.has_series
    ? '<button class="tpc" onclick="tapeChart(' + i + ')" aria-label="chart">' +
      (TAPE.open[i] ? '\u2715' : '\u2197') + '</button>'
    : '<span class="tpc" style="color:transparent">\u00b7</span>';
  /* cc#910: the row carries its direction. cls() gives the value and the % the same pos/neg
     colour, and the row takes a faint tint of the same sign. A null change gets NEITHER \u2014 an
     unknown move is not a flat move, and tinting it green or red would state something the
     data does not say. */
  var sgn = (x.chg_pct == null || isNaN(Number(x.chg_pct))) ? ''
          : (Number(x.chg_pct) >= 0 ? ' up' : ' dn');
  return '<div class="tpr' + sgn + '">'
    + '<span class="nm2"><div class="s1">' + esc(x.name) + '</div>'
    + '<div class="s2">' + (x.live ? 'live' : esc(x.as_of || '--')) + '</div></span>'
    + '<span class="lv ' + cls(x.chg_pct) + '">' + px(x.price) + '</span>'
    + '<span class="cg ' + cls(x.chg_pct) + '">' + pct(x.chg_pct) + '</span>'
    + chart + '</div>'
    + (TAPE.open[i] ? '<div class="tpchart" id="tpc_' + i + '"></div>' : '');
}
function renderTape(){
  // cc#939: render through TAPE.view (an order of ORIGINAL indices), never a reordered TAPE.rows
  tapeSortView();
  var body = TAPE.view.map(function(i){ return tapeRow(TAPE.rows[i], i); }).join('');
  document.getElementById('tapebd').innerHTML = TAPE.rows.length
    ? (tapeHead() + body) : '<div class="empty"><b>No tape data</b></div>';
  // re-draw any chart that is open \u2014 renderTape() rebuilds the DOM, so the hosts are new nodes
  Object.keys(TAPE.open).forEach(function(i){ if (TAPE.open[i]) renderChart('tp' + i); });
}
/* cc#910: a tape chart is now a registered CHART, so it scrubs and switches range exactly like
   the ADR/PCR chips \u2014 same renderer, same typography, no second implementation. */
function tapeChart(i){
  var x = TAPE.rows[i];
  if (!x || !x.has_series) return;
  var key = 'tp' + i;
  if (TAPE.open[i]){ TAPE.open[i] = 0; delete CHART[key]; renderTape(); return; }
  TAPE.open[i] = 1;
  /* cc#940: three shapes, decided by what the row actually has — intraday only (NIFTY/BANKNIFTY,
     one 1D pill, opens on 1D), intraday + daily (the global names), or daily only. */
  var intradayOnly = (x.daily_series === false && !!x.intraday_name);
  CHART[key] = {
    host: 'tpc_' + i, title: x.name,
    ranges: intradayOnly ? RANGES_INTRADAY : (x.intraday_name ? RANGES_ALL : RANGES_DAILY),
    days: intradayOnly ? 1 : 15, load: tapeLoader(x),
    live: function(){ return !!TAPE.open[i]; }
  };
  renderTape();
}

/* ── cc#905: range selector. 1D | 7D | 15D | 30D, default 15D, remembered per kind for the
   session (no storage — a range that outlives the visit is one the founder forgets he set).
   ON 1D: /api/mobile/trends clamps days to max(2, ...), and I did NOT lower that clamp — a
   one-point "chart" is a dot, and a flat line drawn through one value would be a fabricated
   shape. 1D therefore requests days=2 and draws the real last-two-prints line, which is exactly
   the move the founder is asking about. The pill row states the window; the chart never pretends
   to more resolution than the daily source has. */
var TREND_RANGE = { adr: 15, pcr: 15, vix: 15 };

/* WHAT CHANGED AT cc#908. 1D used to request days=2 and draw the last two DAILY prints, because
   a one-point line would have been a fabricated shape. It no longer has to fake anything: the
   server now answers days=1 with the real INTRADAY series -- adr_intraday (gated on
   universe_count >= 50, the same gate the web chart and the mood-gate use) and pcr_intraday
   total-PCR for NIFTY, both 5-min and both live. The axis switches to HH:MM on its own, because
   the points carry a time and dlab() reads that.

   VIX IS THE EXCEPTION, AND SAYS SO. There is no intraday India VIX anywhere in the platform --
   global_intraday carries 15 names and India VIX is not one of them. Its 1D therefore returns
   the daily line plus a note saying why, which renderChart prints under the chart. That is the
   whole of the standing rule: use the live source wherever one exists, state the true as-of
   wherever one does not, and never invent the missing one.

   The renderer, the pills and the scrub now live above (cc#910) and are shared with the tape
   charts. All that is left here is opening and closing the popup, and remembering the range. */
function togTrend(ev, kind){
  if (ev) ev.stopPropagation();
  var el = document.getElementById('chiptrend');
  if (!el) return;
  if (TREND.open === kind){ TREND.open = null; el.innerHTML = ''; delete CHART[kind]; return; }
  TREND.open = kind;
  CHART[kind] = {
    host: 'chiptrend', title: TRENDS[kind].title, ranges: RANGES_ALL,
    days: TREND_RANGE[kind], load: chipLoader(kind),
    live: function(){ return TREND.open === kind; }
  };
  renderChart(kind);
}

/* ══ cc#906: V10 TRADE-LOG CHART ═══════════════════════════════════════════════════════════
   Founder asked for the web /dashboard#index V10 view on the phone, over 3 months.

   WHAT THE WEB DOES, read before building this (v8_dashboard.html loadV10Chart): Lightweight
   Charts, 5-min candles from /api/v10/candles?days=30, markers built from /api/v10/trades and
   /api/v10/positions, FUT legs only, each trade timestamp shifted +5.5h before snapping to a bar.

   WHAT MOBILE GOT, and why it is not simply the same call with days=90:
     * DAILY candles, not 5-min. Two reasons, both verified in the DB first. (1) The 5-min bar
       TIME BASE CHANGES inside a 3-month window: bars up to Jun-2026 are true UTC (session runs
       03:45-09:55), from Jul-2026 they are IST wall-clock tagged +00 (09:15-15:25). The web's
       30-day window sits entirely inside the newer regime so its no-shift assumption holds; over
       90 days it does not, and the older third would sit 5.5h off the newer two thirds on one
       axis. Aggregating to the session DATE is invariant to that switch, and no date in the
       window mixes both regimes. (2) ~4,600 5-min bars on a 360px phone is 12+ bars per pixel
       and a ~300KB payload; 64 daily candles read cleanly.
     * No chart library. The mobile app loads none, and the SVG the chip charts already use draws
       candles perfectly well.
     * PIN LABELS live in the trade log under the chart, not floating on it. 45 text markers on a
       360px axis is illegible mush. Every trade is one row with side, entry, exit, reason and
       P&L, coloured win/loss; tapping a row selects it and the chart draws THAT trade's own
       entry/exit labels and connects them. The newest trade is selected on open, so labels are
       visible immediately.
   The server does the matching (mobile_home2.mobile_v10chart) — dates converted to IST in SQL,
   FUT legs only, trades older than the window dropped and counted, never clamped onto a candle. */
var V10 = { sym: 'NIFTY50', data: null, sel: null,
            leg: 'FUT', win: null, mfold: {},
            loading: false, pageErr: null };   // cc#949: one in-flight page fetch, last error

function v10Icon(sym){
  return '<button class="v10ic" onclick="openV10(event,\'' + sym + '\')" aria-label="V10 chart"'
    + ' title="3-month chart with V10 trades">'
    + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="2.4" stroke-linecap="round"><path d="M5 20V11M5 8V4M12 20v-4M12 13V4M19 20v-9M19 8V4"/></svg>'
    + '</button>';
}
function openV10(ev, sym){
  if (ev){ ev.stopPropagation(); ev.preventDefault(); }
  V10.sym = sym || 'NIFTY50';
  V10.win = null; V10.mfold = {};   // cc#928: fresh index, fresh window
  var ov = document.getElementById('v10ov');
  if (ov) ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  loadV10();
}
function closeV10(){
  var ov = document.getElementById('v10ov');
  if (ov) ov.classList.remove('open');
  document.body.style.overflow = '';
  V10.data = null; V10.sel = null;
}
function setV10(sym){
  if (V10.sym === sym) return;
  V10.sym = sym; V10.sel = null; V10.win = null; V10.mfold = {};
  loadV10();
}
function v10Toggle(){
  return '<div class="v10tg">'
    + ['NIFTY50', 'BANKNIFTY'].map(function(s){
        return '<button class="' + (V10.sym === s ? 'on' : '') + '" onclick="setV10(\'' + s + '\')">'
          + (s === 'BANKNIFTY' ? 'BANK NIFTY' : 'NIFTY 50') + '</button>';
      }).join('') + '</div>';
}
function loadV10(barsArg){
  var bd = document.getElementById('v10bd');
  if (!bd) return;
  bd.innerHTML = v10Toggle() + '<div class="loading">Loading chart…</div>';
  var want = V10.sym;
  /* cc#949: bars=0 is the DAILY sentinel the endpoint now honours — used by the floor handoff.
     Anything else (or nothing) is the 90-bar intraday page. */
  var nb = (barsArg === 0) ? 0 : V10_BARWIN;
  V10.win = null; V10.loading = false; V10.pageErr = null;
  fetchWithTimeout('/api/mobile/v10chart?symbol=' + encodeURIComponent(want) + '&bars=' + nb)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (V10.sym !== want) return;              // a fast double-tap must not draw the wrong index
      if (d && d.error) throw new Error(d.error);
      V10.data = d;

         would "carry visible labels without a tap" — that was the right call when labels were the

         would put one worded label on a chart the card says must open with no text in the price

      V10.sel = null;

    })
    .catch(function(e){
      if (V10.sym !== want) return;
      document.getElementById('v10bd').innerHTML = v10Toggle()
        + '<div class="empty"><b>Chart unavailable</b>' + esc(e.message) + '</div>';
    });
}
/* ══ cc#928: WINDOWED CHART + THUMB PAN ════════════════════════════════════════════════════
   64 sessions at once was too dense to read on a phone. The full series still loads once; the
   chart now shows a ONE MONTH window (22 sessions) and you drag it back through history with a
   thumb. Dragging RIGHT moves the window BACK in time, which is the direction every chart app
   uses — you are pulling the paper rightwards to see what came before.

   The drag must not fight the page: the SVG carries touch-action:pan-y, and the handler only
   calls preventDefault once the gesture is clearly HORIZONTAL (|dx| > |dy|). A vertical swipe
   therefore scrolls the page as normal and never gets swallowed by the chart. */
var V10_WIN = 22;                       // ~1 trading month, daily mode
/* cc#952 (founder 09-Aug) — THE FIRST SCREEN IS 360 BARS, ~4.8 sessions, about a trading week.
   This SUPERSEDES the 90-bar first load locked in cc#941/945; this card is the record.
   No endpoint change was needed: /api/mobile/v10chart already clamps bars at max 400, so the
   client simply asks for more. Pan-back pages (cc#949) request 360 too, so a page is always a
   screen and the cursor arithmetic stays uniform.
   DENSITY, measured rather than assumed: the SVG viewBox is 360 wide with 4px/42px gutters, so
   314 units carry the series. At 360 bars that is 0.87 units per bar — under 1px. That would
   collapse candle bodies, which is why the card asks for a close-line fallback; this chart has
   ALWAYS drawn a close polyline with an area fill, never candles, so no fallback is needed and
   none was added. A polyline has no per-point minimum width — it just gets denser. */
var V10_BARWIN = 360;                   // cc#952: the 5-min viewport, one server page wide
var V10_MAXBARS = 1440;                 // 4 pages held at once, scaled with the window

function v10Bars(d){ return (d && d.resolution === '5m'); }
function v10Win(d){ return v10Bars(d) ? V10_BARWIN : V10_WIN; }

/* ══ cc#949 — PAN BACK THROUGH HISTORY ═══════════════════════════════════════════════════════
   cc#941 switched the pan OFF because the server sent a fixed 90 bars and there was nothing to
   pan to. Now there is: the endpoint pages with before=<ts>, so reaching the left edge FETCHES.

   The viewport stays 90 bars wide whatever is loaded, so the founder always reads the same
   density — panning moves the window, it does not zoom out.

   PREPENDING MUST NOT MOVE WHAT IS ON SCREEN. Older bars are added to the FRONT of the array, so
   every index shifts by the number added; V10.win is advanced by exactly that count in the same
   step, which is what keeps the visible bars still while the axis grows to the left. Getting
   this wrong is not subtle — the chart jumps a page every time a fetch lands. */
function v10Clamp(i, n, win){ return Math.max(0, Math.min(Math.max(0, n - win), i)); }
function v10Window(d){
  var n = (d.series || []).length, win = v10Win(d);
  if (V10.win == null) V10.win = Math.max(0, n - win);   // default = the newest page
  V10.win = v10Clamp(V10.win, n, win);
  return { from: V10.win, to: Math.min(n, V10.win + win) };
}
/* slide the window so a given date sits inside it — used when a trade row is tapped */
function v10ShowDate(d, iso){
  var s = d.series || [], win = v10Win(d);
  for (var i = 0; i < s.length; i++){
    if ((s[i].day || s[i].d) === iso){
      V10.win = v10Clamp(i - Math.floor(win / 2), s.length, win);
      return true;
    }
  }
  return false;
}

/* ── lazy prepend ───────────────────────────────────────────────────────────────────────────
   One in-flight fetch at a time (V10.loading), because a fast flick fires the edge condition on
   every frame and N overlapping fetches would prepend the same page N times. */
function v10PageBack(){
  var d = V10.data;
  if (!d || !v10Bars(d) || V10.loading || d.has_more === false || !d.oldest_ts) return;
  V10.loading = true; V10.pageErr = null;
  renderV10();                                     // paint the left-edge shimmer immediately
  var want = V10.sym, cursor = d.oldest_ts;
  fetchWithTimeout('/api/mobile/v10chart?symbol=' + encodeURIComponent(want)
      + '&bars=' + V10_BARWIN + '&before=' + encodeURIComponent(cursor))
    .then(function(r){ return r.json(); })
    .then(function(p){
      /* the user may have switched symbol, or panned somewhere else entirely, mid-flight —
         the same stale-response guard cc#947 had to add to the C card, applied up front here */
      if (V10.sym !== want || !V10.data || V10.data.oldest_ts !== cursor) return;
      if (!p || p.error || !p.series || !p.series.length){
        V10.data.has_more = false; return;         // nothing older: stop offering the pan
      }
      var cur = V10.data;
      var added = p.series.length;
      cur.series = p.series.concat(cur.series);
      cur.pins = v10MergePins(p.pins, cur.pins);
      cur.oldest_ts = p.oldest_ts;
      cur.has_more = !!p.has_more;
      cur.floor_note = p.floor_note || cur.floor_note;
      V10.win = (V10.win || 0) + added;            // hold the visible bars still
      /* memory cap: drop from the NEWEST end, never the oldest — the founder is travelling
         backwards, so the far side is the side they are done with. V10.win rebases with it. */
      var over = cur.series.length - V10_MAXBARS;
      if (over > 0){
        cur.series = cur.series.slice(0, cur.series.length - over);
        V10.win = v10Clamp(V10.win, cur.series.length, V10_BARWIN);
      }
    })
    .catch(function(e){ V10.pageErr = (e && e.message) || 'network'; })
    .then(function(){ V10.loading = false; renderV10(); });
}
/* pins are keyed by trade id + kind, so two pages that both mention one trade (an entry on one
   page, its exit on another, or an overlap at a boundary) merge to one marker each, not two */
function v10MergePins(a, b){
  var seen = {}, out = [];
  (a || []).concat(b || []).forEach(function(p){
    var k = p.id + '|' + p.kind + '|' + (p.d || '');
    if (seen[k]) return;
    seen[k] = 1; out.push(p);
  });
  return out;
}
function v10Retry(){ V10.pageErr = null; v10PageBack(); }
function v10ToDaily(){
  V10.win = null; V10.loading = false; V10.pageErr = null;
  loadV10(0);                                      // bars=0 -> the daily aggregation
}

function v10Svg(d){
  var all = d.series || [];
  var w = v10Window(d);
  var s = all.slice(w.from, w.to), n = s.length;
  if (n < 2) return '<div class="sum">Not enough price history for this window.</div>';
  /* cc#972: PB was 20 (the date axis alone). It is now 44 — 24px of EVENT RAIL plus the same
     20px axis, so the rail is carved out of the plot exactly as the card specifies and the date
     labels keep their original position at H-5. Plot height goes 164 -> 140. */
  var W = 360, H = 200, PL = 4, PR = 42, PT = 16, PB = 44;
  var RAIL_TOP = H - PB + 2, RAIL_GY = RAIL_TOP + 7, RAIL_CY = RAIL_TOP + 19;
  var lo = Infinity, hi = -Infinity;
  s.forEach(function(p){ if (p.c < lo) lo = p.c; if (p.c > hi) hi = p.c; });
  /* cc#941: index on `day`, not `d`. In 5-min mode `d` is "YYYY-MM-DD HH:MM" and a pin carries a
     DATE, so keying on `d` would match nothing and every marker would silently vanish. `day` is
     the session in both resolutions — one key that works for both. Several bars share a session,
     so the FIRST bar of the day wins and a pin lands at the session's left edge. */
  var inWin = {};
  s.forEach(function(p, i){ var k = p.day || p.d; if (inWin[k] === undefined) inWin[k] = i; });
  (d.pins || []).forEach(function(p){
    if (inWin[p.d] !== undefined && p.price != null){
      if (p.price < lo) lo = p.price; if (p.price > hi) hi = p.price;
    }
  });
  var pad = (hi - lo) * 0.08 || 1;
  lo -= pad; hi += pad;
  var rng = (hi - lo) || 1;
  var xs = function(i){ return PL + i / (n - 1) * (W - PL - PR); };
  var ys = function(v){ return PT + (1 - (v - lo) / rng) * (H - PT - PB); };

  var out = [];
  for (var g = 0; g <= 3; g++){
    var gv = lo + rng * g / 3, gy = ys(gv);
    out.push('<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - PR).toFixed(1)
      + '" y2="' + gy.toFixed(1) + '" stroke="rgba(148,166,210,.09)" stroke-width="1"/>');
    out.push('<text x="' + (W - PR + 4) + '" y="' + (gy + 3).toFixed(1) + '" font-size="9"'
      + ' fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">'
      + Math.round(gv).toLocaleString('en-IN') + '</text>');
  }
  var pts = s.map(function(p, i){ return xs(i).toFixed(1) + ',' + ys(p.c).toFixed(1); }).join(' ');
  out.push('<polygon points="' + PL + ',' + (H - PB) + ' ' + pts + ' '
    + xs(n - 1).toFixed(1) + ',' + (H - PB) + '" fill="rgba(77,124,254,.10)"/>');
  out.push('<polyline points="' + pts + '" fill="none" stroke="var(--blu,#4D7CFE)"'
    + ' stroke-width="1.6" stroke-linejoin="round"/>');

  /* ══ cc#972 — THE EVENTS MOVED TO A RAIL ════════════════════════════════════════════════
     SUPERSEDES cc#951's always-on labels and DELETES its LABEL_MAX_PINS threshold entirely.
     cc#951 gated worded labels on a pin count (12 at the cc#952 360-bar window) on the theory
     that density was the only problem. It was not a threshold problem: at 360 bars the founder's
     own window carries enough events that the labels become a text wall over the price line, and
     any constant I picked would just move the wall a few pins further out.

     RESTING STATE: the price area carries NO TEXT. Dots at the exact price points, the open
     position's dashed level, and nothing else. Every event is stated once, in a rail under the
     plot: a glyph at the event's true x with a 2-3 letter code beneath it, and a faint tick
     rising toward its dot so the eye can pair them without a line cutting the chart.
     TAP STATE: the worded cc#951 string (BUY 24,615 / TARGET HIT 24,774) and its colours come
     back for the ONE selected trade, with the tick promoted to a full-height guide.

     So the labels were not deleted — they stopped being the resting state. */

  function pinCol(p){
    if (p.kind !== 'exit') return (p.side === 'BUY' ? 'var(--grn,#2FD48B)' : 'var(--red,#FF5C6C)');
    var r = String(p.reason || '').toUpperCase();
    return (r === 'SL') ? 'var(--red,#FF5C6C)'
         : (r === 'TARGET') ? 'var(--grn,#2FD48B)' : 'var(--mut,#94A6D2)';
  }
  function pinText(p){
    var px = (p.price == null) ? '' : Math.round(p.price).toLocaleString('en-IN');
    if (p.kind === 'open') return (p.side === 'BUY' ? 'BUY ' : 'SELL ') + px + ' \u00b7 OPEN';
    if (p.kind !== 'exit')  return (p.side === 'BUY' ? 'BUY ' : 'SELL ') + px;
    var r = String(p.reason || 'EXIT').toUpperCase();
    /* TARGET and SL read as events, not codes — "TARGET HIT", "SL HIT". Any other reason is
       printed verbatim and left grey: an EOD close is not a verdict and must not be dressed as one. */
    return (r === 'TARGET' ? 'TARGET HIT ' : r === 'SL' ? 'SL HIT ' : r + ' ') + px;
  }

  /* code + glyph per event kind. FLIP is resolved after grouping, below. */
  function pinCode(p){
    if (p.kind === 'open') return 'O';
    if (p.kind !== 'exit') return (p.side === 'BUY') ? 'B' : 'S';
    var r = String(p.reason || '').toUpperCase();
    return (r === 'TARGET') ? 'T' : (r === 'SL') ? 'SL' : 'X';
  }
  function railGlyph(p, x, cy, col, op){
    var g = '';
    if (p.kind === 'open')
      g = '<circle cx="' + x.toFixed(1) + '" cy="' + cy + '" r="3.4" fill="none" stroke="' + col
        + '" stroke-width="1.4"/>';
    else if (p.kind !== 'exit'){
      /* entry: triangle points the way the trade is facing — up for BUY, down for SELL. */
      var up = (p.side === 'BUY');
      g = up
        ? '<path d="M' + x.toFixed(1) + ' ' + (cy - 4) + 'l4 7h-8z" fill="' + col + '"/>'
        : '<path d="M' + x.toFixed(1) + ' ' + (cy + 4) + 'l4 -7h-8z" fill="' + col + '"/>';
    } else {
      g = '<path d="M' + x.toFixed(1) + ' ' + (cy - 4.2) + 'l4.2 4.2l-4.2 4.2l-4.2 -4.2z" fill="'
        + col + '"/>';
    }
    return '<g opacity="' + op + '">' + g + '</g>';
  }

  var selPins = [], labels = [], rail = [];
  (d.pins || []).forEach(function(p){
    var i = inWin[p.d];
    if (i === undefined) return;                    // outside the visible window
    var x = xs(i), y = ys(p.price != null ? p.price : s[i].c);
    var isSel = (p.id === V10.sel), dim = (V10.sel != null && !isSel);
    var entry = (p.kind !== 'exit');
    var op = dim ? '.45' : '1';                     // cc#951 item 5: dim, not nearly invisible
    var col = pinCol(p);

    if (p.kind === 'open'){
      /* the open position keeps its dashed level line and pulse — it is a level you are still
         sitting at, not a past event, and that reads differently from a dot (cc#945). */
      out.push('<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR).toFixed(1)
        + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="4 3"'
        + ' opacity="' + (dim ? '.2' : '.55') + '"/>');
      out.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6" fill="none"'
        + ' stroke="' + col + '" stroke-width="1" opacity="' + (dim ? '.2' : '.45') + '">'
        + '<animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>'
        + '<animate attributeName="opacity" values=".55;0;.55" dur="2s" repeatCount="indefinite"/>'
        + '</circle>');
    }
    /* cc#951 item 2: the 11px triangle and the X are gone. A 3.5px filled dot anchors the label
       to the exact price point; the words carry the meaning now, so a second encoding of the same
       fact in a shape is just noise competing with the text. */
    out.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="' + col
      + '" opacity="' + op + '" style="cursor:pointer" onclick="v10Sel(' + p.id + ')"/>');

    if (isSel) selPins.push({x: x, y: y, p: p, entry: entry});
    /* cc#972: a label ONLY for the selected trade. Nothing else writes text in the price area. */
    if (isSel)
      labels.push({x: x, y: y, p: p, entry: entry, col: col, op: '1'});
    rail.push({x: x, y: y, i: i, p: p, col: col, sel: isSel, dim: dim,
               code: pinCode(p), entry: entry});
  });

  /* the connector between a selected trade's entry and exit stays — it is the one thing a label
     cannot say, because it is a relationship between two points rather than a fact about one. */
  if (selPins.length === 2){
    out.push('<line x1="' + selPins[0].x.toFixed(1) + '" y1="' + selPins[0].y.toFixed(1)
      + '" x2="' + selPins[1].x.toFixed(1) + '" y2="' + selPins[1].y.toFixed(1)
      + '" stroke="var(--blu,#4D7CFE)" stroke-width="1.2" stroke-dasharray="3 2"/>');
  }

  /* cc#951 item 3 — COLLISION. Entry labels sit below their point, exit labels above, which
     separates the common case for free. What is left is two labels of the SAME kind landing on
     top of each other, so each one is checked against those already placed: overlapping in x AND
     within 12px in y means push it a further 12px in its own direction, and repeat. Placement is
     left-to-right so the earlier trade keeps the position closest to its bar. */
  var placed = [];
  labels.sort(function(a, b){ return a.x - b.x; });
  labels.forEach(function(q){
    var p = q.p;
    var txt = pinText(p);
    var half = txt.length * 2.6;                       // ~5.2px per char at 9.5px Plex Mono
    var ty = q.entry ? q.y + 24 : q.y - 16;
    var dir = q.entry ? 12 : -12;
    for (var guard = 0; guard < 6; guard++){
      var hit = false;
      for (var k = 0; k < placed.length; k++){
        var o = placed[k];
        if (Math.abs(o.ty - ty) < 12 && Math.abs(o.x - q.x) < (o.half + half)) { hit = true; break; }
      }
      if (!hit) break;
      ty += dir;
    }
    placed.push({ x: q.x, ty: ty, half: half });
    var anch = q.x > W - PR - 66 ? 'end' : (q.x < 56 ? 'start' : 'middle');
    out.push('<text x="' + q.x.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="' + anch
      + '" font-size="9.5" font-weight="700" fill="' + q.col + '" opacity="' + q.op + '"'
      + ' style="cursor:pointer" onclick="v10Sel(' + p.id + ')"'
      + ' font-family="IBM Plex Mono,monospace">' + esc(txt) + '</text>');
  });
  /* ══ cc#972 THE RAIL ═══════════════════════════════════════════════════════════════════════
     FLIP FIRST. A flip signal closes one trade and opens the opposite one in the same session, so
     two pins land on the SAME bar index. Drawing both would put a diamond and a triangle on top of
     each other and print two codes in one place. Grouped by index: a group holding both an exit
     and an entry is one FLIP marker, and its tap selects the ENTRY (the trade you are now in,
     which is the one you want to read about). */
  var byIdx = {};
  rail.forEach(function(r){ (byIdx[r.i] = byIdx[r.i] || []).push(r); });
  var marks = [];
  Object.keys(byIdx).forEach(function(k){
    var grp = byIdx[k];
    var hasExit = grp.some(function(r){ return r.p.kind === 'exit'; });
    var hasEntry = grp.some(function(r){ return r.p.kind !== 'exit' && r.p.kind !== 'open'; });
    if (grp.length > 1 && hasExit && hasEntry){
      /* merge ONLY the close+open pair. Anything else sharing the bar — an OPEN position marker,
         a second exit — keeps its own glyph: folding it into FLIP would delete an event from the
         rail, and the rail's whole job is that every event is stated exactly once. */
      var ent = null, ex = null, rest = [];
      grp.forEach(function(r){
        if (!ex && r.p.kind === 'exit') ex = r;
        else if (!ent && r.p.kind !== 'exit' && r.p.kind !== 'open') ent = r;
        else rest.push(r);
      });
      marks.push({x: ent.x, y: ent.y, p: ent.p, col: ent.col, code: 'FLIP', flip: true,
                  sel: (ent.sel || ex.sel), dim: (ent.dim && ex.dim), exCol: ex.col});
      rest.forEach(function(r){ marks.push(r); });
    } else {
      grp.forEach(function(r){ marks.push(r); });
    }
  });
  marks.sort(function(a, b){ return a.x - b.x; });

  /* the tick. At rest it is a stub rising a little way toward the dot at 0.25 alpha — enough to
     pair marker and point, not enough to draw a grid over the price line. Selected, it becomes
     the full-height guide the card asks for. */
  marks.forEach(function(m){
    if (m.sel){
      out.push('<line x1="' + m.x.toFixed(1) + '" y1="' + PT + '" x2="' + m.x.toFixed(1)
        + '" y2="' + RAIL_TOP + '" stroke="' + m.col + '" stroke-width="1" opacity=".55"/>');
    } else {
      var top = Math.max(m.y + 6, RAIL_TOP - 14);   // a stub, never all the way to the dot
      out.push('<line x1="' + m.x.toFixed(1) + '" y1="' + top.toFixed(1) + '" x2="' + m.x.toFixed(1)
        + '" y2="' + RAIL_TOP + '" stroke="' + m.col + '" stroke-width="1" opacity="'
        + (m.dim ? '.12' : '.25') + '"/>');
    }
  });

  /* glyphs at their TRUE x, always. They may touch — the card allows that — because moving a
     glyph would put the event at a time it did not happen. A flip shows both colours: the exit's
     diamond behind, the entry's triangle in front. */
  marks.forEach(function(m){
    var op = m.sel ? '1' : (m.dim ? '.45' : '1');
    if (m.flip)
      out.push('<path d="M' + m.x.toFixed(1) + ' ' + (RAIL_GY - 4.2) + 'l4.2 4.2l-4.2 4.2l-4.2 -4.2z"'
        + ' fill="' + m.exCol + '" opacity="' + (m.sel ? '.85' : '.5') + '"/>');
    out.push(railGlyph(m.p, m.x, RAIL_GY, m.col, op));
    /* the whole marker is the tap target, sized for a thumb rather than for the glyph. */
    out.push('<rect x="' + (m.x - 11).toFixed(1) + '" y="' + RAIL_TOP + '" width="22" height="24"'
      + ' fill="transparent" style="cursor:pointer" onclick="v10Sel(' + m.p.id + ')"/>');
  });

  /* CODES. Left to right, each one checked against the last PLACED code: nudge up to 5px to clear
     it, and if that is not enough, drop this code and keep its glyph. Dropping beats nudging
     further — a code shifted far enough to sit under a different glyph is worse than no code, and
     the card explicitly prefers glyphs-only at extreme density. Codes never overprint. */
  var lastRight = -1e9;
  marks.forEach(function(m){
    var half = m.code.length * 2.4 + 1.2;            // ~4.8px/char at 8px Plex Mono
    var cx = m.x, left = cx - half;
    if (left < lastRight){
      var shift = lastRight - left;
      if (shift > 5) return;                         // too tight: glyph only
      cx += shift; left = cx - half;
    }
    lastRight = cx + half;
    out.push('<text x="' + cx.toFixed(1) + '" y="' + RAIL_CY + '" text-anchor="middle"'
      + ' font-size="8" font-weight="700" fill="' + m.col + '" opacity="'
      + (m.sel ? '1' : (m.dim ? '.45' : '.8')) + '" style="cursor:pointer"'
      + ' onclick="v10Sel(' + m.p.id + ')" font-family="IBM Plex Mono,monospace">'
      + esc(m.code) + '</text>');
  });

  out.push('<text x="' + PL + '" y="' + (H - 5) + '" font-size="9" fill="var(--dim,#5E6B8F)"'
    + ' font-family="IBM Plex Mono,monospace">' + esc(dlab(s[0].d)) + '</text>');
  out.push('<text x="' + (W - PR).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="end" font-size="9"'
    + ' fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(dlab(s[n - 1].d)) + '</text>');

  var more = w.from > 0;
  return '<div class="v10cv" id="v10cv">'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"'
    + ' style="width:100%;height:' + H + 'px;display:block;touch-action:pan-y">' + out.join('') + '</svg>'
    + '<div class="v10hint">' + v10HintText(d, n, all.length, more) + '</div></div>';
}

/* cc#949 item 2/3: the strip under the chart is the paging state — loading, a retry after a
   failed fetch, or the terminal marker at the floor. It is never silently blank at the end of
   history: a pan that stops working with no explanation reads as a bug. */
function v10HintText(d, n, total, more){
  if (!v10Bars(d))
    return (more ? '← drag right for older' : 'start of history') + ' · showing ' + n + ' of ' + total + ' sessions';
  if (V10.loading)
    return '<span class="v10shim"></span> loading older bars…';
  if (V10.pageErr)
    return 'Could not load older bars · <button class="v10rty" onclick="v10Retry()">Retry</button>';
  if (d.has_more === false && (V10.win || 0) === 0)
    return '<button class="v10rty" onclick="v10ToDaily()">Older history in Daily view →</button>';
  return (d.has_more === false ? 'start of 5-min history' : '← drag right for older')
       + ' · showing ' + n + ' of ' + total + ' bars';
}

/* ── drag: horizontal only, and only once the gesture proves itself horizontal ── */
var V10DRAG = null;
function v10DragStart(e){
  var t = e.touches ? e.touches[0] : e;
  V10DRAG = { x: t.clientX, y: t.clientY, win: V10.win, w: 0, axis: null };
}
function v10DragMove(e){
  if (!V10DRAG || !V10.data) return;
  var t = e.touches ? e.touches[0] : e;
  var dx = t.clientX - V10DRAG.x, dy = t.clientY - V10DRAG.y;
  if (V10DRAG.axis === null){
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;      // too small to call yet
    V10DRAG.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (V10DRAG.axis !== 'x') return;                        // vertical: leave it to the page
  if (e.cancelable) e.preventDefault();
  var host = document.getElementById('v10cv');
  var wpx = host ? host.clientWidth : 340;
  /* cc#949: the pan is BACK in 5-min mode — cc#941 disabled it only because the window was the
     whole series. It now pages, so dragging right past the left edge asks for the next page. */
  var per = wpx / v10Win(V10.data);                        // px per bar/session in the window
  var shift = Math.round(dx / per);
  var next = v10Clamp(V10DRAG.win - shift, V10.data.series.length, v10Win(V10.data));
  if (next === 0 && shift > 0) v10PageBack();              // at the left edge and still pulling
  if (next !== V10.win){ V10.win = next; renderV10(); }
}
function v10DragEnd(){ V10DRAG = null; }

/* ══ cc#928: TRADE LOG — FUTURES / OPTIONS, OPEN pinned, closed grouped by month ═══════════
   SPLIT CHOICE (stated): TABS, not two stacked sections. On a phone two full logs stacked means
   scrolling past everything futures to reach the first option; a two-button switch keeps both one
   tap away and the month grouping identical inside each, which is what the card asks for.
   The data backs both tabs — verified before building: 45 closed FUT and 36 closed OPT trades,
   plus 1 open of each, and every OPT row carries its strike and type. */
var MONN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monKey(iso){
  if (!iso) return 'Undated';
  var p = String(iso).split('-');
  return p.length < 2 ? 'Undated' : (MONN[Number(p[1]) - 1] + ' ' + p[0]);
}
/* cc#948: v10SetLeg RESTORED. cc#941 removed it as dead code; it was founder-approved UI from
   cc#920/928 that no spec asked to remove. Now switches ALL / FUT / OPT. */
function v10SetLeg(l){ V10.leg = l; V10.sel = null; renderV10(); }
function v10FoldMon(k){ V10.mfold[k] = !V10.mfold[k]; renderV10(); }

/* tapping a row selects the trade AND slides the chart to it (card item 3c) */
function v10Sel(id){
  var was = V10.sel;
  V10.sel = (was === id) ? null : id;
  if (V10.sel != null && V10.data){
    var t = (V10.data.trades || []).filter(function(x){ return x.id === id; })[0];
    if (t && t.leg === 'FUT') v10ShowDate(V10.data, t.entry_d);
  }

/* cc#941: v10Row() is GONE with the leg rows it rendered. Removed rather than left
   behind as an unreachable function — the next reader should not have to work out
   which of two trade renderers is live. v10Card() below is the only one. */
/* ══ cc#941 + cc#954: PAIRED TRADE CARDS ══════════════════════════════════════════════════════
   THE MODEL, corrected by the founder on 09-Aug and written here because my cc#941 comment taught
   it wrong and cc#948 inherited the mistake. The V10 engine fires each signal TWO WAYS:
       FUT   a directional index expression   (long view -> BUY the future)
       OPT   a short-premium expression of the SAME view (long view -> SELL the PE)
   The OPT leg is a PEER TRADE, not a hedge. Nothing is being protected — both legs are the engine
   saying the same thing in two instruments, and the net is that signal's result across both.
   The word "hedge" entered through a code comment and spread into the UI from there; it implied a
   risk-offset that does not exist and made the OPT leg look subordinate to the FUT leg when they
   are peers. Every user-visible string now says OPT.

   Why ONE CARD rather than two rows: the two legs are stored as two rows sharing (symbol,
   entry_ts), and shown raw they read as two separate trades on two different price scales — an
   index level (58,004) beside a premium (220) — with the OPT leg's opposite side making every LONG
   look like it had a SELL next to it. The number that matters, the signal's net across both legs,
   was on neither row.
   Pairing is done SERVER-side in v10_endpoints.paired_trades and read from d.paired, so this
   template and the desktop table cannot disagree about a net (16202). The OPT leg is one grey
   sub-line inside its trade's card, which is where a premium belongs. */
/* cc#953 item 1 — THE NET, ONE LINE, ALWAYS.
   The right column overflowed on six-digit values: "+Rs1,26,328" is 11 characters of Plex Mono at
   15px, wider than the column can be on a 360px card without starving the left zone.
   Two changes, both from the card:
     NO PLUS SIGN. The colour already carries the sign — green is a gain, red a loss — so a "+"
     spends a character restating what the eye has already read. The MINUS is kept: a leading
     minus is how a negative number is written, and dropping it would leave colour as the ONLY
     carrier of the sign, which fails the moment someone cannot distinguish the two colours.
     COMPACT PAST 5 DIGITS. At six digits or more the value renders as Rs1.26L. Below that it is
     printed in full, because Rs99,999 is exact and fits. The widest string this can produce is
     "-Rs99,999" (9 chars) or "-Rs12.63L" (9 chars) — measured across the range, never wider. */
function v10Net(v){
  if (v == null) return '\u2014';
  var a = Math.abs(v), sign = (v < 0) ? '\u2212' : '';
  return sign + (a >= 100000 ? '\u20B9' + (a / 100000).toFixed(2) + 'L'
                             : '\u20B9' + Math.round(a).toLocaleString('en-IN'));
}

function v10ReasonCls(r){
  r = String(r || '').toUpperCase();
  if (r === 'SL') return 'bad';
  if (r === 'TARGET') return 'good';
  if (r === 'OPEN') return 'open';
  return 'neut';                                  // EOD and anything else: grey, never coloured
}
function v10Card(t, hideOpt){
  var px2 = function(v){ return v == null ? '--' : Math.round(v).toLocaleString('en-IN'); };
  var long = t.direction === 'LONG';
  /* cc#954: the payload field is still named `hedge` (server-side rename is out of scope for a
     template-only card and is tracked separately); the DISPLAY never uses that word. */
  var hedge = hideOpt ? null : t.hedge;
  var net = v10Net(t.net_r);
  var pts = (t.points == null) ? '' : ((t.points >= 0 ? '+' : '') + Number(t.points).toFixed(0) + ' pts');
  return '<div class="v10c ' + (t.net_r == null ? 'op' : (t.win ? 'wn' : 'ls'))
      + (V10.sel === t.id ? ' sel' : '') + '" onclick="v10Sel(' + t.id + ')">'
    + '<span class="rl"></span><span class="v10cb">'
    + '<div class="c1"><span class="sym">' + esc(t.symbol === 'BANKNIFTY' ? 'BANKNIFTY' : 'NIFTY') + '</span>'
      + '<span class="pill ' + (long ? 'lg' : 'sh') + '">' + (long ? 'LONG' : 'SHORT') + '</span>'
      + '<span class="rsn2 ' + v10ReasonCls(t.reason) + '">' + esc(t.reason) + '</span></div>'
    + '<div class="c2">' + px2(t.entry_price) + ' \u2192 ' + (t.exit_price == null ? 'open' : px2(t.exit_price)) + '</div>'
    + '<div class="c3">' + esc(t.entry_ist || '') + (t.exit_ist ? ' \u2192 ' + esc(t.exit_ist) : '')
      + (t.held ? ' \u00b7 ' + esc(t.held) : '') + '</div>'
    + (hedge ? '<div class="c4"><span class="htag">OPT</span>'
        + '<span class="hmid">' + esc(hedge.label || '') + ' \u00b7 ' + esc(hedge.side || '') + ' '
        + px2(hedge.entry_price) + ' \u2192 ' + px2(hedge.exit_price) + '</span>'
        + '<em class="' + cls(hedge.pnl) + '">' + (hedge.pnl == null ? '--' : inrShort(hedge.pnl))
        + '</em></div>' : '')
    + '</span>'
    /* THE RIGHT COLUMN — fixed, right-aligned, vertically centred. This is what cc#941 lost and
       what the founder is asking back for: every card's result sits at the same x, so the log
       scans as one vertical column of P&Ls instead of a number hiding at the end of line 3. */
    + '<span class="v10rt"><b class="' + cls(t.net_r) + '">' + net + '</b>'
    + (pts ? '<span>' + esc(pts) + '</span>' : '') + '</span></div>';
}

/* cc#948 item 1 — OPTION LEG CARD, premium scale, its own list.
   An option leg is a PREMIUM (220), a futures leg an index level (58,004). The cc#941 finding
   that those must never share a column still stands, which is exactly why OPTIONS is its own
   view rather than a column added to the paired card. Same anatomy, same right-hand result
   column, so the two lists read identically even though their numbers are on different scales. */
function v10OptCard(t){
  var px2 = function(v){ return v == null ? '--' : Number(v).toFixed(2); };
  var buy = (t.side === 'BUY');
  /* round the MAGNITUDE, not the signed value. Math.round(-772.5) is -772 in JS (ties go toward
     +Infinity), so rounding first made this leg read -Rs772 here while the same number read
     -Rs773 on the OPT sub-line of the paired card. One P&L, two figures, on one screen. */
  var pnl = v10Net(t.pnl == null ? null : Math.round(t.pnl));
  var pts = (t.points == null) ? '' : ((t.points >= 0 ? '+' : '') + Number(t.points).toFixed(1) + ' pts');
  var title = (t.opt_strike != null ? Math.round(t.opt_strike).toLocaleString('en-IN') : '?')
            + ' ' + esc(t.opt_type || '');
  return '<div class="v10c ' + (t.pnl == null ? 'op' : (t.pnl >= 0 ? 'wn' : 'ls'))
      + (V10.sel === t.id ? ' sel' : '') + '" onclick="v10Sel(' + t.id + ')">'
    + '<span class="rl"></span><span class="v10cb">'
    + '<div class="c1"><span class="sym">' + title + '</span>'
      + '<span class="pill ' + (buy ? 'lg' : 'sh') + '">' + (buy ? 'BUY' : 'SELL') + '</span>'
      + '<span class="rsn2 ' + v10ReasonCls(t.reason) + '">' + esc(t.reason || 'EXIT') + '</span></div>'
    + '<div class="c2">' + px2(t.entry_price) + ' \u2192 ' + (t.exit_price == null ? 'open' : px2(t.exit_price))
      + ' <span style="color:var(--dim)">premium</span></div>'
    + '<div class="c3">' + esc(dlab(t.entry_d || '')) + (t.exit_d ? ' \u2192 ' + esc(dlab(t.exit_d)) : '')
      + '</div></span>'
    + '<span class="v10rt"><b class="' + cls(t.pnl) + '">' + pnl + '</b>'
    + (pts ? '<span>' + esc(pts) + '</span>' : '') + '</span></div>';
}

function v10Log(d){
  var p = (d.paired) || {};
  if (p.error) return '<div class="sum" style="padding:10px 2px">Trade log unavailable: '
    + esc(p.error) + '</div>';
  var rows = p.trades || [];
  var sm = p.summary || {};
  /* SUMMARY STRIP (card item 4). Every figure comes from the paired set, so the win rate is a
     win rate on NET P&L — the whole point of pairing. A rate with no closed trades prints as a
     dash, never as 0%: no trades is not a 0% record (the cc#912 rule). */
  var h = '<div class="v10sum">'
    + '<div><b>' + (sm.paired_trades || 0) + '</b><span>trades</span></div>'
    + '<div><b>' + (sm.win_rate == null ? '&mdash;' : sm.win_rate + '%') + '</b><span>win rate</span></div>'
    + '<div><b class="' + cls(sm.net_r) + '">' + (sm.net_r == null ? '&mdash;'
        : (sm.net_r >= 0 ? '+' : '\u2212') + '\u20B9' + Math.abs(sm.net_r).toLocaleString('en-IN'))
      + '</b><span>net</span></div>'
    + '<div><b>' + (d.stats && d.stats.open ? d.stats.open : 0) + '</b><span>open</span></div>'
    + '</div>';
  /* cc#953 item 2: the "36 hedged · 9 unhedged" sub-line is REMOVED. It was mine (cc#943 pattern,
     carried into cc#941) and the founder does not want it — and cc#954 shows the framing behind it
     was wrong anyway: nothing was ever hedged, so nothing was ever "unhedged". The honest version
     of that fact now lives on the OPTIONS footer, worded correctly. The four-figure strip stays. */
  /* ══ cc#948 item 1 — QUICK ACCESS RESTORED ═══════════════════════════════════════════════
     I deleted these pills and v10SetLeg() in cc#941 as "dead code". They were not dead: they were
     founder-approved UI from cc#920/928, and NOTHING IN THE cc#941 SPEC ASKED FOR THEIR REMOVAL.
     That is the lesson this card is filed to teach and it is written here so the next reader
     inherits it: a spec that does not name a removal does not authorise one. Unreferenced is not
     the same as unwanted.
     Three views, each on ONE price scale — the cc#941 finding that an index level and a premium
     must never share a column is what makes OPTIONS a separate view rather than an extra column:
       FUTURES   the paired cards, OPT sub-line hidden — pure index scale (default)
       OPTIONS   the option trades as their own cards on premium scale
     Data is the per-leg trades[] and by_leg the payload already carries; no endpoint change. */
  /* cc#953 item 3: TWO pills. ALL is gone — FUTURES already showed every trade (it is the paired
     list with the OPT sub-line hidden), so ALL and FUTURES differed by one line of detail and the
     third button bought nothing. FUTURES is the default. */
  var view = (V10.leg === 'OPT') ? 'OPT' : 'FUT';
  var legs = d.trades || [];
  /* cc#973: CLOSED option legs only, so the two pills count the same KIND of thing. FUTURES is
     rows.length = the paired CLOSED trades (v10_trades); counting open legs here as well made
     OPTIONS read 19 against FUTURES 23 on a book with one open leg of each — two numbers that
     look comparable and are not. The open position is already stated by the OPEN stat cell and
     by the chart's own open marker, in both views. */
  var opts = legs.filter(function(x){ return (x.leg || 'FUT') === 'OPT' && !x.open; });
  var bl = d.by_leg || {};
  h += '<div class="lgtabs">' + [['FUT','FUTURES'],['OPT','OPTIONS']].map(function(v){
      return '<button class="lgt' + (view === v[0] ? ' on' : '') + '"'
        + ' onclick="v10SetLeg(\'' + v[0] + '\')">' + v[1]
        + ' <i>' + (v[0] === 'OPT' ? opts.length : rows.length) + '</i></button>';
    }).join('') + '</div>';

  /* cc#953 item 4 + cc#954 item 2 — THE HONEST COUNT, computed, never padded.
     The two tabs CANNOT hold equal counts and must not be made to look as if they do: the option
     leg only went live partway through the record, so the earliest signals fired futures-only.
     Everything below is derived from d.paired — the count of trades with an OPT leg, the count
     without, and the date the option leg first appears — so the sentence stays true as trades
     accrue and no boundary date is hardcoded.
     WORDING per cc#954: these signals did not "run unhedged". Nothing was ever hedged. They fired
     FUTURES-ONLY, because the second expression of the signal did not exist yet. */
  var withOpt = rows.filter(function(t){ return !!t.hedge; });
  var futOnly = rows.filter(function(t){ return !t.hedge; });
  var firstOpt = withOpt.map(function(t){ return t.entry_date || ''; })
                        .filter(Boolean).sort()[0] || null;
  var early = futOnly.filter(function(t){ return firstOpt && (t.entry_date || '') < firstOpt; }).length;
  var late  = futOnly.length - early;
  var foot;
  if (view === 'OPT'){
    foot = withOpt.length + ' option trade' + (withOpt.length === 1 ? '' : 's');
    if (futOnly.length)
      foot += ' \u00b7 ' + futOnly.length + ' signal' + (futOnly.length === 1 ? '' : 's')
            + ' fired futures-only ('
            + (early ? early + ' before ' + dlab(firstOpt) + ' when the option leg went live' : '')
            + (early && late ? ', ' : '')
            + (late ? late + ' exception' + (late === 1 ? '' : 's') : '') + ')';
  } else {
    foot = (sm.paired_trades || 0) + ' trades \u00b7 net '
         + (sm.net_r == null ? '--' : inrShort(sm.net_pnl));
  }
  if (foot) h += '<div class="sum" style="padding:2px 2px 8px">' + esc(foot) + '</div>';

  if (view === 'OPT'){
    if (!opts.length)
      return h + '<div class="sum" style="padding:10px 2px">No option legs for ' + esc(d.label) + '.</div>';
    return h + v10Months(opts, function(x){ return x.exit_d || x.entry_d || ''; },
                         function(x){ return x.pnl; }, v10OptCard);
  }

  if (!rows.length)
    return h + '<div class="sum" style="padding:10px 2px">No trades for ' + esc(d.label) + '.</div>';

  return h + v10Months(rows, function(t){ return t.exit_date || t.entry_date || ''; },
                       function(t){ return t.net_pnl; },
                       function(t){ return v10Card(t, view === 'FUT'); });
}

/* Month grouping kept from cc#928 — it is how the founder scans the log. Extracted here so the
   paired list and the option-leg list share ONE implementation: two copies would drift, and the
   fold state, the sort and the subtotal all have to behave identically in both views.
   Sorted on a real YYYY-MM key, never on arrival order. */
function v10Months(items, dateOf, pnlOf, cardOf){
  var map = {}, key = {};
  items.forEach(function(t){
    var iso = dateOf(t) || '';
    var k = monKey(iso);
    if (!map[k]){ map[k] = []; key[k] = String(iso).slice(0, 7) || '0000-00'; }
    map[k].push(t);
  });
  var order = Object.keys(map).sort(function(a, b){
    return key[a] < key[b] ? 1 : (key[a] > key[b] ? -1 : 0);      // newest month first
  });
  return order.map(function(k){
    var g = map[k].slice().sort(function(a, b){
      var x = dateOf(a) || '', y = dateOf(b) || '';
      return x < y ? 1 : (x > y ? -1 : (b.id - a.id));
    });
    var net = 0, known = false;
    g.forEach(function(t){ var v = pnlOf(t); if (v != null){ net += v; known = true; } });
    var fold = !!V10.mfold[k];
    return '<div class="mhd" onclick="v10FoldMon(\'' + esc(k).replace(/'/g, "\\'") + '\')">'
      + '<span class="mn">' + esc(k) + '</span>'
      + '<span class="mp ' + (known ? cls(net) : '') + '">' + (known ? inrShort(net) : '--') + '</span>'
      + '<span class="mc">' + g.length + '</span>'
      + '<span class="mx">' + (fold ? '\u25BE' : '\u25B4') + '</span></div>'
      + (fold ? '' : g.map(cardOf).join(''));
  }).join('');
}

function renderV10(){
