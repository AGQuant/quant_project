   This SUPERSEDES the 90-bar first load locked in cc#941/945; this card is the record.
   No endpoint change was needed: /api/mobile/v10chart already clamps bars at max 400, so the
   client simply asks for more. Pan-back pages (cc#949) request 360 too, so a page is always a
   screen and the cursor arithmetic stays uniform.
   DENSITY, measured rather than assumed: the SVG viewBox is 360 wide with 4px/42px gutters, so
   314 units carry the series. At 360 bars that is 0.87 units per bar — under 1px. That would
   collapse candle bodies, which is why the card asks for a close-line fallback; this chart has
   ALWAYS drawn a close polyline with an area fill, never candles, so no fallback is needed and
   none was added. A polyline has no per-point minimum width — it just gets denser. */
var V10_BARWIN = 360;                   // cc#952: the 5-min viewport, one server page wide
var V10_MAXBARS = 1440;                 // 4 pages held at once, scaled with the window

function v10Bars(d){ return (d && d.resolution === '5m'); }
function v10Win(d){ return v10Bars(d) ? V10_BARWIN : V10_WIN; }

/* ══ cc#949 — PAN BACK THROUGH HISTORY ═══════════════════════════════════════════════════════
   cc#941 switched the pan OFF because the server sent a fixed 90 bars and there was nothing to
   pan to. Now there is: the endpoint pages with before=<ts>, so reaching the left edge FETCHES.

   The viewport stays 90 bars wide whatever is loaded, so the founder always reads the same
   density — panning moves the window, it does not zoom out.

   PREPENDING MUST NOT MOVE WHAT IS ON SCREEN. Older bars are added to the FRONT of the array, so
   every index shifts by the number added; V10.win is advanced by exactly that count in the same
   step, which is what keeps the visible bars still while the axis grows to the left. Getting
   this wrong is not subtle — the chart jumps a page every time a fetch lands. */
function v10Clamp(i, n, win){ return Math.max(0, Math.min(Math.max(0, n - win), i)); }
function v10Window(d){
  var n = (d.series || []).length, win = v10Win(d);
  if (V10.win == null) V10.win = Math.max(0, n - win);   // default = the newest page
  V10.win = v10Clamp(V10.win, n, win);
  return { from: V10.win, to: Math.min(n, V10.win + win) };
}
/* slide the window so a given date sits inside it — used when a trade row is tapped */
function v10ShowDate(d, iso){
  var s = d.series || [], win = v10Win(d);
  for (var i = 0; i < s.length; i++){
    if ((s[i].day || s[i].d) === iso){
      V10.win = v10Clamp(i - Math.floor(win / 2), s.length, win);
      return true;
    }
  }
  return false;
}

/* ── lazy prepend ───────────────────────────────────────────────────────────────────────────
   One in-flight fetch at a time (V10.loading), because a fast flick fires the edge condition on
   every frame and N overlapping fetches would prepend the same page N times. */
function v10PageBack(){
  var d = V10.data;
  if (!d || !v10Bars(d) || V10.loading || d.has_more === false || !d.oldest_ts) return;
  V10.loading = true; V10.pageErr = null;
  renderV10();                                     // paint the left-edge shimmer immediately
  var want = V10.sym, cursor = d.oldest_ts;
  fetchWithTimeout('/api/mobile/v10chart?symbol=' + encodeURIComponent(want)
      + '&bars=' + V10_BARWIN + '&before=' + encodeURIComponent(cursor))
    .then(function(r){ return r.json(); })
    .then(function(p){
      /* the user may have switched symbol, or panned somewhere else entirely, mid-flight —
         the same stale-response guard cc#947 had to add to the C card, applied up front here */
      if (V10.sym !== want || !V10.data || V10.data.oldest_ts !== cursor) return;
      if (!p || p.error || !p.series || !p.series.length){
        V10.data.has_more = false; return;         // nothing older: stop offering the pan
      }
      var cur = V10.data;
      var added = p.series.length;
      cur.series = p.series.concat(cur.series);
      cur.pins = v10MergePins(p.pins, cur.pins);
      cur.oldest_ts = p.oldest_ts;
      cur.has_more = !!p.has_more;
      cur.floor_note = p.floor_note || cur.floor_note;
      V10.win = (V10.win || 0) + added;            // hold the visible bars still
      /* memory cap: drop from the NEWEST end, never the oldest — the founder is travelling
         backwards, so the far side is the side they are done with. V10.win rebases with it. */
      var over = cur.series.length - V10_MAXBARS;
      if (over > 0){
        cur.series = cur.series.slice(0, cur.series.length - over);
        V10.win = v10Clamp(V10.win, cur.series.length, V10_BARWIN);

function v10MergePins(a, b){

function v10Svg(d){

      out.push('<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR).toFixed(1)
        + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="1" stroke-dasharray="4 3"'
        + ' opacity="' + (dim ? '.2' : '.55') + '"/>');
      out.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6" fill="none"'
        + ' stroke="' + col + '" stroke-width="1" opacity="' + (dim ? '.2' : '.45') + '">'
        + '<animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>'
        + '<animate attributeName="opacity" values=".55;0;.55" dur="2s" repeatCount="indefinite"/>'
        + '</circle>');
    }
    /* cc#951 item 2: the 11px triangle and the X are gone. A 3.5px filled dot anchors the label
       to the exact price point; the words carry the meaning now, so a second encoding of the same
       fact in a shape is just noise competing with the text. */
    out.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="' + col
      + '" opacity="' + op + '" style="cursor:pointer" onclick="v10Sel(' + p.id + ')"/>');

    if (isSel) selPins.push({x: x, y: y, p: p, entry: entry});
    /* cc#972: a label ONLY for the selected trade. Nothing else writes text in the price area. */
    if (isSel)
      labels.push({x: x, y: y, p: p, entry: entry, col: col, op: '1'});
    rail.push({x: x, y: y, i: i, p: p, col: col, sel: isSel, dim: dim,
               code: pinCode(p), entry: entry});
  });

  /* the connector between a selected trade's entry and exit stays — it is the one thing a label
     cannot say, because it is a relationship between two points rather than a fact about one. */
  if (selPins.length === 2){
    out.push('<line x1="' + selPins[0].x.toFixed(1) + '" y1="' + selPins[0].y.toFixed(1)
      + '" x2="' + selPins[1].x.toFixed(1) + '" y2="' + selPins[1].y.toFixed(1)
      + '" stroke="var(--blu,#4D7CFE)" stroke-width="1.2" stroke-dasharray="3 2"/>');
  }

  /* cc#951 item 3 — COLLISION. Entry labels sit below their point, exit labels above, which
     separates the common case for free. What is left is two labels of the SAME kind landing on
     top of each other, so each one is checked against those already placed: overlapping in x AND
     within 12px in y means push it a further 12px in its own direction, and repeat. Placement is
     left-to-right so the earlier trade keeps the position closest to its bar. */
  var placed = [];
  labels.sort(function(a, b){ return a.x - b.x; });
  labels.forEach(function(q){
    var p = q.p;
    var txt = pinText(p);
    var half = txt.length * 2.6;                       // ~5.2px per char at 9.5px Plex Mono
    var ty = q.entry ? q.y + 24 : q.y - 16;
    var dir = q.entry ? 12 : -12;
    for (var guard = 0; guard < 6; guard++){
      var hit = false;
      for (var k = 0; k < placed.length; k++){
        var o = placed[k];
        if (Math.abs(o.ty - ty) < 12 && Math.abs(o.x - q.x) < (o.half + half)) { hit = true; break; }
      }
      if (!hit) break;
      ty += dir;
    }
    placed.push({ x: q.x, ty: ty, half: half });
    var anch = q.x > W - PR - 66 ? 'end' : (q.x < 56 ? 'start' : 'middle');
    out.push('<text x="' + q.x.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="' + anch
      + '" font-size="9.5" font-weight="700" fill="' + q.col + '" opacity="' + q.op + '"'
      + ' style="cursor:pointer" onclick="v10Sel(' + p.id + ')"'
      + ' font-family="IBM Plex Mono,monospace">' + esc(txt) + '</text>');
  });
  /* ══ cc#972 THE RAIL ═══════════════════════════════════════════════════════════════════════
     FLIP FIRST. A flip signal closes one trade and opens the opposite one in the same session, so
     two pins land on the SAME bar index. Drawing both would put a diamond and a triangle on top of
     each other and print two codes in one place. Grouped by index: a group holding both an exit
     and an entry is one FLIP marker, and its tap selects the ENTRY (the trade you are now in,
     which is the one you want to read about). */
  var byIdx = {};
  rail.forEach(function(r){ (byIdx[r.i] = byIdx[r.i] || []).push(r); });
  var marks = [];
  Object.keys(byIdx).forEach(function(k){
    var grp = byIdx[k];
    var hasExit = grp.some(function(r){ return r.p.kind === 'exit'; });
    var hasEntry = grp.some(function(r){ return r.p.kind !== 'exit' && r.p.kind !== 'open'; });
    if (grp.length > 1 && hasExit && hasEntry){
      /* merge ONLY the close+open pair. Anything else sharing the bar — an OPEN position marker,
         a second exit — keeps its own glyph: folding it into FLIP would delete an event from the
         rail, and the rail's whole job is that every event is stated exactly once. */
      var ent = null, ex = null, rest = [];
      grp.forEach(function(r){
        if (!ex && r.p.kind === 'exit') ex = r;
        else if (!ent && r.p.kind !== 'exit' && r.p.kind !== 'open') ent = r;
        else rest.push(r);
      });
      /* cc#1397: FLIP B / FLIP S, not a bare FLIP — the founder's own ask, and the reuse already
         exists: pinCode(p) already returns B/S for every other entry marker on this chart, and
         ent.p (the entry record this marker's own tap already selects, per the comment above) is
         already in scope. No new direction logic — the same function, the same record. */
      marks.push({x: ent.x, y: ent.y, p: ent.p, col: ent.col, code: 'FLIP ' + pinCode(ent.p), flip: true,
                  sel: (ent.sel || ex.sel), dim: (ent.dim && ex.dim), exCol: ex.col});
      rest.forEach(function(r){ marks.push(r); });
    } else {
      grp.forEach(function(r){ marks.push(r); });
    }
  });
  marks.sort(function(a, b){ return a.x - b.x; });

  /* the tick. At rest it is a stub rising a little way toward the dot at 0.25 alpha — enough to
     pair marker and point, not enough to draw a grid over the price line. Selected, it becomes
     the full-height guide the card asks for. */
  marks.forEach(function(m){
    if (m.sel){
      out.push('<line x1="' + m.x.toFixed(1) + '" y1="' + PT + '" x2="' + m.x.toFixed(1)
        + '" y2="' + RAIL_TOP + '" stroke="' + m.col + '" stroke-width="1" opacity=".55"/>');
    } else {
      var top = Math.max(m.y + 6, RAIL_TOP - 14);   // a stub, never all the way to the dot
      out.push('<line x1="' + m.x.toFixed(1) + '" y1="' + top.toFixed(1) + '" x2="' + m.x.toFixed(1)
        + '" y2="' + RAIL_TOP + '" stroke="' + m.col + '" stroke-width="1" opacity="'
        + (m.dim ? '.12' : '.25') + '"/>');
    }
  });

  /* glyphs at their TRUE x, always. They may touch — the card allows that — because moving a
     glyph would put the event at a time it did not happen. A flip shows both colours: the exit's
     diamond behind, the entry's triangle in front. */
  marks.forEach(function(m){
    var op = m.sel ? '1' : (m.dim ? '.45' : '1');
    if (m.flip)
      out.push('<path d="M' + m.x.toFixed(1) + ' ' + (RAIL_GY - 4.2) + 'l4.2 4.2l-4.2 4.2l-4.2 -4.2z"'
        + ' fill="' + m.exCol + '" opacity="' + (m.sel ? '.85' : '.5') + '"/>');
    out.push(railGlyph(m.p, m.x, RAIL_GY, m.col, op));
    /* the whole marker is the tap target, sized for a thumb rather than for the glyph. */
    out.push('<rect x="' + (m.x - 11).toFixed(1) + '" y="' + RAIL_TOP + '" width="22" height="24"'
      + ' fill="transparent" style="cursor:pointer" onclick="v10Sel(' + m.p.id + ')"/>');
  });

  /* CODES. Left to right, each one checked against the last PLACED code: nudge up to 5px to clear
     it, and if that is not enough, drop this code and keep its glyph. Dropping beats nudging
     further — a code shifted far enough to sit under a different glyph is worse than no code, and
     the card explicitly prefers glyphs-only at extreme density. Codes never overprint. */
  var lastRight = -1e9;
  marks.forEach(function(m){
    var half = m.code.length * 2.4 + 1.2;            // ~4.8px/char at 8px Plex Mono
    var cx = m.x, left = cx - half;
    if (left < lastRight){
      var shift = lastRight - left;
      if (shift > 5) return;                         // too tight: glyph only
      cx += shift; left = cx - half;
    }
    lastRight = cx + half;
    out.push('<text x="' + cx.toFixed(1) + '" y="' + RAIL_CY + '" text-anchor="middle"'
      + ' font-size="8" font-weight="700" fill="' + m.col + '" opacity="'
      + (m.sel ? '1' : (m.dim ? '.45' : '.8')) + '" style="cursor:pointer"'
      + ' onclick="v10Sel(' + m.p.id + ')" font-family="IBM Plex Mono,monospace">'
      + esc(m.code) + '</text>');
  });

  out.push('<text x="' + PL + '" y="' + (H - 5) + '" font-size="9" fill="var(--dim,#5E6B8F)"'
    + ' font-family="IBM Plex Mono,monospace">' + esc(dlab(s[0].d)) + '</text>');
  out.push('<text x="' + (W - PR).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="end" font-size="9"'
    + ' fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(dlab(s[n - 1].d)) + '</text>');

  var more = w.from > 0;
  /* cc#1405: v10HintText() now returns '' in its resting/informational states (the text this
     task removed) -- wrap it conditionally so an empty hint leaves NO residual .v10hint padding
     strip (space-3 top + space-2 bottom) where the removed line used to sit, per this task's own
     "no leftover empty space" verify requirement. */
  var hint = v10HintText(d, n, all.length, more);
  return '<div class="v10cv" id="v10cv">'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"'
    + ' style="width:100%;height:' + H + 'px;display:block;touch-action:pan-y">' + out.join('') + '</svg>'
    + (hint ? '<div class="v10hint">' + hint + '</div>' : '') + '</div>';
}

/* cc#949 item 2/3: the strip under the chart is the paging state — loading, a retry after a
   failed fetch, or the terminal marker at the floor. It is never silently blank at the end of
   history: a pan that stops working with no explanation reads as a bug.
   cc#1405: the founder's screenshot struck through the RESTING-state text of this strip
   ("← drag right for older · showing 360 of 360 bars" / "start of history" / "start of 5-min
   history") -- those informational branches are removed, returning '' instead. The FUNCTIONAL
   branches (loading shimmer, the Retry button after a failed page fetch, the "Older history in
   Daily view" handoff button) are NOT part of what was struck through and are load-bearing UX,
   not caption text -- do_not_touch says leave the pan-back mechanism's own logic alone unless a
   genuine bug is found (none was, see this task's own result), so removing a user's only way to
   retry a failed fetch would be an unscoped behaviour change, not a text trim. Kept as-is. */
function v10HintText(d, n, total, more){
  if (!v10Bars(d)) return '';
  if (V10.loading)
    return '<span class="v10shim"></span> loading older bars…';
  if (V10.pageErr)
    return 'Could not load older bars · <button class="v10rty" onclick="v10Retry()">Retry</button>';
  if (d.has_more === false && (V10.win || 0) === 0)
    return '<button class="v10rty" onclick="v10ToDaily()">Older history in Daily view →</button>';
  return '';
}

/* ── drag: horizontal only, and only once the gesture proves itself horizontal ── */
var V10DRAG = null;
function v10DragStart(e){
  var t = e.touches ? e.touches[0] : e;
  V10DRAG = { x: t.clientX, y: t.clientY, win: V10.win, w: 0, axis: null };
}
function v10DragMove(e){
  if (!V10DRAG || !V10.data) return;
  var t = e.touches ? e.touches[0] : e;
  var dx = t.clientX - V10DRAG.x, dy = t.clientY - V10DRAG.y;
  if (V10DRAG.axis === null){
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;      // too small to call yet
    V10DRAG.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (V10DRAG.axis !== 'x') return;                        // vertical: leave it to the page
  if (e.cancelable) e.preventDefault();
  var host = document.getElementById('v10cv');
  var wpx = host ? host.clientWidth : 340;
  /* cc#949: the pan is BACK in 5-min mode — cc#941 disabled it only because the window was the
     whole series. It now pages, so dragging right past the left edge asks for the next page. */
  var per = wpx / v10Win(V10.data);                        // px per bar/session in the window
  var shift = Math.round(dx / per);
  var next = v10Clamp(V10DRAG.win - shift, V10.data.series.length, v10Win(V10.data));
  if (next === 0 && shift > 0) v10PageBack();              // at the left edge and still pulling
  if (next !== V10.win){ V10.win = next; renderV10(); }
}
function v10DragEnd(){ V10DRAG = null; }

/* ══ cc#928: TRADE LOG — FUTURES / OPTIONS, OPEN pinned, closed grouped by month ═══════════
   SPLIT CHOICE (stated): TABS, not two stacked sections. On a phone two full logs stacked means
   scrolling past everything futures to reach the first option; a two-button switch keeps both one
   tap away and the month grouping identical inside each, which is what the card asks for.
   The data backs both tabs — verified before building: 45 closed FUT and 36 closed OPT trades,
   plus 1 open of each, and every OPT row carries its strike and type. */
var MONN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monKey(iso){
  if (!iso) return 'Undated';
  var p = String(iso).split('-');
  return p.length < 2 ? 'Undated' : (MONN[Number(p[1]) - 1] + ' ' + p[0]);
}
/* cc#948: v10SetLeg RESTORED. cc#941 removed it as dead code; it was founder-approved UI from
   cc#920/928 that no spec asked to remove. Now switches ALL / FUT / OPT. */
function v10SetLeg(l){ V10.leg = l; V10.sel = null; renderV10(); }
function v10FoldMon(k){ V10.mfold[k] = !V10.mfold[k]; renderV10(); }

/* tapping a row selects the trade AND slides the chart to it (card item 3c) */
function v10Sel(id){
  var was = V10.sel;
  V10.sel = (was === id) ? null : id;
  if (V10.sel != null && V10.data){
    var t = (V10.data.trades || []).filter(function(x){ return x.id === id; })[0];
    if (t && t.leg === 'FUT') v10ShowDate(V10.data, t.entry_d);
  }
  renderV10();
}

/* cc#941: v10Row() is GONE with the leg rows it rendered. Removed rather than left
   behind as an unreachable function — the next reader should not have to work out
   which of two trade renderers is live. v10Card() below is the only one. */
/* ══ cc#941 + cc#954: PAIRED TRADE CARDS ══════════════════════════════════════════════════════
   THE MODEL, corrected by the founder on 09-Aug and written here because my cc#941 comment taught
   it wrong and cc#948 inherited the mistake. The V10 engine fires each signal TWO WAYS:
       FUT   a directional index expression   (long view -> BUY the future)
       OPT   a short-premium expression of the SAME view (long view -> SELL the PE)
   The OPT leg is a PEER TRADE, not a hedge. Nothing is being protected — both legs are the engine
   saying the same thing in two instruments, and the net is that signal's result across both.
   The word "hedge" entered through a code comment and spread into the UI from there; it implied a
   risk-offset that does not exist and made the OPT leg look subordinate to the FUT leg when they
   are peers. Every user-visible string now says OPT.

   Why ONE CARD rather than two rows: the two legs are stored as two rows sharing (symbol,
   entry_ts), and shown raw they read as two separate trades on two different price scales — an
   index level (58,004) beside a premium (220) — with the OPT leg's opposite side making every LONG
   look like it had a SELL next to it. The number that matters, the signal's net across both legs,
   was on neither row.
   Pairing is done SERVER-side in v10_endpoints.paired_trades and read from d.paired, so this
   template and the desktop table cannot disagree about a net (16202). The OPT leg is one grey
   sub-line inside its trade's card, which is where a premium belongs. */
/* cc#953 item 1 — THE NET, ONE LINE, ALWAYS.
   The right column overflowed on six-digit values: "+Rs1,26,328" is 11 characters of Plex Mono at
   15px, wider than the column can be on a 360px card without starving the left zone.
   Two changes, both from the card:
     NO PLUS SIGN. The colour already carries the sign — green is a gain, red a loss — so a "+"
     spends a character restating what the eye has already read. The MINUS is kept: a leading
     minus is how a negative number is written, and dropping it would leave colour as the ONLY
     carrier of the sign, which fails the moment someone cannot distinguish the two colours.
     COMPACT PAST 5 DIGITS. At six digits or more the value renders as Rs1.26L. Below that it is
     printed in full, because Rs99,999 is exact and fits. The widest string this can produce is
     "-Rs99,999" (9 chars) or "-Rs12.63L" (9 chars) — measured across the range, never wider. */
function v10Net(v){
  if (v == null) return '\u2014';
  var a = Math.abs(v), sign = (v < 0) ? '\u2212' : '';
  return sign + (a >= 100000 ? '\u20B9' + (a / 100000).toFixed(2) + 'L'
                             : '\u20B9' + Math.round(a).toLocaleString('en-IN'));
}

function v10ReasonCls(r){
  r = String(r || '').toUpperCase();
  if (r === 'SL') return 'bad';
  if (r === 'TARGET') return 'good';
  if (r === 'OPEN') return 'open';
  return 'neut';                                  // EOD and anything else: grey, never coloured
}
function v10Card(t, hideOpt){
  var px2 = function(v){ return v == null ? '--' : Math.round(v).toLocaleString('en-IN'); };
  var long = t.direction === 'LONG';
  /* cc#954: the payload field is still named `hedge` (server-side rename is out of scope for a
     template-only card and is tracked separately); the DISPLAY never uses that word. */
  var hedge = hideOpt ? null : t.hedge;
  var net = v10Net(t.net_r);
  var pts = (t.points == null) ? '' : ((t.points >= 0 ? '+' : '') + Number(t.points).toFixed(0) + ' pts');
  return '<div class="v10c ' + (t.net_r == null ? 'op' : (t.win ? 'wn' : 'ls'))
      + (V10.sel === t.id ? ' sel' : '') + '" onclick="v10Sel(' + t.id + ')">'
    + '<span class="rl"></span><span class="v10cb">'
    + '<div class="c1"><span class="sym">' + esc(t.symbol === 'BANKNIFTY' ? 'BANKNIFTY' : 'NIFTY') + '</span>'
      + '<span class="pill ' + (long ? 'lg' : 'sh') + '">' + (long ? 'LONG' : 'SHORT') + '</span>'
      + '<span class="rsn2 ' + v10ReasonCls(t.reason) + '">' + esc(t.reason) + '</span></div>'
    + '<div class="c2">' + px2(t.entry_price) + ' \u2192 ' + (t.exit_price == null ? 'open' : px2(t.exit_price)) + '</div>'
    + '<div class="c3">' + esc(t.entry_ist || '') + (t.exit_ist ? ' \u2192 ' + esc(t.exit_ist) : '')
      + (t.held ? ' \u00b7 ' + esc(t.held) : '') + '</div>'
    + (hedge ? '<div class="c4"><span class="htag">OPT</span>'
        + '<span class="hmid">' + esc(hedge.label || '') + ' \u00b7 ' + esc(hedge.side || '') + ' '
        + px2(hedge.entry_price) + ' \u2192 ' + px2(hedge.exit_price) + '</span>'
        + '<em class="' + cls(hedge.pnl) + '">' + (hedge.pnl == null ? '--' : inrShort(hedge.pnl))
        + '</em></div>' : '')
    + '</span>'
    /* THE RIGHT COLUMN — fixed, right-aligned, vertically centred. This is what cc#941 lost and
       what the founder is asking back for: every card's result sits at the same x, so the log
       scans as one vertical column of P&Ls instead of a number hiding at the end of line 3. */
    + '<span class="v10rt"><b class="' + cls(t.net_r) + '">' + net + '</b>'
    + (pts ? '<span>' + esc(pts) + '</span>' : '') + '</span></div>';
}

/* cc#948 item 1 — OPTION LEG CARD, premium scale, its own list.
   An option leg is a PREMIUM (220), a futures leg an index level (58,004). The cc#941 finding
   that those must never share a column still stands, which is exactly why OPTIONS is its own
   view rather than a column added to the paired card. Same anatomy, same right-hand result
   column, so the two lists read identically even though their numbers are on different scales. */
function v10OptCard(t){
  var px2 = function(v){ return v == null ? '--' : Number(v).toFixed(2); };
  var buy = (t.side === 'BUY');
  /* round the MAGNITUDE, not the signed value. Math.round(-772.5) is -772 in JS (ties go toward
     +Infinity), so rounding first made this leg read -Rs772 here while the same number read
     -Rs773 on the OPT sub-line of the paired card. One P&L, two figures, on one screen. */
  var pnl = v10Net(t.pnl == null ? null : Math.round(t.pnl));
  var pts = (t.points == null) ? '' : ((t.points >= 0 ? '+' : '') + Number(t.points).toFixed(1) + ' pts');
  var title = (t.opt_strike != null ? Math.round(t.opt_strike).toLocaleString('en-IN') : '?')
            + ' ' + esc(t.opt_type || '');
  return '<div class="v10c ' + (t.pnl == null ? 'op' : (t.pnl >= 0 ? 'wn' : 'ls'))
      + (V10.sel === t.id ? ' sel' : '') + '" onclick="v10Sel(' + t.id + ')">'
    + '<span class="rl"></span><span class="v10cb">'
    + '<div class="c1"><span class="sym">' + title + '</span>'
      + '<span class="pill ' + (buy ? 'lg' : 'sh') + '">' + (buy ? 'BUY' : 'SELL') + '</span>'
      + '<span class="rsn2 ' + v10ReasonCls(t.reason) + '">' + esc(t.reason || 'EXIT') + '</span></div>'
    + '<div class="c2">' + px2(t.entry_price) + ' \u2192 ' + (t.exit_price == null ? 'open' : px2(t.exit_price))
      + ' <span style="color:var(--txt,#E9EEFB)">premium</span></div>'
    + '<div class="c3">' + esc(dlab(t.entry_d || '')) + (t.exit_d ? ' \u2192 ' + esc(dlab(t.exit_d)) : '')
      + '</div></span>'
    + '<span class="v10rt"><b class="' + cls(t.pnl) + '">' + pnl + '</b>'
    + (pts ? '<span>' + esc(pts) + '</span>' : '') + '</span></div>';
}

/* cc#1396 · PER-LEG STRIP STATS, RECREATED FROM cc#1383. This is the exact formula cc#1383
   wrote for Card 4/5's own preview boxes — read from git history (c985704^) rather than
   reinvented, since cc#1386's dead-code audit removed the function along with its only caller at
   the time (Cards 4/5 became a structurally different live-position UI that has no use for a
   trades/win-rate/net aggregate). It is not stale to bring back: v10Log()'s own .v10sum strip
   below is a genuine SECOND, independent need for the identical computation, confirmed by reading
   the endpoint fresh this session — d.by_leg[leg] (trades/open/net_pnl) is real per-leg data.
   cc#1464: the WIN RATE slot is now PROFIT FACTOR (founder 30-Aug — 45% reads as alarming on a
   book that is net profitable; gross profit / gross loss carries the real economics). The old
   client-side win fold is gone with its only consumer; profit_factor ships per leg on by_leg
   (server-side, _cut_stats' formula), so this reads the field rather than recomputing. Null when
   the leg has never taken a loss — an em-dash, never a fabricated number (the cc#912 rule,
   inherited from _segment_stats). ONE caller today (v10Log(), directly below) — kept as
   its own named function rather than inlined, both because that is what the number IS (a leg's
   trade/win-rate/net/open summary, a real concept worth naming) and because Card 4/5's own
   preview box is exactly the kind of place a second caller could reappear if that UI ever needs
   an aggregate view again; inlining would mean re-deriving this same formula a third time. */
/* cc#1465 — the PROFIT FACTOR explainer, folded over the SAME leg-filtered closed rows the log
   below lists (d.trades), so the sheet and the list cannot disagree. Verified against v10_trades
   before building: NIFTY50 FUT is 31 closed = 14 profitable + 17 loss + 0 flat — the counts add
   up exactly, so the flat line renders only when a flat trade actually exists (a third line the
   moment the numbers would otherwise not add up, per the card). Points figures go em-dash if ANY
   closed row in the bucket is missing points — a partial sum shown as a gross would be a
   fabricated number. The formula line divides the same rupee grosses the by_leg profit_factor
   divides server-side (same rows, same filter), so it restates the headline stat, never a second
   opinion of it. */
function v10PfBreakdown(d, leg){
  var closed = (d.trades || []).filter(function(t){
    return (t.leg || 'FUT') === leg && !t.open && t.pnl != null;
  });
  var wins = [], losses = [], flat = 0, gp = 0, gl = 0;
  closed.forEach(function(t){
    if (t.pnl > 0){ wins.push(t); gp += t.pnl; }
    else if (t.pnl < 0){ losses.push(t); gl += t.pnl; }
    else flat++;
  });
  function pts(a){
    var s = 0, miss = 0;
    a.forEach(function(t){ if (t.points == null) miss++; else s += t.points; });
    return miss ? null : s;
  }
  var gpts = pts(wins), lpts = pts(losses);
  return {
    closed: closed.length, wins: wins.length, losses: losses.length, flat: flat,
    winRate: closed.length ? Math.round(wins.length / closed.length * 100) : null,
    gpts: gpts, lpts: (lpts == null ? null : Math.abs(lpts)),
    avgW: (wins.length && gpts != null) ? gpts / wins.length : null,
    avgL: (losses.length && lpts != null) ? Math.abs(lpts) / losses.length : null,
    gp: gp, gl: Math.abs(gl), pf: (gl !== 0 ? gp / Math.abs(gl) : null)
  };
}
var PF_SHEET = {open: false, prevOverflow: ''};
function v10PfSheet(){
  var d = V10.data; if (!d) return;
  var leg = (V10.leg === 'OPT') ? 'OPT' : 'FUT';
  var b = v10PfBreakdown(d, leg);
  function fp(v){ return v == null ? '—' : Number(v).toLocaleString('en-IN', {maximumFractionDigits: 1}) + ' pts'; }
  function fr(v){ return '₹' + Math.abs(Math.round(v)).toLocaleString('en-IN'); }
  /* cc#1472 (founder 30-Aug, screenshot of this sheet): Loss Trades and Win Rate come OUT,
     Reward : risk goes in — avg profit per winning trade ÷ avg loss per losing trade, the
     payoff shape those two rows only hinted at. Loss count stays derivable (total − profitable)
     and the win-rate fold stays in v10PfBreakdown for any future reader. Em-dash when either
     side cannot be computed — no losses is a dash, never infinity.
     cc#1473 (founder 30-Aug): the two AVG rows read in ₹, not points — gross rupee P&L over the
     trade count, the same gp/gl the PF formula line divides — and Reward : risk derives from
     THESE displayed rupee averages, so the sheet's own rows always reproduce its ratio. The
     Gross POINTS rows stay in points as filed. */
  var avgWr = b.wins ? b.gp / b.wins : null;
  var avgLr = b.losses ? b.gl / b.losses : null;
  var rows = [
    ['Total trades', String(b.closed)],
    ['Profitable trades', String(b.wins)]];
  if (b.flat) rows.push(['Flat (breakeven) trades', String(b.flat)]);
  rows.push(
    ['Reward : risk', (avgWr != null && avgLr) ? (avgWr / avgLr).toFixed(2) + ' : 1' : '—'],
    ['Gross points won', fp(b.gpts)],
    ['Gross points lost', fp(b.lpts)],
    ['Avg profit per winning trade', (avgWr == null ? '—' : fr(avgWr))],
    ['Avg loss per losing trade', (avgLr == null ? '—' : fr(avgLr))]);
  var fx = (b.pf == null)
    ? (b.closed
        ? 'No profit factor here: this side has never taken a loss, so the divisor is zero.'
        : 'No closed trades yet, so there is nothing to divide.')
    : 'Profit factor = gross profit ÷ gross loss = <b>' + fr(b.gp) + ' ÷ ' + fr(b.gl)
      + ' = ' + Number(b.pf).toFixed(2) + '×</b>. Above 1× the wins outweigh the losses.';
  v10PfSheetClose();
  PF_SHEET.prevOverflow = document.body.style.overflow;   /* the .tpo popup behind this sheet has
     already locked the body — the web shell's close resets to '', which would UNLOCK the page
     UNDER the still-open popup. Save and restore instead: the one deliberate deviation from the
     ported pattern, because here the sheet opens above another overlay. */

  veil.className = 'pfveil';
  var sheet = document.createElement('div');
  sheet.className = 'pfsheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = '<div class="pfgrab"></div><div class="pfsb">'
    + '<div class="pfsh">Profit factor · ' + (leg === 'OPT' ? 'options' : 'futures') + '</div>'
    + rows.map(function(r){ return '<div class="pfrow"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('')
    + '<div class="pffx">' + fx + '</div></div>';
  document.body.appendChild(veil);
  document.body.appendChild(sheet);
  document.body.style.overflow = 'hidden';
  PF_SHEET.open = true;
  requestAnimationFrame(function(){
    if (!veil.parentNode) return;
    veil.onclick = v10PfSheetClose;
    var g = sheet.querySelector('.pfgrab');
    if (g) g.onclick = v10PfSheetClose;

function v10LegStats(d, leg){

function v10Log(d){
  var p = (d.paired) || {};

    + esc(p.error) + '</div>';
  var rows = p.trades || [];
  var sm = p.summary || {};
  /* ══ cc#948 item 1 — QUICK ACCESS RESTORED ═══════════════════════════════════════════════
     I deleted these pills and v10SetLeg() in cc#941 as "dead code". They were not dead: they were
     founder-approved UI from cc#920/928, and NOTHING IN THE cc#941 SPEC ASKED FOR THEIR REMOVAL.
     That is the lesson this card is filed to teach and it is written here so the next reader
     inherits it: a spec that does not name a removal does not authorise one. Unreferenced is not

  var view = (V10.leg === 'OPT') ? 'OPT' : 'FUT';
  var legs = d.trades || [];
  /* SUMMARY STRIP (card item 4). cc#1396 · PER-LEG, NOT COMBINED. This used to build all four
     figures from `sm` (p.summary) regardless of which tab was open — the paired/SIGNAL-level
     view, netting both legs together — so switching FUTURES/OPTIONS never moved the numbers.
     cc#1383's own comment (right above the OLD v10LegStats, before cc#1386 removed it along with
     its old caller) already named this exact mismatch for the two Home cards; it was never fixed
     here, in the one place that reads V10.leg to begin with. v10LegStats(d, view) — recreated

  var st = v10LegStats(d, view);
  var h = '<div class="v10sum">'
    + '<div><b>' + st.trades + '</b><span>trades</span></div>'
    + '<div onclick="v10PfSheet()" role="button" aria-label="Profit factor breakdown" style="cursor:pointer">'
      + '<b>' + (st.pf == null ? '&mdash;' : Number(st.pf).toFixed(2) + '×') + '<i class="pfib">i</i></b>'
      + '<span>profit factor</span></div>'
    + '<div><b class="' + cls(st.net) + '">' + (st.net == null ? '&mdash;'

      + '</b><span>net</span></div>'
    + '<div><b>' + st.open + '</b><span>open</span></div>'

  /* cc#973: CLOSED option legs only, so the two pills count the same KIND of thing. FUTURES is
     rows.length = the paired CLOSED trades (v10_trades); counting open legs here as well made
     OPTIONS read 19 against FUTURES 23 on a book with one open leg of each — two numbers that
     look comparable and are not. The open position is already stated by the OPEN stat cell and
     by the chart's own open marker, in both views. */
  var opts = legs.filter(function(x){ return (x.leg || 'FUT') === 'OPT' && !x.open; });
  /* cc#1396: `var bl = d.by_leg || {};` REMOVED — grepped, it had zero reads anywhere in this
     function even before today (dead since whatever commit last touched this block); v10LegStats
     now does its own by_leg[leg] lookup, so there is nothing left that would have used it. */
  /* cc#1480: the FUT/OPT switch hides when the modal was opened from the Index Positions card's

  if (!V10.legLock)

  var withOpt = rows.filter(function(t){ return !!t.hedge; });
  var futOnly = rows.filter(function(t){ return !t.hedge; });
  var firstOpt = withOpt.map(function(t){ return t.entry_date || ''; })
                        .filter(Boolean).sort()[0] || null;

  var late  = futOnly.length - early;

    return h + v10Months(opts, function(x){ return x.exit_d || x.entry_d || ''; },

  return h + v10Months(rows, function(t){ return t.exit_date || t.entry_date || ''; },
                       function(t){ return t.net_pnl; },
                       function(t){ return v10Card(t, view === 'FUT'); });

/* Month grouping kept from cc#928 — it is how the founder scans the log. Extracted here so the
   paired list and the option-leg list share ONE implementation: two copies would drift, and the
   fold state, the sort and the subtotal all have to behave identically in both views.
   Sorted on a real YYYY-MM key, never on arrival order. */
function v10Months(items, dateOf, pnlOf, cardOf){
  var map = {}, key = {};
  items.forEach(function(t){
    var iso = dateOf(t) || '';
    var k = monKey(iso);
    if (!map[k]){ map[k] = []; key[k] = String(iso).slice(0, 7) || '0000-00'; }
    map[k].push(t);
  });
  var order = Object.keys(map).sort(function(a, b){
    return key[a] < key[b] ? 1 : (key[a] > key[b] ? -1 : 0);      // newest month first
  });
  return order.map(function(k){
    var g = map[k].slice().sort(function(a, b){
      var x = dateOf(a) || '', y = dateOf(b) || '';
      return x < y ? 1 : (x > y ? -1 : (b.id - a.id));
    });
    var net = 0, known = false;
    g.forEach(function(t){ var v = pnlOf(t); if (v != null){ net += v; known = true; } });
    var fold = !!V10.mfold[k];
    return '<div class="mhd" onclick="v10FoldMon(\'' + esc(k).replace(/'/g, "\\'") + '\')">'
      + '<span class="mn">' + esc(k) + '</span>'
      + '<span class="mp ' + (known ? cls(net) : '') + '">' + (known ? inrShort(net) : '--') + '</span>'
      + '<span class="mc">' + g.length + '</span>'
      + '<span class="mx">' + (fold ? '\u25BE' : '\u25B4') + '</span></div>'
      + (fold ? '' : g.map(cardOf).join(''));
  }).join('');
}

/* cc#1369: the advance-decline breadth bar — "a bordered rectangular pipe" in the founder's own

/* cc#1410: the bar is now tappable -- opens the full-screen breadth table (openBreadth(),

/* ══ cc#1379 · PCR SPEEDOMETER GAUGE ═══════════════════════════════════════════════════════════
   Replaces the old 5-pill linear .pmeter bar with a semicircular car-speedometer dial, per the
   founder's inline-preview-reviewed ask (session_log 33334).

   ADOPTED FROM FABLE'S DESIGN REF (design_refs/scorr_pcr_gauge_R1.html, sha 5e39b32, filed while
   this task was already in progress here, explicitly marked "byte-exact tokens/classes, verified
   render + math" and "copy verbatim"). The geometry, band-opacity distinction, tick labels and
   pivot styling below are that ref's content, not a second independent build — an earlier draft
   of this function (smaller dial, no ticks, single-opacity bands) was replaced with this once the
   ref landed, rather than shipping two different gauges for the same founder ask.

   SCALE IS VISUAL ONLY. gaugeValue = pcr*100, clamped to [0,200] in pt() for the NEEDLE POSITION
   alone — a real PCR outside that range pins the needle at the dial's edge, exactly like a real
   speedometer at its top speed. Nothing outside this function ever sees the scaled/clamped number:
   pcrMood()'s own .pcite line below keeps printing the real, unscaled, unclamped PCR exactly as it
   did before this task (data-honesty requirement, not a style choice, per the card).

   BAND BOUNDARIES (cc#1568) COME FROM THE COMPOSER's dial_segments (pcr_mood.py, already x100 on
   the 0-200 dial), not a hardcoded list — one source of truth for both the mood word above the dial
   and the dial's own colour segments. PCR_GAUGE_OPACITY alternates full/dimmed across the 5 bands
   so the two red tiers (Extreme Fear, Cautious) and two green tiers (Greed, Extreme Greed) — which
   share one hue each — stay visually distinguishable as separate segments rather than reading as
   one wide band.

   COLOUR: every colour used (the PCR_TOKEN var(...) tokens the composer's names map to, var(--txt)/var(--panel) for the
   needle and its two-layer pivot ring, var(--dim) for the tick labels, plus var(--line2)/var(--mut)
   for the null-PCR muted state I added below) is already used elsewhere in this file in the exact
   same var(--token,#fallback) pattern — zero new bare/standalone hex primitives.

   NULL PCR — THE ONE THING THE REF DOESN'T COVER, ADDED HERE because scope item 4 of this task is
   explicit: "no needle at a fabricated position, no coloured band implying a mood." pcrMood()'s own
   caller-side guard (`if (i < 0) return '';`) is unchanged, so in this file's actual live flow this
   function is never reached with a null pcr today — the whole .pmood block still renders nothing,
   exactly as cc#927 set it up. The no-data branch exists anyway because this is a REUSABLE
   component, callable in isolation: with no pcr it draws a single muted grey arc, no coloured
   bands, no needle, no ticks — never anything that could be read as a real mood the server never
   sent — so a future second caller cannot accidentally guess one. */
var PCR_GAUGE_OPACITY = [1, 0.55, 1, 0.55, 1];
/* cc#1388 · RICHER GAUGE — new coordinate system from design_refs/scorr_card2_gauge_richer_R1.html
   (cx/cy/R/SW below, the tick radius R+27, the needle/circle sizes), carried through this file's
   OWN formula-driven pt()/needle/tick math rather than the ref's hand-placed coordinates — checked
   against the ref's own worked example (PCR 1.09) point by point before trusting the formula:
   needle tip (186.9,61.2), tick "50" (53.3,63.3), "80" (119,23.1), "140" (267,46.5) all reproduce
   EXACTLY from pt(v, R+27) and pt(gv, R-SW/2-8) with the new R/SW/cx/cy, so nothing here is a new
   derivation, only the ref's own math read back out of its hand-placed numbers. Tick anchor is
   'start' at 0 and 'end' at 200 (matching the ref) so the widened 13px bold labels don't run past
   the viewBox edge at the two horizontal extremes — 'middle' for the rest, same as before. */
function pcrGaugeSvg(pcrRaw, mood){
  var cx = 170, cy = 180, R = 138, SW = 20;
  function pt(val, r){
    r = r || R;
    var clamped = Math.min(200, Math.max(0, val));
    var th = Math.PI * (1 - clamped / 200);
    return { x: cx + r * Math.cos(th), y: cy - r * Math.sin(th) };
  }
  var segs = (mood && mood.dial_segments) || [];
  var hasPcr = pcrRaw != null && !isNaN(Number(pcrRaw)) && segs.length > 0;
  var bands = '', needle = '', ticks = '';

  if (hasPcr){
    /* cc#1568: segments come from the composer (dial_cuts 0/50/80/100/150/200). The 150-200
       segment's colour follows the label — amber for CAUTIOUS, green for the extreme-greed reading. */
    segs.forEach(function(b, j){
      var p0 = pt(b.lo), p1 = pt(b.hi);
      bands += '<path d="M' + p0.x.toFixed(1) + ',' + p0.y.toFixed(1)
        + ' A' + R + ',' + R + ' 0 0 1 ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) + '"'
        + ' stroke="' + pcrTok(b.colour) + '" stroke-opacity="' + (PCR_GAUGE_OPACITY[j] == null ? 1 : PCR_GAUGE_OPACITY[j]) + '"'
        + ' stroke-width="' + SW + '" fill="none"/>';
    });
    var gv = Number(pcrRaw) * 100;                    // VISUAL scale only, clamped in pt()
    var tip = pt(gv, R - SW / 2 - 8);
    needle = '<line x1="' + cx + '" y1="' + cy + '" x2="' + tip.x.toFixed(1) + '" y2="' + tip.y.toFixed(1)
      + '" stroke="var(--txt,#E9EEFB)" stroke-width="5" stroke-linecap="round"/>'
      + '<circle cx="' + cx + '" cy="' + cy + '" r="10" fill="var(--txt,#E9EEFB)"/>'
      + '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="var(--panel,#121A33)"/>';
    ticks = ((mood && mood.dial_cuts) || [0, 50, 80, 100, 150, 200]).map(function(v){   // cc#1568: 140 -> 150
      var p = pt(v, R + 27);
      var anchor = v === 0 ? 'start' : (v === 200 ? 'end' : 'middle');
      // cc#1388: 100 highlighted in --txt per the founder's ask, everything else stays --mut
      // (the ref's own tick fill, #8C99BD — a different token than cc#1379's original --dim).
      var fill = v === 100 ? 'var(--txt,#E9EEFB)' : 'var(--mut)';
      return '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 3).toFixed(1) + '" font-size="13"'
        + ' font-weight="800" fill="' + fill + '" text-anchor="' + anchor + '"'
        + ' font-family="IBM Plex Mono,ui-monospace,monospace">' + v + '</text>';
    }).join('');
  } else {
    /* cc#1379: no fabricated needle position, no coloured band implying a mood that was never
       derived from a real number (scope item 4) -- the ref above doesn't hit this path since it
       only ever rendered with a real pcr, so this branch is new rather than adapted. */
    var p0n = pt(0), p1n = pt(200);
    bands = '<path d="M' + p0n.x.toFixed(1) + ',' + p0n.y.toFixed(1)
      + ' A' + R + ',' + R + ' 0 0 1 ' + p1n.x.toFixed(1) + ',' + p1n.y.toFixed(1) + '"'
      + ' stroke="var(--line2,#2A2A32)" stroke-width="' + SW + '" fill="none"/>';
  }

  /* cc#1388: max-width, MEASURED not assumed from the ref's illustrative 260px -- see this task's
     own result for the exact before/after governing-height numbers this was tuned against. */
  return '<div class="pcr-gauge"><svg viewBox="0 0 340 200"'
    + ' style="width:100%;max-width:340px;display:block;margin:0 auto" role="img"'
    + ' aria-label="PCR gauge' + (hasPcr ? ', ' + Number(pcrRaw).toFixed(2) : ', no data') + '">'
    + bands + needle + ticks + '</svg></div>';
}
function pcrMood(hero){
  var m = hero.pcr_mood;
  if (!m || !m.label || hero.pcr == null) return '';   // no PCR / no composer = no label, never a guess
  return '<div class="pmood"><div class="pw" style="color:' + pcrTok(m.label_colour) + '">' + esc(m.label) + '</div>'
    + pcrGaugeSvg(hero.pcr, m)
    /* cc#1140 · AS-OF HONESTY. The label states what it is showing: during the session
       "PCR 0.94 · 10:30 LIVE", outside it "PCR 0.68 · 08-19 EOD". The number and its basis come
       from the SAME payload object, so the card cannot render a live-looking figure without
       saying which bar it is. A bar older than 15 minutes during the session is shown WITH its
       time and tagged STALE rather than passed off as current — the server sets that flag using
       the pcr_guard convention; nothing is judged here.
       cc#1379: this line is UNCHANGED by the gauge — still the real, unscaled PCR, never the
       gauge's x100 display value. */
    + '<div class="pcite">PCR ' + esc(Number(hero.pcr).toFixed(2))
    + (hero.pcr_basis === 'LIVE'
        ? (hero.pcr_asof ? ' · ' + esc(hero.pcr_asof) : '')
          + (hero.pcr_stale ? ' · <span style="color:var(--amber,#FF9F45)">STALE</span>' : ' · LIVE')
        : (hero.pcr_date ? ' · ' + esc(String(hero.pcr_date).slice(5)) + ' EOD' : ''))
    + '</div>'
    /* cc#1568 scope 5: a CAUTIOUS reading says why, in plain words with the live numbers
       ("High put cover while Nifty is down 1.4% on the week"); a missing week input says so
       ("week return unavailable"). Both strings are the composer's — nothing is worded here. */
    + (m.reason ? '<div class="preason">' + esc(m.reason) + '</div>' : '')
    + (m.note ? '<div class="preason">' + esc(m.note) + '</div>' : '')
    + '</div>';
}
/* cc#1139 · the INDEX ROW that fills the cc#1134 surplus zone — NIFTY and BANKNIFTY, level and
   day change, the two numbers a trader checks first.
   VALUES ARE NOT RECOMPUTED. They are read from d.ticker[], the SAME array that renders the tape
   at the top of this page (mobile_home2 builds it with name / price / chg_pct per row), so the
   footer and the tape cannot disagree on one paint and there is no new endpoint and no new timer
   — it repaints on the page's existing refresh, like everything else fed by that payload.
   A missing value prints an em-dash, never a zero and never a stale figure dressed as live.
   PLACEMENT: this is a NEW BLOCK in the cc#1134 column, appended AFTER the chip grid, so the
   block order becomes title / mood / tagline / chips / index row. It joins the existing fixed
   row-gap; it does not touch the gap logic. That is what keeps the void from reopening — the
   column still has no auto margins and justify-content is still flex-start, so every block sits
   at a fixed gap from the last and ALL remaining surplus stays below the final block, which is
   now this row rather than the chips.
   No border on the cells, per the ruling: a hairline divider above reads as a card footer strip
   and keeps it visually distinct from the bordered metric chips. */
function idxFooter(d){
  var t = {};
  (d.ticker || []).forEach(function(x){ if (x && x.name) t[x.name] = x; });
  /* cc#1159: each cell opens the chart through togTrend(), the SAME opener the ADR and VIX chips
     already use \u2014 not a second one. `kind` is the TRENDS key, and cc#1159 added a banknifty kind
     to that map and to /api/mobile/trends, which serves it off the same raw_prices table and the
     same shape as nifty (1,296 BANKNIFTY closes against NIFTY50's 1,297, verified before wiring).
     The chart lands in the shared #chiptrend host below the chips, exactly where a chip tap puts
     it, so tapping a footer index and tapping a Nifty chip behave identically. */
  /* cc#1374 · pivot-side tag, ADJACENT on the same row (founder correction, 28-Aug -- the first
     pass put it on its own line under the level, which the founder circled as wrong). Same PIV
     lookup and >=/< pp math idxCol used to compute this for Card 2 before that card lost the
     index pair -- nothing recomputed differently, just inlined here since idxCol is gone.
     `sym` is the PIV/pivots key (NIFTY50 / BANKNIFTY), separate from `key` because the ticker
     array names NIFTY 'NIFTY' but the pivots endpoint names it 'NIFTY50' -- same mismatch idxCol
     handled by taking both a name and a sym. Null pivot data prints nothing, never a guess. */
  var cell = function(label, key, kind, sym){
    var r = t[key] || {};
    var lvl = (r.price == null) ? '\u2014' : px(r.price);
    var chg = (r.chg_pct == null) ? '' :
      '<span class="ixch ' + cls(r.chg_pct) + '">' + pct(r.chg_pct) + '</span>';
    var pv = PIV && PIV[sym];
    var pp = pv ? Number(pv.pp) : null;
    var side = (r.price == null || pp == null) ? ''
      : (Number(r.price) >= pp ? 'above pivot' : 'below pivot');
    return '<button class="ixcell" onclick="togTrend(event,\'' + kind + '\')"'
      + ' aria-label="' + esc(label) + ', open chart"><span class="ixnm">' + esc(label) + '</span>'
      + '<span class="ixlv">' + esc(lvl) + '</span>' + chg
      + (side ? '<span class="ixpv">' + side + '</span>' : '')
      + '<span class="ixgl">\u25a6</span></button>';
  };
  return '<div class="ixrow">' + cell('NIFTY', 'NIFTY', 'nifty', 'NIFTY50')
       + cell('BANKNIFTY', 'BANKNIFTY', 'banknifty', 'BANKNIFTY') + '</div>';
}

   below (paused unless proven visible AND on-screen), applied to the CSS-driven glitter animation

/* ══ cc#1374 · HERO CARD HEIGHT PARITY — MEASURED, NOT GUESSED ═════════════════════════════════
   This is the 7th pass at the Card 1 / Card 2 height mismatch (cc#1125, 1230, 1359, 1369, 1372,
   1373 all preceded it), and every one of those was a static per-breakpoint px trim, computed
   against ONE payload and ONE font state (Playwright, fallback sans — Google Fonts is unreachable
   from the build container) and against whichever content mix the two cards happened to carry
   that day. Both inputs move: content has swapped between the cards three times in 24h, and a
   real phone's actual font metrics were never in the loop at all. A trim that fits today's numbers
   in this container is not a fix, it is a coincidence with an expiry date.
   This replaces the static numbers with a live measurement: after paint, and again whenever
   either card's natural content size changes (font swap included), read BOTH cards' natural
   height and set BOTH to an explicit min-height equal to the taller one. Neither card is
   "the stretched one" by construction — the mechanism does not know or care which card that is
   on any given day, so a future content move (Fable's or CC's) does not silently invalidate it. */
var HERO_RO = null;
var HERO_SYNC_GUARD = false;
var HERO_LAST_MAX = null;

/* cc#1382 · GENERALIZED TO N CARDS. Card 3 (Max Pain) makes the hero deck a 3-card track, and
   both functions below hardcoded exactly track.children[0]/[1] (c1, c2) throughout -- a real
   prerequisite to fix before Card 3 could exist, not decoration. Both now loop over ALL of
   #heroTrack's current children: clear every card's inline min-height, measure every card, take
   the overall max, apply it to every card, observe every card. Nothing about the GUARD mechanics
   below changed -- the reentrancy problem and its fix (observer attached once, guard released via
   a double rAF) are unrelated to how many cards there are, so cc#1374's own settle-count target
   (2-3 calls, no runaway) and cc#1377's resync-on-content-change fix both carry over unchanged,
   just now iterating N elements instead of 2 named variables. */
function syncHeroCardHeights(){
  if (HERO_SYNC_GUARD) return;
  var track = document.getElementById('heroTrack');
  if (!track) return;
  var cards = Array.prototype.slice.call(track.children);
  if (cards.length < 2) return;

  /* FIRST DRAFT DISCONNECTED/RECONNECTED THE OBSERVER HERE, EVERY CALL, AND THAT WAS THE LOOP —
     measured at ~180 calls in a 3s idle window against a target of 2-3. ResizeObserver's spec
     ALWAYS delivers one notification on a fresh observe(), whether or not the size actually
     changed, so calling observe() again on every pass manufactured a guaranteed follow-up
     notification every single time — the exact loop item 4 asked to be guarded against. The
     observer is now attached ONCE, in heroSetupHeightSync(), and never touched again here. */

  /* item 2: clear any prior inline min-height on EVERY card before measuring, so a stale value
     from the last run can never bias this one — a card can only report its true natural height
     with nothing already forcing it taller. Clearing a shorter card is itself a real resize
     (forced height -> smaller natural height), which is genuine ResizeObserver input, not noise —
     the guard below is what stops that from cascading into a second full pass. */
  HERO_SYNC_GUARD = true;
  cards.forEach(function(c){ c.style.minHeight = ''; });
  var max = cards.reduce(function(m, c){ return Math.max(m, c.getBoundingClientRect().height); }, 0);
  HERO_LAST_MAX = max;
  cards.forEach(function(c){ c.style.minHeight = max + 'px'; });

  /* THE GUARD MUST OUTLIVE THIS FUNCTION, not just its synchronous body — clearing then
     re-applying min-height above is a real resize on whichever cards were shorter, and the
     ResizeObserver notification for them is queued by the browser, not delivered synchronously.
     Releasing the guard here (before that notification arrives) is what let the RO callback see
     guard=false and start a whole new pass, which itself resizes and requeues, forever. Two
     rAFs is the same margin cc#1312's veil-click race already uses in this file for "let the
     browser finish this render step before I act again" — RO delivers at the end of a
     rendering step, so by the second frame its notification for THIS write has already arrived
     and been swallowed by the still-true guard. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ HERO_SYNC_GUARD = false; });
  });
}

function heroSetupHeightSync(){
  var track = document.getElementById('heroTrack');
  if (!track) return;
  var cards = Array.prototype.slice.call(track.children);
  if (cards.length < 2) return;

  /* item 3: first paint is already correct — rAF so the browser has committed the layout this
     render() pass just injected before the first measurement reads it. */
  requestAnimationFrame(syncHeroCardHeights);

  /* item 4: the font-swap gap cc#1369 flagged and never closed. FOUT/FOIT on a real device
     reflows hero-mood/hero-why/the chip grid/idxFooter's price text AFTER this first paint —
     exactly the scenario a static px number computed pre-font-swap cannot see coming. A
     ResizeObserver on every card's natural content box catches that reflow whenever it lands,
     with no dependency on knowing WHEN a given browser finishes swapping in Space Grotesk /
     IBM Plex Mono. Old browsers without ResizeObserver simply keep today's first-paint numbers —
     no crash, no regression, just no live re-sync on those. */
  /* cc#1411: this function is RE-ENTRANT now — the auto-refresh re-runs the whole render, and
     the innerHTML swap destroyed every node the previous observer was watching. Disconnect the
     old one first, or each refresh leaks one more live ResizeObserver holding detached cards. */
  if (HERO_RO){ HERO_RO.disconnect(); HERO_RO = null; }
  if (typeof ResizeObserver === 'function'){
    HERO_RO = new ResizeObserver(function(){ syncHeroCardHeights(); });
    cards.forEach(function(c){ HERO_RO.observe(c); });
  }

  /* item 5: window resize (debounced) and orientation change — a rotated phone or a resized
     webview reflows the same text at a new wrap width, which is a natural-height change the
     ResizeObserver above already catches on the CARD box itself, but the debounce here keeps a
     drag-resize from re-measuring on every intermediate frame.
     cc#1411: wired ONCE, guarded — unlike the observer above, window outlives every innerHTML
     swap, so re-adding these on each refresh would stack N identical listeners. The handler
     calls syncHeroCardHeights by NAME, which always measures the current cards, so the single
     wiring stays correct across every repaint. */
  if (!window.__HERO_WIN_WIRED){
    window.__HERO_WIN_WIRED = true;
    var resizeT = null;
    var debouncedSync = function(){ clearTimeout(resizeT); resizeT = setTimeout(syncHeroCardHeights, 150); };
    window.addEventListener('resize', debouncedSync);
    window.addEventListener('orientationchange', debouncedSync);
  }
}

/* cc#1411: the anonymous one-shot render body is now renderHome(d, pv) — same code, same order,

     no-store /api/mobile/home2 call is actually running RIGHT NOW). A mismatch means some layer
     this app does not control (a CDN, a WebView-level cache, ...) served a stale copy of the page
     despite every mechanism this app already has in place being correct -- confirmed by reading
     the source, not assumed: /m/home itself is Cache-Control:no-store (mobile_endpoints._page()),

  if (window.__SCORR_BUILD && d.build_id && window.__SCORR_BUILD !== d.build_id){

    + heroCardPositions(d)
    + '</div><div class="dots" id="heroDots">' + heroDotsHtml + '</div></div>';

  /* 2 · V8 OPEN BOOK — unrealised split with % of capital deployed (founder 08-Aug) */
  var bk = d.book || {};
  function trioCell(k, o, totPct, totVal){
    /* total cell passes its own value/pct; side cells pass their object */
    var v = (o == null) ? totVal : o.unrealised;
    var p = (o == null) ? totPct : o.pct;
    return '<div class="st"><div class="k">' + k + '</div>'
      + '<div class="v ' + cls(v) + '" title="' + esc(inr(v)) + '">' + inrShort(v) + '</div>'
      + '<div class="p ' + cls(p) + '">' + (p == null ? '--' : pct(p)) + '</div></div>';
  }
  /* ══ cc#950 — THE BOOK TILE HAS A SECOND FACE ══════════════════════════════════════════════
     cc#943 put the Open <-> Realised swipe on /m/v8; the founder wants it on the Home tile too.
     Template-only: /api/mobile/home2 already ships realised, gross, brokerage, wins, losses and
     trades on the same book payload, so nothing server-side changes.

     THE GESTURE IS THE ONE THIS FILE ALREADY HAS, NOT A NEW ONE. The card describes the market
     card's mechanism as an axis-locked touch handler; it is not — the market deck (cc#927) is a
     CSS scroll-snap track with an onscroll dot updater, and that is what is reused here. It is
     the better of the two for a tile sitting inside a scrolling page: native horizontal scroll
     cannot swallow a vertical drag, so "vertical scroll unaffected" holds by construction rather
     than by a threshold I would have to tune. No second handler exists to fork.

     THE ANCHOR WRAPS EACH FACE, NOT THE DECK. Putting a horizontal scroller inside one <a> risks
     a swipe ending as a navigation; giving each face its own card-link keeps the tap target and
     the destination identical to before while the track owns the drag. */
  function bookFace1(){
    return '<a class="card-link" href="/m/v8"><div class="c slab"><div class="chd">'
      + '<div class="t">V8 Open Book</div>'
      + '<div class="rgt">' + (bk.open || 0) + ' positions <span class="h-chev">\u203a</span></div></div>'
      + '<div class="trio">'
      + trioCell('Unrealised', null, bk.unrealised_pct, bk.unrealised)
      + trioCell('Long Unrl', bk.long || {})
      + trioCell('Short Unrl', bk.short || {})
      + '</div>'
      + '<div class="sum" style="margin-top:7px">% on capital deployed per side.</div>'
      + '</div></a>';
  }
  /* ══ cc#961 — THE WIN RATE IS SPLIT BY SIDE, AND THE TRADES CELL IS GONE ═════════════
     Why the split earns a cell and the count does not: at build time the long book reads 92%
     on 13 decided and the short book 20% on 5. One blended number (72%) hides the only thing
     on this face you could act on — that one side is carrying the entire record. The total
     trade count stays true but says nothing, and /m/v8 already shows it, so it gives up its cell.

     W/L are the WEB MASTER DASHBOARD counts: wins = result TARGET, losses = result SL. They
     deliberately do NOT sum to `trades` — 15 of the 33 fresh-era trades closed for some other
     reason and are money in the realised figure but not a verdict in the record. The sub-line
     therefore reads wins/DECIDED, never wins/trades, so its denominator is the same one the
     rate above it was divided by. Anything else would put two different maths on one cell.

     The rate itself is NOT computed here — it arrives from /api/mobile/home2 already divided,
     so Home and every other surface read one number instead of each doing its own arithmetic.
     A side with no decided trades prints a DASH, never 0% — no verdicts is not a 0% record. */
  function rateCell(k, r){
    r = r || {};
    var rt = (r.rate == null) ? null : Number(r.rate);
    /* founder bands: >=60 green, 40-60 amber, <40 red. A dash gets NO band — it goes neutral dim,
       because the absence of a verdict is not a grade and tinting it would invent one. */
    var col = (rt == null) ? 'var(--mut)'
            : (rt >= 60 ? 'var(--grn)' : (rt >= 40 ? 'var(--amber)' : 'var(--red)'));
    return '<div class="st"><div class="k">' + k + '</div>'
      + '<div class="v" style="color:' + col + '">'
      +   (rt == null ? '--' : rt.toFixed(0) + '%') + '</div>'
      + '<div class="p">' + (r.decided ? (r.wins + '/' + r.decided) : 'no verdicts') + '</div></div>';
  }
  function bookFace2(){
    /* cc#962: this face is the CLOSED book, and it used to carry face 1's header verbatim \u2014 same
       title, same "N positions" \u2014 so the deck read as one card that changed its numbers. cc#950's
       "header byte-identical" assertion is superseded on the LABEL only; geometry and styling are
       untouched, and the count comes from the payload, never a literal. */
    return '<a class="card-link" href="/m/v8"><div class="c slab"><div class="chd">'
      + '<div class="t">V8 Closed Book</div>'
      + '<div class="rgt">' + (bk.trades || 0) + ' trades <span class="h-chev">\u203a</span></div></div>'
      + '<div class="trio cbtrio">'
      + '<div class="st"><div class="k">Realised</div>'
      +   '<div class="v ' + cls(bk.realised) + '" title="' + esc(inr(bk.realised)) + '">'
      +   inrShort(bk.realised) + '</div>'
      +   '<div class="p">net</div></div>'
      + rateCell('Win Rate Long', bk.rec_long)
      + rateCell('Win Rate Short', bk.rec_short)
      + '</div>'
      /* brokerage is a COST, not a signed P&L — inrShort would print "+Rs16,500", which reads
         like a gain. Formatted unsigned here. The sub-note now also names what the small
         numbers under the rates are, because "12/13" alone is not self-explaining. */
      + '<div class="sum" style="margin-top:7px">Wins / decided. Net of \u20B9'
      + Math.round(bk.brokerage || 0).toLocaleString('en-IN') + ' brokerage.</div>'
      + '</div></a>';
  }
  /* cc#1158 · INDEX BOOK — the founder replaced the cc#1068 INDEX SIGNALS card here with the
     OPEN index book: direction and paired P&L per index, and a row tap opening the chart that is
     already built. The V10 engine, its endpoints and /m/v10 are untouched — this removes one
     Home surface and nothing else.
     ALWAYS RENDERED, NEVER CONDITIONAL. The old card sat inside `if (v10)`, so on a day the hero
     carried no V10 line the whole section simply was not there. A book that vanishes when it is
     empty cannot be told apart from a book that failed to load, and this card is explicit that
     flat must SAY flat. The strip paints immediately and loadIndexBook() fills it after, the
     same way LIVE NEWS is filled. */
  /* cc#1181: the Index Intel entry is STATIC MARKUP beside the strip, not something
     renderIndexBook prints inside it. Two reasons, and the second is the one that matters.
     (1) The ruling puts it BELOW the strip, full strip width, as a standalone button \u2014 that is
     a sibling of the box, not a row in it.
     (2) The book has three states \u2014 rows, FLAT, and UNAVAILABLE \u2014 and the last two replace the
     box's whole innerHTML. A single entry point that disappears on the days the book is empty or
     the endpoint is down is not a single entry point, it is an intermittent one. Out here it is
     painted with the section and never depends on a fetch. */
  /* cc#1382 \u00b7 SUPERSEDES cc#1381 ABOVE. The founder\u2019s standalone-section direction from
     21:21 IST was itself superseded ~45 minutes later (22:0x IST): NIFTY Max Pain now lives as
     Card 3 inside #heroTrack (heroCard3(), same size as Cards 1/2 via cc#1374\u2019s generalized
     N-card sync, INDEX INTEL styled exactly like DAILY DIGEST) instead of this separate
     \u201cINDEX BOOK \u00b7 OPEN\u201d section below the deck. The .sect header, #ibkHost and the
     .ibk-intel button are REMOVED -- not hidden, not duplicated. loadIndexBook()/
     renderIbkDeck() keep their names and their NIFTY-only fetches (cc#1381\u2019s own dead-code
     audit stands) but now target #heroCard3Body inside the deck; see heroCard3()\u2019s own
     comment for why its content host, not this section, is the paint-then-fill target. */

  h += '<div class="sect">THE BOOK</div>'
    + '<div class="swipe"><div class="swipe-t" id="bookTrack" onscroll="bookDots()">'
    + bookFace1() + bookFace2()
    + '</div><div class="dots" id="bookDots"><i class="on"></i><i></i></div></div>';

  /* 3 · MY PORTFOLIO — cc#911: rendered by renderPortfolio() into #pfblock, so a row tap can
     redraw just this card instead of the whole page. */
  PF.data = d.portfolio || {};
  h += '<div class="sect">MY PORTFOLIO</div><div class="c slab" id="pfblock"></div>';

  /* cc#1322: LIVE NEWS moved off this page onto /m/v10 (scorr_v10_signal.html), last section
     there — founder ask 25-Aug. Nothing replaces it here; TOOLS is now the last section on Home. */

  /* 4 · TOOLS — 15 tiles (cc#991 appended the 15th), zero overlap with the five-slot nav */
  document.getElementById('body').innerHTML = h;
  moodStart();        /* cc#1135: the .mlt letters only exist after this paint */
  loadIndexBook();    /* cc#1382: #heroCard3Body only exists after this paint, same as the mood letters */
  loadHeroPositions(); /* cc#1386: #heroPositionsBody, same reason */
  heroSetupHeightSync();  /* cc#1374: #heroTrack only exists after this paint, same reason */
  glitterSync();          /* cc#1378: sets the initial active-face class, same reason */

  var tools = document.createElement('div');
  tools.className = 'tools';
  tools.innerHTML =
      /* cc#1535 (founder 31-Aug): Alerts takes tile 1 \u2014 the approve surface leads the grid
         (the cc#1526 rationale, transferred). Wall of Trades left the grid for the bottom nav
         (labelled WoT), so it has no tile here; nothing else in the grid changes order. */
      '<a class="tool slab dense" href="/m/alerts"><span>\u25ec</span>Alerts</a>'
    + '<a class="tool slab dense" href="/m/qb"><span>\u25a6</span>Baskets</a>'
    + '<a class="tool slab dense" href="/m/screeners"><span>\u2637</span>Screeners</a>'
    + '<a class="tool slab dense" href="/m/sector"><span>\u2b21</span>Sector Intel</a>'
    + '<a class="tool slab dense" href="/m/results"><span>\u2263</span>Results</a>'
    + '<a class="tool slab dense" href="/m/digest"><span>\u2600</span>Digest</a>'
    + '<a class="tool slab dense" href="/m/fpc"><span>\u20b9</span>FPC</a>'
    + '<a class="tool slab dense" href="/dashboard"><span>\u26a1</span>Dashboard</a>'
    + '<a class="tool slab dense" href="/cio"><span>\u2299</span>AICIO</a>'
    + '<a class="tool slab dense" href="/health"><span>\u2695</span>Portfolio Health</a>'
    // cc#897: 9 -> 12 tiles. All three open WEB pages, the same 16915 exception the founder
    // already approved for Dashboard / AICIO / Portfolio Health above.
    // The Index Intel hash was VERIFIED against the dashboard's own router, not assumed: the card
    // proposed #indexintel, but v8_dashboard.html line ~4995 reads
    // TABS=['index','v14','tcscan','bt'] and falls back to the Master pane on any unknown hash.
    // #indexintel would therefore have opened Master silently and looked like a working link.
    /* APP_QA_R4 P8 (F4): the app tile comes first and owns the name; the web page is kept
       but marked as the web one, so two tiles never claim the same label. */
    + '<a class="tool slab dense" href="/m/v10"><span>\u25d0</span>Index Intel</a>'
    + '<a class="tool slab dense" href="/dashboard#index"><span>\u25d0</span>Index Intel \u00b7 Web</a>'
    + '<a class="tool slab dense" href="/v9"><span>\u21c4</span>V9 Pairs</a>'
    + '<a class="tool slab dense" href="/v15"><span>\u25c9</span>V15 MF</a>'
    // cc#897 second pass: 12 -> 14. Routes taken from model_registry, not guessed \u2014 V10 is /v10
    // and V14 Intraday is /intraday there. Both open web pages, same 16915 exception as above.
    /* APP_QA_R4 P8: the old /v10 web tile is the same destination as the web Index Intel
       tile above in user terms, so it keeps its own route but stops being called "V10". */
    + '<a class="tool slab dense" href="/v10"><span>\u25d1</span>V10 Desk \u00b7 Web</a>'
    + '<a class="tool slab dense" href="/intraday"><span>\u25f4</span>V14 Intraday</a>'
    // cc#991 appended Wall of Trades as tile 15; cc#1526 moved it to tile 1 (top of this list).
    ;
  document.getElementById('body').appendChild(tools);

  renderPortfolio();   // cc#911: the portfolio card owns its own render so a row tap can redraw it alone

  /* cc#1411 · REPEAT-RENDER STATE RESTORE (capture at the top of this function). Deck scroll
     first — setting scrollLeft fires each track's own onscroll handler, so the dot rows
     re-highlight the right card without being told twice. The open chip chart re-opens THROUGH
     togTrend (TREND.open nulled first so its toggle-closed branch cannot fire): that re-fetches
     the trend series, which is exactly what a refresh should do, and TREND_RANGE (cc#1231)
     already remembers the founder's chosen window per kind, so the same range comes back. Page
     scroll goes last, inside a rAF, after the browser has committed the new layout at full
     height — restoring it earlier can clamp against a mid-layout shorter page. */
  if (_repaint){
    var _ht = document.getElementById('heroTrack');
    if (_ht && _heroScroll) _ht.scrollLeft = _heroScroll;
    var _bt = document.getElementById('bookTrack');
    if (_bt && _bookScroll) _bt.scrollLeft = _bookScroll;
    /* The reopen is DELAYED 150ms, and that number is load-bearing, found by measuring rather
       than taste: reopening synchronously races cc#1374's HERO_SYNC_GUARD — this fresh paint's
       own first sync sets the guard and releases it two rAFs later, and an instant reopen can
       land its chart (and its own resync request) INSIDE that window, where the guard swallows
       it. Result, reproduced in the harness before this delay existed: card 1 tall at 487px
       with cards 2-4 stuck at ~400 — the deck never re-levelled. 150ms (the same settle
       constant the resize debounce here already uses) puts the reopen safely after the release,
       so it behaves exactly like the user tap it is standing in for — the path that provably
       re-levels (baseline-verified: all four cards 487 on a plain tap). The guard clause covers
       the human race: if the founder re-opened something themselves inside those 150ms, their
       tap wins and this no-ops instead of toggle-closing it. cc#1374/1377's own mechanism is
       untouched — this sequences NEW code around it, per the card's do-not-touch. */
    if (_openTrend){
      TREND.open = null;
      setTimeout(function(){ if (!TREND.open) togTrend(null, _openTrend); }, 150);
    }
    if (_pageY) requestAnimationFrame(function(){ window.scrollTo(0, _pageY); });
  }
}

/* ══ cc#1411 · AUTO-REFRESH ═══════════════════════════════════════════════════════════════════
   The founder asked whether the PCR gauge moves every 5 minutes on its own. It did not — this
   page fetched /api/mobile/home2 exactly ONCE, on load, and only a manual reload ever caught the
   server's own 5-minute refresh. This closes that gap on this file's own established battery
   discipline (moodStart/moodStop, glitterSync): NO timer exists while the tab is hidden —
   cleared entirely on visibilitychange, never merely skipped inside a tick — and none while the
   market is closed either (HOME_POLL.marketOpen, set in renderHome from d.session.market_open,
   the server-computed flag; each refresh re-reads it off its own fresh payload, so the 15:30
   open->closed transition shuts the timer down by itself within one tick).
   ONE HONEST BOUNDARY, stated rather than papered over: a tab left open, visible and untouched
   from before 09:15 will not self-start — nothing is polling while closed to notice the open
   (the card explicitly ruled out polling outside market hours). The catch-up fetch on the next
   visibilitychange, or any reload, picks it up — and that is the interaction pattern a phone
   actually has.
   A FAILED background refresh keeps the page exactly as it was: the initial load's error screen
   is for having nothing to show at all; five minutes into a session it would replace a working
   page with an error over one dropped request. The next tick simply tries again.
   NO refresh spinner (scope 6, CC's call): the session clock, feed rail and every figure
   repaint in place — that movement IS the acknowledgement, kept quiet per the card. */
var HOME_POLL = { h: null, inflight: false, ms: 5 * 60 * 1000, marketOpen: false, lastFetch: 0 };
function homeRefresh(){
  if (HOME_POLL.inflight) return;                     /* scope 4: a slow network skips the tick,
                                                         never stacks a second request */
  if (document.visibilityState === 'hidden') return;  /* belt to the braces — the timer is
                                                         already cleared on hide */
  HOME_POLL.inflight = true;
  fetchWithTimeout('/api/mobile/home2')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.error) throw new Error(d.error);
      renderHome(d, null);
      homePollSync();
    })
    .catch(function(){ /* keep the page as it was — see the block comment above */ })
    .then(function(){ HOME_POLL.inflight = false; });
}
function homePollStop(){
  if (HOME_POLL.h){ clearInterval(HOME_POLL.h); HOME_POLL.h = null; }
}
function homePollSync(){
  homePollStop();
  if (document.visibilityState === 'hidden') return;
  if (!HOME_POLL.marketOpen) return;
  HOME_POLL.h = setInterval(homeRefresh, HOME_POLL.ms);
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible'){
    /* One catch-up fetch if the data went stale while backgrounded — a single request on a real
       user gesture, never a burst of missed ticks (the interval was cleared on hide, so none
       queued). It runs even if the market has since closed, so the final EOD figures land;
       homePollSync then decides on its own whether a timer is warranted at all. */
    if (HOME_POLL.lastFetch && (Date.now() - HOME_POLL.lastFetch) >= HOME_POLL.ms) homeRefresh();
    homePollSync();
  } else {
    homePollStop();   /* no timer at all while hidden — the moodStop/glitterSync discipline */
  }
});

/* pivots ride alongside the main call — the deck renders either way, and a pivot failure costs
   the bar, never the card (Promise.all would have let it take the whole screen down). */
Promise.all([
  fetchWithTimeout('/api/mobile/home2').then(function(r){ return r.json(); }),
  fetchWithTimeout('/api/paper/pivots?symbol=NIFTY50,BANKNIFTY')
    .then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(res){
  renderHome(res[0], res[1]);
  homePollSync();   /* cc#1411: arm (or skip) the 5-min poll off the fresh payload's own flag */
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>' + esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sess').textContent = 'failed to load';
});
</script>
