<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
</head>
<body>
<!--
  cc#874 — HOME, PROMOTED. previews/home.html stays frozen (item 9). 16916: "front door, approved".
  Contract: 24 values, 18 SOURCED_BUT_EMPTY because smartgain_holdings has ZERO rows today. The
  source is correct and returns nothing, so the DESIGNED EMPTY STATE renders — the book says it is
  flat. It never prints 0.00 as if that were a measurement, and never a spinner.
  Index tiles reuse v8_endpoints.domestic_live() so the app cannot show a different close from the
  web (DISPLAY_PARITY 16202).
-->
<div class="screen">
  <div class="head"><h1 id="hi">Scorr</h1><div class="s" id="sub">loading…</div></div>
  <div class="body" id="body"><div class="loading">Loading…</div></div>
</div>
<nav class="bnav">
  <a class="bn on" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function n(v, dp){
  if (v === null || v === undefined || v === '' || isNaN(Number(v))) return '--';
  return Number(v).toLocaleString('en-IN',
    {minimumFractionDigits: dp == null ? 2 : dp, maximumFractionDigits: dp == null ? 2 : dp});
}
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN');
}
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x < 0 ? '\u2212' : '') + 'Rs.' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
function cls(v){ return v == null ? '' : (Number(v) >= 0 ? 'pos' : 'neg'); }
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(r.state) + '</span>';
}
function failBox(host, sub, e){
  document.getElementById(host).innerHTML =
    '<div class="empty"><b>Could not load</b>' + esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  if (sub) document.getElementById(sub).textContent = 'failed to load';
}

fetchWithTimeout('/api/mobile/home').then(function(r){ return r.json(); }).then(function(d){
  if (d.error) throw new Error(d.error);
  document.getElementById('sub').innerHTML = esc(d.date) + ' · ' + esc(d.time) + ' IST ' + railHtml(d.rail);
  var tiles = (d.indices || []).map(function(i){
    return '<div style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px">'
      + '<div style="font-size:10.5px;color:var(--dim);font-weight:700">' + esc(i.name) + '</div>'
      + '<div class="mono" style="font-size:17px;font-weight:800;margin-top:3px">' + px(i.close) + '</div>'
      + '<div class="mono ' + cls(i.chg_pct) + '" style="font-size:11px;margin-top:2px">'
      + (i.chg_pct == null ? '--' : (i.chg_pct >= 0 ? '+' : '') + n(i.chg_pct) + '%') + '</div></div>';
  }).join('');
  var b = d.book || {};
  var bookCard = '<div class="c">'
    + '<div class="meta"><span class="tag cat">MY BOOK</span>'
    + '<span class="tag ' + (b.empty ? 'neut' : 'bull') + '">' + esc(b.state) + '</span></div>'
    + (b.empty
        ? '<div class="empty" style="padding:14px 0 4px"><b>' + esc(b.message) + '</b>'
          + 'Positions appear here as soon as the book has one.</div>'
        : '<div class="hl mono ' + cls(b.mtm) + '">' + inr(b.mtm) + '</div>'
          + '<div class="sum mono">' + b.positions + ' positions · ' + inr(b.value) + ' value</div>')
    + '</div>';
  var s = d.shortcuts || {};
  var links = [['/m/v8','V8 signals', s.v8_open + ' open'],
               ['/m/qb','Baskets', s.qb_open + ' holdings'],
               ['/m/intel','Intel', s.news_24h + ' items today'],
               ['/m/gvm','GVM scores', 'search a company'],
               ['/m/check','Trade Check', 'cached verdicts']]
    .map(function(l){
      return '<a class="c" style="display:flex;align-items:center;text-decoration:none;color:inherit" href="' + l[0] + '">'
        + '<span style="flex:1"><span class="hl">' + esc(l[1]) + '</span>'
        + '<span class="sum" style="display:block;margin-top:3px">' + esc(l[2]) + '</span></span>'
        + '<span style="color:var(--dim)">›</span></a>';
    }).join('');
  document.getElementById('body').innerHTML =
    '<div style="display:flex;gap:9px;margin-bottom:11px">' + tiles + '</div>' + bookCard + links;
}).catch(function(e){ failBox('body','sub',e); });
</script>
</body>
</html>
