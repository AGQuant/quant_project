<style>
/* ══ APP_QA_R4 P2 · HOME CONSUMES THE THREE-THEME TOKEN LAYER ═══════════════════════════════
   Ref: design_refs/scorr_home_themes_R1.html @ 80da8c6. Tokens come from
   /static/scorr_themes.css, declared on body[data-theme]. The switch sits in the header.

   WHY THE BRIDGE BELOW EXISTS — measured, not assumed. mobile_app.css declares the app palette
   on `.screen,.bnav`, deliberately (framework 15913: "never bare :root"). A custom property set
   on a NEARER ancestor wins, so anything declared on <body> or :root is shadowed for every
   element inside .screen. Probed in Chromium on the live sheets: at :root --panel is #161F33 and
   --grn is #C8F542, while inside .screen those same names still read #121A33 and #2FD48B. That
   is why the R5 layer never reached the app's content (the cc#1066 symptom), and it is why a
   switch on <body> alone would have moved nothing but the header. The bridge re-declares the
   legacy names ON .screen/.bnav, sourced from the theme layer, so one switch re-skins the page.

   The alias step is not decoration: `.screen{--panel:var(--panel)}` is self-referential and CSS
   drops it. Aliasing on body first gives .screen a different name to read from.

   ON P2's "dark byte-identical" LINE, stated rather than quietly chosen: it cannot hold together
   with "map to the new vars", because the ref's dark values and home's current in-scope values
   are different (--grn #2FD48B vs --win #C8F542, --panel #121A33 vs #161F33). Built to the REF,
   which is the R5 palette every other surface already shows; the exact deltas are listed in the
   cc#1077 result. The token SET is the ref's too — it has one --muted and one --edge, so --mut
   and --dim converge, as do --line and --line2. That is the ref's hierarchy, not a flattening
   introduced here. */
body[data-theme]{
  --t-field:var(--field); --t-panel:var(--panel); --t-hi:var(--hi); --t-edge:var(--edge);
  --t-ink:var(--ink); --t-muted:var(--muted); --t-win:var(--win); --t-loss:var(--loss);
  --t-brand:var(--brand); --t-accent:var(--accent); --t-label:var(--label);
}
.screen,.bnav{
  --bg:var(--t-field); --panel:var(--t-panel); --panel2:var(--t-hi);
  --line:var(--t-edge); --line2:var(--t-edge);
  --txt:var(--t-ink); --mut:var(--t-muted); --dim:var(--t-muted);
  --grn:var(--t-win); --red:var(--t-loss);
  --blu:var(--t-accent); --cyan:var(--t-brand);
}
/* the switch — ref .tswitch, 34x30 buttons, right of the wordmark */
/* APP_QA_R5 P1: the switch is HIDDEN, not removed. Markup and JS stay in place so the return
   next build is deleting this one declaration rather than rebuilding the control. */
.tswitch{display:none !important}
.tswitch{display:flex;gap:var(--space-4);background:var(--panel);border:var(--bw-1) solid var(--line2);padding:var(--space-3);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.tswitch button{width:34px;height:30px;border:0;background:transparent;cursor:pointer;font-size:var(--type-13);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:800;color:var(--txt,#E9EEFB);line-height:1}
.tswitch button.on{background:var(--panel2);color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}

/* ══ APP_QA_R5 P2 · GOLD NIGHT RAISED SCALE ═══════════════════════════════════════════════════
   Ref: design_refs/scorr_sprint2_goldnight_R1.html @ cd75e2c. Founder: "font size below also
   increase" — the lower sections were reading small against the raised hero.

   Every size below is the ref's, and 9.5px is the FLOOR: nothing in these sections goes under it.
   Page-scoped on purpose. mobile_app.css sizes these classes for the whole app, and the sprint
   ref is a HOME ref — raising .st or .tool globally would silently re-scale every other screen,
   which is the per-page-vs-shared mistake in the other direction. P7-P10 migrate the other pages
   deliberately, page by page.

   Colour comes from the token layer, not from here: --golddeep is the gold-deep key colour the
   ref uses for stat keys and news age stamps, and it is already the theme's --label under
   goldnight, so these rules ask for the token rather than restating a hex (section D forbids
   touching token values). */
/* THE BOOK — stat values 18px, gold-deep keys */
.st{padding:var(--space-12) var(--space-11)}
.st .k{font-size:var(--type-105);font-weight:700;letter-spacing:var(--track-px12);color:var(--t-label,var(--dim))}
.st .v{font-size:var(--type-18)}
.trio .st .v{font-size:var(--type-18)}
/* cc#1305 — V8 Closed Book's 3 pills sit in one .trio grid row, but "Realised" is one word and
   "Win Rate Long" / "Win Rate Short" wrap to two, so those two .k labels are taller than the
   first and push their .v/.p underneath down by a line — the row reads staggered, not parallel.
   Grid cells do not equalise their children's height on their own; the fix is to reserve the SAME
   vertical space for every .k regardless of whether its own label wraps, so .v starts at the same
   baseline in all three columns. 2 lines at the label's own line-height, flexed to the bottom edge
   so a one-line label still sits flush against .v instead of floating in the reserved space.
   SCOPED TO .cbtrio (bookFace2 only) — bookFace1's Unrealised/Long Unrl/Short Unrl labels are all
   one line already and do not have this defect; widening the fix to every .trio would add dead
   space to a card that was never misaligned. */
.cbtrio .st .k{min-height:2.6em;line-height:1.3;display:flex;align-items:flex-end}
/* MY PORTFOLIO — 13px symbol, 12.5px values, 48px min row */
.pfrow{min-height:48px}
.pfrow .sym,.pfrow .s1{font-size:var(--type-13);font-weight:800;letter-spacing:var(--track-px5)}
.pfrow .v,.pfrow .pv{font-size:var(--type-125);font-weight:700}
/* TOOLS — 12px labels, 19px gold-glow icons */
.tool{font-size:var(--type-12);padding:var(--space-14) var(--space-6)}
.tool span{font-size:var(--type-19);text-shadow:0 0 10px var(--brandglow)}
/* BOTTOM NAV — 11px labels, gold active */
.bnav .bn{font-size:var(--type-11)}
.bnav .bn .i{font-size:var(--type-16)}
.bnav .bn.on{color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}
/* APP_QA_R5 P3 · VIX chip chrome — FLAT, identical to a sibling chip, colour in text only.
   The boxed treatment (tinted background + coloured border) is what made a green chip read as a
   badge of approval. Removed for this chip in both states; the red state keeps its red TEXT. */
/* cc#1131 · THE VIX CHIP GETS ITS SIBLINGS' BORDER, COLOURED BY ITS OWN TIER.
   It always had a 1px border — but pinned to var(--line2) while the five siblings carry a
   coloured one at .45 alpha, so beside them it read as a different component. That is the
   founder's complaint and it is a fair one.
   THE BORDER FOLLOWS THE TEXT'S TIER, exactly as the card asks, using the cc#1123 (1dad464)
   thresholds — so the chip is never red merely because the day is bearish; VIX colour is its own
   rule. Two tiers are live here because the third is deliberately held: cc#1123 logged a STOPPED
   on GREEN for this chip, since cc#1081/cc#1083 locked VIX_COLOR_RULE_V1 to never-green in a row
   of pass/fail chips and rule 12 wants that supersession written to session_log before it is
   acted on. When it is recorded, green is one more line here and one more clause there.
   THE TINT STAYS OFF. Siblings pair a coloured border with a tinted background; APP_QA_R5 P3
   removed the tint from THIS chip on purpose, because a boxed fear gauge reads as a badge. The
   card asked for the border, and the border is what it gets. */
/* ── cc#1184 · THE SIX CHECK CHIPS TAKE THE BEVEL FAMILY (founder 28373) ──────────────────────
   THE CARD'S PREMISE WAS WRONG AND THE RULING STILL STANDS. 28373 says the chips look poor with
   "slant-cut corners". Measured under the full cascade at 360/390/430 before touching anything:
   border-radius 14px, clip-path NONE — they are plain rounded pills and no slant has ever been
   there. So verify A has nothing to remove. What the founder is actually asking for is the
   POSITIVE half: make them read like the two bevel buttons on this screen, and that is what ships.

   .slab.dense, NOT plain .slab. The 5px ledge is for a full-width primary entry — cc#1181's
   Index Intel button and cc#1182's Digest button both take it. Six of them in a wrapped grid
   would read as stripes, which is the exact case the .dense modifier exists for, so the chips get
   the 3px ledge and the 11px radius. One grammar, two scales.

   THE STATE COLOURS FLOW THROUGH THE SHELL, THEY DO NOT FIGHT IT. .slab's dark override sets
   background and border at (0,4,0) — `:root:root:not([data-theme="light"]) .slab` — so the
   existing .hc.ok / .hc.bad / .hc.vixc rules at (0,2,0) would have LOST, and all six chips would
   have come out the same grey with the semantic colours silently gone. That is the half-adoption
   defect the r5 sheet documents twice, and restating six backgrounds at (0,5,0) would have been
   fighting the shell. Instead each state declares --panel and --line ON the chip: .slab resolves
   both at its own use site, so the colour is carried BY the family rather than layered over it,
   and the ledge outline picks up the state border for free. `color` is untouched throughout —
   .slab never sets it, so .hc.ok / .hc.bad / .hc.vixc.vixmid keep their text colours byte for
   byte. VIX stays transparent: APP_QA_R5 P3 removed its tint on purpose so a fear gauge could not
   read as a badge, and a ruling about the bevel is not a licence to put that back.

   PADDING IS COMPENSATED TO THE HALF PIXEL, and that is the whole height proof. .dense's own
   padding is 10px 13px, which would widen every chip by 8px and can only push the row to another
   line — and the chip row sits inside card 1, the face that SETS the deck height. Vertically
   nothing can move: the global tap-target rule pins these buttons at min-height:44px and the
   content box is ~25px, so padding and border have no say. Horizontally .slab's border is 1.5px
   against .hc's 1px, so the padding drops 9px to 8.5px and the border box comes out identical.
   Same widths, same wrap, same card height.

   cc#1230 RAISES THIS PADDING AND THE PARAGRAPH ABOVE IS NOW PARTLY STALE — kept, not deleted,
   because its horizontal arithmetic is still the constraint that decides the number. Two claims
   in it did not survive measurement in the real cascade: the chips are NOT pinned at 44px (the
   tap-target rule keys off a selector these anchors do not match — they measure 23px), so
   vertical padding does move them; and "same card height" was true only while card 1 set the
   deck height, which it no longer does since cc#1182 grew card 2.
   5px -> 6px vertical is +2px per chip ROW, and 8.5px -> 10px horizontal is +3px per chip. The
   horizontal number is the one that can cost a whole row by rewrapping, so it was measured at
   360 before it was written: 6 chips still wrap to 3 rows, 2 rows at 390 and 430, identical to
   the counts before this change.
   7px WAS TRIED FIRST AND IT OVERFLOWED 360 BY 13px. 360 is the binding width and it is by far
   the tightest: the chips wrap to THREE rows there, so every vertical pixel is paid three times,
   and card 1's slack under its index row is only 11px against 38 at 390 and 53 at 430. 6px spends
   6 of those 11 and the chip gap spends 4, which is what fits. It is a smaller increase than the
   card asked for and that is deliberate — shrinking the font to buy the room is the one thing the
   card rules out, and 360 has no dead space to reclaim in the first place. */
.hchips .hc.slab{padding:var(--space-6) var(--space-10);--panel:transparent;--line:var(--line2)}
.hchips .hc.slab.ok{--panel:var(--grn-d);--line:rgba(47,212,139,.45)}
.hchips .hc.slab.bad{--panel:rgba(255,92,108,.10);--line:rgba(255,92,108,.45)}
.hchips .hc.slab.vixc{--panel:transparent;--line:var(--line2)}
.hchips .hc.slab.vixc.bad{--panel:transparent;--line:rgba(255,92,108,.45)}
.hchips .hc.slab.vixc.vixmid{--panel:transparent;--line:rgba(255,159,69,.45)}
/* cc#1433: PCR and VIX read as touching in row 2 (MO/PCR/VIX). The shared .hchips gap is now
   var(--space-4) (cc#1373/1375's own sequence: 9->6->4, deliberately shrunk to hold Card 1 level
   with Card 2's height) and cc#1360 grew the chip font to --type-12 in the same breath — both
   moves that make the row read tighter, not looser, which is what the founder is flagging.
   Uniformly raising the shared gap would refight the exact height-matching work those two cards
   spent real effort on, so this is a SURGICAL nudge on the one boundary the founder actually
   named — VIX's own left margin — not a gap raise that costs all five chip-to-chip pairs at every
   width. Small on purpose (4px): not independently re-verified against the 360px wrap count from
   this sandbox (network-blocked from scorr.in) — flagging for a live check at 360/390/430. */
.hc.vixc{margin-left:var(--space-4)}
.hc.vixc{background:transparent;border-color:var(--line2)}
.hc.vixc.bad{background:transparent;border-color:rgba(255,92,108,.45);color:var(--red)}
/* cc#1123: the middle tier — VIX moved less than 5% either way. Same #FF9F45 as the tape's .neu
   and the Digest's --amber, so one number is one colour across all three surfaces. The chip stays
   FLAT (transparent, same border as its siblings) because APP_QA_R5 P3 removed the boxed
   treatment here on purpose: a tinted, bordered VIX chip read as a badge of approval. Colour in
   the text only, exactly as the red state does. */
.hc.vixc.vixmid{background:transparent;border-color:rgba(255,159,69,.45);color:#FF9F45}


/* cc#900 (founder 08-Aug): the tape lost its look when this page's CSS moved to the shared
   sheet (cc#893 item 3). The ticker's own styling now lives HERE, scoped to this page, so a
   shared-CSS change can never restyle the tape again. Design restored = the original pill:
   SYMBOL + %CHANGE only (founder: "symbol and change") — the price column is dropped; the
   tape reads direction at a glance, exact levels live in the cards below. Marquee behaviour
   (cc#896 batch 3: doubled track, -50% seamless loop, hold to pause) unchanged. */
.tkr{overflow:hidden;padding:var(--space-8) 0;margin:0 var(--space-n12);border-bottom:var(--bw-1) solid var(--line);background:var(--panel2)}
.tkr-track{display:flex;gap:var(--space-8);width:max-content;padding:0 var(--space-12);animation:tkrMove var(--tkr-dur,40s) linear infinite}
.tkr:active .tkr-track,.tkr:hover .tkr-track{animation-play-state:paused}
@keyframes tkrMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tkr-track{animation:none}.tkr{overflow-x:auto}}
.tk{flex:none;display:flex;align-items:baseline;gap:var(--space-6);padding:var(--space-4) var(--space-9);border-radius:var(--radius-8);
  background:var(--panel);border:var(--bw-1) solid var(--line)}
.tk .n{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--txt,#E9EEFB);text-transform:uppercase;white-space:nowrap}
.tk .d{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-11);font-weight:700;white-space:nowrap}
/* cc#1123: volatility's neutral tier on the tape. #FF9F45 is not a new amber — it is the exact
   value this page already gives an index NAME (.ibk-id .sym below, cc#1158) and the
   exact value --amber holds on the Digest, so the neutral VIX reads the same on both screens.
   Written page-scoped rather than as a shared .neu in mobile.css: .pos/.neg are shared because
   every surface means the same thing by them, and a bare .neu is a common enough name that
   putting it in the shared sheet is how cc#1108 happened. */
.tk .d.neu{color:#FF9F45}
/* cc#1139 · the Market Today footer strip. No box on the cells — a hairline divider above is the
   whole separation, so it reads as the card's footer rather than a second row of metric chips. */
/* cc#1364 · founder 09:07: one index per FULL-WIDTH row — at the cc#1360 type-15 the two-up
   cells wrapped BANKNIFTY's % onto a second line. A fact line never wraps; a full-width row is
   the guarantee it never needs to. */
/* cc#1373 · row-gap 6->4, padding-top 9->6: Card 1 now carries a fifth block (cc#1372's
   adrBar) the column didn't have when these numbers were set, and measured against Card 2 it
   was running 26-60px taller across 320-430px. The 40px tap target is UNCHANGED — it is the
   .ixcell::after overlay above, position:absolute, out of flow — so this loses no touch area
   and no information, only the padding/gap around two rows that were already tight.
   cc#1375 · row-gap 4->2, padding-top 6->4: one more turn of the same screw, offsetting the
   1.5x mood word's height cost per that card's own item 4. Still no change to the tap target. */
.ixrow{display:flex;flex-direction:column;row-gap:var(--space-2);padding-top:var(--space-4);border-top:var(--bw-1) solid var(--line)}
/* cc#1159: the cell is a BUTTON now — it opens a chart, so it should be reachable by keyboard
   and announced as pressable. font/background/border/padding are reset because a button inherits
   none of them, and text-align:left because a button centres by default.
   THE HIT AREA IS A PSEUDO-ELEMENT, NOT PADDING. The card asks for a 40px target AND an unchanged
   card height, and padding cannot give you both — it would push the row taller by however much it
   added. An absolutely-positioned ::after takes no space in the flow at all, so the touchable
   region grows to 40px while the card measures exactly what it measured before. */
.ixcell{width:100%;min-width:0;display:flex;align-items:baseline;gap:var(--space-6);flex-wrap:nowrap;white-space:nowrap;
  position:relative;background:none;border:0;padding:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* VERTICAL ONLY. This bled 4px past the cell on each side at first, and render_check called it:
   the last cell's hit area ran past the row's right edge with overflow-x:visible, 12 findings
   across the widths. The horizontal reach was never needed anyway — the cell is already ~152px
   wide at 360px. Height is the only dimension that was short of 40. */
.ixcell::after{content:'';position:absolute;left:0;right:0;top:50%;
  height:40px;transform:translateY(-50%)}
.ixcell:active .ixlv{color:var(--blu,#4D7CFE)}
.ixcell:active .ixgl{color:var(--blu,#4D7CFE)}
.ixnm{font-size:var(--type-10);font-weight:800;letter-spacing:var(--track-em11);color:var(--txt,#E9EEFB);text-transform:uppercase}
/* the dashed underline is this page's existing "you can tap this" grammar, per the ref */
/* cc#1360 · founder 08:41: the index level is the footer's money number — one size class up. The
   dashed-underline background trick below is size-independent and untouched. */
.ixlv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-15);font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--txt,#E9EEFB);
  /* DASHED UNDERLINE THAT COSTS NO HEIGHT. The obvious border-bottom:1px dashed plus a 1px
     padding was written first and measured: it grew .ixrow from 41px to 42px at 360 and 24 to 25
     at 412. The card asks for the affordance AND an unchanged card, and a border cannot give you
     both because it is part of the box. A repeating background gradient paints the same dashes
     inside the existing box and adds nothing to it — measured identical to the old row at both
     widths afterwards.
     The colour fallback is not decoration either: --line2 chains to --edge, which lives in
     scorr_themes.css and not in this file, and a var() that resolves to nothing takes the whole
     declaration down with it. The neighbouring --txt carries a fallback for the same reason. */
  background-image:linear-gradient(to right,var(--line2,rgba(148,166,210,.26)) 55%,transparent 55%);
  background-size:4px 1px;background-repeat:repeat-x;background-position:0 100%}
.ixgl{font-size:var(--type-11);color:var(--txt,#E9EEFB);margin-left:var(--space-1)}
.ixch{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-10);font-weight:700;
  font-variant-numeric:tabular-nums}
/* cc#902 — the scrub readout. .trendhd holds two spans: the title on the left and the live
   value/date on the right, which updates under the finger. Only the SECOND grows; the title
   stays small so the header does not turn into two competing headlines. Scoped here rather than
   in the shared sheet because .trendhd renders on this page only. */
.trendhd span:last-child{font-size:var(--type-15);font-weight:800;color:var(--txt,#E9EEFB);letter-spacing:0}
/* cc#1183 — the same readout, addressed by class. The header gained a third child (the close
   button) on the chip panel, so the value span is no longer :last-child there. Both rules carry
   the same declarations and the old one is untouched, so the tape charts and every path without
   a close button render exactly as before. */
.trendhd .trd-v{font-size:var(--type-15);font-weight:800;color:var(--txt,#E9EEFB);letter-spacing:0}
/* The title takes the slack, so the value and the X sit together on the right rather than being
   spread apart by the shared sheet's justify-content:space-between. */
.trendhd .trd-t{margin-right:auto;min-width:0}
/* cc#1183 close (X). The chip trend panel expands in place; before this the only way to shut it
   was to re-tap the exact cell that opened it, which the founder had no reason to know. The
   glyph is 28px but the TAP TARGET is 44px, given by a transparent ::after box centred on the
   button — the same trick the .ixcell row uses, because a 28px control fails the touch minimum
   and growing the visible button would push the header taller. */
.trendx{position:relative;flex:0 0 auto;width:28px;height:28px;margin:var(--space-n4) var(--space-n6) var(--space-n4) var(--space-8);
  display:flex;align-items:center;justify-content:center;font-size:var(--type-19);line-height:1;
  font-family:inherit;color:var(--txt,#E9EEFB);background:transparent;border:0;padding:0;cursor:pointer}
.trendx::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.trendx:active{color:var(--txt,#E9EEFB)}
/* cc#905 range pills */
.rgs{display:flex;gap:var(--space-6);margin:var(--space-6) 0 var(--space-8)}
.rg{flex:1;min-height:32px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-10);
  font-weight:800;letter-spacing:var(--track-em9);color:var(--txt,#E9EEFB);background:var(--panel);
  border:var(--bw-1) solid var(--line2);border-radius:var(--radius-8);cursor:pointer}
.rg.on{color:var(--blu,#4D7CFE);border-color:rgba(77,124,254,.5);background:rgba(77,124,254,.12)}
/* cc#904 full-screen Market Tape overlay */
.tpo{position:fixed;inset:0;z-index:60;background:var(--bg,#0A0F1E);display:none;
  flex-direction:column;overscroll-behavior:contain}
.tpo.open{display:flex}
.tpo-hd{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-14) var(--space-14) var(--space-10);border-bottom:var(--bw-1) solid var(--line)}
.tpo-hd h2{font-size:var(--type-17);font-weight:800;flex:1}
.tpo-x{min-width:44px;min-height:44px;font-size:var(--type-20);color:var(--txt,#E9EEFB);background:none;
  border:0;cursor:pointer;font-family:inherit}
.tpo-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--space-12) var(--space-24)}
.tpr{display:flex;align-items:center;gap:var(--space-9);padding:var(--space-11) var(--space-2);border-bottom:var(--bw-1) solid var(--line);min-height:52px}
.tpr .nm2{flex:1;min-width:0}
.tpr .s1{font-size:var(--type-135);font-weight:800}

/* ── cc#907: the V8 Open Book trio overflowed its card on the founder's phone ────────────────
   TWO fixes, because they solve two different halves and either alone still breaks.
   STRUCTURE: a grid item's automatic minimum is its min-content width, so a 1fr track GROWS to
   fit a long value and pushes .trio wider than the card, which then clips it (.c is
   overflow:hidden). min-width:0 removes that automatic minimum, so the three tracks can never
   total more than the card — no horizontal overflow at ANY magnitude, today's or a future one.
   LEGIBILITY: structure alone would only shrink the box and clip the text, so the value is also
   compacted (inrShort).
   FOUNDER FOLLOW-UP 08-Aug: overflow-wrap:anywhere stopped the overflow but let a value BREAK
   ACROSS TWO LINES mid-number, which is just as unreadable — his words, and he is right. Two
   changes fix it properly. The symbol is now ₹ instead of "Rs.", which is 2 characters cheaper on
   every money value in the app, and the cell is white-space:nowrap so a number can never wrap
   again: it either fits on one line or the formatter has failed, and the formatter cannot fail
   because inrShort caps the string.
   MEASURED on a 380px viewport: card content is 324px, a track is (324-16)/3 = 102.7px and a cell
   has ~87px after padding; at 13.5px Plex Mono (~8.1px/char) that is ~10 characters. The widest
   inrShort can produce is 8 — "−₹99,999" / "₹1.43Cr" — so 65px in 87px, and it still fits the
   narrower 360px phone (~82px). That headroom is what let the font go back UP from 12.5 to 13.5px
   rather than shrinking further. The old full-digit "Rs.1,42,76,194" was 14 characters, ~118px.
   Scoped to .trio so only this card changes; .st is shared CSS used elsewhere. */
.trio .st{min-width:0;padding:var(--space-9) var(--space-6)}
.trio .st .v{font-size:var(--type-135);white-space:nowrap}
/* ── cc#911: My Portfolio is no longer one big link ──────────────────────────────────────────
   The whole card used to be wrapped in <a class="card-link" href="/m/holdings">, so every tap
   inside it navigated away — including a tap on a holding. The expand control below is now the
   ONLY thing that opens /m/holdings; a row tap opens the shared C·A·R·D strip in place.

   verification, not assumed from glitterSync()'s own code alone. The only added cost is N
   pseudo-elements existing in the DOM instead of 2, negligible at this card count.

   SHAPE — VERIFIED, NOT ASSUMED. The card's scope note claimed both cards "use a custom
   cut-corner clip-path" and asked the ring to match it. Read getComputedStyle() on the live
   cascade before writing a line of this: both cards return clip-path:none, border-radius:14px —
   a plain rounded rect, the same .c every other card on this page uses. There is no cut corner to
   match here (that shape belongs to the unrelated .card class used elsewhere in this file). The
   ring below is built for the shape that is actually there — border-radius:inherit, so it always
   tracks whatever radius .c carries, rather than hardcoding a polygon this pair of cards has never
   had.

   COLOUR — ALSO VERIFIED, NOT ASSUMED, AND THE CARD'S OWN INSTRUCTION WAS WRONG HERE. It said to
   use var(--cyan)/var(--brand), calling that "the same value .sect headers already use,
   #35E0FF". Read the live token chain instead of trusting the name: --cyan resolves to --brand,
   and body[data-theme="goldnight"] — the ONLY theme this app currently renders, per CLAUDE.md —
   sets --brand:#D4AF37, which is GOLD, not aqua (scorr_themes.css). var(--cyan) would have shipped
   a gold glitter border on a founder request for aqua. .sect gets its aqua by NOT using that
   token — .sect{color:#35E0FF} is a raw hardcoded hex specifically because the theme-mapped brand
   colour is not aqua under goldnight. This ring reuses that exact same established escape hatch
   (raw #35E0FF, matching .sect's own literal, not a new value) rather than either shipping the
   wrong colour or inventing a new cross-theme token — that second option is a scorr_themes.css
   change, outside this task's own file boundary ("no changes to any other page"). Confirmed after
   the fact with Scorr:theme_validate: this stays within the P8 ratchet's headroom against
   baseline, 0 regressions — see the task result for the exact before/after numbers.

   TECHNIQUE — the standard border-via-mask trick: a ::after the same size as the card (inset:0),
   painted with a conic-gradient sweep, then masked down to just a thin ring using the
   content-box/border-box double-mask + mask-composite:exclude (-webkit-mask-composite:xor for
   Blink/WebKit's older prefixed value name for the same operation). ::after, not ::before, so the
   shared .c::before left-accent bar every card on this page carries (mobile_app.css) is untouched
   — this ring traces the WHOLE outline, left edge included, so the two never need to coexist as
   competing left-edge marks on these two cards.

   HEIGHT-TRACKING IS FREE. inset:0 on an absolutely-positioned ::after inside .c (position:
   relative) always resolves against .c's CURRENT rendered box — no fixed px, no JS resize hook of
   its own needed. cc#1374's syncHeroCardHeights sets .c's min-height live (data refresh, resize, a
   chip chart opening/closing per cc#1377) and this ring re-traces it automatically, every time,
   because it is asking the browser for "100% of my positioned ancestor" on every paint rather than
   a number computed once.

   FEATURE-DETECTION — A THIRD THING THE CARD'S INSTRUCTION GOT WRONG, ALSO CAUGHT BY TESTING, NOT
   READING THE SPEC LITERALLY. It named `@supports at-rule(@property)` as the gate. Measured
   directly (CSS.supports('at-rule(@property)') in the actual render target): FALSE on this
   engine, even though @property ITSELF works perfectly here (confirmed by parsing an @property
   rule and getting back a real CSSPropertyRule). at-rule() feature-query support and @property
   support are two different capabilities that shipped on different timelines — gating on the
   newer, far-less-adopted one would have silently shipped the STATIC fallback to nearly everyone,
   including browsers that fully support the animation this task asked for. That is a worse
   failure than the one the card was trying to prevent.
   Detected in JS instead — typeof CSS.registerProperty === 'function' is the same capability
   test via the API that ships alongside the at-rule in every implementation (Chrome, Firefox,
   Safari all shipped both together), and it is what every real deployment of this technique
   actually uses. A `glitter-ok` class goes on <html> the moment the script runs (top of this
   block, no DOM dependency, no paint wait) and the animated rules below are scoped under it.
   @property itself is registered UNCONDITIONALLY, outside any gate — an unrecognised at-rule is
   dropped harmlessly by any browser that lacks it, which is the standard, safe CSS parsing
   behaviour and needs no feature test of its own.
   The base rule below (outside .glitter-ok) is the STATIC fallback and is what every browser gets
   by default; only html.glitter-ok switches the background to the animated conic-gradient sweep.
   A browser that cannot register --glitter-angle as a real <angle> custom property cannot smoothly
   animate it either (interpolating a plain custom property jumps instantly instead of sweeping),
   so gating the animation on the same JS capability that gates the registration is what keeps this
   "static or smooth", never "broken or jerky". */
#heroTrack > .c::after{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;box-sizing:border-box;
  pointer-events:none;background:#35E0FF;
  -webkit-mask:linear-gradient(black 0 0) content-box,linear-gradient(black 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
@property --glitter-angle{syntax:'<angle>';inherits:false;initial-value:0deg}
html.glitter-ok #heroTrack > .c::after{
  /* one bright arc travelling the ring, rest transparent -- not a full glow */
  background:conic-gradient(from var(--glitter-angle),
    transparent 0deg, #35E0FF 18deg, transparent 46deg, transparent 360deg);
  animation:glitterSweep 5s linear infinite;   /* cc#1400: 3.6s -> 5s, founder ask, speed only */
  /* cc#1378 battery/visibility discipline: paused by default, .glitter-run is the only thing
     that turns it on (see glitterSync() in JS) -- same "off unless proven visible AND active"
     posture moodStart/moodStop/moodOnScreen already use for the mood-word sweep, reused here as
     a pattern (start/stop keyed to visibilitychange + on-screen/active-face checks), not as the
     literal mechanism -- that one is a JS setTimeout chain because the effect it drives (a
     staggered per-letter class) has no CSS-only equivalent; this effect is a single @keyframes
     rule and a JS timer chain would be reinventing what the compositor already does for free. */
  animation-play-state:paused;
}
html.glitter-ok #heroTrack > .c.glitter-run::after{animation-play-state:running}
@keyframes glitterSweep{to{--glitter-angle:360deg}}
/* prefers-reduced-motion -- same convention as the mood sweep and the ticker marquee elsewhere in
   this file: STATIC aqua border, not no border. BOTH selector forms are listed (plain, and
   html.glitter-ok-prefixed) so this wins by equal specificity + later source order against
   EITHER the base rule or the animated one -- a bare later-in-source plain selector alone is
   LOWER specificity than "html.glitter-ok ...::after" (the class adds a selector component) and
   would have lost the tie to the animated rule whenever both conditions were true at once. */
@media (prefers-reduced-motion:reduce){
  #heroTrack > .c::after,
  html.glitter-ok #heroTrack > .c::after{animation:none;background:#35E0FF}
}

<script>
/* cc#1378 · GLITTER RING FEATURE-DETECT, run first and unconditionally (no DOM/paint dependency,
   document.documentElement always exists). typeof CSS.registerProperty === 'function' is the
   real-world way this is detected -- see the CSS block's own note on why `@supports
   at-rule(@property)` (what the card named) does not actually work as a gate: measured directly,
   this exact engine returns false for that supports-query even though @property itself works
   perfectly, which would have silently shipped the static fallback to nearly everyone. */
if (typeof CSS !== 'undefined' && typeof CSS.registerProperty === 'function'){
  document.documentElement.classList.add('glitter-ok');
}

/* cc#1232 · THE POPOUT BELONGS TO ONE CARD, AND NOW SAYS WHICH. `open` was the whole state, so
   nothing in it recorded that the chart lives inside hero card 0 — it just happened to, because
   #chiptrend is markup inside that card. `card` makes the ownership explicit, and heroDots() below
   uses it to close the popout when the deck settles on any other face. A second expandable card
   added later declares its own index rather than inheriting this one by accident. */
var TREND = { open: null, card: 0 };   /* which chip popup is open: 'adr' | 'pcr' | 'vix', and whose */

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN');
}
function pct(v, dp){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return (x >= 0 ? '+' : '') + x.toFixed(dp == null ? 2 : dp) + '%';
}
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x < 0 ? '\u2212' : '') + '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
function cls(v){ return v == null ? '' : (Number(v) >= 0 ? 'pos' : 'neg'); }
/* cc#907 — Indian short scale for the trio cells. ₹1,42,76,194 is 12 characters and does not
   fit a third of a phone; ₹1.43Cr is 7 and says the same thing at a glance. Two decimals keep
   a lakh readable to the nearest thousand. Below 1L the full figure already fits, so it stays
   exact. The PAYLOAD is untouched — this is display only, and /m/positions still shows every
   rupee (the card is explicit that the book maths must not move). */
function inrShort(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v), sign = x < 0 ? '−' : '', a = Math.abs(x);
  /* decimals shrink as the magnitude grows, so the STRING never does. Measuring the old version
     caught the case the eye misses: ₹100.00Cr is 9 characters and did not fit a 360px phone.
     With this ladder the widest possible output is 8 — "−₹99,999" or "−₹14.3Cr" — which fits
     every cell it is used in, at every viewport down to 320px. */
  if (a >= 1e7){
    var cr = a / 1e7;
    return sign + '₹' + (cr >= 100 ? Math.round(cr) : cr.toFixed(cr >= 10 ? 1 : 2)) + 'Cr';
  }
  if (a >= 1e5){
    var l = a / 1e5;
    return sign + '₹' + l.toFixed(l >= 10 ? 1 : 2) + 'L';
  }
  return sign + '₹' + Math.round(a).toLocaleString('en-IN');
}
/* ══ cc#1118 — THE DIWALI SWEEP ═══════════════════════════════════════════════════════════════
   The mood word lights up letter by letter, left to right, once. Founder-approved design: a glow
   and a small lift per letter, 60ms apart, about 0.6s end to end, one iteration.

   IT IS ADDITIVE, NEVER A REPAINT. The colour stays on .hero-mood as an inline style from
   moodColor(), and every letter inherits it — BEARISH stays red, BULLISH green, SIDEWAYS amber.
   The animation touches text-shadow and transform only, so a festive effect can never be mistaken
   for a different mood. That is the one thing this must not get wrong.

   ONCE PER PAGE LOAD, and this is the part that needed care rather than CSS. The hero is rebuilt
   from scratch on every data refresh, and a CSS animation on freshly-created nodes replays every
   single time — which turns a moment of delight into a twitch every poll. animation-iteration-count
   cannot help: each rebuild is new elements, not a new iteration. So the SWEEP CLASS ITSELF is
   emitted only on the first build, tracked here in a module flag. After that the same markup ships
   without it and the letters simply render.

   Spaces are NOT wrapped: a letter span is inline-block so it can be transformed, and an
   inline-block space collapses to nothing. A multi-word mood would lose its gap. */
/* cc#1132 · the cc#1118 sweep, re-run every 60 seconds while the card is on screen.
   NO NEW ANIMATION. The keyframes and the .mlt spans are cc#1118's and are not touched — the
   letters are simply asked to run the animation they already have again. Setting animation:none,
   forcing ONE reflow for the whole word (not one per letter), then clearing the inline value is
   what restarts a finished CSS animation; clearing it back to '' rather than re-declaring it also
   means the prefers-reduced-motion rule still wins, so a reader who asked for stillness keeps it
   and never gets a blink every minute.
   MOOD_SWEPT IS NOT RESET. It exists so only the FIRST mood word on the page sweeps; resetting it
   would start sweeping the second one too. This re-animates spans that already exist rather than
   rebuilding markup, so nothing about that guard — or the cc#1116/cc#1122 restyle fixes — is
   touched.
   BATTERY. The interval is CLEARED when the tab goes hidden and restarted when it comes back, not
   merely skipped inside the tick: a guarded tick still fires, and a backgrounded PWA should have
   no timer at all. On top of that each tick checks the word is actually in the viewport, so
   scrolling away stops the work too. */
/* cc#1135 · THE MOOD CYCLE. This REPLACES cc#1132 outright: MOOD_TIMER, its 60-second
   setInterval and the moodBlinkStart/moodBlinkStop pair are gone. There is no setInterval left on
   the mood path at all — the cycle is a chain of setTimeouts, so only one step is ever pending.
   THE CYCLE, from ref mood_anim_cycle_R4 (cc#1178 revises R3), looping while visible:
     1. SWEEP  every letter runs moodLite, staggered i*60ms left to right — the cc#1118 effect
     2. SLEEP  4 seconds, the word completely still
   R3 had four phases: sweep, a per-letter march at one letter per second, sweep again, then ten
   seconds still. The founder removed the march on 21-Aug from a live phone render (28179) and
   shortened the still to four seconds. The second sweep went with the march — it existed to
   close the march, and two identical waves back to back with nothing between them would read as
   one stuttered wave, not as the glimpse the ruling asked to keep.
   Length is derived from the word, never hardcoded, so BULLISH, NEUTRAL and CAUTIOUS all work.
   NO NEW KEYFRAMES, in either direction. moodLite is the cc#1118 keyframe untouched; the only
   change cc#1135 made was moving the CSS declaration from .mlt to .mlt.run.
   NOT A REPAINT: this adds and removes a class and an inline animation-delay on spans that
   moodLetters() already rendered. The markup is never rebuilt, MOOD_SWEPT is never reset, and
   moodColor()'s inline colour is never read or written — so the cc#1116/cc#1122 restyle behaviour
   cannot be re-tripped. moodLite is transform and text-shadow only, so the word cannot move a
   pixel and the cc#1134 layout ruling is safe.
   ONE HANDLE, AND THAT IS THE WHOLE ANTI-STACKING GUARANTEE: every phase writes its pending step
   to MOOD_H and nothing else ever schedules. moodStop clears it; moodStart is the ONLY entry into
   the cycle and refuses whenever a handle already exists or the tab is hidden. A second driver
   cannot exist because there is exactly one entry point and it is gated by the same handle it
   sets, so repeated visibility flips can never leave two chains running. */
var MOOD_H = null;
function moodParts(){
  var host = document.querySelector('.hero-mood');
  if (!host) return null;
  var l = Array.prototype.slice.call(host.querySelectorAll('.mlt'));
  return l.length ? { host: host, l: l } : null;
}
function moodReset(m){
  for (var i = 0; i < m.l.length; i++){ m.l[i].classList.remove('run'); m.l[i].style.animationDelay = ''; }
  void m.host.offsetWidth;            /* ONE reflow on the host, not one per letter */
}
function moodOnScreen(m){
  var r = m.host.getBoundingClientRect();
  return !(r.bottom < 0 || r.top > (window.innerHeight || 0));
}
function moodSweep(m, done){
  moodReset(m);
  for (var i = 0; i < m.l.length; i++){
    /* cc#1178: back to the ref R3 stagger of 60ms, with the 420ms flash term below it. */
    m.l[i].style.animationDelay = (i * 60) + 'ms';
    m.l[i].classList.add('run');
  }
  /* This timeout is DERIVED from the two numbers above — letters times stagger, plus one flash
     duration, plus a settle buffer — so the phase never waits longer than the wave it is waiting
     for. The 420 must track the .42s in MOBILE_CSS and the 60 must track the stagger on the line
     above; that is the whole reason it is written as a sum rather than as one number. The 150ms
     buffer is settle time, not part of the wave, and is unchanged. */
  MOOD_H = setTimeout(done, m.l.length * 60 + 420 + 150);
}
/* cc#1178: moodMarch is DELETED, not disabled and not left at a zero interval. The founder ruled
   from a live phone render (28179) that the per-letter blink goes, and a function still sitting
   here with no caller is the thing someone wires back up by accident six weeks from now. The
   cycle is now the glimpse and the still — there is no second phase, and the two back-to-back
   sweeps went with the march, because they only ever framed it. */
function moodSleep(m, done){ moodReset(m); MOOD_H = setTimeout(done, 4000); }
function moodCycle(){
  var m = moodParts();
  /* not painted yet, or scrolled away: idle-wait rather than killing the cycle */
  if (!m || !moodOnScreen(m)){ MOOD_H = setTimeout(moodCycle, 1000); return; }
  moodSweep(m, function(){ moodSleep(m, moodCycle); });
}
function moodStart(){
  if (MOOD_H || document.visibilityState === 'hidden') return;
  moodCycle();
}
function moodStop(){
  if (MOOD_H){ clearTimeout(MOOD_H); MOOD_H = null; }
  var m = moodParts();
  if (m) moodReset(m);               /* no animation state survives while hidden */
}
document.addEventListener('visibilitychange', function(){
  /* never resume mid-cycle: hidden tears everything down, visible starts again at the sweep */
  if (document.visibilityState === 'visible') moodStart(); else moodStop();
});

var MOOD_SWEPT = false;
function moodLetters(word){
  var w = String(word == null ? '--' : word);
  var sweep = !MOOD_SWEPT;
  MOOD_SWEPT = true;
  /* cc#1411: the .mlt spans are emitted on EVERY render now, not just the first. The old
     `if (!sweep) return esc(w);` early-out assumed this function ran once per page life; the
     5-min auto-refresh re-renders the word, and a plain-text word has no .mlt spans, so
     moodParts() returned null and the glimpse-and-still cycle (cc#1135/1178) died into a
     permanent 1-second idle retry after the first background refresh. Re-emitting the spans
     cannot replay the entrance flash: cc#1135 moved the animation off bare .mlt onto .mlt.run
     (confirmed in MOBILE_CSS, not assumed), so markup-only spans are inert until the driver
     classes them — MOOD_SWEPT now gates only the inline first-paint stagger below, keeping
     cc#1178's first-wave semantics byte-identical on the true first paint. */
  var out = '', i = 0;
  for (var n = 0; n < w.length; n++){
    var ch = w.charAt(n);
    if (ch === ' '){ out += ' '; continue; }   /* keep real word spacing */
    /* esc() per CHARACTER, so an escaped entity can never be split down the middle. */
    /* The SECOND copy of the stagger, and the one that gets missed. This is the FIRST-PAINT sweep
       written straight into the markup; the driver's copy above only runs from the second sweep
       onward, so a value changed in one place and not the other shows up as a first wave that
       does not match every wave after it. cc#1178 moves it back to the ref R3 60ms with the
       driver. */
    out += '<span class="mlt"' + (sweep ? ' style="animation-delay:' + (i * 60) + 'ms"' : '') + '>' + esc(ch) + '</span>';
    i++;
  }
  return out;
}

function moodColor(m){
  m = (m || '').toLowerCase();
  if (m.indexOf('bullish') > -1) return 'var(--grn)';
  if (m.indexOf('bearish') > -1) return 'var(--red)';
  return 'var(--amber)';
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  /* cc#984: `label` lets a rail read in plain words ("Feed live") while `state` still drives the
     CSS class, so the four shapes stay the four shapes. Rails without a label are unchanged. */
  var txt = r.label || r.state;
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(txt) + '</span>';
}
/* ── chip trend popup: SVG LINE CHART (website chart style) from /api/mobile/trends ─────────
   founder 08-Aug: the cc#894 pickers guessed other endpoints' JSON keys and rendered "--";
   the new endpoint returns ONE shape ({series:[{d,v}]}) so nothing is guessed, and the popup
   draws a real chart instead of text rows. */
/* cc#1231 · THE COVERAGE SET COMES FROM THE SERVER, and this page keeps NO list of its own.
   /api/mobile/home2 ships trend_intraday, derived from mobile_home2._INTRADAY_KINDS — the single
   place the platform records which chip series have a 5-minute source. Empty until the payload
   lands, and trendRanges() below treats "not in the set" as daily-only, so the worst case before
   the payload arrives is a conservative 7D default rather than a fabricated 1D. */
var TREND_INTRADAY = [];
function hasIntraday(kind){ return TREND_INTRADAY.indexOf(kind) >= 0; }

var TRENDS = {
  adr: { title: 'ADR' },
  pcr: { title: 'NIFTY PCR' },
  vix: { title: 'INDIA VIX' },
  nifty: { title: 'NIFTY 50' },  /* cc#998: the three Home Nifty chips (Day/Week/Month) all open this one close series */
  banknifty: { title: 'BANK NIFTY' }   /* cc#1159: the Home footer index cells */
};
/* cc#908: a point label is a DATE on a daily series and a TIME on an intraday one. One helper
   decides, so the axis, the scrub readout and the tape charts can never disagree about it.
   'HH:MM' is passed through; 'YYYY-MM-DD' loses the year (slice(5)) as it always did. */
function dlab(d){
  d = String(d == null ? '' : d);
  return /^\d{1,2}:\d{2}$/.test(d) ? d : d.slice(5);
}
/* cc#1231 scope 3: `markers` draws a dot on every close so a daily series reads as daily prints
   rather than a continuous line. Defaulted off, so every existing caller renders byte-identically
   and the intraday charts are untouched. */
function trendSvg(series, kind, markers){
  var W = 320, H = 110, PL = 6, PR = 6, PT = 8, PB = 18;
  var vs = series.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var rng = (hi - lo) || 1;
  var n = series.length;
  var xs = function(i){ return PL + (n === 1 ? 0 : i / (n - 1) * (W - PL - PR)); };
  var ys = function(v){ return PT + (1 - (v - lo) / rng) * (H - PT - PB); };
  var pts = series.map(function(p, i){ return xs(i).toFixed(1) + ',' + ys(p.v).toFixed(1); }).join(' ');
  var area = PL + ',' + (H - PB) + ' ' + pts + ' ' + xs(n - 1).toFixed(1) + ',' + (H - PB);
  var d0 = dlab(series[0].d), d1 = dlab(series[n - 1].d);
  var last = series[n - 1].v;
  return '<svg id="tsvg_' + kind + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;display:block;touch-action:none">'
    + '<polygon points="' + area + '" fill="rgba(77,124,254,.14)"/>'
    + '<polyline points="' + pts + '" fill="none" stroke="var(--blu,#4D7CFE)" stroke-width="1.6"/>'
    + (markers ? series.map(function(p, i){
        return '<circle cx="' + xs(i).toFixed(1) + '" cy="' + ys(p.v).toFixed(1)
             + '" r="2" fill="var(--blu,#4D7CFE)"/>'; }).join('') : '')
    + '<circle cx="' + xs(n - 1).toFixed(1) + '" cy="' + ys(last).toFixed(1) + '" r="2.6" fill="var(--blu,#4D7CFE)"/>'
    + '<line id="tcx_' + kind + '" x1="0" y1="' + PT + '" x2="0" y2="' + (H - PB) + '" stroke="var(--amber,#F5B94A)" stroke-width="1" stroke-dasharray="3 2" style="display:none"/>'
    + '<circle id="tcd_' + kind + '" r="3.2" fill="var(--amber,#F5B94A)" style="display:none"/>'
    + '<text x="' + PL + '" y="' + (H - 5) + '" font-size="10" fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(d0) + '</text>'
    + '<text x="' + (W - PR) + '" y="' + (H - 5) + '" text-anchor="end" font-size="10" fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(d1) + '</text>'
    + '</svg>';
}
/* founder 08-Aug batch 3: finger scrub — drag inside the chart moves a crosshair and the header
   readout shows THAT day's value + date. touch-action:none keeps the page from scrolling while
   scrubbing; lifting the finger restores the latest reading. */
function wireScrub(kind, series){
  var svg = document.getElementById('tsvg_' + kind);
  var hd  = document.getElementById('trd_' + kind);
  if (!svg || !series.length) return;
  var W = 320, PL = 6, PR = 6, PT = 8, PB = 18, H = 110;
  var vs = series.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var rng = (hi - lo) || 1, n = series.length;
  var cx = document.getElementById('tcx_' + kind), cd = document.getElementById('tcd_' + kind);
  function latest(){ var l = series[n - 1]; if (hd) hd.textContent = Number(l.v).toFixed(2) + ' \u00b7 ' + dlab(l.d); }
  function show(clientX){
    var r = svg.getBoundingClientRect();
    var fx = (clientX - r.left) / r.width * W;
    var i = Math.round((fx - PL) / ((W - PL - PR) / (n - 1 || 1)));
    i = Math.max(0, Math.min(n - 1, i));
    var p = series[i];
    var X = PL + i / (n - 1 || 1) * (W - PL - PR);
    var Y = PT + (1 - (p.v - lo) / rng) * (H - PT - PB);
    cx.setAttribute('x1', X); cx.setAttribute('x2', X); cx.style.display = 'block';
    cd.setAttribute('cx', X); cd.setAttribute('cy', Y); cd.style.display = 'block';
    if (hd) hd.textContent = Number(p.v).toFixed(2) + ' \u00b7 ' + dlab(p.d);
  }
  function hide(){ cx.style.display = 'none'; cd.style.display = 'none'; latest(); }
  svg.addEventListener('touchstart', function(e){ if (e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
  svg.addEventListener('touchmove',  function(e){ if (e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
  svg.addEventListener('touchend', hide);
  svg.addEventListener('mousemove', function(e){ show(e.clientX); });
  svg.addEventListener('mouseleave', hide);
}
/* ── cc#904: MARKET TAPE overlay ───────────────────────────────────────────────────────────
   Tapping the marquee opens every tape symbol as a table: name, last, change %, and the date
   the number is actually from. The tape itself can only show a value; a five-day-old Nikkei
   print looks exactly like this morning's until something states the date.

   has_series comes from the SERVER (mobile_home2), computed from real data: /api/global/history
   reads global_indices, and NIFTY/BANKNIFTY are not in that table, so those two rows carry no
   chart button. The card's rule — never a dead button — is enforced where the truth is known,
   not guessed in the template.

   /api/global/history/{name} returns a FLAT LIST of global_indices rows
   [{name,symbol,category,price,prev_close,chg_pct,quote_date}] — NOT the {series:[{d,v}]} shape
   /api/mobile/trends uses. Verified by reading gvm_market_endpoints.py before writing this, per
   the card. The map to trendSvg's {d,v} is done here, once. */
var TAPE = { rows: [], view: [], open: {} };

/* ══ cc#910: ONE CHART RENDERER, TWO CALLERS ═══════════════════════════════════════════════
   The chip charts (ADR/PCR/VIX) and the tape charts are now the SAME component. Shared
   functions: trendSvg (the SVG), wireScrub (finger crosshair + readout), dlab (point label),
   rangePills + setRange (the window selector) and renderChart (fetch -> draw -> wire). Nothing
   is forked — a tape chart scrubs and switches ranges because it IS the chip chart, so the two
   cannot drift apart later.

   Only the DATA differs, so only the data is per-caller: CHART[key].load(days) returns a
   promise of {series:[{d,v}], note}. The chip loader reads /api/mobile/trends; the tape loader
   reads the global endpoints. Everything after that is common code.

   RANGES ARE PER CHART, not global: a row only offers 1D when an intraday series genuinely
   exists for it (server-supplied intraday_name, resolved from global_intraday itself). India
   VIX and the two domestic rows have none, so they never show a 1D pill — LIVE_DATA_EVERYWHERE
   cuts both ways, and the half that matters more is never drawing a line the data cannot back. */
var CHART = {};

function chipLoader(kind){
  return function(days){
    return fetchWithTimeout('/api/mobile/trends?kind=' + kind + '&days=' + days)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.error) throw new Error(d.error);
        return { series: (d && d.series) || [], note: (d && d.note) || null };
      });
  };
}
/* Tape data. Daily = /api/global/history/{name} (flat global_indices rows, price+quote_date).
   1D = /api/global/intraday/{feed_name} (flat global_intraday rows, close+ts). Both return a
   FLAT LIST, or {error} on failure — verified by reading gvm_market_endpoints.py, not assumed.
   The 1D window is the endpoint's own rolling 24 HOURS, not a calendar day, so it is labelled
   "last 24h" — for Dow or Bitcoin that is the honest description and "today" would not be. */
function tapeLoader(x){
  return function(days){
    /* cc#940: a row with daily_series === false (NIFTY / BANKNIFTY) has ONLY an intraday source,
       so every window it can offer is the intraday one. Everything else keeps the old rule. */
    var intr = (!!x.intraday_name) && (days === 1 || x.daily_series === false);
    var url = intr
      ? '/api/global/intraday/' + encodeURIComponent(x.intraday_name) + '?days=1'
      : '/api/global/history/' + encodeURIComponent(x.name) + '?days=' + days;
    return fetchWithTimeout(url).then(function(r){ return r.json(); }).then(function(rows){
      if (!Array.isArray(rows)) throw new Error((rows && rows.error) || 'no data');
      var series = intr
        ? rows.filter(function(r){ return r && r.close != null && r.ts; })
              .map(function(r){ return { d: String(r.ts).slice(11, 16), v: Number(r.close) }; })
        : rows.filter(function(r){ return r && r.price != null && r.quote_date; })
              .map(function(r){ return { d: String(r.quote_date), v: Number(r.price) }; });
      /* cc#940: the note states the SESSION and where the data actually ends, read off the rows.
         The old text said "Last 24h" on every intraday chart — on a Sunday that was simply untrue,
         and it gave no clue when a feed stopped early. A date the server chose, printed back. */
      var note = null;
      if (intr && rows.length){
        var t0 = String(rows[0].ts || ''), t1 = String(rows[rows.length - 1].ts || '');
        note = 'Session ' + t1.slice(0, 10) + ' · ' + t0.slice(11, 16) + '–' + t1.slice(11, 16)
             + ' · ' + series.length + ' pts';
      }
      return { series: series, note: note };
    });
  };
}

var RANGES_ALL = [[1, '1D'], [7, '7D'], [15, '15D'], [30, '30D']];
var RANGES_DAILY = [[7, '7D'], [15, '15D'], [30, '30D']];
var RANGES_INTRADAY = [[1, '1D']];
/* cc#1407 · Market Tape's OWN range sets — never RANGES_ALL/RANGES_DAILY. togTrend() (Card 1's
   chip popouts: ADR/PCR/VIX/NIFTY/BANKNIFTY) reads those two directly and is explicitly out of
   scope; mutating them would have silently dropped 7D and added 1Y on the Home card chips too,
   which nobody asked for. Same shape, 7D swapped for 1Y (365d) per the founder's ask — 1D/15D/30D
   untouched so a remembered TREND_RANGE value or the 15D default still matches an existing pill. */
var TAPE_RANGES_ALL = [[1, '1D'], [15, '15D'], [30, '30D'], [365, '1Y']];
var TAPE_RANGES_DAILY = [[15, '15D'], [30, '30D'], [365, '1Y']];

function setRange(ev, key, days){
  if (ev) ev.stopPropagation();

  CHART[key].days = days;
  // a chip's chosen window survives closing and reopening the popup within the visit
  /* cc#1231: guard on TRENDS, not on TREND_RANGE's own keys. The map is now empty at parse time
     (see below), so hasOwnProperty would have been false for every kind and nothing would ever be
     remembered. TRENDS is the real set of chip kinds and is what the guard always meant. */
  if (TRENDS.hasOwnProperty(key)) TREND_RANGE[key] = days;
  renderChart(key);
}
function rangePills(key){
  var c = CHART[key];
  return '<div class="rgs">' + c.ranges.map(function(r){
    return '<button class="rg' + (r[0] === c.days ? ' on' : '') + '"'
      + ' onclick="setRange(event,\'' + key + '\',' + r[0] + ')">' + r[1] + '</button>';
  }).join('') + '</div>';
}

/* Draw (or redraw) a registered chart into its host element. */
function renderChart(key){
  var c = CHART[key];
  if (!c) return;
  var el = document.getElementById(c.host);
  if (!el) return;
  /* cc#1183: the header can now carry a close button, but ONLY for a chart that registered a
     closeCall. The chip trend panel expands in place under the hero and had no way out except
     re-tapping the exact cell that opened it; the tape charts sit inside the tape overlay, which
     already has its own close, and a second X per row would be two closes on one screen.
     The two spans are given classes because a third child breaks `span:last-child`. The old
     rule is left in place so every path that renders no close button styles byte-identically. */
  var head = function(right){
    var x = c.closeCall
      ? '<button class="trendx" type="button" aria-label="Close chart" onclick="'
        + c.closeCall + '">×</button>'
      : '';
    return '<div class="trendhd"><span class="trd-t">' + esc(c.title) + '</span>'
      + (right ? '<span class="trd-v" id="trd_' + key + '">' + right + '</span>' : '')
      + x + '</div>';
  };
  el.innerHTML = '<div class="loading" style="padding:6px 0 0">Loading ' + esc(c.title) + '…</div>';
  var want = c.days;
  c.load(want).then(function(res){
    // a slower earlier request must not overwrite a newer one, and a closed popup draws nothing
    if (CHART[key] !== c || c.days !== want || !c.live()) return;
    var s = res.series || [];
    var note = res.note
      ? '<div class="sum" style="padding:6px 0 0">' + esc(res.note) + '</div>' : '';
    if (s.length < 2){
      el.innerHTML = '<div class="trendbox">' + head('') + rangePills(key)
        + '<div class="sum" style="padding:6px 0 0">Not enough history for this window.</div>'
        + note + '</div>';
      requestAnimationFrame(syncHeroCardHeights);   // cc#1377: this branch can be shorter than
      return;                                       // whatever was showing before a range switch
    }
    var last = s[s.length - 1];
    el.innerHTML = '<div class="trendbox">'
      + head(esc(Number(last.v).toFixed(2)) + ' · ' + esc(dlab(last.d)))
      + rangePills(key) + trendSvg(s, key, c.markers) + note + '</div>';
    wireScrub(key, s);   // rebound on every redraw — a new SVG needs a new binding
    requestAnimationFrame(syncHeroCardHeights);   // cc#1377: covers both the open path (togTrend)
    // and a range switch (setRange) landing a shorter chart than the one it replaced
  }).catch(function(e){
    if (CHART[key] !== c || !c.live()) return;
    el.innerHTML = '<div class="trendbox">' + head('') + rangePills(key)
      + '<div class="sum" style="padding:6px 0 0">Chart failed: ' + esc(e.message) + '</div></div>';
    requestAnimationFrame(syncHeroCardHeights);   // cc#1377: the error line is shorter too
  });
}

/* ── cc#939: TICKER TABLE SORTING ─────────────────────────────────────────────────────────────
   Founder: the tape opens a table, keep it, but let him glance-rank it.

   TWO THINGS THAT WOULD HAVE BROKEN IF DONE THE OBVIOUS WAY.

   1. TAPE.rows IS NOT REORDERED. Every open chart is keyed by its row INDEX — TAPE.open[i], the
      host element id 'tpc_' + i, the CHART registry key 'tp' + i, and the onclick tapeChart(i).
      Sorting the array in place would leave an open chart bound to whatever row slid into that
      slot, so a tap on Gold could redraw Nikkei's chart underneath it. Instead TAPE.view holds
      the ORDER (a list of original indices) and rendering walks that; every index-based key stays
      attached to the row it was created for, and a chart can stay open across a re-sort.

   2. THE NUMBERS ARE SORTED, NOT THE TEXT. The card asked to strip the rupee sign, % and commas
      before comparing. That is the right instinct for a table built from rendered strings — but
      this table is rendered FROM the payload, where price and chg_pct are already numbers. So it
      sorts the data and never parses its own output back. num() still strips those characters
      defensively, for the day a value arrives as a string.

   Nulls always sort LAST, in both directions. This page already refuses to tint a null change
   green or red because unknown is not flat (cc#910); ranking an unknown as if it were zero would
   break the same rule at the top of the list. */
var TAPE_SORT = { col: 'chg', dir: -1 };   // founder default: biggest movers on top
var TAPE_COLS = [
  { key: 'nm',  label: 'Symbol', cls: 'h-nm' },
  { key: 'lv',  label: 'Last',   cls: 'h-lv' },
  { key: 'chg', label: 'Chg %',  cls: 'h-cg' }
];

function tapeNum(v){
  if (v == null) return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  var n = Number(String(v).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? null : n;
}

function tapeSortView(){
  var col = TAPE_SORT.col, dir = TAPE_SORT.dir;
  var order = TAPE.rows.map(function(_, i){ return i; });
  order.sort(function(a, b){
    var ra = TAPE.rows[a], rb = TAPE.rows[b];
    if (col === 'nm'){
      var cmp = String(ra.name || '').localeCompare(String(rb.name || ''));
      return cmp * dir || (a - b);
    }
    var va = tapeNum(col === 'lv' ? ra.price : ra.chg_pct);
    var vb = tapeNum(col === 'lv' ? rb.price : rb.chg_pct);
    if (va == null && vb == null) return a - b;
    if (va == null) return 1;      // nulls last, whichever way the arrow points
    if (vb == null) return -1;
    if (va === vb) return a - b;   // stable: ties keep the payload's own order
    return (va < vb ? -1 : 1) * dir;
  });
  TAPE.view = order;
}

function tapeSort(col){
  /* First tap on a new column = descending (the founder's "biggest first" default reading);
     tapping the active column again flips it. */
  if (TAPE_SORT.col === col) TAPE_SORT.dir = -TAPE_SORT.dir;
  else { TAPE_SORT.col = col; TAPE_SORT.dir = -1; }
  renderTape();
}

function tapeHead(){
  return '<div class="tph">' + TAPE_COLS.map(function(c){
    var on = TAPE_SORT.col === c.key;

      + ' aria-label="Sort by ' + esc(c.label) + '"'
      + ' onclick="tapeSort(\'' + c.key + '\')">' + esc(c.label)
      + (on ? '<span class="ar">' + (TAPE_SORT.dir < 0 ? '\u25BC' : '\u25B2') + '</span>' : '')
      + '</button>';

function tapeRow(x, i){
  var chart = x.has_series
    ? '<button class="tpc" onclick="tapeChart(' + i + ')" aria-label="chart">' +
      (TAPE.open[i] ? '\u2715' : '\u2197') + '</button>'
    : '<span class="tpc" style="color:transparent">\u00b7</span>';

     colour, and the row takes a faint tint of the same sign. A null change gets NEITHER \u2014 an
     unknown move is not a flat move, and tinting it green or red would state something the
     data does not say. */
  var sgn = (x.chg_pct == null || isNaN(Number(x.chg_pct))) ? ''
          : (Number(x.chg_pct) >= 0 ? ' up' : ' dn');

  var lv = (x.inr_price != null && x.inr_unit)

    + '<span class="lv ' + cls(x.chg_pct) + '">' + lv + '</span>'
    + '<span class="cg ' + cls(x.chg_pct) + '">' + pct(x.chg_pct) + '</span>'
    + chart + '</div>'
    + (TAPE.open[i] ? '<div class="tpchart" id="tpc_' + i + '"></div>' : '');

function renderTape(){

    ? (tapeHead() + body) : '<div class="empty"><b>No tape data</b></div>';

  Object.keys(TAPE.open).forEach(function(i){ if (TAPE.open[i]) renderChart('tp' + i); });

/* cc#910: a tape chart is now a registered CHART, so it scrubs and switches range exactly like
   the ADR/PCR chips \u2014 same renderer, same typography, no second implementation. */
function tapeChart(i){
  var x = TAPE.rows[i];
  if (!x || !x.has_series) return;
  var key = 'tp' + i;
  if (TAPE.open[i]){ TAPE.open[i] = 0; delete CHART[key]; renderTape(); return; }
  TAPE.open[i] = 1;
  /* cc#940: three shapes, decided by what the row actually has — intraday only (NIFTY/BANKNIFTY,
     one 1D pill, opens on 1D), intraday + daily (the global names), or daily only. */
  var intradayOnly = (x.daily_series === false && !!x.intraday_name);
  /* cc#1407: TAPE_RANGES_ALL / TAPE_RANGES_DAILY (own arrays, 7D -> 1Y) — RANGES_INTRADAY is
     untouched and still used for the intraday-only rows, which never had a 7D pill to drop. */
  CHART[key] = {

function ibkAsOf(iso){

  if(hasCh){
    /* cc#1363 · plain-words read after the fact (session_log 32095, phrases VERBATIM). A read is
       flow description, never prediction, and it gates harder than the fact: the fact renders at
       the classify threshold, the read only at the LABEL threshold (thLab), only when the side's
       deltas exist at all (hasCh/one_sided already decide that), and a BUILD read additionally
       needs its strike on the writers' side of spot — CE above, PE below; 32095 defines no phrase
       for the other positions, so none is invented. When BOTH outer builds earn their read in one
       tick, the two reads collapse into the single range read at the line's end. */
    var READS = { ceB: 'resistance forming — cautious', peB: 'support forming — bullish',
                  ceU: 'ceiling weakening — bullish tilt', peU: 'floor weakening — bearish tilt',
                  range: 'range forming — sellers boxing both sides' };
    var spotN = oi.spot != null ? Number(oi.spot) : null;
    var sideBits = function(key, wall, thC, thL, isCe){
      var mv = rows.filter(function(r){ return r[key] != null; });
      if(!mv.length) return null;
      var bld = mv.reduce(function(a, b){ return b[key] > a[key] ? b : a; });
      var unw = mv.reduce(function(a, b){ return b[key] < a[key] ? b : a; });
      var o = { bTxt: '', uTxt: '', bRead: false, uRead: false };
      if(bld[key] >= thC){
        o.bTxt = 'build ' + num(bld.strike) + ' ' + fCh(bld[key]);
        o.bRead = bld[key] >= thL && spotN != null
          && (isCe ? Number(bld.strike) > spotN : Number(bld.strike) < spotN);
      }
      if(unw[key] <= -thC){
        o.uTxt = 'unwind ' + num(unw.strike) + ' ' + fCh(unw[key])
          + (wall && Number(unw.strike) === Number(wall.strike) ? ' — wall weakening' : '');
        o.uRead = -unw[key] >= thL;
      }
      return (o.bTxt || o.uTxt) ? o : null;
    };
    var ce = ceDead ? null : sideBits('ce_chg', callWall, thCls.ce, thLab.ce, true);
    var pe = peDead ? null : sideBits('pe_chg', putWall, thCls.pe, thLab.pe, false);
    var rangeOn = !!(ce && pe && ce.bRead && pe.bRead);
    var sideTxt = function(label, o, bWord, uWord){
      if(!o) return '';
      var bits = [];
      if(o.bTxt) bits.push(o.bTxt + (o.bRead && !rangeOn ? ' · ' + bWord : ''));
      if(o.uTxt) bits.push(o.uTxt + (o.uRead ? ' · ' + uWord : ''));
      return bits.length ? label + ' ' + bits.join(' · ') : '';
    };
    var st = [sideTxt('calls', ce, READS.ceB, READS.ceU),
              sideTxt('puts', pe, READS.peB, READS.peU)]
             .filter(Boolean).join(' &nbsp;·&nbsp; ')
             + (rangeOn ? ' &nbsp;·&nbsp; ' + READS.range : '');
    if(st) story = '<div class="oird">' + st + '</div>';
  } else if(oi.baseline_tick == null && !oi.one_sided){
    /* 32043 honesty rule 3: no baseline -> deltas omitted AND the card says so */
    story = '<div class="oird">no 09:20 baseline this session — OI change hidden</div>';
  }
  /* cc#1382: bare mode drops .vpage/.card AND the .grp/h3 title row (the caller supplies its own
     .chd header) -- but the .asof freshness stamp is real information, so it is NOT dropped, just
     relocated as its own line first in the body.
     cc#1474 (mirrors cc#1468): the MP/spot/PW/CW facts footer is REMOVED — every number it
     carried now lives ON the chart (MAX PAIN tag + amber strike label, the 3-row Spot label,
     the wall tags with their strike labels). The stamp line gains the (i) → oiGuide() button. */
  var stamp = '<span class="asof oiasof' + (ao.stale ? ' stale' : '') + '">' + esc(aoTxt) + '</span>';
  var ib = '<button type="button" class="oiib" onclick="oiGuide()" aria-label="How to read this card">i</button>';
  var header = bare
    ? '<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">' + stamp + ib + '</div>'
    : '<div class="grp"><h3>Max Pain ' + esc(name) + '</h3>'
      + '<span style="display:inline-flex;align-items:center;gap:8px">' + stamp + ib + '</span></div>';
  var body = header
    + '<div class="oib">' + cols + spotLine + tags + '</div>'
    + spotLb
    + xs
    + story
    + (oi.one_sided ? '<div class="oird" style="color:var(--amber,#f5b94a)">'
        + (peDead ? 'puts' : 'calls') + ' absent this tick</div>' : '');
  return bare ? body : '<div class="vpage"><div class="card">' + body + '</div></div>';
}

/* cc#1474 · Max Pain's how-to-read sheet — the cc#1465 pf-sheet shell reused verbatim (same

   and it inherits v10Log()'s own "no verdicts is not a 0% record" rule: 0 closed trades for a leg

/* cc#1386 · DEAD-CODE AUDIT (scope item 7): v10LegStats()/v10CardStats() (cc#1383) had exactly
   ONE caller each in this file -- renderHeroV10Cards() below -- confirmed by grep before removing
   either. Neither is reused in modified form: the new merged card is structurally different (ONE

/* cc#1386: CMP for the FUT range bar -- confirmed by reading mobile_v10chart's own source this
   session that it carries NO live index level anywhere in trades[]. TAPE.rows (the SAME d.ticker
   array the top ticker strip and idxFooter() already read, set once at initial paint above --

function posCmp(symKey){

  var row = (TAPE.rows || []).filter(function(x){ return x && x.name === name; })[0];
  return (row && row.price != null) ? Number(row.price) : null;
}
function posPnl(v){
  if (v == null) return '&mdash;';

}
/* cc#1496 · ONE pnl derivation per leg, shared by the bar renderers below AND the load-time
   default-tab pick in loadHeroPositions(). Each returns exactly the number its bar already
   displayed (posRangeBar's footer / posDecayBar's legfoot), or null when that bar would not
   have shown one — a null is never turned into a manufactured 0 here; the caller decides. */
function _futPnl(fut, cmp){
  if (!fut || fut.stop == null || fut.target == null) return null;  // posRangeBar's own unavail guard
  if (cmp == null || fut.lot_size == null) return null;
  var points = (fut.side === 'BUY') ? (cmp - Number(fut.entry_price)) : (Number(fut.entry_price) - cmp);
  return points * fut.lot_size;
}
function _optPnl(opt){
  if (!opt || opt.live_premium == null) return null;                // posDecayBar's own unavail guard
  var written = Number(opt.entry_price), now = Number(opt.live_premium);
  return ((opt.side === 'SELL') ? (written - now) : (now - written)) * (opt.lot_size || 0);
}
/* cc#1386 · FUT LEG -- live open-position range bar (stop-entry-cmp-target). Zones are derived
   from stop/target ALONE, never a hardcoded LONG/SHORT shape: for a LONG, lo=stop/hi=target, so
   the loss zone touches stop (left) and the profit zone touches target (right); for a SHORT lo/hi
   swap, so the SAME "loss zone touches stop, profit zone touches target" rule now draws them on
   the opposite sides. Checked against BOTH of today's real open rows (NIFTY50 LONG, BANKNIFTY
   SHORT) -- the SHORT geometry is what showed the design ref's own LONG-example percentages were
   a hand approximation rather than exact proportional math (matches the ref's SHORT example to
   the decimal place; does not match its LONG one). Implemented as real proportional math here,
   not copied from either example -- see this task's own result for the numbers.
   CMP is CLAMPED for the DOT's position only -- the real, unclamped value stays in the footer
   text, same "visual clamp, real number in text" rule cc#1379's PCR gauge already established.
   TODAY'S REAL EDGE CASE (BANKNIFTY SHORT, cmp past stop) is exactly what beyondStop below is
   for -- confirmed against the live row, not just the ref's own worked illustration of it. */
function posRangeBar(fut, cmp){
  if (!fut || fut.stop == null || fut.target == null){
    return '<div class="unavail">No open futures position for this symbol.</div>';
  }
  var isLong = fut.side === 'BUY';
  var stop = Number(fut.stop), target = Number(fut.target), entry = Number(fut.entry_price);
  var lo = isLong ? stop : target, hi = isLong ? target : stop;
  var pct = function(x){ return hi === lo ? 50 : (x - lo) / (hi - lo) * 100; };
  var stopPct = pct(stop), targetPct = pct(target), entryPct = pct(entry);
  var redLeft = Math.min(stopPct, entryPct), redWidth = Math.abs(entryPct - stopPct);
  var grnLeft = Math.min(entryPct, targetPct), grnWidth = Math.abs(targetPct - entryPct);
  var cmpRaw = (cmp == null) ? null : pct(cmp);
  var cmpClamped = (cmpRaw == null) ? null : Math.max(0, Math.min(100, cmpRaw));
  var beyondStop = cmpRaw != null && ((stopPct === 0 && cmpRaw < 0) || (stopPct === 100 && cmpRaw > 100));
  var beyondTarget = cmpRaw != null && ((targetPct === 0 && cmpRaw < 0) || (targetPct === 100 && cmpRaw > 100));
  var lbl = function(pos, val, tag){
    var style = (pos <= 0) ? 'left:0' : (pos >= 100) ? 'right:0;text-align:right'
      : 'left:' + pos.toFixed(2) + '%;transform:translateX(-50%)';
    return '<span style="' + style + '"><b>' + px(val) + '</b><em>' + tag + '</em></span>';
  };
  var labels = lbl(stopPct, stop, 'stop') + lbl(entryPct, entry, 'entry');
  /* cmp's own label is DROPPED, never overlapped, in TWO cases -- the real value always still
     reaches the screen via the footer line below, never silently lost:
     1. the dot is clamped (existing rule, matches the design ref's own second state).
     2. cmp sits too close to another label to fit without touching it -- a REAL collision found
        by measuring rendered label rects on today's own NIFTY row (entry 33.33%, cmp 40.22% --
        only 6.9 points apart), not a theoretical worry: two 36px-wide centred labels need roughly
        14% separation to clear each other at this card's narrowest tested width (320px, ~280px
        usable), so MIN_LABEL_GAP is set from that measurement, not guessed. Checked against ALL
        three other labels (stop/entry/target), not just entry, since cmp can in principle land
        near any of them.
     cc#1404 RE-DERIVED, same method: the +2-notch font bump on .poslb b (--type-10 -> --type-12,
     this same task) widened each label from ~36px to ~43px, which made 14 genuinely unsafe --
     re-measured at 320px (~260px usable in this build) found real overlap at gap=16 (-1.77px)
     and only a wafer-thin 0.54px clearance at gap=17, both confirmed by rendering the exact
     boundary case, not estimated. 19 is the new value: comfortably clear (6.32px) at the tightest
     boundary tested, same relative safety margin cc#1386's own 14 carried over its computed
     12.86 minimum. */
  var MIN_LABEL_GAP = 19;
  var tooClose = cmpRaw != null && [stopPct, entryPct, targetPct].some(function(p){
    return Math.abs(cmpClamped - p) < MIN_LABEL_GAP;
  });
  if (cmpRaw != null && !beyondStop && !beyondTarget && !tooClose) labels += lbl(cmpClamped, cmp, 'cmp');
  labels += lbl(targetPct, target, 'target');
  var points = (cmp == null) ? null : (isLong ? (cmp - entry) : (entry - cmp));

/* ══ cc#928: WINDOWED CHART + THUMB PAN ════════════════════════════════════════════════════

   chart now shows a ONE MONTH window (22 sessions) and you drag it back through history with a
   thumb. Dragging RIGHT moves the window BACK in time, which is the direction every chart app
   uses — you are pulling the paper rightwards to see what came before.

   The drag must not fight the page: the SVG carries touch-action:pan-y, and the handler only
   calls preventDefault once the gesture is clearly HORIZONTAL (|dx| > |dy|). A vertical swipe
   therefore scrolls the page as normal and never gets swallowed by the chart. */
var V10_WIN = 22;                       // ~1 trading month, daily mode
