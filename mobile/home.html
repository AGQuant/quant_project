<!-- cc#1129: the shared news row. This page uses its sentiment vocabulary, its category map and
     its .nrdot styling so /m/home and /m/digest read as one family; the digest uses it to build
     whole rows. main.py stamps this src with the ?v= build id (both screens are in PROTECTED), so
     the route's 1-day cache header cannot serve a stale copy after a deploy. -->
<script src="/scorr_news_row.js"></script>
<style>
/* ══ APP_QA_R4 P2 · HOME CONSUMES THE THREE-THEME TOKEN LAYER ═══════════════════════════════
   Ref: design_refs/scorr_home_themes_R1.html @ 80da8c6. Tokens come from
   /static/scorr_themes.css, declared on body[data-theme]. The switch sits in the header.

   WHY THE BRIDGE BELOW EXISTS — measured, not assumed. mobile_app.css declares the app palette
   on `.screen,.bnav`, deliberately (framework 15913: "never bare :root"). A custom property set
   on a NEARER ancestor wins, so anything declared on <body> or :root is shadowed for every
   element inside .screen. Probed in Chromium on the live sheets: at :root --panel is #161F33 and
   --grn is #C8F542, while inside .screen those same names still read #121A33 and #2FD48B. That
   is why the R5 layer never reached the app's content (the cc#1066 symptom), and it is why a
   switch on <body> alone would have moved nothing but the header. The bridge re-declares the
   legacy names ON .screen/.bnav, sourced from the theme layer, so one switch re-skins the page.

   The alias step is not decoration: `.screen{--panel:var(--panel)}` is self-referential and CSS
   drops it. Aliasing on body first gives .screen a different name to read from.

   ON P2's "dark byte-identical" LINE, stated rather than quietly chosen: it cannot hold together
   with "map to the new vars", because the ref's dark values and home's current in-scope values
   are different (--grn #2FD48B vs --win #C8F542, --panel #121A33 vs #161F33). Built to the REF,
   which is the R5 palette every other surface already shows; the exact deltas are listed in the
   cc#1077 result. The token SET is the ref's too — it has one --muted and one --edge, so --mut
   and --dim converge, as do --line and --line2. That is the ref's hierarchy, not a flattening
   introduced here. */
body[data-theme]{
  --t-field:var(--field); --t-panel:var(--panel); --t-hi:var(--hi); --t-edge:var(--edge);
  --t-ink:var(--ink); --t-muted:var(--muted); --t-win:var(--win); --t-loss:var(--loss);
  --t-brand:var(--brand); --t-accent:var(--accent); --t-label:var(--label);
}
.screen,.bnav{
  --bg:var(--t-field); --panel:var(--t-panel); --panel2:var(--t-hi);
  --line:var(--t-edge); --line2:var(--t-edge);
  --txt:var(--t-ink); --mut:var(--t-muted); --dim:var(--t-muted);
  --grn:var(--t-win); --red:var(--t-loss);
  --blu:var(--t-accent); --cyan:var(--t-brand);
}
/* the switch — ref .tswitch, 34x30 buttons, right of the wordmark */
/* APP_QA_R5 P1: the switch is HIDDEN, not removed. Markup and JS stay in place so the return
   next build is deleting this one declaration rather than rebuilding the control. */
.tswitch{display:none !important}
.tswitch{display:flex;gap:var(--space-4);background:var(--panel);border:var(--bw-1) solid var(--line2);padding:var(--space-3);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.tswitch button{width:34px;height:30px;border:0;background:transparent;cursor:pointer;font-size:var(--type-13);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:800;color:var(--mut);line-height:1}
.tswitch button.on{background:var(--panel2);color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}

/* ══ APP_QA_R5 P2 · GOLD NIGHT RAISED SCALE ═══════════════════════════════════════════════════
   Ref: design_refs/scorr_sprint2_goldnight_R1.html @ cd75e2c. Founder: "font size below also
   increase" — the lower sections were reading small against the raised hero.

   Every size below is the ref's, and 9.5px is the FLOOR: nothing in these sections goes under it.
   Page-scoped on purpose. mobile_app.css sizes these classes for the whole app, and the sprint
   ref is a HOME ref — raising .st or .tool globally would silently re-scale every other screen,
   which is the per-page-vs-shared mistake in the other direction. P7-P10 migrate the other pages
   deliberately, page by page.

   Colour comes from the token layer, not from here: --golddeep is the gold-deep key colour the
   ref uses for stat keys and news age stamps, and it is already the theme's --label under
   goldnight, so these rules ask for the token rather than restating a hex (section D forbids
   touching token values). */
/* THE BOOK — stat values 18px, gold-deep keys */
.st{padding:var(--space-12) var(--space-11)}
.st .k{font-size:var(--type-105);font-weight:700;letter-spacing:var(--track-px12);color:var(--t-label,var(--dim))}
.st .v{font-size:var(--type-18)}
.trio .st .v{font-size:var(--type-18)}
/* MY PORTFOLIO — 13px symbol, 12.5px values, 48px min row */
.pfrow{min-height:48px}
.pfrow .sym,.pfrow .s1{font-size:var(--type-13);font-weight:800;letter-spacing:var(--track-px5)}
.pfrow .v,.pfrow .pv{font-size:var(--type-125);font-weight:700}
/* LIVE NEWS — 13.5px headlines, gold-deep age stamps */
.rnr .rnh,.news .h{font-size:var(--type-135);line-height:1.45}
.rnr .rnage{font-size:var(--type-95);color:var(--t-label,var(--dim))}
/* TOOLS — 12px labels, 19px gold-glow icons */
.tool{font-size:var(--type-12);padding:var(--space-14) var(--space-6)}
.tool span{font-size:var(--type-19);text-shadow:0 0 10px var(--brandglow)}
/* BOTTOM NAV — 11px labels, gold active */
.bnav .bn{font-size:var(--type-11)}
.bnav .bn .i{font-size:var(--type-16)}
.bnav .bn.on{color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}
/* APP_QA_R5 P3 · VIX chip chrome — FLAT, identical to a sibling chip, colour in text only.
   The boxed treatment (tinted background + coloured border) is what made a green chip read as a
   badge of approval. Removed for this chip in both states; the red state keeps its red TEXT. */
/* cc#1131 · THE VIX CHIP GETS ITS SIBLINGS' BORDER, COLOURED BY ITS OWN TIER.
   It always had a 1px border — but pinned to var(--line2) while the five siblings carry a
   coloured one at .45 alpha, so beside them it read as a different component. That is the
   founder's complaint and it is a fair one.
   THE BORDER FOLLOWS THE TEXT'S TIER, exactly as the card asks, using the cc#1123 (1dad464)
   thresholds — so the chip is never red merely because the day is bearish; VIX colour is its own
   rule. Two tiers are live here because the third is deliberately held: cc#1123 logged a STOPPED
   on GREEN for this chip, since cc#1081/cc#1083 locked VIX_COLOR_RULE_V1 to never-green in a row
   of pass/fail chips and rule 12 wants that supersession written to session_log before it is
   acted on. When it is recorded, green is one more line here and one more clause there.
   THE TINT STAYS OFF. Siblings pair a coloured border with a tinted background; APP_QA_R5 P3
   removed the tint from THIS chip on purpose, because a boxed fear gauge reads as a badge. The
   card asked for the border, and the border is what it gets. */
/* ── cc#1184 · THE SIX CHECK CHIPS TAKE THE BEVEL FAMILY (founder 28373) ──────────────────────
   THE CARD'S PREMISE WAS WRONG AND THE RULING STILL STANDS. 28373 says the chips look poor with
   "slant-cut corners". Measured under the full cascade at 360/390/430 before touching anything:
   border-radius 14px, clip-path NONE — they are plain rounded pills and no slant has ever been
   there. So verify A has nothing to remove. What the founder is actually asking for is the
   POSITIVE half: make them read like the two bevel buttons on this screen, and that is what ships.

   .slab.dense, NOT plain .slab. The 5px ledge is for a full-width primary entry — cc#1181's
   Index Intel button and cc#1182's Digest button both take it. Six of them in a wrapped grid
   would read as stripes, which is the exact case the .dense modifier exists for, so the chips get
   the 3px ledge and the 11px radius. One grammar, two scales.

   THE STATE COLOURS FLOW THROUGH THE SHELL, THEY DO NOT FIGHT IT. .slab's dark override sets
   background and border at (0,4,0) — `:root:root:not([data-theme="light"]) .slab` — so the
   existing .hc.ok / .hc.bad / .hc.vixc rules at (0,2,0) would have LOST, and all six chips would
   have come out the same grey with the semantic colours silently gone. That is the half-adoption
   defect the r5 sheet documents twice, and restating six backgrounds at (0,5,0) would have been
   fighting the shell. Instead each state declares --panel and --line ON the chip: .slab resolves
   both at its own use site, so the colour is carried BY the family rather than layered over it,
   and the ledge outline picks up the state border for free. `color` is untouched throughout —
   .slab never sets it, so .hc.ok / .hc.bad / .hc.vixc.vixmid keep their text colours byte for
   byte. VIX stays transparent: APP_QA_R5 P3 removed its tint on purpose so a fear gauge could not
   read as a badge, and a ruling about the bevel is not a licence to put that back.

   PADDING IS COMPENSATED TO THE HALF PIXEL, and that is the whole height proof. .dense's own
   padding is 10px 13px, which would widen every chip by 8px and can only push the row to another
   line — and the chip row sits inside card 1, the face that SETS the deck height. Vertically
   nothing can move: the global tap-target rule pins these buttons at min-height:44px and the
   content box is ~25px, so padding and border have no say. Horizontally .slab's border is 1.5px
   against .hc's 1px, so the padding drops 9px to 8.5px and the border box comes out identical.
   Same widths, same wrap, same card height.

   cc#1230 RAISES THIS PADDING AND THE PARAGRAPH ABOVE IS NOW PARTLY STALE — kept, not deleted,
   because its horizontal arithmetic is still the constraint that decides the number. Two claims
   in it did not survive measurement in the real cascade: the chips are NOT pinned at 44px (the
   tap-target rule keys off a selector these anchors do not match — they measure 23px), so
   vertical padding does move them; and "same card height" was true only while card 1 set the
   deck height, which it no longer does since cc#1182 grew card 2.
   5px -> 6px vertical is +2px per chip ROW, and 8.5px -> 10px horizontal is +3px per chip. The
   horizontal number is the one that can cost a whole row by rewrapping, so it was measured at
   360 before it was written: 6 chips still wrap to 3 rows, 2 rows at 390 and 430, identical to
   the counts before this change.
   7px WAS TRIED FIRST AND IT OVERFLOWED 360 BY 13px. 360 is the binding width and it is by far
   the tightest: the chips wrap to THREE rows there, so every vertical pixel is paid three times,
   and card 1's slack under its index row is only 11px against 38 at 390 and 53 at 430. 6px spends
   6 of those 11 and the chip gap spends 4, which is what fits. It is a smaller increase than the
   card asked for and that is deliberate — shrinking the font to buy the room is the one thing the
   card rules out, and 360 has no dead space to reclaim in the first place. */
.hchips .hc.slab{padding:var(--space-6) var(--space-10);--panel:transparent;--line:var(--line2)}
.hchips .hc.slab.ok{--panel:var(--grn-d);--line:rgba(47,212,139,.45)}
.hchips .hc.slab.bad{--panel:rgba(255,92,108,.10);--line:rgba(255,92,108,.45)}
.hchips .hc.slab.vixc{--panel:transparent;--line:var(--line2)}
.hchips .hc.slab.vixc.bad{--panel:transparent;--line:rgba(255,92,108,.45)}
.hchips .hc.slab.vixc.vixmid{--panel:transparent;--line:rgba(255,159,69,.45)}
.hc.vixc{background:transparent;border-color:var(--line2)}
.hc.vixc.bad{background:transparent;border-color:rgba(255,92,108,.45);color:var(--red)}
/* cc#1123: the middle tier — VIX moved less than 5% either way. Same #FF9F45 as the tape's .neu
   and the Digest's --amber, so one number is one colour across all three surfaces. The chip stays
   FLAT (transparent, same border as its siblings) because APP_QA_R5 P3 removed the boxed
   treatment here on purpose: a tinted, bordered VIX chip read as a badge of approval. Colour in
   the text only, exactly as the red state does. */
.hc.vixc.vixmid{background:transparent;border-color:rgba(255,159,69,.45);color:#FF9F45}


/* cc#900 (founder 08-Aug): the tape lost its look when this page's CSS moved to the shared
   sheet (cc#893 item 3). The ticker's own styling now lives HERE, scoped to this page, so a
   shared-CSS change can never restyle the tape again. Design restored = the original pill:
   SYMBOL + %CHANGE only (founder: "symbol and change") — the price column is dropped; the
   tape reads direction at a glance, exact levels live in the cards below. Marquee behaviour
   (cc#896 batch 3: doubled track, -50% seamless loop, hold to pause) unchanged. */
.tkr{overflow:hidden;padding:var(--space-8) 0;margin:0 var(--space-n12);border-bottom:var(--bw-1) solid var(--line);background:var(--panel2)}
.tkr-track{display:flex;gap:var(--space-8);width:max-content;padding:0 var(--space-12);animation:tkrMove var(--tkr-dur,40s) linear infinite}
.tkr:active .tkr-track,.tkr:hover .tkr-track{animation-play-state:paused}
@keyframes tkrMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tkr-track{animation:none}.tkr{overflow-x:auto}}
.tk{flex:none;display:flex;align-items:baseline;gap:var(--space-6);padding:var(--space-4) var(--space-9);border-radius:var(--radius-8);
  background:var(--panel);border:var(--bw-1) solid var(--line)}
.tk .n{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tk .d{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-11);font-weight:700;white-space:nowrap}
/* cc#1123: volatility's neutral tier on the tape. #FF9F45 is not a new amber — it is the exact
   value this page already gives an index NAME (.ibk-id .sym below, cc#1158) and the
   exact value --amber holds on the Digest, so the neutral VIX reads the same on both screens.
   Written page-scoped rather than as a shared .neu in mobile.css: .pos/.neg are shared because
   every surface means the same thing by them, and a bare .neu is a common enough name that
   putting it in the shared sheet is how cc#1108 happened. */
.tk .d.neu{color:#FF9F45}
/* cc#1139 · the Market Today footer strip. No box on the cells — a hairline divider above is the
   whole separation, so it reads as the card's footer rather than a second row of metric chips. */
.ixrow{display:flex;gap:var(--space-7);padding-top:var(--space-9);border-top:var(--bw-1) solid var(--line)}
/* cc#1159: the cell is a BUTTON now — it opens a chart, so it should be reachable by keyboard
   and announced as pressable. font/background/border/padding are reset because a button inherits
   none of them, and text-align:left because a button centres by default.
   THE HIT AREA IS A PSEUDO-ELEMENT, NOT PADDING. The card asks for a 40px target AND an unchanged
   card height, and padding cannot give you both — it would push the row taller by however much it
   added. An absolutely-positioned ::after takes no space in the flow at all, so the touchable
   region grows to 40px while the card measures exactly what it measured before. */
.ixcell{flex:1 1 0;min-width:0;display:flex;align-items:baseline;gap:var(--space-6);flex-wrap:wrap;
  position:relative;background:none;border:0;padding:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* VERTICAL ONLY. This bled 4px past the cell on each side at first, and render_check called it:
   the last cell's hit area ran past the row's right edge with overflow-x:visible, 12 findings
   across the widths. The horizontal reach was never needed anyway — the cell is already ~152px
   wide at 360px. Height is the only dimension that was short of 40. */
.ixcell::after{content:'';position:absolute;left:0;right:0;top:50%;
  height:40px;transform:translateY(-50%)}
.ixcell:active .ixlv{color:var(--blu,#4D7CFE)}
.ixcell:active .ixgl{color:var(--blu,#4D7CFE)}
.ixnm{font-size:var(--type-9);font-weight:800;letter-spacing:var(--track-em11);color:var(--dim);text-transform:uppercase}
/* the dashed underline is this page's existing "you can tap this" grammar, per the ref */
.ixlv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-12);font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--txt,#E9EEFB);
  /* DASHED UNDERLINE THAT COSTS NO HEIGHT. The obvious border-bottom:1px dashed plus a 1px
     padding was written first and measured: it grew .ixrow from 41px to 42px at 360 and 24 to 25
     at 412. The card asks for the affordance AND an unchanged card, and a border cannot give you
     both because it is part of the box. A repeating background gradient paints the same dashes
     inside the existing box and adds nothing to it — measured identical to the old row at both
     widths afterwards.
     The colour fallback is not decoration either: --line2 chains to --edge, which lives in
     scorr_themes.css and not in this file, and a var() that resolves to nothing takes the whole
     declaration down with it. The neighbouring --txt carries a fallback for the same reason. */
  background-image:linear-gradient(to right,var(--line2,rgba(148,166,210,.26)) 55%,transparent 55%);
  background-size:4px 1px;background-repeat:repeat-x;background-position:0 100%}
.ixgl{font-size:var(--type-9);color:var(--dim);margin-left:var(--space-1)}
.ixch{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-10);font-weight:700;
  font-variant-numeric:tabular-nums}
/* cc#902 — the scrub readout. .trendhd holds two spans: the title on the left and the live
   value/date on the right, which updates under the finger. Only the SECOND grows; the title
   stays small so the header does not turn into two competing headlines. Scoped here rather than
   in the shared sheet because .trendhd renders on this page only. */
.trendhd span:last-child{font-size:var(--type-15);font-weight:800;color:var(--txt,#E9EEFB);letter-spacing:0}
/* cc#1183 — the same readout, addressed by class. The header gained a third child (the close
   button) on the chip panel, so the value span is no longer :last-child there. Both rules carry
   the same declarations and the old one is untouched, so the tape charts and every path without
   a close button render exactly as before. */
.trendhd .trd-v{font-size:var(--type-15);font-weight:800;color:var(--txt,#E9EEFB);letter-spacing:0}
/* The title takes the slack, so the value and the X sit together on the right rather than being
   spread apart by the shared sheet's justify-content:space-between. */
.trendhd .trd-t{margin-right:auto;min-width:0}
/* cc#1183 close (X). The chip trend panel expands in place; before this the only way to shut it
   was to re-tap the exact cell that opened it, which the founder had no reason to know. The
   glyph is 28px but the TAP TARGET is 44px, given by a transparent ::after box centred on the
   button — the same trick the .ixcell row uses, because a 28px control fails the touch minimum
   and growing the visible button would push the header taller. */
.trendx{position:relative;flex:0 0 auto;width:28px;height:28px;margin:var(--space-n4) var(--space-n6) var(--space-n4) var(--space-8);
  display:flex;align-items:center;justify-content:center;font-size:var(--type-19);line-height:1;
  font-family:inherit;color:var(--mut);background:transparent;border:0;padding:0;cursor:pointer}
.trendx::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;
  transform:translate(-50%,-50%)}
.trendx:active{color:var(--txt,#E9EEFB)}
/* cc#905 range pills */
.rgs{display:flex;gap:var(--space-6);margin:var(--space-6) 0 var(--space-8)}
.rg{flex:1;min-height:32px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-10);
  font-weight:800;letter-spacing:var(--track-em9);color:var(--mut);background:var(--panel);
  border:var(--bw-1) solid var(--line2);border-radius:var(--radius-8);cursor:pointer}
.rg.on{color:var(--blu,#4D7CFE);border-color:rgba(77,124,254,.5);background:rgba(77,124,254,.12)}
/* cc#904 full-screen Market Tape overlay */
.tpo{position:fixed;inset:0;z-index:60;background:var(--bg,#0A0F1E);display:none;
  flex-direction:column;overscroll-behavior:contain}
.tpo.open{display:flex}
.tpo-hd{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-14) var(--space-14) var(--space-10);border-bottom:var(--bw-1) solid var(--line)}
.tpo-hd h2{font-size:var(--type-17);font-weight:800;flex:1}
.tpo-x{min-width:44px;min-height:44px;font-size:var(--type-20);color:var(--mut);background:none;
  border:0;cursor:pointer;font-family:inherit}
.tpo-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--space-12) var(--space-24)}
.tpr{display:flex;align-items:center;gap:var(--space-9);padding:var(--space-11) var(--space-2);border-bottom:var(--bw-1) solid var(--line);min-height:52px}
.tpr .nm2{flex:1;min-width:0}
.tpr .s1{font-size:var(--type-135);font-weight:800}
.tpr .s2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-95);color:var(--dim);margin-top:var(--space-2)}
.tpr .lv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-13);font-weight:700;text-align:right}
.tpr .cg{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-12);font-weight:800;
  text-align:right;min-width:64px}
.tpc{min-width:44px;min-height:44px;background:none;border:0;color:var(--blu,#4D7CFE);
  font-size:var(--type-15);cursor:pointer;font-family:inherit}
/* cc#939: sortable header. It reuses .tpr's flex geometry EXACTLY (same gap, same .nm2/.lv/.cg
   widths, same trailing 44px slot) so a header cell can never drift out of line with the column
   it labels. Sticky, because the founder sorts and then scrolls. Tap targets are the full cell,
   not the glyph — 44px min-height, per MOBILE_APP_FRAMEWORK_V1. */
.tph{display:flex;align-items:center;gap:var(--space-9);padding:var(--space-6) var(--space-2);min-height:38px;position:sticky;top:0;
  z-index:2;background:var(--bg,#0A0F1E);border-bottom:var(--bw-1) solid var(--line)}
.tph button{background:none;border:0;padding:var(--space-8) 0;font-family:inherit;font-size:var(--type-105);
  font-weight:800;letter-spacing:var(--track-px6);text-transform:uppercase;color:var(--dim);cursor:pointer;
  display:flex;align-items:center;gap:var(--space-3);min-height:38px}
.tph button.on{color:var(--txt,#E8EDF7)}
.tph .h-nm{flex:1;min-width:0}
.tph .h-lv{justify-content:flex-end;text-align:right}
.tph .h-cg{justify-content:flex-end;text-align:right;min-width:64px}
.tph .h-sp{min-width:44px}
.tph .ar{font-size:var(--type-9);opacity:.9}
.tpchart{padding:var(--space-2) var(--space-2) var(--space-12)}
/* cc#910: the tape table reads its direction. The tint is deliberately faint (7% alpha) — it
   has to survive next to 15 other rows without turning the sheet into a traffic light, and the
   coloured value + % still carry the precise reading. A row with a null change gets no tint at
   all: unknown is not flat. */
.tpr.up{background:rgba(47,212,139,.07)}
.tpr.dn{background:rgba(255,92,108,.07)}
/* ── cc#906: V10 trade-log chart ─────────────────────────────────────────────────────────── */

/* ── cc#907: the V8 Open Book trio overflowed its card on the founder's phone ────────────────
   TWO fixes, because they solve two different halves and either alone still breaks.
   STRUCTURE: a grid item's automatic minimum is its min-content width, so a 1fr track GROWS to
   fit a long value and pushes .trio wider than the card, which then clips it (.c is
   overflow:hidden). min-width:0 removes that automatic minimum, so the three tracks can never
   total more than the card — no horizontal overflow at ANY magnitude, today's or a future one.
   LEGIBILITY: structure alone would only shrink the box and clip the text, so the value is also
   compacted (inrShort).
   FOUNDER FOLLOW-UP 08-Aug: overflow-wrap:anywhere stopped the overflow but let a value BREAK
   ACROSS TWO LINES mid-number, which is just as unreadable — his words, and he is right. Two
   changes fix it properly. The symbol is now ₹ instead of "Rs.", which is 2 characters cheaper on
   every money value in the app, and the cell is white-space:nowrap so a number can never wrap
   again: it either fits on one line or the formatter has failed, and the formatter cannot fail
   because inrShort caps the string.
   MEASURED on a 380px viewport: card content is 324px, a track is (324-16)/3 = 102.7px and a cell
   has ~87px after padding; at 13.5px Plex Mono (~8.1px/char) that is ~10 characters. The widest
   inrShort can produce is 8 — "−₹99,999" / "₹1.43Cr" — so 65px in 87px, and it still fits the
   narrower 360px phone (~82px). That headroom is what let the font go back UP from 12.5 to 13.5px
   rather than shrinking further. The old full-digit "Rs.1,42,76,194" was 14 characters, ~118px.
   Scoped to .trio so only this card changes; .st is shared CSS used elsewhere. */
.trio .st{min-width:0;padding:var(--space-9) var(--space-6)}
.trio .st .v{font-size:var(--type-135);white-space:nowrap}
/* ── cc#911: My Portfolio is no longer one big link ──────────────────────────────────────────
   The whole card used to be wrapped in <a class="card-link" href="/m/holdings">, so every tap
   inside it navigated away — including a tap on a holding. The expand control below is now the
   ONLY thing that opens /m/holdings; a row tap opens the shared C·A·R·D strip in place.
   44px target per framework 15913 core rule 5. */
.h-exp{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--mut);font-size:var(--type-15);text-decoration:none}
.pfrow{cursor:pointer}
.pfrow:active{background:var(--panel2)}
.pfcard{padding:var(--space-4) var(--space-2) var(--space-10)}
/* cc#929: raw news rows — headline + source + time, two lines at most, dividers not boxes. The
   tag/category line is gone entirely, which is what buys the space back. */
/* ── cc#966: LIVE NEWS COMPACT ────────────────────────────────────────────────────────────────
   Was: headline, then the source + age on their own row below. That second row was wearing the
   MODELS card chrome by accident — mobile_app.css owns a GENERIC `.m` class (background --panel,
   1px border, radius 14, padding 13/13/13/17, min-height 60px) and `.rnr .m` only out-specified
   it on font and colour, so every meta line rendered as a 60px bordered panel. MEASURED at 360px:
   each news row was 122px tall. That is the founder's "large bordered source box". The meta row is
   gone entirely now, and with it the collision.
   The age is a FLEX SIBLING aligned to flex-end, not text appended inside the clamp. Appending it
   inside would put it at the mercy of the 2-line ellipsis: the moment a headline was long enough
   to clamp, the timestamp would be the first thing cut. flex-end puts it on the last line and
   guarantees it survives. */
/* cc#1062: row padding 7px -> 12px. At 360px the headlines sat 14px apart and read as one
   block of text rather than six separate stories. 24px of padding puts a clear band between
   them without changing the clamp, the count per page or the payload. Row height goes 50px ->
   60px, which is why .rnlist's reservation below moves with it — they are one measurement, and
   cc#971/cc#974 are both notes about what happens when they drift apart. */
.rnr{display:flex;align-items:flex-end;gap:var(--space-8);padding:var(--space-12) 0;border-bottom:var(--bw-1) solid var(--line)}
.rnr:last-child{border-bottom:0}
.rnr .h{flex:1;min-width:0;font-size:var(--type-125);line-height:1.4;color:var(--txt,#E9EEFB);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* cc#974: RENAMED from `.a`. mobile_app.css owns a generic `.a` action-button class
   (min-height:44px, 1px blue border, border-radius:10px, centred flex) and cc#966's `.rnr .a`
   only ever set flex/font/colour — so every age stamp wore that button's border and its 44px
   height. THAT is the founder's "bordered rounded box on the right"; it was never styled as a
   box on purpose. Resetting border/radius/min-height would have worked today and broken again
   the next time a rule lands on `.a`, so the class is namespaced instead. Fourth time this file
   has collided with a short app class name (cc#964 .v/.m, cc#966 .m, cc#967 .v). */
.rnr .rnage{flex:none;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-9);
  color:var(--dim);white-space:nowrap;line-height:1.4}
/* no inner scroll region: the section renders a fixed count in page flow, so a fast page scroll
   passes straight through instead of being captured by a 300px window. */
.newslist{max-height:none;overflow:visible}
/* ══ cc#1092 LIVE NEWS — RAW/POLISH tabs + in-page bottom sheet ═══════════════════════════════
   Founder QA 17-Aug 15:33, built to design_refs/scorr_home_news_R1.html @ ec9df19.
   POLISH is the default tab: the polished cards are the product, raw is the firehose behind it.
   Each tab carries its own live count so the denominator is on screen, not implied. */
.nwtabs{display:flex;background:var(--t-sunk,#0E0E11);border:var(--bw-1) solid var(--line);border-radius:var(--radius-9);
  padding:var(--space-3);margin:var(--space-2) 0 var(--space-10)}
.nwtab{flex:1;text-align:center;padding:var(--space-7) 0;border-radius:var(--radius-7);font-size:var(--type-105);font-weight:800;
  letter-spacing:var(--track-em14);color:var(--dim);background:none;border:0;font-family:inherit;cursor:pointer}
.nwtab.on{background:var(--gold,#D4AF37);color:#151204}
.nwtab small{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:700;opacity:.75;
  margin-left:var(--space-4);font-size:var(--type-9)}
/* The WHOLE row is the tap target (44px floor, Apple/Android minimum). The chevron only
   ANNOUNCES that the row opens something — it is not the hit area. A 13px glyph as the only
   target is the thing that makes a phone feel broken. */
/* cc#1130 · THE OUTLINE WAS NEVER DESIGNED — it is the browser's. This rule set border-BOTTOM
   only, and border-bottom does not touch the other three sides, so a <button> kept its user-agent
   default there: measured 2px outset on top, right and left. That is the full rectangle in the
   founder's screenshot. Exactly the shape of the cc#1120 bug one line up — a control inheriting
   chrome nobody wrote — which is why the fix is `border:0` FIRST and the divider declared after,
   so no side can ever fall back to a UA default again.
   Founder ruling: dividers, not boxes. The hairline between rows stays and is the only border. */
/* ── cc#1204 · THE CARD STOPS CHANGING HEIGHT (LIVE_NEWS_FIXED_HEIGHT_V1, session_log 29088) ──
   Founder screenshots 22-Aug 07:50: RAW page 3 is six 2-line rows, page 4 is six 3-line rows, and
   the card is ~80px taller on page 4 — so the Prev/Next bar jumps under the thumb between pages
   and again on the POLISH/RAW switch. .rnlist already carried min-height:360px, which is a FLOOR
   and not a lock: any page whose rows exceed it grows past it, which is exactly what happens the
   moment one headline takes three lines.
   --news-row-h is the measured height of a 2-line row at base font: 11px padding top and bottom,
   a 12.5px headline at line-height 1.45 (18.125px a line, 36.25 for two) and the 1px divider,
   which lands on 59px. It is a token so the clamp, the row and the pad row cannot drift apart -
   three places that must agree, one number. */
:root{--news-row-h:59px}
.nwrow{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-11) var(--space-2);
  height:var(--news-row-h);min-height:var(--news-row-h);box-sizing:border-box;
  border:0;border-bottom:var(--bw-1) solid var(--line);background:none;width:100%;text-align:left;
  font-family:inherit;color:inherit;cursor:pointer}
.nwrow:last-of-type{border-bottom:0}
/* TWO LINES, THEN AN ELLIPSIS. The clamp is what makes the fixed height honest: without it a
   three-line headline would be cut mid-sentence by overflow:hidden with no sign it was cut.
   The full text is never lost - the row is a button and nwOpen() puts the whole headline in the
   sheet, which is verified rather than assumed. */
.nwrow .h{flex:1;min-width:0;font-size:var(--type-125);line-height:1.45;color:var(--txt,#E9EEFB);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* FIXED WIDTH ON THE RIGHT COLUMN, so the headline column is the same width on every row and a
   long timestamp cannot make one row wrap where its neighbour did not. */
.nwrow .t{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-9);color:var(--dim);
  white-space:nowrap;flex:0 0 34px;min-width:0;overflow:hidden;text-align:right}
/* The pad row holds the last page open to six. It is inert - no button, no tap target, no
   divider under the final one - so the card keeps its height without inventing a row that looks
   like it has something in it. aria-hidden because there is nothing here to announce. */
.nwrow.nwpad{cursor:default;pointer-events:none}
/* cc#1120 · WHY IT LOOKED LIKE A BOX, which is not what the card assumed and is worth recording.
   The chevron span was class="c" — and .c in mobile_app.css is THE CARD CLASS: background panel,
   1px border, 14px radius, 13px padding, 9px bottom margin, plus a ::before left rail. A one-glyph
   span was inheriting an entire card. The page rule below set only colour and size, so it never
   undid any of it. That is the "empty chevron in a box" in the founder's screenshot: not a
   designed ornament at all, a class-name collision. It also inflated the row from its 44px
   minimum to 76px.
   The chevron now has its own name and cannot collide. */
/* cc#1204 item 3: THE TAG SLOT IS ONE FIXED WIDTH whatever fills it. A POLISH row carries a
   category chip and a RAW row carries a chevron, and they are not the same width - measured, the
   headline column came out at four distinct widths across the five views (216.3 / 220.2 / 261.2 /
   265.1). A headline column that changes width between tabs is the same defect as a card that
   changes height: the text reflows under the thumb on a control the reader did not touch. Both
   fillers now take the same basis and centre inside it, so the headline keeps one width. */
.nwrow .nwchev,.nwrow .nwcat{flex:0 0 46px;min-width:0;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.nwrow .nwchev{color:var(--gold,#D4AF37);font-size:var(--type-13);flex-shrink:0;
  background:none;border:0;border-radius:0;padding:0;margin:0}
.nwrow .nwchev::before{content:none}
/* cc#1120: the category chip occupies the chevron's slot. flex-shrink:0 and nowrap so it can
   never be squeezed into two lines or push the headline into wrapping; the headline keeps flex:1
   and gives up nothing, because the chip is narrower than the box it replaces. */
.nwrow .nwcat{flex-shrink:0;white-space:nowrap;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:var(--type-85);font-weight:800;letter-spacing:var(--track-em12);padding:var(--space-3) var(--space-6);border-radius:var(--radius-5);
  color:var(--gold,#D4AF37);border:var(--bw-1) solid var(--line2);background:var(--panel2)}
/* THE SHEET IS A PRESSED CONTAINER (scorr_card_pressed_R1 @ 1221452): it SINKS and it has NO
   press state, because a well is not a button. Depth encodes affordance — the rows above rise
   and are tappable, this holds content and is not. */
.nwveil{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:80}
.nwsheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;
  z-index:81;background:var(--t-sunk,#0E0E11);border-top:var(--bw-1) solid #000;border-radius:var(--radius-18) var(--radius-18) 0 0;
  box-shadow:inset 0 3px 9px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.08),
             0 -1px 0 rgba(255,255,255,.06);

@keyframes nwup{from{transform:translateY(100%)}}
.nwgrab{width:38px;height:4px;border-radius:var(--radius-2);background:#3A3A42;margin:var(--space-9) auto var(--space-6);flex-shrink:0}
/* The sheet body is the ONLY vertical scroller on screen while it is open — the page behind is
   locked — so APP_MOTION_MODEL_V1's no-nested-vertical-scroll rule is not violated. A modal
   owns the gesture; it does not compete for it. */
.nwsb{overflow-y:auto;padding:var(--space-4) var(--space-18) 26px;-webkit-overflow-scrolling:touch}
.nwsh{font-size:var(--type-15);line-height:1.35;font-weight:800;margin-bottom:var(--space-7);color:var(--txt,#E9EEFB)}
.nwsm{display:flex;gap:var(--space-8);align-items:center;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:var(--type-95);color:var(--dim);margin-bottom:var(--space-11);flex-wrap:wrap}
.nwchip{font-size:var(--type-8);font-weight:800;letter-spacing:var(--track-em12);padding:var(--space-2) var(--space-7);border-radius:var(--radius-3)}
.nwchip.up{background:rgba(200,245,66,.14);color:var(--grn,#C8F542);border:1px solid rgba(200,245,66,.3)}
.nwchip.dn{background:rgba(255,77,109,.12);color:var(--red,#FF4D6D);border:1px solid rgba(255,77,109,.3)}
.nwchip.hi{background:rgba(255,77,109,.12);color:var(--red,#FF4D6D);border:var(--bw-1) solid rgba(255,77,109,.3)}
.nwchip.nt{background:rgba(255,255,255,.06);color:var(--dim);border:var(--bw-1) solid var(--line)}
.nwbd{font-size:var(--type-125);line-height:1.66;color:#D9D6CC}
.nwbd p{margin:0 0 var(--space-9)}
.nwnone{font-size:var(--type-12);line-height:1.6;color:var(--dim);font-style:italic}
/* ── cc#971 paging ──────────────────────────────────────────────────────────────────────────
   min-height reserves SIX rows. The last page usually holds fewer, and without this the section
   would shrink the moment you reached it — pulling the Tools grid up and moving the Next button
   out from under the thumb that just tapped it.
   cc#974 re-tuned this: removing the accidental button chrome from the age stamp took its height
   from 44px to 13px and the row from 59px to 50px, so the old 354px reservation left ~54px of
   dead space under every page. 6 x 50px = 300px. */
/* cc#1062: 6 x 60px = 360px (was 6 x 50px = 300px). The reservation exists so the section does
   not shrink on the last page and pull the Tools grid up under the thumb that just tapped Next
   — raising the row height without raising this would have re-created exactly that. */
/* cc#1068: section headings settle at token level rather than being repainted by an enhancer
   pass on every tap. Aqua is a HEADING identity only — links and buttons keep pulse, so the
   interactive colour still means "you can touch this". */
.sect{color:#35E0FF;text-shadow:0 0 12px rgba(53,224,255,.4)}
/* cc#1158 — INDEX BOOK strip, per design_refs/scorr_home_indexbook_R2.html (7564bc4). It takes
   the place of the cc#1068 INDEX SIGNALS card, whose .r5-idxcard / .r5-idxsub rules are removed
   with it rather than left behind. The ref's own token names (--aqua/--panel-edge/--up/--down/
   --gold) do not exist in this file; these are the app's equivalents, checked one by one. The
   amber is the same #FF9F45 the old index line used for an index NAME, so the colour still
   means the same thing here as it did there. */
.ibk{background:var(--panel);border:var(--bw-1) solid var(--line);margin-top:var(--space-10);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
/* a row is a BUTTON, not a div with onclick: it is a tap target that opens a chart, so it should
   be reachable by keyboard and announced as pressable. font/color/background are reset because a
   button does not inherit them. */
/* WRAPS, and the left column can shrink. Measured before this was here: at 412px@2x the row ran
   62px past the card edge with overflow-x:visible, so the P&L was not clipped-but-scrollable, it
   was gone, and the document itself scrolled sideways by 46px. The left block had no min-width:0,
   so it refused to shrink below its content, and .ibk-pnl is flex:0 0 auto and got pushed off.
   flex-wrap lets the P&L drop under the identity at big text instead of leaving the card. */
.ibk-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:var(--space-8) var(--space-12);padding:var(--space-15) var(--space-16);min-height:44px;width:100%;text-align:left;cursor:pointer;
  background:none;border:0;font:inherit;color:inherit}
.ibk-row + .ibk-row{border-top:var(--bw-1) solid var(--line)}
.ibk-row:active{background:var(--panel2)}
.ibk-l{flex:1 1 58%;min-width:0}
.ibk-id{display:flex;align-items:center;gap:var(--space-10);min-width:0;flex-wrap:wrap}
.ibk-id .sym{font-size:var(--type-14);font-weight:700;letter-spacing:var(--track-em7);color:#FF9F45}
.ibk-dir{font-size:var(--type-105);font-weight:800;letter-spacing:var(--track-em12);padding:var(--space-3) var(--space-8);border:var(--bw-1) solid}
.ibk-dir.long{color:var(--grn);border-color:var(--grn)}
.ibk-dir.short{color:var(--red);border-color:var(--red)}
.ibk-legs{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-95);color:var(--dim);
  letter-spacing:var(--track-em9);margin-top:var(--space-3);overflow-wrap:anywhere}
.ibk-pnl{display:flex;align-items:center;gap:var(--space-12);flex:0 0 auto}
.ibk-pnl .v{font-size:var(--type-16);font-weight:800}
.ibk-pnl .v.pos{color:var(--grn)}
.ibk-pnl .v.neg{color:var(--red)}
.ibk-pnl .v.na{color:var(--mut);font-size:var(--type-13)}
.ibk-pnl .arrow{color:var(--dim);font-size:var(--type-14)}
/* cc#1181 — .ibk-cap is deleted. The founder removed the caption note off two live renders
   (28349), and the single Index Intel entry point below the strip replaces the "TAP FOR CHART +
   TRADES" half of what it said. The other half was already true without being written down: the
   rows have said LONG/SHORT and shown a paired number since cc#1158.
   THE CAPTION ALSO CARRIED THE AS-OF STAMP, and that is not chrome — it is the only thing on
   this strip that said how fresh the money numbers are. It goes with the caption because the
   ruling deleted the caption, but it is logged as a QUESTION rather than dropped quietly. */
/* THE BUTTON ITSELF IS A .slab AND NOT A NEW STYLE. The card says match an existing bevel family
   rather than invent one, so I enumerated instead of recalling: the repo has exactly ONE bevel
   grammar for tappable things, .slab in scorr_theme_r5.css — raised face, gold ledge, 5px press —
   with .pressed as its sunk counterpart for containers that are NOT buttons, and the rule written
   at the top of that file decides between them in one question: does tapping it go somewhere.
   This does, so it is a slab. NOT .dense: dense is the 3px ledge the TOOLS tiles use because nine
   of them share a grid, and this is one full-width primary entry, which is the scale the
   full-width .c slab cards already use on this page.
   Everything here is layout and type only — face, border, radius, ledge and press all come from
   .slab, so a future palette or depth change moves this button with every other one.
   THE LEDGE NEEDS SOMEWHERE TO LAND. .slab paints a 5px shadow BELOW the border box, and a shadow
   takes no space in flow, so the next section would otherwise measure its margin from a line the
   ledge is still painting on. The 5px bottom margin is that reserve, written to match the ledge. */
.ibk-intel{display:block;width:100%;box-sizing:border-box;margin:var(--space-10) 0 var(--space-5);text-align:center;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-11);font-weight:800;
  letter-spacing:var(--track-em16);color:var(--cyan,#37D3E8);text-decoration:none;min-height:44px;
  line-height:20px}
.ibk-flat{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-11);letter-spacing:var(--track-em12);
  color:var(--mut);text-align:center;padding:var(--space-18) var(--space-16)}
/* cc#1204: EXACT, not a floor. min-height:360px reserved six rows and then let any page that
   needed more simply take more - which is the whole defect. Six rows at the token is the height,
   full stop, so a page that tried to exceed it would show up as a clipped row in the harness
   instead of silently moving the pager. */
.rnlist{height:calc(var(--news-row-h) * 6);animation:rnfade .18s ease-out}
@keyframes rnfade{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rnlist{animation:none}}
.rnpg{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);
  padding-top:var(--space-8);border-top:var(--bw-1) solid var(--line)}
.rnb{min-height:44px;min-width:88px;padding:0 var(--space-12);font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:var(--type-10);font-weight:700;letter-spacing:var(--track-em9);color:var(--mut);background:var(--panel);
  border:var(--bw-1) solid var(--line);border-radius:var(--radius-10);cursor:pointer}
.rnb:disabled{opacity:.35;cursor:default}
.rnp{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-10);font-weight:700;
  color:var(--dim);letter-spacing:var(--track-em9)}
/* cc#1158: the cc#919 .v10b / .v10i rules are removed with the INDEX SIGNALS markup they
   styled. Nothing in the repo selects them any more - checked against every .py, .js and
   .html, including the pwa enhancer, where the only remaining mentions are comments. */
/* ── founder 08-Aug: the hero becomes a two-card deck you swipe ─────────────────────────────
   Card 1 keeps the mood, the checks line, the one-line V10 state and the ADR/PCR/VIX chips.
   Card 2 carries INDEX RANGE — where NIFTY and BANKNIFTY actually sit between today's support
   and resistance — plus the Daily Digest link, mirroring the "Read Market Commentary" doorway.
   ITEMS ARE UNIQUE, per the instruction: nothing on card 2 repeats card 1. PCR in particular
   stays a chip on card 1 only — it already opens a real chart with 1D/7D/15D/30D ranges and a
   scrub readout, which is strictly more than a static sparkline would add here. */
.swipe{margin-bottom:var(--space-9)}
/* cc#1122 item 4 — THE EMPTY BLOCK UNDER THE CHECK CHIPS. It is not padding and it is not a
   min-height, so neither of the two fixes the card proposes is the right one. The deck is a flex
   row at the default align-items:stretch, and card 2 (MARKET MOOD / PCR: header, mood, two index
   rows, the Digest link) is genuinely the taller face. Stretch made card 1 grow to match it, so
   the hero's BORDER sat far below its last chip with nothing in between — the card looked
   unfinished because it literally ended nowhere near its content.
   align-items:flex-start lets each face end where its own content ends. This does NOT make the
   deck jump when you swipe: both faces are children of the same flex row, so the TRACK is still
   as tall as the tallest of them and the page below never shifts. The gap simply moves out of
   the hero card and into the track, where there is no border to make it read as unfinished.
   No content was invented to fill the space, because there was none to add. */
.swipe-t{display:flex;align-items:flex-start;gap:var(--space-9);overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
/* cc#1125 — THIS SUPERSEDES MY OWN cc#1122 ITEM 4 ON THE HERO DECK, and the founder is right.
   cc#1122 read the void as "card 1's border sits far below its last chip" and fixed it by letting
   each face end at its own content. That moved the empty space out of the card and into the track,
   where it still reads as a void — just an unbordered one — and left the deck visibly uneven
   between the two faces. The answer he wants is the opposite: both faces the SAME height, and
   card 1 actually USING the space rather than being top-loaded above it.
   SCOPED TO #heroTrack ON PURPOSE. .swipe-t is also the V8 Open Book deck's track, and this card
   says not to touch that one — so the stretch and the column layout are keyed to the hero deck's
   id and the book deck keeps exactly the geometry cc#1122 gave it.
   NO HARDCODED HEIGHTS, per the card. The shared height is whatever the taller face needs:
   align-items:stretch makes both faces take the flex row's height, and the row's height is set by
   the taller one. Nothing jumps on swipe because both faces are children of the SAME row — the
   track height never changes as you scroll across it.
   Card 1 becomes a column with the chip row pushed to the foot by margin-top:auto, so the card
   reads as headline at the top and metrics at the bottom instead of a block of content with dead
   space hanging under it. */
#heroTrack{align-items:stretch}
#heroTrack > .c{display:flex;flex-direction:column}
/* cc#1134 · FINAL RULING, and it supersedes the space distribution I chose in cc#1125.
   Three attempts on this one card, each satisfying its own spec text and opening a new gap,
   because none of them had a TARGET layout: cc#1122 left the void below the chips, cc#1125 pushed
   the chips to the floor with margin-top:auto and moved the void into the middle. This is the
   target, implemented literally.
   THE FIVE BLOCKS ARE ONE UNIT, top-anchored, with a single fixed gap between each. row-gap and
   nothing else: no margin-top:auto, no space-between, no centering, no flex-grow on any inner
   block. That is the property that guarantees no inner gap can reopen — with justify-content left
   at its flex-start default and no auto margins anywhere, leftover height has nowhere to go
   except after the last child. A middle void is not merely unlikely, it is unreachable.
   Child margins are zeroed inside this scope so the gap is the ONLY spacing, rather than gap
   plus whatever each block happened to carry (6px, 5px and 11px, all different).
   SCOPED TO THE FIRST FACE. Card 2 keeps its own internal spacing untouched; only the shared
   height from cc#1125 is common to both, and that invariant stands.
   The card lists an accent bar between the tagline and the chips. There is no such element in
   this markup — the swoosh it refers to was the r5 mood signature withdrawn in cc#1116 — so the
   four blocks that exist are ordered as ruled and none was invented to fill the slot. */
#heroTrack > .c:first-child{gap:var(--space-13)}
#heroTrack > .c:first-child > *{margin-top:0;margin-bottom:0}
/* an empty popup host would otherwise buy itself a gap it does not need */
#heroTrack > .c:first-child > #chiptrend:empty{display:none}
/* ── cc#1230 · THE DEAD TAIL UNDER CARD 1, AND WHY cc#1134's "NO AUTO MARGINS" NO LONGER HOLDS ──
   THE PREMISE cc#1134 WAS BUILT ON HAS BEEN FALSE SINCE cc#1182. It reasoned that leftover height
   "has nowhere to go except after the last child" and treated that as harmless, because at the
   time card 1 was the TALLER face and there was no leftover height to place. cc#1182 spent 45px
   growing card 2, which flipped the deck: card 2 now sets the height and card 1 is the stretched
   one. Measured in the page's real cascade, the space sitting under card 1's index row is
   25px at 360, 52px at 390 and 67px at 430 — at 430 that is 22% of the card, empty, exactly the
   "bottom half is empty while the chips sit cramped at the top" the founder photographed.
   (Recorded because it cost me a run: my first harness appended the shared sheets AFTER the page's
   own <style>. That inverts the cascade — mobile.css's .hero-mood{32px} then beats this page's
   clamp() — and it under-reported the tail as 14-16px. The sheets now sit where their <link> does.)

   THIS IS NOT cc#1125 COMING BACK. cc#1125 put margin-top:auto on ONE child, the chip row, so all
   the free space collected in a single place and the void simply moved from the foot to the
   middle. When TWO children carry an auto top margin, flexbox splits the free space EQUALLY
   between them — so the same 67px becomes two ~33px gaps rather than one hole. That is the
   difference between the two changes and it is a property of the layout, not a tuning.
   THE SPLIT IS 2, NOT 4, BECAUSE THE EYEBROW, THE MOOD WORD AND THE TAGLINE ARE ONE VERDICT
   BLOCK. Loosening them from each other would break the grouping cc#1182 was careful to protect
   on card 2. They keep the fixed 13px gap; the space goes where the card's three real units meet:
   verdict -> chips, and chips -> index row. Measured, those two gaps come out at 13/14 on a 360,
   29/29 on a 390 and 37/36 on a 430, and the space under the index row drops from 25/52/67 to
   14/14/14 at all three — 14 being the card's own padding and border, i.e. no dead space left at
   all. The wider the screen the more there was to convert, which is the shape of the complaint.
   THE FIXED GAP IS DELIBERATELY NOT RAISED. Raising it 13->15 costs 8px on all four gaps at every
   width, and 360 has only 11px of slack in total, so it would grow the deck there — measured, 307
   -> 320. The distribution above already produces gaps far larger than 15 wherever there is room
   to produce them, so the flat raise would buy nothing at 390/430 and break the invariant at 360.
   IT CANNOT GROW THE CARD. An auto margin resolves to 0 when there is no free space, so on any
   payload where card 1 becomes the taller face again these rules contribute nothing at all and
   the deck is exactly the height its content asks for. The only unconditional spend is the chip
   padding and the chip gap, and both were measured against the 11px available at 360. */
#heroTrack > .c:first-child > .hchips,
#heroTrack > .c:first-child > .ixrow{margin-top:auto}
/* The chip grid's own breathing room. .hchips lives in mobile_app.css and is shared by other
   surfaces, so the gap is raised HERE, scoped to this card, and the shared file is not touched —
   SHARED_CSS_RULE_V1, and the cc#1108 lesson about a look shipped through a shared selector. */
#heroTrack > .c:first-child > .hchips{gap:var(--space-9)}
/* cc#1122 item 3 — the mood word is UPPERCASE and large by decision now, not by accident.
   PAGE-SCOPED ON PURPOSE. mobile.css sets .hero-mood at 32px for every /m/* page; this rule
   lives in home.html's own <style> so it reaches the Home hero and nothing else. That is the
   whole lesson of cc#1108: the same look shipped through a shared selector landed on surfaces
   nobody was designing for. scorr_mobile_cards.js now skips .hero-mood for the same reason.
   SIZE AND CASE ONLY. The font stays Space Grotesk (cc#1116/cc#1117's fix stands) and the colour
   is still moodColor()'s inline style, untouched.
   WHY clamp AND NOT A FLAT 56px. I measured the longest word MOODS can emit — CAUTIOUS — at both
   48px and 56px on 360px and 390px viewports, and both fitted on one line. But that measurement
   ran against a FALLBACK sans, not Space Grotesk: document.fonts came back empty here because
   fonts.googleapis.com is not reachable from this environment, and fonts.check() returns true on
   a fallback, so it cannot be trusted either. At 56px the fallback already used 288px of a 298px
   box — 3% of headroom — and a real face even slightly wider than the fallback overflows. I am
   not going to state a fit I could not actually measure. clamp(40px,13vw,52px) removes the guess:
   the word scales with the screen instead of being a fixed number tuned to one phone, lands near
   47px on a 360px phone with roughly 19% of headroom against the fallback metrics, and reaches
   52px on a large phone — close to the 56px scale the founder responded to, without betting the
   layout on a font I cannot see. If he wants it bigger still on his device, raise the 52px cap;
   that is one number and it is safe to move once someone can look at the real screen. */
.hero-mood{font-size:clamp(var(--type-40),13vw,var(--type-52));text-transform:uppercase;line-height:1.02}
.swipe-t::-webkit-scrollbar{display:none}
.swipe-t > .c{flex:0 0 100%;scroll-snap-align:center;margin-bottom:0}
/* cc#955 — THE cc#950 DECK RENDERED BOTH FACES SIDE BY SIDE, and this one missing rule is why.
   The rule above is a CHILD combinator. The market-mood deck's faces are `.c` divs sitting
   directly in the track, so it matches them. My book faces are NOT: in cc#950 I wrapped each face
   in its own <a class="card-link"> — deliberately, so that a horizontal swipe inside a single
   page-wide anchor could never end as a navigation — which makes `.c` a GRANDCHILD. The width
   rule therefore never applied, the two anchors took default flex sizing, and they shared one row
   at half width each: two headers on screen, "UNREALI", "Rs2".
   The intent was right and the consequence was not carried across. Anchor faces now get the same
   geometry. Written as a SEPARATE selector rather than widening the existing one to `> *`, because
   that would have changed the market-mood deck's snap alignment, and this card says not to touch
   it. scroll-snap-align:start per the card; at a full-width face start and center coincide. */
.swipe-t > a{flex:0 0 100%;max-width:100%;min-width:0;scroll-snap-align:start;display:block}
.swipe-t > a > .c{margin-bottom:0}
/* ══ cc#1160 · INDEX INTEL ON THE CARD'S BOTTOM EDGE — REMOVED AT cc#1181 ═════════════
   The button, its absolute geometry, the em track reserve and the cancelling dots margin
   all shipped here and are all deleted below. Two findings from that build are kept because
   they are about THIS CARD and not about the button, and both cost a measurement to learn:
     • overflow-x:clip does NOT work here. Chromium collapses visible+clip back to hidden on
       both axes, so the mixed pair CSS allows is not a route out of #heroTrack's overflow-x.
     • the hero card was failing render_check at 2x BEFORE cc#1160 existed — div.c hiding
       137px of its own content past its edge with no way to scroll to it. overflow:visible
       is what fixes that, which is why it survives the button that introduced it. */
/* ── cc#1181 · THE EDGE BUTTON IS GONE, AND SO ARE ALL FOUR OF ITS ACCOMMODATIONS ────────────
   Founder ruling 28349, from two live phone renders: one Index Intel entry, not two, and it is
   the bevel button under the INDEX BOOK strip. Four rules existed only to carry the button that
   rode this card's bottom edge, and all four are deleted, so nothing is left here at all:
     position:relative        MOBILE_CSS already sets it on .c; it was restated to anchor the button
     overflow:visible         released the card's clipping so the button's lower half showed
     ::before radius          rounded the accent bar that the released clipping stopped rounding
     the em reserve + margin  gave the track somewhere to paint the overhang, then gave it back

   I FIRST KEPT TWO OF THEM AND THE MEASUREMENT SAID NO. The argument for keeping overflow:visible
   was cc#1160's note that it also fixed a defect predating the button — the card hiding 137px of
   its own content past its edge at 2x. That note came from render_check, and render_check strips
   every external stylesheet before rendering: on this page that removes .c{overflow:hidden}
   itself, plus the shared JS that defines fetchWithTimeout, so the page paints 37 elements, ZERO
   cards and 71 characters of text. The finding was measured on a blank screen and does not stand.
   Re-measured in the real cascade with the card full of real content: at 360 and 430, with the
   trend chart panel both closed and open, the number of descendants sitting beyond the card's
   edge is ZERO with overflow visible and ZERO with it hidden, and the card height is identical to
   the pixel (322/327 closed, 453/458 open). The rule is doing no work, so it goes with the button
   that brought it, and the card gets exactly the pre-cc#1160 geometry it asked for. */
.dots{display:flex;justify-content:center;gap:var(--space-6);margin-top:var(--space-7)}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line2);transition:.2s}
.dots i.on{background:var(--blu,#4D7CFE);width:16px;border-radius:var(--radius-3)}
.irow{display:flex;align-items:baseline;gap:var(--space-8);margin-top:calc(11px * var(--rh,1))}
.irow .inm{font-size:var(--type-10);font-weight:800;letter-spacing:var(--track-em11);color:#FF9F45;flex:1}
.irow .ilv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-16);font-weight:800}
.irow .ipp{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-95);color:var(--mut)}
.ibar{position:relative;height:4px;border-radius:var(--radius-2);background:var(--panel2);
  border:var(--bw-1) solid var(--line);margin:calc(6px * var(--rh,1)) 0 calc(3px * var(--rh,1))}
.ibar .idot{position:absolute;top:50%;width:9px;height:9px;margin:var(--space-n45) 0 0 var(--space-n45);
  border-radius:50%;background:var(--amber,#F5B94A);border:var(--bw-2) solid var(--panel)}
.isr{display:flex;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:var(--type-9);color:var(--dim)}
.isr span:last-child{margin-left:auto}
/* ── cc#1182 · CARD 2'S RHYTHM IS ONE RATIO, AND THE CTA IS ANCHORED TO THE FLOOR ────────────
   THE HEIGHT INVARIANT IS NOT ARITHMETIC HERE, IT IS STRUCTURAL, and that is the only reason
   this change is safe. #heroTrack is align-items:stretch, so the deck's height is the TALLER

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN');
}
function pct(v, dp){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return (x >= 0 ? '+' : '') + x.toFixed(dp == null ? 2 : dp) + '%';
}
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';

}
function cls(v){ return v == null ? '' : (Number(v) >= 0 ? 'pos' : 'neg'); }
/* cc#907 — Indian short scale for the trio cells. ₹1,42,76,194 is 12 characters and does not
   fit a third of a phone; ₹1.43Cr is 7 and says the same thing at a glance. Two decimals keep
   a lakh readable to the nearest thousand. Below 1L the full figure already fits, so it stays
   exact. The PAYLOAD is untouched — this is display only, and /m/positions still shows every
   rupee (the card is explicit that the book maths must not move). */
function inrShort(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v), sign = x < 0 ? '−' : '', a = Math.abs(x);
  /* decimals shrink as the magnitude grows, so the STRING never does. Measuring the old version
     caught the case the eye misses: ₹100.00Cr is 9 characters and did not fit a 360px phone.
     With this ladder the widest possible output is 8 — "−₹99,999" or "−₹14.3Cr" — which fits
     every cell it is used in, at every viewport down to 320px. */
  if (a >= 1e7){
    var cr = a / 1e7;
    return sign + '₹' + (cr >= 100 ? Math.round(cr) : cr.toFixed(cr >= 10 ? 1 : 2)) + 'Cr';
  }
  if (a >= 1e5){
    var l = a / 1e5;
    return sign + '₹' + l.toFixed(l >= 10 ? 1 : 2) + 'L';
  }
  return sign + '₹' + Math.round(a).toLocaleString('en-IN');
}
/* ══ cc#1118 — THE DIWALI SWEEP ═══════════════════════════════════════════════════════════════
   The mood word lights up letter by letter, left to right, once. Founder-approved design: a glow
   and a small lift per letter, 60ms apart, about 0.6s end to end, one iteration.

   IT IS ADDITIVE, NEVER A REPAINT. The colour stays on .hero-mood as an inline style from
   moodColor(), and every letter inherits it — BEARISH stays red, BULLISH green, SIDEWAYS amber.
   The animation touches text-shadow and transform only, so a festive effect can never be mistaken
   for a different mood. That is the one thing this must not get wrong.

   ONCE PER PAGE LOAD, and this is the part that needed care rather than CSS. The hero is rebuilt
   from scratch on every data refresh, and a CSS animation on freshly-created nodes replays every
   single time — which turns a moment of delight into a twitch every poll. animation-iteration-count
   cannot help: each rebuild is new elements, not a new iteration. So the SWEEP CLASS ITSELF is
   emitted only on the first build, tracked here in a module flag. After that the same markup ships
   without it and the letters simply render.

   Spaces are NOT wrapped: a letter span is inline-block so it can be transformed, and an
   inline-block space collapses to nothing. A multi-word mood would lose its gap. */
/* cc#1132 · the cc#1118 sweep, re-run every 60 seconds while the card is on screen.
   NO NEW ANIMATION. The keyframes and the .mlt spans are cc#1118's and are not touched — the
   letters are simply asked to run the animation they already have again. Setting animation:none,
   forcing ONE reflow for the whole word (not one per letter), then clearing the inline value is
   what restarts a finished CSS animation; clearing it back to '' rather than re-declaring it also
   means the prefers-reduced-motion rule still wins, so a reader who asked for stillness keeps it
   and never gets a blink every minute.
   MOOD_SWEPT IS NOT RESET. It exists so only the FIRST mood word on the page sweeps; resetting it
   would start sweeping the second one too. This re-animates spans that already exist rather than
   rebuilding markup, so nothing about that guard — or the cc#1116/cc#1122 restyle fixes — is
   touched.
   BATTERY. The interval is CLEARED when the tab goes hidden and restarted when it comes back, not
   merely skipped inside the tick: a guarded tick still fires, and a backgrounded PWA should have
   no timer at all. On top of that each tick checks the word is actually in the viewport, so
   scrolling away stops the work too. */
/* cc#1135 · THE MOOD CYCLE. This REPLACES cc#1132 outright: MOOD_TIMER, its 60-second
   setInterval and the moodBlinkStart/moodBlinkStop pair are gone. There is no setInterval left on
   the mood path at all — the cycle is a chain of setTimeouts, so only one step is ever pending.
   THE CYCLE, from ref mood_anim_cycle_R4 (cc#1178 revises R3), looping while visible:
     1. SWEEP  every letter runs moodLite, staggered i*60ms left to right — the cc#1118 effect
     2. SLEEP  4 seconds, the word completely still

   seconds still. The founder removed the march on 21-Aug from a live phone render (28179) and
   shortened the still to four seconds. The second sweep went with the march — it existed to
   close the march, and two identical waves back to back with nothing between them would read as
   one stuttered wave, not as the glimpse the ruling asked to keep.
   Length is derived from the word, never hardcoded, so BULLISH, NEUTRAL and CAUTIOUS all work.
   NO NEW KEYFRAMES, in either direction. moodLite is the cc#1118 keyframe untouched; the only
   change cc#1135 made was moving the CSS declaration from .mlt to .mlt.run.
   NOT A REPAINT: this adds and removes a class and an inline animation-delay on spans that
   moodLetters() already rendered. The markup is never rebuilt, MOOD_SWEPT is never reset, and
   moodColor()'s inline colour is never read or written — so the cc#1116/cc#1122 restyle behaviour
   cannot be re-tripped. moodLite is transform and text-shadow only, so the word cannot move a
   pixel and the cc#1134 layout ruling is safe.
   ONE HANDLE, AND THAT IS THE WHOLE ANTI-STACKING GUARANTEE: every phase writes its pending step
   to MOOD_H and nothing else ever schedules. moodStop clears it; moodStart is the ONLY entry into
   the cycle and refuses whenever a handle already exists or the tab is hidden. A second driver
   cannot exist because there is exactly one entry point and it is gated by the same handle it
   sets, so repeated visibility flips can never leave two chains running. */
var MOOD_H = null;
function moodParts(){
  var host = document.querySelector('.hero-mood');
  if (!host) return null;
  var l = Array.prototype.slice.call(host.querySelectorAll('.mlt'));
  return l.length ? { host: host, l: l } : null;
}
function moodReset(m){
  for (var i = 0; i < m.l.length; i++){ m.l[i].classList.remove('run'); m.l[i].style.animationDelay = ''; }
  void m.host.offsetWidth;            /* ONE reflow on the host, not one per letter */
}
function moodOnScreen(m){
  var r = m.host.getBoundingClientRect();
  return !(r.bottom < 0 || r.top > (window.innerHeight || 0));

function moodSweep(m, done){
  moodReset(m);
  for (var i = 0; i < m.l.length; i++){
    /* cc#1178: back to the ref R3 stagger of 60ms, with the 420ms flash term below it. */
    m.l[i].style.animationDelay = (i * 60) + 'ms';
    m.l[i].classList.add('run');

     duration, plus a settle buffer — so the phase never waits longer than the wave it is waiting
     for. The 420 must track the .42s in MOBILE_CSS and the 60 must track the stagger on the line
     above; that is the whole reason it is written as a sum rather than as one number. The 150ms
     buffer is settle time, not part of the wave, and is unchanged. */
  MOOD_H = setTimeout(done, m.l.length * 60 + 420 + 150);
}
/* cc#1178: moodMarch is DELETED, not disabled and not left at a zero interval. The founder ruled
   from a live phone render (28179) that the per-letter blink goes, and a function still sitting
   here with no caller is the thing someone wires back up by accident six weeks from now. The
   cycle is now the glimpse and the still — there is no second phase, and the two back-to-back
   sweeps went with the march, because they only ever framed it. */
function moodSleep(m, done){ moodReset(m); MOOD_H = setTimeout(done, 4000); }
function moodCycle(){
  var m = moodParts();
  /* not painted yet, or scrolled away: idle-wait rather than killing the cycle */
  if (!m || !moodOnScreen(m)){ MOOD_H = setTimeout(moodCycle, 1000); return; }
  moodSweep(m, function(){ moodSleep(m, moodCycle); });

function moodStart(){
  if (MOOD_H || document.visibilityState === 'hidden') return;

function moodStop(){
  if (MOOD_H){ clearTimeout(MOOD_H); MOOD_H = null; }
  var m = moodParts();
  if (m) moodReset(m);               /* no animation state survives while hidden */
}
document.addEventListener('visibilitychange', function(){
  /* never resume mid-cycle: hidden tears everything down, visible starts again at the sweep */
  if (document.visibilityState === 'visible') moodStart(); else moodStop();
});

var MOOD_SWEPT = false;
function moodLetters(word){
  var w = String(word == null ? '--' : word);
  var sweep = !MOOD_SWEPT;
  MOOD_SWEPT = true;
  if (!sweep) return esc(w);
  var out = '', i = 0;
  for (var n = 0; n < w.length; n++){
    var ch = w.charAt(n);
    if (ch === ' '){ out += ' '; continue; }   /* keep real word spacing */
    /* esc() per CHARACTER, so an escaped entity can never be split down the middle. */
    /* The SECOND copy of the stagger, and the one that gets missed. This is the FIRST-PAINT sweep
       written straight into the markup; the driver's copy above only runs from the second sweep
       onward, so a value changed in one place and not the other shows up as a first wave that
       does not match every wave after it. cc#1178 moves it back to the ref R3 60ms with the
       driver. */
    out += '<span class="mlt" style="animation-delay:' + (i * 60) + 'ms">' + esc(ch) + '</span>';
    i++;

/* cc#908: a point label is a DATE on a daily series and a TIME on an intraday one. One helper
   decides, so the axis, the scrub readout and the tape charts can never disagree about it.
   'HH:MM' is passed through; 'YYYY-MM-DD' loses the year (slice(5)) as it always did. */
function dlab(d){
  d = String(d == null ? '' : d);

function trendSvg(series, kind){
  var W = 320, H = 110, PL = 6, PR = 6, PT = 8, PB = 18;
  var vs = series.map(function(p){ return p.v; });

    + '<circle cx="' + xs(n - 1).toFixed(1) + '" cy="' + ys(last).toFixed(1) + '" r="2.6" fill="var(--blu,#4D7CFE)"/>'
