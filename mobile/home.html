<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">

<style>
/* cc#900 (founder 08-Aug): the tape lost its look when this page's CSS moved to the shared
   sheet (cc#893 item 3). The ticker's own styling now lives HERE, scoped to this page, so a
   shared-CSS change can never restyle the tape again. Design restored = the original pill:
   SYMBOL + %CHANGE only (founder: "symbol and change") — the price column is dropped; the
   tape reads direction at a glance, exact levels live in the cards below. Marquee behaviour
   (cc#896 batch 3: doubled track, -50% seamless loop, hold to pause) unchanged. */
.tkr{overflow:hidden;padding:8px 0;margin:0 -12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tkr-track{display:flex;gap:8px;width:max-content;padding:0 12px;animation:tkrMove var(--tkr-dur,40s) linear infinite}
.tkr:active .tkr-track,.tkr:hover .tkr-track{animation-play-state:paused}
@keyframes tkrMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tkr-track{animation:none}.tkr{overflow-x:auto}}
.tk{flex:none;display:flex;align-items:baseline;gap:6px;padding:4px 9px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line)}
.tk .n{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.tk .d{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:700;white-space:nowrap}
/* cc#902 — the scrub readout. .trendhd holds two spans: the title on the left and the live
   value/date on the right, which updates under the finger. Only the SECOND grows; the title
   stays small so the header does not turn into two competing headlines. Scoped here rather than
   in the shared sheet because .trendhd renders on this page only. */
.trendhd span:last-child{font-size:15px;font-weight:800;color:var(--txt,#E9EEFB);letter-spacing:0}
/* cc#905 range pills */
.rgs{display:flex;gap:6px;margin:6px 0 8px}
.rg{flex:1;min-height:32px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;
  font-weight:800;letter-spacing:.06em;color:var(--mut);background:var(--panel);
  border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.rg.on{color:var(--blu,#4D7CFE);border-color:rgba(77,124,254,.5);background:rgba(77,124,254,.12)}
/* cc#904 full-screen Market Tape overlay */
.tpo{position:fixed;inset:0;z-index:60;background:var(--bg,#0A0F1E);display:none;
  flex-direction:column;overscroll-behavior:contain}
.tpo.open{display:flex}
.tpo-hd{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.tpo-hd h2{font-size:17px;font-weight:800;flex:1}
.tpo-x{min-width:44px;min-height:44px;font-size:20px;color:var(--mut);background:none;
  border:0;cursor:pointer;font-family:inherit}
.tpo-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 24px}
.tpr{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line);min-height:52px}
.tpr .nm2{flex:1;min-width:0}
.tpr .s1{font-size:13.5px;font-weight:800}
.tpr .s2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;color:var(--dim);margin-top:2px}
.tpr .lv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:700;text-align:right}
.tpr .cg{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:800;
  text-align:right;min-width:64px}
.tpc{min-width:44px;min-height:44px;background:none;border:0;color:var(--blu,#4D7CFE);
  font-size:15px;cursor:pointer;font-family:inherit}
.tpchart{padding:2px 2px 12px}
</style>
</head>

<div class="screen">
  <div class="head" style="display:flex;align-items:center;justify-content:space-between">
    <h1>Sc<span style="color:var(--grn)">o</span>rr</h1>
    <div class="s" id="sess">loading…</div>
  </div>

  <div class="body" id="body"><div class="loading">Loading your dashboard…</div></div>
</div>

<nav class="bnav">

  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>

<!-- cc#904: the full tape as a table. The marquee shows direction at a glance; this answers
     "what exactly, and as of when". Hidden until the tape is tapped. -->
<div class="tpo" id="tapeov">
  <div class="tpo-hd"><h2>Market Tape</h2>
    <button class="tpo-x" onclick="closeTape()" aria-label="Close">&#10005;</button></div>
  <div class="tpo-bd" id="tapebd"></div>
</div>

<script>
var TREND = { open: null };   /* which chip popup is open: 'adr' | 'pcr' | 'vix' */

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN');
}
function pct(v, dp){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return (x >= 0 ? '+' : '') + x.toFixed(dp == null ? 2 : dp) + '%';
}
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x < 0 ? '\u2212' : '') + 'Rs.' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
function cls(v){ return v == null ? '' : (Number(v) >= 0 ? 'pos' : 'neg'); }
function moodColor(m){
  m = (m || '').toLowerCase();
  if (m.indexOf('bullish') > -1) return 'var(--grn)';
  if (m.indexOf('bearish') > -1) return 'var(--red)';
  return 'var(--amber)';
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(r.state) + '</span>';
}
/* ── chip trend popup: SVG LINE CHART (website chart style) from /api/mobile/trends ─────────
   founder 08-Aug: the cc#894 pickers guessed other endpoints' JSON keys and rendered "--";
   the new endpoint returns ONE shape ({series:[{d,v}]}) so nothing is guessed, and the popup
   draws a real chart instead of text rows. */
var TRENDS = {
  adr: { title: 'ADR' },
  pcr: { title: 'NIFTY PCR' },
  vix: { title: 'INDIA VIX' }
};
function trendSvg(series, kind){
  var W = 320, H = 110, PL = 6, PR = 6, PT = 8, PB = 18;
  var vs = series.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var rng = (hi - lo) || 1;
  var n = series.length;
  var xs = function(i){ return PL + (n === 1 ? 0 : i / (n - 1) * (W - PL - PR)); };
  var ys = function(v){ return PT + (1 - (v - lo) / rng) * (H - PT - PB); };
  var pts = series.map(function(p, i){ return xs(i).toFixed(1) + ',' + ys(p.v).toFixed(1); }).join(' ');
  var area = PL + ',' + (H - PB) + ' ' + pts + ' ' + xs(n - 1).toFixed(1) + ',' + (H - PB);
  var d0 = series[0].d.slice(5), d1 = series[n - 1].d.slice(5);
  var last = series[n - 1].v;
  return '<svg id="tsvg_' + kind + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;display:block;touch-action:none">'
    + '<polygon points="' + area + '" fill="rgba(77,124,254,.14)"/>'
    + '<polyline points="' + pts + '" fill="none" stroke="var(--blu,#4D7CFE)" stroke-width="1.6"/>'
    + '<circle cx="' + xs(n - 1).toFixed(1) + '" cy="' + ys(last).toFixed(1) + '" r="2.6" fill="var(--blu,#4D7CFE)"/>'
    + '<line id="tcx_' + kind + '" x1="0" y1="' + PT + '" x2="0" y2="' + (H - PB) + '" stroke="var(--amber,#F5B94A)" stroke-width="1" stroke-dasharray="3 2" style="display:none"/>'
    + '<circle id="tcd_' + kind + '" r="3.2" fill="var(--amber,#F5B94A)" style="display:none"/>'
    + '<text x="' + PL + '" y="' + (H - 5) + '" font-size="10" fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(d0) + '</text>'
    + '<text x="' + (W - PR) + '" y="' + (H - 5) + '" text-anchor="end" font-size="10" fill="var(--dim,#5E6B8F)" font-family="IBM Plex Mono,monospace">' + esc(d1) + '</text>'
    + '</svg>';
}
/* founder 08-Aug batch 3: finger scrub — drag inside the chart moves a crosshair and the header
   readout shows THAT day's value + date. touch-action:none keeps the page from scrolling while
   scrubbing; lifting the finger restores the latest reading. */
function wireScrub(kind, series){
  var svg = document.getElementById('tsvg_' + kind);
  var hd  = document.getElementById('trd_' + kind);
  if (!svg || !series.length) return;
  var W = 320, PL = 6, PR = 6, PT = 8, PB = 18, H = 110;
  var vs = series.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  var rng = (hi - lo) || 1, n = series.length;
  var cx = document.getElementById('tcx_' + kind), cd = document.getElementById('tcd_' + kind);
  function latest(){ var l = series[n - 1]; if (hd) hd.textContent = Number(l.v).toFixed(2) + ' \u00b7 ' + l.d.slice(5); }
  function show(clientX){
    var r = svg.getBoundingClientRect();
    var fx = (clientX - r.left) / r.width * W;
    var i = Math.round((fx - PL) / ((W - PL - PR) / (n - 1 || 1)));
    i = Math.max(0, Math.min(n - 1, i));
    var p = series[i];
    var X = PL + i / (n - 1 || 1) * (W - PL - PR);
    var Y = PT + (1 - (p.v - lo) / rng) * (H - PT - PB);
    cx.setAttribute('x1', X); cx.setAttribute('x2', X); cx.style.display = 'block';
    cd.setAttribute('cx', X); cd.setAttribute('cy', Y); cd.style.display = 'block';
    if (hd) hd.textContent = Number(p.v).toFixed(2) + ' \u00b7 ' + p.d.slice(5);
  }
  function hide(){ cx.style.display = 'none'; cd.style.display = 'none'; latest(); }
  svg.addEventListener('touchstart', function(e){ if (e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
  svg.addEventListener('touchmove',  function(e){ if (e.touches[0]) show(e.touches[0].clientX); }, {passive:true});
  svg.addEventListener('touchend', hide);
  svg.addEventListener('mousemove', function(e){ show(e.clientX); });
  svg.addEventListener('mouseleave', hide);
}
/* ── cc#904: MARKET TAPE overlay ───────────────────────────────────────────────────────────
   Tapping the marquee opens every tape symbol as a table: name, last, change %, and the date
   the number is actually from. The tape itself can only show a value; a five-day-old Nikkei
   print looks exactly like this morning's until something states the date.

   has_series comes from the SERVER (mobile_home2), computed from real data: /api/global/history
   reads global_indices, and NIFTY/BANKNIFTY are not in that table, so those two rows carry no
   chart button. The card's rule — never a dead button — is enforced where the truth is known,
   not guessed in the template.

   /api/global/history/{name} returns a FLAT LIST of global_indices rows
   [{name,symbol,category,price,prev_close,chg_pct,quote_date}] — NOT the {series:[{d,v}]} shape
   /api/mobile/trends uses. Verified by reading gvm_market_endpoints.py before writing this, per
   the card. The map to trendSvg's {d,v} is done here, once. */
var TAPE = { rows: [], open: {} };

function openTape(){
  var ov = document.getElementById('tapeov');
  if (!ov) return;
  renderTape();
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';   // lock the page behind the overlay
}
function closeTape(){
  var ov = document.getElementById('tapeov');
  if (ov) ov.classList.remove('open');
  document.body.style.overflow = '';
  TAPE.open = {};
}
function tapeRow(x, i){
  var chart = x.has_series
    ? '<button class="tpc" onclick="tapeChart(' + i + ')" aria-label="chart">' +
      (TAPE.open[i] ? '\u2715' : '\u2197') + '</button>'
    : '<span class="tpc" style="color:transparent">\u00b7</span>';
  return '<div class="tpr">'
    + '<span class="nm2"><div class="s1">' + esc(x.name) + '</div>'
    + '<div class="s2">' + (x.live ? 'live' : esc(x.as_of || '--')) + '</div></span>'
    + '<span class="lv">' + px(x.price) + '</span>'
    + '<span class="cg ' + cls(x.chg_pct) + '">' + pct(x.chg_pct) + '</span>'
    + chart + '</div>'
    + (TAPE.open[i] ? '<div class="tpchart" id="tpc_' + i + '"><div class="loading">Loading\u2026</div></div>' : '');
}
function renderTape(){
  document.getElementById('tapebd').innerHTML = TAPE.rows.map(tapeRow).join('')
    || '<div class="empty"><b>No tape data</b></div>';
}
function tapeChart(i){
  var x = TAPE.rows[i];
  if (!x || !x.has_series) return;
  if (TAPE.open[i]){ TAPE.open[i] = 0; renderTape(); return; }
  TAPE.open[i] = 1; renderTape();
  fetchWithTimeout('/api/global/history/' + encodeURIComponent(x.name) + '?days=15')
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var host = document.getElementById('tpc_' + i);
      if (!host || !TAPE.open[i]) return;
      /* flat global_indices rows -> trendSvg's {d,v}. price/quote_date are the real column
         names, read off the endpoint rather than assumed. */
      var series = (Array.isArray(rows) ? rows : []).filter(function(r){
        return r && r.price != null && r.quote_date;
      }).map(function(r){ return { d: String(r.quote_date), v: Number(r.price) }; });
      host.innerHTML = series.length > 1
        ? trendSvg(series, 'tp' + i)
        : '<div class="sum">Not enough history for ' + esc(x.name) + '.</div>';
    })
    .catch(function(e){
      var host = document.getElementById('tpc_' + i);
      if (host) host.innerHTML = '<div class="sum">Chart failed: ' + esc(e.message) + '</div>';
    });
}

/* ── cc#905: range selector. 1D | 7D | 15D | 30D, default 15D, remembered per kind for the
   session (no storage — a range that outlives the visit is one the founder forgets he set).
   ON 1D: /api/mobile/trends clamps days to max(2, ...), and I did NOT lower that clamp — a
   one-point "chart" is a dot, and a flat line drawn through one value would be a fabricated
   shape. 1D therefore requests days=2 and draws the real last-two-prints line, which is exactly
   the move the founder is asking about. The pill row states the window; the chart never pretends
   to more resolution than the daily source has. */
var TREND_RANGE = { adr: 15, pcr: 15, vix: 15 };
var RANGES = [[1, '1D'], [7, '7D'], [15, '15D'], [30, '30D']];

function setTrendRange(ev, kind, days){
  if (ev) ev.stopPropagation();
  TREND_RANGE[kind] = days;
  drawTrend(kind);
}
function rangePills(kind){
  var cur = TREND_RANGE[kind];
  return '<div class="rgs">' + RANGES.map(function(r){
    return '<button class="rg' + (r[0] === cur ? ' on' : '') + '"'
      + ' onclick="setTrendRange(event,\'' + kind + '\',' + r[0] + ')">' + r[1] + '</button>';
  }).join('') + '</div>';
}

function drawTrend(kind){
  var el = document.getElementById('chiptrend');
  if (!el) return;
  var t = TRENDS[kind];
  var want = TREND_RANGE[kind];
  var days = want === 1 ? 2 : want;   // see the 1D note above
  el.innerHTML = '<div class="loading" style="padding:6px 0 0">Loading ' + kind.toUpperCase() + ' trend\u2026</div>';
  fetchWithTimeout('/api/mobile/trends?kind=' + kind + '&days=' + days)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (TREND.open !== kind) return;
      var s = (d && d.series) || [];
      if (s.length < 2){
        el.innerHTML = '<div class="trendbox"><div class="trendhd"><span>' + t.title + '</span></div>'
          + rangePills(kind)
          + '<div class="sum" style="padding:6px 0 0">Not enough ' + kind.toUpperCase()
          + ' history for this window.</div></div>';
        return;
      }
      var last = s[s.length - 1];
      el.innerHTML = '<div class="trendbox"><div class="trendhd"><span>' + t.title + '</span>'
        + '<span id="trd_' + kind + '">' + esc(Number(last.v).toFixed(2)) + ' \u00b7 ' + esc(last.d.slice(5)) + '</span></div>'
        + rangePills(kind)
        + trendSvg(s, kind) + '</div>';
      wireScrub(kind, s);   // rebound on every redraw — a new SVG needs a new binding
    })
    .catch(function(e){
      if (TREND.open !== kind) return;
      el.innerHTML = '<div class="sum" style="padding:6px 0 0">' + kind.toUpperCase() + ' trend failed: ' + esc(e.message) + '</div>';
    });
}

function togTrend(ev, kind){
  if (ev) ev.stopPropagation();
  var el = document.getElementById('chiptrend');
  if (!el) return;
  if (TREND.open === kind){ TREND.open = null; el.innerHTML = ''; return; }
  TREND.open = kind;
  drawTrend(kind);
}

fetchWithTimeout('/api/mobile/home2').then(function(r){ return r.json(); }).then(function(d){
  if (d.error) throw new Error(d.error);

  document.getElementById('sess').textContent = d.session.label;

  var h = '';

  /* 0 · TICKER BAR — MOVING marquee. cc#900: each item is SYMBOL + %CHANGE only (founder:
     previous design was better) — the price span is gone; the pill styling is scoped in this
     page's own <style> so shared-CSS changes can never restyle the tape. */
  var tkItems = (d.ticker || []).map(function(x){
      return '<div class="tk"><span class="n">' + esc(x.name) + '</span>'
        + '<span class="d ' + cls(x.chg_pct) + '">' + pct(x.chg_pct) + '</span></div>';
    }).join('');
  // cc#901: duration halved = speed doubled. The floor halves with it (20s -> 10s) so a short
  // tape stays proportional instead of hitting the floor and running slower than a long one.
  var tkDur = Math.max(10, (d.ticker || []).length * 1.3);
  // cc#904: the tape is now a doorway. Hold-to-pause still works — a tap and a hold are
  // different gestures, and the pause is CSS (:active), not JS, so the two cannot fight.
  TAPE.rows = d.ticker || [];
  h += '<div class="tkr" onclick="openTape()" style="--tkr-dur:' + tkDur + 's;cursor:pointer">'
    + '<div class="tkr-track">' + tkItems + tkItems + '</div></div>';

  /* 1 · HERO — the market today; V10 index line; ADR/PCR/VIX chips open charts */
  var hero = d.hero || {};
  var v10 = (hero.v10 || []).map(function(x){ return '<b>' + esc(x.name) + ' ' + esc(x.state) + '</b>'; }).join(' \u00b7 ');
  h += '<div class="c"><div class="chd"><div class="t">The market today</div>'
    + '<div class="rgt">' + esc(hero.as_of || '') + '</div></div>'
    + '<div class="hero-mood" style="color:' + moodColor(hero.mood) + '">' + esc(hero.mood || '--') + '</div>'
    + '<div class="hero-why">' + esc(hero.why || '') + '</div>'
    + (v10 ? '<div class="v10line">V10: ' + v10 + '</div>' : '')
    + '<div class="hchips">' + (hero.chips || []).map(function(c){
        var k = c.indeterminate ? '' : (c.ok ? ' ok' : ' bad');
        var isAdr = String(c.label).indexOf('ADR') > -1;
        var val = (c.value == null) ? '--'
                : (isAdr ? Number(c.value).toFixed(2) : pct(c.value));
        return '<button class="hc' + k + (isAdr ? ' tap" onclick="togTrend(event,\'adr\')"' : '"') + '>'
          + esc(c.label) + ' ' + esc(val) + '</button>';
      }).join('')
    /* founder 08-Aug batch 3: PCR/VIX chips carry colour. PCR >= 1.0 = puts heavy = supportive
       (green), < 1.0 = red. VIX <= 14 = calm (green), >= 17 = elevated (red), between = neutral.
       Null stays uncoloured -- with no invented band. */
    + '<button class="hc tap' + (hero.pcr == null ? '' : (Number(hero.pcr) >= 1 ? ' ok' : ' bad'))
    + '" onclick="togTrend(event,\'pcr\')">PCR ' + (hero.pcr == null ? '--' : esc(Number(hero.pcr).toFixed(2))) + '</button>'
    + '<button class="hc tap' + (hero.vix == null ? '' : (Number(hero.vix) <= 14 ? ' ok' : (Number(hero.vix) >= 17 ? ' bad' : '')))
    + '" onclick="togTrend(event,\'vix\')">VIX ' + (hero.vix == null ? '--' : esc(Number(hero.vix).toFixed(1))) + '</button>'
    + '</div><div id="chiptrend"></div>'
    + '</div>';

  /* 2 · V8 OPEN BOOK — unrealised split with % of capital deployed (founder 08-Aug) */
  var bk = d.book || {};
  function trioCell(k, o, totPct, totVal){
    /* total cell passes its own value/pct; side cells pass their object */
    var v = (o == null) ? totVal : o.unrealised;
    var p = (o == null) ? totPct : o.pct;
    return '<div class="st"><div class="k">' + k + '</div>'
      + '<div class="v ' + cls(v) + '">' + inr(v) + '</div>'
      + '<div class="p ' + cls(p) + '">' + (p == null ? '--' : pct(p)) + '</div></div>';
  }
  h += '<div class="sect">THE BOOK</div>'
    + '<a class="card-link" href="/m/positions"><div class="c"><div class="chd"><div class="t">V8 Open Book</div>'
    + '<div class="rgt">' + (bk.open || 0) + ' positions <span class="h-chev">\u203a</span></div></div>'
    + '<div class="trio">'
    + trioCell('Unrealised', null, bk.unrealised_pct, bk.unrealised)
    + trioCell('Long Unrl', bk.long || {})
    + trioCell('Short Unrl', bk.short || {})
    + '</div>'
    + '<div class="sum" style="margin-top:7px">% on capital deployed per side.</div>'
    + '</div></a>';

  /* 3 · MY PORTFOLIO */
  var pf = d.portfolio || {};
  h += '<div class="sect">MY PORTFOLIO</div>'
    + '<a class="card-link" href="/m/holdings"><div class="c"><div class="chd"><div class="t">My Portfolio</div>'
    + '<div class="rgt">' + (pf.empty ? '' : '<span class="' + cls(pf.mtm) + '">' + inr(pf.mtm) + '</span> ')
    + railHtml(pf.rail) + ' <span class="h-chev">\u203a</span></div></div>'
    + (pf.empty
        ? '<div class="sum" style="padding:8px 0">' + esc(pf.message || 'No positions open.') + '</div>'
        : (pf.rows || []).map(function(r){
            return '<div class="row"><div class="l"><div class="sym">' + esc(r.symbol) + '</div>'
              + '<div class="sub">' + esc(r.direction) + ' ' + (r.qty == null ? '--' : Number(r.qty).toLocaleString('en-IN')) + '</div></div>'
              + '<div class="r"><div class="pv">' + px(r.ltp) + '</div>'
              + '<div class="pc ' + cls(r.mtm) + '">' + inr(r.mtm) + '</div></div></div>';
          }).join(''))
    + '</div></a>';

  /* 4 · LIVE NEWS — scrollable; Intel has its own nav slot (founder 08-Aug).
         Results Corner card removed: covered by the Results tile in the grid. */
  var rd = d.reading || {};
  h += '<div class="sect">LIVE NEWS</div>'
    + '<a class="card-link" href="/m/intel"><div class="c"><div class="chd"><div class="t">Live News</div>'
    + '<div class="rgt">' + (rd.count_24h || 0) + ' stories today <span class="h-chev">\u203a</span></div></div>'
    + '<div class="newsbox">'
    + ((rd.items || []).map(function(n){
        var edt = n.category === 'AI Editorial';
        return '<div class="news"><div class="h">' + esc(n.headline) + '</div>'
          + '<div class="m">' + (edt ? '<span class="tag edt">EDITORIAL</span>' : esc(n.category || ''))
          + (n.when ? ' ' + esc(n.when) : '') + '</div></div>';
      }).join('') || '<div class="sum" style="padding:8px 0">Nothing new in the last day.</div>')
    + '</div></div></a>';

  /* 5 · TOOLS — 9 tiles, zero overlap with the six-slot nav (founder 08-Aug) */
  h += '<div class="sect">TOOLS</div>';
  document.getElementById('body').innerHTML = h;

  var tools = document.createElement('div');
  tools.className = 'tools';
  tools.innerHTML =
      '<a class="tool" href="/m/qb"><span>\u25a6</span>Baskets</a>'
    + '<a class="tool" href="/m/screeners"><span>\u2637</span>Screeners</a>'
    + '<a class="tool" href="/m/sector"><span>\u2b21</span>Sector Intel</a>'
    + '<a class="tool" href="/m/results"><span>\u2263</span>Results</a>'
    + '<a class="tool" href="/m/digest"><span>\u2600</span>Digest</a>'
    + '<a class="tool" href="/m/fpc"><span>\u20b9</span>FPC</a>'
    + '<a class="tool" href="/dashboard"><span>\u26a1</span>Dashboard</a>'
    + '<a class="tool" href="/cio"><span>\u2299</span>AICIO</a>'
    + '<a class="tool" href="/health"><span>\u2695</span>Portfolio Health</a>'
    // cc#897: 9 -> 12 tiles. All three open WEB pages, the same 16915 exception the founder
    // already approved for Dashboard / AICIO / Portfolio Health above.
    // The Index Intel hash was VERIFIED against the dashboard's own router, not assumed: the card
    // proposed #indexintel, but v8_dashboard.html line ~4995 reads
    // TABS=['index','v14','tcscan','bt'] and falls back to the Master pane on any unknown hash.
    // #indexintel would therefore have opened Master silently and looked like a working link.
    + '<a class="tool" href="/dashboard#index"><span>\u25d0</span>Index Intel</a>'
    + '<a class="tool" href="/v9"><span>\u21c4</span>V9 Pairs</a>'
    + '<a class="tool" href="/v15"><span>\u25c9</span>V15 MF</a>'
    // cc#897 second pass: 12 -> 14. Routes taken from model_registry, not guessed \u2014 V10 is /v10
    // and V14 Intraday is /intraday there. Both open web pages, same 16915 exception as above.
    + '<a class="tool" href="/v10"><span>\u25d1</span>V10</a>'
    + '<a class="tool" href="/intraday"><span>\u25f4</span>V14 Intraday</a>';
  document.getElementById('body').appendChild(tools);
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>' + esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sess').textContent = 'failed to load';
});
</script>
</body>
</html>
