/* ══ cc#929: RAW LIVE NEWS — the web tab's own feed, verbatim ══════════════════════════════
   Endpoint, params, grouping, ordering and the relative-time wording are all copied from
   v8_dashboard.html so the phone shows the same rows as /dashboard at the same instant.
   NO TAGS: the row is headline + source + time, nothing else — which is also exactly what the
   web row carries (it never had category chips; the polished feed did).
   NO OUTBOUND LINKS: raw_news rows have their own source URLs and none of them are rendered.
   The whole card is an in-app link to /m/intel. A per-story deep anchor is NOT possible — Intel
   renders POLISHED articles keyed to v_polished_articles, and a raw_news row has no polished
   counterpart to anchor to — so every headline goes to plain /m/intel, as the card allows. */
function rnAgo(ts){
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'just now';
  var m = Math.floor(s / 60); if (m < 60) return m + ' min ago';
  var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
/* ══ cc#971 — PREV/NEXT PAGING ═══════════════════════════════════════════════════════════════
   Six at a time, flipped in place. The inner scroller stays dead — that was cc#966's whole point,
   and paging is the way to reach more headlines without bringing it back.

   HEIGHT IS RESERVED FOR SIX ROWS. Without it the last page (which usually holds fewer than six)
   would collapse the section and yank the Tools grid up the screen the moment you reached it —
   the control you just tapped would move out from under your thumb. min-height on the list keeps
   every page the same size. */
var RN = { items: [], page: 0, per: 6, mode: 'polish', raw: [], polish: [] };

/* ── cc#1092: the two feeds, and which endpoints they are ────────────────────────────────────
   Both already existed; the card asked me to check before inventing one, and neither was missing.
     RAW    -> /api/news/live?hours=48&per_cat=300   (raw_news, the same call the web tab makes)
     POLISH -> /api/news/polished?category=all&limit=100  (v_polished_articles, the same body the
               Intel page renders, so a peek and the full page cannot disagree)
   No new endpoint was added. */
function nwSetMode(m){
  if (RN.mode === m) return;
  RN.mode = m;
  RN.items = (m === 'polish') ? RN.polish : RN.raw;
  RN.page = 0;
  rnPaint();
}

function rnPages(){ return Math.max(1, Math.ceil(RN.items.length / RN.per)); }

/* cc#981: the paging controls live INSIDE the card's <a href="/m/intel"> wrapper (cc#929 made the
   whole card a doorway to Intel, and cc#971 injected these buttons into #rnBox). So a tap on Next
   flipped the page AND then bubbled to the anchor, which navigated away — the page turned and you
   never saw it. The controls now swallow their own event. The anchor STAYS: a tap on a headline or
   the header must still open Intel, which is the founder-approved doorway. Same bug class as
   cc#329 (scorr_home) and cc#911 (My Portfolio). */
function rnGo(ev, delta){
  if (ev){
    if (ev.preventDefault) ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
  }
  var last = rnPages() - 1;
  var next = Math.min(last, Math.max(0, RN.page + delta));
  if (next === RN.page) return;
  RN.page = next;
  rnPaint();
}

/* ── cc#1062: swipe left = next page, swipe right = prev ────────────────────────────────────
   Bound ONCE to #rnBox, which survives every rnPaint() (only its innerHTML is replaced), so the
   listeners cannot be lost on a page turn or multiplied by a re-render.

   THE ANGLE TEST IS WHAT PROTECTS THE SCROLL. touchmove stays passive:true — this handler never
   calls preventDefault while the finger is moving, so a vertical flick scrolls the page exactly
   as it does today. The horizontal/vertical decision is made once, at touchend, from the totals:
   a gesture counts as a swipe only if it travelled >50px across AND more than twice as far
   across as it did down. Anything else is left alone entirely.

   THE CARD IS WRAPPED IN <a href="/m/intel">, which is the same trap cc#971 hit with the Next
   button: a gesture that ends inside the anchor navigates away and the page turn is never seen.
   So a recognised swipe swallows its own touchend AND the synthetic click that follows it, via a
   CAPTURE-phase listener that runs before the anchor. Buttons are untouched — swipe is an
   addition, per the card.

   Paging itself goes through rnGo(), so the edges need no special case: it already clamps to
   [0, last] and returns early when the page would not change. Page 1 right and last page left
   are no-ops for free, and can never drift from what the buttons do. */
var RN_SW = { x:0, y:0, armed:false, just:false };

function rnBindSwipe(){
  var box = document.getElementById('rnBox');
  if (!box || box._rnSwipeBound) return;
  box._rnSwipeBound = true;

  box.addEventListener('touchstart', function(e){
    if (!e.touches || e.touches.length !== 1){ RN_SW.armed = false; return; }
    RN_SW.x = e.touches[0].clientX; RN_SW.y = e.touches[0].clientY; RN_SW.armed = true;
  }, { passive:true });

  box.addEventListener('touchmove', function(e){
    // Multi-touch (pinch/zoom) is never a page swipe. Nothing else happens here on purpose:
    // staying passive is what keeps vertical scrolling native.
    if (e.touches && e.touches.length > 1) RN_SW.armed = false;
  }, { passive:true });

  box.addEventListener('touchend', function(e){
    if (!RN_SW.armed) return;
    RN_SW.armed = false;
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var dx = t.clientX - RN_SW.x, dy = t.clientY - RN_SW.y;
    if (Math.abs(dx) < 50 || Math.abs(dx) <= 2 * Math.abs(dy)) return;   // not horizontal enough
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    RN_SW.just = true;
    setTimeout(function(){ RN_SW.just = false; }, 400);   // covers the synthetic click
    rnGo(null, dx < 0 ? 1 : -1);                          // left = next, right = prev
  }, { passive:false });

  // Capture phase: this must beat the <a class="card-link"> the whole card sits inside.
  box.addEventListener('click', function(e){
    if (!RN_SW.just) return;
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
  }, true);
}

/* cc#1120: the five labels are the ONLY values polished_news.category holds — verified against
   the live table: Domestic 2198, Global 1017, AI Editorial 535, IPO 238, Stock Views 5. Nothing is
   invented here and nothing is mapped to a category the data does not contain. The short forms
   exist because "AI Editorial" and "Stock Views" do not fit a 48px row beside a timestamp at
   360px; anything unrecognised falls through to its own text rather than to a guess. */
var RN_CAT_SHORT = {'AI Editorial':'AI', 'Domestic':'IND', 'Global':'GLB',
                    'IPO':'IPO', 'Stock Views':'VIEW'};
/* cc#1129: the map now lives in scorr_news_row.js, which /m/digest uses too, so the two screens
   cannot label the same category differently. The local copy above is kept only as the fallback
   for a failed asset load — deleting it would trade one shared component for one blank tag. */
function rnCatShort(c){
  return window.ScorrNewsRow ? ScorrNewsRow.catShort(c) : (RN_CAT_SHORT[c] || String(c || ''));
}

function rnPaint(){
  var box = document.getElementById('rnBox');
  if (!box) return;
  /* cc#1129: the shared row's stylesheet is injected once, here, because that is where its
     classes first reach the DOM. It defines only .nrow and its children, so the one class this
     page borrows (.nrdot) arrives without touching anything .nwrow already owns. */
  if (window.ScorrNewsRow) ScorrNewsRow.injectCss();
  /* cc#1092: tabs are painted BEFORE the empty guard. Painting them after the early return meant
     an empty tab rendered no switch at all — POLISH with zero articles would have stranded the
     reader on a blank card with no way back to RAW. The switch must outlive its own contents. */
  nwPaintTabs();
  if (!RN.items.length){
    box.innerHTML = '<div class="sum" style="padding:8px 0">No '
      + (RN.mode === 'polish' ? 'polished articles' : 'headlines') + ' in the last 48 hours.</div>';
    return;
  }
  var pages = rnPages(), p = RN.page;
  var slice = RN.items.slice(p * RN.per, p * RN.per + RN.per);
  /* cc#1092: whole row is a <button> — a real 44px tap target with keyboard focus for free,
     rather than a div with an onclick that a screen reader cannot see. The chevron announces. */
  var rows = slice.map(function(n, i){
    var idx = p * RN.per + i;
    /* cc#1120 · THE CHEVRON BOX BECOMES THE CATEGORY.
       It was a bare U+2304 in a clipped box — a permanent per-row ornament carrying no
       information, on a row that already had a category the mapping was discarding. The tag takes
       the SAME SLOT at the same size, so the row geometry is unchanged and the headline keeps
       exactly the width it had.
       RAW rows keep the chevron. Raw headlines are unprocessed and carry no category; inventing
       one would be a fabricated label, and an empty tag would be worse than the ornament.
       TAPPABILITY is not lost with the chevron: .nwrow is a real <button> with cursor:pointer and
       a focus ring, and the tag itself reads as a control-sized chip. A row that looks like a row
       and behaves like a button is the same affordance the RAW rows have always had. */
    var tag = n.polished && n.category
      ? '<span class="nwcat">' + esc(rnCatShort(n.category)) + '</span>'
      : '<span class="nwchev">\u2304</span>';
    /* cc#1129 · ALIGNED TO THE SHARED ROW, NOT REPLACED BY IT. This row already carried both
       things the card asks for — the cc#1120 category tag and a time-ago — so the only thing
       missing was the sentiment dot the digest rows have. It is added using the SHARED component's
       .nrdot classes and its sentiment vocabulary, so "Bullish" and "positive" resolve to one
       colour in one place across both screens instead of two normalisations drifting apart.
       The row STAYS a <button> with nwOpen(): it lives inside a swipeable paginated card
       (cc#1062 binding, cc#1092 tabs), which the digest's plain list does not. Swapping in the
       digest's markup wholesale would rewrite the tap target, the swipe capture and the pager —
       all three named in this card's do_not_touch. Extend, do not rewrite. */
    var dot = window.ScorrNewsRow
      ? '<span class="nrdot ' + ScorrNewsRow.sentiClass(n.sentiment) + '"></span>' : '';
    return '<button type="button" class="nwrow" onclick="nwOpen(' + idx + ')">'
      + dot
      + '<span class="h">' + esc(n.headline) + '</span>'
      + '<span class="t">' + esc(rnAgo(n.published_at) || '') + '</span>'
      + tag + '</button>';
  }).join('');
  /* cc#1204 item 2: the last page is padded to six so the card cannot shrink on it. Without this
     the height lock holds every FULL page at the same height and the final page - which is the one
     with fewer items - still collapses, moving the pager exactly where the founder saw it move. */
  for (var _pad = slice.length; _pad < RN.per; _pad++)
    rows += '<div class="nwrow nwpad" aria-hidden="true"></div>';
  /* the whole control row is one flex line: Prev, the page counter, Next. Disabled ends are
     rendered disabled rather than hidden, so the row never changes width mid-session. */
  var ctl = '<div class="rnpg" onclick="event.preventDefault();event.stopPropagation()">'
    + '<button class="rnb" onclick="rnGo(event,-1)"' + (p === 0 ? ' disabled' : '') + '>‹ Prev</button>'
    + '<span class="rnp">' + (p + 1) + ' / ' + pages + '</span>'
    + '<button class="rnb" onclick="rnGo(event,1)"' + (p >= pages - 1 ? ' disabled' : '') + '>Next ›</button>'
    + '</div>';
  box.innerHTML = '<div class="rnlist">' + rows + '</div>' + ctl;
  nwPaintTabs();
}

function nwPaintTabs(){
  var el = document.getElementById('nwTabs');
  if (!el) return;
  function tab(mode, label, n){
    return '<button type="button" class="nwtab' + (RN.mode === mode ? ' on' : '') + '"'
      + ' onclick="nwSetMode(\'' + mode + '\')">' + label
      + '<small>' + n + '</small></button>';
  }
  el.innerHTML = '<div class="nwtabs">' + tab('polish', 'POLISH', RN.polish.length)
    + tab('raw', 'RAW', RN.raw.length) + '</div>';
}

function loadRawNews(){
  var box = document.getElementById('rnBox'), cnt = document.getElementById('rnCount');
  if (!box) return;
  fetchWithTimeout('/api/news/live?hours=48&per_cat=300')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.error) throw new Error((d && d.error) || 'no data');
      /* the web's newsList(): domestic + company merged, newest first. global is deliberately
         left out there, so it is left out here too — mirroring means mirroring the omissions. */
      var arr = (d.domestic || []).concat(d.company || []);
      arr.sort(function(a, b){
        return new Date(b.published_at || 0) - new Date(a.published_at || 0);
      });
      if (cnt) cnt.innerHTML = arr.length + ' raw headlines <span class="h-chev">›</span>';
      /* cc#966 item 2 — never ship a blank card. The payload is clean today (checked: zero rows in
         raw_news with a NULL or blank headline in the 48h window, and the newest row renders its
         headline fine), so this is a guard, not the fix for a known bad row. A headline-less item
         has nothing to show and no reason to occupy a line. */
      var items = arr.filter(function(n){ return n && String(n.headline || '').trim(); });
      /* cc#971: the client ALREADY holds every headline — one fetch with per_cat=300 returns the
         whole 48h window (84 today, which is the count printed in the header). So paging needed
         no payload change and no per-page request: the card's item 2 asked me to raise a LIMIT in
         mobile_home2, but this section has not read that payload since cc#929 — it reads
         /api/news/live directly, and the depth was already here. */
      RN.raw = items;
      /* cc#1092: POLISH is the default tab, so the raw fetch no longer decides what is on screen.
         It fills its own bucket and paints only if polish has not already claimed the view. */
      if (RN.mode === 'raw' || !RN.polish.length){ RN.items = items; RN.page = 0; }
      rnPaint();
      rnBindSwipe();   // cc#1062: bind once, after #rnBox has content
    })
    .catch(function(e){
      if (cnt) cnt.innerHTML = 'unavailable <span class="h-chev">›</span>';
      box.innerHTML = '<div class="sum" style="padding:8px 0">Live news unavailable: ' + esc(e.message) + '</div>';
    });
  /* The polished feed, fetched alongside. It is a SEPARATE promise on purpose: if polish fails the
     raw firehose must still render, and vice versa. One card, two independent sources, neither
     able to blank the other. */
  fetchWithTimeout('/api/news/polished?category=all&limit=100')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.error) throw new Error((d && d.error) || 'no data');
      /* SAME WINDOW OR THE COUNTS LIE. Raw is fetched as hours=48; the polished endpoint has no
         hours param, it returns the newest `limit` ever. Left alone the tabs would have read
         "POLISH 100 · RAW 234" — two numbers over two different periods sitting side by side as
         if they were comparable. Both tabs are now the last 48 hours, so the pair means something
         (today: 30 polished against 234 raw). UNIVERSE_DENOMINATOR_RULE, same as the theme cards. */
      var cutoff = Date.now() - 48 * 3600 * 1000;
      RN.polish = (d.articles || [])
        .filter(function(a){ return a && String(a.headline_clean || '').trim(); })
        .filter(function(a){
          var t = new Date(a.published_time || 0).getTime();
          return isFinite(t) && t >= cutoff;
        })
        .map(function(a){
          /* cc#1120: category was the one field the row already had and threw away — the
             endpoint has always sent it (news_endpoints.py selects it straight from
             v_polished_articles) and this mapping simply did not read it. */
          return { headline: a.headline_clean, published_at: a.published_time,
                   source: a.source, sentiment: a.sentiment, impact: a.impact,
                   category: a.category || '',
                   body: a.full_summary || a.summary || '', polished: true };
        });
      if (RN.mode === 'polish'){ RN.items = RN.polish; RN.page = 0; }
      rnPaint();
      rnBindSwipe();
    })
    .catch(function(){
      /* Polish unavailable is not an error the user needs a banner for — the tab simply reads 0
         and RAW still works. Never a fabricated count. */
      RN.polish = [];
      if (RN.mode === 'polish'){ RN.mode = 'raw'; RN.items = RN.raw; RN.page = 0; }
      rnPaint();
    });
}

/* ══ cc#1092 · THE BOTTOM SHEET — a peek, never a navigation ══════════════════════════════════
   Founder ruling: tapping a headline must NOT leave Home. The sheet opens in place over the card.
   Close is any of: drag handle, backdrop tap, swipe down, Escape. Body scroll is locked behind it
   so the page cannot creep while the sheet scrolls.

   CONTENT HONESTY, which is the part that matters more than the animation: polish rows bind the
   SAME polished body the Intel page renders. A raw row usually has no stored body, and when it
   does not it says so in one plain line. Nothing here composes a summary, and no text is inserted
   with innerHTML before being escaped. */
var NW = { open: false, y: 0, scrollY: 0 };

function nwMd(txt){
  /* escape FIRST, format second — the only safe order. Paragraphs on blank lines, **bold**, and
     nothing else: no links, no images, no raw HTML passthrough. */
  var safe = esc(String(txt == null ? '' : txt));
  return safe.split(/\n\s*\n/).map(function(para){
    var t = para.trim();
    if (!t) return '';
    return '<p>' + t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function nwChip(v, kind){
  if (!v) return '';
  var t = String(v).toUpperCase();
  var cls = kind === 'impact'
    ? (t === 'HIGH' ? 'hi' : 'nt')
    : (t === 'BULLISH' ? 'up' : (t === 'BEARISH' ? 'dn' : 'nt'));
  return '<span class="nwchip ' + cls + '">' + esc(kind === 'impact' ? t + ' IMPACT' : t) + '</span>';
}

function nwOpen(idx){
  var n = RN.items[idx];
  if (!n) return;
  nwClose();
  NW.scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;

  var meta = '<span>' + esc(n.source || 'source unknown') + '</span>';
  var ago = rnAgo(n.published_at);
  if (ago) meta += '<span>\u00b7</span><span>' + esc(ago) + '</span>';
  meta += nwChip(n.sentiment, 'sentiment') + nwChip(n.impact, 'impact');

  var body = String(n.body || '').trim()
    ? '<div class="nwbd">' + nwMd(n.body) + '</div>'
    /* The honest line. A raw feed item has a headline and a source and nothing else, and the one
       thing this must never do is write a plausible-sounding body for it. */
    : '<div class="nwnone">raw feed item \u2014 polished version not yet available.</div>';

  var veil = document.createElement('div');
  veil.className = 'nwveil';
  veil.onclick = nwClose;

  var sheet = document.createElement('div');
  sheet.className = 'nwsheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = '<div class="nwgrab" onclick="nwClose()"></div>'
    + '<div class="nwsb"><div class="nwsh">' + esc(n.headline) + '</div>'
    + '<div class="nwsm">' + meta + '</div>' + body + '</div>';

  document.body.appendChild(veil);
  document.body.appendChild(sheet);
  document.body.style.overflow = 'hidden';
  NW.open = true;
  nwBindSheet(sheet);
}

function nwClose(){
  var v = document.querySelector('.nwveil'), s = document.querySelector('.nwsheet');
  if (v) v.remove();
  if (s) s.remove();
  if (NW.open){
    document.body.style.overflow = '';
    window.scrollTo(0, NW.scrollY);   // the lock must not lose the reader's place
    NW.open = false;
  }
}

function nwBindSheet(sheet){
  /* Swipe DOWN closes, and only from a gesture that started at the top of the body — otherwise a
     downward flick while reading paragraph nine would dismiss the article mid-sentence. */
  var sb = sheet.querySelector('.nwsb');
  sheet.addEventListener('touchstart', function(e){
    NW.y = (e.touches && e.touches[0]) ? e.touches[0].clientY : 0;
  }, { passive: true });
  sheet.addEventListener('touchend', function(e){
    var t = e.changedTouches && e.changedTouches[0];
    if (!t || !sb) return;
    if (sb.scrollTop > 4) return;                 // still reading — not a dismiss
    if (t.clientY - NW.y > 60) nwClose();
  }, { passive: true });
}

document.addEventListener('keydown', function(e){
  if (NW.open && (e.key === 'Escape' || e.keyCode === 27)) nwClose();
});

/* ── cc#930 RESTORE: the block below was deleted by 3ce2493 (cc#928) and is put back
   BYTE-FOR-BYTE as it stood at 8e92cdd. cc#928 replaced a range running from v10Svg to
   the cc#927 marker, and this block sat inside that range — so the V10 rewrite silently
   took cc#911's My Portfolio (PF, pfStrip, pfTap, pfRow, renderPortfolio) and
   d34a4a1's PIV + idxRow with it. Home then threw at render. ── */
/* ══ cc#911: MY PORTFOLIO — expand control + in-place C·A·R·D strip ════════════════════════
   The card used to be wrapped in <a class="card-link" href="/m/holdings">, so EVERY tap inside
   it navigated away, including a tap on a holding. Now the card is a plain div, one explicit

   THE STRIP IS CONSUMED, NEVER RE-IMPLEMENTED. window.ScorrCardRow(sym) is the compact
   table-row variant from scorr_card_strip.js (cc#789/#798). cc#789 exists because two hand-
   written copies of the strip drifted apart, so no C/A/R/D markup is written here at all.

   SCRIPT LOADING — the card asked me to add five <script src> tags after verifying each route.
   VERIFIED, AND NO TAGS WERE ADDED, because all of them are already on the page: /m/home is in

   GRACEFUL DEGRADE: if ScorrCardRow is somehow missing at tap time the opened slot says so in

var PF = { open: null, data: null };

function pfTap(i){

function renderPortfolio(){

/* ══ HERO CARD 2 — INDEX RANGE + DAILY DIGEST (founder 08-Aug) ═════════════════════════════
   Where NIFTY and BANKNIFTY sit between TODAY'S support and resistance. Every number is real:
     level  -> the NIFTY / BANKNIFTY rows already in the home2 ticker payload (domestic_live)
     S / R  -> /api/paper/pivots?symbol=NIFTY50,BANKNIFTY — v8_paper_pivots, the SAME endpoint
               the web dashboard's pivot ladder reads, so the app cannot disagree with it
   The dot is (level - S1) / (R1 - S1), clamped, so it shows position between the two levels.
   NO INVENTED VERDICT: the reference screen carries a sentiment badge, and I am not deriving one.
   What is stated instead is a FACT the pivot gives for free — whether price is above or below the
   pivot point — and if any of the three levels is missing the row renders its numbers with no bar
   at all rather than a bar drawn to a guess. */
var PIV = null;   // symbol -> {pp,r1,s1,...} from /api/paper/pivots

function idxRow(name, sym, level){
  var pv = PIV && PIV[sym];
  var s1 = pv ? Number(pv.s1) : null, r1 = pv ? Number(pv.r1) : null,
      pp = pv ? Number(pv.pp) : null;
  var pos = null;
  if (level != null && s1 != null && r1 != null && r1 !== s1)
    pos = Math.max(0, Math.min(1, (Number(level) - s1) / (r1 - s1)));
  var side = (level == null || pp == null) ? ''
    : (Number(level) >= pp ? 'above pivot' : 'below pivot');
  return '<div class="irow"><span class="inm">' + esc(name) + '</span>'
    + '<span class="ilv">' + px(level) + '</span>'
    + (side ? '<span class="ipp">' + side + '</span>' : '') + '</div>'
    + (pos == null
        ? '<div class="isr"><span>levels pending</span></div>'
        : '<div class="ibar"><div class="idot" style="left:' + (pos * 100).toFixed(1) + '%"></div></div>'
          + '<div class="isr"><span>S ' + px(s1) + '</span><span>R ' + px(r1) + '</span></div>');
}

/* ══ cc#927: PCR -> MOOD LABEL ═════════════════════════════════════════════════════════════
   PCR_MOOD_MAPPING_V1, founder-locked in session_log 18024, and CONTRARIAN by decision: a LOW
   put/call ratio means the crowd is not buying protection, which reads as Fear; a HIGH one reads
   as Greed.

   WHICH BANDS — the card carried TWO tables and they disagree. `rescope_08aug` lists
   <=0.7/0.7-0.9/0.9-1.1/1.1-1.3/>=1.3 with a "Neutral" middle; `bands_final` lists
   <0.5/0.5-0.8/0.8-1.0/1.0-1.4/>1.4 with a "Caution" middle and says in its own words that it
   SUPERSEDES the rescope text. I read session_log 18024 to settle it rather than pick: the entry
   is titled "bands_FINAL_founder_08aug" and matches the second table. That is what is implemented.

   The bands are deliberately wide at the extremes. 18024 states 46 days of history with min 0.50,
   median 0.90, max 1.28 — which the DB confirms exactly (46 rows, 0.499 / 0.898 / 1.283) — so
   over that whole history the labels fall 1 Extreme Fear, 12 Fear, 23 Caution, 10 Greed, 0
   Extreme Greed. Extremes SHOULD be rare; that is the design, not a bug.

   ONE DERIVATION: this reads hero.pcr, the same value the card-1 PCR chip shows. No second fetch
   and no second computation. Null PCR renders NOTHING — never a guessed label. */
var PCR_BANDS = [
  [-Infinity, 0.5, 'Extreme Fear', 'var(--red,#FF5C6C)'],
  [0.5,       0.8, 'Fear',         'var(--red,#FF5C6C)'],
  [0.8,       1.0, 'Caution',      'var(--amber,#F5B94A)'],
  [1.0,       1.4, 'Greed',        'var(--grn,#2FD48B)'],
  [1.4,  Infinity, 'Extreme Greed','var(--grn,#2FD48B)']
];
function pcrBand(v){
  if (v == null || isNaN(Number(v))) return -1;
  var x = Number(v);
  /* Written as literal cut-offs rather than a loop over the table, because a loop got the top
     edge wrong: 18024 says "1.0-1.4 Greed; >1.4 Extreme Greed", so 1.4 itself is GREED, and a
     half-open [1.0,1.4) test dropped exactly 1.4 through to no label at all. These four lines
     mirror 18024 one for one — "<0.5", "0.5-0.8", "0.8-1.0", "1.0-1.4", then ">1.4". */
  if (x < 0.5)  return 0;      // Extreme Fear
  if (x < 0.8)  return 1;      // Fear
  if (x < 1.0)  return 2;      // Caution
  if (x <= 1.4) return 3;      // Greed   — 1.4 inclusive
  return 4;                    // Extreme Greed — strictly above 1.4
}
function pcrMood(hero){
  var i = pcrBand(hero.pcr);
  if (i < 0) return '';                      // no PCR = no label, never a guess
  var b = PCR_BANDS[i];
  return '<div class="pmood"><div class="pw" style="color:' + b[3] + '">' + esc(b[2]) + '</div>'
    + '<div class="pmeter">' + PCR_BANDS.map(function(x, j){
        return '<i class="' + (j === i ? 'on' : '') + '"'
          + (j === i ? ' style="background:' + b[3] + '"' : '') + '></i>';
      }).join('') + '</div>'
    /* cc#1140 · AS-OF HONESTY. The label states what it is showing: during the session
       "PCR 0.94 · 10:30 LIVE", outside it "PCR 0.68 · 08-19 EOD". The number and its basis come
       from the SAME payload object, so the card cannot render a live-looking figure without
       saying which bar it is. A bar older than 15 minutes during the session is shown WITH its
       time and tagged STALE rather than passed off as current — the server sets that flag using
       the pcr_guard convention; nothing is judged here. */
    + '<div class="pcite">PCR ' + esc(Number(hero.pcr).toFixed(2))
    + (hero.pcr_basis === 'LIVE'
        ? (hero.pcr_asof ? ' · ' + esc(hero.pcr_asof) : '')
          + (hero.pcr_stale ? ' · <span style="color:var(--amber,#FF9F45)">STALE</span>' : ' · LIVE')
        : (hero.pcr_date ? ' · ' + esc(String(hero.pcr_date).slice(5)) + ' EOD' : ''))
    + '</div></div>';
}
/* cc#1139 · the INDEX ROW that fills the cc#1134 surplus zone — NIFTY and BANKNIFTY, level and
   day change, the two numbers a trader checks first.
   VALUES ARE NOT RECOMPUTED. They are read from d.ticker[], the SAME array that renders the tape
   at the top of this page (mobile_home2 builds it with name / price / chg_pct per row), so the
   footer and the tape cannot disagree on one paint and there is no new endpoint and no new timer
   — it repaints on the page's existing refresh, like everything else fed by that payload.
   A missing value prints an em-dash, never a zero and never a stale figure dressed as live.
   PLACEMENT: this is a NEW BLOCK in the cc#1134 column, appended AFTER the chip grid, so the
   block order becomes title / mood / tagline / chips / index row. It joins the existing fixed
   row-gap; it does not touch the gap logic. That is what keeps the void from reopening — the
   column still has no auto margins and justify-content is still flex-start, so every block sits
   at a fixed gap from the last and ALL remaining surplus stays below the final block, which is
   now this row rather than the chips.
   No border on the cells, per the ruling: a hairline divider above reads as a card footer strip
   and keeps it visually distinct from the bordered metric chips. */
function idxFooter(d){
  var t = {};
  (d.ticker || []).forEach(function(x){ if (x && x.name) t[x.name] = x; });
  /* cc#1159: each cell opens the chart through togTrend(), the SAME opener the ADR and VIX chips
     already use \u2014 not a second one. `kind` is the TRENDS key, and cc#1159 added a banknifty kind
     to that map and to /api/mobile/trends, which serves it off the same raw_prices table and the
     same shape as nifty (1,296 BANKNIFTY closes against NIFTY50's 1,297, verified before wiring).
     The chart lands in the shared #chiptrend host below the chips, exactly where a chip tap puts
     it, so tapping a footer index and tapping a Nifty chip behave identically. */
  var cell = function(label, key, kind){
    var r = t[key] || {};
    var lvl = (r.price == null) ? '\u2014' : px(r.price);
    var chg = (r.chg_pct == null) ? '' :
      '<span class="ixch ' + cls(r.chg_pct) + '">' + pct(r.chg_pct) + '</span>';
    return '<button class="ixcell" onclick="togTrend(event,\'' + kind + '\')"'
      + ' aria-label="' + esc(label) + ', open chart"><span class="ixnm">' + esc(label) + '</span>'
      + '<span class="ixlv">' + esc(lvl) + '</span>' + chg
      + '<span class="ixgl">\u25a6</span></button>';
  };
  return '<div class="ixrow">' + cell('NIFTY', 'NIFTY', 'nifty')
       + cell('BANKNIFTY', 'BANKNIFTY', 'banknifty') + '</div>';
}

function heroCard2(d){
  var t = {};

/* the deck: two cards, snap-scrolled, with a dot that follows the finger */
/* cc#950: the book deck's dot updater. Same shape as heroDots below — one function per deck
   because each owns its own track and dot row, and the two decks are never on screen together
   in the same scroll position. Tapping a dot scrolls the track, so the dots are a control and
   not just an indicator (card item 2). */
function bookDots(){
  var tr = document.getElementById('bookTrack'), dots = document.getElementById('bookDots');
  if (!tr || !dots) return;
  var i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  Array.prototype.forEach.call(dots.children, function(el, j){
    el.className = (j === i ? 'on' : '');
    el.onclick = function(){ tr.scrollTo({ left: j * tr.clientWidth, behavior: 'smooth' }); };
  });
}

function heroDots(){
  var tr = document.getElementById('heroTrack'), dots = document.getElementById('heroDots');
  if (!tr || !dots) return;
  var i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  Array.prototype.forEach.call(dots.children, function(el, j){
    el.className = (j === i ? 'on' : '');
  });
}

/* pivots ride alongside the main call — the deck renders either way, and a pivot failure costs
   the bar, never the card (Promise.all would have let it take the whole screen down). */
Promise.all([
  fetchWithTimeout('/api/mobile/home2').then(function(r){ return r.json(); }),
  fetchWithTimeout('/api/paper/pivots?symbol=NIFTY50,BANKNIFTY')
    .then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(res){
  var d = res[0], pv = res[1];
  if (Array.isArray(pv)){
    PIV = {};
    pv.forEach(function(r){ if (r && r.symbol) PIV[String(r.symbol).toUpperCase()] = r; });
    var dt = pv[0] && pv[0].pivot_date;
    if (dt) PIV.__date = String(dt).slice(5);
  }
  if (d.error) throw new Error(d.error);

  document.getElementById('sess').textContent = d.session.label;
  /* cc#984: feed freshness beside the clock. Server-computed — the client renders it, it never
     works it out. A payload without `feed` (cached shell mid-deploy) simply shows nothing rather
     than guessing a state. */
  var fr = document.getElementById('feedrail');
  if (fr) fr.innerHTML = railHtml(d.feed);

  var h = '';

  /* 0 · TICKER BAR — MOVING marquee. cc#900: each item is SYMBOL + %CHANGE only (founder:
     previous design was better) — the price span is gone; the pill styling is scoped in this
     page's own <style> so shared-CSS changes can never restyle the tape. */
  /* cc#1123: the tape colours from the SERVER's band when the row carries one, and only falls
     back to cls() — the raw sign — when it does not. This is the fix for a real contradiction:
     India VIX sits first on this tape, its chg_pct is negative on a calming day, and cls() painted
     that red while the Digest tile, reading the same number through its band, painted it green.
     Same figure, two surfaces, opposite meanings. The thresholds are not decided here; the band
     is computed once in global_heatstrip._band(). "mid" is volatility's neutral tier. */
  function tkCls(x){
    var b = x && x.band;
    if (!b || b === 'none') return cls(x.chg_pct);
    if (b === 'mid') return 'neu';
    if (b.indexOf('up') === 0) return 'pos';
    if (b.indexOf('down') === 0) return 'neg';
    return cls(x.chg_pct);
  }
  var tkItems = (d.ticker || []).map(function(x){
      return '<div class="tk"><span class="n">' + esc(x.name) + '</span>'
        + '<span class="d ' + tkCls(x) + '">' + pct(x.chg_pct) + '</span></div>';
    }).join('');
  // cc#901: duration halved = speed doubled. The floor halves with it (20s -> 10s) so a short
  // tape stays proportional instead of hitting the floor and running slower than a long one.
  var tkDur = Math.max(10, (d.ticker || []).length * 1.3);
  // cc#904: the tape is now a doorway. Hold-to-pause still works — a tap and a hold are
  // different gestures, and the pause is CSS (:active), not JS, so the two cannot fight.
  TAPE.rows = d.ticker || [];
  h += '<div class="tkr" onclick="openTape()" style="--tkr-dur:' + tkDur + 's;cursor:pointer">'
    + '<div class="tkr-track">' + tkItems + tkItems + '</div></div>';

  /* 1 · HERO — the market today; V10 index line; ADR/PCR/VIX chips open charts */
  var hero = d.hero || {};
  /* cc#906: each index on the V10 line gets its own chart icon. The symbol comes from the
     server (hero.v10[].symbol), so the template never maps a display name back to a feed key. */
  /* cc#1158: the `v10` hero string and its v10State helper are DELETED. They existed only to
     build the INDEX SIGNALS card, which the founder replaced with the Index Book strip below,
     and a builder whose only consumer is gone is dead code that still reads as live. The server
     payload field hero.v10 is left alone - that is backend, nothing else on this page reads it,
     and removing a payload field is not what this card asked for. The .v10b / .v10i rules go
     from the stylesheet with the markup they styled. */
  h += '<div class="swipe"><div class="swipe-t" id="heroTrack" onscroll="heroDots()">'
    + '<div class="c"><div class="chd"><div class="t">The market today</div>'
    + '<div class="rgt">' + esc(hero.as_of || '') + '</div></div>'
    + '<div class="hero-mood" style="color:' + moodColor(hero.mood) + '">' + moodLetters(hero.mood || '--') + '</div>'
    + '<div class="hero-why">' + esc(hero.why || '') + '</div>'
    /* cc#1068 moved the V10 index line out of this scoreboard into its own INDEX SIGNALS card
       below the carousel. cc#1158 then replaced that card with the INDEX BOOK strip on founder
       ruling, so the line and its `v10` builder are gone from this page entirely. Left as a note
       rather than deleted: a reader looking for where the V10 state went should find the answer
       here, at the place it used to be, instead of concluding it was never there. */
    + '<div class="hchips">' + (hero.chips || []).map(function(c){
        var k = c.indeterminate ? '' : (c.ok ? ' ok' : ' bad');
        var isAdr = String(c.label).indexOf('ADR') > -1;
        // cc#998: the Nifty Day/Week/Month mood chips open the NIFTY50 close chart, exactly like ADR.
        // tapKind ADDS the .tap affordance + togTrend handler; the pass/fail class `k` is untouched.
        var isNifty = /nifty/i.test(String(c.label));
        var tapKind = isAdr ? 'adr' : (isNifty ? 'nifty' : '');
        var val = (c.value == null) ? '--'
                : (isAdr ? Number(c.value).toFixed(2) : pct(c.value));
        // cc#1184: `slab dense` carries the bevel; `k` and the state CSS carry the colours.
        return '<button class="hc slab dense' + k
          + (tapKind ? ' tap" onclick="togTrend(event,\'' + tapKind + '\')"' : '"') + '>'
          + esc(c.label) + ' ' + esc(val) + '</button>';
      }).join('')
    /* founder 08-Aug batch 3: PCR/VIX chips carry colour. PCR >= 1.0 = puts heavy = supportive
       (green), < 1.0 = red. VIX <= 14 = calm (green), >= 17 = elevated (red), between = neutral.
       Null stays uncoloured -- with no invented band. */
    + '<button class="hc slab dense tap' + (hero.pcr == null ? '' : (Number(hero.pcr) >= 1 ? ' ok' : ' bad'))
    + '" onclick="togTrend(event,\'pcr\')">PCR ' + (hero.pcr == null ? '--' : esc(Number(hero.pcr).toFixed(2))) + '</button>'
    /* VIX_COLOR_RULE_V1 (cc#1081, executed as APP_QA_R5 P3). A fear gauge must never celebrate.
       The old logic gave VIX <= 14 the `ok` class — green — so on a calm day with the gate
       failing 4-of-4 the chip read as good news. `ok` is now unreachable on this chip in every
       state: red when fear confirms, neutral otherwise, never green.
       cc#1083 COMPLETED THE RULE. P3 shipped red-on->=17 only, because the payload carried no VIX
       change field and inventing one client-side was forbidden. mobile_home2 now serves vix_chg
       and vix_prev_close (live intraday level vs the last close of the PREVIOUS trading session,
       derived from the bar dates so weekends and holidays skip themselves), so the confirming-fear
       half is live: red when the VIX is RISING and the gate is failing, or whenever it is >= 17.
       Still never green in any branch. vix_chg null (no previous session) simply means the rising
       clause cannot fire — it never counts as a rise. */
    /* cc#1123 — TWO OF THE THREE TIERS SHIP HERE, AND THE THIRD IS DELIBERATELY NOT SHIPPED.
       The founder's rule is down 5%+ green, up 5%+ red, in between amber. Red and amber are live
       below. GREEN IS HELD, and the reason is on the record rather than in my head: cc#1081 and
       cc#1083 locked VIX_COLOR_RULE_V1 on this exact chip — "`ok` is now unreachable on this chip

       check chips, where green does not read as "volatility fell", it reads as "this check
       passed". That was the original defect: on a calm day with the gate failing 4-of-4, a green
       VIX chip told the founder the market was fine. A change-based green at 5% is a better rule
       than the level-based green that caused it, but it lands in the same row and inherits the

       Fable with this note; the moment it is recorded, green here is one clause.
       Nothing is lost meanwhile: the Digest tile and the Home tape both carry the full three
       tiers today, so a VIX down 6% IS green on this screen — on the tape, one row above.
       The old level rule (>= 17) stays as an OR, unchanged: an absolutely high VIX is red whatever
       today's move was, and cc#1123 did not ask for that to go. */
    + '<button class="hc slab dense vixc tap' + (hero.vix == null ? '' : (
        (Number(hero.vix) >= 17
          || (hero.vix_chg_pct != null && Number(hero.vix_chg_pct) >= 5)
          || (hero.vix_chg != null && Number(hero.vix_chg) > 0
              && hero.fails != null && Number(hero.fails) > 0)) ? ' bad'
        : (hero.vix_chg_pct != null ? ' vixmid' : '')))
    + '" onclick="togTrend(event,\'vix\')">VIX ' + (hero.vix == null ? '--' : esc(Number(hero.vix).toFixed(1))) + '</button>'
    + '</div><div id="chiptrend"></div>'
    + idxFooter(d)          /* cc#1139: LAST block in the cc#1134 column, after the chip grid */
    /* cc#1181: the cc#1160 edge button that straddled this card's bottom is REMOVED (founder
       28349). Index Intel is now one entry only, the bevel button under the INDEX BOOK strip.
       The footer index cells here are untouched — cc#1159's chart buttons stay as shipped. */
    + '</div>'
    + heroCard2(d)
    + '</div><div class="dots" id="heroDots"><i class="on"></i><i></i></div></div>';

  /* 2 · V8 OPEN BOOK — unrealised split with % of capital deployed (founder 08-Aug) */
  var bk = d.book || {};
  function trioCell(k, o, totPct, totVal){
    /* total cell passes its own value/pct; side cells pass their object */
    var v = (o == null) ? totVal : o.unrealised;
    var p = (o == null) ? totPct : o.pct;
    return '<div class="st"><div class="k">' + k + '</div>'

      + '<div class="p ' + cls(p) + '">' + (p == null ? '--' : pct(p)) + '</div></div>';
  }
  /* ══ cc#950 — THE BOOK TILE HAS A SECOND FACE ══════════════════════════════════════════════
     cc#943 put the Open <-> Realised swipe on /m/v8; the founder wants it on the Home tile too.
     Template-only: /api/mobile/home2 already ships realised, gross, brokerage, wins, losses and
     trades on the same book payload, so nothing server-side changes.

     THE GESTURE IS THE ONE THIS FILE ALREADY HAS, NOT A NEW ONE. The card describes the market
     card's mechanism as an axis-locked touch handler; it is not — the market deck (cc#927) is a
     CSS scroll-snap track with an onscroll dot updater, and that is what is reused here. It is
     the better of the two for a tile sitting inside a scrolling page: native horizontal scroll
     cannot swallow a vertical drag, so "vertical scroll unaffected" holds by construction rather
     than by a threshold I would have to tune. No second handler exists to fork.

     THE ANCHOR WRAPS EACH FACE, NOT THE DECK. Putting a horizontal scroller inside one <a> risks
     a swipe ending as a navigation; giving each face its own card-link keeps the tap target and
     the destination identical to before while the track owns the drag. */
  function bookFace1(){
    return '<a class="card-link" href="/m/v8"><div class="c slab"><div class="chd">'
      + '<div class="t">V8 Open Book</div>'
      + '<div class="rgt">' + (bk.open || 0) + ' positions <span class="h-chev">\u203a</span></div></div>'
      + '<div class="trio">'
      + trioCell('Unrealised', null, bk.unrealised_pct, bk.unrealised)
      + trioCell('Long Unrl', bk.long || {})
      + trioCell('Short Unrl', bk.short || {})
      + '</div>'
      + '<div class="sum" style="margin-top:7px">% on capital deployed per side.</div>'
      + '</div></a>';
  }
  /* ══ cc#961 — THE WIN RATE IS SPLIT BY SIDE, AND THE TRADES CELL IS GONE ═════════════
     Why the split earns a cell and the count does not: at build time the long book reads 92%
     on 13 decided and the short book 20% on 5. One blended number (72%) hides the only thing
     on this face you could act on — that one side is carrying the entire record. The total
     trade count stays true but says nothing, and /m/v8 already shows it, so it gives up its cell.

     W/L are the WEB MASTER DASHBOARD counts: wins = result TARGET, losses = result SL. They
     deliberately do NOT sum to `trades` — 15 of the 33 fresh-era trades closed for some other
     reason and are money in the realised figure but not a verdict in the record. The sub-line
     therefore reads wins/DECIDED, never wins/trades, so its denominator is the same one the
     rate above it was divided by. Anything else would put two different maths on one cell.

     The rate itself is NOT computed here — it arrives from /api/mobile/home2 already divided,
     so Home and every other surface read one number instead of each doing its own arithmetic.
     A side with no decided trades prints a DASH, never 0% — no verdicts is not a 0% record. */
  function rateCell(k, r){
    r = r || {};
    var rt = (r.rate == null) ? null : Number(r.rate);
    /* founder bands: >=60 green, 40-60 amber, <40 red. A dash gets NO band — it goes neutral dim,
       because the absence of a verdict is not a grade and tinting it would invent one. */
    var col = (rt == null) ? 'var(--mut)'
            : (rt >= 60 ? 'var(--grn)' : (rt >= 40 ? 'var(--amber)' : 'var(--red)'));
    return '<div class="st"><div class="k">' + k + '</div>'
      + '<div class="v" style="color:' + col + '">'
      +   (rt == null ? '--' : rt.toFixed(0) + '%') + '</div>'
      + '<div class="p">' + (r.decided ? (r.wins + '/' + r.decided) : 'no verdicts') + '</div></div>';
  }
  function bookFace2(){
    /* cc#962: this face is the CLOSED book, and it used to carry face 1's header verbatim \u2014 same
       title, same "N positions" \u2014 so the deck read as one card that changed its numbers. cc#950's
       "header byte-identical" assertion is superseded on the LABEL only; geometry and styling are
       untouched, and the count comes from the payload, never a literal. */
    return '<a class="card-link" href="/m/v8"><div class="c slab"><div class="chd">'
      + '<div class="t">V8 Closed Book</div>'
      + '<div class="rgt">' + (bk.trades || 0) + ' trades <span class="h-chev">\u203a</span></div></div>'
      + '<div class="trio">'
      + '<div class="st"><div class="k">Realised</div>'
      +   '<div class="v ' + cls(bk.realised) + '" title="' + esc(inr(bk.realised)) + '">'
      +   inrShort(bk.realised) + '</div>'
      +   '<div class="p">net</div></div>'
      + rateCell('Win Rate Long', bk.rec_long)
      + rateCell('Win Rate Short', bk.rec_short)
      + '</div>'
      /* brokerage is a COST, not a signed P&L — inrShort would print "+Rs16,500", which reads
         like a gain. Formatted unsigned here. The sub-note now also names what the small
         numbers under the rates are, because "12/13" alone is not self-explaining. */
      + '<div class="sum" style="margin-top:7px">Wins / decided. Net of \u20B9'
      + Math.round(bk.brokerage || 0).toLocaleString('en-IN') + ' brokerage.</div>'
      + '</div></a>';
  }
  /* cc#1158 · INDEX BOOK — the founder replaced the cc#1068 INDEX SIGNALS card here with the
     OPEN index book: direction and paired P&L per index, and a row tap opening the chart that is
     already built. The V10 engine, its endpoints and /m/v10 are untouched — this removes one
     Home surface and nothing else.
     ALWAYS RENDERED, NEVER CONDITIONAL. The old card sat inside `if (v10)`, so on a day the hero
     carried no V10 line the whole section simply was not there. A book that vanishes when it is
     empty cannot be told apart from a book that failed to load, and this card is explicit that
     flat must SAY flat. The strip paints immediately and loadIndexBook() fills it after, the
     same way LIVE NEWS is filled. */
  /* cc#1181: the Index Intel entry is STATIC MARKUP beside the strip, not something
     renderIndexBook prints inside it. Two reasons, and the second is the one that matters.
     (1) The ruling puts it BELOW the strip, full strip width, as a standalone button \u2014 that is
     a sibling of the box, not a row in it.
     (2) The book has three states \u2014 rows, FLAT, and UNAVAILABLE \u2014 and the last two replace the
     box's whole innerHTML. A single entry point that disappears on the days the book is empty or
     the endpoint is down is not a single entry point, it is an intermittent one. Out here it is
     painted with the section and never depends on a fetch. */
  h += '<div class="sect">INDEX BOOK \u00b7 OPEN</div>'
    + '<div class="ibk" id="ibkBox"><div class="ibk-flat">Loading index book\u2026</div></div>'
    + '<a class="ibk-intel slab" href="/m/v10">INDEX INTEL \u203a</a>';

  h += '<div class="sect">THE BOOK</div>'
    + '<div class="swipe"><div class="swipe-t" id="bookTrack" onscroll="bookDots()">'
    + bookFace1() + bookFace2()
    + '</div><div class="dots" id="bookDots"><i class="on"></i><i></i></div></div>';

  /* 3 · MY PORTFOLIO — cc#911: rendered by renderPortfolio() into #pfblock, so a row tap can
     redraw just this card instead of the whole page. */
  PF.data = d.portfolio || {};
  h += '<div class="sect">MY PORTFOLIO</div><div class="c slab" id="pfblock"></div>';

  /* 4 · LIVE NEWS — scrollable; Intel has its own nav slot (founder 08-Aug).
         Results Corner card removed: covered by the Results tile in the grid. */
  /* cc#929: RAW, and an exact mirror of the web V8 Live News tab. This section used to render
     d.reading, which is built from v_polished_articles — the POLISHED feed. The web tab reads
     /api/news/live?hours=48&per_cat=300 over raw_news. Those are different bodies of text, so the
     two surfaces could never have matched. This now calls the SAME endpoint with the SAME params
     and merges the SAME two groups in the SAME order as the web's newsList() — domestic + company,
     published_at DESC — so DISPLAY_PARITY holds by construction rather than by coincidence.
     The container is filled by loadRawNews() after paint; the card renders immediately. */
  /* cc#1092: the card is NO LONGER one big <a href="/m/intel">. Founder ruling: a headline tap
     opens a peek in place and must never navigate. Only the HEADER count keeps its link —
     "go to the page" is a different intent from "show me this one", and conflating them is what
     made every headline a trapdoor. The wrapper anchor also used to swallow taps, which is why
     cc#971 and cc#1062 both had to fight it; removing it retires that whole class of bug. */
  h += '<div class="sect">LIVE NEWS</div>'
    + '<div class="c slab"><div class="chd"><div class="t">Live News</div>'
    + '<a class="rgt" id="rnCount" href="/m/intel">loading… <span class="h-chev">\u203a</span></a></div>'
    + '<div id="nwTabs"></div>'
    + '<div class="newslist" id="rnBox"><div class="loading" style="padding:6px 0">Loading headlines…</div></div>'
    + '</div>';

  /* 5 · TOOLS — 15 tiles (cc#991 appended the 15th), zero overlap with the five-slot nav */
  h += '<div class="sect">TOOLS</div>';
  document.getElementById('body').innerHTML = h;
  moodStart();        /* cc#1135: the .mlt letters only exist after this paint */
  loadIndexBook();    /* cc#1158: #ibkBox only exists after this paint, same as the mood letters */

  var tools = document.createElement('div');
  tools.className = 'tools';
  tools.innerHTML =
      '<a class="tool slab dense" href="/m/qb"><span>\u25a6</span>Baskets</a>'
    + '<a class="tool slab dense" href="/m/screeners"><span>\u2637</span>Screeners</a>'
    + '<a class="tool slab dense" href="/m/sector"><span>\u2b21</span>Sector Intel</a>'
    + '<a class="tool slab dense" href="/m/results"><span>\u2263</span>Results</a>'
    + '<a class="tool slab dense" href="/m/digest"><span>\u2600</span>Digest</a>'
    + '<a class="tool slab dense" href="/m/fpc"><span>\u20b9</span>FPC</a>'
    + '<a class="tool slab dense" href="/dashboard"><span>\u26a1</span>Dashboard</a>'
    + '<a class="tool slab dense" href="/cio"><span>\u2299</span>AICIO</a>'
    + '<a class="tool slab dense" href="/health"><span>\u2695</span>Portfolio Health</a>'
    // cc#897: 9 -> 12 tiles. All three open WEB pages, the same 16915 exception the founder
    // already approved for Dashboard / AICIO / Portfolio Health above.
    // The Index Intel hash was VERIFIED against the dashboard's own router, not assumed: the card
    // proposed #indexintel, but v8_dashboard.html line ~4995 reads
    // TABS=['index','v14','tcscan','bt'] and falls back to the Master pane on any unknown hash.
    // #indexintel would therefore have opened Master silently and looked like a working link.
    /* APP_QA_R4 P8 (F4): the app tile comes first and owns the name; the web page is kept
       but marked as the web one, so two tiles never claim the same label. */
    + '<a class="tool slab dense" href="/m/v10"><span>\u25d0</span>Index Intel</a>'
    + '<a class="tool slab dense" href="/dashboard#index"><span>\u25d0</span>Index Intel \u00b7 Web</a>'
    + '<a class="tool slab dense" href="/v9"><span>\u21c4</span>V9 Pairs</a>'
    + '<a class="tool slab dense" href="/v15"><span>\u25c9</span>V15 MF</a>'
    // cc#897 second pass: 12 -> 14. Routes taken from model_registry, not guessed \u2014 V10 is /v10
    // and V14 Intraday is /intraday there. Both open web pages, same 16915 exception as above.
    /* APP_QA_R4 P8: the old /v10 web tile is the same destination as the web Index Intel
       tile above in user terms, so it keeps its own route but stops being called "V10". */
    + '<a class="tool slab dense" href="/v10"><span>\u25d1</span>V10 Desk \u00b7 Web</a>'
    + '<a class="tool slab dense" href="/intraday"><span>\u25f4</span>V14 Intraday</a>'
    // cc#991 (founder 10-Aug, grid_final amendment): APPEND the Wall of Trades tile. The grid was
    // never capped at 12 — it already held 14 and the last row had an empty third slot — so this
    // is the 15th tile filling that slot, not a reflow and not a displacement. It opens the APP
    // screen /m/trades, unlike the web-page tiles above it.
    + '<a class="tool slab dense" href="/m/trades"><span>\u2637\uFE0E</span>Wall of Trades</a>';
  document.getElementById('body').appendChild(tools);

  renderPortfolio();   // cc#911: the portfolio card owns its own render so a row tap can redraw it alone
  loadRawNews();       // cc#929: raw headlines, mirroring the web Live News tab
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>' + esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sess').textContent = 'failed to load';
});
</script>
</body>
</html>
