/* cc#1903 — page-local rules (mf-*). Same discipline as every other section page this session:
   bridge colour tokens + scorr_themes.css scale tokens only, no raw hex. */
.mf-asof{padding:var(--space-10) var(--space-14) 0;font-size:var(--type-10);color:var(--dim)}
.mf-km{margin:var(--space-10) var(--space-12) 0;background:var(--panel);border:var(--bw-1) solid var(--line);
 border-left:3px solid var(--blu);border-radius:0 var(--radius-12) var(--radius-12) 0;padding:var(--space-14) var(--space-14)}
.mf-k{font-size:var(--type-10);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:var(--track-em12)}
.mf-v{font-size:var(--type-24);font-weight:800;line-height:1.05;margin-top:var(--space-5);font-family:'IBM Plex Mono',ui-monospace,monospace}
.mf-kg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);margin-top:var(--space-12)}
.mf-cell{background:var(--panel2);border:var(--bw-1) solid var(--line);border-radius:var(--radius-10);padding:var(--space-9) var(--space-10)}
.mf-cell .mf-k{font-size:var(--type-9)}
.mf-cell .mf-v{font-size:var(--type-14);margin-top:var(--space-3)}
.mf-slab{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-18) var(--space-14) var(--space-7)}
.mf-slab h2{font-size:var(--type-11);font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:var(--track-em12)}
.mf-slab .hint{font-size:var(--type-10);color:var(--dim)}
.mf-rail{display:flex;gap:var(--space-11);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--space-2) var(--space-14) var(--space-4);
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mf-rail::-webkit-scrollbar{display:none}
.mf-c{flex:0 0 78vw;max-width:320px;scroll-snap-align:start;background:var(--panel);border:var(--bw-1) solid var(--line);
 border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);position:relative}
.mf-c.gap{border-style:dashed}
.mf-ch{display:flex;align-items:baseline;justify-content:space-between}
.mf-ch .t{font-size:var(--type-11);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:var(--track-em8)}
.mf-ch .n{font-size:var(--type-11);color:var(--mut)}
.mf-lst{margin-top:var(--space-9)}
.mf-lr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-7) 0;border-bottom:var(--bw-1) solid var(--panel2);gap:var(--space-9)}
.mf-lr:last-child{border-bottom:none}
.mf-lr .s{font-size:var(--type-125);font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-lr .r{display:flex;gap:var(--space-11);align-items:baseline;flex:none}
.mf-lr .a{font-size:var(--type-115);color:var(--mut)}
.mf-lr .b{font-size:var(--type-125);font-weight:700;font-family:'IBM Plex Mono',ui-monospace,monospace}
.mf-more{font-size:var(--type-11);color:var(--dim);padding:var(--space-7) 0 0}
.mf-link{display:block;margin-top:var(--space-9);padding-top:var(--space-9);border-top:var(--bw-1) solid var(--line);
 font-size:var(--type-115);font-weight:700;color:var(--blu);text-decoration:none}
.mf-emp{font-size:var(--type-115);color:var(--dim);line-height:1.6;margin-top:var(--space-7)}
.mf-emp b{display:block;color:var(--txt);font-size:var(--type-125);font-weight:700;margin-bottom:var(--space-5)}
.mf-note{margin:var(--space-22) var(--space-14) var(--space-8);padding:var(--space-12) var(--space-14);
 border:var(--bw-1) dashed var(--line);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--dim);line-height:1.65}
.mf-note b{color:var(--mut)}
.mf-empty{padding:var(--space-14);color:var(--dim);font-size:var(--type-12);text-align:center}
.mf-err{margin:var(--space-14)}
</style>

if(t){}}catch(e){}
var __r1644=({goldday:'aquawhite',rosenight:'blush',rosewall:'blush',winepurple:'electricviolet',duskviolet:'electricviolet'})[t];if(__r1644){t=__r1644;try{localStorage.setItem('scorr_theme',t);}catch(e){}}document.body.setAttribute('data-theme',(window.SCORR_THEME&&window.SCORR_THEME.resolve)?window.SCORR_THEME.resolve():((t==='goldnight'||t==='dark'||t==='aquawhite'||t==='blush'||t==='ainight'||t==='silvergold'||t==='electricviolet'||t==='indigoash')?t:'goldnight'));
try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;}catch(e){}})();</script>
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">Mutual Funds</span></div><div class="as-slot"></div></div>
<div class="mf-asof" id="mf-asof">Loading…</div>
<div id="mf-body"><div class="mf-empty">Loading fund scores…</div></div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>

</nav>
<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function kmHtml(k){
  return '<div class="mf-km"><div class="mf-k">Schemes scored</div><div class="mf-v">'+(k.schemes_scored!=null?k.schemes_scored:'—')+'</div>'
    + '<div class="mf-kg">'
    + '<div class="mf-cell"><div class="mf-k">In master</div><div class="mf-v">'+(k.in_master!=null?k.in_master.toLocaleString('en-IN'):'—')+'</div></div>'
    + '<div class="mf-cell"><div class="mf-k">Top score</div><div class="mf-v">'+(k.top_score!=null?k.top_score:'—')+'</div></div>'
    + '<div class="mf-cell"><div class="mf-k">Basis</div><div class="mf-v">'+esc(k.basis||'—')+'</div></div>'
    + '<div class="mf-cell"><div class="mf-k">Typical coverage</div><div class="mf-v">'+(k.typical_coverage!=null?k.typical_coverage+'%':'—')+'</div></div>'
    + '</div></div>';
}
function bestCardHtml(d){
  var bs=d.best_scores||{}, rows=bs.rows||[];
  var lst = rows.map(function(r){
    var score = r.mqs!=null ? r.mqs : '—';   /* item 4: never 0 for a null score — mqs is only ever null if this row's own value is null */
    var cov = r.coverage_pct!=null ? r.coverage_pct+'% cov' : '— cov';
    return '<div class="mf-lr"><span class="s" title="'+esc(r.name)+'">'+esc(r.name)+'</span><div class="r"><span class="a">'+esc(cov)+'</span><span class="b">'+score+'</span></div></div>';
  }).join('');
  return '<div class="mf-c"><div class="mf-ch"><span class="t">Best scores</span><span class="n">'+(bs.count!=null?bs.count+' scored':'')+'</span></div>'
    + '<div class="mf-lst">'+lst+'</div>'
    + (bs.message?'<div class="mf-more">'+esc(bs.message)+'</div>':'')
    + '<a class="mf-link" href="/v15">All '+(bs.count!=null?bs.count:'')+' scored &#8250;</a></div>';
}
function categoryCardHtml(d){
  var bc=d.by_category||{}, rows=bc.rows||[];
  var lst = rows.map(function(r){
    return '<div class="mf-lr"><span class="s">'+esc(r.category)+'</span><div class="r"><span class="b">'+r.count+'</span></div></div>';
  }).join('');
  return '<div class="mf-c"><div class="mf-ch"><span class="t">By category</span><span class="n">'+rows.length+' shown</span></div>'
    + '<div class="mf-lst">'+lst+'</div>'
    + (bc.message?'<div class="mf-more">'+esc(bc.message)+'</div>':'')+'</div>';
}
function partsCardHtml(d){
  var sp=d.score_parts||{};
  return '<div class="mf-c"><div class="mf-ch"><span class="t">Four parts</span><span class="n">Q + R + C + S</span></div>'
    + '<div class="mf-emp" style="margin-top:0">'+esc(sp.message||'')+'</div>'
    + (sp.basis_note?'<div class="mf-more">'+esc(sp.basis_note)+'</div>':'')+'</div>';
}
function dataCardHtml(d){
  var db=d.data_behind||{}, rows=db.rows||[];
  var lst = rows.map(function(r){
    return '<div class="mf-lr"><span class="s">'+esc(r.label)+'</span><div class="r"><span class="b">'+r.count.toLocaleString('en-IN')+'</span></div></div>';
  }).join('');
  return '<div class="mf-c"><div class="mf-ch"><span class="t">Data behind it</span><span class="n">live</span></div>'
    + '<div class="mf-lst">'+lst+'</div>'
    + (db.message?'<div class="mf-more">'+esc(db.message)+'</div>':'')+'</div>';
}
function coverageCardHtml(d){
  var c=d.coverage||{};
  return '<div class="mf-c"><div class="mf-ch"><span class="t">Each score states its own coverage</span><span class="n">'+esc((d.key_metrics&&d.key_metrics.typical_coverage!=null)?d.key_metrics.typical_coverage+'% typical':'')+'</span></div>'
    + '<div class="mf-emp" style="margin-top:0">'+esc(c.message||'')+'</div>'
    + (c.example?'<div class="mf-more">'+esc(c.example)+'</div>':'')+'</div>';
}

function render(d){
  var k=d.key_metrics||{};
  document.getElementById('mf-asof').textContent = 'Scored today · '+(k.schemes_scored!=null?k.schemes_scored:'—')+' of '+(k.in_master!=null?k.in_master.toLocaleString('en-IN'):'—')+' schemes · score out of 100';
  var html = kmHtml(k)
    + '<div class="mf-slab"><h2>Top scoring</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="mf-rail">'+bestCardHtml(d)+categoryCardHtml(d)+'</div>'
    + '<div class="mf-slab"><h2>How the score works</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="mf-rail">'+partsCardHtml(d)+dataCardHtml(d)+'</div>'
    + '<div class="mf-slab"><h2>Coverage</h2><span class="hint">1 · swipe →</span></div>'
    + '<div class="mf-rail">'+coverageCardHtml(d)+'</div>'
    + '<div class="mf-note"><b>'+(k.schemes_scored!=null?k.schemes_scored:'—')+' of '+(k.in_master!=null?k.in_master.toLocaleString('en-IN'):'—')+' are scored.</b> The key metrics card leads with both numbers so nobody reads the page as covering every fund. Unscored schemes have no score, never a zero. <b>Coverage is shown per fund</b> — right next to the score on every row, not buried behind a category label.</div>';
  document.getElementById('mf-body').innerHTML = html;
}

fetch('/api/mobile/mf_app', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error){ document.getElementById('mf-body').innerHTML = '<div class="mf-err mf-empty">Could not load: '+esc(d.error)+'</div>'; return; }
    render(d);
  })
  .catch(function(e){ document.getElementById('mf-body').innerHTML = '<div class="mf-err mf-empty">Could not load fund scores.</div>'; });
</script>
</body></html>
