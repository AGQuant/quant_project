<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function tok(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function cr(v){ if(v==null) return '—'; v=Number(v); return v>=1000?'₹'+(v/1000).toFixed(1)+'k Cr':'₹'+Math.round(v)+' Cr'; }
function short(c){ return String(c||'').replace(' Fund','').replace('Sectoral/Thematic','Sectoral').replace('Value/Contra','Value'); }
var Q={}; try{ var u=new URLSearchParams(location.search); Q.code=u.get('code'); }catch(e){}
var CAT='', SORT='mqs', QS='';
function frow(r){
  var sub=esc(r.amc||'')+' · '+esc(short(r.category))+' · 1y <b class="'+cls(r.ret_1y)+'">'+pct(r.ret_1y,1)+'</b>'+(r.ret_3y!=null?' · 3y <b>'+pct(r.ret_3y,1)+'</b>':'')+(r.aum!=null?' · '+cr(r.aum):'')+(r.er!=null?' · ER '+f2(r.er)+'%':'');
  return '<a class="row '+((r.mqs||0)>=65?'up':'mu')+'" href="/m/mf?code='+encodeURIComponent(r.code)+'"><div><div class="nm">'+esc(r.name)+'</div><div class="sub">'+sub+'</div></div><div class="v"><div class="n '+((r.mqs||0)>=65?'gd':'')+'">'+(r.mqs!=null?Math.round(r.mqs):'—')+'</div><div class="c">score</div></div></a>';
}
function renderList(d){
  document.getElementById('asof').innerHTML='<b>'+(d.scored||0)+'</b> scored of '+(d.universe||0)+' equity funds · direct growth only';
  var h='<div class="card" style="padding:10px 12px"><input id="q" class="qin" placeholder="Search a fund or AMC" value="'+esc(QS)+'"></div>';
  h+='<div class="chips" id="cats"><span class="chip'+(CAT===''?' on':'')+'" data-c="">All</span>'+(d.categories||[]).map(function(c){return '<span class="chip'+(c===CAT?' on':'')+'" data-c="'+esc(c)+'">'+esc(short(c))+'</span>';}).join('')+'</div>';
  h+='<div class="sec"><h2>'+(QS?'Matches':(CAT?esc(short(CAT)):'All categories'))+'</h2><span class="seg2" id="sort"><span data-s="mqs"'+(SORT==='mqs'?' class="on"':'')+'>Score</span><span data-s="1y"'+(SORT==='1y'?' class="on"':'')+'>1y</span><span data-s="aum"'+(SORT==='aum'?' class="on"':'')+'>Size</span></span></div>';
  h+= (d.rows||[]).length ? '<div class="lst">'+d.rows.map(frow).join('')+'</div>' : '<div class="emp"><b>No fund here</b>'+(QS?'Nothing matches that name.':'No scored fund in this category yet.')+'</div>';
  h+='<div class="note"><b>The score, plainly.</b> Out of 100. Half is the quality of what the fund holds (its stocks\' GVM), a quarter is returns, the rest is cost and steadiness. A fund with no score has no score — never a zero.</div>';
  document.getElementById('body').innerHTML=h;
  document.getElementById('cats').addEventListener('click', function(e){ var s=e.target.closest('[data-c]'); if(!s) return; CAT=s.getAttribute('data-c'); QS=''; load(); });
  document.getElementById('sort').addEventListener('click', function(e){ var s=e.target.closest('[data-s]'); if(!s) return; SORT=s.getAttribute('data-s'); load(); });
  var qi=document.getElementById('q'); qi.addEventListener('keydown', function(e){ if(e.key==='Enter'){ QS=qi.value.trim(); load(); } });
}
function load(){
  fetch('/api/mobile/mf_app/list?category='+encodeURIComponent(CAT)+'&sort='+SORT+'&q='+encodeURIComponent(QS),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
    renderList(d);
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load funds.</div>'; });
}
function navChart(pts){
  if(!pts||pts.length<2) return '';
  var v=pts.map(function(p){return p.v;}).filter(function(x){return x!=null;}); var lo=Math.min.apply(null,v), hi=Math.max.apply(null,v); if(hi===lo) hi=lo+1;
  var n=pts.length, line=pts.map(function(p,k){ return p.v==null?null:((4+k*(312/(n-1))).toFixed(1)+','+(74-(p.v-lo)/(hi-lo)*66).toFixed(1)); }).filter(Boolean).join(' ');
  return '<svg viewBox="0 0 320 80" preserveAspectRatio="none" style="width:100%;height:80px;margin-top:8px"><polyline fill="none" stroke="'+tok('--brand')+'" stroke-width="2" points="'+line+'"/><g fill="'+tok('--muted')+'" font-size="8" font-family="Sora"><text x="4" y="79">'+esc(dm(pts[0].d))+'</text><text x="272" y="79">'+esc(dm(pts[n-1].d))+'</text></g></svg>';
}
function renderFund(d){
  document.getElementById('pg-title').textContent=d.name||'Fund'; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='<b>'+esc(d.amc||'')+'</b> · '+esc(d.category||'')+(d.returns_asof?' · returns to '+esc(dm(d.returns_asof)):'');
  var sc=d.scores||{}, w=d.weights||{}, rt=d.returns||{}, ca=d.cat_avgs||{};
  var h='<div class="hero"><div class="eye">Fund score · out of 100'+(d.rank?' · #'+d.rank+' of '+d.peers_n+' in category':'')+'</div><div class="big"><div class="r '+((d.mqs||0)>=65?'gd':'')+'">'+(d.mqs!=null?Math.round(d.mqs):'—')+'</div><div class="n">'+esc(d.full_name||'')+'</div></div>'
   +'<div class="pil">'+[['Q','Quality of holdings',sc.q,w.q],['R','Returns',sc.r,w.r],['C','Cost',sc.c,w.c],['S','Steadiness',sc.s,w.s]].map(function(x){return '<div class="r"><span class="l">'+x[0]+'</span><div class="bar"><i style="width:'+(x[2]==null?0:Math.min(100,x[2]))+'%"></i></div><span class="v">'+(x[2]!=null?Math.round(x[2]):'—')+'</span></div><div class="sub2" style="margin:-2px 0 4px 32px">'+x[1]+(x[3]!=null?' · '+x[3]+'% of the score':'')+'</div>';}).join('')+'</div></div>';
  h+='<div class="sec"><h2>Returns</h2><span class="hint">fund vs category average</span></div><div class="lst"><div class="lr h"><div class="nm">Window</div><div class="v">Fund</div><div class="v">Category</div></div>'
   +[['1m','1 month'],['6m','6 months'],['1y','1 year'],['3y','3 years'],['5y','5 years']].map(function(x){ var fv=rt[x[0]], cv=ca[x[0]]; return '<div class="lr"><div class="nm">'+x[1]+((x[0]==='3y'&&d.ret_3y_state&&d.ret_3y_state!=='value')||(x[0]==='5y'&&d.ret_5y_state&&d.ret_5y_state!=='value')?'<small> · too young</small>':'')+'</div><div class="v '+cls(fv)+'">'+pct(fv,1)+'</div><div class="v" style="color:var(--muted)">'+(cv!=null?pct(cv,1):'—')+'</div></div>'; }).join('')+'</div>';
  h+='<div class="strip"><div><div class="k">Expense</div><div class="v '+(d.er!=null&&d.cat_er!=null&&d.er>d.cat_er?'neg':'')+'">'+(d.er!=null?f2(d.er)+'%':'—')+'</div><div class="k2">cat '+(d.cat_er!=null?f2(d.cat_er)+'%':'—')+'</div></div><div><div class="k">Size</div><div class="v">'+cr(d.aum)+'</div><div class="k2">cat avg '+cr(d.cat_aum)+'</div></div><div><div class="k">Holdings GVM</div><div class="v '+((d.portfolio_gvm||0)>=7?'gd':'')+'">'+f1(d.portfolio_gvm)+'</div><div class="k2">'+(d.gvm_coverage!=null?f1(d.gvm_coverage)+'% seen':'not enough seen')+'</div></div><div><div class="k">Since</div><div class="v">'+esc(dm(d.inception))+'</div><div class="k2">'+esc(d.plan||'')+'</div></div></div>';
  if((d.flags||[]).length) h+='<div class="lst" style="margin-top:10px">'+d.flags.map(function(f){return '<div class="row dn"><div><div class="nm">'+esc(f.kind==='cost'?'Costly':'Small')+'</div><div class="sub">'+esc(f.text)+'</div></div><div class="v"></div></div>';}).join('')+'</div>';
  h+='<div class="card"><div class="ch"><span class="t">NAV · about a year</span></div>'+((d.nav||[]).length>1?navChart(d.nav):'<div class="sub2">No NAV history on record.</div>')+'</div>';
  var segs=d.segments||[], cols=[tok('--brand'),tok('--wayfind'),tok('--muted'),tok('--gold-lo'),tok('--label'),tok('--win'),tok('--loss'),tok('--accent'),tok('--gold-hi'),tok('--ink')];
  h+='<div class="card"><div class="ch"><span class="t">Where it sits</span><span class="n">'+(d.resolved_pct!=null?f1(d.resolved_pct)+'% of the book matched':'')+'</span></div><div class="mix">'+segs.map(function(s,i){return '<i style="width:'+s.pct+'%;background:'+cols[i%cols.length]+'"></i>';}).join('')+'</div><div class="mixl">'+segs.slice(0,6).map(function(s,i){return '<span><i class="dot" style="background:'+cols[i%cols.length]+'"></i><b>'+f1(s.pct)+'%</b> '+esc(s.segment)+(s.gvm!=null?' <span style="color:var(--muted)">'+f1(s.gvm)+'</span>':'')+'</span>';}).join('')+'</div></div>';
  var hs=d.holdings||[];
  h+='<div class="sec"><h2>Top holdings</h2><span class="hint">'+hs.length+' of '+(d.holdings_total||0)+' · with GVM</span></div>';
  h+= hs.length ? '<div class="lst">'+hs.map(function(x){return '<a class="row '+((x.gvm||0)>=7?'up':((x.gvm||0)&&x.gvm<6?'dn':'mu'))+'" href="'+(x.symbol?'/m/check?sym='+encodeURIComponent(x.symbol):'#')+'"><div><div class="nm">'+esc(x.symbol||x.name)+'</div><div class="sub">'+esc(x.symbol?x.name:'')+(x.segment?' · '+esc(x.segment):'')+(x.verdict?' · '+esc(x.verdict):'')+'</div></div><div class="v"><div class="n">'+f1(x.weight)+'%</div><div class="c">'+(x.gvm!=null?'GVM '+f2(x.gvm):'no score')+'</div></div></a>';}).join('')+'</div>' : '<div class="emp"><b>No holdings on record</b>The look-through has not been captured for this fund.</div>';
  var pe=d.peers||[];
  h+='<div class="sec"><h2>Peers by score</h2><span class="hint">same category</span></div>';
  h+= pe.length ? '<div class="lst">'+pe.map(function(p){return '<a class="row '+(p.self?'up':'mu')+'" href="/m/mf?code='+encodeURIComponent(p.code)+'"><div><div class="nm">'+esc(p.name)+(p.self?'<span class="tag g">this fund</span>':'')+'</div><div class="sub">1y '+pct(p.ret_1y,1)+'</div></div><div class="v"><div class="n">'+(p.mqs!=null?Math.round(p.mqs):'—')+'</div><div class="c">score</div></div></a>';}).join('')+'</div>' : '<div class="emp">No peer scored in this category.</div>';
  h+='<div class="note"><b>Read it with the coverage.</b> The holdings quality is only as good as how much of the fund we can see. Returns are point-to-point, not annualised for windows under a year. Research, not a recommendation.</div>';
  document.getElementById('body').innerHTML=h;
}
if(Q.code){
  fetch('/api/mobile/mf_app/fund?code='+encodeURIComponent(Q.code),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; } renderFund(d); }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the fund.</div>'; });
} else load();
</script>
</body></html>
