<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Check · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<link rel="stylesheet" href="/static/scorr_themes.css">
<style>
/* ══ APP_QA_R5 P8 · /m/check MIGRATION ═══════════════════════════════════════════════
   Refs: scorr_sprint2_goldnight_R1 @ cd75e2c (scale) + scorr_appshell_R1 @ a20ae0d (shell).
   The .screen scope issue is present here too (checked, same as P7): mobile_app.css declares the
   palette on `.screen,.bnav`, so body tokens are shadowed for page content without this bridge.
   No legacy palette hex on this page — cc#897 folded its CSS into the shared sheet. */
body[data-theme]{
  --t-field:var(--field); --t-panel:var(--panel); --t-hi:var(--hi); --t-edge:var(--edge);
  --t-ink:var(--ink); --t-muted:var(--muted); --t-win:var(--win); --t-loss:var(--loss);
  --t-brand:var(--brand); --t-accent:var(--accent); --t-label:var(--label);
}
.screen,.bnav{
  --bg:var(--t-field); --panel:var(--t-panel); --panel2:var(--t-hi);
  --line:var(--t-edge); --line2:var(--t-edge);
  --txt:var(--t-ink); --mut:var(--t-muted); --dim:var(--t-muted);
  --grn:var(--t-win); --red:var(--t-loss);
  --blu:var(--t-accent); --cyan:var(--t-brand);
}
/* raised scale, goldnight ref — 9.5px floor, page-scoped */
.bnav .bn{font-size:var(--type-11)}
.bnav .bn .i{font-size:var(--type-16)}
.bnav .bn.on{color:var(--t-brand);text-shadow:0 0 10px var(--brandglow)}
.tool{font-size:var(--type-12)}
.tool span{font-size:var(--type-19);text-shadow:0 0 10px var(--brandglow)}
</style>
<script src="/scorr_card_common.js"></script>
<script src="/scorr_card_strip.js"></script>
<script src="/scorr_chart_card.js"></script>
<script src="/scorr_analysis_card.js"></script>
<script src="/results_card.js"></script>
<script src="/scorr_cockpit_card.js"></script>
</head>
<body data-theme="goldnight">
<!-- APP_QA_R5 P8: goldnight forced before first paint; stored key read and KEPT. -->
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){/* cc#1119: the sprint gate is lifted for the two DARK themes. Only goldnight and dark are
     applied; a stored goldday is KEPT and simply not used, so nothing is rewritten by omission and
     White-Golden ships the day its 44 missing light values are specified. */}}catch(e){}
document.body.setAttribute('data-theme',(t==='dark'||t==='goldnight')?t:'goldnight');})();</script>
<div class="screen">
  <div class="head" style="display:flex;align-items:center;gap:12px">
    <a href="/m/home" aria-label="Scorr home" style="min-width:44px;min-height:44px;display:flex;
       align-items:center;text-decoration:none;color:var(--txt);font-weight:800;font-size:17px;
       letter-spacing:-.4px">SC<span style="color:var(--grn)">O</span>RR</a>
    <div style="flex:1;min-width:0">
    <h1>Trade Check</h1>
    <div class="s" id="sub">score the trade before you take it</div></div>
  </div>

  <div class="inrow">
    <div class="sfld"><span style="color:var(--dim)">&#9906;</span>
      <input id="q" type="search" placeholder="Search a symbol" autocomplete="off"></div>
    <div class="tog">
      <button class="tg on" id="tgL" type="button" onclick="setSide('LONG')">LONG</button>
      <button class="tg" id="tgS" type="button" onclick="setSide('SHORT')">SHORT</button>
    </div>
  </div>

  <div id="stale"></div>
  <div class="body" id="body"><div class="loading">Loading verdicts…</div></div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn on" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
var STATE = { side: 'LONG', open: 0 };

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function n1(v){ return (v == null || isNaN(Number(v))) ? '--' : Number(v).toFixed(1); }
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN');
}
function vColor(v){
  v = (v || '').toUpperCase();
  if (v.indexOf('STRONG') > -1) return 'var(--grn)';
  if (v.indexOf('VALID') > -1) return 'var(--blu)';
  return 'var(--amber)';
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(r.state) + '</span>';
}
function strip(sym){
  /* full web C·A·R·D popups, compact size — shared component, rule cc#789 */
  try { if (window.ScorrCardRow) return window.ScorrCardRow(sym); } catch(e) {}
  return '';
}
function gaps(x){
  if (!x.not_passed) return [];
  return String(x.not_passed).split(',').map(function(s){ return s.trim(); }).filter(Boolean);
}
function card(x, i, open){
  var gp = gaps(x);
  var short_ = (x.side || '').toUpperCase() === 'SHORT';
  /* cc#1090 P5: the verdict card takes the shell, dense. It is tappable — toggle() opens the gap
     list — and the endpoint serves up to 50 rows with 20 as the default, so it is past the 8-row
     line the modifier exists for. --vc is untouched: the verdict rail is the score language. */
  var h = '<div class="v slab dense" style="--vc:' + vColor(x.verdict) + '" onclick="toggle(event,' + i + ')">'
    + '<div class="v1"><span class="vsym">' + esc(x.symbol) + '</span>'
    + '<span class="vside' + (short_ ? ' sh' : '') + '">' + esc(x.side || '') + '</span>'
    + strip(x.symbol)
    + '<span class="vpx">CMP ' + px(x.cmp)
    + (x.computed_at ? ' \u00b7 ' + esc(x.computed_at) : '') + '</span></div>'
    + '<div class="v2"><span class="word">' + esc((x.verdict || '--').toUpperCase()) + '</span>'
    + '<span class="score">' + n1(x.score) + '</span></div>'
    + '<div class="counts">'
    + (gp.length ? '<span class="ct f">' + gp.length + ' GAP' + (gp.length > 1 ? 'S' : '') + '</span>'
                 : '<span class="ct p">NO GAPS</span>')
    + (x.pivot_zone ? '<span class="ct">' + esc(x.pivot_zone) + '</span>' : '')
    + '</div></div>';
  if (open){
    h += gp.map(function(r){
      return '<div class="g"><span class="gv">Not passed: <b>' + esc(r) + '</b></span></div>';
    }).join('');
    h += gp.length
      ? '<div class="pass1">gaps first — everything else passed</div>'
      : '<div class="pass1">every rule passed — nothing to read</div>';
  }
  return h;
}
function render(d){
  var rs = d.results || [];
  document.getElementById('sub').innerHTML =
    d.count + ' verdicts \u00b7 ' + (d.query ? 'both sides' : esc(STATE.side)) + ' ' + railHtml(d.rail);
  var f = d.freshness || {};
  document.getElementById('stale').innerHTML = f.stale
    ? '<div style="margin:11px 12px 0;padding:10px 12px;border-radius:11px;'
      + 'background:rgba(245,185,74,.10);border:1px solid rgba(245,185,74,.4);'
      + 'color:var(--amber);font-size:11.5px;font-weight:700;line-height:1.5">'
      + '&#9888; ' + esc(f.note || 'Verdicts are stale.') + '</div>'
    : '';
  document.getElementById('body').innerHTML = rs.length
    ? '<div class="sect">THE VERDICT \u00b7 GAPS FIRST</div>'
      + rs.map(function(x, i){ return card(x, i, i === STATE.open); }).join('')
    : '<div class="empty"><b>Nothing found</b>No cached verdict for "' + esc(d.query || '') + '".</div>';
  window.__rows = rs;
}
function toggle(ev, i){
  if (ev && ev.target && ev.target.closest && ev.target.closest('.scorr-card-strip')) return;
  STATE.open = (STATE.open === i ? -1 : i); render(window.__d);
}
function setSide(s){
  STATE.side = s; STATE.open = 0;
  document.getElementById('tgL').className = 'tg' + (s === 'LONG' ? ' on' : '');
  document.getElementById('tgS').className = 'tg' + (s === 'SHORT' ? ' on sh' : '');
  load(document.getElementById('q').value.trim());
}
function load(q){
  document.getElementById('body').innerHTML = '<div class="loading">Loading verdicts…</div>';
  fetchWithTimeout('/api/mobile/check?limit=12&side=' + STATE.side
      + (q ? '&symbol=' + encodeURIComponent(q) : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      window.__d = d; STATE.open = 0; render(d);
    })
    .catch(function(e){
      document.getElementById('body').innerHTML =
        '<div class="empty"><b>Could not load</b>' + esc(e.message)
        + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
      document.getElementById('sub').textContent = 'failed to load';
    });
}
var t = null;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(t); var v = e.target.value.trim();
  t = setTimeout(function(){ load(v); }, 300);
});
load('');
</script>
</body>
</html>
