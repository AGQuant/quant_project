<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* the web tab's renderMd (scorr_news.html), verbatim in shape: marked when present, escaped paragraphs otherwise */
function renderMd(t){
  if(!t) return '';
  if(window.marked && marked.parse){ try{ if(marked.setOptions) marked.setOptions({breaks:true, gfm:true}); return marked.parse(String(t)); }catch(e){} }
  return '<p>'+esc(t).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
}
var D=null, CAT='all', MD={};
/* cc#2051: Q is the lowercase, trimmed search term; SRCH_OPEN toggles the icon<->input state in
   the .sec row. Matching rule reused verbatim from scorr_news.html's applyKbFilters() -- lowercase
   substring against title+summary, ANDed with the category chip -- do not invent a second rule. */
var Q='', SRCH_OPEN=false, _learnSearchDeb=null;
/* difficulty -> tag colour class, keyed on the endpoint's OWN difficulty_counts order (no name list here):
   the levels are ranked by their position in that object as served — first = entry level */
function diffCls(d){
  var keys = Object.keys((D && D.difficulty_counts) || {});
  var i = keys.indexOf(d);
  return i < 0 ? '' : ('d' + Math.min(3, i + 1));
}
function chipsHtml(){
  var counts = (D && D.category_counts) || {};
  var cats = Object.keys(counts).sort(function(a,b){ return (counts[b]-counts[a]) || a.localeCompare(b); });   /* registry-derived: the endpoint's own keys, biggest first */
  var h = '<span class="chip'+(CAT==='all'?' on':'')+'" data-c="all">All<b>'+esc(D.total)+'</b></span>';
  cats.forEach(function(c){ h += '<span class="chip'+(CAT===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'<b>'+esc(counts[c])+'</b></span>'; });
  return h;
}
function artHtml(a){
  return '<div class="c slab dense art" data-slug="'+esc(a.slug)+'">'
    + '<div class="t">'+esc(a.title)+'</div>'
    + '<div class="meta"><span class="tag">'+esc(a.category)+'</span>'
    + (a.difficulty ? '<span class="tag '+diffCls(a.difficulty)+'">'+esc(a.difficulty)+'</span>' : '')
    + '<span>'+(a.reading_time_min!=null ? esc(a.reading_time_min)+' min read' : '')+'</span></div>'
    + (a.summary ? '<div class="sum">'+esc(a.summary)+'</div>' : '')
    + '<div class="more">Read</div><div class="body"></div></div>';
}
/* cc#2051: CAT + Q combine exactly like web's kbCat + kbSearch -- search narrows WITHIN the
   active category, never a separate category-blind search. */
function filteredRows(){
  return (D.articles || []).filter(function(a){
    if (CAT!=='all' && a.category!==CAT) return false;
    if (Q){ var hay=((a.title||'')+' '+(a.summary||'')).toLowerCase(); if (hay.indexOf(Q)<0) return false; }
    return true;
  });
}
function resultsHtml(rows){
  return rows.length ? '<div class="lst" id="lst">'+rows.map(artHtml).join('')+'</div>'
    : '<div class="emp"><b>Nothing here yet</b>'+(Q ? 'No article matches this search.' : 'No article in this category has been published.')+'</div>';
}
function secRowHtml(rows){
  var title = CAT==='all' ? 'All articles' : esc(CAT);
  var right = '<span class="hint">'+rows.length+(Q ? ' match' : ' · newest first')+'</span>';
  right += SRCH_OPEN
    ? ('<span class="sec-srch"><input type="text" id="learnSearch" placeholder="Search…" autocomplete="off" value="'+esc(Q)+'">'
       + '<button class="sec-x'+(Q?' on':'')+'" type="button" aria-label="Clear search" onclick="clearLearnSearch()">&times;</button></span>')
    : '<button class="sec-ic" type="button" aria-label="Search articles" onclick="openLearnSearch()">⌕</button>';
  return '<div class="sec"><h2>'+title+'</h2><div class="sec-r">'+right+'</div></div>';
}
/* Re-renders ONLY the count text + the result list -- never the .sec row's own <input>. This is
   what the debounced keystroke handler calls: rebuilding the whole row on every keystroke (the
   way draw() does for a chip click) would recreate the <input> and drop focus/caret mid-type. */
function renderLearnList(){
  var rows = filteredRows();
  var hintEl = document.querySelector('.sec .hint');
  if (hintEl) hintEl.textContent = rows.length + (Q ? ' match' : ' · newest first');
  var host = document.getElementById('learnResults');
  if (host) host.innerHTML = resultsHtml(rows);
  var lst = document.getElementById('lst');
  if (lst) lst.addEventListener('click', function(e){ var c=e.target.closest('.art'); if(!c) return; openArt(c); });
}
function openLearnSearch(){ SRCH_OPEN = true; draw(); }
/* mirrors web's clearKbSearch(): clears the term and refocuses, does NOT collapse the box back
   to the icon -- same as web's search box never hiding itself once in view. */
function clearLearnSearch(){
  Q = '';
  var si = document.getElementById('learnSearch'); if (si) si.value = '';
  var xb = document.querySelector('.sec-x'); if (xb) xb.classList.remove('on');
  renderLearnList();
  if (si) si.focus();
}
function draw(){
  var rows = filteredRows();
  var h = galaxyBannerHtml();
  h += '<div class="chips" id="chips">'+chipsHtml()+'</div>';
  h += secRowHtml(rows);
  h += '<div id="learnResults">'+resultsHtml(rows)+'</div>';
  h += '<div class="note"><b>Knowledge Hub.</b> The same articles as the Learn tab on the web Intel page. Tap a card to read it in place.</div>';
  document.getElementById('asof').innerHTML = '<b>'+esc(D.total)+'</b> articles · '+Object.keys(D.category_counts||{}).length+' categories';
  document.getElementById('body').innerHTML = h;
  drawGalaxyThumb();
  document.getElementById('chips').addEventListener('click', function(e){ var s=e.target.closest('[data-c]'); if(!s) return; CAT=s.getAttribute('data-c'); draw(); });
  var lst = document.getElementById('lst');
  if (lst) lst.addEventListener('click', function(e){ var c=e.target.closest('.art'); if(!c) return; openArt(c); });
  if (SRCH_OPEN){
    var si = document.getElementById('learnSearch');
    if (si){
      si.focus();
      var vlen = si.value.length; si.setSelectionRange(vlen, vlen);   /* caret at end, not a full re-select */
      si.addEventListener('input', function(){
        var v = si.value;
        var xb = document.querySelector('.sec-x'); if (xb) xb.classList.toggle('on', !!v);   /* instant, not debounced -- matches web's own kbClear toggle */
        clearTimeout(_learnSearchDeb);
        _learnSearchDeb = setTimeout(function(){ Q = v.trim().toLowerCase(); renderLearnList(); }, 180);   /* debounce matches web's 180ms */
      });
    }
  }
}

    + '<div class="kb-galaxy-ttl">✦ Knowledge Galaxy</div>'
    + '<div class="kb-galaxy-sub">'+esc(D.total)+' articles · '+esc(Object.keys(D.category_counts||{}).length)+' topics · explore the learning map</div>'
    + '<button class="kb-galaxy-btn" type="button" onclick="event.stopPropagation();openGalaxy()">View Learning Map</button>'
    + '</div></div>';
}
function drawGalaxyThumb(){
  var cv = document.getElementById('kbGalaxyThumb'); if(!cv || !D || !(D.articles||[]).length) return;
  var w = cv.clientWidth||300, h=120, dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=w*dpr; cv.height=h*dpr; var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#070b1a'; g.fillRect(0,0,w,h);
  var rg=g.createRadialGradient(w/2,h*0.4,0,w/2,h*0.4,w*0.7); rg.addColorStop(0,'rgba(30,45,90,.5)'); rg.addColorStop(1,'rgba(7,11,26,0)');
  g.fillStyle=rg; g.fillRect(0,0,w,h);
  var arts=D.articles, n=Math.min(arts.length,60);
  for(var i=0;i<n;i++){ var a=arts[i]; var seed=(i*2654435761+101)>>>0;
    var cx=(seed%1000)/1000*w, cy=((seed>>>10)%1000)/1000*h;
    var col=CAT_COLORS[a.category]||'#60a5fa'; var r=a.difficulty==='Pro'?2.6:1.7;
    g.globalAlpha=.85; g.fillStyle=col; g.beginPath(); g.arc(cx,cy,r,0,6.283); g.fill(); }
  g.globalAlpha=1;
}
function buildGalaxyConfig(){
  var seen={}; (D.articles||[]).forEach(function(a){ if(a.category) seen[a.category]=1; });
  var cats=Object.keys(seen).sort().map(function(c){ return {name:c,color:CAT_COLORS[c]||'#8ca6e6'}; });
  var nodes=(D.articles||[]).map(function(a){ return {
    id:a.slug, label:a.title, category:a.category,
    tier:(a.difficulty==='Pro'?'pro':'beginner'),
    sublabel:(a.reading_time_min?a.reading_time_min+' min read':''),
    payload:a }; });
  return {nodes:nodes, categories:cats, cacheKey:'knowledge', layout:'force'};
}
function loadGalaxyScript(cb){
  if(window.GalaxyMap){ cb(); return; }
  var s=document.createElement('script'); s.src='/galaxy_map.js?v=203'; s.onload=cb;
  s.onerror=function(){ alert('Could not load the galaxy map.'); };
  document.head.appendChild(s);
}
function ensureGalaxyOverlay(){
  if(document.getElementById('galaxyOverlay')) return;
  var o=document.createElement('div'); o.className='galaxy-overlay'; o.id='galaxyOverlay';
  o.innerHTML =
    '<div class="galaxy-canvas" id="galaxyCanvas"></div>'+
    '<div class="galaxy-topbar">'+
      '<div class="galaxy-title">✦ Knowledge Galaxy <span class="galaxy-count" id="galaxyCount"></span></div>'+
      '<button class="galaxy-close" onclick="closeGalaxy()" aria-label="Close">&times;</button>'+
    '</div>'+
    '<div class="galaxy-hint">drag to pan · scroll / pinch to zoom · tap a star to read</div>'+
    '<div class="galaxy-article" id="galaxyArticle">'+
      '<div class="ga-grab"></div>'+
      '<div class="ga-head"><div class="ga-chips" id="gaChips"></div><button class="ga-x" onclick="hideGalaxyArticle()" aria-label="Close">&times;</button></div>'+
      '<div class="ga-scroll" id="gaScroll"></div>'+
    '</div>';
  document.body.appendChild(o);
}
function openGalaxy(){
  if(!D || !(D.articles||[]).length) return;
  ensureGalaxyOverlay();
  document.getElementById('galaxyOverlay').classList.add('on');
  document.documentElement.style.overflow='hidden';
  loadGalaxyScript(function(){
    var host=document.getElementById('galaxyCanvas');
    if(_galaxy){ _galaxy.destroy(); _galaxy=null; }
    host.innerHTML='';
    _galaxy = GalaxyMap.create(host, buildGalaxyConfig(), {
      onTap: function(nd){ openGalaxyArticle(nd.payload); }
    });
    console.assert(_galaxy._nodes.length === D.total,
      'Knowledge Galaxy: '+_galaxy._nodes.length+' stars vs api.total '+D.total);
    var gb=document.getElementById('galaxyCount'); if(gb) gb.textContent=D.total+' articles';
  });
}
function closeGalaxy(){
  if(document.getElementById('galaxyArticle') && document.getElementById('galaxyArticle').classList.contains('on')){ hideGalaxyArticle(); return; }
  var ov=document.getElementById('galaxyOverlay'); if(ov) ov.classList.remove('on');
  document.documentElement.style.overflow='';
}
/* tapping a star opens the full article IN PLACE (no navigation) -- the galaxy instance is never
   destroyed on this path, so zoom/pan state survives closing the article panel. Reuses the SAME
   MD cache and renderMd() this file's own openArt() already uses -- no second cache, and an
   article read via the card list is already warm here (and vice versa). */
function openGalaxyArticle(a){
  var panel=document.getElementById('galaxyArticle'); if(!panel) return;
  var slug=a.slug;
  var diff = a.difficulty ? '<span class="gd-diff '+(a.difficulty==='Pro'?'pro':'beg')+'">'+esc(a.difficulty)+'</span>' : '';
  var rt = a.reading_time_min ? '<span class="gd-rt">'+esc(a.reading_time_min)+' min read</span>' : '';
  document.getElementById('gaChips').innerHTML = '<span class="gd-cat">'+esc(a.category||'')+'</span>'+diff+rt;
  var sc=document.getElementById('gaScroll');
  sc.innerHTML = '<h1 class="ga-title">'+esc(a.title||'')+'</h1>'+
                 (a.summary?'<p class="ga-sum">'+esc(a.summary)+'</p>':'')+
                 '<div class="ga-body">'+(MD[slug] != null ? MD[slug] : 'Loading…')+'</div>';
  sc.scrollTop=0;
  panel.classList.add('on');
  if (MD[slug] != null) return;   /* already cached by openArt() or a prior galaxy visit -- no re-fetch */
  fetch('/api/knowledge/articles/'+encodeURIComponent(slug), {credentials:'same-origin'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    var md = d.content_md || '';
    MD[slug] = md.trim() ? renderMd(md) : '<p class="ga-soon">Full article coming soon.</p>';
    var body = sc.querySelector('.ga-body'); if (body) body.innerHTML = MD[slug];
  }).catch(function(e){
    var body = sc.querySelector('.ga-body'); if (body) body.innerHTML = '<p class="ga-soon">Could not load this article ('+esc(e.message||e)+').</p>';
  });
}
function hideGalaxyArticle(){ var p=document.getElementById('galaxyArticle'); if(p) p.classList.remove('on'); }
function openArt(card){
  var slug = card.getAttribute('data-slug'), body = card.querySelector('.body'), more = card.querySelector('.more');
  if (card.classList.contains('open')){ card.classList.remove('open'); if(more) more.textContent='Read'; return; }
  card.classList.add('open'); if(more) more.textContent='Close';
  if (MD[slug] != null){ body.innerHTML = MD[slug]; return; }
  body.innerHTML = '<div class="err">Loading…</div>';
  fetch('/api/knowledge/articles/'+encodeURIComponent(slug), {credentials:'same-origin'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    var md = d.content_md || '';
    MD[slug] = md.trim() ? renderMd(md) : '<p class="err">Full article coming soon.</p>';
    body.innerHTML = MD[slug];
  }).catch(function(e){ body.innerHTML = '<div class="err">Could not load this article ('+esc(e.message||e)+').</div>'; });
}
function load(){
  fetch('/api/knowledge/articles?limit=500', {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
    D=d; draw();
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the Knowledge Hub.</div>'; });
}
load();
</script>
</body></html>
