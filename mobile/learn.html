.lst{margin:var(--space-10) var(--space-16) 0}

.art .t{font-size:var(--type-125);font-weight:800;line-height:1.35}

.art .body blockquote{margin:0 0 var(--space-8);padding-left:var(--space-10);border-left:var(--bw-3) solid var(--edge);color:var(--muted)}
.art .body table{border-collapse:collapse;width:100%;font-size:var(--type-11)}.art .body td,.art .body th{border:var(--bw-1) solid var(--edge);padding:var(--space-4) var(--space-6);text-align:left}

.note{margin:var(--space-22) var(--space-16) var(--space-8);padding:var(--space-12) var(--space-14);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--muted);line-height:1.65}.note b{color:var(--ink)}

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* the web tab's renderMd (scorr_news.html), verbatim in shape: marked when present, escaped paragraphs otherwise */
function renderMd(t){
  if(!t) return '';
  if(window.marked && marked.parse){ try{ if(marked.setOptions) marked.setOptions({breaks:true, gfm:true}); return marked.parse(String(t)); }catch(e){} }
  return '<p>'+esc(t).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
}
var D=null, CAT='all', MD={};
/* difficulty -> tag colour class, keyed on the endpoint's OWN difficulty_counts order (no name list here):
   the levels are ranked by their position in that object as served — first = entry level */
function diffCls(d){
  var keys = Object.keys((D && D.difficulty_counts) || {});
  var i = keys.indexOf(d);
  return i < 0 ? '' : ('d' + Math.min(3, i + 1));
}
function chipsHtml(){
  var counts = (D && D.category_counts) || {};
  var cats = Object.keys(counts).sort(function(a,b){ return (counts[b]-counts[a]) || a.localeCompare(b); });   /* registry-derived: the endpoint's own keys, biggest first */
  var h = '<span class="chip'+(CAT==='all'?' on':'')+'" data-c="all">All<b>'+esc(D.total)+'</b></span>';
  cats.forEach(function(c){ h += '<span class="chip'+(CAT===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'<b>'+esc(counts[c])+'</b></span>'; });
  return h;
}
function artHtml(a){
  return '<div class="c slab dense art" data-slug="'+esc(a.slug)+'">'
    + '<div class="t">'+esc(a.title)+'</div>'
    + '<div class="meta"><span class="tag">'+esc(a.category)+'</span>'
    + (a.difficulty ? '<span class="tag '+diffCls(a.difficulty)+'">'+esc(a.difficulty)+'</span>' : '')
    + '<span>'+(a.reading_time_min!=null ? esc(a.reading_time_min)+' min read' : '')+'</span></div>'
    + (a.summary ? '<div class="sum">'+esc(a.summary)+'</div>' : '')
    + '<div class="more">Read</div><div class="body"></div></div>';
}
function draw(){
  var rows = (D.articles || []).filter(function(a){ return CAT==='all' || a.category===CAT; });
  var h = '<div class="chips" id="chips">'+chipsHtml()+'</div>';
  h += '<div class="sec"><h2>'+(CAT==='all'?'All articles':esc(CAT))+'</h2><span class="hint">'+rows.length+' · newest first</span></div>';
  h += rows.length ? '<div class="lst" id="lst">'+rows.map(artHtml).join('')+'</div>' : '<div class="emp"><b>Nothing here yet</b>No article in this category has been published.</div>';
  h += '<div class="note"><b>Knowledge Hub.</b> The same articles as the Learn tab on the web Intel page. Tap a card to read it in place.</div>';
  document.getElementById('asof').innerHTML = '<b>'+esc(D.total)+'</b> articles · '+Object.keys(D.category_counts||{}).length+' categories';
  document.getElementById('body').innerHTML = h;
  document.getElementById('chips').addEventListener('click', function(e){ var s=e.target.closest('[data-c]'); if(!s) return; CAT=s.getAttribute('data-c'); draw(); });
  var lst = document.getElementById('lst');
  if (lst) lst.addEventListener('click', function(e){ var c=e.target.closest('.art'); if(!c) return; openArt(c); });
}
function openArt(card){
  var slug = card.getAttribute('data-slug'), body = card.querySelector('.body'), more = card.querySelector('.more');
  if (card.classList.contains('open')){ card.classList.remove('open'); if(more) more.textContent='Read'; return; }
  card.classList.add('open'); if(more) more.textContent='Close';
  if (MD[slug] != null){ body.innerHTML = MD[slug]; return; }
  body.innerHTML = '<div class="err">Loading…</div>';
  fetch('/api/knowledge/articles/'+encodeURIComponent(slug), {credentials:'same-origin'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    var md = d.content_md || '';
    MD[slug] = md.trim() ? renderMd(md) : '<p class="err">Full article coming soon.</p>';
    body.innerHTML = MD[slug];
  }).catch(function(e){ body.innerHTML = '<div class="err">Could not load this article ('+esc(e.message||e)+').</div>'; });
}
function load(){
  fetch('/api/knowledge/articles?limit=500', {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
    D=d; draw();
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the Knowledge Hub.</div>'; });
}
load();
</script>
