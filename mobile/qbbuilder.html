    if(d.error){ BTMSG=d.error+(d.errors?' — '+d.errors.join('; '):''); out.textContent=BTMSG; return; }
    var id=d.backtest_id; if(POLL) clearInterval(POLL);
    var tick=function(){ api('/api/v12/backtest/'+id).then(function(b){ if(b.status==='done'){ clearInterval(POLL); BT=b.result||{}; BTMSG=''; out.textContent=''; document.getElementById('bt-res').innerHTML=btHtml(BT); } else if(b.status==='error'||b.error){ clearInterval(POLL); BTMSG='Backtest failed: '+(b.error||''); out.textContent=BTMSG; } else { BTMSG='Running… '+(b.status||''); out.textContent=BTMSG; } }); };
    if(d.status==='done') tick(); else { POLL=setInterval(tick, 3000); tick(); }
  }).catch(function(){ BTMSG='Could not start the backtest.'; out.textContent=BTMSG; });
}
function save(){ var out=document.getElementById('save-out'); if(!NAME){ SAVEMSG='Give the basket a name first.'; out.textContent=SAVEMSG; return; } SAVEMSG='Saving…'; out.textContent=SAVEMSG;
  api('/api/v12/basket',{method:'POST',body:{name:NAME, definition:buildDefinition(), status:'draft'}}).then(function(d){
    if(d.error){ SAVEMSG=d.error+(d.errors?' — '+d.errors.join('; '):''); out.textContent=SAVEMSG; return; }
    var msg='Saved as basket #'+d.id+' (draft).';
    if(U.sel.length){ return api('/api/qb/universe2/save',{method:'POST',body:{basket_name:NAME, def_name:'default', pools:U.sel.slice(), filters:defRows(), as_of_score_date:(U.last&&U.last.as_of_date)||null, preview_count:(U.last?U.last.count:null)}}).then(function(u){ SAVEMSG=msg+(u.error?' Universe not saved — '+u.error:' Universe saved under the same name ('+(u.pools||[]).join(' + ')+', '+(u.filters_saved!=null?u.filters_saved:defRows().length)+' filters).'); out.textContent=SAVEMSG; }); }
    SAVEMSG=msg+' No pool was picked, so no universe definition was saved.'; out.textContent=SAVEMSG;
  }).catch(function(){ SAVEMSG='Could not save.'; out.textContent=SAVEMSG; });
}
/* ── shell ── */
function seg(id, fn){ var el=document.getElementById(id); if(!el) return; el.addEventListener('click', function(e){ var s=e.target.closest('[data-v]'); if(!s) return; fn(s.getAttribute('data-v')); el.querySelectorAll('span').forEach(function(x){ x.classList.toggle('on', x===s); }); }); }
function tg(id, fn){ var el=document.getElementById(id); if(el) el.addEventListener('click', fn); }
function readStep(){ if(STEP===2) readStep2(); else if(STEP===3) readStep3(); else if(STEP===4) readStep4(); }
function draw(){
  var h=steps();
  if(STEP===1) h+=step1(); else if(STEP===2) h+=step2(); else if(STEP===3) h+=step3(); else h+=step4();
  h+='<div class="navrow">'+(STEP>1?'<button class="btn2" id="b-back">‹ Back</button>':'<button class="btn2" id="b-home">‹ My baskets</button>')+(STEP<4?'<button class="btn" id="b-next">Next ›</button>':'')+'</div>';
  h+='<div class="note"><b>What a backtest is.</b> A walk through the last five years applying this rule as written, on today\'s universe. Survivorship inflates the numbers; the ranking of rules is the finding, not the absolute return. Nothing here is a recommendation.</div>';
  document.getElementById('body').innerHTML=h;
  document.getElementById('asof').innerHTML='Step <b>'+STEP+' of 4</b>'+(U.last&&U.last.count!=null&&U.sel.length?' · universe '+fmtN(U.last.count)+' names':'');
  document.querySelectorAll('.steps span').forEach(function(s){ s.addEventListener('click', function(){ readStep(); STEP=Number(s.getAttribute('data-step')); draw(); window.scrollTo(0,0); }); });
  var b=function(id,fn){ var el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  b('b-next', function(){ readStep(); STEP++; draw(); window.scrollTo(0,0); }); b('b-back', function(){ readStep(); STEP--; draw(); window.scrollTo(0,0); }); b('b-home', function(){ STEP=0; home(); });
  if(STEP===1) bindStep1(); else if(STEP===2) bindStep2(); else if(STEP===3) bindStep3(); else bindStep4();
}
function loadUniverseData(){ if(U.pools.length) return; api('/api/qb/universe2/pools').then(function(d){ U.pools=d.pools||[]; if(STEP===1) draw(); }).catch(function(){}); api('/api/qb/universe2/coverage').then(function(d){ U.coverage=(d&&d.windows)?d:null; if(STEP===1) draw(); }).catch(function(){}); api('/api/qb/universe2/segments').then(function(d){ U.segments=d.segments||[]; }).catch(function(){}); }
function home(){
  Promise.all([api('/api/v12/basket'), api('/api/v12/presets')]).then(function(rs){
    var bk=(rs[0].baskets||[]), pr=(rs[1].presets||rs[1]||[]);
    document.getElementById('asof').innerHTML='<b>'+bk.length+'</b> saved basket'+(bk.length===1?'':'s')+' · build a rule, test it, save it';
    var h='<a class="row up" href="#" id="b-new" style="margin:12px 16px 0;border:1px solid var(--edge);border-radius:14px;background:var(--panel)"><div><div class="nm">Build a new basket</div><div class="sub">Four steps: the universe (pools + filters), how names are picked, when they leave and how positions are sized, then test and save. The same rule object as the web builder.</div></div><div class="v"><div class="n gd">+</div></div></a>';
    if(Array.isArray(pr)&&pr.length){ h+='<div class="sec"><h2>Start from a Scorr rule</h2><span class="hint">locked presets</span></div><div class="lst">'+pr.map(function(p){ var pv=p.provenance||{}; return '<a class="row" href="#" data-preset="'+esc(p.id)+'"><div><div class="nm">'+esc(p.name)+'</div><div class="sub">'+esc(p.tagline||'')+(pv.cagr_pct!=null?' · <b>'+pct(pv.cagr_pct,1)+'</b> a year backtested':'')+'</div></div><div class="v"><div class="n gd">›</div></div></a>'; }).join('')+'</div>'; }
    h+='<div class="sec"><h2>My baskets</h2><span class="hint">'+bk.length+'</span></div>';
    h+= bk.length ? '<div class="lst">'+bk.map(function(b){ var d=b.definition||{}, e=d.entry||{}; return '<a class="row mu" href="#" data-open="'+b.id+'"><div><div class="nm">'+esc(b.name)+'<span class="tag">'+esc(b.status||'draft')+'</span></div><div class="sub">top '+esc(e.top_x||'—')+' by '+esc(e.roc_lookback||'—')+' momentum · '+esc((d.rebalance||{}).freq||'—')+(d.risk&&d.risk.sector_cap_pct!=null?' · sector cap '+d.risk.sector_cap_pct+'%':'')+'</div></div><div class="v"><div class="n gd">›</div></div></a>'; }).join('')+'</div>' : '<div class="emp"><b>No basket yet</b>Build one above. A saved basket is a rule and a test, not a live book.</div>';
    h+='<div class="note"><b>Paper only.</b> A saved basket is a rule and a test, not a live book. Turning it live is a founder step, not a button here.</div>';
    document.getElementById('body').innerHTML=h;
    document.getElementById('b-new').addEventListener('click', function(e){ e.preventDefault(); loadDef({}); U.sel=[]; ALL_FILTERS.forEach(function(f){ U.rows[f.key]=freshRow(f); }); U.last=null; NAME=''; BT=null; BTMSG=''; SAVEMSG=''; DEFMSG=''; STEP=1; loadUniverseData(); draw(); });
    document.querySelectorAll('[data-preset]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); var p=pr.filter(function(x){return x.id===a.getAttribute('data-preset');})[0]; if(p&&p.definition){ loadDef(p.definition); NAME=p.name+' (mine)'; } BT=null; BTMSG=''; SAVEMSG=''; STEP=1; loadUniverseData(); draw(); }); });
    document.querySelectorAll('[data-open]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); var b=bk.filter(function(x){return String(x.id)===a.getAttribute('data-open');})[0]; if(b){ loadDef(b.definition||{}); NAME=b.name; STEP=4; BT=null; BTMSG=''; SAVEMSG=''; loadUniverseData(); draw(); } }); });
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the builder.</div>'; });
}
window.qbb={def:buildDefinition, form:F, universe:U, query:buildQuery, rows:defRows, load:loadDef};
home();
</script>
