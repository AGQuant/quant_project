<!doctype html>
<!-- ══ mobile/aicio.html — AICIO V1 (cc#2171, Fable sprint AICIO_V1, 17-Sep-2026). A full-screen chat-like shell: the top three
     quarters hold ONE assistant bubble (no fake history), the bottom quarter is a swipeable rail of live cards + a composer.
     Data: GET /api/mobile/aicio_app/cards (registry AICIO_CARDS in aicio_app_mobile.py; each card calls the web's own function
     in-process). Chat / typing is VERSION 2 -- the Type button only focuses the field and shows a toast. Contract tokens only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<meta name="color-scheme" content="dark">
<title>AI CIO · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<link rel="stylesheet" href="/static/scorr_themes.css">
<link rel="stylesheet" href="/static/scorr_appshell.css">
<script src="/static/scorr_appshell.js" defer></script>
<style>
/* ai-* prefix throughout: mobile_app.css carries bare .c .v .row .chip .more .rail rules that restyle short names (cc#2155). */
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--field);overflow-x:hidden}
.ai{font-family:Sora,-apple-system,sans-serif;color:var(--ink);display:flex;flex-direction:column;height:70vh;overflow:hidden}
.ai-chat{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--space-12) var(--space-16) var(--space-8)}
.ai-bub{max-width:88%;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-16);border-top-left-radius:var(--radius-4);padding:var(--space-12) var(--space-14);position:relative;overflow:hidden}
.ai-bub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--bw-3);background:linear-gradient(180deg,var(--brand),transparent)}
.ai-who{font-size:var(--type-9);font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:var(--track-em12);margin-bottom:var(--space-5)}
.ai-msg{font-size:var(--type-135);font-weight:600;line-height:1.5}
.ai-asof{margin-top:var(--space-8);font-size:var(--type-10);color:var(--muted);line-height:1.5;letter-spacing:var(--track-em5)}
.ai-asof b{color:var(--ink);font-weight:700}
.ai-fd{display:inline-block;width:7px;height:7px;border-radius:var(--radius-4);background:var(--edge);vertical-align:middle;margin-right:var(--space-4)}
.ai-fd.ok{background:var(--win)}.ai-fd.bad{background:var(--loss)}
.ai-miss{margin-top:var(--space-6);font-size:var(--type-105);color:var(--muted);line-height:1.5}
.ai-miss b{color:var(--ink)}
.ai-retry{color:var(--brand);font-weight:800;text-decoration:none;margin-left:var(--space-6)}
.ai-dock{flex:none;padding-top:var(--space-6);background:var(--field);border-top:var(--bw-1) solid var(--hi)}
.ai-rail{display:flex;gap:var(--space-10);overflow-x:auto;padding:var(--space-4) var(--space-16) var(--space-4);scroll-snap-type:x mandatory;scroll-padding-left:var(--space-16);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ai-rail::-webkit-scrollbar{display:none}
.ai-card{flex:0 0 78vw;max-width:320px;scroll-snap-align:start;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);padding:var(--space-10) var(--space-12);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:var(--space-3);position:relative;overflow:hidden;min-width:0}
.ai-card::after{content:"›";position:absolute;right:var(--space-10);top:var(--space-8);font-size:var(--type-15);font-weight:800;color:var(--muted);line-height:1}
.ai-eye{font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em12)}
.ai-head{font-size:var(--type-22);font-weight:800;line-height:1.1;margin-top:var(--space-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-head.pos{color:var(--win)}.ai-head.neg{color:var(--loss)}
.ai-line{font-size:var(--type-105);font-weight:600;line-height:1.4;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-src{font-size:var(--type-9);color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-src.f{margin-top:var(--space-3)}
.ai-card.ph{border-style:dashed;justify-content:center;align-items:center;min-height:96px;color:var(--muted);font-size:var(--type-11);font-weight:600}
.ai-card.ph::after{content:none}
.ai-pager{display:flex;justify-content:center;gap:var(--space-5);padding:var(--space-6) var(--space-16) 0;min-height:var(--space-12)}
.ai-pager i{display:block;width:6px;height:6px;border-radius:var(--radius-3);background:var(--edge)}
.ai-pager i.on{background:var(--brand)}
.ai-comp{display:grid;grid-template-columns:1fr auto;gap:var(--space-8);align-items:center;padding:var(--space-8) var(--space-16) var(--space-10)}
.ai-in{display:block;width:100%;min-height:44px;background:var(--hi);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-12);color:var(--muted);font:inherit;font-size:var(--type-125);font-weight:600;padding:var(--space-9) var(--space-12);box-sizing:border-box;outline:none}
.ai-in::placeholder{color:var(--muted);opacity:1}
.ai-in:focus{border-color:color-mix(in srgb, var(--brand) 55%, transparent)}
.ai-type{min-height:44px;min-width:44px;padding:0 var(--space-16);border-radius:var(--radius-12);font:inherit;font-size:var(--type-125);font-weight:800;cursor:pointer;background:var(--brand);color:var(--field);border:none}
.ai-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--space-70) + env(safe-area-inset-bottom,0px));max-width:88vw;background:var(--ink);color:var(--field);font-family:Sora,-apple-system,sans-serif;font-size:var(--type-115);font-weight:700;padding:var(--space-9) var(--space-14);border-radius:var(--radius-20);z-index:60;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .18s;pointer-events:none}
.ai-toast.on{opacity:1}
.ai-toast[hidden]{display:none}
</style>
</head>
<body data-theme="goldnight">
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){}}catch(e){}
var __r1644=({goldday:'aquawhite',rosenight:'blush',rosewall:'blush',winepurple:'electricviolet',duskviolet:'electricviolet'})[t];if(__r1644){t=__r1644;try{localStorage.setItem('scorr_theme',t);}catch(e){}}document.body.setAttribute('data-theme',(window.SCORR_THEME&&window.SCORR_THEME.resolve)?window.SCORR_THEME.resolve():((t==='goldnight'||t==='dark'||t==='aquawhite'||t==='blush'||t==='ainight'||t==='silvergold'||t==='electricviolet'||t==='indigoash')?t:'goldnight'));
try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;var cs=document.querySelector('meta[name="color-scheme"]'),csm=fc&&/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(fc);if(cs&&csm){var csch=function(h){var c=parseInt(h,16)/255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);},cslum=0.2126*csch(csm[1])+0.7152*csch(csm[2])+0.0722*csch(csm[3]);cs.content=cslum>0.5?'light':'dark';}}catch(e){}})();</script>
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">AI CIO</span></div><div class="as-slot"></div></div>
<div class="ai" id="ai">
  <div class="ai-chat" id="ai-chat">
    <div class="ai-bub" id="ai-bub"><div class="ai-who">AICIO</div><div class="ai-msg" id="ai-msg">Reading the market…</div><div class="ai-asof" id="ai-asof"></div></div>
  </div>
  <div class="ai-dock" id="ai-dock">
    <div class="ai-rail" id="ai-rail" aria-label="Market cards"><div class="ai-card ph">Loading cards…</div></div>
    <div class="ai-pager" id="ai-pager"></div>
    <div class="ai-comp"><input class="ai-in" id="ai-in" type="text" readonly aria-disabled="true" inputmode="none" placeholder="Ask AICIO — chat lands in version 2" aria-label="Ask AICIO (version 2)"><button class="ai-type" id="ai-type" type="button">Type</button></div>
  </div>
</div>
<div class="ai-toast" id="ai-toast" role="status" hidden></div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn on" href="/m/aicio"><span class="i">⊙</span>AICIO</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/alerts"><span class="i">◬</span>Alerts</a>
</nav>
<script>
(function(){
  var API='/api/mobile/aicio_app/cards', CARDS=[], TOAST_T=null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function $(id){ return document.getElementById(id); }
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function asofText(s){ var m=/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(String(s||'')); return m?(Number(m[3])+' '+MON[Number(m[2])-1]+' '+m[1]+' · '+m[4]+' IST'):(s||'—'); }
  /* the column between the sticky header and the fixed bottom nav is the canvas; nothing else scrolls */
  function fit(){
    var hdr=document.querySelector('.as-hdr'), nav=document.querySelector('.bnav'), vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
    var top=hdr?hdr.getBoundingClientRect().bottom:0, nh=nav?nav.getBoundingClientRect().height:0;
    $('ai').style.height=Math.max(320,Math.round(vh-top-nh))+'px';
  }
  function toast(msg){
    var t=$('ai-toast'); t.textContent=msg; t.hidden=false; void t.offsetWidth; t.classList.add('on');
    if(TOAST_T) clearTimeout(TOAST_T);
    TOAST_T=setTimeout(function(){ t.classList.remove('on'); setTimeout(function(){ if(!t.classList.contains('on')) t.hidden=true; },220); },2200);
  }
  function headCls(c){ var v=c.raw&&c.raw.unrealised; if(c.key!=='v8_book'||v==null) return ''; return Number(v)>0?'pos':(Number(v)<0?'neg':''); }
  function card(c){
    return '<a class="ai-card" href="'+esc(c.href)+'" data-key="'+esc(c.key)+'"><div class="ai-eye">'+esc(c.title)+'</div><div class="ai-head '+headCls(c)+'">'+esc(c.headline||'—')+'</div>'+
      (c.lines||[]).slice(0,2).map(function(l){ return '<div class="ai-line">'+esc(l)+'</div>'; }).join('')+
      '<div class="ai-src f">'+esc(c.source||'')+'</div>'+(c.as_of?'<div class="ai-src">as of '+esc(c.as_of)+'</div>':'')+'</a>';
  }
  function pager(){
    var rail=$('ai-rail'), cs=rail.querySelectorAll('.ai-card'), p=$('ai-pager'); if(cs.length<2){ p.innerHTML=''; return; }
    var left=rail.getBoundingClientRect().left, best=0, bd=1e9;
    for(var i=0;i<cs.length;i++){ var d=Math.abs(cs[i].getBoundingClientRect().left-left); if(d<bd){ bd=d; best=i; } }
    var h=''; for(var j=0;j<cs.length;j++) h+='<i'+(j===best?' class="on"':'')+'></i>'; p.innerHTML=h;
  }
  function draw(d){
    var cards=(d.cards||[]).filter(function(c){ return c.available; }), missing=(d.cards||[]).filter(function(c){ return !c.available; });
    CARDS=cards;
    $('ai-msg').textContent='I am your AI CIO. Here is what the market looks like right now.';
    var f=d.feed||{}, st=String(f.state||'—'), fc=st==='LIVE'?'ok':(st==='CLOSED'||st==='OFF'?'':'bad');
    $('ai-asof').innerHTML='<b>'+esc(asofText(d.as_of))+'</b><br><span class="ai-fd '+fc+'"></span>Feed '+esc(st.toLowerCase())+(f.why?' · '+esc(f.why):'');
    var miss=$('ai-miss'); if(miss) miss.parentNode.removeChild(miss);
    if(missing.length){ var el=document.createElement('div'); el.className='ai-miss'; el.id='ai-miss';
      el.innerHTML='<b>'+cards.length+' of '+(d.total||(d.cards||[]).length)+' cards available.</b> '+missing.map(function(c){ return esc(c.title)+': '+esc(String(c.reason||'not available').replace(/^[A-Za-z_]*(Error|Exception): /,'')); }).join(' · ');
      $('ai-bub').appendChild(el); }
    $('ai-rail').innerHTML=cards.length?cards.map(card).join(''):'<div class="ai-card ph">No cards right now.</div>';
    pager();
  }
  function fail(){
    $('ai-msg').textContent='I could not reach the market data right now.';
    $('ai-asof').innerHTML='<a class="ai-retry" href="#" id="ai-retry">Try again</a>';
    $('ai-rail').innerHTML='<div class="ai-card ph">Cards unavailable.</div>'; $('ai-pager').innerHTML='';
    var r=$('ai-retry'); if(r) r.addEventListener('click',function(e){ e.preventDefault(); load(); });
  }
  function load(){
    fetch(API,{credentials:'same-origin'}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); }).then(function(d){ if(!d||!d.cards) throw new Error('no cards'); draw(d); }).catch(fail);
  }
  $('ai-rail').addEventListener('scroll',function(){ window.requestAnimationFrame(pager); },{passive:true});
  $('ai-type').addEventListener('click',function(){ try{ $('ai-in').focus({preventScroll:true}); }catch(e){ $('ai-in').focus(); } toast('Chat is version 2. The cards are live.'); });
  $('ai-in').addEventListener('click',function(){ toast('Chat is version 2. The cards are live.'); });
  window.addEventListener('resize',fit); if(window.visualViewport) window.visualViewport.addEventListener('resize',fit);
  fit(); load();
})();
</script>
</body></html>
