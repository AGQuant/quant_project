 border:var(--bw-1) dashed var(--line);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--dim);line-height:1.65}

<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmd(ds){ if(!ds) return '—'; var p=String(ds).slice(0,10).split('-');
  if(p.length!==3) return String(ds); var m=parseInt(p[1],10)-1;
  return parseInt(p[2],10)+' '+(MON[m]||p[1]); }

function kmHtml(k){
  return '<div class="ac-km"><div class="ac-k">Conversations</div><div class="ac-v">'+(k.conversations!=null?k.conversations:'—')+'</div>'
    + '<div class="ac-kg">'
    + '<div class="ac-cell"><div class="ac-k">Last used</div><div class="ac-v">'+dmd(k.last_used)+'</div></div>'
    + '<div class="ac-cell"><div class="ac-k">Ratings reach</div><div class="ac-v">'+esc(k.ratings_reach||'—')+'</div></div>'
    + '<div class="ac-cell"><div class="ac-k">Sectors</div><div class="ac-v">'+(k.sectors!=null?k.sectors:'—')+'</div></div>'
    + '<div class="ac-cell"><div class="ac-k">Result write-ups</div><div class="ac-v">'+(k.result_writeups!=null?k.result_writeups:'—')+'</div></div>'
    + '</div></div>';
}
function whatItIsCardHtml(d){
  var w=d.what_it_is||{};
  return '<div class="ac-c"><div class="ac-ch"><span class="t">What it is</span><span class="n">open</span></div>'
    + '<div class="ac-emp" style="margin-top:0">'+esc(w.message||'')+'</div>'
    + (w.footnote?'<div class="ac-ft">'+esc(w.footnote)+'</div>':'')+'</div>';
}
function conversationsCardHtml(d){
  var c=d.your_conversations||{};
  var label = c.count ? 'Barely used so far' : 'Nothing yet';
  return '<div class="ac-c gap"><div class="ac-ch"><span class="t">Your conversations</span><span class="n">'+(c.count!=null?c.count+' stored':'')+'</span></div>'
    + '<div class="ac-emp"><b>'+esc(label)+'</b>'+esc(c.message||'')+'</div></div>';
}
function reachCardHtml(d){
  var r=d.reach||{}, rows=r.rows||[];
  var lst = rows.map(function(row){
    return '<div class="ac-lr"><span class="s">'+esc(row.label)+'</span><div class="r">'+(row.note?'<span class="a">'+esc(row.note)+'</span>':'')+'<span class="b">'+esc(row.value)+'</span></div></div>';
  }).join('');
  return '<div class="ac-c"><div class="ac-ch"><span class="t">Data it can see</span><span class="n">live</span></div>'
    + '<div class="ac-lst">'+lst+'</div>'
    + (r.message?'<div class="ac-more">'+esc(r.message)+'</div>':'')+'</div>';
}
function limitsCardHtml(d){
  var l=d.limits||{};
  return '<div class="ac-c"><div class="ac-ch"><span class="t">What it will not do</span><span class="n">by design</span></div>'
    + '<div class="ac-emp" style="margin-top:0">'+esc(l.message||'')+'</div></div>';
}

function render(d){
  var k=d.key_metrics||{};
  document.getElementById('ac-asof').textContent = (k.conversations!=null?k.conversations:'—')+' conversations stored · last '+dmd(k.last_used);
  var html = kmHtml(k)
    + '<div class="ac-slab"><h2>Ask the CIO</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="ac-rail">'+whatItIsCardHtml(d)+conversationsCardHtml(d)+'</div>'
    + '<div class="ac-slab"><h2>What it can reach</h2><span class="hint">1 · swipe →</span></div>'
    + '<div class="ac-rail">'+reachCardHtml(d)+'</div>'
    + '<div class="ac-slab"><h2>Limits</h2><span class="hint">1 · swipe →</span></div>'
    + '<div class="ac-rail">'+limitsCardHtml(d)+'</div>'
    + '<div class="ac-note"><b>This surface is barely used.</b> max_chats holds '+(k.conversations!=null?k.conversations:'—')+' rows; the last one was active '+dmd(k.last_used)+'. This page shows the real count and the true last-activity date rather than an empty state that implies a fresh start.</div>';
  document.getElementById('ac-body').innerHTML = html;
}

fetch('/api/mobile/aicio_app', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error){ document.getElementById('ac-body').innerHTML = '<div class="ac-err ac-empty">Could not load: '+esc(d.error)+'</div>'; return; }
    render(d);
  })
  .catch(function(e){ document.getElementById('ac-body').innerHTML = '<div class="ac-err ac-empty">Could not load.</div>'; });
</script>
</body></html>
