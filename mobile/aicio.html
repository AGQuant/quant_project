<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
/* ── light markdown: headings, bold, italic, code, bullets, pipe tables, paragraphs ── */
function md(s){
  s=String(s||''); var lines=s.split(/\r?\n/), out=[], i=0;
  function inl(t){ t=esc(t); t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(^|[^\w])_([^_]+)_(?!\w)/g,'$1<i>$2</i>').replace(/\*(?!\s)([^*]+?)\*/g,'<i>$1</i>'); return t; }
  while(i<lines.length){
    var l=lines[i];
    if(/^\s*\|/.test(l)){ var rows=[]; while(i<lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      var cells=rows.map(function(r){ return r.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}); }).filter(function(c){ return !c.every(function(x){return /^:?-{2,}:?$/.test(x)||x==='';}); });
      if(cells.length){ out.push('<div class="tw"><table><thead><tr>'+cells[0].map(function(c){return '<th>'+inl(c)+'</th>';}).join('')+'</tr></thead><tbody>'+cells.slice(1).map(function(r){return '<tr>'+r.map(function(c){ var sym=/^[A-Z][A-Z0-9&-]{1,14}$/.test(c); return '<td>'+(sym?'<a href="/m/check?sym='+encodeURIComponent(c)+'">'+esc(c)+'</a>':inl(c))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>'); }
      continue; }
    if(/^\s*[-*] /.test(l)){ var li=[]; while(i<lines.length && /^\s*[-*] /.test(lines[i])){ li.push('<li>'+inl(lines[i].replace(/^\s*[-*] /,''))+'</li>'); i++; } out.push('<ul>'+li.join('')+'</ul>'); continue; }
    var h=l.match(/^(#{1,4})\s+(.*)/); if(h){ out.push('<div class="mh">'+inl(h[2])+'</div>'); i++; continue; }
    if(l.trim()===''){ i++; continue; }
    var para=[l]; i++; while(i<lines.length && lines[i].trim()!=='' && !/^\s*[|#]|^\s*[-*] /.test(lines[i])){ para.push(lines[i]); i++; }
    out.push('<p>'+para.map(inl).join('<br>')+'</p>');
  }
  return out.join('');
}
var TREE=[], BY={}, PATH=[], CTX={sym:'',sym2:'',seg:''}, ANS=[], AI=false, SID='app-'+Date.now().toString(36);
function kids(pid){ return TREE.filter(function(n){ return (n.parent_id||null)===(pid||null); }); }
function crumbs(){ return PATH.map(function(id){ return BY[id]?BY[id].label:id; }); }
function renderMenu(){
  var cur=PATH.length?PATH[PATH.length-1]:null, list=kids(cur), n=cur?BY[cur]:null, needs=(n&&n.action_params&&n.action_params.needs)||'';
  var h='';
  if(needs==='symbol' && !CTX.sym) h+=symBox('Which stock?','sym');
  else if(needs==='symbol2' && !CTX.sym2) h+=symBox('Compare '+esc(CTX.sym)+' with?','sym2');
  if(CTX.sym) h+='<div class="ctx">Stock: <b>'+esc(CTX.sym)+'</b>'+(CTX.sym2?' vs <b>'+esc(CTX.sym2)+'</b>':'')+' <a href="#" id="ctx-clr">change</a></div>';
  if(!cur){ h+='<div class="hero"><div class="eye">AI CIO · Max</div><div class="big"><div class="n" style="font-size:var(--type-125);color:var(--ink)">Tap a question. Every answer here is read from the Scorr database — no model, no cost. Ask anything else at the bottom.</div></div></div>'; }
  if(list.length) h+='<div class="menu">'+list.map(function(k){ return '<a href="#" class="mi" data-n="'+esc(k.node_id)+'"><span class="ic">'+(k.icon||'›')+'</span><span class="lb">'+esc(k.label)+(k.sublabel?'<small>'+esc(k.sublabel)+'</small>':'')+'</span><span class="ar">›</span></a>'; }).join('')+'</div>';
  if(PATH.length) h='<div class="crumb"><a href="#" id="c-home">Max</a>'+crumbs().map(function(c,i){ return ' › <a href="#" data-c="'+i+'">'+esc(c)+'</a>'; }).join('')+'</div>'+h;
  document.getElementById('menu').innerHTML=h;
  document.querySelectorAll('.mi').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); tap(a.getAttribute('data-n')); }); });
  var ch=document.getElementById('c-home'); if(ch) ch.addEventListener('click', function(e){ e.preventDefault(); PATH=[]; renderMenu(); });
  document.querySelectorAll('.crumb [data-c]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); PATH=PATH.slice(0,Number(a.getAttribute('data-c'))+1); renderMenu(); }); });
  var clr=document.getElementById('ctx-clr'); if(clr) clr.addEventListener('click', function(e){ e.preventDefault(); CTX.sym=''; CTX.sym2=''; renderMenu(); });
  var sb=document.getElementById('symin'); if(sb){ sb.focus(); sb.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var v=sb.value.trim().toUpperCase(); if(!v) return; CTX[sb.getAttribute('data-k')]=v; renderMenu(); } }); var go=document.getElementById('symgo'); if(go) go.addEventListener('click', function(){ var v=sb.value.trim().toUpperCase(); if(!v) return; CTX[sb.getAttribute('data-k')]=v; renderMenu(); }); }
}
function symBox(label,k){ return '<div class="card"><div class="ch"><span class="t">'+label+'</span></div><div class="two" style="grid-template-columns:1fr 84px"><input id="symin" data-k="'+k+'" class="qin" placeholder="NSE symbol, e.g. TCS" autocapitalize="characters"><button class="btn" id="symgo" style="margin-top:8px">Go</button></div></div>'; }
function tap(id){
  var n=BY[id]; if(!n) return;
  try{ fetch('/api/max/ivr/tap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node_id:id,session_id:SID}),credentials:'same-origin'}); }catch(e){}
  var p=n.action_params||{}, ks=kids(id);
  if(n.action_intent==='freetext'){ document.getElementById('q').focus(); return; }
  if(p.needs && !have(p.needs)){ PATH.push(id); renderMenu(); return; }
  if(ks.length){ PATH.push(id); renderMenu(); return; }
  run(n);
}
function have(need){ return need==='symbol'?!!CTX.sym:(need==='symbol2'?!!CTX.sym2:(need==='segment'?!!CTX.seg:true)); }
function run(n){
  var p=n.action_params||{};
  if(p.href){ location.href=p.href; return; }
  if(p.needs_sym && !CTX.sym){ PATH.push('analyze'); renderMenu(); return; }
  if(n.action_intent==='learn_glossary'){ answer(n.label, p.body||'', 'Native · ₹0'); return; }
  if(n.has_card){ runCard(n); return; }
  if(p.card && CTX.sym){ location.href='/m/check?sym='+encodeURIComponent(CTX.sym)+(p.card==='D'?'#deriv':''); return; }
  var q=(p.q||n.label).replace(/\{sym\}/g,CTX.sym||'').replace(/\{sym2\}/g,CTX.sym2||'').replace(/\{seg\}/g,CTX.seg||'');
  ask(q.trim(), n.label);
}
function runCard(n){
  var p=n.action_params||{}, qs=new URLSearchParams(); if(CTX.sym) qs.set('sym',CTX.sym); if(CTX.seg) qs.set('seg',CTX.seg); if(p.screen_id) qs.set('screen_id',p.screen_id); if(p.cat) qs.set('cat',p.cat); qs.set('node',n.node_id);
  var id=answer(n.label,'_Reading…_','Native · ₹0');
  fetch('/api/max/card/'+encodeURIComponent(n.action_intent)+'?'+qs.toString(),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    replace(id, d.title||n.label, d.error&&!d.body?('**'+d.error+'**'):(d.body||''), 'Native · ₹0'+(d.as_of?' · as of '+esc(d.as_of):''));
  }).catch(function(){ replace(id, n.label, '**This card could not be built right now.**', ''); });
}
function ask(q, title){
  if(!q) return;
  var id=answer(title||q, '_Thinking…_', AI?'AI':'Native · ₹0');
  fetch('/api/scorr/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:q}], mode: AI?null:'native', claude_on: AI, use_tools: AI}),credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    var rep=(d.reply==null?'':(typeof d.reply==='string'?d.reply:JSON.stringify(d.reply)));
    var u=d.usage||{}; replace(id, title||q, rep||('**'+(d.error||'No answer.')+'**'), (d.model?esc(d.model)+' · $'+Number(u.cost_usd||0).toFixed(4):'Native · ₹0')+(d.duration_ms?' · '+Math.round(d.duration_ms)+' ms':''));
  }).catch(function(){ replace(id, title||q, '**Could not reach Max.**', ''); });
}
var AID=0;
function answer(title, body, foot){ var id='a'+(++AID); ANS.unshift({id:id,title:title,body:body,foot:foot}); drawAns(); return id; }
function replace(id,title,body,foot){ for(var i=0;i<ANS.length;i++) if(ANS[i].id===id){ ANS[i]={id:id,title:title,body:body,foot:foot}; } drawAns(); }
function drawAns(){
  var el=document.getElementById('ans'); if(!ANS.length){ el.innerHTML=''; return; }
  el.innerHTML='<div class="sec"><h2>Answers</h2><span class="hint" id="a-clr" style="color:var(--brand);font-weight:800">clear</span></div>'+ANS.map(function(a){ return '<div class="card ansc" id="'+a.id+'"><div class="ch"><span class="t">'+esc(a.title)+'</span></div><div class="mdb">'+md(a.body)+'</div>'+(a.foot?'<div class="foot2">'+a.foot+'</div>':'')+'</div>'; }).join('');
  document.getElementById('a-clr').addEventListener('click', function(){ ANS=[]; drawAns(); });
  window.scrollTo(0, document.getElementById('ans').getBoundingClientRect().top+window.scrollY-70);
}
function boot(){
  fetch('/api/max/ivr/tree',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    TREE=d.nodes||[]; TREE.forEach(function(n){ BY[n.node_id]=n; });
    document.getElementById('asof').innerHTML='<b>'+TREE.length+'</b> questions on tap · '+(d.cards_available||[]).length+' native cards · answers cost nothing unless you turn AI on';
    renderMenu();
  }).catch(function(){ document.getElementById('menu').innerHTML='<div class="err">Could not load Max.</div>'; });
  var q=document.getElementById('q');
  document.getElementById('send').addEventListener('click', function(){ var v=q.value.trim(); if(!v) return; q.value=''; ask(v); });
  q.addEventListener('keydown', function(e){ if(e.key==='Enter'){ var v=q.value.trim(); if(!v) return; q.value=''; ask(v); } });
  document.getElementById('ai').addEventListener('click', function(){ AI=!AI; this.classList.toggle('on',AI); this.textContent=AI?'AI on':'AI off'; document.getElementById('aihint').textContent=AI?'Answers now use the model — costs a few cents each.':'Free-text answers read the database only. Turn AI on for reasoning.'; });
}
boot();
</script>
