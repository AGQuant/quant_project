<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Models · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
</head>
<body>
<div class="screen">
  <div class="head">
    <h1>Models</h1>
    <div class="s" id="sub">loading…</div>
  </div>
  <div class="body" id="body"><div class="loading">Loading models…</div></div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn on" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* state -> css class + badge glyph. The glyph is the SHAPE that repeats the rail: a colour-blind
   or glancing reader must never read a dead engine as a running one (15913 rule 10). */
function stateBits(st){
  if (st === 'LIVE')        return {cls: 'live',   glyph: 'g-dot'};
  if (st === 'STALE')       return {cls: 'stale',  glyph: 'g-ring'};
  if (st === 'ERROR')       return {cls: 'error',  glyph: 'g-ring'};
  if (st === 'OFF')         return {cls: 'off',    glyph: 'g-bar'};
  if (st === 'NOT RUN YET') return {cls: 'notrun', glyph: 'g-ring'};
  return {cls: 'closed', glyph: 'g-bar'};
}

function tile(m){
  var b = stateBits(m.state);
  return '<a class="m ' + b.cls + '" href="' + esc(m.href) + '" title="' + esc(m.why || '') + '">'
    + '<div class="mtop"><span class="mnm">' + esc(m.name) + '</span>'
    + (m.on_mobile ? '' : '<span class="tag cat">WEB</span>')
    + '<span class="badge ' + b.cls + '"><span class="' + b.glyph + '"></span>' + esc(m.state) + '</span></div>'
    + (m.description ? '<div class="mds">' + esc(m.description) + '</div>' : '')
    + '<div class="mft">' + (m.last_run ? 'Last run ' + esc(m.last_run) : 'Never run') + '</div>'
    + '</a>';
}

fetchWithTimeout('/api/mobile/models').then(function(r){ return r.json(); }).then(function(d){
  if (d.error) throw new Error(d.error);
  var live = (d.models || []).filter(function(m){ return m.state === 'LIVE'; }).length;
  document.getElementById('sub').textContent =
    d.count + ' registered · ' + (d.in_session ? live + ' live now' : 'market closed')
    + (d.internal_hidden ? ' · ' + d.internal_hidden + ' internal not shown' : '');

  var html = (d.models || []).map(tile).join('')
    || '<div class="empty"><b>No models registered</b>model_registry is empty.</div>';

  /* rule 2987 — the app's "everything else": no wired screen is ever stranded.
     cc#893 item 3: the four breadth screens were a static EXTRA array here; they now come from
     _MOBILE_DESTINATIONS with everything else, so this list has ONE source again. The dedupe
     stays — it costs nothing and it means a duplicate in the registry shows once, not twice. */
  var seen = {};
  html += '<div class="sect">EVERYTHING ELSE</div>'
    + '<div class="dest">' + (d.destinations || []).filter(function(x){
        if (seen[x.href]) return false; seen[x.href] = true; return true;
      }).map(function(x){
        return '<a href="' + esc(x.href) + '">' + esc(x.label) + '</a>'; }).join('')
    + '<a href="/logout">Log out</a></div>';

  document.getElementById('body').innerHTML = html;
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load models</b>' + esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sub').textContent = 'failed to load';
});
</script>
</body>
</html>
