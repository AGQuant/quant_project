<style>
/* page-local mp-* rules — geometry from the R4 ref, colours from the contract, lengths from the scale */
.mp{font-family:Sora,-apple-system,sans-serif;color:var(--ink);padding-bottom:var(--space-80)}
.mp-asof{padding:var(--space-10) var(--space-16) 0;font-size:var(--type-10);color:var(--muted);letter-spacing:var(--track-em7)}
.mp-asof b{color:var(--ink);font-weight:600}
/* KEY METRICS: one TALL card, never a rail */
.mp-km{margin:var(--space-10) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-left:var(--bw-3) solid var(--brand);
 border-radius:0 var(--radius-16) var(--radius-16) 0;padding:var(--space-15) var(--space-16)}
.mp-km.up{border-left-color:var(--win)} .mp-km.dn{border-left-color:var(--loss)}
.mp-km .k{font-size:var(--type-10);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em12)}
.mp-km .v{font-size:var(--type-30);font-weight:800;line-height:1.03;margin-top:var(--space-5)}
.mp-kg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);margin-top:var(--space-13)}
.mp-cell{background:var(--hi);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-11);padding:var(--space-9) var(--space-11)}
.mp-cell .k{font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em10)}
.mp-cell .v{font-size:var(--type-135);font-weight:700;margin-top:var(--space-3)}
/* SECTION = label + ONE sideways rail */
.mp-slab{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-20) var(--space-16) var(--space-8)}
.mp-slab h2{font-size:var(--type-115);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em14);margin:0}
.mp-slab .hint{font-size:var(--type-10);color:var(--muted)}
.mp-rail{display:flex;gap:var(--space-11);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--space-2) var(--space-16) var(--space-4);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mp-rail::-webkit-scrollbar{display:none}
/* three card widths, as the ref: default 62vw/250, .w 78vw/320 (list cards), .n 46vw/172 */
.mp-c{flex:0 0 62vw;max-width:250px;scroll-snap-align:start;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);position:relative}
.mp-c.w{flex:0 0 78vw;max-width:320px}
.mp-c.n{flex:0 0 46vw;max-width:172px}
.mp-c.up{border-left:var(--bw-3) solid var(--win);border-radius:0 var(--radius-14) var(--radius-14) 0}
.mp-c.dn{border-left:var(--bw-3) solid var(--loss);border-radius:0 var(--radius-14) var(--radius-14) 0}
.mp-c.gap{border-style:dashed}
.mp-ch{display:flex;align-items:baseline;justify-content:space-between}
.mp-ch .t{font-size:var(--type-11);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em11)}
.mp-ch .n{font-size:var(--type-11);color:var(--muted)}
.mp-lst{margin-top:var(--space-9)}
.mp-lr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-7) 0;border-bottom:var(--bw-1) solid var(--hi)}
.mp-lr:last-child{border-bottom:none}
.mp-lr .s{font-size:var(--type-125);font-weight:800}
.mp-lr .r{display:flex;gap:var(--space-11);align-items:baseline}
.mp-lr .a{font-size:var(--type-115);color:var(--muted)}
.mp-lr .b{font-size:var(--type-125);font-weight:700;min-width:52px;text-align:right}
.pos{color:var(--win)}.neg{color:var(--loss)}
.mp-more{font-size:var(--type-11);color:var(--muted);padding:var(--space-7) 0 0}
.mp-link{display:block;margin-top:var(--space-9);padding-top:var(--space-9);border-top:var(--bw-1) solid var(--edge);font-size:var(--type-115);font-weight:700;color:var(--brand);text-decoration:none}
.mp-sb{margin-top:var(--space-9)}
.mp-sb .row{display:flex;justify-content:space-between;font-size:var(--type-115);margin-bottom:var(--space-3)}
.mp-sb .row span:last-child{color:var(--muted)}
.mp-bar{height:5px;border-radius:var(--radius-3);background:var(--hi);margin-top:var(--space-8)}
.mp-bar i{display:block;height:5px;border-radius:var(--radius-3);background:var(--brand)}
.mp-emp{font-size:var(--type-115);color:var(--muted);line-height:1.6;margin-top:var(--space-7)}
.mp-emp b{display:block;color:var(--ink);font-size:var(--type-125);font-weight:700;margin-bottom:var(--space-5)}
.mp-note{margin:var(--space-22) var(--space-16) var(--space-8);padding:var(--space-12) var(--space-14);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--muted);line-height:1.65}
.mp-note b{color:var(--ink)}
.mp-err{margin:var(--space-16);color:var(--muted);font-size:var(--type-12);text-align:center}
</style>
</head>

<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">My portfolio</span></div><div class="as-slot"></div></div>
<div class="mp">
<div class="mp-asof" id="mp-asof">Loading…</div>
<div id="mp-body"><div class="mp-err">Loading portfolio…</div></div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn on" href="/m/dash"><span class="i">◍</span>Dash</a>
</nav>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function inr(v, signed){ if (v==null||isNaN(Number(v))) return '—';
  var x=Number(v), s = x<0 ? '−' : (signed && x>0 ? '+' : '');
  return s+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function edge(v){ return v==null?'':(Number(v)>0?'up':(Number(v)<0?'dn':'')); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3 ? (p[2]+' '+MON[Number(p[1])-1]) : String(iso); }
function dmy(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3 ? (p[2]+' '+MON[Number(p[1])-1]+' '+p[0]) : String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dmy(s)+', '+s.slice(11,16)+' IST'; }
function card(cls, title, count, inner, link, href){
  return '<div class="mp-c '+cls+'"><div class="mp-ch"><span class="t">'+esc(title)+'</span><span class="n">'+esc(count)+'</span></div>'
    + inner + (link ? '<a class="mp-link" href="'+href+'">'+link+' ›</a>' : '') + '</div>';
}
function rows(list, fn, emptyTitle, emptyBody){
  return list.length ? '<div class="mp-lst">'+list.map(fn).join('')+'</div>'
    : '<div class="mp-emp"><b>'+esc(emptyTitle)+'</b>'+esc(emptyBody)+'</div>';
}
function more(n, shown){ return n>shown ? '<div class="mp-more">+'+(n-shown)+' more</div>' : ''; }

function kmHtml(k){
  var flat = !k.open_count;
  return '<div class="mp-km '+edge(k.realised_this_week)+'"><div class="k">Realised this week</div>'
    + '<div class="v">'+inr(k.realised_this_week,true)+'</div>'
    + '<div class="mp-kg">'
    + '<div class="mp-cell"><div class="k">Open value</div><div class="v">'+(flat?'—':inr(k.open_value))+'</div></div>'
    + '<div class="mp-cell"><div class="k">Unrealised</div><div class="v '+(flat?'':cls(k.unrealised))+'">'+(flat?'—':inr(k.unrealised,true))+'</div></div>'
    + '<div class="mp-cell"><div class="k">Positions</div><div class="v">'+(k.open_count==null?'—':k.open_count+' open')+'</div></div>'
    + '<div class="mp-cell"><div class="k">Brokerage</div><div class="v">'+(k.brokerage==null?'—':inr(-Math.abs(k.brokerage)))+'</div></div>'
    + '</div></div>';
}
function openCard(d){
  var open=(d.positions&&d.positions.open)||[], n=(d.positions&&d.positions.open_count)||0;
  var inner = rows(open, function(p){
    return '<div class="mp-lr"><span class="s">'+esc(p.symbol)+'</span><div class="r"><span class="a">'+(p.qty!=null?p.qty:'—')+' · '+inr(p.value)+'</span><span class="b '+cls(p.pnl)+'">'+inr(p.pnl,true)+'</span></div></div>';
  }, 'No open positions.', 'Nothing is held right now.') + more(n, open.length);
  return card('w', 'Open', n, inner, n ? 'All with entry, stop and age' : '', '/m/holdings');
}
function closedCard(d){
  var c=(d.positions&&d.positions.closed_this_week)||[], n=(d.positions&&d.positions.closed_this_week_count)||0;
  var inner = rows(c, function(x){
    return '<div class="mp-lr"><span class="s">'+esc(x.symbol)+'</span><div class="r"><span class="a">'+(x.entry!=null?x.entry:'—')+' → '+(x.exit!=null?x.exit:'—')+'</span><span class="b '+cls(x.pnl)+'">'+inr(x.pnl,true)+'</span></div></div>';
  }, 'No trades closed this week.', 'The week is still open, or nothing was exited.') + more(n, c.length);
  return card('w', 'Closed this week', n, inner, n ? 'Full trade book' : '', '/m/holdings');
}
function sectorCard(mix){
  mix = mix||[];
  var inner = mix.length ? mix.map(function(s){
    return '<div class="mp-sb"><div class="row"><span>'+esc(s.segment)+'</span><span>'+Number(s.pct).toFixed(1)+'%</span></div><div class="mp-bar"><i style="width:'+Math.min(100,Number(s.pct)*100/Math.max.apply(null,mix.map(function(m){return Number(m.pct)||1;})))+'%"></i></div></div>';
  }).join('') : '<div class="mp-emp"><b>No open positions.</b>Nothing to break down.</div>';
  return card('w', 'Sector mix', mix.length, inner, mix.length ? 'Full break up' : '', '/m/holdings');
}
function byNameCard(d){
  var names=d.by_name||[], n=d.by_name_count||names.length;
  var inner = rows(names, function(x){
    return '<div class="mp-lr"><span class="s">'+esc(x.symbol)+'</span><div class="r"><span class="a">'+esc(x.segment||'')+'</span><span class="b">'+Number(x.pct).toFixed(1)+'%</span></div></div>';
  }, 'No open positions.', 'Nothing to list.') + more(n, names.length);
  return card('w', 'By name', n, inner, '', '');
}
function weekCard(d){
  var weeks=(d.week_history||[]).slice().reverse();
  var inner = rows(weeks, function(w){
    return '<div class="mp-lr"><span class="s">'+dm(w.week_start)+'</span><div class="r"><span class="a">'+(w.current?'this week':'')+'</span><span class="b '+cls(w.realised)+'">'+inr(w.realised,true)+'</span></div></div>';
  }, 'No weekly rows stored.', 'Absent, not zero.');
  var gap = d.week_history_gap_note ? '<div class="mp-more">'+esc(d.week_history_gap_note)+'</div>' : '';
  return card('w', 'Week by week', weeks.length+' stored', inner+gap, 'Full history', '/m/holdings');
}
function costsCard(c){
  c=c||{};
  var inner = '<div class="mp-lst">'
    + '<div class="mp-lr"><span class="s">Brokerage</span><div class="r"><span class="a">'+(c.legs||0)+' legs, '+(c.round_trips||0)+' round trips</span><span class="b">'+inr(-Math.abs(c.brokerage||0))+'</span></div></div>'
    + '<div class="mp-lr"><span class="s">Rate</span><div class="r"><span class="a">per leg</span><span class="b">'+esc(c.rate_note||'')+'</span></div></div>'
    + '</div><div class="mp-more">Costs are always shown, never netted away silently.</div>';
  return card('w', 'Costs', 'this week', inner, '', '');
}
function slab(h2, hint){ return '<div class="mp-slab"><h2>'+h2+'</h2><span class="hint">'+hint+' · swipe →</span></div>'; }
function render(d){
  var openC=(d.positions&&d.positions.open_count)||0, closedC=(d.positions&&d.positions.closed_this_week_count)||0;
  var sectors=(d.sector_mix||[]).length, weeks=(d.week_history||[]).length;
  document.getElementById('mp-asof').innerHTML = 'Marked <b>'+esc(dmt(d.as_of))+'</b> · '+openC+' open · '+closedC+' closed this week';
  document.getElementById('mp-body').innerHTML = kmHtml(d.key_metrics||{})
    + slab('Positions', openC+' open') + '<div class="mp-rail">'+openCard(d)+closedCard(d)+'</div>'
    + slab('Where the money sits', sectors+' sector'+(sectors===1?'':'s')) + '<div class="mp-rail">'+sectorCard(d.sector_mix)+byNameCard(d)+'</div>'
    + slab('Profit over time', weeks+' week'+(weeks===1?'':'s')) + '<div class="mp-rail">'+weekCard(d)+costsCard(d.costs)+'</div>'
    + '<div class="mp-note"><b>Density rule.</b> A card carries a short list with a count in its header and a link out — six rows at most, then a plain "+N more" line. Every number is real, from the reconciled book. A missing week is named on the card face rather than skipped.</div>';
}
fetch('/api/mobile/myportfolio', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(d){ if(d.error){ document.getElementById('mp-body').innerHTML='<div class="mp-err">Could not load: '+esc(d.error)+'</div>'; return; } render(d); })
  .catch(function(){ document.getElementById('mp-body').innerHTML='<div class="mp-err">Could not load portfolio.</div>'; });
</script>
