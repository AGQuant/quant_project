<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function tok(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function inrL(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v), a=Math.abs(x); var t=a>=1e7?(a/1e7).toFixed(2)+' Cr':(a>=1e5?(a/1e5).toFixed(2)+' L':Math.round(a).toLocaleString('en-IN')); return (x<0?'−':(s&&x>0?'+':''))+'₹'+t; }
function vc(v){ return v==='Excellent'||v==='Good'?'g':(v==='Weak'?'s':''); }

  document.getElementById('asof').innerHTML='<b>'+rows.length+'</b> saved portfolios · profit on the amount invested';
  var h='<a class="row up" href="/m/health?view=new" style="margin:12px 16px 0;border:1px solid var(--edge);border-radius:14px;background:var(--panel)"><div><div class="nm">Add a portfolio</div><div class="sub">Holdings, amount invested, start date, cash. The report builds from those four.</div></div><div class="v"><div class="n gd">+</div></div></a>';
  h+='<div class="sec"><h2>Saved</h2><span class="hint">by value</span></div>';
  h+= rows.length ? '<div class="lst">'+rows.map(function(p){
      var sub=(p.n||0)+' holdings · '+(p.invested!=null?'in '+inrL(p.invested):'invested amount missing')+(p.cash?' · cash '+inrL(p.cash):'')+(p.alpha_pct!=null?' · alpha <b class="'+cls(p.alpha_pct)+'">'+pct(p.alpha_pct,1)+'</b> vs Nifty since '+esc(dm(p.start)):'')+(p.active?'':' · inactive');
      return '<a class="row '+ud(p.pnl_pct)+'" href="/m/health?pid='+p.id+'"><div><div class="nm">'+esc(p.name)+'</div><div class="sub">'+sub+'</div></div><div class="v"><div class="n '+cls(p.pnl_pct)+'">'+(p.pnl_pct!=null?pct(p.pnl_pct,1):'—')+'</div><div class="c">'+inrL(p.total)+'</div></div></a>';
    }).join('')+'</div>' : '<div class="emp"><b>No portfolio yet</b>Add one above. Nothing is shown until you do.</div>';
  h+='<div class="note"><b>How profit is measured.</b> Headline profit = current value + cash − the amount you say you invested. Holdings cost is shown inside the report as the breakdown, never as the headline.</div>';

}

function parse(){
  var out=document.getElementById('parse-out'); out.innerHTML='<div class="sub2">Reading…</div>';
  var fd=new FormData(); var f=document.getElementById('f-file').files[0]; var t=document.getElementById('f-text').value.trim();

  fetch('/api/health/upload',{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(d.error&&!(d.rows||[]).length){ out.innerHTML='<div class="sub2 neg">'+esc(d.error)+'</div>'; return; }
    GRID=(d.rows||[]).map(function(r){ return {input:r.input||r.symbol, symbol:r.symbol, company_name:r.company_name, qty:r.qty, avg_price:r.avg_price, resolved:!!r.resolved}; });
    out.innerHTML='<div class="sub2">'+d.resolved+' matched · '+d.unresolved+' not matched'+(d.warning?' · '+esc(d.warning):'')+'</div>';
    drawGrid();
  }).catch(function(){ out.innerHTML='<div class="sub2 neg">Could not read the holdings.</div>'; });
}
function drawGrid(){
  var ok=GRID.filter(function(r){return r.resolved;});
  var h='<div class="sec"><h2>Check the grid</h2><span class="hint">'+ok.length+' of '+GRID.length+' matched · tap to edit</span></div><div class="lst">'
   + GRID.map(function(r,i){ return '<div class="row '+(r.resolved?'up':'dn')+'"><div><div class="nm">'+esc(r.symbol||r.input)+(r.resolved?'':'<span class="tag s">no match</span>')+'</div><div class="sub">'+esc(r.company_name||r.input||'')+'</div></div><div class="v"><input class="qi" data-i="'+i+'" data-k="qty" value="'+(r.qty!=null?r.qty:'')+'" placeholder="qty"><input class="qi" data-i="'+i+'" data-k="avg_price" value="'+(r.avg_price!=null?r.avg_price:'')+'" placeholder="avg"></div></div>'; }).join('')
   + '</div><div style="margin:12px 16px 0"><button class="btn" id="b-save"'+(ok.length?'':' disabled')+'>Save and build the report</button><div id="save-out" class="sub2"></div></div>';
  var w=document.getElementById('grid-wrap'); w.innerHTML=h;
  w.addEventListener('input', function(e){ var t=e.target; if(!t.classList.contains('qi')) return; GRID[Number(t.getAttribute('data-i'))][t.getAttribute('data-k')]=t.value===''?null:Number(t.value); });
  document.getElementById('b-save').addEventListener('click', save);
}
function save(){
  var so=document.getElementById('save-out'); so.textContent='Saving…';
  var body={ name: document.getElementById('f-name').value||'My Portfolio', source:'app', white_label:true,
    holdings: GRID.filter(function(r){return r.resolved;}).map(function(r){ return {symbol:r.symbol, company_name:r.company_name, qty:r.qty, avg_price:r.avg_price}; }) };
  var inv=document.getElementById('f-inv').value, cash=document.getElementById('f-cash').value, st=document.getElementById('f-start').value;
  if(inv) body.invested_amount=Number(inv); if(cash) body.cash=Number(cash); if(st){ body.tracking_date=st; body.alpha_start_date=st; }
  fetch('/api/health/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ so.textContent=d.error; return; }
    location.href='/m/health?pid='+d.portfolio_id;
  }).catch(function(){ so.textContent='Could not save.'; });
}
/* ═══ REPORT ═══ */
var R=null, ROWS=[], KEY='weight', ASC=false, COLS=[];
function bar(l,v,c){ return '<div class="r"><span class="l">'+l+'</span><div class="bar"><i style="width:'+(v==null?0:Math.min(100,v*10))+'%;background:'+c+'"></i></div><span class="v">'+f1(v)+'</span></div>'; }
function tbl(){
  var rows=ROWS.slice().sort(function(a,b){ var x=a[KEY], y=b[KEY]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return ASC? x.localeCompare(y) : y.localeCompare(x); return ASC? x-y : y-x; });
  var th=COLS.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=rows.map(function(r){ return '<tr>'+COLS.map(function(c){ var v=r[c[0]]; return '<td>'+(c[2]?c[2](v,r):esc(v==null?'—':v))+'</td>'; }).join('')+'</tr>'; }).join('');
  document.getElementById('tb').innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' holdings · tap a header to sort · weight by market value</div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='symbol'); } tbl(); });
}
function renderReport(d){
  R=d; var p=d.portfolio||{}, s=d.snapshot||{}, rt=d.ratings||{}, wl=d.winners_losers||{}, cb=d.cap_bands||{}, qb=d.quality_bands||{}, sec=d.sector||{}, val=d.valuation||{}, rm=d.risk_metrics, bm=d.benchmark||{};
  document.getElementById('pg-title').textContent=p.name||'Report'; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='<b>'+esc(p.name)+'</b> · '+(s.holdings_count||0)+' holdings · live prices';
  var G=tok('--win'), T=tok('--wayfind'), B=tok('--brand'), P=tok('--accent')||tok('--brand');
  /* 1 · hero */
  var h='<div class="hero"><div class="eye">Portfolio health · rating out of 10</div><div class="big"><div class="r">'+f1(rt.overall)+'</div><div class="n"><span class="tag '+vc(rt.verdict)+'" style="margin:0">'+esc(rt.verdict||'—')+'</span><br>'+esc(rt.insight||'')+'</div></div>'
   +'<div class="kg"><div class="cell"><div class="k">Invested</div><div class="v">'+(s.needs_invested_amount?'—':inrL(s.invested))+'</div></div><div class="cell"><div class="k">Current'+(s.cash?' + cash':'')+'</div><div class="v">'+inrL(s.current_total!=null?s.current_total:s.current)+'</div></div><div class="cell"><div class="k">Profit</div><div class="v '+cls(s.pnl_pct)+'">'+(s.pnl_pct!=null?pct(s.pnl_pct,1):'—')+'</div></div></div>'
   +(s.needs_invested_amount?'<div class="sub2">Invested amount not set — profit % cannot be stated honestly. Add it to the portfolio.</div>':'')+'</div>';
  /* 2 · alpha + breakdown */
  h+='<div class="strip">'+(s.alpha_since?'<div><div class="k">Alpha vs Nifty</div><div class="v '+cls(s.alpha_n50)+'">'+(s.alpha_n50!=null?pct(s.alpha_n50,1):'—')+'</div><div class="k2">since '+esc(dm(s.alpha_since))+'</div></div>':'<div><div class="k">Alpha</div><div class="v">—</div><div class="k2">no start date</div></div>')
   +'<div><div class="k">Realised</div><div class="v '+cls(s.realised_pnl)+'">'+inrL(s.realised_pnl,true)+'</div></div><div><div class="k">Unrealised</div><div class="v '+cls(s.unrealised_pnl)+'">'+inrL(s.unrealised_pnl,true)+'</div></div><div><div class="k">Holdings cost</div><div class="v">'+inrL(s.holdings_cost)+'</div></div></div>';
  /* 3 · rating parameters */
  h+='<div class="card"><div class="ch"><span class="t">Rating parameters</span><span class="n">weighted by value</span></div><div class="pil">'+bar('G',rt.growth,G)+bar('V',rt.value,T)+bar('M',rt.momentum,B)+bar('Q',rt.quality,P)+'</div><div class="sub2">Growth · Value · Momentum · Quality mix, each out of 10.</div></div>';
  /* 4 · composition */
  var strip=sec.strip||[], cols=[B,T,tok('--muted'),tok('--gold-lo'),tok('--label'),G,tok('--loss'),tok('--accent'),tok('--gold-hi'),tok('--ink')];
  h+='<div class="sec"><h2>Composition</h2><span class="hint">'+strip.length+' sectors</span></div>';
  h+='<div class="card"><div class="ch"><span class="t">By sector</span><span class="n">'+esc(sec.insight||'')+'</span></div><div class="mix">'+strip.map(function(x,i){return '<i style="width:'+x.weight+'%;background:'+cols[i%cols.length]+'"></i>';}).join('')+'</div><div class="mixl">'+strip.slice(0,6).map(function(x,i){return '<span><i class="dot" style="background:'+cols[i%cols.length]+'"></i><b>'+f1(x.weight)+'%</b> '+esc(x.segment)+'</span>';}).join('')+'</div>'
   +'<div class="lst" style="margin:10px 0 0"><div class="lr h"><div class="nm">Sector</div><div class="v">Weight</div><div class="v">Call</div></div>'+(sec.table||[]).slice(0,8).map(function(x){return '<div class="lr"><div class="nm">'+esc(x.segment)+'</div><div class="v">'+f1(x.weight)+'%</div><div class="v '+(x.call==='Strong'?'pos':(x.call==='Weak'?'neg':''))+'">'+esc(x.call)+(x.score!=null?' <small>'+f1(x.score)+'</small>':'')+'</div></div>';}).join('')+'</div></div>';
  var bands=function(title,counts,weights,ins){ var ks=Object.keys(weights||{}).sort(function(a,b){return (weights[b]||0)-(weights[a]||0);}); return '<div class="card"><div class="ch"><span class="t">'+title+'</span></div><div class="mix">'+ks.map(function(k,i){return '<i style="width:'+weights[k]+'%;background:'+cols[i%cols.length]+'"></i>';}).join('')+'</div><div class="mixl">'+ks.map(function(k,i){return '<span><i class="dot" style="background:'+cols[i%cols.length]+'"></i><b>'+f1(weights[k])+'%</b> '+esc(k)+' ('+(counts||{})[k]+')</span>';}).join('')+'</div><div class="sub2">'+esc(ins||'')+'</div></div>'; };
  h+=bands('Company size',cb.counts,cb.weights,cb.insight)+bands('Quality rating bands',qb.counts,qb.weights,qb.insight);
  /* 5 · gainers / losers */
  var mc=function(x,dn){ return '<a class="mc '+(dn?'dn':'')+'" href="/m/check?sym='+encodeURIComponent(x.symbol)+'"><div class="s">'+esc(x.symbol)+'</div><div class="seg">'+esc(x.company_name||'')+'</div><div class="p '+cls(x.pnl_pct)+'">'+pct(x.pnl_pct,1)+'</div><div class="g"><span>'+inrL(x.pnl_abs,true)+'</span><b>'+f1(x.weight)+'% wt</b></div></a>'; };
  h+='<div class="sec"><h2>Winners</h2><span class="hint">'+esc(wl.insight||'')+'</span></div>'+((d.gainers||[]).length?'<div class="rl">'+d.gainers.map(function(x){return mc(x,false);}).join('')+'</div>':'<div class="emp">No holding is in profit.</div>');
  h+='<div class="sec"><h2>Losers</h2><span class="hint">'+(wl.losers||0)+' names</span></div>'+((d.losers||[]).length?'<div class="rl">'+d.losers.map(function(x){return mc(x,true);}).join('')+'</div>':'<div class="emp">No holding is in loss.</div>');
  /* 6 · valuation + risk */
  h+='<div class="strip"><div><div class="k">Portfolio P/E</div><div class="v">'+f1(val.portfolio_pe)+'</div></div><div><div class="k">Own sectors</div><div class="v">'+f1(val.sector_pe)+'</div></div><div><div class="k">Nifty P/E</div><div class="v">'+f1(val.nifty_pe)+'</div></div><div><div class="k">1-yr vs Nifty</div><div class="v '+cls(bm.portfolio_1y)+'">'+(bm.portfolio_1y!=null?pct(bm.portfolio_1y,1):'—')+'<small> · '+(bm.nifty50_1y!=null?pct(bm.nifty50_1y,1):'—')+'</small></div></div></div>';
  if(val.insight) h+='<div class="sub2" style="padding:6px 16px 0">'+esc(val.insight)+'</div>';
  if(rm) h+='<div class="strip"><div><div class="k">Beta</div><div class="v">'+f2(rm.beta)+'</div></div><div><div class="k">Sharpe</div><div class="v">'+f2(rm.sharpe)+'</div></div><div><div class="k">Max drawdown</div><div class="v neg">'+(rm.max_drawdown!=null?f1(rm.max_drawdown)+'%':'—')+'</div></div><div><div class="k">Std dev</div><div class="v">'+f1(rm.std_dev)+'</div></div></div>';
  /* 7 · holdings */
  h+='<div class="sec"><h2>Holdings</h2><span class="hint">'+(d.holdings||[]).length+' · sortable</span></div><div class="wrap" id="tb"></div>';
  /* 8 · review */
  var rep=d.replacements||[], rf=d.red_flags||[], rq=d.results_this_quarter||[], up=d.upcoming||[];
  h+='<div class="sec"><h2>Review list</h2><span class="hint">'+rep.length+' to review · '+rf.length+' flags</span></div>';
  h+= rep.length ? '<div class="lst">'+rep.map(function(x){return '<div class="row dn"><div><div class="nm">'+esc(x.holding)+'<span class="tag s">'+esc(x.action||'review')+'</span></div><div class="sub">'+esc(x.segment||'')+' · higher-rated peers: <b>'+(x.peers||[]).map(function(pp){return esc(pp.symbol||pp);}).join(', ')+'</b></div></div><div class="v"></div></div>';}).join('')+'</div>' : '<div class="emp"><b>Nothing to exit</b>No holding rates Weak. Hold quality, add on weakness.</div>';
  if(rf.length) h+='<div class="lst" style="margin-top:8px">'+rf.map(function(x){return '<div class="row"><div><div class="nm">'+esc(x.symbol)+'<span class="tag">'+esc(x.flag)+'</span></div><div class="sub">'+esc(x.detail||'')+'</div></div><div class="v"></div></div>';}).join('')+'</div>';
  var rqd=rq.filter(function(x){return !x.pending;});
  h+='<div class="sec"><h2>Results this quarter</h2><span class="hint">'+rqd.length+' reported · '+(d.results_yet_to_report||0)+' yet to</span></div>';
  h+= rqd.length ? '<div class="lst"><div class="lr h"><div class="nm">Name</div><div class="v">Sales</div><div class="v">Profit</div></div>'+rqd.slice(0,10).map(function(x){return '<div class="lr"><div class="nm">'+esc(x.symbol)+'</div><div class="v '+cls(x.sales_growth)+'">'+pct(x.sales_growth,1)+'</div><div class="v '+cls(x.profit_growth)+'">'+pct(x.profit_growth,1)+'</div></div>';}).join('')+'</div>' : '<div class="emp">No holding has reported this quarter yet.</div>';
  if(up.length) h+='<div class="sec"><h2>Coming up</h2><span class="hint">'+up.length+'</span></div><div class="cal">'+up.slice(0,6).map(function(x){return '<div class="cd"><div class="d">'+esc(dm(x.date))+'</div><div class="s">'+esc(x.symbol)+'</div></div>';}).join('')+'</div>';
  /* 9 · takeaways */
  h+='<div class="card"><div class="ch"><span class="t">What stands out</span></div><ul class="hl">'+(d.highlights||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="dark"><div class="k">Expert take</div><div class="p">'+esc(d.expert_take||'')+'</div><div class="k2">Research, not advice. '+esc(d.replacement_note||'')+'</div></div>';
  h+='<div class="note"><b>PDF.</b> The white-label PDF of this report is built on request for now; it will come to this page later.</div>';
  document.getElementById('body').innerHTML=h;
  ROWS=d.holdings||[]; KEY='weight'; ASC=false;
  COLS=[['symbol','Stock',function(v,r){return '<a href="/m/check?sym='+encodeURIComponent(v)+'">'+esc(v)+'<small>'+esc(r.segment||'')+'</small></a>';}],['cmp','CMP',f2],['qty','Qty',function(v){return v==null?'—':Number(v).toLocaleString('en-IN');}],['weight','Weight',function(v){return f1(v)+'%';}],['pnl_pct','P&L',function(v){return '<span class="'+cls(v)+'">'+pct(v,1)+'</span>';}],['gvm','Rating',function(v,r){return '<span class="'+((v||0)>=7?'gd':'')+'">'+f1(v)+'</span>'+(r.verdict?'<small>'+esc(r.verdict)+'</small>':'');}],['cap','Size']];
  tbl();
}
function fail(m){ document.getElementById('body').innerHTML='<div class="err">'+esc(m)+'</div>'; }
if(Q.view==='new'){ renderNew(); }
else {
  var url = Q.pid ? '/api/mobile/health_app/report?pid='+encodeURIComponent(Q.pid) : '/api/mobile/health_app/list';
  fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(d.error&&!(d.rows||[]).length){ fail('Could not load: '+d.error); return; } Q.pid ? renderReport(d) : renderList(d); }).catch(function(){ fail('Could not load portfolio health.'); });
}
</script>
