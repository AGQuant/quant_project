<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function kmHtml(k){
  return '<div class="he-km"><div class="he-k">Portfolios saved</div><div class="he-v">'+(k.portfolios_saved!=null?k.portfolios_saved:'—')+'</div>'
    + '<div class="he-kg">'
    + '<div class="he-cell"><div class="he-k">Holdings</div><div class="he-v">'+(k.holdings!=null?k.holdings:'—')+'</div></div>'
    + '<div class="he-cell"><div class="he-k">Realised trades</div><div class="he-v">'+(k.realised_trades!=null?k.realised_trades:'—')+'</div></div>'
    + '<div class="he-cell"><div class="he-k">Ledger rows</div><div class="he-v">'+(k.ledger_rows!=null?k.ledger_rows:'—')+'</div></div>'
    + '<div class="he-cell"><div class="he-k">Report</div><div class="he-v">'+(k.report_pages!=null?k.report_pages+' pages':'—')+'</div></div>'
    + '</div></div>';
}
function savedCardHtml(d){
  var sp=d.saved_portfolios||{}, rows=sp.rows||[];
  var lst = rows.map(function(r){
    return '<div class="he-lr"><span class="s">'+esc(r.name)+'</span><div class="r"><span class="a">'+(r.n_holdings!=null?r.n_holdings+' holdings':'')+'</span><span class="b">'+esc(r.status||'')+'</span></div></div>';
  }).join('');
  var more = sp.more>0 ? '<div class="he-more">+ '+sp.more+' more</div>' : '';
  return '<div class="he-c"><div class="he-ch"><span class="t">Saved portfolios</span><span class="n">'+(sp.count!=null?sp.count:'—')+'</span></div>'
    + '<div class="he-lst">'+lst+'</div>'+more
    + '<a class="he-link" href="/adaptive">Open a report &#8250;</a></div>';
}
function coversCardHtml(d){
  var rc=d.report_contents||{}, rows=rc.rows||[];
  var lst = rows.map(function(r){
    return '<div class="he-lr"><span class="s">'+esc(r.label)+'</span><div class="r"><span class="b">'+esc(r.page)+'</span></div></div>';
  }).join('');
  return '<div class="he-c"><div class="he-ch"><span class="t">What a report covers</span><span class="n">'+rows.length+' pages</span></div>'
    + '<div class="he-lst">'+lst+'</div>'
    + (rc.footer?'<div class="he-more">'+esc(rc.footer)+'</div>':'')+'</div>';
}
function storedCardHtml(d){
  var s=d.stored||{}, rows=s.rows||[];
  var lst = rows.map(function(r){
    return '<div class="he-lr"><span class="s">'+esc(r.label)+'</span><div class="r">'+(r.note?'<span class="a">'+esc(r.note)+'</span>':'')+'<span class="b">'+r.count+'</span></div></div>';
  }).join('');
  return '<div class="he-c"><div class="he-ch"><span class="t">Stored</span><span class="n">live</span></div><div class="he-lst">'+lst+'</div></div>';
}
function profitCardHtml(d){
  var p=d.profit_basis||{};
  return '<div class="he-c"><div class="he-ch"><span class="t">How profit is measured</span><span class="n">invested basis</span></div>'
    + '<div class="he-emp" style="margin-top:0">'+esc(p.message||'')+'</div></div>';
}
function addCardHtml(d){
  var a=d.add_portfolio||{};
  return '<div class="he-c"><div class="he-ch"><span class="t">Add a portfolio</span><span class="n">open</span></div>'
    + '<div class="he-emp" style="margin-top:0">'+esc(a.message||'')+'</div>'
    + (a.footnote?'<div class="he-more">'+esc(a.footnote)+'</div>':'')+'</div>';
}

function render(d){
  var k=d.key_metrics||{};
  document.getElementById('he-asof').textContent = (k.portfolios_saved!=null?k.portfolios_saved:'—')+' portfolios · '+(k.holdings!=null?k.holdings:'—')+' holdings · '+(k.realised_trades!=null?k.realised_trades:'—')+' realised trades';
  var html = kmHtml(k)
    + '<div class="he-slab"><h2>Reports</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="he-rail">'+savedCardHtml(d)+coversCardHtml(d)+'</div>'
    + '<div class="he-slab"><h2>The numbers behind them</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="he-rail">'+storedCardHtml(d)+profitCardHtml(d)+'</div>'
    + '<div class="he-slab"><h2>Make a new one</h2><span class="hint">1 · swipe →</span></div>'
    + '<div class="he-rail">'+addCardHtml(d)+'</div>'
    + '<div class="he-note"><b>Real client names, not a masked sample.</b> The design ref masked every client as "Portfolio 1/2/3" for the repo copy only — this page reads actual names from hr_portfolios. <b>Reports stay white-label</b> — they never say Scorr or GVM, only Rating.</div>';
  document.getElementById('he-body').innerHTML = html;
}

fetch('/api/mobile/health_app', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error){ document.getElementById('he-body').innerHTML = '<div class="he-err he-empty">Could not load: '+esc(d.error)+'</div>'; return; }
    render(d);
  })
  .catch(function(e){ document.getElementById('he-body').innerHTML = '<div class="he-err he-empty">Could not load portfolios.</div>'; });
</script>
</body></html>
