<style>
/* page-local ma-* rules — geometry from the R3 ref, colours from the contract, lengths from the scale */
.ma{font-family:Sora,-apple-system,sans-serif;color:var(--ink);padding-bottom:var(--space-80)}
.ma-asof{padding:var(--space-10) var(--space-16) 0;font-size:var(--type-10);color:var(--muted);letter-spacing:var(--track-em7)}
.ma-asof b{color:var(--ink);font-weight:600}
/* KEY METRICS: one TALL card, never a rail */
.ma-km{margin:var(--space-10) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-left:var(--bw-3) solid var(--brand);
 border-radius:0 var(--radius-16) var(--radius-16) 0;padding:var(--space-15) var(--space-16)}
.ma-km.up{border-left-color:var(--win)} .ma-km.dn{border-left-color:var(--loss)}
.ma-km .k{font-size:var(--type-10);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em12)}
.ma-km .v{font-size:var(--type-30);font-weight:800;line-height:1.03;margin-top:var(--space-5)}
.ma-kg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);margin-top:var(--space-13)}
.ma-cell{background:var(--hi);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-11);padding:var(--space-9) var(--space-11)}
.ma-cell .k{font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em10)}
.ma-cell .v{font-size:var(--type-135);font-weight:700;margin-top:var(--space-3)}
/* SECTION = label + ONE sideways rail */
.ma-slab{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-20) var(--space-16) var(--space-8)}
.ma-slab h2{font-size:var(--type-115);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em14);margin:0}
.ma-slab .hint{font-size:var(--type-10);color:var(--muted)}
.ma-rail{display:flex;gap:var(--space-11);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--space-2) var(--space-16) var(--space-4);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ma-rail::-webkit-scrollbar{display:none}
/* three card widths, as the ref: default 62vw/250, .w 78vw/320 (list cards), .n 46vw/172 */
.ma-c{flex:0 0 62vw;max-width:250px;scroll-snap-align:start;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);position:relative}
.ma-c.w{flex:0 0 78vw;max-width:320px}
.ma-c.n{flex:0 0 46vw;max-width:172px}
.ma-c.up{border-left:var(--bw-3) solid var(--win);border-radius:0 var(--radius-14) var(--radius-14) 0}
.ma-c.dn{border-left:var(--bw-3) solid var(--loss);border-radius:0 var(--radius-14) var(--radius-14) 0}
.ma-c.gap{border-style:dashed}
.ma-ch{display:flex;align-items:baseline;justify-content:space-between}
.ma-ch .t{font-size:var(--type-11);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em11)}
.ma-ch .n{font-size:var(--type-11);color:var(--muted)}
.ma-lst{margin-top:var(--space-9)}
.ma-lr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-7) 0;border-bottom:var(--bw-1) solid var(--hi)}
.ma-lr:last-child{border-bottom:none}
.ma-lr .s{font-size:var(--type-125);font-weight:800}
.ma-lr .r{display:flex;gap:var(--space-11);align-items:baseline}
.ma-lr .a{font-size:var(--type-115);color:var(--muted)}
.ma-lr .b{font-size:var(--type-125);font-weight:700;min-width:52px;text-align:right}
.pos{color:var(--win)}.neg{color:var(--loss)}
.ma-more{font-size:var(--type-11);color:var(--muted);padding:var(--space-7) 0 0}
.ma-link{display:block;margin-top:var(--space-9);padding-top:var(--space-9);border-top:var(--bw-1) solid var(--edge);font-size:var(--type-115);font-weight:700;color:var(--brand);text-decoration:none}
.ma-sb{margin-top:var(--space-9)}
.ma-sb .row{display:flex;justify-content:space-between;font-size:var(--type-115);margin-bottom:var(--space-3)}
.ma-sb .row span:last-child{color:var(--muted)}
.ma-bar{height:5px;border-radius:var(--radius-3);background:var(--hi);margin-top:var(--space-8)}
.ma-bar i{display:block;height:5px;border-radius:var(--radius-3);background:var(--brand)}
.ma-emp{font-size:var(--type-115);color:var(--muted);line-height:1.6;margin-top:var(--space-7)}
.ma-emp b{display:block;color:var(--ink);font-size:var(--type-125);font-weight:700;margin-bottom:var(--space-5)}
.ma-note{margin:var(--space-22) var(--space-16) var(--space-8);padding:var(--space-12) var(--space-14);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--muted);line-height:1.65}
.ma-note b{color:var(--ink)}
.ma-err{margin:var(--space-16);color:var(--muted);font-size:var(--type-12);text-align:center}
</style>
</head>

if(t){}}catch(e){}
var __r1644=({goldday:'aquawhite',rosenight:'blush',rosewall:'blush',winepurple:'electricviolet',duskviolet:'electricviolet'})[t];if(__r1644){t=__r1644;try{localStorage.setItem('scorr_theme',t);}catch(e){}}document.body.setAttribute('data-theme',(window.SCORR_THEME&&window.SCORR_THEME.resolve)?window.SCORR_THEME.resolve():((t==='goldnight'||t==='dark'||t==='aquawhite'||t==='blush'||t==='ainight'||t==='silvergold'||t==='electricviolet'||t==='indigoash')?t:'goldnight'));

<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">My alerts</span></div><div class="as-slot"></div></div>
<div class="ma">
<div class="ma-asof" id="ma-asof">Loading…</div>
<div id="ma-body"><div class="ma-err">Loading alerts…</div></div>
</div>

  <a class="bn on" href="/m/dash"><span class="i">◍</span>Dash</a>
</nav>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function inr(v){ if (v==null||isNaN(Number(v))) return '—'; return '₹'+Number(v).toLocaleString('en-IN', {maximumFractionDigits:2}); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmt(ts){ if(!ts) return '—'; var d=new Date(String(ts).replace(' ','T'));
  if(isNaN(d)) return String(ts).slice(0,16);
  var i=new Date(d.getTime()+(330+d.getTimezoneOffset())*60000);
  return i.getDate()+' '+MON[i.getMonth()]+' '+('0'+i.getHours()).slice(-2)+':'+('0'+i.getMinutes()).slice(-2); }
function dmy(ts){ if(!ts) return ''; var p=String(ts).slice(0,10).split('-'); return p.length===3 ? (p[2]+' '+MON[Number(p[1])-1]+' '+p[0]) : ''; }
function card(cls, title, count, inner, link, href){
  return '<div class="ma-c '+cls+'"><div class="ma-ch"><span class="t">'+esc(title)+'</span><span class="n">'+esc(count)+'</span></div>'
    + inner + (link ? '<a class="ma-link" href="'+href+'">'+link+' ›</a>' : '') + '</div>';
}
function emp(t, b){ return '<div class="ma-emp"><b>'+esc(t)+'</b>'+esc(b)+'</div>'; }
function more(n, shown){ return n>shown ? '<div class="ma-more">+'+(n-shown)+' more</div>' : ''; }
function nz(v){ return v==null?'—':v; }

function kmHtml(o){
  var set=o.custom_count||0, fired=o.history_count||0;
  return '<div class="ma-km"><div class="k">Your alerts</div><div class="v">'+set+'</div>'
    + '<div class="ma-kg">'
    + '<div class="ma-cell"><div class="k">Set by you</div><div class="v">'+set+'</div></div>'
    + '<div class="ma-cell"><div class="k">Fired or dismissed</div><div class="v">'+fired+'</div></div>'
    + '</div></div>';
}
function customCard(d){
  var o=d.own_alerts||{}, n=o.custom_count||0, list=o.custom||[];
  if(!n) return card('w gap', 'Custom', 0, emp('You have not set any', 'Price triggers you set yourself. The Custom alert tile on the grid writes into this card.'), 'Set an alert', '/m/alerts#new');
  var rows = '<div class="ma-lst">'+list.map(function(a){
    return '<div class="ma-lr"><span class="s">'+esc(a.symbol)+'</span><div class="r"><span class="a">'+esc(a.direction||'')+'</span><span class="b">'+inr(a.trigger_price)+'</span></div></div>';
  }).join('')+'</div>';
  return card('w', 'Custom', n, rows+more(n, list.length), 'Set an alert', '/m/alerts#new');
}
function historyCard(d){
  var o=d.own_alerts||{}, n=o.history_count||0, list=o.history||[];
  if(!n) return card('w gap', 'History', 0, emp('Nothing has fired', 'Alerts that trigger or get dismissed land here with the date and the price at that moment.'), '', '');
  var rows = '<div class="ma-lst">'+list.map(function(a){
    return '<div class="ma-lr"><span class="s">'+esc(a.symbol)+'</span><div class="r"><span class="a">'+esc(a.status||'')+' '+dmt(a.created_at)+'</span><span class="b">'+inr(a.trigger_price)+'</span></div></div>';
  }).join('')+'</div>';
  return card('w', 'History', n, rows+more(n, list.length), '', '');
}
function slab(h2, hint){ return '<div class="ma-slab"><h2>'+h2+'</h2><span class="hint">'+hint+' · swipe →</span></div>'; }
function render(d){
  var o=d.own_alerts||{}, on=(o.custom_count||0);
  document.getElementById('ma-asof').innerHTML = 'Read from <b>'+esc(d.as_of_source||'/api/mobile/myalerts')+'</b>'+(d.as_of?' · '+esc(dmy(d.as_of)):'');
  document.getElementById('ma-body').innerHTML = kmHtml(o)
    + slab('Your own alerts', on ? on+' set' : 'none set') + '<div class="ma-rail">'+customCard(d)+historyCard(d)+'</div>'
    + '<div class="ma-note"><b>Custom alerts only, for now.</b> This page shows the price triggers you set yourself and what happened to them. Engine price alerts and basket rebalance notices are not shown here yet.</div>';
}
fetch('/api/mobile/myalerts', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(d){ if(d.error){ document.getElementById('ma-body').innerHTML='<div class="ma-err">Could not load: '+esc(d.error)+'</div>'; return; } render(d); })
  .catch(function(){ document.getElementById('ma-body').innerHTML='<div class="ma-err">Could not load alerts.</div>'; });
</script>
</body></html>
