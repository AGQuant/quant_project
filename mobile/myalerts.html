<!-- ══ mobile/myalerts.html — MY ALERTS, the ONE alerts page (cc#2195, founder 17-Sep-2026 15:13 IST). The Home bell and the
     My Alerts grid tile both open it. Three sections behind a sticky tab bar: TRIGGERED (every fired alert, newest first,
     grouped by day) · PENDING (set, not yet fired; ⋯ or long-press → edit / delete) · CREATE (the cc#2095 full-screen builder,
     up to 5 conditions, AND/OR, plus the simple price alert). Data: /api/mobile/myalerts (trade_alerts_app.py) — the founder's
     own alerts only (custom_alerts + trade_alerts with source_engine IS NULL), the bell's own rule. Card grammar = the TC
     Scanner card (left accent, big symbol, muted sub line, accent row). Contract tokens only; every class al- prefixed.
     Supersedes the cc#1896 / 10-Sep section page (counter card + three rails). -->

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayLabel(day, today){ if(!day) return 'Earlier'; if(day===today) return 'Today'; var p=day.split('-'); var d=new Date(Date.UTC(Number(p[0]),Number(p[1])-1,Number(p[2]))); var t=today?today.split('-'):null; if(t){ var td=new Date(Date.UTC(Number(t[0]),Number(t[1])-1,Number(t[2]))); if((td-d)/86400000===1) return 'Yesterday'; } return p[2].replace(/^0/,'')+' '+MON[Number(p[1])-1]+' '+p[0]; }
var SEEN_KEY='scorr_alerts_seen_custom', D=null, TAB='triggered', SHEET=null;
function tabFromHash(){ var h=(location.hash||'').replace('#',''); if(h==='new') return 'create'; return (h==='pending'||h==='create'||h==='triggered')?h:'triggered'; }
function setTab(t, push){ TAB=t; document.querySelectorAll('.al-tab').forEach(function(b){ var on=b.getAttribute('data-tab')===t; b.classList.toggle('al-on',on); b.setAttribute('aria-selected',on?'true':'false'); }); document.querySelectorAll('.al-sec').forEach(function(s){ s.classList.toggle('al-on', s.id==='al-'+t); }); if(push!==false){ try{ history.replaceState(null,'',location.pathname+location.search+'#'+t); }catch(e){} } window.scrollTo(0,0); }
document.querySelectorAll('.al-tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-tab')); }); });
window.addEventListener('hashchange', function(){ if(location.hash==='#new'){ setTab('create'); openBuilder(); return; } setTab(tabFromHash(), false); });
function hdrH(){ try{ var h=document.getElementById('al-hdr').getBoundingClientRect().height; document.documentElement.style.setProperty('--al-hdr', Math.round(h)+'px'); }catch(e){} }
window.addEventListener('load', hdrH); window.addEventListener('resize', hdrH); hdrH();
/* ═══ cards ═══ */
function chips(r){ return '<div class="al-chips">'+(r.conditions||[]).map(function(c){ return (c.join?'<span class="al-join">'+esc(c.join)+'</span>':'')+'<span class="al-chip">'+esc(c.text)+(c.last_value!=null?'<small>now '+esc(String(c.last_value))+(c.last_seen?' · '+esc(c.last_seen):'')+'</small>':'')+'</span>'; }).join('')+'</div>'; }
function tag(r){ if(r.type==='custom') return '<span class="al-tag">Custom · '+(r.conditions||[]).length+' condition'+((r.conditions||[]).length===1?'':'s')+'</span>'; var d=(r.direction||'').toUpperCase(); return '<span class="al-tag '+(d==='SELL'||d==='SHORT'?'al-sell':'al-buy')+'">'+esc(d||'price')+' · price alert</span>'; }
function accent(r){ if(r.type!=='price') return ''; var d=(r.direction||'').toUpperCase(); return (d==='SELL'||d==='SHORT')?' al-sell':' al-buy'; }
function firedCard(r){
  var done=r.type==='price'&&(r.status==='approved'||r.status==='dismissed');
  return '<div class="al-card'+accent(r)+(done?' al-done':'')+'" data-key="'+esc(r.key)+'"><div class="al-ceye"><span>Fired '+esc(r.fired_ist||'—')+'</span>'+tag(r)+'</div>'
   +'<div class="al-big"><a class="al-sym" href="/m/check?sym='+encodeURIComponent(r.symbol)+'">'+esc(r.symbol)+'</a><span class="al-when">set '+esc(r.set_ist||'—')+'</span></div>'
   +(r.type==='custom'?chips(r)+(r.label?'<div class="al-sub al-mu">'+esc(r.label)+'</div>':''):'<div class="al-sub"><b>'+esc(r.text)+'</b></div>')
   +(r.outcome?'<div class="al-acc"><span>Then: <b>'+esc(r.outcome)+'</b></span></div>':'')+'</div>';
}
function pendingCard(r){
  return '<div class="al-card'+accent(r)+'" data-key="'+esc(r.key)+'" data-pend="1"><div class="al-ceye"><span>Set '+esc(r.set_ist||'—')+'</span>'+tag(r)+'</div>'
   +'<div class="al-big"><a class="al-sym" href="/m/check?sym='+encodeURIComponent(r.symbol)+'">'+esc(r.symbol)+'</a></div>'
   +(r.type==='custom'?chips(r)+(r.label?'<div class="al-sub al-mu">'+esc(r.label)+'</div>':''):'<div class="al-sub"><b>'+esc(r.text)+'</b> <span class="al-mu">· '+esc(r.live_text||'')+'</span></div>')
   +'<div class="al-acc"><span>'+(r.type==='custom'?'Checked every 5 min in market hours and after the daily close':'Checked every 5 min in market hours')+'</span><button class="al-more" type="button" data-more="'+esc(r.key)+'" aria-label="Edit or delete this alert">⋯</button></div></div>';
}
function renderTriggered(){
  var host=document.getElementById('al-triggered'), rows=D.triggered||[];
  if(!rows.length){ host.innerHTML='<div class="al-emp"><b>Nothing has fired yet</b>When an alert you set triggers, it lands here with the time it fired.</div>'; return; }
  var h='', day=null;
  rows.forEach(function(r){ if(r.day!==day){ day=r.day; h+='<div class="al-day">'+esc(dayLabel(day, D.today))+'</div>'; } h+=firedCard(r); });
  host.innerHTML=h;
}
function renderPending(){
  var host=document.getElementById('al-pending'), rows=D.pending||[];
  host.innerHTML= rows.length ? '<div class="al-day">'+rows.length+' waiting</div>'+rows.map(pendingCard).join('') : '<div class="al-emp"><b>No alert is waiting</b>Create one — up to 5 conditions on a stock, or a simple price level.</div>';
  host.querySelectorAll('[data-more]').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); openSheet(b.getAttribute('data-more')); }); });
  host.querySelectorAll('.al-card[data-pend]').forEach(function(c){ var t=null; var start=function(){ clearTimeout(t); t=setTimeout(function(){ openSheet(c.getAttribute('data-key')); }, 550); }; var stop=function(){ clearTimeout(t); }; c.addEventListener('touchstart', start, {passive:true}); c.addEventListener('touchend', stop); c.addEventListener('touchmove', stop); c.addEventListener('touchcancel', stop); c.addEventListener('mousedown', start); c.addEventListener('mouseup', stop); c.addEventListener('mouseleave', stop); c.addEventListener('contextmenu', function(e){ e.preventDefault(); }); });
}
function renderCreate(){
  var reg=D.registry||{}, cats={}; Object.keys(reg).forEach(function(k){ var c=reg[k].category||'Other'; cats[c]=(cats[c]||0)+1; });
  document.getElementById('al-create').innerHTML='<div class="al-cre"><div class="al-t">Create an alert</div><div class="al-p">Pick a stock, then up to <b>'+(D.max_conditions||5)+'</b> conditions joined with AND / OR — RSI, day move, GVM score, 50-DMA and more. The server checks the whole chain every 5 minutes in market hours and after the daily close.</div>'
   +'<div class="al-cats">'+Object.keys(cats).map(function(c){ return '<span class="al-cat"><b>'+esc(c)+'</b> · '+cats[c]+'</span>'; }).join('')+'</div>'
   +'<button class="al-btn" type="button" id="al-new">＋ Create custom alert</button><button class="al-btn2" type="button" id="al-price">Set a simple price alert</button><div class="al-msg" id="al-cmsg"></div></div>'
   +'<div class="al-note"><b>Where alerts land.</b> A fired alert shows under Triggered with its time; one still waiting shows under Pending, where you can edit or delete it. The bell on Home counts what is new.</div>';
  document.getElementById('al-new').addEventListener('click', function(){ openBuilder(); });
  document.getElementById('al-price').addEventListener('click', function(){ if(window.ScorrAlertCreate){ window.ScorrAlertCreate.open(function(){ afterCreate('Price alert set.'); }); } else { document.getElementById('al-cmsg').textContent='The price alert form is not loaded on this page.'; } });
}
function openBuilder(prefill){
  if(!window.ScorrCustomAlertCreate){ var m=document.getElementById('al-cmsg'); if(m) m.textContent='The alert builder is not loaded on this page.'; return; }
  window.ScorrCustomAlertCreate.open(function(){ afterCreate(prefill?'Alert updated.':'Custom alert created.'); }, prefill||null);
}
function afterCreate(msg){ toast(msg); load().then(function(){ setTab('pending'); }); }
function toast(m){ var t=document.createElement('div'); t.className='al-toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200); }
/* ═══ edit / delete sheet ═══ */
function rowByKey(k){ return (D.pending||[]).concat(D.triggered||[]).filter(function(r){ return r.key===k; })[0]; }
function closeSheet(){ if(SHEET){ SHEET.remove(); SHEET=null; } }
function openSheet(key){
  var r=rowByKey(key); if(!r) return; closeSheet();
  SHEET=document.createElement('div'); SHEET.className='al-ov';
  SHEET.innerHTML='<div class="al-sheet" role="dialog" aria-modal="true"><div class="al-sh"><b>'+esc(r.symbol)+'</b> · '+(r.type==='custom'?'custom alert':'price alert')+'</div>'
   +(r.type==='custom'?'<button class="al-act" type="button" data-act="edit">Edit — change the conditions</button>':'')
   +'<button class="al-act al-danger" type="button" data-act="delete">Delete this alert</button><div class="al-msg" id="al-smsg"></div><button class="al-act al-cancel" type="button" data-act="cancel">Cancel</button></div>';
  SHEET.addEventListener('click', function(e){ if(e.target===SHEET) closeSheet(); });
  SHEET.querySelector('[data-act="cancel"]').addEventListener('click', closeSheet);
  var ed=SHEET.querySelector('[data-act="edit"]'); if(ed) ed.addEventListener('click', function(){ closeSheet(); openBuilder({symbol:r.symbol, label:r.label, replace_id:r.id, conditions:(r.conditions||[]).map(function(c){ return {metric_key:c.metric_key, operator:c.operator, threshold:c.threshold, join_operator:c.join}; })}); });
  var del=SHEET.querySelector('[data-act="delete"]'); del.addEventListener('click', function(){
    if(del.getAttribute('data-armed')!=='1'){ del.setAttribute('data-armed','1'); del.textContent='Tap again to delete '+r.symbol; return; }
    del.disabled=true; var msg=document.getElementById('al-smsg'); msg.textContent='Deleting…';
    var url=r.type==='custom'?'/api/custom_alerts/delete':'/api/alerts/dismiss';
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id:r.id})}).then(function(x){ return x.json().then(function(d){ return {ok:x.ok, d:d}; }); }).then(function(x){ if(!x.ok) throw new Error((x.d&&(x.d.detail||x.d.error))||'delete failed'); closeSheet(); toast('Deleted '+r.symbol+'.'); return load(); }).catch(function(e){ del.disabled=false; msg.textContent='Could not delete: '+e.message; });
  });
  document.body.appendChild(SHEET);
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
/* ═══ seen: the bell's badge clears for what this page has shown ═══ */
function markSeen(){
  var ids=(D.triggered||[]).concat(D.pending||[]).filter(function(r){ return r.type==='price'&&r.seen===false; }).map(function(r){ return r.id; });
  if(ids.length){ fetch('/api/alerts/seen',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({ids:ids})}).catch(function(){}); }
  try{ var seen=JSON.parse(localStorage.getItem(SEEN_KEY)||'[]')||[]; (D.triggered||[]).forEach(function(r){ if(r.type==='custom'&&seen.indexOf(String(r.key))===-1) seen.push(String(r.key)); }); localStorage.setItem(SEEN_KEY, JSON.stringify(seen.slice(-200))); }catch(e){}
}
function render(){
  document.getElementById('al-n-triggered').textContent=(D.counts||{}).triggered||0; document.getElementById('al-n-pending').textContent=(D.counts||{}).pending||0;
  var ct=(D.counts||{}).triggered_today||0;
  document.getElementById('al-sub').textContent=(ct?ct+' fired today · ':'')+((D.counts||{}).pending||0)+' waiting';
  renderTriggered(); renderPending(); renderCreate(); markSeen();
}
function load(){
  return fetch('/api/mobile/myalerts',{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){ if(!d||d.error) throw new Error((d&&d.error)||'no data'); D=d; render(); }).catch(function(e){ document.getElementById('al-triggered').innerHTML='<div class="al-err">Could not load your alerts: '+esc(e.message)+'</div>'; });
}
setTab(tabFromHash(), false);
load().then(function(){ if(location.hash==='#new') openBuilder(); });
</script>
