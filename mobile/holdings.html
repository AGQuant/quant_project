<style>
/* cc 1779 - page-local rules (pf-*). Colours are bridge names only; no literal. */
.pf-sect{display:flex;align-items:center;gap:10px;margin:18px 14px 8px}

.pf-card svg{display:block;width:100%;height:auto;overflow:visible}

.pf-note b{color:var(--txt);font-weight:600}

.pf-f.on{background:color-mix(in srgb,var(--blu) 12%,transparent);border-color:var(--blu);color:var(--blu)}

.pf-t th{text-align:left;font-size:9px;letter-spacing:.1em;color:var(--dim);font-weight:600;padding:0 0 7px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',ui-monospace,monospace}
.pf-t th.n,.pf-t td.n{text-align:right}

.pf-pnl.up{color:var(--grn)} .pf-pnl.dn{color:var(--red)}
.pf-more{margin-top:10px;text-align:center;font-size:11px;color:var(--blu);border:1px solid var(--line);border-radius:9px;padding:0;min-height:44px;width:100%;background:transparent;cursor:pointer;font-family:inherit}
.pf-open .c{margin:0 12px 9px}
.pf-err{margin:12px}

try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;}catch(e){}})();</script>
<!-- cc#1645 P5: shared appshell header (VARIANT B). -->
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">My Portfolio</span></div><div class="as-slot"></div></div>
<div class="screen">
  <div class="head as-hide"><h1>My Portfolio</h1><div class="s" id="sub">loading…</div></div>
  <div id="pf-body"><div class="loading">Loading portfolio…</div></div>

<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){ if (v==null||isNaN(Number(v))) return '—';
  var x=Number(v); return x<100?x.toFixed(2):Math.round(x).toLocaleString('en-IN'); }
function inr(v, signed){ if (v==null||isNaN(Number(v))) return '—';
  var x=Number(v), s = x<0 ? '−' : (signed && x>0 ? '+' : '');
  return s+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function pct(v){ if (v==null||isNaN(Number(v))) return '—';
  var x=Number(v); return (x>=0?'+':'−')+Math.abs(x).toFixed(2)+'%'; }
function cls(v){ return v==null?'na':(Number(v)>0?'up':(Number(v)<0?'dn':'')); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3 ? (p[2]+'-'+MON[Number(p[1])-1]) : String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16)+' IST'; }
function railHtml(r){ if(!r) return '';
  var s=(r.state||'CLOSED').toLowerCase();
  return '<span class="rail rail-'+s+'" title="'+esc(r.why||'')+'"><i></i>'+esc(r.state)+'</span>'; }
function strip(sym){
  try { if (window.ScorrCardRow) return window.ScorrCardRow(sym); } catch(e) {}
  return '';
}
var PF = { data:null, filter:'all', showAll:false };

/* ── HERO: two windows, two bases ─────────────────────────────────────────────────────── */
function heroHtml(d){
  var h=d.hero||{}, o=d.open||{};
  var flat = !h.open_count;
  var pricesLine = h.prices_as_of
    ? 'Prices as of '+dmt(h.prices_as_of)+' · '+esc(h.prices_basis||'last close')+'.'
    : 'No open positions · book is flat.';
  var realLine = (h.realised_from && h.realised_to)
    ? ' Realised covers '+dm(h.realised_from)+' to '+dm(h.realised_to)+' ('+h.closed_count+' closed trades).'
    : ' No closed trades yet.';
  return '<div class="pf-card"><div class="pf-hero">'
    + '<div class="b wide"><div class="pf-k">COMBINED P&amp;L</div><div class="pf-v '+cls(h.combined)+'">'+inr(h.combined,true)+'</div></div>'
    + '<div class="b"><div class="pf-k">REALISED</div><div class="pf-v sm '+cls(h.realised)+'">'+inr(h.realised,true)+'</div></div>'
    + '<div class="b"><div class="pf-k">OPEN MTM</div><div class="pf-v sm '+(flat?'na':cls(h.open_mtm))+'">'+(flat?'—':inr(h.open_mtm,true))+'</div></div>'
    + '<div class="b"><div class="pf-k">POSITION VALUE</div><div class="pf-v sm'+(flat?' na':'')+'">'+(flat?'—':inr(h.position_value))+'</div></div>'
    + '<div class="b"><div class="pf-k">OPEN / CLOSED</div><div class="pf-v sm">'+(h.open_count==null?'—':h.open_count)+' <small>/ '+(h.closed_count==null?'—':h.closed_count)+'</small></div></div>'
    + '</div><div class="pf-asof">'+pricesLine+realLine+'</div></div>';
}

/* ── PERFORMANCE: cumulative realised from closed trades. Nothing else is drawn. ────────── */
function chartSvg(series){
  var W=340,H=130,PT=8,PB=18,PL=2,PR=2;
  if(!series||!series.length) return '<div class="pf-absent">No closed trades yet, so there is no realised line to draw.</div>';
  var vals=series.map(function(p){return Number(p.cum);});
  var lo=Math.min(0, Math.min.apply(null,vals)), hi=Math.max(0, Math.max.apply(null,vals));
  if(hi===lo) hi=lo+1;
  var n=series.length;
  var x=function(i){ return n===1 ? (W/2) : PL+i*(W-PL-PR)/(n-1); };
  var y=function(v){ return PT+(hi-v)*(H-PT-PB)/(hi-lo); };
  var pts=series.map(function(p,i){ return [x(i), y(Number(p.cum))]; });
  var line=pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  var area=line+' L '+(W-PR)+' '+y(0).toFixed(1)+' L '+PL+' '+y(0).toFixed(1)+' Z';
  var pi=vals.indexOf(Math.max.apply(null,vals)), peak=pts[pi], last=pts[pts.length-1], lastV=vals[vals.length-1];
  var peakLabelX = Math.max(30, Math.min(W-30, peak[0]));
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Cumulative realised P&L from closed trades">'
    + '<defs><linearGradient id="pfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--grn)" stop-opacity=".22"/><stop offset="1" stop-color="var(--grn)" stop-opacity="0"/></linearGradient></defs>'
    + '<line x1="'+PL+'" y1="'+y(0).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y(0).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'
    + '<path d="'+area+'" fill="url(#pfg)"/>'
    + '<path d="'+line+'" fill="none" stroke="var(--grn)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="'+peak[0].toFixed(1)+'" cy="'+peak[1].toFixed(1)+'" r="2.6" fill="var(--panel)" stroke="var(--mut)" stroke-width="1.4"/>'
    + '<text x="'+peakLabelX.toFixed(1)+'" y="'+(peak[1]-6).toFixed(1)+'" fill="var(--mut)" font-size="8" font-family="IBM Plex Mono,ui-monospace,monospace" text-anchor="middle">peak '+esc(Math.round(vals[pi]).toLocaleString('en-IN'))+'</text>'
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2" fill="var(--grn)"/>'
    + '<text x="'+last[0].toFixed(1)+'" y="'+(last[1]-7).toFixed(1)+'" fill="var(--grn)" font-size="8.5" font-weight="700" font-family="IBM Plex Mono,ui-monospace,monospace" text-anchor="end">'+esc(Math.round(lastV).toLocaleString('en-IN'))+'</text>'
    + '<text x="'+PL+'" y="'+(H-4)+'" fill="var(--dim)" font-size="8" font-family="IBM Plex Mono,ui-monospace,monospace">'+esc(dm(series[0].d))+'</text>'
    + '<text x="'+(W-PR)+'" y="'+(H-4)+'" fill="var(--dim)" font-size="8" font-family="IBM Plex Mono,ui-monospace,monospace" text-anchor="end">'+esc(dm(series[n-1].d))+'</text>'
    + '<text x="'+(PL+3)+'" y="'+(y(0)-3).toFixed(1)+'" fill="var(--dim)" font-size="7.5" font-family="IBM Plex Mono,ui-monospace,monospace">0</text>'
    + '</svg>';
}
function perfHtml(d){
  var s=d.stats||{}, ser=d.series||[];
  var range = ser.length ? (dm(ser[0].d)+' → '+dm(ser[ser.length-1].d)+' · '+ser.length+' trading days') : '—';
  var tile=function(k,v,c){ return '<div class="pf-st"><div class="pf-k">'+k+'</div><div class="pf-v'+(c?' '+c:'')+'">'+v+'</div></div>'; };
  return '<div class="pf-card">'
    + '<div class="pf-ccap"><span class="t">REALISED P&amp;L &middot; CUMULATIVE</span><span class="r">'+esc(range)+'</span></div>'
    + chartSvg(ser)
    /* the honesty note — verbatim from the ref; it is the reason the chart is allowed to exist */
    + '<div class="pf-note"><b>Closed trades only.</b> This line is realised profit banked on exits, not the value of the portfolio. Open positions are excluded, so it does not move when a held stock does. There is no stored daily portfolio value, so a true equity curve cannot be drawn yet.</div>'
    + '<div class="pf-stats">'
    + tile('WIN RATE', s.win_rate==null?'—':Number(s.win_rate).toFixed(1)+'%')
    + tile('AVG WIN', inr(s.avg_win), s.avg_win==null?'na':'up')
    + tile('AVG LOSS', inr(s.avg_loss), s.avg_loss==null?'na':'dn')
    + tile('BEST', inr(s.best), cls(s.best))
    + tile('WORST', inr(s.worst), cls(s.worst))
    + tile('SYMBOLS', s.symbols==null?'—':s.symbols)
    + tile('PEAK', inr(s.peak))
    + tile('FROM PEAK', inr(s.from_peak,true), cls(s.from_peak))
    /* AVG HOLD: an em dash, never a 0 — holding_days is NULL on every row */
    + tile('AVG HOLD', s.avg_hold==null?'—':(Number(s.avg_hold).toFixed(1)+'d'), s.avg_hold==null?'na':'')
    + '</div>'
    + (s.avg_hold==null ? '<div class="pf-absent" id="pf-hold-note">Avg hold is blank because '+esc(s.avg_hold_note||'holding_days is not populated on these rows. Absent, not zero.')+'</div>' : '')
    + '</div>';
}

/* ── OPEN: the existing row anatomy and the C A R D strip (cc#1778 fix inherited via the bridge) ── */
function openCard(h){
  var short_=(h.direction||'').indexOf('S')===0;
  return '<div class="c '+((h.mtm||0)>=0?'bull':'bear')+'">'
    + '<div class="meta"><span class="tag '+(short_?'bear':'bull')+'">'+esc(h.direction||'LONG')+'</span>'
    + '<span class="tag cat">'+(h.qty==null?'--':Number(h.qty).toLocaleString('en-IN'))+' qty</span>'
    + '</div>'
    + '<div class="hl"><span class="sy">'+esc(h.symbol)+'</span>'
    + strip(h.symbol)
    + '<span class="pl '+cls(h.mtm)+'">'+inr(h.mtm,true)+'</span></div>'
    + '<div class="pc2">'
    + '<div class="kv"><div class="k">Entry → LTP</div><div class="v">'+px(h.entry)+' → '+px(h.ltp)+'</div></div>'
    + '<div class="kv"><div class="k">Value</div><div class="v">'+inr(h.value)+'</div></div>'
    + '<div class="kv"><div class="k">Return</div><div class="v '+cls(h.ret_pct)+'">'+pct(h.ret_pct)+'</div></div>'
    + '</div></div>';
}
function openHtml(d){
  var o=d.open||{};
  return '<div class="pf-sect"><b>OPEN &middot; '+(o.count||0)+'</b><i></i>'+railHtml(o.rail)+'</div>'
    + (o.empty
        ? '<div class="pf-empty"><b>Book is flat</b>'+esc(o.message||'No positions open.')+'</div>'
        : '<div class="pf-open">'+(o.rows||[]).map(openCard).join('')+'</div>');
}

/* ── CLOSED: newest first, filters, first 10 then show-all ─────────────────────────────── */
var PAGE=10;
function closedRows(d){
  var rows=d.closed||[], f=PF.filter;
  if(f==='wins') rows=rows.filter(function(r){return Number(r.pnl)>0;});
  else if(f==='losses') rows=rows.filter(function(r){return Number(r.pnl)<0;});
  else if(f==='long') rows=rows.filter(function(r){return (r.direction||'').indexOf('S')!==0;});
  else if(f==='short') rows=rows.filter(function(r){return (r.direction||'').indexOf('S')===0;});
  return rows;
}
function closedHtml(d){
  var all=d.closed||[], s=d.stats||{};
  var rows=closedRows(d), shown = PF.showAll ? rows : rows.slice(0,PAGE);
  var fb=function(k,l){ return '<button type="button" class="pf-f'+(PF.filter===k?' on':'')+'" data-f="'+k+'">'+l+'</button>'; };
  var body=shown.map(function(r){
    var win=Number(r.pnl)>0;
    return '<tr><td><div class="pf-tsym">'+esc(r.symbol)+'</div><div class="pf-tsub">'+esc(r.direction)+' '+(r.qty==null?'—':Number(r.qty).toLocaleString('en-IN'))+' &middot; '+esc(dm(r.date))+'</div></td>'
      + '<td class="n"><div>'+px(r.entry)+'</div><div class="pf-tsub">→ '+px(r.exit)+'</div></td>'
      + '<td class="n"><span class="pf-pnl '+cls(r.pnl)+'">'+inr(r.pnl,true)+'</span></td></tr>';
  }).join('');
  return '<div class="pf-sect"><b>CLOSED &middot; '+all.length+'</b><i></i></div>'
    + '<div class="pf-card" id="pf-closed">'
    + '<div class="pf-filters">'+fb('all','All '+all.length)+fb('wins','Wins '+(s.wins==null?'':s.wins))+fb('losses','Losses '+(s.losses==null?'':s.losses))+fb('long','Long')+fb('short','Short')+'</div>'
    + (rows.length
        ? '<table class="pf-t"><thead><tr><th>TRADE</th><th class="n">ENTRY → EXIT</th><th class="n">P&amp;L</th></tr></thead><tbody>'+body+'</tbody></table>'
        : '<div class="pf-absent">No trades match this filter.</div>')
    + (rows.length>PAGE && !PF.showAll ? '<button type="button" class="pf-more" id="pf-more">Show all '+rows.length+' closed trades</button>' : '')
    + (PF.showAll && rows.length>PAGE ? '<button type="button" class="pf-more" id="pf-less">Show first '+PAGE+'</button>' : '')
    + '</div>';
}
function render(){
  var d=PF.data; if(!d) return;
  document.getElementById('pf-body').innerHTML =
    heroHtml(d) + '<div class="pf-sect"><b>PERFORMANCE</b><i></i></div>' + perfHtml(d) + openHtml(d) + closedHtml(d)
    + '<div class="pf-asof" style="margin:12px 14px 0">Served '+esc(d.as_of||'')+' IST &middot; closed trades from the personal journal &middot; open book from SmartGain holdings.</div>';
}
document.getElementById('pf-body').addEventListener('click', function(e){
  var f=e.target.closest('[data-f]'); if(f){ PF.filter=f.getAttribute('data-f'); PF.showAll=false; render(); return; }
  if(e.target.closest('#pf-more')){ PF.showAll=true; render(); return; }
  if(e.target.closest('#pf-less')){ PF.showAll=false; render(); var c=document.getElementById('pf-closed'); if(c) c.scrollIntoView({block:'start'}); }
});
fetchWithTimeout('/api/mobile/portfolio').then(function(r){return r.json();}).then(function(d){
  if (d.error) throw new Error(d.error);
  PF.data=d;
  var h=d.hero||{};
  document.getElementById('sub').innerHTML = (h.open_count||0)+' open · '+(h.closed_count||0)+' closed '+railHtml((d.open||{}).rail);
  render();
}).catch(function(e){
  document.getElementById('pf-body').innerHTML =
    '<div class="pf-empty pf-err"><b>Could not load</b>'+esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sub').textContent='failed to load';
});
</script>
