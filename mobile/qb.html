<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quant Baskets · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
</head>
<body>
<div class="screen">
  <div class="head"><h1>Quant Baskets</h1><div class="s" id="sub">loading…</div></div>
  <div class="tot" id="tot" style="display:none">
    <div class="b"><div class="k">Market value</div><div class="v" id="tv"></div></div>
    <div class="b"><div class="k">Unrealised</div><div class="v" id="tu"></div></div>
  </div>
  <div class="body" id="body"><div class="loading">Loading baskets…</div></div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
var STATE={d:null,open:0};
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return x<100?x.toFixed(1):Math.round(x).toLocaleString('en-IN'); }
function inr(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return (x<0?'\u2212':'')+'Rs.'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function pct(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return (x>=0?'+':'')+x.toFixed(2)+'%'; }
function cls(v){ return v==null?'':(Number(v)>=0?'pos':'neg'); }
function railHtml(r){ if(!r) return '';
  var s=(r.state||'CLOSED').toLowerCase();
  return '<span class="rail rail-'+s+'" title="'+esc(r.why||'')+'"><i></i>'+esc(r.state)+'</span>'; }

function holding(h){
  return '<div class="h2"><span class="sy">'+esc(h.symbol)+'</span>'
    + '<span class="q">'+(h.qty==null?'':Number(h.qty).toLocaleString('en-IN'))
    + (h.since?' · since '+esc(h.since):'')+'</span>'
    + '<span class="p"><span>'+px(h.entry)+' \u2192 '+px(h.cmp)+'</span> '
    + '<span class="'+cls(h.pnl)+'">'+inr(h.pnl)+'</span></span></div>';
}
function card(b,i){
  var open=STATE.open===i;
  var h='<div class="c'+((b.unrealised||0)>=0?' bull':' bear')+'">'
    + '<div class="bh" onclick="tog('+i+')">'
    + '<span class="n">'+esc(b.label)+'<div class="meta" style="margin:3px 0 0">'
    + '<span class="tag cat">'+b.positions+' stocks</span>'
    + (b.ret_pct!=null?'<span class="tag '+((b.ret_pct>=0)?'bull':'bear')+'">'+pct(b.ret_pct)+'</span>':'')
    + '</div></span>'
    + '<span class="v">'+inr(b.market_value)
    + '<div class="u '+cls(b.unrealised)+'">'+inr(b.unrealised)+' unrl</div></span>'
    + '<span class="chev" style="color:var(--dim)">'+(open?'\u2304':'\u203a')+'</span></div>';
  if (open) h += (b.holdings||[]).map(holding).join('');
  return h+'</div>';
}
function render(){
  var d=STATE.d;
  document.getElementById('sub').innerHTML =
    d.count+' baskets · marked daily '+railHtml(d.rail);
  if (d.count){
    document.getElementById('tot').style.display='flex';
    document.getElementById('tv').textContent=inr(d.total_value);
    var tu=document.getElementById('tu'); tu.textContent=inr(d.total_unrealised);
    tu.className='v '+cls(d.total_unrealised);
  }
  document.getElementById('body').innerHTML = d.count
    ? d.baskets.map(card).join('')
    : '<div class="empty"><b>No baskets yet</b>Ready-made baskets appear here.</div>';
}
function tog(i){ STATE.open=(STATE.open===i?-1:i); render(); }
fetchWithTimeout('/api/mobile/qb').then(function(r){return r.json();}).then(function(d){
  if (d.error) throw new Error(d.error);
  STATE.d=d; render();
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>'+esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sub').textContent='failed to load';
});
</script>
</body>
</html>
