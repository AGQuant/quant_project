<style>
/* cc#1892 — page-local rules (qa-*). Same discipline as mobile/myportfolio.html's .mp-* block:
   bridge colour tokens + scorr_themes.css scale tokens only, no raw hex. */
.qa-asof{padding:var(--space-10) var(--space-14) 0;font-size:var(--type-10);color:var(--dim)}
.qa-asof b{color:var(--mut);font-weight:600}
.qa-km{margin:var(--space-10) var(--space-12) 0;background:var(--panel);border:var(--bw-1) solid var(--line);
 border-left:var(--bw-3) solid var(--blu);border-radius:0 var(--radius-12) var(--radius-12) 0;padding:var(--space-14) var(--space-14)}
.qa-km.up{border-left-color:var(--grn)} .qa-km.dn{border-left-color:var(--red)}
.qa-k{font-size:var(--type-10);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:var(--track-em12)}
.qa-v{font-size:var(--type-24);font-weight:800;line-height:1.05;margin-top:var(--space-5);font-family:'IBM Plex Mono',ui-monospace,monospace}
.qa-v.up{color:var(--grn)} .qa-v.dn{color:var(--red)}
.qa-kg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);margin-top:var(--space-12)}
.qa-cell{background:var(--panel2);border:var(--bw-1) solid var(--line);border-radius:var(--radius-10);padding:var(--space-9) var(--space-10)}
.qa-cell .qa-k{font-size:var(--type-9)}
.qa-cell .qa-v{font-size:var(--type-14);margin-top:var(--space-3)}
.qa-slab{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-18) var(--space-14) var(--space-7)}
.qa-slab h2{font-size:var(--type-11);font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:var(--track-em12)}
.qa-slab .hint{font-size:var(--type-10);color:var(--dim)}
.qa-rail{display:flex;gap:var(--space-11);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--space-2) var(--space-14) var(--space-4);
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.qa-rail::-webkit-scrollbar{display:none}
.qa-c{flex:0 0 78vw;max-width:320px;scroll-snap-align:start;background:var(--panel);border:var(--bw-1) solid var(--line);
 border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);position:relative}
.qa-c.gap{border-style:dashed}
.qa-ch{display:flex;align-items:baseline;justify-content:space-between}
.qa-ch .t{font-size:var(--type-11);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:var(--track-em8)}
.qa-ch .n{font-size:var(--type-11);color:var(--mut)}
.qa-lst{margin-top:var(--space-9)}
.qa-lr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-7) 0;border-bottom:var(--bw-1) solid var(--panel2);
 cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit;font:inherit}
.qa-lr:last-child{border-bottom:none}
.qa-lr .s{font-size:var(--type-125);font-weight:800}
.qa-lr .r{display:flex;gap:var(--space-11);align-items:baseline}
.qa-lr .a{font-size:var(--type-115);color:var(--mut)}
.qa-lr .b{font-size:var(--type-125);font-weight:700;min-width:52px;text-align:right;font-family:'IBM Plex Mono',ui-monospace,monospace}
.qa-lr .b.up{color:var(--grn)} .qa-lr .b.dn{color:var(--red)}
.qa-lr.on .s{color:var(--blu)}
.qa-more{font-size:var(--type-11);color:var(--dim);padding:var(--space-7) 0 0}
.qa-link{display:block;margin-top:var(--space-9);padding-top:var(--space-9);border-top:var(--bw-1) solid var(--line);
 font-size:var(--type-115);font-weight:700;color:var(--blu);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;width:100%;text-align:left;font-family:inherit}
.qa-sb{margin-top:var(--space-9)}
.qa-sb .row{display:flex;justify-content:space-between;font-size:var(--type-115);margin-bottom:var(--space-3)}
.qa-sb .row span:last-child{color:var(--mut)}
.qa-bar{height:5px;border-radius:var(--radius-3);background:var(--panel2);margin-top:var(--space-8);margin-bottom:var(--space-9)}
.qa-bar i{display:block;height:5px;border-radius:var(--radius-3);background:var(--blu)}
.qa-emp{font-size:var(--type-115);color:var(--dim);line-height:1.6;margin-top:var(--space-7)}
.qa-emp.ink{color:var(--txt)}
.qa-emp b{display:block;color:var(--txt);font-size:var(--type-125);font-weight:700;margin-bottom:var(--space-5)}
.qa-ft{margin-top:var(--space-9);padding-top:var(--space-8);border-top:var(--bw-1) solid var(--line);font-size:var(--type-105);color:var(--mut)}
.qa-note{margin:var(--space-22) var(--space-14) var(--space-8);padding:var(--space-12) var(--space-14);
 border:var(--bw-1) dashed var(--line);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--dim);line-height:1.65}
.qa-note b{color:var(--mut)}
.qa-empty{padding:var(--space-14);color:var(--dim);font-size:var(--type-12);text-align:center}
.qa-err{margin:var(--space-14)}
</style>
</head>

<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){}}catch(e){}
var __r1644=({goldday:'aquawhite',rosenight:'blush',rosewall:'blush',winepurple:'electricviolet',duskviolet:'electricviolet'})[t];if(__r1644){t=__r1644;try{localStorage.setItem('scorr_theme',t);}catch(e){}}document.body.setAttribute('data-theme',(window.SCORR_THEME&&window.SCORR_THEME.resolve)?window.SCORR_THEME.resolve():((t==='goldnight'||t==='dark'||t==='aquawhite'||t==='blush'||t==='ainight'||t==='silvergold'||t==='electricviolet'||t==='indigoash')?t:'goldnight'));
try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;}catch(e){}})();</script>
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">Quant Baskets</span></div><div class="as-slot"></div></div>
<div class="qa-asof" id="qa-asof">Loading…</div>
<div id="qa-body"><div class="qa-empty">Loading baskets…</div></div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function inr(v){ if (v==null||isNaN(Number(v))) return '—';
  var x=Number(v); return (x<0?'−':'')+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function pct(v){ if (v==null||isNaN(Number(v))) return '—';
  var x=Number(v); return (x>=0?'+':'−')+Math.abs(x).toFixed(1)+'%'; }
function cls(v){ return v==null?'':(Number(v)>=0?'up':'dn'); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3 ? (p[2]+' '+MON[Number(p[1])-1]+' '+p[0]) : String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s); }

var QA = { data: null, basket: null };

function kmHtml(k){
  var updn = k.total_unrealised>=0 ? 'up' : 'dn';
  return '<div class="qa-km '+updn+'"><div class="qa-k">All baskets · unrealised</div><div class="qa-v '+updn+'">'+inr(k.total_unrealised)+'</div>'
    + '<div class="qa-kg">'
    + '<div class="qa-cell"><div class="qa-k">Market value</div><div class="qa-v">'+inr(k.total_value)+'</div></div>'
    + '<div class="qa-cell"><div class="qa-k">Baskets</div><div class="qa-v">'+k.baskets+'</div></div>'
    + '<div class="qa-cell"><div class="qa-k">Names held</div><div class="qa-v">'+k.names_held+'</div></div>'
    + '<div class="qa-cell"><div class="qa-k">Showing</div><div class="qa-v">'+esc(QA.data.selected_label)+'</div></div>'
    + '</div></div>';
}
function basketsCardHtml(d){
  var rows=d.baskets.rows;
  var body = rows.map(function(b){
    var on = b.basket===d.selected ? ' on' : '';
    return '<button type="button" class="qa-lr'+on+'" onclick="pickBasket(\''+b.basket+'\')"><span class="s">'+esc(b.label)+'</span><div class="r">'
      + '<span class="a">'+b.names+' names'+(b.value!=null?' · '+inr(b.value):'')+'</span>'
      + '<span class="b '+cls(b.return_pct)+'">'+(b.return_pct!=null?pct(b.return_pct):'—')+'</span></div></button>';
  }).join('');
  return '<div class="qa-c" style="flex-basis:92vw;max-width:380px"><div class="qa-ch"><span class="t">All baskets</span><span class="n">'+d.baskets.count+'</span></div>'
    + '<div class="qa-lst">'+body+'</div>'
    + '<div class="qa-more">Tap any basket to load it below</div></div>';
}
function holdingsCardHtml(d){
  var h=d.holdings, rows=h.rows;
  if(!rows.length) return '<div class="qa-c gap"><div class="qa-ch"><span class="t">Holdings</span><span class="n">0</span></div><div class="qa-emp"><b>No open positions</b>This basket is not currently holding any names.</div></div>';
  var body = rows.map(function(r){
    return '<div class="qa-lr"><span class="s">'+esc(r.symbol)+'</span><div class="r"><span class="a">'+inr(r.value)+'</span><span class="b '+cls(r.pnl_pct)+'">'+pct(r.pnl_pct)+'</span></div></div>';
  }).join('');
  var more = h.count>rows.length ? '<div class="qa-more">+ '+(h.count-rows.length)+' more</div>' : '';
  return '<div class="qa-c"><div class="qa-ch"><span class="t">Holdings</span><span class="n">'+h.count+'</span></div><div class="qa-lst">'+body+'</div>'+more+'</div>';
}
function laggardsCardHtml(d){
  var l=d.laggards, rows=l.rows;
  if(!rows.length) return '<div class="qa-c gap"><div class="qa-ch"><span class="t">Laggards</span><span class="n">0</span></div><div class="qa-emp"><b>Nothing in the red</b>Every open position in this basket is at or above its entry price.</div></div>';
  var body = rows.map(function(r){
    return '<div class="qa-lr"><span class="s">'+esc(r.symbol)+'</span><div class="r"><span class="a">'+inr(r.value)+'</span><span class="b dn">'+pct(r.pnl_pct)+'</span></div></div>';
  }).join('');
  var more = l.count>rows.length ? '<div class="qa-more">+ '+(l.count-rows.length)+' more</div>' : '';
  return '<div class="qa-c"><div class="qa-ch"><span class="t">Laggards</span><span class="n">'+l.count+' in the red</span></div><div class="qa-lst">'+body+'</div>'+more+'</div>';
}
function sectorCardHtml(mix){
  if(!mix||!mix.length) return '<div class="qa-c gap"><div class="qa-ch"><span class="t">Sector mix</span><span class="n">0</span></div><div class="qa-emp"><b>No open positions</b>Nothing to break down by sector today.</div></div>';
  var rows = mix.map(function(s){
    return '<div class="qa-sb"><div class="row"><span>'+esc(s.group)+'</span><span>'+s.pct.toFixed(1)+'%</span></div><div class="qa-bar"><i style="width:'+Math.min(100,s.pct)+'%"></i></div></div>';
  }).join('');
  return '<div class="qa-c"><div class="qa-ch"><span class="t">Sector mix</span><span class="n">'+mix.length+'</span></div>'+rows+'</div>';
}
function themeCardHtml(theme){
  return '<div class="qa-c gap"><div class="qa-ch"><span class="t">Theme split</span><span class="n">no data</span></div>'
    + '<div class="qa-emp"><b>Not tagged yet</b>'+esc(theme.note)+'</div></div>';
}
function methodCardHtml(m){
  return '<div class="qa-c"><div class="qa-ch"><span class="t">How it picks</span><span class="n">'+esc(m.cadence||'—')+'</span></div>'
    + '<div class="qa-emp ink">'+esc(m.text)+'</div>'
    + '<div class="qa-ft">Reviewed '+esc((m.cadence||'').toLowerCase()||'periodically')+' · '+m.holdings_count+' names held'
    + (m.next_rebalance?' · next '+dm(m.next_rebalance):'')+'</div></div>';
}
function rebalCardHtml(rh){
  var rows=rh.rows;
  if(!rows.length) return '<div class="qa-c gap"><div class="qa-ch"><span class="t">Rebalance history</span><span class="n">0</span></div><div class="qa-emp"><b>Nothing stored</b>No entry-date history recorded for this basket yet.</div></div>';
  var body = rows.map(function(r){
    return '<div class="qa-lr"><span class="s">'+dm(r.date)+'</span><div class="r"><span class="a">'+r.n_entered+' name'+(r.n_entered===1?'':'s')+' entered · '+esc(r.label)+'</span><span class="b">'+r.n_still_open+' held today</span></div></div>';
  }).join('');
  return '<div class="qa-c"><div class="qa-ch"><span class="t">Rebalance history</span><span class="n">'+rh.count+' change'+(rh.count===1?'':'s')+'</span></div>'
    + '<div class="qa-lst">'+body+'</div>'
    + '<div class="qa-more">'+esc(rh.note)+'</div></div>';
}

function render(){
  var d = QA.data;
  var open = d.holdings.count;
  document.getElementById('qa-asof').innerHTML = 'Marked <b>'+dmt(d.as_of)+'</b> · '+d.key_metrics.baskets+' baskets · '+d.key_metrics.names_held+' names · showing <b>'+esc(d.selected_label)+'</b>';
  var html = kmHtml(d.key_metrics)
    + '<div class="qa-slab"><h2>Baskets</h2><span class="hint">'+d.baskets.count+' · swipe →</span></div>'
    + '<div class="qa-rail">'+basketsCardHtml(d)+'</div>'
    + '<div class="qa-slab"><h2>'+esc(d.selected_label)+' · holdings</h2><span class="hint">'+open+' · swipe →</span></div>'
    + '<div class="qa-rail">'+holdingsCardHtml(d)+laggardsCardHtml(d)+'</div>'
    + '<div class="qa-slab"><h2>Where the money sits</h2><span class="hint">'+(d.sector_mix?d.sector_mix.length:0)+' sectors · swipe →</span></div>'
    + '<div class="qa-rail">'+sectorCardHtml(d.sector_mix)+themeCardHtml(d.theme)+'</div>'
    + '<div class="qa-slab"><h2>'+esc(d.selected_label)+' · the method</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="qa-rail">'+methodCardHtml(d.method)+rebalCardHtml(d.rebalance_history)+'</div>'
    + '<div class="qa-note"><b>The Baskets card is the switcher.</b> Tap a basket in it and every section below reloads for that basket. <b>Seven baskets, not thirteen</b> — the six finz_ baskets stay off the app, and the filter reads the registry, never a hardcoded name list. <b>Theme split is empty and says so</b>, because no theme tag exists on any holding.</div>';
  document.getElementById('qa-body').innerHTML = html;
}

function load(basket){
  var url = '/api/mobile/qb_app' + (basket ? ('?basket=' + encodeURIComponent(basket)) : '');
  fetch(url, {credentials:'same-origin'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.error){ document.getElementById('qa-body').innerHTML = '<div class="qa-err qa-empty">Could not load: '+esc(d.error)+'</div>'; return; }
      QA.data = d; QA.basket = d.selected;
      render();
    })
    .catch(function(e){ document.getElementById('qa-body').innerHTML = '<div class="qa-err qa-empty">Could not load baskets.</div>'; });
}
function pickBasket(name){
  if(name===QA.basket) return;
  load(name);   // cc#1892 P12: page scroll position is untouched by a basket switch — no forced scrollTo anywhere in this file
}
load();
</script>
</body></html>
