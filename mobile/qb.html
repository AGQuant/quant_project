<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pct(v, d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?1:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function inr(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return '₹'+Math.round(x).toLocaleString('en-IN'); }
function inrL(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return x>=100000?'₹'+(x/100000).toFixed(2)+'L':inr(x); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmy(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]+' '+p[0]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dmy(s)+', '+s.slice(11,16)+' IST'; }
function tok(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
var C={brand:tok('--brand'), way:tok('--wayfind'), edge:tok('--edge'), muted:tok('--muted')};

/* ── sparkline: basket (brand) over Nifty (wayfind, faint), shared scale ── */
function spark(pts){
  if(!pts||pts.length<2) return '<svg viewBox="0 0 96 38"></svg>';
  var b=pts.map(function(p){return p.b;}), i=pts.map(function(p){return p.i;});
  var all=b.concat(i).filter(function(x){return x!=null;}); var lo=Math.min.apply(null,all), hi=Math.max.apply(null,all); if(hi===lo) hi=lo+1;
  var y=function(v){ return v==null?null:(36-(v-lo)/(hi-lo)*34).toFixed(1); }, n=pts.length;
  var line=function(arr){ return arr.map(function(v,k){ var yy=y(v); return yy==null?null:((2+k*(92/(n-1))).toFixed(1)+','+yy); }).filter(Boolean).join(' '); };
  return '<svg viewBox="0 0 96 38" preserveAspectRatio="none"><polyline fill="none" stroke="'+C.way+'" stroke-width="1" opacity=".6" points="'+line(i)+'"/><polyline fill="none" stroke="'+C.brand+'" stroke-width="1.8" points="'+line(b)+'"/></svg>';
}
/* ── NAV chart: 320x120, four gridlines, labels from the real min/max ── */
function navChart(pts){
  if(!pts||pts.length<2) return '';
  var b=pts.map(function(p){return p.nav;}), i=pts.map(function(p){return p.bench;});
  var all=b.concat(i).filter(function(x){return x!=null;}); var lo=Math.floor(Math.min.apply(null,all)), hi=Math.ceil(Math.max.apply(null,all)); if(hi===lo) hi=lo+1;
  var y=function(v){ return v==null?null:(114-(v-lo)/(hi-lo)*99).toFixed(1); }, n=pts.length;
  var line=function(arr){ return arr.map(function(v,k){ var yy=y(v); return yy==null?null:((10+k*(300/(n-1))).toFixed(1)+','+yy); }).filter(Boolean).join(' '); };
  var grid='', labels='';
  for(var g=0; g<4; g++){ var yy=15+g*33; grid+='<line x1="0" y1="'+yy+'" x2="320" y2="'+yy+'"/>'; var val=hi-(hi-lo)*g/3; labels+='<text x="12" y="'+(yy-3)+'">'+val.toFixed(0)+'</text>'; }
  var first=pts[0].d, last=pts[n-1].d;
  return '<svg class="nav" viewBox="0 0 320 120" preserveAspectRatio="none"><g stroke="'+C.edge+'" stroke-dasharray="3 3" stroke-width="1">'+grid+'</g>'
    + '<polyline fill="none" stroke="'+C.way+'" stroke-width="1.2" opacity=".7" points="'+line(i)+'"/>'
    + '<polyline fill="none" stroke="'+C.brand+'" stroke-width="2" points="'+line(b)+'"/>'
    + '<g fill="'+C.muted+'" font-size="8" font-family="Sora">'+labels+'<text x="12" y="119">'+esc(dm(first))+'</text><text x="280" y="119">'+esc(dm(last))+'</text></g></svg>';
}
function card(title, n, inner){ return '<div class="card"><div class="ch"><span class="t">'+esc(title)+'</span><span class="n">'+n+'</span></div>'+inner+'</div>'; }
function emp(t,b){ return '<div class="emp"><b>'+esc(t)+'</b>'+esc(b)+'</div>'; }

/* ═══ EXPLORE ═══ */
function spine(c){
  var ret = c.return_pct==null ? '<div class="ret" style="color:var(--muted)">—</div><div class="vs">no history yet</div>'
    : '<div class="ret '+cls(c.return_pct)+'">'+pct(c.return_pct)+'</div><div class="vs">since '+esc(dm(c.since))+(c.bench_pct!=null?' · Nifty '+pct(c.bench_pct):'')+'</div>';
  return '<a class="sp" href="/m/qb?basket='+encodeURIComponent(c.basket)+'"><div class="rail"></div>'
    + '<div><div class="nm">'+esc(c.label)+'</div><div class="why">'+esc(c.why)+'</div>'
    + '<div class="row"><div><span class="k">Min · one share each</span><span class="v">'+inr(c.min_one_share)+'</span></div>'
    + '<div><span class="k">Rebalance</span><span class="v">'+esc(c.rebalance)+(c.next_rebalance?' · next '+esc(dm(c.next_rebalance)):'')+'</span></div></div></div>'
    + '<div class="spark">'+spark(c.spark)+'<div>'+ret+'</div></div></a>';
}
function renderList(d){
  document.getElementById('asof').innerHTML='Marked <b>'+esc(dmt(d.as_of))+'</b> · '+d.count+' baskets · live paper books, nothing backtested';
  var h='';
  (d.decks||[]).forEach(function(k){
    h+='<div class="qb-sec"><h2>'+esc(k.title)+'</h2><span class="hint">'+esc(k.hint)+' · '+k.rows.length+'</span></div>';
    h+= k.rows.length ? k.rows.map(spine).join('') : '<div class="card">'+emp('Nothing here yet','No basket is marked '+k.title.toLowerCase()+' in the registry.')+'</div>';
  });
  document.getElementById('body').innerHTML=h;
}

/* ═══ DETAIL ═══ */
var D=null, MIXK='cap';
function mixHtml(rows){
  var cols=[C.brand,C.way,C.muted,tok('--gold-lo'),tok('--label'),tok('--win'),tok('--loss'),tok('--accent'),tok('--gold-hi'),tok('--ink')];
  var bar=rows.map(function(r,i){ return '<i style="width:'+r.pct+'%;background:'+cols[i%cols.length]+'"></i>'; }).join('');
  var leg=rows.slice(0,6).map(function(r,i){ return '<span><i class="dot" style="background:'+cols[i%cols.length]+'"></i><b>'+r.pct.toFixed(1)+'%</b> '+esc(String(r.name).toLowerCase())+'</span>'; }).join('');
  var rest=rows.length>6 ? '<div class="more" style="padding-left:0">'+rows.slice(6).map(function(r){return esc(r.name)+' '+r.pct.toFixed(1);}).join(' · ')+'</div>' : '';
  return '<div class="mix">'+bar+'</div><div class="mixl">'+leg+'</div>'+rest;
}
function renderDetail(d){
  D=d; var nav=d.nav||{}, ev=d.evidence||{}, sc=d.scorecard, ru=d.rule||{}, hs=d.holdings||{}, hi=d.history||{};
  document.getElementById('pg-title').textContent=d.label; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='Marked <b>'+esc(dmt(d.as_of))+'</b> · '+esc(d.type==='Discretionary'?'Curated':'Quant')+' basket';
  var h='<div class="hero"><div class="eye">'+esc(d.type==='Discretionary'?'Curated':'Quant')+' basket · '+esc(d.cap_type||'')+' · '+esc(d.rebalance)+(d.since?' · live since '+esc(dmy(d.since)):'')+'</div><div class="nm">'+esc(d.label)+'</div>';
  if(nav.points&&nav.points.length>1){
    var last=nav.points[nav.points.length-1];
    h+='<div class="big"><div class="r '+cls(nav.basket_return_pct)+'">'+pct(nav.basket_return_pct)+'</div><div class="n">₹100 → ₹'+(last.nav!=null?last.nav.toFixed(2):'—')+'<br>'+esc(nav.benchmark_sym||'Nifty')+' → <b>₹'+(last.bench!=null?last.bench.toFixed(2):'—')+'</b> same days</div></div>'+navChart(nav.points);
  } else {
    h+='<div class="big"><div class="r" style="color:var(--muted)">—</div><div class="n">No NAV history yet for this basket.<br>The series starts on its first trading day.</div></div>';
  }
  h+='<div class="rng">'+[['MAX','Since start'],['3M','3M'],['1M','1M']].map(function(w){ return '<span data-w="'+w[0]+'"'+(nav.window===w[0]?' class="on"':'')+'>'+w[1]+'</span>'; }).join('')+'</div></div>';
  h+='<div class="strip"><div><div class="k">Beat Nifty by</div><div class="v '+cls(ev.alpha_pct)+'">'+(ev.alpha_pct==null?'—':pct(ev.alpha_pct).replace('%',' pts'))+'</div></div>'
    +'<div><div class="k">Hit rate</div><div class="v">'+(ev.of?ev.hit+' of '+ev.of:'—')+'</div></div>'
    +'<div><div class="k">Worst name</div><div class="v '+(ev.worst?cls(ev.worst.pnl_pct):'')+'">'+(ev.worst?pct(ev.worst.pnl_pct):'—')+'</div></div></div>';
  if(sc){
    var bar=function(l,v){ return '<div class="r"><span class="l">'+l+'</span><div class="bar"><i style="width:'+(v==null?0:Math.min(100,v*10))+'%"></i></div><span class="v">'+(v==null?'—':v.toFixed(1))+'</span></div>'; };
    h+=card('Scorecard of the book','avg of '+sc.n+' scored names','<div class="pil">'+bar('G',sc.g)+bar('V',sc.v)+bar('M',sc.m)+'<div class="sub">GVM at entry, averaged across the names held. The basket\'s character, not a promise.</div></div>');
  } else h+=card('Scorecard of the book','—',emp('No scores on record','None of the names held carries a GVM at entry yet.'));
  h+=card('The rule','plain words','<div class="rule">'+(ru.html||'')+'</div><div class="kv">'+(ru.cap?'<span>Cap <b>'+ru.cap+' names</b></span>':'')+'<span>Now <b>'+(ru.now!=null?ru.now:'—')+'</b></span>'+(d.next_rebalance?'<span>Next <b>'+esc(dm(d.next_rebalance))+'</b></span>':'')+(ru.cash_pct!=null?'<span>Cash <b>'+ru.cash_pct+'% in ETF</b></span>':'')+'</div>');
  h+='<div class="qb-sec"><h2>Holdings</h2><span class="hint">'+(hs.count||0)+' · by weight · swipe →</span></div>';
  h+= (hs.rows&&hs.rows.length) ? '<div class="rl">'+hs.rows.map(function(p){
      return '<div class="hc '+((p.pnl_pct||0)<0?'dn':'')+'"><div class="s">'+esc(p.symbol)+'</div><div class="seg">'+esc((p.sector||'')+(p.cap&&p.cap!=='—'?' · '+p.cap:''))+'</div><div class="p '+cls(p.pnl_pct)+'">'+pct(p.pnl_pct)+'</div><div class="g"><span>'+(p.weight_pct!=null?p.weight_pct+'% wt':'—')+'</span><b>'+(p.gvm!=null?'GVM '+p.gvm.toFixed(2):'no score')+'</b></div></div>';
    }).join('')+'</div>' : '<div class="card">'+emp('No open holdings','This basket holds nothing right now.')+'</div>';
  h+='<div class="more">'+(hs.count>hs.rows.length?'+'+(hs.count-hs.rows.length)+' more · ':'')+'<a href="/m/qb/holdings?basket='+encodeURIComponent(d.basket)+'">View holdings ›</a></div>';
  var mix=d.mix||{};
  h+='<div class="card"><div class="ch"><span class="t">Where the money sits</span><span class="tog" id="tog"><span data-k="cap" class="on">Cap</span><span data-k="sector">Sector</span></span></div><div id="mixbox">'+mixHtml(mix.cap||[])+'</div></div>';
  var rows=hi.rows||[];
  h+=card('What changed, and why', rows.length+' event'+(rows.length===1?'':'s'), rows.length ? '<div class="tl">'+rows.map(function(e){
      var stops=e.stops||[], sells=e.sells||[], buys=e.buys||[];
      var w=[]; if(stops.length) w.push('Stops closed <b>'+stops.map(function(s){return esc(s.symbol);}).join(', ')+'</b>.');
      if(sells.length) w.push('Sold <b>'+sells.map(function(s){return esc(s.symbol)+(s.why?' ('+esc(s.why)+')':'');}).join(', ')+'</b>.');
      if(buys.length) w.push((e.kind==='inception'?'First book: ':'Bought ')+'<b>'+buys.join(', ')+'</b>.');
      if(e.state==='AWAITING CONFIRMATION') w.push('New entries awaiting founder confirmation.');
      if(!w.length) w.push('No change.');
      return '<div class="ev '+(stops.length?'stop':'')+'"><div class="d">'+esc(dm(e.date))+'<small>'+esc(e.kind)+'</small></div><div class="w">'+(e.n_out?'<span class="chip out">−'+e.n_out+'</span>':'')+(e.n_in?'<span class="chip in">+'+e.n_in+'</span>':'')+w.join(' ')+'</div></div>';
    }).join('')+'</div>' : emp('No changes yet','Only real rebalances and stop exits are listed. The nightly checks are not events.'));
  h+='<div class="note"><b>Track record, plainly.</b> '+esc(nav.note||'')+' Min value on the list = one share of each holding. Nothing here is a backtest and nothing is a recommendation.</div>';
  document.getElementById('body').innerHTML=h;
  document.getElementById('tog').addEventListener('click', function(e){ var s=e.target.closest('[data-k]'); if(!s) return; MIXK=s.getAttribute('data-k'); this.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',x===s);}); document.getElementById('mixbox').innerHTML=mixHtml((D.mix||{})[MIXK]||[]); });
  document.querySelector('.rng').addEventListener('click', function(e){ var s=e.target.closest('[data-w]'); if(!s) return; load(D.basket, s.getAttribute('data-w')); });
}
function load(basket, win){
  var url = basket ? '/api/mobile/qb_app?basket='+encodeURIComponent(basket)+'&window='+(win||'MAX') : '/api/mobile/qb_app/list';
  fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
    basket ? renderDetail(d) : renderList(d);
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load baskets.</div>'; });
}
var Q=null; try{ Q=new URLSearchParams(location.search).get('basket'); }catch(e){}
load(Q, 'MAX');
</script>
</body></html>
