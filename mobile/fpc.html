<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function tok(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function inrL(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v), a=Math.abs(x); var t=a>=1e7?(a/1e7).toFixed(2)+' Cr':(a>=1e5?(a/1e5).toFixed(a>=1e6?1:2)+' L':Math.round(a).toLocaleString('en-IN')); return (x<0?'−':'')+'₹'+t; }
function words(v){ v=Math.round(v); if(v>=1e7) return (v/1e7).toFixed(2).replace(/\.?0+$/,'')+' crore'; if(v>=1e5) return (v/1e5).toFixed(2).replace(/\.?0+$/,'')+' lakh'; if(v>=1000) return (v/1000).toFixed(1).replace(/\.0$/,'')+' thousand'; return String(v); }
/* ── state ── */
var I={age:35, retire_at:60, dependants:1, take_home:100000, spending:50000, emis:0, cash:500000, investments:1000000, life_cover:0, sip:20000, goal:null, goal_cost:2500000, goal_years:10};
var R={a1:3, a4:3, b1:2, b2:2, b3:2, b4:2, b5:2};
var SCREEN=1, OUT=null, OPEN=false, SKIPPED=false;
/* money sliders: widening steps — ₹1k under 1L, ₹10k under 10L, ₹1L above (concept note §2) */
function stepFor(v){ return v<100000?1000:(v<1000000?10000:100000); }
function snap(v){ var s=stepFor(v); return Math.round(v/s)*s; }
/* a money slider maps 0..1000 onto min..max on a log-ish curve so the low end is usable */
function toPos(v,min,max){ var a=Math.log(min+1), b=Math.log(max+1); return Math.round((Math.log(v+1)-a)/(b-a)*1000); }
function fromPos(p,min,max){ var a=Math.log(min+1), b=Math.log(max+1); return snap(Math.exp(a+(b-a)*p/1000)-1); }
var MONEY=[['take_home','Monthly take-home',25000,1000000],['spending','Monthly spending',10000,800000],['emis','Monthly EMIs',0,500000],['cash','Cash & FD',0,10000000],['investments','Investments — MF, shares, EPF, NPS',0,50000000],['life_cover','Life cover you own',0,50000000],['sip','Monthly SIP today',0,500000]];
function moneyRow(k,label,min,max){ var v=I[k]; return '<div class="sl"><div class="sl-h"><span class="sl-l">'+label+'</span><span class="sl-v" id="v-'+k+'">'+inrL(v)+'</span></div><div class="sl-w" id="w-'+k+'">'+words(v)+'</div><div class="sl-r"><button class="pm" data-k="'+k+'" data-d="-1">−</button><input type="range" min="0" max="1000" value="'+toPos(v,min,max)+'" data-k="'+k+'" data-min="'+min+'" data-max="'+max+'" class="money"><button class="pm" data-k="'+k+'" data-d="1">+</button></div></div>'; }
function plainRow(k,label,min,max,unit){ var v=I[k]; return '<div class="sl"><div class="sl-h"><span class="sl-l">'+label+'</span><span class="sl-v" id="v-'+k+'">'+v+(unit||'')+'</span></div><div class="sl-r"><input type="range" min="'+min+'" max="'+max+'" value="'+v+'" data-k="'+k+'" class="plain" data-unit="'+(unit||'')+'"></div></div>'; }
function tapRow(k,label,opts,cur){ return '<div class="sl"><div class="sl-h"><span class="sl-l">'+label+'</span></div><div class="seg" id="t-'+k+'">'+opts.map(function(o){return '<span data-v="'+o[0]+'"'+(String(o[0])===String(cur)?' class="on"':'')+'>'+o[1]+'</span>';}).join('')+'</div></div>'; }
function s1(){
  var h='<div class="hero"><div class="eye">Will my money last?</div><div class="big"><div class="n" style="font-size:var(--type-125);color:var(--ink)">Slide and tap. No typing. Under two minutes.</div></div></div>';
  h+='<div class="card"><div class="ch"><span class="t">You</span></div>'+plainRow('age','Your age',22,60)+plainRow('retire_at','Retire at',45,70)+tapRow('dependants','People depending on you',[[0,'0'],[1,'1'],[2,'2'],[3,'3+']],I.dependants)+'</div>';
  h+='<div class="card"><div class="ch"><span class="t">Each month</span></div>'+MONEY.slice(0,3).map(function(m){return moneyRow.apply(null,m);}).join('')+'</div>';
  h+='<div class="card"><div class="ch"><span class="t">What you have</span><span class="n" id="wyh-tog" style="color:var(--brand);font-weight:800;cursor:pointer">'+(OPEN?'Done':'Adjust ›')+'</span></div>'
   +'<div id="wyh-sum" class="sub2"'+(OPEN?' style="display:none"':'')+'>Cash '+inrL(I.cash)+' · investments '+inrL(I.investments)+' · SIP '+inrL(I.sip)+' a month · life cover '+(I.life_cover?inrL(I.life_cover):'none')+'. Tap Adjust if these are not you.</div>'
   +'<div id="wyh-box"'+(OPEN?'':' style="display:none"')+'>'+MONEY.slice(3).map(function(m){return moneyRow.apply(null,m);}).join('')+'</div></div>';
  h+='<div class="card"><div class="ch"><span class="t">A goal</span><span class="n">optional</span></div>'+tapRow('goal','Saving for something?',[['','Skip'],['education','Education'],['marriage','Marriage'],['home','Home']],I.goal||'')+'<div id="goalbox"'+(I.goal?'':' style="display:none"')+'>'+moneyRow('goal_cost','Cost today',100000,20000000)+plainRow('goal_years','Years away',1,25,' yrs')+'</div></div>';
  h+='<div class="navrow"><span></span><button class="btn" id="b-next">Next · your risk ›</button></div>';
  h+='<div class="note"><b>What we assume.</b> Inflation 6%, return after retirement 7%, SIP stepping up 10% a year, plan checked to age 85. All of it is shown on the result.</div>';
  document.getElementById('body').innerHTML=h; document.getElementById('asof').innerHTML='Step <b>1 of 3</b> · five sliders, one tap · the rest is optional';
  bindSliders();
  document.getElementById('b-next').addEventListener('click', function(){ SCREEN=2; s2(); });
  document.getElementById('wyh-tog').addEventListener('click', function(){ OPEN=!OPEN; s1(); window.scrollTo(0, document.getElementById('wyh-tog').getBoundingClientRect().top+window.scrollY-120); });
}
function bindSliders(){
  document.querySelectorAll('input.money').forEach(function(r){ r.addEventListener('input', function(){ var k=r.getAttribute('data-k'); I[k]=fromPos(Number(r.value),Number(r.getAttribute('data-min')),Number(r.getAttribute('data-max'))); document.getElementById('v-'+k).textContent=inrL(I[k]); document.getElementById('w-'+k).textContent=words(I[k]); }); });
  document.querySelectorAll('input.plain').forEach(function(r){ r.addEventListener('input', function(){ var k=r.getAttribute('data-k'); I[k]=Number(r.value); document.getElementById('v-'+k).textContent=I[k]+(r.getAttribute('data-unit')||''); }); });
  document.querySelectorAll('.pm').forEach(function(b){ b.addEventListener('click', function(){ var k=b.getAttribute('data-k'), d=Number(b.getAttribute('data-d')); var r=document.querySelector('input.money[data-k="'+k+'"]'); var min=Number(r.getAttribute('data-min')), max=Number(r.getAttribute('data-max')); var st=stepFor(I[k]-(d<0?1:0)); I[k]=Math.min(max,Math.max(min,snap(I[k]+d*st))); r.value=toPos(I[k],min,max); document.getElementById('v-'+k).textContent=inrL(I[k]); document.getElementById('w-'+k).textContent=words(I[k]); }); });
  var seg=function(id,fn){ var el=document.getElementById(id); if(!el) return; el.addEventListener('click', function(e){ var s=e.target.closest('[data-v]'); if(!s) return; fn(s.getAttribute('data-v')); el.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',x===s);}); }); };
  seg('t-dependants', function(v){ I.dependants=Number(v); });
  seg('t-goal', function(v){ I.goal=v||null; document.getElementById('goalbox').style.display=v?'':'none'; });
}
var QA=[['a1','When will you need this money?',['In under 3 years','3 to 7 years','7 to 15 years','After 15 years']],['a4','How steady is your income?',['Changes a lot','Some months vary','Mostly steady','Fixed salary']]];
var QB=[['b1','Where is your money kept today?',['All in FD and savings','Mostly FD, some funds','Mostly funds','Mostly shares']],['b2','How long have you invested in shares or funds?',['Never','Under 2 years','2 to 5 years','More than 5 years']],['b3','The last time the market fell badly, you…',['Was not invested','Sold','Did nothing','Bought more']],['b4','Your ₹1,00,000 becomes ₹85,000 in a month. You…',['Sell everything','Sell some','Wait it out','Invest more']],['b5','Which would you pick?',['7%, never falls','10%, small falls','12%, can fall 15%','16%, can fall 40%']]];
function q(kq){ var k=kq[0]; return '<div class="qq"><div class="qt">'+kq[1]+'</div><div class="qo" id="q-'+k+'">'+kq[2].map(function(o,i){return '<span data-v="'+(i+1)+'"'+(R[k]===i+1?' class="on"':'')+'>'+o+'</span>';}).join('')+'</div></div>'; }
function s2(){
  var burn=I.spending+I.emis, months=burn>0?I.cash/burn:12, emi=I.take_home>0?I.emis/I.take_home:0;
  var auto=[['Months you could manage if income stopped', months<=0?'None':(months<3?'Under 3':(months<=6?'3 to 6':'More than 6'))],['Share of pay going to EMIs', emi>0.5?'More than half':(emi>=0.3?'30 to 50%':(emi>=0.1?'10 to 30%':'Almost nothing'))],['People depending on you', I.dependants>=3?'3 or more':String(I.dependants)]];
  var h='<div class="card"><div class="ch"><span class="t">Your situation</span><span class="n">what you can afford to risk</span></div>'+QA.map(q).join('')+'<div class="auto">'+auto.map(function(a){return '<div class="ar"><span>'+a[0]+'</span><b>'+a[1]+'</b></div>';}).join('')+'<div class="sub2">These three come from your sliders — no need to answer twice.</div></div></div>';
  h+='<div class="card"><div class="ch"><span class="t">Your comfort</span><span class="n">what you are happy to risk</span></div>'+QB.map(q).join('')+'</div>';
  h+='<div class="navrow"><button class="btn2" id="b-back">‹ Back</button><button class="btn" id="b-go">See my plan ›</button></div>';
  h+='<div class="more" style="text-align:center"><a href="#" id="b-skip">Skip the comfort questions — use my situation only ›</a></div>';
  h+='<div class="note"><b>Why two parts.</b> Comfort can never lift you above what your situation can carry. The final profile is the lower of the two.</div>';
  document.getElementById('body').innerHTML=h; document.getElementById('asof').innerHTML='Step <b>2 of 3</b> · seven taps, or skip';
  document.querySelectorAll('.qo').forEach(function(el){ el.addEventListener('click', function(e){ var s=e.target.closest('[data-v]'); if(!s) return; R[el.id.slice(2)]=Number(s.getAttribute('data-v')); el.querySelectorAll('span').forEach(function(x){x.classList.toggle('on',x===s);}); }); });
  document.getElementById('b-back').addEventListener('click', function(){ SCREEN=1; s1(); });
  document.getElementById('b-go').addEventListener('click', function(){ SKIPPED=false; calc(); });
  document.getElementById('b-skip').addEventListener('click', function(e){ e.preventDefault(); SKIPPED=true; R.b1=2; R.b2=2; R.b3=2; R.b4=2; R.b5=2; calc(); });
}
function calc(){
  document.getElementById('body').innerHTML='<div class="err">Working it out…</div>';
  var body={inputs:JSON.parse(JSON.stringify(I)), risk:R}; if(!body.inputs.goal){ body.inputs.goal=null; body.inputs.goal_cost=null; body.inputs.goal_years=null; }
  fetch('/api/mobile/fpc/calc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){ if(d.error){ document.getElementById('body').innerHTML='<div class="err">'+esc(d.error)+'</div>'; return; } OUT=d; SCREEN=3; s3(d); }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not calculate.</div>'; });
}
function s3(d){
  var p=d.profile||{}, f=d.fitness||{}, pl=f.pillars||{}, r=d.retirement||{}, s=d.sip||{}, bk=d.baskets||{};
  var ok=d.lasts_to>=d.plan_to;
  var h='<div class="hero"><div class="eye">Your plan · checked to '+d.plan_to+'</div><div class="big"><div class="r '+(ok?'pos':'neg')+'">'+d.lasts_to+(ok?'+':'')+'</div><div class="n" style="font-size:var(--type-125);color:var(--ink)">'+esc(d.headline)+'</div></div>'
   +'<div class="kg"><div class="cell"><div class="k">Fitness</div><div class="v">'+f.score+'<small>/100</small></div></div><div class="cell"><div class="k">You need</div><div class="v">'+inrL(r.required)+'</div></div><div class="cell"><div class="k">On track for</div><div class="v">'+inrL(r.projected)+'</div></div></div></div>';
  var bar=function(l,v){ return '<div class="r"><span class="l">'+l+'</span><div class="bar"><i style="width:'+v+'%;background:'+(v>=80?tok('--win'):(v>=50?tok('--brand'):tok('--loss')))+'"></i></div><span class="v">'+v+'</span></div>'; };
  h+='<div class="card"><div class="ch"><span class="t">Financial fitness</span><span class="n">four pillars, 25 each</span></div><div class="pil">'+bar('Emergency',pl.emergency)+bar('Debt',pl.debt)+bar('Savings',pl.savings)+bar('Cover',pl.protection)+'</div><div class="sub2">Emergency target '+inrL(f.emergency_target)+' · saving '+f.save_rate_pct+'% of take-home · life cover target '+inrL(f.cover_target)+'.</div></div>';
  h+='<div class="card"><div class="ch"><span class="t">Retirement</span><span class="n">'+r.years_to+' yrs to go · '+r.years_in+' yrs after</span></div><div class="kv"><div><span>Spending then</span><b>'+inrL(r.spend_at_ret_monthly)+' /mo</b></div><div><span>Corpus needed</span><b>'+inrL(r.required)+'</b></div><div><span>What you will have</span><b>'+inrL(r.projected)+'</b></div><div><span>'+(r.gap>0?'Gap':'Surplus')+'</span><b class="'+(r.gap>0?'neg':'pos')+'">'+inrL(Math.abs(r.gap))+'</b></div></div><div class="sub2">From what you hold '+inrL(r.from_assets)+' · from your SIP '+inrL(r.from_sip)+'. Only cash above the emergency buffer ('+inrL(r.cash_counted)+') is counted.</div></div>';
  h+='<div class="card '+(s.affordable?'ok':'warn')+'"><div class="ch"><span class="t">What it takes</span><span class="n">with the same 10% step-up</span></div>'
   +'<div class="line"><span>Invest more each month</span><b>'+(s.extra>0?inrL(s.extra):'nothing')+'</b></div><div class="line"><span>Spare after spending, EMIs, your SIP'+(s.goal_sip?', goal':'')+'</span><b>'+inrL(s.spare)+'</b></div>'
   +'<div class="verdict '+(s.affordable?'pos':'neg')+'">'+(s.extra<=0?'You are already there.':(s.affordable?'You can do this.':'Short by '+inrL(s.short_by)+' a month.'))+'</div>'
   +((s.alternatives||[]).length?'<div class="sub2" style="margin-top:8px">Two ways that fit:</div>'+s.alternatives.map(function(a){return '<div class="alt">'+esc(a.text)+'</div>';}).join(''):'')+'</div>';
  if(d.goal){ h+='<div class="card"><div class="ch"><span class="t">Your goal · '+esc(d.goal.name)+'</span><span class="n">'+d.goal.years+' yrs</span></div><div class="kv"><div><span>Costs today</span><b>'+inrL(d.goal.cost_today)+'</b></div><div><span>Will cost then</span><b>'+inrL(d.goal.cost_then)+'</b></div><div><span>Monthly SIP for it</span><b>'+inrL(d.goal.sip)+'</b></div></div></div>'; }
  if(SKIPPED) h+='<div class="sub2" style="padding:0 16px">Comfort questions skipped — comfort assumed Medium, so the profile is your situation or Balanced, whichever is lower.</div>';
  h+='<div class="card"><div class="ch"><span class="t">Your profile</span><span class="n">'+esc(p.name)+' · '+Math.round(p.return_pre*100)+'% assumed</span></div><div class="kv"><div><span>Situation</span><b>'+p.part_a+' / 20 · '+esc(p.band_a)+'</b></div><div><span>Comfort</span><b>'+p.part_b+' / 20 · '+esc(p.band_b)+'</b></div></div><div class="sub2">'+esc(p.why)+'</div></div>';
  h+='<div class="sec"><h2>Where to put it</h2><span class="hint">'+esc(bk.profile)+' baskets</span></div>';
  h+= (bk.rows||[]).length ? '<div class="lst">'+bk.rows.map(function(b){return '<a class="row '+(b.live?'up':'mu')+'" href="/m/qb?basket='+encodeURIComponent(b.basket)+'"><div><div class="nm">'+esc(b.label)+'</div><div class="sub">'+(b.holdings!=null?b.holdings+' holdings':'')+(b.rebalance?' · '+esc(b.rebalance):'')+(b.live?'':' · not live')+'</div></div><div class="v"><div class="n gd">›</div></div></a>';}).join('')+'</div><div class="more">'+esc(bk.note||'')+'</div>' : '<div class="emp">No basket is mapped to this profile yet.</div>';
  h+='<div class="card"><div class="ch"><span class="t">What we assumed</span></div><ul class="hl">'+(d.assumptions||[]).map(function(a){return '<li>'+esc(a)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="navrow"><button class="btn2" id="b-edit">‹ Change inputs</button><button class="btn2" id="b-risk">Change risk answers</button></div>';
  h+='<div class="note"><b>Research, not advice.</b> A plan built on sliders and stated assumptions. Finkhoz Roboadvisory · SEBI RA INH000022297.</div>';
  document.getElementById('body').innerHTML=h; document.getElementById('asof').innerHTML='Step <b>3 of 3</b> · your plan';
  document.getElementById('b-edit').addEventListener('click', function(){ SCREEN=1; s1(); }); document.getElementById('b-risk').addEventListener('click', function(){ SCREEN=2; s2(); });
  window.scrollTo(0,0);
}
s1();
</script>
</body></html>
