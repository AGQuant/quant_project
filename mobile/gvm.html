<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVM · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
</head>
<body>
<div class="screen">
  <div class="head">
    <h1>GVM</h1>
    <div class="s" id="sub">Growth · Value · Momentum · scored nightly 22:00</div>
  </div>
  <div class="search">
    <span class="ic">&#9906;</span>
    <input id="q" type="search" placeholder="Search any stock — RELIANCE, TCS, LODHA…" autocomplete="off">
  </div>
  <div class="body" id="body"><div class="loading">Loading scores…</div></div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn on" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
var STATE = { results: [], sel: 0, frOpen: false, fr: null, frSym: null,
              sectors: null, secOpen: false, secAll: false };

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function n1(v){ return (v == null || isNaN(Number(v))) ? '--' : Number(v).toFixed(1); }
/* cc#913 — fmt() USED TO PRINT "[object Object]". String({hi,lo}) is "[object Object]", which is
   15 characters, so it passed the <=28 length test and was rendered as a value. Every nested
   object in the payload printed that literal string on the founder's screen: extras.pivot,
   extras.range52, extras.percentile, extras.earnings, extras.volume, extras.delivery,
   extras.segment_ctx, extras.tier1 — the whole MARKET CONTEXT section. Objects are now REFUSED
   here and unpacked by deepRows() instead, which is where they belong. */
function fmt(v){
  if (v == null) return '--';
  if (typeof v === 'number') return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : (Math.round(v*100)/100).toString();
  if (typeof v === 'object') return null;
  var s = String(v); return s.length <= 28 ? s : null;
}
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return '₹' + (x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN'));
}
function scoreCol(g){
  if (g == null) return 'var(--dim)';
  return g >= 7.5 ? 'var(--grn)' : (g >= 5 ? 'var(--amber)' : 'var(--red)');
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(r.state) + '</span>';
}
function pillarRow(k, v){
  var w = (v == null) ? 0 : Math.max(0, Math.min(100, Number(v) * 10));
  return '<div class="pr"><span class="pk">' + k + '</span>'
    + '<div class="bar"><div class="fill" style="width:' + w + '%"></div></div>'
    + '<span class="pv">' + n1(v) + '</span></div>';
}

/* ── section renderers ─────────────────────────────────────────────────────── */
function kvRows(obj){
  var out = '';
  Object.keys(obj).forEach(function(k){
    var s = fmt(obj[k]);
    if (s == null || obj[k] == null) return;
    out += '<div class="frr"><span class="k2">' + esc(k.replace(/_/g,' ')) + '</span>'
         + '<span class="v2">' + esc(s) + '</span></div>';
  });
  return out;
}
/* cc#913 — the payload is two levels deep and only the first was ever shown. extras alone holds
   pivot, range52, percentile, earnings, volume, delivery, segment_ctx and tier1, each an object
   of real numbers, and all of them were collapsing to "[object Object]". deepRows walks ONE
   level in: scalars render as rows, a nested object renders under its own sub-heading, a list of
   objects renders as a table, a list of scalars is joined. Depth stops at one — deeper than that
   is a data browser, not a company view. */
function deepRows(obj){
  var flat = '', nested = '';
  Object.keys(obj).forEach(function(k){
    var v = obj[k];
    if (v == null) return;
    var label = esc(k.replace(/_/g,' '));
    if (Array.isArray(v)){
      if (!v.length) return;
      if (typeof v[0] === 'object' && v[0] !== null){
        var t = arrTable(v);
        if (t) nested += '<div class="frs">' + label + '</div>' + t;
      } else {
        flat += '<div class="frr"><span class="k2">' + label + '</span>'
              + '<span class="v2">' + esc(v.slice(0, 8).join(', ')) + '</span></div>';
      }
      return;
    }
    if (typeof v === 'object'){
      var inner = kvRows(v);
      if (inner) nested += '<div class="frs">' + label + '</div>' + inner;
      return;
    }
    var sc = fmt(v);
    if (sc != null) flat += '<div class="frr"><span class="k2">' + label + '</span>'
                          + '<span class="v2">' + esc(sc) + '</span></div>';
  });
  return flat + nested;   // scalars first, then the sub-blocks
}
function arrTable(list){
  if (!list.length || typeof list[0] !== 'object') return '';
  var keys = Object.keys(list[0]).filter(function(k){
    return list.some(function(r){ return r[k] != null && typeof r[k] !== 'object'; });
  }).slice(0, 5);
  if (!keys.length) return '';
  var h = '<table class="tbl"><tr>' + keys.map(function(k){
    return '<th>' + esc(k.replace(/_/g,' ')) + '</th>'; }).join('') + '</tr>';
  list.slice(0, 12).forEach(function(r){
    h += '<tr>' + keys.map(function(k){
      var s = fmt(r[k]); return '<td>' + (s == null ? '--' : esc(s)) + '</td>'; }).join('') + '</tr>';
  });
  return h + '</table>' + (list.length > 12 ? '<div class="frr"><span class="k2">and ' + (list.length - 12) + ' more rows</span></div>' : '');
}
function sparkline(pts){
  var vals = pts.map(function(p){
    return typeof p === 'number' ? p : (p.gvm_score != null ? p.gvm_score : (p.score != null ? p.score : p.gvm));
  }).filter(function(v){ return v != null && !isNaN(Number(v)); }).map(Number);
  if (vals.length < 2) return '';
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var rng = (max - min) || 1;
  var W = 300, H = 40;
  var d = vals.map(function(v, i){
    return (i * (W / (vals.length - 1))).toFixed(1) + ',' + (H - 4 - ((v - min) / rng) * (H - 8)).toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + '<polyline points="' + d + '" fill="none" stroke="var(--blu)" stroke-width="2"/></svg>'
    + '<div class="frr"><span class="k2">range</span><span class="v2">' + n1(min) + ' \u2192 ' + n1(max) + '</span></div>';
}
function section(title, inner){
  return inner ? '<div class="frh">' + esc(title) + '</div>' + inner : '';
}
/* cc#895 — the section order and titles, CHECKED AGAINST THE REAL /api/gvm/company PAYLOAD.
   The previous KNOWN list was guessed from the web page's visual sections: of its twenty names
   only 'financials' actually exists in the response, so the ordering did nothing and every
   section fell through to the generic pass with a machine title (PILLAR COVERAGE, OPERATIONAL
   METRICS). These are the real keys, in the web's order, with the web's human titles. */
var KNOWN = ['scores','benchmark','pillar_coverage','positives','negatives','ladder',
  'content','financials','extras'];
var TITLES = {
  scores:          'GVM SCORES',
  benchmark:       'PEER BENCHMARKING',
  pillar_coverage: 'PILLAR COVERAGE',
  positives:       "WHAT'S WORKING",
  negatives:       "WHAT'S NOT",
  ladder:          'SEGMENT LADDER',
  content:         'ANALYSIS',
  financials:      'FINANCIALS',
  extras:          'MARKET CONTEXT'
};
/* NEVER rendered. operational_metrics is INTERNAL ONLY (OPS_METRICS_INTERNAL_ONLY, session_log
   13348) and the generic "render every object key" pass was leaking it onto a retail screen.
   The rest are plumbing flags that mean nothing to a founder reading a company view. */
var HIDE = { operational_metrics: 1, persisted: 1, persist_error: 1, degraded: 1,
             in_scrape_universe: 1, price_is_live: 1, is_bfsi: 1, generated_at: 1,
             symbol: 1, score_date: 1 };
function frBlock(){
  var f = STATE.fr;
  if (f === 'loading') return '<div class="fr"><div class="loading" style="padding:4px">Loading company view…</div></div>';
  if (!f) return '';
  var d = f.company || {};
  if (d.error) return '<div class="fr"><div class="empty" style="padding:8px"><b>Report unavailable</b>' + esc(d.error) + '</div></div>';
  var out = '';
  /* 1 · overview scalars */
  var over = {};
  Object.keys(d).forEach(function(k){
    if (d[k] != null && typeof d[k] !== 'object' && !HIDE[k]) over[k] = d[k];
  });
  out += section('SNAPSHOT', kvRows(over));
  /* 2 · score trend */
  if (f.trend && f.trend.length) out += section('GVM TREND', sparkline(f.trend));
  /* 3 · payload sections, known order first, everything else after — nothing dropped */
  var done = {};
  function renderKey(k){
    var v = d[k];
    if (v == null || typeof v !== 'object' || done[k] || HIDE[k]) return '';
    done[k] = 1;
    var inner = Array.isArray(v) ? arrTable(v) : deepRows(v);
    return section(TITLES[k] || k.replace(/_/g,' ').toUpperCase(), inner);
  }
  KNOWN.forEach(function(k){ out += renderKey(k); });
  Object.keys(d).forEach(function(k){ out += renderKey(k); });
  /* 4 · fib / pivot levels */
  if (f.fib && !f.fib.error){
    var inner = Array.isArray(f.fib) ? arrTable(f.fib)
      : (typeof f.fib === 'object' ? kvRows(f.fib) : '');
    out += section('FIB & PIVOT LEVELS', inner);
  }
  /* 5 · company news */
  if (f.news && f.news.length){
    out += section('COMPANY NEWS', f.news.slice(0, 4).map(function(n){
      var hl = n.headline || n.title || '';
      var w = n.when || n.display_time || n.published_time || '';
      return hl ? '<div class="nrow">' + esc(hl) + '<div class="w">' + esc(String(w)) + '</div></div>' : '';
    }).join(''));
  }
  /* 6 · sector brief */
  if (f.brief){
    /* Field by field with the web's own labels. esc() on the object would have printed
       "[object Object]" — the fields are what carry the meaning. */
    var BF = [['what_is_it','What it is'], ['business_model','Business model'],
              ['growth_drivers','Growth drivers'], ['application_type','Applications'],
              ['key_risks','Key risks']];
    var bh = BF.map(function(x){
      var v = f.brief[x[0]];
      return v ? '<div class="frh">' + esc(x[1]) + '</div><div class="prose">'
               + esc(String(v).slice(0, 900)) + '</div>' : '';
    }).join('');
    out += section('SECTOR BRIEF', bh);
  }
  return '<div class="fr">' + (out || '<div class="empty" style="padding:8px"><b>Nothing to show</b></div>') + '</div>';
}
function repCard(x){
  var col = scoreCol(x.gvm);
  return '<div class="rep" style="--rc:' + col + '">'
    + '<div class="r1"><span class="rsym">' + esc(x.symbol) + '</span>'
    + '<span class="rseg">' + esc(x.segment || '') + '</span>'
    + '<span class="rpx">' + px(x.price) + '</span></div>'
    + '<div class="big"><span class="gvmv">' + n1(x.gvm) + '<span class="of">/10</span></span>'
    + (x.verdict ? '<span class="verd">' + esc(String(x.verdict).toUpperCase()) + '</span>' : '')
    + '</div>'
    + '<div class="pil">'
    + pillarRow('GROWTH', x.g) + pillarRow('VALUE', x.v) + pillarRow('MOMENTUM', x.m)
    + '</div>'
    + (x.punchline
        ? '<div class="punch"><b>What the score says:</b> ' + esc(x.punchline) + '</div>' : '')
    + '<div class="acts">'
    + '<button class="a" onclick="toggleFR(\'' + esc(x.symbol) + '\')">'
    + (STATE.frOpen ? 'Hide company view \u25b4' : 'Company view \u25be') + '</button>'
    + '<a class="a" href="/m/check">Run Trade Check</a></div>'
    + '<div class="src">Rank ' + (x.rank == null ? '--' : esc(x.rank))
    + (x.as_of ? ' · scored ' + esc(x.as_of) : '') + '</div>'
    + '</div>'
    + (STATE.frOpen ? frBlock() : '');
}
function toggleFR(sym){
  if (STATE.frOpen && STATE.frSym === sym){ STATE.frOpen = false; render(); return; }
  STATE.frOpen = true; STATE.frSym = sym; STATE.fr = 'loading'; render();
  var seg = (STATE.results[STATE.sel] || {}).segment || '';
  Promise.all([
    fetchWithTimeout('/api/gvm/company/' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(e){ return {error: e.message}; }),
    fetchWithTimeout('/api/gvm/trend/' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(){ return null; }),
    fetchWithTimeout('/api/news/company/' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(){ return null; }),
    fetchWithTimeout('/api/trade-check/fibcheck?symbol=' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(){ return null; }),
    seg ? fetchWithTimeout('/api/sector/brief?segment=' + encodeURIComponent(seg)).then(function(r){ return r.json(); }).catch(function(){ return null; }) : Promise.resolve(null)
  ]).then(function(res){
    /* cc#895: /api/gvm/trend returns {symbol, range, gvm:[{d,gvm,g,v,m}], price:[...]}. The
       guessed keys trend/history/series exist nowhere, so this was ALWAYS null and the sparkline
       never drew once. sparkline() already reads p.gvm, so the array key was the whole bug. */
    var trend = res[1]; trend = trend && (trend.gvm || (Array.isArray(trend) ? trend : null));
    var news = res[2]; news = news && (news.articles || news.items || news.results || (Array.isArray(news) ? news : null));
    /* cc#895: /api/sector/brief returns an OBJECT — {segment, what_is_it, growth_drivers,
       application_type, business_model, key_risks, generated_at, cached, constituents}. The
       guessed keys brief/text/summary exist nowhere, so the chain yielded null and the SECTOR
       BRIEF section silently never appeared. Kept whole and rendered field by field below. */
    var brief = res[4] && !res[4].error ? res[4] : null;
    STATE.fr = { company: res[0] || {}, trend: trend || [], news: news || [], fib: res[3], brief: brief };
    render();
  });
}
/* ══ cc#913: SECTOR RATINGS ═════════════════════════════════════════════════════════════════
   The one old-app GVM surface with NO counterpart on the rebuilt screen. sector_ratings holds
   130 rows scored the same night as the stocks (verified: 130 segments, mcap-weighted GVM 4.80
   to 7.29), and /api/sectors with no segment argument is the web's own read of it — reused
   exactly, so the app and the web cannot disagree about a sector score (DISPLAY_PARITY 16202).
   Ranked by MCAP-WEIGHTED GVM, which is the column the web orders by; the simple average is
   shown beside it because the two differ and a reader should see both rather than be handed one
   and told it is "the" sector score. Top stock per sector is the row's own top_stock. */
function secRow(x, i){
  var mw = x.mcap_weighted_gvm, av = x.avg_gvm;
  return '<div class="g-lrow">'
    + '<span class="rk">' + (i + 1) + '</span>'
    + '<div><div class="rs">' + esc(x.segment || '--') + '</div>'
    + '<div class="rg">' + (x.stock_count == null ? '' : esc(x.stock_count) + ' stocks')
    + (x.top_stock ? ' · top <b class="rsym">' + esc(x.top_stock) + '</b>' : '')
    + (x.verdict ? ' · ' + esc(x.verdict) : '') + '</div></div>'
    + '<span class="sc" style="color:' + scoreCol(mw) + '">' + n1(mw) + '</span>'
    + '<span class="rg" style="min-width:34px;text-align:right">' + n1(av) + '</span>'
    + '</div>';
}
function secBlock(){
  if (STATE.sectors === 'loading') return '<div class="loading" style="padding:6px 2px">Loading sector ratings…</div>';
  var rows = STATE.sectors;
  if (!rows) return '';
  if (rows.error || !rows.length)
    return '<div class="sum" style="padding:6px 2px">Sector ratings unavailable.</div>';
  var shown = STATE.secAll ? rows : rows.slice(0, 12);
  return '<div class="frr"><span class="k2">sector</span>'
    + '<span class="v2">mcap-wtd · simple</span></div>'
    + shown.map(secRow).join('')
    + (rows.length > shown.length
        ? '<button class="chip" onclick="secMore()">Show all ' + rows.length + ' sectors</button>'
        : '');
}
function secMore(){ STATE.secAll = true; render(); }
function toggleSec(){
  STATE.secOpen = !STATE.secOpen;
  if (STATE.secOpen && STATE.sectors == null){
    STATE.sectors = 'loading'; render();
    fetchWithTimeout('/api/sectors')
      .then(function(r){ return r.json(); })
      .then(function(d){ STATE.sectors = Array.isArray(d) ? d : (d && d.error ? d : []); render(); })
      .catch(function(e){ STATE.sectors = {error: e.message}; render(); });
    return;
  }
  render();
}

function render(){
  var rs = STATE.results;
  if (!rs.length){
    document.getElementById('body').innerHTML =
      '<div class="empty"><b>Nothing found</b>No company matches your search.</div>';
    return;
  }
  var sel = Math.max(0, Math.min(STATE.sel, rs.length - 1));
  var h = '<div class="sect">THE REPORT · TAP ANY STOCK TO GET THIS</div>' + repCard(rs[sel]);
  h += '<div class="sect">' + (STATE.q ? 'MATCHES' : "TODAY'S TOP · BY GVM") + '</div>';
  h += rs.map(function(x, i){
    return '<div class="g-lrow" onclick="pick(' + i + ')">'
      + '<span class="rk">' + (x.rank == null ? '' : esc(x.rank)) + '</span>'
      + '<div><div class="rs">' + esc(x.symbol) + '</div>'
      + '<div class="rg">' + esc(x.segment || esc(x.name || '')) + '</div></div>'
      + '<span class="sc" style="color:' + scoreCol(x.gvm) + '">' + n1(x.gvm) + '</span>'
      + '<span class="g-chev">&#8250;</span></div>';
  }).join('');
  /* cc#913: sector ratings, the old-app surface the rebuilt screen never carried. Folded rather
     than always-open so the stock leaderboard stays the first thing read. */
  h += '<div class="sect">SECTORS \u00b7 GVM BY SEGMENT</div>'
    + '<div class="c"><div class="chd"><div class="t">Sector ratings</div>'
    + '<div class="rgt"><button class="chip" onclick="toggleSec()">'
    + (STATE.secOpen ? 'Hide \u25b4' : 'Show \u25be') + '</button></div></div>'
    + (STATE.secOpen ? secBlock()
        : '<div class="sum">130 segments scored nightly, ranked by mcap-weighted GVM.</div>')
    + '</div>';
  document.getElementById('body').innerHTML = h;
}
function pick(i){ STATE.sel = i; STATE.frOpen = false; STATE.fr = null; render();
  window.scrollTo({top: 0, behavior: 'smooth'}); }

function load(q){
  document.getElementById('body').innerHTML = '<div class="loading">Loading scores…</div>';
  fetchWithTimeout('/api/mobile/gvm?limit=25' + (q ? '&q=' + encodeURIComponent(q) : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      STATE.results = d.results || []; STATE.sel = 0; STATE.q = d.query;
      STATE.frOpen = false; STATE.fr = null;
      document.getElementById('sub').innerHTML =
        'Growth · Value · Momentum · scored nightly 22:00 ' + railHtml(d.rail);
      render();
    })
    .catch(function(e){
      document.getElementById('body').innerHTML =
        '<div class="empty"><b>Could not load GVM</b>' + esc(e.message)
        + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
      document.getElementById('sub').textContent = 'failed to load';
    });
}
var t = null;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(t);
  var v = e.target.value.trim();
  t = setTimeout(function(){ load(v); }, 300);
});
load('');
</script>
</body>
</html>
