<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVM · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
<style>
/*
  GVM — the app's company research view (founder 08-Aug: "old app screens fine, format,
  organise and push"). The Full report now IS the web /cio2 company page, mobile-formatted:
  same endpoints (api/gvm/company, api/gvm/trend, api/news/company, api/trade-check/fibcheck,
  api/sector/brief), organized into the web's own sections. Ops-metrics deliberately absent —
  OPS_METRICS_INTERNAL_ONLY (13348). Arrays render as mini-tables (peers, financials,
  shareholding); the trend renders as a sparkline. Fable direct push, 17783.
*/
.search{display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;min-height:48px;padding:0 6px 0 14px;margin:12px 12px 0}
.search .ic{color:var(--dim);font-size:15px}
.search input{flex:1;min-height:46px;background:none;border:0;outline:none;color:var(--txt);
  font-family:inherit;font-size:16px}
.search input::placeholder{color:var(--dim);font-size:13px}
.rep{position:relative;background:var(--panel2);border:1px solid var(--line2);
  border-radius:15px;padding:15px 15px 15px 19px;overflow:hidden;margin-bottom:10px}
.rep::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc,var(--grn))}
.r1{display:flex;align-items:baseline;gap:9px}
.rsym{font-size:17px;font-weight:800;letter-spacing:-.01em}
.rseg{font-size:10px;color:var(--dim)}
.rpx{margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:13px;font-weight:700;color:var(--mut)}
.big{display:flex;align-items:baseline;gap:10px;margin-top:11px}
.gvmv{font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--rc,var(--grn));
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.gvmv .of{font-size:13px;color:var(--dim);font-weight:700}
.verd{font-size:12px;font-weight:800;color:var(--rc,var(--grn));border:1px solid var(--rc,var(--grn));
  border-radius:6px;padding:4px 10px}
.pil{margin-top:13px}
.pr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.pk{font-size:11px;font-weight:800;min-width:78px}
.bar{flex:1;height:7px;border-radius:4px;background:rgba(148,166,210,.14);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--rc,var(--grn))}
.pv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:800;
  min-width:32px;text-align:right}
.punch{font-size:12.5px;color:var(--mut);line-height:1.6;margin-top:11px;
  border-top:1px solid var(--line);padding-top:11px}
.punch b{color:var(--txt)}
.acts{display:flex;gap:8px;margin-top:12px}
.a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:var(--blu);border:1px solid rgba(77,124,254,.4);
  border-radius:10px;text-decoration:none;background:none;font-family:inherit;cursor:pointer}
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;min-height:48px;cursor:pointer}
.rk{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:700;
  color:var(--dim);min-width:22px}
.rs{font-size:13.5px;font-weight:800}
.rg{font-size:9.5px;color:var(--dim);margin-top:1px}
.sc{margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:14px;font-weight:800}
.chev{color:var(--dim);font-size:14px}
.fr{margin:-2px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.frh{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:800;
  letter-spacing:.13em;color:var(--dim);margin:12px 0 7px}
.fr .frh:first-child{margin-top:0}
.frr{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid var(--line);min-height:32px}
.frr:first-of-type{border-top:0}
.frr .k2{font-size:11.5px;color:var(--mut);flex:1;text-transform:capitalize}
.frr .v2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:700;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.tbl th{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:8.5px;font-weight:800;
  letter-spacing:.06em;color:var(--dim);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line2);text-transform:uppercase}
.tbl th:first-child{text-align:left}
.tbl td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;color:var(--txt)}
.tbl td:first-child{text-align:left;font-family:'Sora';font-weight:700;color:var(--txt)}
.spark{width:100%;height:44px;display:block}
.prose{font-size:12.5px;color:var(--mut);line-height:1.6}
.prose b{color:var(--txt)}
.nrow{padding:7px 0;border-top:1px solid var(--line);font-size:12px;font-weight:600;line-height:1.4}
.nrow:first-of-type{border-top:0}
.nrow .w{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;color:var(--dim);margin-top:2px}
</style>
</head>
<body>
<div class="screen">
  <div class="head">
    <h1>GVM</h1>
    <div class="s" id="sub">Growth · Value · Momentum · scored nightly 22:00</div>
  </div>
  <div class="search">
    <span class="ic">&#9906;</span>
    <input id="q" type="search" placeholder="Search any stock — RELIANCE, TCS, LODHA…" autocomplete="off">
  </div>
  <div class="body" id="body"><div class="loading">Loading scores…</div></div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn on" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
var STATE = { results: [], sel: 0, frOpen: false, fr: null, frSym: null };

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function n1(v){ return (v == null || isNaN(Number(v))) ? '--' : Number(v).toFixed(1); }
function fmt(v){
  if (v == null) return '--';
  if (typeof v === 'number') return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : (Math.round(v*100)/100).toString();
  var s = String(v); return s.length <= 28 ? s : null;
}
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return 'Rs.' + (x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN'));
}
function scoreCol(g){
  if (g == null) return 'var(--dim)';
  return g >= 7.5 ? 'var(--grn)' : (g >= 5 ? 'var(--amber)' : 'var(--red)');
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(r.state) + '</span>';
}
function pillarRow(k, v){
  var w = (v == null) ? 0 : Math.max(0, Math.min(100, Number(v) * 10));
  return '<div class="pr"><span class="pk">' + k + '</span>'
    + '<div class="bar"><div class="fill" style="width:' + w + '%"></div></div>'
    + '<span class="pv">' + n1(v) + '</span></div>';
}

/* ── section renderers ─────────────────────────────────────────────────────── */
function kvRows(obj){
  var out = '';
  Object.keys(obj).forEach(function(k){
    var s = fmt(obj[k]);
    if (s == null || obj[k] == null) return;
    out += '<div class="frr"><span class="k2">' + esc(k.replace(/_/g,' ')) + '</span>'
         + '<span class="v2">' + esc(s) + '</span></div>';
  });
  return out;
}
function arrTable(list){
  if (!list.length || typeof list[0] !== 'object') return '';
  var keys = Object.keys(list[0]).filter(function(k){
    return list.some(function(r){ return r[k] != null && typeof r[k] !== 'object'; });
  }).slice(0, 5);
  if (!keys.length) return '';
  var h = '<table class="tbl"><tr>' + keys.map(function(k){
    return '<th>' + esc(k.replace(/_/g,' ')) + '</th>'; }).join('') + '</tr>';
  list.slice(0, 12).forEach(function(r){
    h += '<tr>' + keys.map(function(k){
      var s = fmt(r[k]); return '<td>' + (s == null ? '--' : esc(s)) + '</td>'; }).join('') + '</tr>';
  });
  return h + '</table>' + (list.length > 12 ? '<div class="frr"><span class="k2">and ' + (list.length - 12) + ' more rows</span></div>' : '');
}
function sparkline(pts){
  var vals = pts.map(function(p){
    return typeof p === 'number' ? p : (p.gvm_score != null ? p.gvm_score : (p.score != null ? p.score : p.gvm));
  }).filter(function(v){ return v != null && !isNaN(Number(v)); }).map(Number);
  if (vals.length < 2) return '';
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var rng = (max - min) || 1;
  var W = 300, H = 40;
  var d = vals.map(function(v, i){
    return (i * (W / (vals.length - 1))).toFixed(1) + ',' + (H - 4 - ((v - min) / rng) * (H - 8)).toFixed(1);
  }).join(' ');
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + '<polyline points="' + d + '" fill="none" stroke="var(--blu)" stroke-width="2"/></svg>'
    + '<div class="frr"><span class="k2">range</span><span class="v2">' + n1(min) + ' \u2192 ' + n1(max) + '</span></div>';
}
function section(title, inner){
  return inner ? '<div class="frh">' + esc(title) + '</div>' + inner : '';
}
/* the web page's own section order; anything in the payload not named here still renders after */
var KNOWN = ['snapshot','overview','segment','segment_context','segment_ladder','peers',
  'peer_benchmarking','growth','value','momentum','financials','quarterly','shareholding',
  'guidance','growth_drivers','key_risks','business_model','levels','pivot','fib'];
function frBlock(){
  var f = STATE.fr;
  if (f === 'loading') return '<div class="fr"><div class="loading" style="padding:4px">Loading company view…</div></div>';
  if (!f) return '';
  var d = f.company || {};
  if (d.error) return '<div class="fr"><div class="empty" style="padding:8px"><b>Report unavailable</b>' + esc(d.error) + '</div></div>';
  var out = '';
  /* 1 · overview scalars */
  var over = {};
  Object.keys(d).forEach(function(k){
    if (d[k] != null && typeof d[k] !== 'object' && k !== 'symbol') over[k] = d[k];
  });
  out += section('SNAPSHOT', kvRows(over));
  /* 2 · score trend */
  if (f.trend && f.trend.length) out += section('GVM TREND', sparkline(f.trend));
  /* 3 · payload sections, known order first, everything else after — nothing dropped */
  var done = {};
  function renderKey(k){
    var v = d[k];
    if (v == null || typeof v !== 'object' || done[k]) return '';
    done[k] = 1;
    var inner = Array.isArray(v) ? arrTable(v) : kvRows(v);
    return section(k.replace(/_/g,' ').toUpperCase(), inner);
  }
  KNOWN.forEach(function(k){ out += renderKey(k); });
  Object.keys(d).forEach(function(k){ out += renderKey(k); });
  /* 4 · fib / pivot levels */
  if (f.fib && !f.fib.error){
    var inner = Array.isArray(f.fib) ? arrTable(f.fib)
      : (typeof f.fib === 'object' ? kvRows(f.fib) : '');
    out += section('FIB & PIVOT LEVELS', inner);
  }
  /* 5 · company news */
  if (f.news && f.news.length){
    out += section('COMPANY NEWS', f.news.slice(0, 4).map(function(n){
      var hl = n.headline || n.title || '';
      var w = n.when || n.display_time || n.published_time || '';
      return hl ? '<div class="nrow">' + esc(hl) + '<div class="w">' + esc(String(w)) + '</div></div>' : '';
    }).join(''));
  }
  /* 6 · sector brief */
  if (f.brief) out += section('SECTOR BRIEF', '<div class="prose">' + esc(f.brief).slice(0, 1200) + '</div>');
  return '<div class="fr">' + (out || '<div class="empty" style="padding:8px"><b>Nothing to show</b></div>') + '</div>';
}
function repCard(x){
  var col = scoreCol(x.gvm);
  return '<div class="rep" style="--rc:' + col + '">'
    + '<div class="r1"><span class="rsym">' + esc(x.symbol) + '</span>'
    + '<span class="rseg">' + esc(x.segment || '') + '</span>'
    + '<span class="rpx">' + px(x.price) + '</span></div>'
    + '<div class="big"><span class="gvmv">' + n1(x.gvm) + '<span class="of">/10</span></span>'
    + (x.verdict ? '<span class="verd">' + esc(String(x.verdict).toUpperCase()) + '</span>' : '')
    + '</div>'
    + '<div class="pil">'
    + pillarRow('GROWTH', x.g) + pillarRow('VALUE', x.v) + pillarRow('MOMENTUM', x.m)
    + '</div>'
    + (x.punchline
        ? '<div class="punch"><b>What the score says:</b> ' + esc(x.punchline) + '</div>' : '')
    + '<div class="acts">'
    + '<button class="a" onclick="toggleFR(\'' + esc(x.symbol) + '\')">'
    + (STATE.frOpen ? 'Hide company view \u25b4' : 'Company view \u25be') + '</button>'
    + '<a class="a" href="/m/check">Run Trade Check</a></div>'
    + '<div class="src">Rank ' + (x.rank == null ? '--' : esc(x.rank))
    + (x.as_of ? ' · scored ' + esc(x.as_of) : '') + '</div>'
    + '</div>'
    + (STATE.frOpen ? frBlock() : '');
}
function toggleFR(sym){
  if (STATE.frOpen && STATE.frSym === sym){ STATE.frOpen = false; render(); return; }
  STATE.frOpen = true; STATE.frSym = sym; STATE.fr = 'loading'; render();
  var seg = (STATE.results[STATE.sel] || {}).segment || '';
  Promise.all([
    fetchWithTimeout('/api/gvm/company/' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(e){ return {error: e.message}; }),
    fetchWithTimeout('/api/gvm/trend/' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(){ return null; }),
    fetchWithTimeout('/api/news/company/' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(){ return null; }),
    fetchWithTimeout('/api/trade-check/fibcheck?symbol=' + encodeURIComponent(sym)).then(function(r){ return r.json(); }).catch(function(){ return null; }),
    seg ? fetchWithTimeout('/api/sector/brief?segment=' + encodeURIComponent(seg)).then(function(r){ return r.json(); }).catch(function(){ return null; }) : Promise.resolve(null)
  ]).then(function(res){
    var trend = res[1]; trend = trend && (trend.trend || trend.history || trend.series || (Array.isArray(trend) ? trend : null));
    var news = res[2]; news = news && (news.articles || news.items || news.results || (Array.isArray(news) ? news : null));
    var brief = res[4]; brief = brief && (brief.brief || brief.text || brief.summary || null);
    STATE.fr = { company: res[0] || {}, trend: trend || [], news: news || [], fib: res[3], brief: brief };
    render();
  });
}
function render(){
  var rs = STATE.results;
  if (!rs.length){
    document.getElementById('body').innerHTML =
      '<div class="empty"><b>Nothing found</b>No company matches your search.</div>';
    return;
  }
  var sel = Math.max(0, Math.min(STATE.sel, rs.length - 1));
  var h = '<div class="sect">THE REPORT · TAP ANY STOCK TO GET THIS</div>' + repCard(rs[sel]);
  h += '<div class="sect">' + (STATE.q ? 'MATCHES' : "TODAY'S TOP · BY GVM") + '</div>';
  h += rs.map(function(x, i){
    return '<div class="lrow" onclick="pick(' + i + ')">'
      + '<span class="rk">' + (x.rank == null ? '' : esc(x.rank)) + '</span>'
      + '<div><div class="rs">' + esc(x.symbol) + '</div>'
      + '<div class="rg">' + esc(x.segment || esc(x.name || '')) + '</div></div>'
      + '<span class="sc" style="color:' + scoreCol(x.gvm) + '">' + n1(x.gvm) + '</span>'
      + '<span class="chev">&#8250;</span></div>';
  }).join('');
  document.getElementById('body').innerHTML = h;
}
function pick(i){ STATE.sel = i; STATE.frOpen = false; STATE.fr = null; render();
  window.scrollTo({top: 0, behavior: 'smooth'}); }

function load(q){
  document.getElementById('body').innerHTML = '<div class="loading">Loading scores…</div>';
  fetchWithTimeout('/api/mobile/gvm?limit=25' + (q ? '&q=' + encodeURIComponent(q) : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      STATE.results = d.results || []; STATE.sel = 0; STATE.q = d.query;
      STATE.frOpen = false; STATE.fr = null;
      document.getElementById('sub').innerHTML =
        'Growth · Value · Momentum · scored nightly 22:00 ' + railHtml(d.rail);
      render();
    })
    .catch(function(e){
      document.getElementById('body').innerHTML =
        '<div class="empty"><b>Could not load GVM</b>' + esc(e.message)
        + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
      document.getElementById('sub').textContent = 'failed to load';
    });
}
var t = null;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(t);
  var v = e.target.value.trim();
  t = setTimeout(function(){ load(v); }, 300);
});
load('');
</script>
</body>
</html>
