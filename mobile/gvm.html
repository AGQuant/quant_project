<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVM · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
<style>
/*
  cc#890 — GVM reskinned to previews/gvm.html (approved design, ported markup+CSS, live data).
  cc#893 — DEPTH: "Full report ▾" fold under the pillars fetches /api/gvm/company/{symbol} —
  the SAME endpoint the web GVM report reads (16202 by construction, no second derivation) — and
  renders every parameter block the web shows, grouped, on demand. Values render as returned;
  a missing value is --, never invented. Pushed by Claude (Fable), 17783.
*/
.search{display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line2);border-radius:12px;min-height:48px;padding:0 6px 0 14px;margin:12px 12px 0}
.search .ic{color:var(--dim);font-size:15px}
.search input{flex:1;min-height:46px;background:none;border:0;outline:none;color:var(--txt);
  font-family:inherit;font-size:16px}
.search input::placeholder{color:var(--dim);font-size:13px}
.rep{position:relative;background:var(--panel2);border:1px solid var(--line2);
  border-radius:15px;padding:15px 15px 15px 19px;overflow:hidden;margin-bottom:10px}
.rep::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc,var(--grn))}
.r1{display:flex;align-items:baseline;gap:9px}
.rsym{font-size:17px;font-weight:800;letter-spacing:-.01em}
.rseg{font-size:10px;color:var(--dim)}
.rpx{margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:13px;font-weight:700;color:var(--mut)}
.big{display:flex;align-items:baseline;gap:10px;margin-top:11px}
.gvmv{font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--rc,var(--grn));
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.gvmv .of{font-size:13px;color:var(--dim);font-weight:700}
.verd{font-size:12px;font-weight:800;color:var(--rc,var(--grn));border:1px solid var(--rc,var(--grn));
  border-radius:6px;padding:4px 10px}
.pil{margin-top:13px}
.pr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.pk{font-size:11px;font-weight:800;min-width:78px}
.bar{flex:1;height:7px;border-radius:4px;background:rgba(148,166,210,.14);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--rc,var(--grn))}
.pv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:800;
  min-width:32px;text-align:right}
.punch{font-size:12.5px;color:var(--mut);line-height:1.6;margin-top:11px;
  border-top:1px solid var(--line);padding-top:11px}
.punch b{color:var(--txt)}
.acts{display:flex;gap:8px;margin-top:12px}
.a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:var(--blu);border:1px solid rgba(77,124,254,.4);
  border-radius:10px;text-decoration:none;background:none;font-family:inherit;cursor:pointer}
.lrow{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;min-height:48px;cursor:pointer}
.rk{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:700;
  color:var(--dim);min-width:22px}
.rs{font-size:13.5px;font-weight:800}
.rg{font-size:9.5px;color:var(--dim);margin-top:1px}
.sc{margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:14px;font-weight:800}
.chev{color:var(--dim);font-size:14px}
/* cc#893 full report */
.fr{margin:-2px 0 10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.frh{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:800;
  letter-spacing:.13em;color:var(--dim);margin:10px 0 7px}
.frh:first-child{margin-top:0}
.frr{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid var(--line);min-height:32px}
.frr:first-of-type{border-top:0}
.frr .k2{font-size:11.5px;color:var(--mut);flex:1}
.frr .v2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;font-weight:700;text-align:right}
</style>
</head>
<body>
<div class="screen">
  <div class="head">
    <h1>GVM</h1>
    <div class="s" id="sub">Growth · Value · Momentum · scored nightly 22:00</div>
  </div>

  <div class="search">
    <span class="ic">&#9906;</span>
    <input id="q" type="search" placeholder="Search any stock — RELIANCE, TCS, LODHA…" autocomplete="off">
  </div>

  <div class="body" id="body"><div class="loading">Loading scores…</div></div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn on" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
var STATE = { results: [], sel: 0, frOpen: false, frData: null, frSym: null };

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function n1(v){ return (v == null || isNaN(Number(v))) ? '--' : Number(v).toFixed(1); }
function fmt(v){
  if (v == null) return '--';
  if (typeof v === 'number') return Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-IN') : (Math.round(v*100)/100).toString();
  return String(v).length <= 24 ? String(v) : null;
}
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return 'Rs.' + (x < 100 ? x.toFixed(1) : Math.round(x).toLocaleString('en-IN'));
}
function scoreCol(g){
  if (g == null) return 'var(--dim)';
  return g >= 7.5 ? 'var(--grn)' : (g >= 5 ? 'var(--amber)' : 'var(--red)');
}
function railHtml(r){
  if (!r) return '';
  var s = (r.state || 'CLOSED').toLowerCase();
  return '<span class="rail rail-' + s + '" title="' + esc(r.why || '') + '"><i></i>' + esc(r.state) + '</span>';
}
function pillarRow(k, v){
  var w = (v == null) ? 0 : Math.max(0, Math.min(100, Number(v) * 10));
  return '<div class="pr"><span class="pk">' + k + '</span>'
    + '<div class="bar"><div class="fill" style="width:' + w + '%"></div></div>'
    + '<span class="pv">' + n1(v) + '</span></div>';
}
function repCard(x){
  var col = scoreCol(x.gvm);
  return '<div class="rep" style="--rc:' + col + '">'
    + '<div class="r1"><span class="rsym">' + esc(x.symbol) + '</span>'
    + '<span class="rseg">' + esc(x.segment || '') + '</span>'
    + '<span class="rpx">' + px(x.price) + '</span></div>'
    + '<div class="big"><span class="gvmv">' + n1(x.gvm) + '<span class="of">/10</span></span>'
    + (x.verdict ? '<span class="verd">' + esc(String(x.verdict).toUpperCase()) + '</span>' : '')
    + '</div>'
    + '<div class="pil">'
    + pillarRow('GROWTH', x.g) + pillarRow('VALUE', x.v) + pillarRow('MOMENTUM', x.m)
    + '</div>'
    + (x.punchline
        ? '<div class="punch"><b>What the score says:</b> ' + esc(x.punchline) + '</div>' : '')
    + '<div class="acts">'
    + '<button class="a" onclick="toggleFR(\'' + esc(x.symbol) + '\')">'
    + (STATE.frOpen ? 'Hide full report \u25b4' : 'Full report \u25be') + '</button>'
    + '<a class="a" href="/m/check">Run Trade Check</a></div>'
    + '<div class="src">Rank ' + (x.rank == null ? '--' : esc(x.rank))
    + (x.as_of ? ' · scored ' + esc(x.as_of) : '') + '</div>'
    + '</div>'
    + (STATE.frOpen ? frBlock() : '');
}
/* cc#893 — render the web company report generically: every section object the API returns
   becomes a titled block of label→value rows; scalars at the top level go into an OVERVIEW
   block. Long text and nested arrays are skipped rather than mangled. Nothing is invented. */
function frBlock(){
  var d = STATE.frData;
  if (d === 'loading') return '<div class="fr"><div class="loading" style="padding:4px">Loading full report…</div></div>';
  if (!d || d.error) return '<div class="fr"><div class="empty" style="padding:8px"><b>Report unavailable</b>'
    + esc((d && d.error) || 'The report API answered with nothing for this symbol.') + '</div></div>';
  var scalars = [], blocks = '';
  Object.keys(d).forEach(function(k){
    var v = d[k];
    if (v == null) return;
    if (typeof v === 'object' && !Array.isArray(v)){
      var rows = '';
      Object.keys(v).forEach(function(k2){
        var s = fmt(v[k2]);
        if (s == null) return;
        rows += '<div class="frr"><span class="k2">' + esc(k2.replace(/_/g,' ')) + '</span>'
              + '<span class="v2">' + esc(s) + '</span></div>';
      });
      if (rows) blocks += '<div class="frh">' + esc(k.replace(/_/g,' ').toUpperCase()) + '</div>' + rows;
    } else if (typeof v !== 'object'){
      var s2 = fmt(v);
      if (s2 != null && ['symbol'].indexOf(k) === -1)
        scalars += 0; /* count only */
    }
  });
  var over = '';
  Object.keys(d).forEach(function(k){
    var v = d[k];
    if (v == null || typeof v === 'object') return;
    var s = fmt(v);
    if (s == null || k === 'symbol') return;
    over += '<div class="frr"><span class="k2">' + esc(k.replace(/_/g,' ')) + '</span>'
          + '<span class="v2">' + esc(s) + '</span></div>';
  });
  var out = (over ? '<div class="frh">OVERVIEW</div>' + over : '') + blocks;
  return '<div class="fr">' + (out || '<div class="empty" style="padding:8px"><b>Nothing to show</b>The report came back empty.</div>') + '</div>';
}
function toggleFR(sym){
  if (STATE.frOpen && STATE.frSym === sym){ STATE.frOpen = false; render(); return; }
  STATE.frOpen = true; STATE.frSym = sym; STATE.frData = 'loading'; render();
  fetchWithTimeout('/api/gvm/company/' + encodeURIComponent(sym))
    .then(function(r){ return r.json(); })
    .then(function(d){ STATE.frData = d; render(); })
    .catch(function(e){ STATE.frData = {error: e.message}; render(); });
}
function render(){
  var rs = STATE.results;
  if (!rs.length){
    document.getElementById('body').innerHTML =
      '<div class="empty"><b>Nothing found</b>No company matches your search.</div>';
    return;
  }
  var sel = Math.max(0, Math.min(STATE.sel, rs.length - 1));
  var h = '<div class="sect">THE REPORT · TAP ANY STOCK TO GET THIS</div>' + repCard(rs[sel]);
  h += '<div class="sect">' + (STATE.q ? 'MATCHES' : "TODAY'S TOP · BY GVM") + '</div>';
  h += rs.map(function(x, i){
    return '<div class="lrow" onclick="pick(' + i + ')">'
      + '<span class="rk">' + (x.rank == null ? '' : esc(x.rank)) + '</span>'
      + '<div><div class="rs">' + esc(x.symbol) + '</div>'
      + '<div class="rg">' + esc(x.segment || esc(x.name || '')) + '</div></div>'
      + '<span class="sc" style="color:' + scoreCol(x.gvm) + '">' + n1(x.gvm) + '</span>'
      + '<span class="chev">&#8250;</span></div>';
  }).join('');
  document.getElementById('body').innerHTML = h;
}
function pick(i){ STATE.sel = i; STATE.frOpen = false; STATE.frData = null; render();
  window.scrollTo({top: 0, behavior: 'smooth'}); }

function load(q){
  document.getElementById('body').innerHTML = '<div class="loading">Loading scores…</div>';
  fetchWithTimeout('/api/mobile/gvm?limit=25' + (q ? '&q=' + encodeURIComponent(q) : ''))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      STATE.results = d.results || []; STATE.sel = 0; STATE.q = d.query;
      STATE.frOpen = false; STATE.frData = null;
      document.getElementById('sub').innerHTML =
        'Growth · Value · Momentum · scored nightly 22:00 ' + railHtml(d.rail);
      render();
    })
    .catch(function(e){
      document.getElementById('body').innerHTML =
        '<div class="empty"><b>Could not load GVM</b>' + esc(e.message)
        + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
      document.getElementById('sub').textContent = 'failed to load';
    });
}
var t = null;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(t);
  var v = e.target.value.trim();
  t = setTimeout(function(){ load(v); }, 300);
});
load('');
</script>
</body>
</html>
