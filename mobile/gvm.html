<!doctype html>
<!-- ══ mobile/gvm.html — the app GVM company page (cc#1591, APP_GVM_PAGE_V2, session_log 36513) ══
     DESIGN AUTHORITY = design_refs/scorr_mobile_gvm_R3.html (R3 on R2 on R1; cc_task_logs 4470,
     4473, 4475). Bind field for field to GET /api/gvm/company/{symbol}; nothing is computed
     here that the API already carries. Routes: /m/gvm (search landing) and
     /m/gvm?sym=SYMBOL[#growth|value|momentum|peers|results|financials|holders|tape].

     STYLE SCOPE: every rule lives under #gvp and every inner class is page-local (g-… names),
     because the shared sheets this page loads (mobile_app.css, scorr_theme_r5.css,
     theme_mobile.css, mobile.css) declare bare short selectors (.v .c .g .m .k .s .l .bar .row
     .word .tag …) that would restyle a ref class with the same name. Shell classes the ref shares
     with the app (.pressed .slab .well-up .well .sect .seg .tag .chip .mono) are used as-is.
     Bottom nav markup is the app's own and is not touched (card do_not_touch). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVM</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<link rel="stylesheet" href="/static/scorr_themes.css">
<style>
/* tokens: GOLD NIGHT with page-local fallbacks (theme sheets win when present) */
#gvp{
  /* theme tokens are read through g- aliases: a token that referenced itself (--gold:var(--gold,…))
     is a cycle and computes to invalid for every descendant, which blanked the capsule (P4). */
  --g-field:var(--field,#0A0A0C); --g-panel:var(--panel,#17171B); --g-sunk:var(--sunk,#0C0C0F); --g-gold-lo:var(--gold-lo,#7A6320); --g-gold-hi:var(--gold-hi,#F0D070);
  --well:#131316; --chalk:#F5F2EA; --mute:#8A8A93; --dim:#5E5E66; --line:#2A2A31;
  --gold:#D4AF37; --gold-d:rgba(212,175,55,.12);
  --up:#2FD48B; --down:#FF5C6C; --amber:#FF9F45; --aqua:#35E0FF;
  --up-d:rgba(47,212,139,.14); --down-d:rgba(255,92,108,.14); --amber-d:rgba(255,159,69,.14);
  --display:'Archivo Black','Space Grotesk','Sora',system-ui,sans-serif;
  --body:'Space Grotesk','Sora',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
  color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  max-width:430px;margin:0 auto;padding:0 12px 150px;
}
#gvp *{box-sizing:border-box}
#gvp .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#gvp .up{color:var(--up)} #gvp .dn{color:var(--down)} #gvp .mu{color:var(--mute)} #gvp .gd{color:var(--gold)} #gvp .am{color:var(--amber)}
/* search */
#gvp .g-search{position:relative;margin:12px 0 14px}
#gvp .g-sbox{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--well);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.7)}
#gvp .g-sbox .g-ic{color:var(--gold);font-size:15px}
#gvp .g-sbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--chalk);font-family:var(--mono);font-size:14px;min-height:24px;padding:0}
#gvp .g-sbox input::placeholder{color:var(--dim)}
#gvp .g-sbox .g-k{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);padding:2px 6px;white-space:nowrap}
#gvp .g-drop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--g-panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden}
#gvp .g-drop[hidden]{display:none}
#gvp .g-drow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
#gvp .g-drow:last-child{border-bottom:0}
#gvp .g-drow:active{background:var(--gold-d)}
#gvp .g-drow .g-ds{font-weight:800;font-size:14px}
#gvp .g-drow .g-dn{grid-column:1;font-size:11.5px;color:var(--mute)}
#gvp .g-drow .g-dg{grid-column:2;grid-row:1 / span 2;font-family:var(--mono);font-weight:800;font-size:15px;align-self:center;text-align:right}
#gvp .g-drow .g-dg small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--mute)}
/* shells (ref) */
#gvp .pressed{background:var(--g-sunk);border:1px solid #000;border-radius:12px;padding:16px;box-shadow:inset 0 3px 9px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.10),0 1px 0 rgba(255,255,255,.05)}
#gvp .slab{background:var(--g-panel);border:1.5px solid var(--line);border-radius:13px;padding:14px 15px;box-shadow:0 5px 0 0 var(--g-gold-lo),0 5px 0 1.5px var(--line)}
#gvp .well-up{background:var(--well);border-radius:7px;box-shadow:0 1px 0 rgba(255,255,255,.07),0 -1px 0 #000}
#gvp .well{background:var(--g-sunk);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 0 0 #000}
#gvp .tag{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:0;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
#gvp .tag.gd{background:var(--gold-d);color:var(--gold)} #gvp .tag.up{background:var(--up-d);color:var(--up)} #gvp .tag.dn{background:var(--down-d);color:var(--down)} #gvp .tag.am{background:var(--amber-d);color:var(--amber)} #gvp .tag.mu{background:var(--well);color:var(--mute);border:1px solid var(--line)}
#gvp .sect{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-family:var(--display);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);transform:skewX(-6deg);transform-origin:left center;scroll-margin-top:12px}
#gvp .sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--g-gold-lo),transparent)}
#gvp .sect .g-r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:0;text-transform:none;transform:skewX(6deg);white-space:nowrap}
/* landing list (no symbol yet) */
#gvp .g-row{display:grid;grid-template-columns:22px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
#gvp .g-row:last-child{border-bottom:0}
#gvp .g-row .g-rk{font-family:var(--mono);color:var(--dim);font-size:11px}
#gvp .g-row .g-sy{font-weight:800;font-size:14px}
#gvp .g-row .g-nm{grid-column:2;font-size:11px;color:var(--mute);margin-top:-2px}
#gvp .g-row .g-sc{grid-column:3;grid-row:1 / span 2;font-family:var(--mono);font-weight:800;font-size:16px;text-align:right}
#gvp .g-row .g-sc small{display:block;font-size:9.5px;letter-spacing:.5px;font-weight:700;color:var(--mute)}
/* hero (ref .hero, page-local names) */
#gvp .g-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#gvp .g-sym{font-family:var(--display);font-size:26px;letter-spacing:-.3px;line-height:1}
#gvp .g-nm{color:var(--mute);font-size:12.5px;margin-top:4px}
#gvp .g-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#gvp .g-px{text-align:right}
#gvp .g-px .g-pv{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:-.3px}
#gvp .g-px .g-ps{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap}
#gvp .g-score{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;margin:16px 0 12px}
#gvp .g-dial{position:relative;width:130px;height:130px}
#gvp .g-dial svg{width:130px;height:130px;transform:rotate(-90deg)}
#gvp .g-dial .g-dn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#gvp .g-dial .g-dn b{font-family:var(--mono);font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--gold)}
#gvp .g-dial .g-dn small{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:1.5px;margin-top:2px}
#gvp .g-pillars{display:flex;flex-direction:column;gap:9px}
#gvp .g-pl .g-pll{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--mute)}
#gvp .g-pl .g-pll b{color:var(--chalk);letter-spacing:0;font-size:13px}
#gvp .g-pl .g-pbar{height:7px;margin-top:4px;background:var(--well);border:1px solid var(--line);overflow:hidden;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
#gvp .g-pl .g-pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g-gold-lo),var(--gold))}
#gvp .g-pl.pg .g-pbar i{background:linear-gradient(90deg,#3d6b3f,var(--up))}
#gvp .g-pl.pv .g-pbar i{background:linear-gradient(90deg,#6b4a1e,var(--amber))}
#gvp .g-pl.pm .g-pbar i{background:linear-gradient(90deg,#1f5a6b,var(--aqua))}
#gvp .g-verdict{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
#gvp .g-verdict .g-w{font-family:var(--display);font-size:22px;letter-spacing:.5px;color:var(--amber);transform:skewX(-6deg)}
#gvp .g-verdict .g-w.good{color:var(--up)} #gvp .g-verdict .g-w.weak{color:var(--down)}
#gvp .g-punch{font-size:13.5px;line-height:1.5;color:var(--chalk)}
#gvp .g-punch b{color:var(--gold);font-weight:700}
#gvp .g-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#gvp .g-f{padding:9px 10px}
#gvp .g-f .g-fl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;color:var(--mute)}
#gvp .g-f .g-fv{font-family:var(--mono);font-size:15px;font-weight:800;margin-top:2px}
#gvp .g-f .g-fs{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
#gvp .g-pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#gvp .g-pn .g-col{padding:8px 10px}
#gvp .g-pn .g-pt{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;margin-bottom:5px}
#gvp .g-pn .g-pr{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid var(--line)}
#gvp .g-pn .g-pr:last-child{border-bottom:0}
#gvp .g-pn .g-pr span{font-family:var(--mono);font-weight:700;white-space:nowrap}
#gvp .g-hfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-family:var(--mono);font-size:10px;color:var(--dim)}
/* C·A·R·D strip on the hero (shared scorr_card_strip.js component; page only positions it) */
#gvp .g-strip{display:flex;justify-content:center;margin-top:12px;min-height:32px}
#gvp .g-strip .scorr-card-strip{gap:8px}
/* GVM 60-day mini trend (R3: one line); tap opens the price chart */
#gvp .g-trend{margin-top:14px;padding:10px 10px 8px;cursor:pointer}
#gvp .g-trend .g-thd{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--mute);margin-bottom:6px}
#gvp .g-trend .g-thd .g-exp{color:var(--gold);letter-spacing:.3px}
#gvp svg.g-ch{display:block;width:100%;height:auto}
#gvp .g-lg{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:6px}
#gvp .g-lg i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle;background:var(--gold)}
/* capsule: fixed 8-pill section nav above the bottom nav (ref .capsule/.cap, page-local names) */
#gvp .g-capsule{position:fixed;left:12px;right:12px;bottom:72px;z-index:60;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:6px;background:rgba(19,19,22,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 0 0 var(--g-gold-lo),0 6px 0 1.5px var(--line),0 -8px 30px rgba(0,0,0,.6)}
#gvp .g-capsule[hidden]{display:none}
#gvp .g-cap{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:16px;color:var(--mute);text-decoration:none;font-family:var(--mono);font-size:8.5px;letter-spacing:.4px;font-weight:700;text-transform:uppercase;min-width:0}
#gvp .g-cap .g-ci{font-size:16px;line-height:1}
#gvp .g-cap.g-on{background:var(--gold);color:#141005;box-shadow:0 2px 0 var(--g-gold-lo)}
#gvp .g-cap:active{transform:translateY(1px)}
/* section summary line (each card body arrives in its own push; until then the line is the payload's own number) */
#gvp .g-sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
#gvp .g-sum b{color:var(--chalk);font-weight:700}
/* benchmark rows (ref .bm): label, peer line, value + rating chip, peer-range track */
#gvp .g-bm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
#gvp .g-bm:last-child{border-bottom:0;padding-bottom:0}
#gvp .g-bm .g-bk{grid-column:1;grid-row:1;font-size:12.5px;font-weight:600}
#gvp .g-bm .g-bsub{grid-column:1;grid-row:2;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
#gvp .g-bm .g-bval{grid-column:2;grid-row:1 / span 2;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
#gvp .g-bm .g-bval b{font-family:var(--mono);font-size:15px;font-weight:800}
#gvp .g-rt{font-family:var(--mono);font-size:10px;letter-spacing:.5px;padding:1px 6px;margin-top:2px;clip-path:polygon(3px 0,100% 0,100% 100%,0 100%,0 3px)}
#gvp .g-rt.hi{background:var(--up-d);color:var(--up)} #gvp .g-rt.mid{background:var(--amber-d);color:var(--amber)} #gvp .g-rt.lo{background:var(--down-d);color:var(--down)} #gvp .g-rt.na{background:var(--well);color:var(--dim);border:1px solid var(--line)}
#gvp .g-bm .g-peer{grid-column:1 / span 2;grid-row:3;position:relative;height:6px;margin-top:6px;background:var(--well);border:1px solid var(--line)}
#gvp .g-bm .g-peer .g-rng{position:absolute;top:0;bottom:0;background:rgba(138,138,147,.25)}
#gvp .g-bm .g-peer .g-me{position:absolute;top:-4px;width:2px;height:12px;background:var(--gold);box-shadow:0 0 6px var(--gold)}
#gvp .g-bm .g-peer .g-med{position:absolute;top:-3px;width:1px;height:10px;background:var(--mute)}
#gvp .g-legend{display:flex;gap:14px;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:10px}
#gvp .g-legend i{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:-1px}
/* charts (ref svg.ch + .chart-cap) */
#gvp svg.g-ch2{display:block;width:100%;height:auto}
#gvp .g-cap2{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:6px}
#gvp .g-note{margin-top:10px;font-size:12.5px;color:var(--mute);line-height:1.5}
#gvp .g-lbl{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--mute)}
/* tiles (ref .tiles/.tile) */
#gvp .g-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#gvp .g-tile{padding:10px 12px}
#gvp .g-tile .g-tl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;color:var(--mute)}
#gvp .g-tile .g-tv{font-family:var(--mono);font-size:18px;font-weight:800;margin-top:2px}
#gvp .g-tile .g-ts{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:1px}
/* peers ladder (ref .lad) */
#gvp .g-lad{display:grid;grid-template-columns:22px 1fr auto auto;gap:4px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
#gvp .g-lad:last-child{border-bottom:0}
#gvp .g-lad .g-rk{font-family:var(--mono);color:var(--dim);font-size:11px}
#gvp .g-lad .g-ls{font-weight:700}
#gvp .g-lad .g-lg{font-family:var(--mono);font-weight:800;min-width:34px;text-align:right}
#gvp .g-lad .g-vd{min-width:64px;text-align:center}
#gvp .g-lad.me{background:var(--gold-d);margin:0 -8px;padding:7px 8px;border-radius:6px;border-bottom:0}
#gvp .g-lad.me .g-ls{color:var(--gold)}
#gvp .g-lad.g-full{grid-template-columns:22px 1fr auto auto auto auto}
#gvp .g-lad .g-lx{font-family:var(--mono);font-size:10.5px;color:var(--mute);min-width:40px;text-align:right}
#gvp .g-ladhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-bottom:8px}
#gvp .g-more{margin-top:10px;display:flex;justify-content:center}
#gvp .g-more .tag{padding:6px 12px;cursor:pointer}
/* results rows (ref .res) */
#gvp .g-res{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
#gvp .g-res:last-child{border-bottom:0}
#gvp .g-res .g-rk2{grid-column:1;grid-row:1;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
#gvp .g-res .g-dot{width:9px;height:9px;border-radius:50%;flex:none}
#gvp .g-res .g-rsub{grid-column:1;grid-row:2;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
#gvp .g-res .g-rv{grid-column:2;grid-row:1 / span 2;font-family:var(--mono);font-size:15px;font-weight:800;text-align:right;align-self:center}
/* financials: page-local seg + table (shared sheets own .seg/.on and bare table rules) */
#gvp .g-seg{display:flex;gap:4px;padding:4px;background:var(--well);border:1px solid var(--line);border-radius:9px;margin-bottom:12px}
#gvp .g-seg button{flex:1;border:0;background:transparent;color:var(--mute);font-family:var(--mono);font-size:11px;font-weight:700;padding:7px 4px;border-radius:6px;cursor:pointer}
#gvp .g-seg button.g-on{background:var(--gold);color:#141005;box-shadow:0 2px 0 var(--g-gold-lo)}
#gvp .g-ftw{overflow-x:auto}
#gvp table.g-ftbl{width:100%;border-collapse:collapse}
#gvp .g-ftbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:var(--mute);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
#gvp .g-ftbl th:first-child{text-align:left}
#gvp .g-ftbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12px;color:var(--chalk);white-space:nowrap}
#gvp .g-ftbl td:first-child{text-align:left;font-family:var(--body);font-weight:600;font-size:12.5px;white-space:normal}
#gvp .g-ftbl tr:last-child td{border-bottom:0}
#gvp .g-ftbl td.g-ttm{color:var(--gold)}
#gvp .g-fbk{margin-top:12px;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--mute)}
#gvp .g-ffoot{margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim)}
/* states */
#gvp .g-empty{padding:18px 14px;text-align:center;color:var(--mute);font-size:13px;line-height:1.5}
#gvp .g-empty .chip{display:inline-block;margin-top:10px;padding:8px 14px;border:1px solid var(--line);border-radius:0;font-family:var(--mono);font-size:11px;color:var(--gold);cursor:pointer;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
#gvp .g-asof{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px;text-align:right}
#gvp .g-foot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:18px}
/* active bottom-nav slot takes the ref's gold (markup untouched) */
.bnav .bn.on{color:var(--gold,#D4AF37);text-shadow:0 0 10px rgba(212,175,55,.35)}
@media (prefers-reduced-motion:reduce){#gvp *{transition:none !important}}
</style>
</head>

<script src="/scorr_card_common.js"></script>
<script>
(function(){
'use strict';
/* ── fetch layer: the three GVM endpoints the card allows, nothing else ─────────────── */
var URLS = { company:'/api/gvm/company/', search:'/api/gvm/search', list:'/api/mobile/gvm?limit=25', history:'/api/gvm/history/' };
var STATE = { sym:null, co:null, list:null, hist:null, fetchedAt:null };
function getJ(url){ return fetchWithTimeout(url).then(function(r){ if(!r.ok) throw new Error(url+' '+r.status); return r.json(); }); }
/* ── helpers ─────────────────────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ return typeof v === 'number' && isFinite(v); }
function fx(v, dp){ return num(v) ? v.toFixed(dp==null?1:dp) : '—'; }
function inr(v){ if(!num(v)) return '—'; var s = Math.abs(v).toFixed(1); var p = s.split('.'), a = p[0], last3 = a.slice(-3), rest = a.slice(0,-3); if(rest) last3 = ','+last3; return (v<0?'−':'')+'₹'+rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',')+last3+'.'+p[1]; }
function cr(v){ if(!num(v)) return '—'; if(Math.abs(v)>=1e5) return '₹'+(v/1e5).toFixed(2)+'L Cr'; if(Math.abs(v)>=1000) return '₹'+(v/1000).toFixed(1)+'k Cr'; return '₹'+v.toFixed(0)+' Cr'; }
function istNow(){ var n = new Date(); return new Date(n.getTime() + (330 + n.getTimezoneOffset())*60000); }
function hhmm(d){ return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function symFromUrl(){ var m = /[?&]sym=([^&#]+)/.exec(location.search); return m ? decodeURIComponent(m[1]).trim().toUpperCase() : null; }
function verdictCls(v){ v = String(v||'').toLowerCase(); return v==='excellent'||v==='good' ? 'up' : v==='weak' ? 'dn' : 'am'; }
/* ── search: /api/gvm/search autocomplete, tap navigates to /m/gvm?sym= ───────────────── */
var qEl = document.getElementById('g-q'), drop = document.getElementById('g-drop'), qT = null, qSeq = 0;
qEl.addEventListener('input', function(){
  clearTimeout(qT); var v = qEl.value.trim();
  if(v.length < 2){ drop.hidden = true; drop.innerHTML = ''; return; }
  qT = setTimeout(function(){
    var seq = ++qSeq;
    getJ(URLS.search+'?q='+encodeURIComponent(v)+'&limit=8').then(function(d){
      if(seq !== qSeq) return;
      var rs = (d && d.results) || [];
      if(!rs.length){ drop.innerHTML = '<div class="g-drow"><span class="g-ds mu">No match for '+esc(v)+'</span></div>'; drop.hidden = false; return; }
      drop.innerHTML = rs.map(function(r){
        return '<div class="g-drow" data-go="'+esc(r.symbol)+'"><span class="g-ds">'+esc(r.symbol)+'</span><span class="g-dn">'+esc(r.company_name||'')+(r.segment?' · '+esc(r.segment):'')+'</span>'+
               '<span class="g-dg '+verdictCls(r.verdict)+'">'+fx(r.gvm_score,2)+'<small>'+esc(r.verdict||'')+'</small></span></div>';
      }).join('');
      drop.hidden = false;
    }).catch(function(){ drop.innerHTML = '<div class="g-drow"><span class="g-ds mu">Search is not available right now.</span></div>'; drop.hidden = false; });
  }, 250);
});
qEl.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ var v = qEl.value.trim().toUpperCase(); if(v){ go(v); } } });
document.addEventListener('click', function(e){ if(!e.target.closest('.g-search')) drop.hidden = true; });
function go(sym){
  drop.hidden = true; qEl.blur();
  var url = '/m/gvm?sym='+encodeURIComponent(sym);
  try { history.pushState({sym:sym}, '', url); } catch(e){ location.href = url; return; }
  loadCompany(sym);
}
window.addEventListener('popstate', function(){ var s = symFromUrl(); if(s) loadCompany(s); else loadLanding(); });
/* ── company view ────────────────────────────────────────────────────────────────────── */
var main = document.getElementById('g-main'), foot = document.getElementById('g-foot');
function fail(words, retrySym){
  main.innerHTML = '<div class="slab g-empty">'+esc(words)+'<br><span class="chip" data-retry="'+esc(retrySym||'')+'">Retry</span></div>';
}
function loadCompany(sym){
  STATE.sym = sym; qEl.value = sym; document.title = sym+' · GVM'; disarmCapsule();
  main.innerHTML = '<div class="slab g-empty">Loading '+esc(sym)+'…</div>'; foot.textContent = '';
  getJ(URLS.company+encodeURIComponent(sym)).then(function(d){
    if(STATE.sym !== sym) return;
    if(!d || d.error || !d.symbol){ fail((d && d.error) ? String(d.error) : 'No GVM report for '+sym+'. Scores exist only for companies the nightly run covers.', sym); return; }
    STATE.co = d; STATE.hist = null; STATE.fetchedAt = istNow(); renderCompany();
    getJ(URLS.history+encodeURIComponent(sym)+'?days=60').then(function(h){ if(STATE.sym !== sym) return; STATE.hist = (h && h.points) ? h.points : []; renderTrend(); },
                                                                   function(){ if(STATE.sym === sym){ STATE.hist = false; renderTrend(); } });
  }).catch(function(){ if(STATE.sym === sym) fail('Could not load the GVM report for '+sym+'.', sym); });
}
/* ── HERO (ref hero; session_log 36513 hero + rule 4 of the card) ─────────────────────── */
var CIRC = 2*Math.PI*56;   /* r=56 in the ref dial */
var LBL = { sales_5y:'Sales 5Y growth', sales_3y:'Sales 3Y growth', profit_5y:'Profit 5Y CAGR', profit_3y:'Profit 3Y CAGR', qoq_sales:'Sales this year', qoq_profit:'Profit this year',
  opm:'Operating margin', opm_exp:'Margin', pe:'PE', fwd_pe:'PE next year', hist_pe:'PE vs own 5y', sector_pe:'PE vs sector', pb:'Price / Book', annual_upside:'Upside to fair value',
  div_yield:'Dividend yield', roce:'Return on capital', int_cov:'Interest cover', inst_abs:'Institutions', inst_chg:'Institutional buying',
  ret_1y:'Return 1Y', ret_3y:'Return 3Y', ret_52w_idx:'vs Nifty 52W', ret_1m:'Return 1M', dma_50:'vs 50-day avg', dma_200:'vs 200-day avg', rsi_month:'Monthly RSI', vol_trend:'Volume trend' };
function plainLabel(b){ return LBL[b.key] || String(b.label||b.key||'').replace(/\s*\(.*?\)\s*/g,' ').trim(); }
function bmVal(b){
  var v = b.company, u = b.unit || '';
  if(!num(v)) return '—';
  if(u === 'x'){ var pm = num(b.peer_median) ? ' vs '+Math.round(b.peer_median)+'×' : ''; return Math.round(v)+'×'+pm; }
  if(u === 'bps') return (v>0?'+':v<0?'−':'')+Math.abs(Math.round(v))+' bps';
  if(u === '%'){ var big = Math.abs(v) >= 20 && /^ret_/.test(b.key||''); return (v>0 && /^(ret_|inst_chg|dma_|qoq_)/.test(b.key||'')?'+':v<0?'−':'')+Math.abs(v).toFixed(big?0:1)+'%'; }
  return fx(v,1);
}
/* punchline → plain words, <= 20 words (card rule 4). Built from the API sentence's own three
   adjectives and its call to action; falls back to the trimmed sentence when the pattern is absent. */
function plainPunch(p){
  p = String(p||'').trim(); if(!p) return '';
  var m = /considering its\s+(\w+)\s+Growth,\s*(\w+)\s+Valuation,\s*(\w+)\s+Momentum/i.exec(p);
  var act = /advisable to\s+(.+?)\s+for\s+(short|medium|long)(?:\s+to\s+(short|medium|long))?\s*term/i.exec(p);
  var ACT = { 'watch and accumulate on dips':'Watch, and add on dips', 'accumulate on dips':'Add on dips', 'accumulate':'Add slowly', 'buy':'Buy', 'hold':'Hold', 'avoid':'Avoid', 'book profits':'Book profits', 'sell':'Sell', 'watch':'Watch' };
  if(m && act){
    var a = act[1].trim().toLowerCase().replace(/\s+/g,' '), aw = ACT[a] || (act[1].charAt(0).toUpperCase()+act[1].slice(1).toLowerCase());
    var hz = act[3] ? act[2]+' to '+act[3]+' term' : act[2]+' term';
    var val = m[2].toLowerCase() === 'fair' ? 'fair value' : m[2].toLowerCase()+' value';
    var out = m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase()+' growth, '+val+', '+m[3].toLowerCase()+' momentum. <b>'+esc(aw)+'</b> for the '+hz+'.';
    if(out.replace(/<[^>]+>/g,'').split(/\s+/).length <= 20) return out;
  }
  var first = p.split(/(?<=\.)\s/)[0].replace(/\s+/g,' ');
  var w = first.split(' '); if(w.length > 20) first = w.slice(0,20).join(' ')+'…';
  return esc(first);
}
function trendWord(tr){
  if(!tr || tr.length < 2) return null;
  var a = tr[0].gvm, b = tr[tr.length-1].gvm; if(!num(a)||!num(b)) return null;
  var d = b - a; return { word: d >= 0.1 ? 'up' : d <= -0.1 ? 'down' : 'flat', cls: d >= 0.1 ? 'up' : d <= -0.1 ? 'dn' : 'mu', days: tr.length, now: b, d: d };
}
function pnCol(title, cls, rows){
  var h = '<div class="g-col well-up"><div class="g-pt '+cls+'">'+title+'</div>';
  if(!rows || !rows.length) h += '<div class="g-pr mu">none flagged</div>';
  else for(var i=0;i<rows.length && i<3;i++) h += '<div class="g-pr">'+esc(plainLabel(rows[i]))+'<span class="'+cls+'">'+esc(bmVal(rows[i]))+'</span></div>';
  return h+'</div>';
}
function renderHero(d){
  var sc = d.scores || {}, ex = d.extras || {}, pc = ex.percentile, sg = ex.segment_ctx, r52 = ex.range52;
  var chips = '';
  if(d.segment) chips += '<span class="tag gd">'+esc(String(d.segment).toUpperCase())+'</span>';
  if(d.cap_category) chips += '<span class="tag mu">'+esc(String(d.cap_category).toUpperCase())+' CAP'+(num(d.mcap_rank)?' · #'+d.mcap_rank:'')+'</span>';
  if(num(d.segment_rank) && num(d.segment_total)) chips += '<span class="tag mu">RANK '+d.segment_rank+' / '+d.segment_total+'</span>';
  var gvm = num(sc.gvm) ? Math.max(0, Math.min(10, sc.gvm)) : null;
  var arc = gvm==null ? 0 : (gvm/10*CIRC);
  var vcls = /^(excellent|good)$/i.test(d.verdict||'') ? ' good' : /^weak$/i.test(d.verdict||'') ? ' weak' : '';
  var tw = trendWord(ex.trend);
  var pill = function(k, name, v){ return '<div class="g-pl '+k+'"><div class="g-pll"><span>'+name+'</span><b>'+fx(v,1)+'</b></div><div class="g-pbar"><i style="width:'+(num(v)?Math.max(0,Math.min(100,v*10)).toFixed(0):0)+'%"></i></div></div>'; };
  return '<section class="pressed" id="score" aria-label="GVM score">'+
    '<div class="g-top"><div><div class="g-sym">'+esc(d.symbol)+'</div><div class="g-nm">'+esc(d.company_name||'')+'</div><div class="g-chips">'+chips+'</div></div>'+
    '<div class="g-px"><div class="g-pv">'+inr(d.price)+'</div><div class="g-ps">'+esc(d.price_label||'CMP')+(d.price_is_live?' · live '+hhmm(STATE.fetchedAt):(d.price_date?' · '+esc(d.price_date):' · last close'))+'</div>'+
    (r52 && num(r52.lo) && num(r52.hi) ? '<div class="g-ps">52W '+Math.round(r52.lo).toLocaleString('en-IN')+'–'+Math.round(r52.hi).toLocaleString('en-IN')+'</div>' : '')+'</div></div>'+
    '<div class="g-score"><div class="g-dial"><svg viewBox="0 0 130 130" aria-hidden="true"><circle cx="65" cy="65" r="56" fill="none" stroke="var(--line)" stroke-width="12"/>'+
    (gvm==null?'':'<circle cx="65" cy="65" r="56" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+arc.toFixed(1)+' '+CIRC.toFixed(1)+'"/>')+
    '</svg><div class="g-dn"><b>'+fx(gvm,1)+'</b><small>GVM / 10</small></div></div>'+
    '<div class="g-pillars">'+pill('pg','G · GROWTH',sc.g)+pill('pv','V · VALUE',sc.v)+pill('pm','M · MOMENTUM',sc.m)+'</div></div>'+
    '<div class="g-verdict"><span class="g-w'+vcls+'">'+esc(d.verdict||'—')+'</span>'+
    (pc && num(pc.top_pct) ? '<span class="tag mu">TOP '+Math.round(pc.top_pct)+'% OF '+(num(pc.universe_total)?pc.universe_total.toLocaleString('en-IN'):'—')+'</span>' : '')+'</div>'+
    (d.punchline ? '<div class="g-punch">'+plainPunch(d.punchline)+'</div>' : '<div class="g-punch mu">No summary line for this company yet.</div>')+
    '<div class="g-facts">'+
      '<div class="g-f well-up"><div class="g-fl">MCAP</div><div class="g-fv">'+cr(d.market_cap)+'</div><div class="g-fs">'+esc(d.cap_category||'—')+(num(d.mcap_rank)?' · rank '+d.mcap_rank:'')+'</div></div>'+
      '<div class="g-f well-up"><div class="g-fl">SECTOR GVM</div><div class="g-fv">'+(sg?fx(sg.mcap_wtd_gvm,2):'—')+'</div><div class="g-fs">'+(sg && num(sg.stock_vs_sector) ? 'you are '+(sg.stock_vs_sector>0?'+':sg.stock_vs_sector<0?'−':'')+Math.abs(sg.stock_vs_sector).toFixed(2) : 'no sector read')+'</div></div>'+
      '<div class="g-f well-up"><div class="g-fl">SCORE TREND</div><div class="g-fv '+(tw?tw.cls:'mu')+'">'+(tw?tw.word:'—')+'</div><div class="g-fs">'+(tw?tw.days+' days · '+fx(tw.now,1):'no trend yet')+'</div></div>'+
    '</div>'+
    '<div class="g-strip"></div>'+
    '<div class="g-trend well" id="g-trend" role="button" data-trend="1" aria-label="Open the price chart with the GVM overlay"><div class="g-thd"><span>GVM · 60-DAY TREND</span><span class="g-exp">tap for price chart ⤢</span></div><div class="g-empty" style="padding:10px">Loading the score history…</div></div>'+
    '<div class="g-pn">'+pnCol('STRONG','up',d.positives)+pnCol('WEAK','dn',d.negatives)+'</div>'+
    '<div class="g-hfoot"><span>score as of '+esc(d.score_date||'—')+(num(d.peer_count)?' · peers: '+d.peer_count+' in segment':'')+'</span><span>Pick a capsule below ↓</span></div>'+
    '</section>';
}
/* GVM mini trend: /api/gvm/history points (oldest first), 0-10 axis, ref geometry (viewBox 360x90,
   grid at 2.5 / 5 / 7.5 → y 79.1 / 54.8 / 30.4), ONE polyline (R3). */
function yOf(v){ return 103.45 - 9.74*v; }
function renderTrend(){
  var el = document.getElementById('g-trend'); if(!el) return;
  var hd = '<div class="g-thd"><span>GVM · 60-DAY TREND</span><span class="g-exp">tap for price chart ⤢</span></div>';
  var pts = STATE.hist;
  if(pts === null){ el.innerHTML = hd+'<div class="g-empty" style="padding:10px">Loading the score history…</div>'; return; }
  if(pts === false){ el.innerHTML = hd+'<div class="g-empty" style="padding:10px">Score history is not available right now.</div>'; return; }
  var rows = pts.filter(function(x){ return num(x.gvm_score); }).slice().sort(function(a,b){ return a.score_date < b.score_date ? -1 : 1; });
  if(rows.length < 2){ el.innerHTML = hd+'<div class="g-empty" style="padding:10px">Not enough nightly scores yet to draw a trend ('+rows.length+' so far).</div>'; return; }
  var n = rows.length, hi = -1, lo = 11, poly = [];
  for(var i=0;i<n;i++){ var v = Math.max(0, Math.min(10, rows[i].gvm_score)); if(v>hi) hi=v; if(v<lo) lo=v; poly.push((6+348*i/(n-1)).toFixed(1)+','+yOf(v).toFixed(1)); }
  var now = rows[n-1].gvm_score, first = rows[0].score_date, last = rows[n-1].score_date;
  var grid = [2.5,5,7.5].map(function(g){ return '<line x1="6" y1="'+yOf(g).toFixed(1)+'" x2="354" y2="'+yOf(g).toFixed(1)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>'; }).join('');
  el.innerHTML = hd+'<svg class="g-ch" viewBox="0 0 360 90" aria-hidden="true">'+grid+'<polyline fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round" points="'+poly.join(' ')+'"/></svg>'+
    '<div class="g-lg"><span><i></i>GVM 0–10 · nightly score · '+n+' sessions</span><span>now <b class="gd mono">'+fx(now,2)+'</b> · high '+fx(hi,2)+' · low '+fx(lo,2)+'</span></div>'+
    '<div class="g-asof">'+esc(first)+' → '+esc(last)+'</div>';
}
function openChart(){
  if(window.ScorrChartCard && STATE.sym){ window.ScorrChartCard.open(STATE.sym, {theme:'dark'}); watchModal(); return true; }
  return false;
}
/* ── SECTIONS: eight cards in the ref order. Each card body lands in its own push; until then a
   section shows one summary line read straight off the payload (never a placeholder). ─────── */
function bmRow(d, key){ var b = (d.benchmark||[]); for(var i=0;i<b.length;i++) if(b[i].key===key) return b[i]; return null; }
function finRow(tbl, label){ if(!tbl || !tbl.rows) return null; for(var i=0;i<tbl.rows.length;i++) if(tbl.rows[i].label===label) return tbl.rows[i]; return null; }
function lastVal(row){ if(!row || !row.values) return null; for(var i=row.values.length-1;i>=0;i--) if(num(row.values[i])) return row.values[i]; return null; }
function sectHead(id, title, right){ return '<div class="sect" id="'+id+'">'+title+' <span class="g-r">'+esc(right||'')+'</span></div>'; }
function sumLine(parts){ return '<section class="slab"><div class="g-sum">'+parts.map(function(x){ return '<span>'+x+'</span>'; }).join('')+'</div></section>'; }
/* rating chip: hi >= 7.5 / lo <= 3.75 / mid between (36513 growth card); NULL → em dash chip */
function rtChip(r){ if(!num(r)) return '<span class="g-rt na">—</span>'; var c = r >= 7.5 ? 'hi' : r <= 3.75 ? 'lo' : 'mid'; return '<span class="g-rt '+c+'">'+(Number.isInteger(r)?r:r.toFixed(1).replace(/\.0$/,''))+'</span>'; }
/* value text for a benchmark row in its own unit (no peer suffix here; the sub line carries peers) */
function bmSelf(b){
  var v = b.company, u = b.unit || ''; if(!num(v)) return '—';
  if(u === 'x') return v.toFixed(1)+'×';
  if(u === 'bps') return (v>0?'+':v<0?'−':'')+Math.abs(Math.round(v))+' bps';
  if(u === '%') return (v<0?'−':(/^(ret_|inst_chg|dma_|qoq_|opm_exp|annual)/.test(b.key||'')&&v>0?'+':''))+Math.abs(v).toFixed(1)+'%';
  return v.toFixed(1);
}
function bmPeerTxt(b){
  var u = b.unit || '', m = b.peer_median;
  if(!num(m)) return '';
  if(u === 'x') return m.toFixed(1)+'×'; if(u === 'bps') return (m>0?'+':m<0?'−':'')+Math.abs(Math.round(m))+' bps';
  if(u === '%') return (m<0?'−':'')+Math.abs(m).toFixed(1)+'%'; return m.toFixed(1);
}
/* peer-range track: rng spans peers min..max, med tick at peer_median, me marker at company, all
   normalised to the row's own range (card rule 6). Missing peers → no track. */
function peerTrack(b){
  var ps = (b.peers||[]).map(function(x){ return x.value; }).filter(num);
  if(ps.length < 2 || !num(b.company)) return '';
  var lo = Math.min.apply(null, ps.concat([b.company])), hi = Math.max.apply(null, ps.concat([b.company]));
  if(hi === lo) return '';
  var pct = function(v){ return Math.max(0, Math.min(100, (v-lo)/(hi-lo)*100)).toFixed(0); };
  var plo = Math.min.apply(null, ps), phi = Math.max.apply(null, ps);
  return '<div class="g-peer"><i class="g-rng" style="left:'+pct(plo)+'%;width:'+(pct(phi)-pct(plo))+'%"></i>'+
         (num(b.peer_median)?'<i class="g-med" style="left:'+pct(b.peer_median)+'%"></i>':'')+'<i class="g-me" style="left:'+pct(b.company)+'%"></i></div>';
}
function bmRowHtml(b, opts){
  var sub = [];
  if(num(b.peer_median)) sub.push('peers '+bmPeerTxt(b));
  if(num(b.rank) && num(b.peer_n)) sub.push('rank '+b.rank+' of '+b.peer_n);
  if(opts && opts.sub) sub = [opts.sub].concat(num(b.rank) && num(b.peer_n) ? ['rank '+b.rank+' of '+b.peer_n] : []);
  var cls = (opts && opts.signed && num(b.company)) ? (b.company > 0 ? ' up' : b.company < 0 ? ' dn' : '') : '';
  return '<div class="g-bm"><div class="g-bk">'+esc((opts && opts.label) || plainLabel(b))+'</div><div class="g-bsub">'+esc(sub.join(' · ')||'no peer read')+'</div>'+

  var per = tbl.periods.slice(), idx = [], seen = {};
  for(var i=per.length-1;i>=0 && idx.length<maxCols;i--){ if(seen[per[i]]) continue; seen[per[i]] = 1; idx.unshift(i); }
  var rows = tbl.rows.filter(function(r){ return r.display !== false; });
  var picked = want ? want.map(function(w){ return rows.filter(function(r){ return w.test(r.label||''); })[0]; }).filter(Boolean) : rows;
  if(!picked.length) picked = rows.slice(0,4);
  var h = '<div class="g-ftw"><table class="g-ftbl"><thead><tr><th></th>'+idx.map(function(i){ return '<th>'+esc(fyLabel(per[i]))+'</th>'; }).join('')+'</tr></thead><tbody>';
  picked.forEach(function(r){
    h += '<tr><td>'+esc(String(r.label).replace(/^Cash from (\w+) Activity$/,'Cash from $1').replace(' in Rs',''))+'</td>'+idx.map(function(i){ var ttm = /TTM|Current/.test(per[i]); return '<td'+(ttm?' class="g-ttm"':'')+'>'+finCell(r.values[i], r.unit, r.label)+'</td>'; }).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function ratioLatest(r2, bucket, label){
  if(!r2 || !r2.buckets) return null;
  for(var i=0;i<r2.buckets.length;i++){ var b = r2.buckets[i]; if(b.title !== bucket) continue;
    var row = (b.table.rows||[]).filter(function(r){ return r.label === label; })[0]; if(!row) return null;
    for(var k=row.values.length-1;k>=0;k--) if(num(row.values[k])) return row.values[k]; }
  return null;
}
function secFinancials(d){
  var f = d.financials || {}, r2 = f.ratios_v2;
  var head = sectHead('financials','Financials',(f.basis?String(f.basis).toLowerCase():'')+' · ₹ Cr');
  if(!f.profit_loss && !f.balance_sheet && !f.cash_flow && !r2) return head+'<section class="slab"><div class="g-empty">No financial statements in this report.</div></section>';
  var seg = '<div class="g-seg" role="tablist">'+[['pl','P&amp;L'],['bs','Balance'],['cf','Cash'],['ra','Ratios']].map(function(t){ return '<button data-fin="'+t[0]+'"'+(t[0]===finView?' class="g-on"':'')+'>'+t[1]+'</button>'; }).join('')+'</div>';
  var body = '';
  if(finView === 'pl') body = finTable(f.profit_loss, [/^Sales$/, /^OPM/, /^Net Profit/, /^EPS/], 6) || '<div class="g-empty">No profit and loss table.</div>';
  else if(finView === 'bs') body = finTable(f.balance_sheet, [/^Reserves/, /^Borrowings/, /^Fixed Assets/, /^Total Assets/], 6) || '<div class="g-empty">No balance sheet.</div>';
  else if(finView === 'cf') body = finTable(f.cash_flow, [/Operating/, /Investing/, /Financing/, /^Free Cash/], 6) || '<div class="g-empty">No cash flow table.</div>';
  else {
    if(r2 && r2.buckets && r2.buckets.length){
      r2.buckets.forEach(function(b){ var t = finTable(b.table, null, 4); if(t) body += '<div class="g-fbk">'+esc(String(b.title).toUpperCase())+'</div>'+t; });
    } else body = '<div class="g-empty">No ratio table.</div>';
  }
  var de = ratioLatest(r2,'Solvency','Debt / Equity'), ic = ratioLatest(r2,'Solvency','Interest Coverage'), roce = ratioLatest(r2,'Profitability','ROCE %');
  var foot = '<div class="g-ffoot"><span>Debt / equity '+(num(de)?de.toFixed(2):'—')+' · interest cover '+(num(ic)?ic.toFixed(1)+'×':'—')+'</span><span>ROCE '+(num(roce)?Math.round(roce)+'%':'—')+'</span></div>';
  return head+'<section class="slab">'+seg+body+foot+'<div class="g-asof">'+(f.profit_loss && f.profit_loss.periods ? 'statements to '+esc(fyLabel(f.profit_loss.periods.filter(function(x){ return x!=='TTM'; }).slice(-1)[0]||''))+(f.profit_loss.periods.indexOf('TTM')>-1?' + TTM':'') : '')+'</div></section>';
}
function secFinancials_old(d){ var pl=(d.financials||{}).profit_loss, sales=lastVal(finRow(pl,'Sales')), np=lastVal(finRow(pl,'Net Profit')); return sectHead('financials','Financials',(d.financials&&d.financials.basis?String(d.financials.basis).toLowerCase():'')+' · ₹ Cr')+sumLine(['TTM sales <b>'+(num(sales)?Math.round(sales).toLocaleString('en-IN'):'—')+'</b>','profit <b>'+(num(np)?Math.round(np).toLocaleString('en-IN'):'—')+'</b>']); }
function secHolders(d){ var sh=(d.financials||{}).shareholding, per=sh&&sh.periods?sh.periods[sh.periods.length-1]:''; var pr=lastVal(finRow(sh,'Promoters')), fii=lastVal(finRow(sh,'FIIs')), dii=lastVal(finRow(sh,'DIIs'));
  return sectHead('holders','Holders',per)+sumLine(['Promoters <b>'+fx(pr,1)+'%</b>','FII <b>'+fx(fii,1)+'</b> · DII <b>'+fx(dii,1)+'</b>']); }
function secTape(d){ var ex=d.extras||{}, t1=ex.tier1||{}, vc=ex.vol_canon||{}; return sectHead('tape','Tape',(d.price_is_live?'live':'last close')+(ex.pivot&&ex.pivot.pivot_date?' · '+ex.pivot.pivot_date:''))+
  sumLine(['entry checks <b>'+(num(t1.passed)?t1.passed:'—')+' of '+(num(t1.total)?t1.total:'—')+'</b>','volume <b>'+esc(vc.vol_ad_label||'—')+'</b>']); }
function renderSections(d){ return secGrowth(d)+secValue(d)+secMomentum(d)+secPeers(d)+secResults(d)+secFinancials(d)+secHolders(d)+secTape(d); }
/* ── CAPSULE: active pill follows the scroll (IntersectionObserver), hash deep-links, hidden
   while a modal is open (the shared chart overlay #scorrChartOv). ───────────────────────── */
var capsule = document.getElementById('g-capsule'), caps = [].slice.call(capsule.querySelectorAll('.g-cap')), capIds = caps.map(function(a){ return a.getAttribute('href').slice(1); }), capObs = null;
var capLock = 0;
function setCap(id, lock){ caps.forEach(function(a){ a.classList.toggle('g-on', a.getAttribute('href') === '#'+id); }); if(lock) capLock = Date.now() + 800; }
function armCapsule(){
  capsule.hidden = false;
  if(capObs) capObs.disconnect();
  capObs = new IntersectionObserver(function(es){ if(Date.now() < capLock) return; es.forEach(function(e){ if(e.isIntersecting) setCap(e.target.id); }); }, {rootMargin:'-20% 0px -60% 0px'});
  capIds.forEach(function(id){ var el = document.getElementById(id); if(el) capObs.observe(el); });
  var h = (location.hash||'').slice(1);
  if(capIds.indexOf(h) > -1){ setCap(h, true); var t = document.getElementById(h); if(t) setTimeout(function(){ t.scrollIntoView({block:'start'}); }, 50); }
  else setCap(capIds[0]);
}
function disarmCapsule(){ capsule.hidden = true; if(capObs){ capObs.disconnect(); capObs = null; } }
window.addEventListener('hashchange', function(){ var h = (location.hash||'').slice(1); if(capIds.indexOf(h) > -1) setCap(h, true); });
var modalObs = null;
function watchModal(){
  var ov = document.getElementById('scorrChartOv'); if(!ov) return;
  var sync = function(){ if(!STATE.co) return; var open = ov.style.display && ov.style.display !== 'none'; capsule.hidden = open; };
  sync();
  if(!modalObs){ modalObs = new MutationObserver(sync); modalObs.observe(ov, {attributes:true, attributeFilter:['style']}); }
}
/* the strip component is a deferred site-wide script; fill it now if present, else once the window has loaded */
function fillStrip(){ var el = document.querySelector('#gvp .g-strip'); if(!el || el.firstChild || !STATE.co) return; if(window.ScorrCardStripHtml) el.innerHTML = window.ScorrCardStripHtml(STATE.co.symbol, ''); }
window.addEventListener('load', fillStrip);
function renderCompany(){
  var d = STATE.co;
  main.innerHTML = renderHero(d) + renderSections(d);
  fillStrip();
  armCapsule();
  foot.textContent = 'Scores rebuild nightly. Prices live.'+(num(d.peer_count)?' Peer set = same segment, '+d.peer_count+' companies.':'');
}
/* ── landing: no symbol yet → today's top 25 by GVM, tap to open ─────────────────────── */
function loadLanding(){
  STATE.sym = null; STATE.co = null; document.title = 'GVM'; qEl.value = ''; disarmCapsule();
  main.innerHTML = '<div class="slab g-empty">Loading today’s scores…</div>'; foot.textContent = '';
  getJ(URLS.list).then(function(d){
    if(STATE.sym) return;
    var rs = (d && d.results) || [];
    if(!rs.length){ fail('No GVM scores to show yet. Scores land after the 22:00 nightly run.', ''); return; }
    var h = '<div class="sect">Today’s top <span class="g-r">by GVM · '+esc(rs[0].as_of||'')+'</span></div><section class="slab">';
    for(var i=0;i<rs.length;i++){ var r = rs[i];
      h += '<div class="g-row" data-go="'+esc(r.symbol)+'"><span class="g-rk">'+(num(r.rank)?r.rank:i+1)+'</span><span class="g-sy">'+esc(r.symbol)+'</span>'+
           '<span class="g-nm">'+esc(r.name||'')+(r.segment?' · '+esc(r.segment):'')+'</span>'+
           '<span class="g-sc '+verdictCls(r.verdict)+'">'+fx(r.gvm,2)+'<small>'+esc(r.verdict||'')+'</small></span></div>';
    }
    h += '</section><div class="g-asof">'+(d.rail && d.rail.label ? esc(d.rail.label)+' · ' : '')+'scored nightly 22:00</div>';
    main.innerHTML = h;
    foot.textContent = 'Type any symbol or company name above to open its full GVM page.';
  }).catch(function(){ fail('Could not load today’s GVM list.', ''); });
}
/* ── clicks ──────────────────────────────────────────────────────────────────────────── */
document.getElementById('gvp').addEventListener('click', function(e){
  var g = e.target.closest('[data-go]'); if(g){ go(g.getAttribute('data-go')); return; }
  var r = e.target.closest('[data-retry]'); if(r){ var s = r.getAttribute('data-retry'); if(s) loadCompany(s); else loadLanding(); return; }
  var t = e.target.closest('[data-trend]'); if(t){ openChart(); return; }
  var fb = e.target.closest('[data-fin]'); if(fb){ finView = fb.getAttribute('data-fin'); var fh = document.getElementById('financials'); var fs = fh && fh.nextElementSibling; if(fs){ var tmp2 = document.createElement('div'); tmp2.innerHTML = secFinancials(STATE.co); fh.parentNode.replaceChild(tmp2.children[1], fs); } return; }
  var pt = e.target.closest('[data-peers-toggle]'); if(pt){ peersFull = !peersFull; var pe = document.getElementById('peers'); var sec = pe && pe.nextElementSibling; if(sec){ var tmp = document.createElement('div'); tmp.innerHTML = secPeers(STATE.co); pe.parentNode.replaceChild(tmp.children[1], sec); } }
});
/* ── boot ────────────────────────────────────────────────────────────────────────────── */
var s0 = symFromUrl();
if(s0) loadCompany(s0); else loadLanding();
})();
</script>
