<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ideas · Alerts</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<link rel="stylesheet" href="/static/scorr_themes.css">
<script src="/scorr_card_common.js"></script>
<style>
/* cc#1620 — APP_ALERTS_IDEAS_V1 (session_log 37072; design ref design_refs/scorr_mobile_alerts_R1.html).
   The Alerts tab as CURATED IDEAS: the approved book rendered as premium idea cards, one call to
   /api/alerts/ideas for every number on the screen. Classes namespaced ia- (the app has collided on
   short class names before). GOLD NIGHT tokens only; the tag / chip / slab / bnav grammar is the
   shared mobile_app.css. No engine or basket code anywhere on glass (founder 02-Sep 20:50): the
   origin tag is EXPERT HANDPICKED and the style tag is plain words — the payload already speaks
   that way, the page never rebuilds it. */
.ia-top{display:flex;align-items:flex-end;justify-content:space-between;padding:16px 14px 10px}
.ia-h1{font-family:var(--display,inherit);font-size:24px;font-weight:800;letter-spacing:.3px;line-height:1;color:var(--chalk,var(--txt))}
.ia-h1 small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--gold);margin-top:6px;text-transform:uppercase;white-space:nowrap;font-weight:600}
.ia-r{font-family:var(--mono);font-size:10px;color:var(--mute);text-align:right;line-height:1.5;white-space:nowrap}
.ia-pressed{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.ia-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.ia-stats>div{padding:6px 4px;text-align:center}
.ia-stats .k{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;color:var(--mute)}
.ia-stats .v{font-family:var(--mono);font-size:17px;font-weight:800;margin-top:2px;color:var(--chalk,var(--txt))}
.ia-hon{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center;line-height:1.5}
.ia-filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.ia-filters::-webkit-scrollbar{display:none}
.ia-chip{flex:none;font-family:var(--mono);font-size:11px;font-weight:700;padding:8px 11px;border:1px solid var(--line);background:var(--well);color:var(--mute);border-radius:0;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);cursor:pointer;min-height:36px}
.ia-chip.on{color:var(--gold);border-color:var(--gold);background:var(--gold-d)}
.ia-idea{margin-bottom:12px;padding:0;overflow:hidden;position:relative}
.ia-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 0}
.ia-sym{font-family:var(--display,inherit);font-size:22px;font-weight:800;line-height:1;letter-spacing:-.2px;color:var(--chalk,var(--txt))}
.ia-tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.ia-tag{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:2px 7px;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px);white-space:nowrap}
.ia-tag.up{background:var(--up-d);color:var(--up)}.ia-tag.dn{background:var(--down-d);color:var(--down)}
.ia-tag.gd{background:var(--gold-d);color:var(--gold)}.ia-tag.mu{background:var(--well);color:var(--mute);border:1px solid var(--line)}
.ia-appr{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:6px;line-height:1.5}
.ia-appr b{color:var(--chalk,var(--txt));font-weight:600}
.ia-live{text-align:right;flex:none}
.ia-rib{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:1.4px;padding:2px 8px;border-radius:4px;margin-bottom:4px;border:1px solid var(--line);color:var(--mute);background:var(--well)}
.ia-rib.live{background:var(--up-d);color:var(--up);border-color:var(--up)}
.ia-rib.pend{background:var(--amber-d);color:var(--amber);border-color:var(--amber)}
.ia-rib.done{background:var(--gold-d);color:var(--gold);border-color:var(--gold)}
.ia-live .l{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--dim)}
.ia-live .px{font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--chalk,var(--txt))}
.ia-live .ch{font-family:var(--mono);font-size:13px;font-weight:800}
.ia-live .ch.mu{color:var(--mute);font-weight:600}
.up{color:var(--up)}.dn{color:var(--down)}
.ia-body{padding:10px 16px 14px}
.ia-foot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--dim);margin:8px 0 14px;line-height:1.5}
.ia-sect{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-family:var(--display,inherit);font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.ia-sect::after{content:"";flex:1;height:1px;background:var(--line)}
.ia-sect .r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:0;font-weight:600}
.ia-err{padding:10px 16px 0;font-family:var(--mono);font-size:10.5px;color:var(--down);line-height:1.5}
/* P4: plan tiles, the stop -> target track, footer */
.ia-plan{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ia-plan>div{padding:7px 8px;background:var(--well);border:1px solid var(--line);border-radius:7px;min-width:0}
.ia-plan .k{font-family:var(--mono);font-size:9px;letter-spacing:1.3px;color:var(--mute)}
.ia-plan .v{font-family:var(--mono);font-size:13.5px;font-weight:800;margin-top:1px;color:var(--chalk,var(--txt))}
.ia-plan .v.mu{color:var(--mute)}
.ia-trk{position:relative;height:7px;margin:12px 0 0;background:var(--well);border:1px solid var(--line)}
.ia-trk .fill{position:absolute;top:0;bottom:0;left:0;display:block}
.ia-trk.long .fill{background:var(--up)}.ia-trk.short .fill{background:var(--down)}
.ia-trk .z{position:absolute;top:-4px;width:1px;height:13px;background:var(--dim);display:block}
.ia-trk .cmp{position:absolute;top:-4px;width:2px;height:13px;background:var(--gold);box-shadow:0 0 6px var(--gold);display:block}
.ia-trk .lab{position:absolute;top:10px;font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap}
.ia-ft{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding-top:24px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.ia-ft.tight{padding-top:10px}
.ia-ft b{color:var(--mute);font-weight:600}
/* cc#1507 — create-alert flow. All classes namespaced al- (this app has collided four times on
   short class names — the intel.html nc- lesson). The sheet is home.html's .pfveil/.pfsheet
   shape (veil z-80, bottom sheet z-81, grab handle), re-declared here because those classes are
   page-local CSS, not shared. The + button: the app has NO existing floating-action convention
   (checked before inventing — closest is the chip/sheet grammar), so a chat-style compose
   button pinned above the bar is used, sized 52px against the 44px tap floor. */
.al-fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:70;
  width:52px;height:52px;border-radius:50%;border:var(--bw-1) solid var(--line2);cursor:pointer;
  background:var(--panel,#161F33);color:var(--txt,#E9EEFB);font-size:26px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.al-veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
.al-sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;z-index:81;
  background:var(--panel,#161F33);border-top:var(--bw-1) solid var(--line);
  border-radius:var(--radius-18,18px) var(--radius-18,18px) 0 0}
.al-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 6px;flex-shrink:0}
.al-sb{overflow-y:auto;padding:4px 16px calc(22px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.al-sh{font-size:var(--type-14);font-weight:800;letter-spacing:var(--track-em15);text-transform:uppercase;
  color:var(--txt,#E9EEFB);margin-bottom:10px}
.al-lb{font-size:var(--type-10);font-weight:700;letter-spacing:1px;color:var(--dim,#8A97B0);
  text-transform:uppercase;margin:12px 0 6px}
.al-in{width:100%;min-height:44px;border-radius:10px;border:var(--bw-1) solid var(--line2);
  background:var(--bg,#0A0F1E);color:var(--txt,#E9EEFB);font-family:inherit;font-size:var(--type-13);
  padding:10px 12px;box-sizing:border-box}
.al-res{border:var(--bw-1) solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.al-ri{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:11px 12px;
  border-bottom:var(--bw-1) solid var(--line);cursor:pointer;min-height:44px;box-sizing:border-box}
.al-ri:last-child{border-bottom:none}
.al-ri b{font-size:var(--type-125);color:var(--txt,#E9EEFB)}
.al-ri span{font-size:var(--type-10);color:var(--dim,#8A97B0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al-tg{display:flex;gap:8px}
.al-tg .chip{flex:1;justify-content:center;text-align:center;min-height:44px}
.al-err2{margin-top:10px;font-size:var(--type-115);color:var(--heat,#FF4D6D);line-height:1.5}
.al-go{width:100%;min-height:48px;margin-top:16px;border-radius:12px;border:var(--bw-1) solid var(--line2);
  background:var(--txt,#E9EEFB);color:var(--bg,#0A0F1E);font-weight:800;font-size:var(--type-13);
  font-family:inherit;cursor:pointer}
.al-go[disabled]{opacity:.5}
</style>
</head>
<body>
<!--
  cc#1620 — IDEAS (APP_ALERTS_IDEAS_V1, session_log 37072). The Alerts tab is the APPROVED BOOK
  (WOT_APPROVAL_SURFACE_V1 36394) shown as curated idea cards. Newest first (36394): the cc#1506
  chat order retires on this view. The manual price-alert create flow (cc#1507, the + button and
  its sheet) is kept as-is below — 34521 says alerts are set from here.

  Pushes: P3 skeleton + header strip + filters (this one) · P4 idea cards · P5 waiting cards +
  actions · P6 sparkline + why lines · P7 theme check + screenshot.
-->
<div class="screen">

  <div class="ia-top">
    <div class="ia-h1">Ideas<small>Curated · Equity &amp; Futures</small></div>
    <div class="ia-r" id="ia-r">loading…</div>
  </div>

  <div class="body">
    <section class="ia-pressed" id="ia-stats"></section>
    <div class="ia-filters" id="ia-filters"></div>
    <div id="ia-list"><div class="loading">Loading ideas…</div></div>
    <div class="ia-foot" id="ia-foot"></div>
  </div>
</div>

<button class="al-fab" id="alFab" aria-label="New alert" onclick="alOpen()">＋</button>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
var IA = { data:null, err:null, filter:'all', busy:{} };
var IA_URL = '/api/alerts/ideas';
var FILTERS = [ {k:'all', l:'All'}, {k:'live', l:'Live'}, {k:'waiting', l:'Waiting'}, {k:'closed', l:'Closed'}, {k:'long', l:'Long'}, {k:'short', l:'Short'} ];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmtPx(v){ return v == null ? '—' : Number(v).toLocaleString('en-IN', {maximumFractionDigits: 2}); }
function pctS(v, d){ if (v == null || isNaN(Number(v))) return '—'; var x = Number(v); return (x > 0 ? '+' : (x < 0 ? '−' : '')) + Math.abs(x).toFixed(d == null ? 2 : d) + '%'; }
function pctCls(v){ return v == null ? 'mu' : (v > 0 ? 'up' : (v < 0 ? 'dn' : 'mu')); }

/* ── header strip: counts + as-of on the right, LIVE · WINNING · AVG SINCE · BEST from the
   payload's stats (computed server-side on live cards), the honesty line under it ─────────── */
function renderTop(){
  var d = IA.data, c = (d && d.counts) || {}, s = (d && d.stats) || {};
  $('ia-r').innerHTML = d
    ? esc((c.all || 0) + ' ideas · ' + (c.live || 0) + ' live · ' + (c.waiting || 0) + ' waiting') + '<br>' + esc('as of ' + (d.as_of_ist || '—') + (d.price_basis === 'CLOSE' ? ' · last close' : ''))
    : (IA.err ? 'could not load' : 'loading…');
  $('ia-stats').innerHTML = '<div class="ia-stats">'
    + '<div><div class="k">LIVE</div><div class="v">' + (s.live != null ? s.live : '—') + '</div></div>'
    + '<div><div class="k">WINNING</div><div class="v ' + (s.winning ? 'up' : '') + '">' + (s.winning != null ? s.winning : '—') + '</div></div>'
    + '<div><div class="k">AVG SINCE</div><div class="v ' + pctCls(s.avg_since_pct) + '">' + pctS(s.avg_since_pct, 1) + '</div></div>'
    + '<div><div class="k">BEST</div><div class="v ' + pctCls(s.best_pct) + '">' + pctS(s.best_pct, 1) + '</div></div>'
    + '</div><div class="ia-hon">' + esc((d && d.honesty) || 'Every idea here was handpicked and approved by hand. Prices and P&L are live since approval.') + '</div>';
  $('ia-foot').textContent = 'Ideas are the approved book. Prices live. Nothing lands here before it is approved by hand.';
}

function renderFilters(){
  var c = (IA.data && IA.data.counts) || {};
  $('ia-filters').innerHTML = FILTERS.map(function(f){
    var n = c[f.k]; return '<button type="button" class="ia-chip' + (IA.filter === f.k ? ' on' : '') + '" data-f="' + f.k + '">' + f.l + (n != null ? ' ' + n : '') + '</button>';
  }).join('');
}

function matches(c){
  var f = IA.filter;
  if (f === 'all') return true;
  if (f === 'long') return c.direction === 'BUY';
  if (f === 'short') return c.direction === 'SELL';
  return c.status === f;
}

/* P3 card: identity + live block. Plan tiles, track and footer land in P4; waiting actions in
   P5; sparkline + why in P6. */
function cardHead(c){
  var w = c.status === 'waiting', done = c.status === 'closed';
  var appr = w
    ? ((c.triggered ? 'triggered <b>' + esc(c.triggered_at_ist || '') + '</b> · ' : 'set <b>' + esc(c.set_at_ist || '') + '</b> · ') + 'triggers ' + (c.trigger_condition === 'ABOVE' ? '≥' : '≤') + ' <b>' + fmtPx(c.trigger_price) + '</b>')
    : ('approved <b>' + esc(c.approved_at_ist || '—') + '</b> @ <b>' + fmtPx(c.approved_price) + '</b>' + (c.via ? ' · via ' + esc(c.via) : ''));
  var rib = w ? '<div class="ia-rib pend">WAITING</div>' : (done ? '<div class="ia-rib done">CLOSED</div>' : '<div class="ia-rib live">LIVE</div>');
  var px = done ? (c.closed && c.closed.price) : c.cmp;
  var ch = w
    ? '<div class="ia-live"><div class="l">NOW</div><div class="px">' + fmtPx(c.cmp) + '</div><div class="ch mu">' + (c.distance_pct != null ? Math.abs(c.distance_pct).toFixed(1) + '% away' : '—') + '</div></div>'
    : '<div class="ia-live"><div class="l">' + (done ? 'CLOSED' : (c.cmp_live === false ? 'LAST' : 'NOW')) + '</div><div class="px">' + fmtPx(px) + '</div><div class="ch ' + pctCls(c.since_pct) + '">' + pctS(c.since_pct) + '</div></div>';
  return '<div class="ia-hd"><div><div class="ia-sym">' + esc(c.symbol) + '</div>'
    + '<div class="ia-tags"><span class="ia-tag ' + (c.direction === 'BUY' ? 'up' : 'dn') + '">' + esc(c.side) + '</span>'
    + '<span class="ia-tag gd">' + esc(c.origin_tag || 'EXPERT HANDPICKED') + '</span>'
    + (c.style ? '<span class="ia-tag mu">' + esc(c.style) + '</span>' : '')
    + '<span class="ia-tag mu">' + esc(c.instrument || 'EQ') + '</span></div>'
    + '<div class="ia-appr">' + appr + '</div></div>'
    + '<div>' + rib + ch + '</div></div>';
}
/* P4: the plan. Engine ideas: TARGET · STOP · TO TARGET (FINAL on a closed card) tiles and the
   stop -> target track — stop on the left, target on the right for BOTH sides (the payload's
   track positions are already on that axis), the fill grows toward the target, a thin mark at
   entry, the gold mark at the current (or closing) price. Manual ideas: TRIGGER · FROM TRIGGER ·
   NOTE — the trigger is the plan, there is no engine target to draw. Footer: held · expiry (FUT) /
   cash equity · R:R at entry, or closed at + the close word. */
function noteShort(n){ n = String(n || '').replace(/^cc#\d+[^:]*:\s*/, ''); return n ? (n.length > 26 ? n.slice(0, 24) + '…' : n) : '—'; }
function track(c){
  var t = c.track || {}, fill = t.price_pos == null ? 0 : t.price_pos;
  return '<div class="ia-trk ' + (c.direction === 'BUY' ? 'long' : 'short') + '"><i class="fill" style="width:' + fill + '%"></i>'
    + (t.entry_pos != null ? '<i class="z" style="left:' + t.entry_pos + '%"></i>' : '')
    + (t.price_pos != null ? '<i class="cmp" style="left:' + t.price_pos + '%"></i>' : '')
    + '<span class="lab" style="left:0">stop ' + fmtPx(c.stop) + '</span><span class="lab" style="right:0">target ' + fmtPx(c.target) + '</span></div>';
}
function foot(c, tight){
  var p = ['held <b>' + esc(c.held || '—') + '</b>'];
  if (c.status === 'closed' && c.closed) p.push('closed <b>' + esc(c.closed.at_ist || '—') + '</b>' + (c.closed.reason ? ' · ' + esc(c.closed.reason) : ''));
  else if (c.instrument === 'FUT' && c.expiry) p.push(esc(c.expiry.label) + ' · <b>' + (c.expiry.days != null ? c.expiry.days + ' days' : '—') + '</b>');
  else if (c.instrument === 'OPT') p.push('option leg');
  else p.push('cash equity');
  if (c.rr_at_entry != null) p.push('R:R at entry <b>' + Number(c.rr_at_entry).toFixed(1) + '</b>');
  else if (c.style === 'Price level') p.push('handpicked · founder');
  return '<div class="ia-ft' + (tight ? ' tight' : '') + '">' + p.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>';
}
function cardBody(c){
  if (c.status === 'waiting') return '<div class="ia-body"></div>';   /* P5 */
  var h = '', done = c.status === 'closed';
  if (c.target != null && c.stop != null){
    h += '<div class="ia-plan"><div><div class="k">TARGET</div><div class="v up">' + fmtPx(c.target) + '</div></div>'
      + '<div><div class="k">STOP</div><div class="v dn">' + fmtPx(c.stop) + '</div></div>'
      + (done
          ? '<div><div class="k">FINAL</div><div class="v ' + pctCls(c.closed && c.closed.final_pct) + '">' + pctS(c.closed && c.closed.final_pct) + '</div></div>'
          : '<div><div class="k">TO TARGET</div><div class="v">' + (c.to_target_pct == null ? '—' : Number(c.to_target_pct).toFixed(1) + '%') + '</div></div>')
      + '</div>';
    if (c.track) h += track(c);
    h += foot(c, !c.track);
  } else if (c.trigger_price != null){
    h += '<div class="ia-plan"><div><div class="k">TRIGGER</div><div class="v">' + (c.trigger_condition === 'ABOVE' ? '≥ ' : '≤ ') + fmtPx(c.trigger_price) + '</div></div>'
      + '<div><div class="k">FROM TRIGGER</div><div class="v ' + pctCls(c.from_trigger_pct) + '">' + pctS(c.from_trigger_pct, 1) + '</div></div>'
      + '<div><div class="k">NOTE</div><div class="v mu" style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + esc(c.notes || '') + '">' + esc(noteShort(c.notes)) + '</div></div></div>';
    h += foot(c, true);
  } else {
    h += foot(c, true);
  }
  return '<div class="ia-body">' + h + '</div>';
}
function card(c){
  return '<article class="slab ia-idea" id="ia-' + c.id + '" data-status="' + esc(c.status) + '">' + cardHead(c) + cardBody(c) + '</article>';
}

function renderList(){
  var d = IA.data;
  if (!d){
    $('ia-list').innerHTML = IA.err
      ? '<div class="empty"><b>Could not load ideas</b>' + esc(IA.err) + '<div style="margin-top:12px"><button class="chip" onclick="load()">Retry</button></div></div>'
      : '<div class="loading">Loading ideas…</div>';
    return;
  }
  var all = (d.ideas || []).filter(matches);
  var main = all.filter(function(c){ return c.status !== 'waiting'; });
  var wait = all.filter(function(c){ return c.status === 'waiting'; });
  var h = main.map(card).join('');
  if (wait.length) h += '<div class="ia-sect">Waiting for price <span class="r">' + wait.length + (wait.length === 1 ? ' idea' : ' ideas') + '</span></div>' + wait.map(card).join('');
  if (!all.length) h = '<div class="empty"><b>' + (IA.filter === 'all' ? 'No ideas yet' : 'Nothing under ' + esc(FILTERS.filter(function(f){ return f.k === IA.filter; })[0].l)) + '</b>' + (IA.filter === 'all' ? 'An idea lands here once it is approved by hand.' : 'Try another filter.') + '</div>';
  $('ia-list').innerHTML = h;
}

function render(){ renderTop(); renderFilters(); renderList(); }

function load(){
  fetchWithTimeout(IA_URL).then(function(r){ return r.json(); }).then(function(d){
    if (!d || d.error) throw new Error((d && d.error) || 'empty reply');
    IA.data = d; IA.err = null; render();
  }).catch(function(e){ IA.err = e.message || 'load failed'; if (!IA.data) render(); else $('ia-r').textContent = 'refresh failed · showing ' + (IA.data.as_of_ist || 'earlier'); });
}
$('ia-filters').addEventListener('click', function(e){
  var b = e.target.closest('[data-f]'); if (!b) return;
  IA.filter = b.getAttribute('data-f'); renderFilters(); renderList();
});
render();
load();
/* the trigger sweep runs every 5 minutes (cc#1504); prices refresh on the same cadence, in place */
setInterval(load, 300000);

/* ══ cc#1507 · CREATE-ALERT FLOW ═══════════════════════════════════════════════════════════
   Symbol search reuses /api/gvm/search — the app's ONE autocomplete (GVM page pattern, symbol
   or company name, ~1,800-name universe), never a new search built here. The server stays the
   validator of record: an unresolvable symbol is rejected by /api/alerts/create with the real
   reason, which is shown VERBATIM — the form never pre-blocks what the server would allow. */
var FORM = { sym: null, dir: 'BUY', cond: 'ABOVE', busy: false };

function alOpen(){
  FORM = { sym: null, dir: 'BUY', cond: 'ABOVE', busy: false };
  var el = document.createElement('div');
  el.id = 'alWrap';
  el.innerHTML =
    '<div class="al-veil" onclick="alClose()"></div>' +
    '<div class="al-sheet"><div class="al-grab"></div><div class="al-sb">' +
      '<div class="al-sh">New alert</div>' +
      '<div class="al-lb">Symbol</div>' +
      '<input class="al-in" id="alQ" type="search" placeholder="Search any stock — RELIANCE, TCS, LODHA…" autocomplete="off">' +
      '<div id="alRes"></div>' +
      '<div class="al-lb">Direction</div>' +
      '<div class="al-tg" id="alDir">' +
        '<button class="chip on" data-v="BUY" onclick="alPick(\'dir\',\'BUY\')">BUY</button>' +
        '<button class="chip" data-v="SELL" onclick="alPick(\'dir\',\'SELL\')">SELL</button></div>' +
      '<div class="al-lb">Trigger</div>' +
      '<div class="al-tg" id="alCond">' +
        '<button class="chip on" data-v="ABOVE" onclick="alPick(\'cond\',\'ABOVE\')">crosses ABOVE</button>' +
        '<button class="chip" data-v="BELOW" onclick="alPick(\'cond\',\'BELOW\')">crosses BELOW</button></div>' +
      '<div class="al-lb">Trigger price</div>' +
      '<input class="al-in" id="alPx" type="number" inputmode="decimal" step="0.05" min="0" placeholder="0.00">' +
      '<div class="al-lb">Notes (optional)</div>' +
      '<input class="al-in" id="alNotes" type="text" maxlength="200" placeholder="why this level…">' +
      '<div class="al-err2" id="alErr" style="display:none"></div>' +
      '<button class="al-go" id="alGo" onclick="alSubmit()">Create alert</button>' +
    '</div></div>';
  document.body.appendChild(el);
  var t2 = null;
  document.getElementById('alQ').addEventListener('input', function(e){
    clearTimeout(t2);
    FORM.sym = null;   /* typing invalidates the previous pick — no stale symbol under new text */
    var v = e.target.value.trim();
    t2 = setTimeout(function(){ alSearch(v); }, 300);
  });
  document.getElementById('alQ').focus();
}
function alClose(){ var w = document.getElementById('alWrap'); if (w) w.remove(); }

function alSearch(q){
  var box = document.getElementById('alRes');
  if (!box) return;
  if (!q){ box.innerHTML = ''; return; }
  fetchWithTimeout('/api/gvm/search?q=' + encodeURIComponent(q) + '&limit=8')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var res = d.results || [];
      var b2 = document.getElementById('alRes'); if (!b2) return;
      b2.innerHTML = res.length
        ? '<div class="al-res">' + res.map(function(x){
            return '<div class="al-ri" onclick="alSym(\'' + esc(x.symbol).replace(/'/g, "\\'") + '\')">' +
              '<b>' + esc(x.symbol) + '</b><span>' + esc(x.company_name || '') + '</span></div>';
          }).join('') + '</div>'
        : '<div class="al-res"><div class="al-ri"><span>No match — the server still decides, you can submit the typed symbol.</span></div></div>';
    })
    .catch(function(){ /* search is a convenience; the create call validates for real */ });
}
function alSym(s){
  FORM.sym = s;
  var q = document.getElementById('alQ'); if (q) q.value = s;
  var box = document.getElementById('alRes'); if (box) box.innerHTML = '';
}
function alPick(k, v){
  FORM[k === 'dir' ? 'dir' : 'cond'] = v;
  var host = document.getElementById(k === 'dir' ? 'alDir' : 'alCond');
  if (host) Array.prototype.forEach.call(host.querySelectorAll('.chip'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v') === v);
  });
}
function alSubmit(){
  if (FORM.busy) return;
  var err = document.getElementById('alErr'), go = document.getElementById('alGo');
  var sym = FORM.sym || (document.getElementById('alQ').value || '').trim().toUpperCase();
  var px = parseFloat(document.getElementById('alPx').value);
  function fail(msg){ err.style.display = ''; err.textContent = msg; }
  err.style.display = 'none';
  if (!sym) return fail('Pick or type a symbol first.');
  if (!(px > 0)) return fail('Trigger price must be a positive number.');
  FORM.busy = true; go.disabled = true; go.textContent = 'Creating…';
  fetchWithTimeout('/api/alerts/create', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol: sym, direction: FORM.dir, trigger_condition: FORM.cond,
                             trigger_price: px, notes: (document.getElementById('alNotes').value || '').trim() || null }) })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(x){
      if (!x.ok) throw new Error((x.d && x.d.detail) || 'create failed');
      alClose();
      /* the new pending card belongs at the bottom of the chat — reload and go there */
      load();
    })
    .catch(function(e){
      FORM.busy = false; go.disabled = false; go.textContent = 'Create alert';
      /* the SERVER's reason verbatim (e.g. "XYZ does not resolve to any price…") — an honest
         rejection, never a generic error */
      fail(e.message);
    });
}
</script>
</body>
