<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screeners · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<script src="/static/scorr_appshell.js" defer></script>

<script src="/scorr_card_strip.js"></script>
<script src="/scorr_chart_card.js"></script>

</head>
<body data-theme="goldnight">
<!-- cc#1645 P3: before-paint theme boot, byte-copy of mobile/home.html's (cc#1644 whitelist + remap).
     screeners.html previously had no scorr_themes.css link at all. -->
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){/* cc#1119 lifted the gate for the two DARK themes; cc#1636 (founder 02-Sep) lifts it for all
     four token sets in scorr_themes.css - goldnight, dark, aquawhite, goldday - the same ALLOWED set
     the resolver and the logo-menu switcher use, so a saved choice paints before first paint. */}}catch(e){}
var __r1644=({goldday:'aquawhite',rosenight:'blush',rosewall:'blush'})[t];if(__r1644){t=__r1644;try{localStorage.setItem('scorr_theme',t);}catch(e){}}document.body.setAttribute('data-theme',(t==='goldnight'||t==='dark'||t==='aquawhite'||t==='blush'||t==='ainight')?t:'goldnight');
try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;}catch(e){}})();</script>
<!-- cc#1645 P3: shared appshell header (VARIANT B). Existing .head strip below is untouched. -->
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">Screeners</span></div><div class="as-slot"></div></div>
<div class="screen">
  <div class="head as-hide"><h1>Screeners</h1><div class="s" id="sub">7 ready-made screens · refreshed nightly</div></div>
  <div class="chips" id="chips"></div>
  <div class="body" id="body"><div class="loading">Loading screens…</div></div>
  <div class="cover" id="cover"></div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
var STATE={list:[],cur:null};
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(v,dp){ if(v==null||isNaN(Number(v)))return null;
  var x=Number(v); return dp==null?(Math.abs(x)>=100?Math.round(x).toLocaleString('en-IN'):x.toFixed(1)):x.toFixed(dp); }
function cls(v){ return v==null?'':(Number(v)>=0?'pos':'neg'); }
function arr(d){ return d.screeners||d.presets||d.screens||(Array.isArray(d)?d:[]); }
function rowsOf(d){ return d.rows||d.results||d.members||d.stocks||(Array.isArray(d)?d:[]); }
function strip(sym){
  try { if (window.ScorrCardRow) return window.ScorrCardRow(sym); } catch(e) {}
  return '';
}
var CORE={symbol:1,name:1,company_name:1,cmp:1,price:1,day_pct:1,day_1d:1,chg_pct:1,id:1,screen_id:1};
function stockCard(r,labels){
  var sym=r.symbol||r.ticker||'--';
  var cmp=r.cmp!=null?r.cmp:r.price;
  var day=r.day_pct!=null?r.day_pct:(r.day_1d!=null?r.day_1d:r.chg_pct);
  var kvs='';
  Object.keys(r).forEach(function(k){
    if (CORE[k]) return;
    var v=r[k];
    if (v==null||typeof v==='object') return;
    var shown=(typeof v==='number')?num(v):(String(v).length<=14?esc(String(v)):null);
    if (shown==null) return;
    kvs+='<div class="kv2">'+esc((labels&&labels[k])||k.replace(/_/g,' '))+' <b>'+shown+'</b></div>';
  });
  /* cc#1090 P7 dense sweep: v13_screen_results holds 3 to 152 rows per screen, five of the
     seven screens over the 8-row line. */
  return '<div class="c slab dense"><div class="sc-srow"><span class="sy">'+esc(sym)+'</span>'
    + strip(sym)
    + (cmp!=null?'<span class="px2">'+num(cmp)+'</span>':'')
    + (day!=null?'<span class="dd '+cls(day)+'">'+(day>=0?'+':'')+num(day,2)+'%</span>':'')
    + '</div>'
    + (kvs?'<div class="kvs">'+kvs+'</div>':'')
    + '</div>';
}
function renderChips(){
  document.getElementById('chips').innerHTML = STATE.list.map(function(s,i){
    var n=s.count!=null?s.count:(s.members!=null?s.members:s.n);
    return '<button class="chip'+(STATE.cur===i?' on':'')+'" onclick="pick('+i+')">'
      + esc(s.name||s.title||('Screen '+(i+1)))
      + (n!=null?' <span class="n">'+n+'</span>':'')+'</button>';
  }).join('');
}
function pick(i){
  STATE.cur=i; renderChips();
  var s=STATE.list[i];
  var id=s.id!=null?s.id:s.screen_id;
  document.getElementById('body').innerHTML='<div class="loading">Loading '+esc(s.name||'screen')+'…</div>';
  fetchWithTimeout('/api/screeners/'+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(d){
    if (d.error) throw new Error(d.error);
    var rows=rowsOf(d), labels=d.labels||d.field_labels||null;
    var never=(rows.length===0)&&(s.last_run==null&&d.last_run==null);
    document.getElementById('body').innerHTML = rows.length
      ? rows.map(function(r){return stockCard(r,labels);}).join('')
      : '<div class="empty"><b>'+(never?'Never run yet':'No stocks qualify today')+'</b>'
        + (never?'This screen has not produced a run yet — honest empty, not an error.'
                :'The filter found nothing in the latest run.')+'</div>';
    document.getElementById('cover').textContent = rows.length?('showing '+rows.length+' stocks'):'';
  }).catch(function(e){
    document.getElementById('body').innerHTML='<div class="empty"><b>Could not load</b>'+esc(e.message)+'</div>';
  });
}
fetchWithTimeout('/api/screeners').then(function(r){return r.json();}).then(function(d){
  if (d.error) throw new Error(d.error);
  STATE.list=arr(d);
  if (!STATE.list.length){
    document.getElementById('body').innerHTML='<div class="empty"><b>No screens found</b></div>'; return;
  }
  pick(0);
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load screeners</b>'+esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
});
</script>
</body>
</html>
