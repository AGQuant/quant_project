.sc-asof{padding:var(--space-10) var(--space-14) 0;font-size:var(--type-10);color:var(--dim)}
.sc-km{margin:var(--space-10) var(--space-12) 0;background:var(--panel);border:var(--bw-1) solid var(--line);
 border-left:var(--bw-3) solid var(--blu);border-radius:0 var(--radius-12) var(--radius-12) 0;padding:var(--space-14) var(--space-14)}
.sc-k{font-size:var(--type-10);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:var(--track-em12)}

.sc-kg{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-9);margin-top:var(--space-12)}
.sc-cell{background:var(--panel2);border:var(--bw-1) solid var(--line);border-radius:var(--radius-10);padding:var(--space-9) var(--space-10)}
.sc-cell .sc-k{font-size:var(--type-9)}
.sc-cell .sc-v{font-size:var(--type-14);margin-top:var(--space-3)}
.sc-slab{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-18) var(--space-14) var(--space-7)}
.sc-slab h2{font-size:var(--type-11);font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:var(--track-em12)}
.sc-slab .hint{font-size:var(--type-10);color:var(--dim)}
.sc-rail{display:flex;gap:var(--space-11);overflow-x:auto;scroll-snap-type:x mandatory;padding:var(--space-2) var(--space-14) var(--space-4);
 scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sc-rail::-webkit-scrollbar{display:none}
.sc-c{flex:0 0 78vw;max-width:320px;scroll-snap-align:start;background:var(--panel);border:var(--bw-1) solid var(--line);
 border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);position:relative}
.sc-c.gap{border-style:dashed}
.sc-ch{display:flex;align-items:baseline;justify-content:space-between}
.sc-ch .t{font-size:var(--type-11);font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:var(--track-em8)}
.sc-ch .n{font-size:var(--type-11);color:var(--mut)}
.sc-lst{margin-top:var(--space-9)}
.sc-lr{display:flex;align-items:center;justify-content:space-between;padding:var(--space-7) 0;border-bottom:var(--bw-1) solid var(--panel2)}
.sc-lr:last-child{border-bottom:none}
.sc-lr .s{font-size:var(--type-125);font-weight:800}
.sc-lr .r{display:flex;gap:var(--space-11);align-items:baseline}
.sc-lr .a{font-size:var(--type-115);color:var(--mut)}
.sc-lr .b{font-size:var(--type-125);font-weight:700;font-family:'IBM Plex Mono',ui-monospace,monospace}
.sc-more{font-size:var(--type-11);color:var(--dim);padding:var(--space-7) 0 0}
.sc-link{display:block;margin-top:var(--space-9);padding-top:var(--space-9);border-top:var(--bw-1) solid var(--line);
 font-size:var(--type-115);font-weight:700;color:var(--blu);text-decoration:none}
.sc-emp{font-size:var(--type-115);color:var(--dim);line-height:1.6;margin-top:var(--space-7)}
.sc-emp b{display:block;color:var(--txt);font-size:var(--type-125);font-weight:700;margin-bottom:var(--space-5)}
.sc-note{margin:var(--space-22) var(--space-14) var(--space-8);padding:var(--space-12) var(--space-14);
 border:var(--bw-1) dashed var(--line);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--dim);line-height:1.65}
.sc-note b{color:var(--mut)}
.sc-empty{padding:var(--space-14);color:var(--dim);font-size:var(--type-12);text-align:center}
.sc-err{margin:var(--space-14)}

<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmd(ds){ if(!ds) return '—'; var p=String(ds).slice(0,10).split('-');
  if(p.length!==3) return String(ds); var m=parseInt(p[1],10)-1;
  return parseInt(p[2],10)+' '+(MON[m]||p[1]); }

function kmHtml(k){
  return '<div class="sc-km"><div class="sc-k">Screens live</div><div class="sc-v">'+(k.screens_live!=null?k.screens_live:'—')+'</div>'
    + '<div class="sc-kg">'
    + '<div class="sc-cell"><div class="sc-k">Names surfaced</div><div class="sc-v">'+(k.names_surfaced!=null?k.names_surfaced:'—')+'</div></div>'
    + '<div class="sc-cell"><div class="sc-k">Last run</div><div class="sc-v">'+dmd(k.last_run)+'</div></div>'
    + '<div class="sc-cell"><div class="sc-k">Stale screens</div><div class="sc-v">'+(k.stale_screens!=null?k.stale_screens:'—')+'</div></div>'
    + '<div class="sc-cell"><div class="sc-k">Saved screens</div><div class="sc-v">'+(k.saved_screens!=null?k.saved_screens:'—')+'</div></div>'
    + '</div></div>';
}
function screensCardHtml(d){
  var rr=d.ready_screens, rows=rr.rows||[];
  if(!rows.length) return '<div class="sc-c gap"><div class="sc-ch"><span class="t">Screens</span><span class="n">0</span></div>'
    + '<div class="sc-emp"><b>No screens found</b>The registry has no global screen on record right now.</div></div>';
  var lst = rows.map(function(r){
    return '<div class="sc-lr"><span class="s">'+esc(r.name)+'</span><div class="r">'
      + '<span class="a">ran '+dmd(r.last_run)+'</span><span class="b">'+(r.members!=null?r.members:'—')+'</span></div></div>';
  }).join('');
  var more = rr.more>0 ? '<div class="sc-more">+'+rr.more+' more</div>' : '';
  var note = rr.message ? '<div class="sc-more">'+esc(rr.message)+' Each screen is shown as of its own run date, never as today.</div>' : '';
  return '<div class="sc-c"><div class="sc-ch"><span class="t">Screens</span><span class="n">'+rr.count+' live</span></div>'
    + '<div class="sc-lst">'+lst+'</div>'+more+note+'</div>';
}
function todayCardHtml(d){
  var t=d.today, rows=t.rows||[];
  if(!rows.length) return '<div class="sc-c gap"><div class="sc-ch"><span class="t">What came up today</span><span class="n">0</span></div>'
    + '<div class="sc-emp"><b>Nothing new yet</b>No screen has surfaced a fresh name on its most recent run.</div></div>';
  var lst = rows.map(function(r){
    return '<div class="sc-lr"><span class="s">'+esc(r.symbol)+'</span><div class="r"><span class="a">'+esc(r.screen_name)+'</span></div></div>';
  }).join('');
  return '<div class="sc-c"><div class="sc-ch"><span class="t">What came up today</span><span class="n">'+rows.length+' named</span></div>'
    + '<div class="sc-lst">'+lst+'</div>'
    + '<div class="sc-more">'+(t.rows_stored_total!=null?t.rows_stored_total:'—')+' screen rows stored in all.</div></div>';
}
function builderCardHtml(d){
  var c=d.custom_builder||{};
  return '<div class="sc-c"><div class="sc-ch"><span class="t">Custom screen builder</span><span class="n">open</span></div>'
    + '<div class="sc-emp" style="margin-top:0">'+esc(c.message||'')+'</div>'
    + (c.footnote?'<div class="sc-more">'+esc(c.footnote)+'</div>':'')+'</div>';
}
function savedCardHtml(d){
  var s=d.saved_screens_card||{};
  return '<div class="sc-c gap"><div class="sc-ch"><span class="t">Saved screens</span><span class="n">'+(s.count!=null?s.count:0)+'</span></div>'
    + '<div class="sc-emp"><b>Nothing saved yet</b>'+esc(s.message||'')+'</div></div>';
}
function universeCardHtml(d){
  var u=d.universe||{};
  return '<div class="sc-c"><div class="sc-ch"><span class="t">Universe</span><span class="n">'+esc(u.basis||'full')+'</span></div>'
    + '<div class="sc-lst">'
    + '<div class="sc-lr"><span class="s">Screener base</span><div class="r"><span class="a">Screener.in</span><span class="b">'+(u.screener_pct!=null?u.screener_pct+'%':'—')+'</span></div></div>'
    + '<div class="sc-lr"><span class="s">Trendlyne overlap</span><div class="r"><span class="a">verification only</span><span class="b">'+(u.trendlyne_pct!=null?u.trendlyne_pct+'%':'—')+'</span></div></div>'
    + '</div><div class="sc-more">'+esc(u.note||'')+'</div></div>';
}
function historyCardHtml(d){
  var h=d.run_history||{};
  return '<div class="sc-c gap"><div class="sc-ch"><span class="t">Run history</span><span class="n">not stored</span></div>'
    + '<div class="sc-emp"><b>No run log</b>'+esc(h.message||'')+'</div></div>';
}

function render(d){
  var k=d.key_metrics||{};
  document.getElementById('sc-asof').textContent = 'Screens last ran '+dmd(k.last_run)+' · '+(d.today&&d.today.rows_stored_total!=null?d.today.rows_stored_total:'—')+' rows stored';
  var html = kmHtml(k)
    + '<div class="sc-slab"><h2>Ready screens</h2><span class="hint">'+(k.screens_live||0)+' · swipe →</span></div>'
    + '<div class="sc-rail">'+screensCardHtml(d)+todayCardHtml(d)+'</div>'
    + '<div class="sc-slab"><h2>Build your own</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="sc-rail">'+builderCardHtml(d)+savedCardHtml(d)+'</div>'
    + '<div class="sc-slab"><h2>Coverage</h2><span class="hint">2 · swipe →</span></div>'
    + '<div class="sc-rail">'+universeCardHtml(d)+historyCardHtml(d)+'</div>'
    + '<div class="sc-note"><b>Each screen states its own run date.</b> A screen is never shown as if it ran today when it did not. Saved screens and run history are both absent from the schema and are named as gaps rather than left off the page.</div>';
  document.getElementById('sc-body').innerHTML = html;
}

fetch('/api/mobile/screeners_app', {credentials:'same-origin'})
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error){ document.getElementById('sc-body').innerHTML = '<div class="sc-err sc-empty">Could not load: '+esc(d.error)+'</div>'; return; }
    render(d);
  })
  .catch(function(e){ document.getElementById('sc-body').innerHTML = '<div class="sc-err sc-empty">Could not load screeners.</div>'; });
</script>
</body></html>
