<style>
.sr{font-family:Sora,-apple-system,sans-serif;color:var(--ink);padding-bottom:var(--space-80)}
.sr-asof{padding:var(--space-10) var(--space-16) 0;font-size:var(--type-10);color:var(--muted);letter-spacing:var(--track-em7)}

.km{margin:var(--space-10) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-left:var(--bw-3) solid var(--brand);border-radius:0 var(--radius-16) var(--radius-16) 0;padding:var(--space-13) var(--space-16);display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-8)}
.km .k{font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em10)}.km .v{font-size:var(--type-16);font-weight:800;margin-top:var(--space-3)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-20) var(--space-16) var(--space-8)}
.sec h2{font-size:var(--type-115);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em14);margin:0}.sec .hint{font-size:var(--type-10);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-8);padding:0 var(--space-16)}
.sc{background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-16);padding:var(--space-12) var(--space-8) var(--space-10);text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden;min-height:150px}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 0%,color-mix(in srgb, var(--brand) 9%, transparent),transparent 65%);pointer-events:none}
.sc .ic{width:48px;height:48px;border-radius:var(--radius-15);background:var(--hi);border:var(--bw-1) solid var(--edge);display:flex;align-items:center;justify-content:center;margin-top:var(--space-2)}
.sc .ic svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.sc svg .f{fill:var(--brand);stroke:none;opacity:.22}
.sc .nm{font-size:var(--type-12);font-weight:800;line-height:1.2;margin-top:var(--space-9);min-height:29px}
.sc .n{font-size:var(--type-105);color:var(--muted);margin-top:var(--space-4)}.sc .n b{color:var(--ink);font-weight:800}
.sc .rule{font-size:var(--type-9);color:var(--muted);line-height:1.4;margin-top:var(--space-6);padding-top:var(--space-6);border-top:var(--bw-1) solid var(--hi);width:100%}
.sc .dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:var(--radius-3);background:var(--win)}.sc .dot.st{background:var(--loss)}
.wide{grid-column:span 3;flex-direction:row;text-align:left;align-items:center;gap:var(--space-12);min-height:0;padding:var(--space-12)}
.wide .ic{flex:none;margin:0}.wide .nm{margin:0;min-height:0}.wide .n{margin-top:var(--space-2)}.wide .rule{border-top:none;padding-top:0;margin-top:var(--space-2);width:auto}
.wide .go{margin-left:auto;color:var(--brand);font-weight:800;font-size:var(--type-16)}
.emp{margin:0 var(--space-16);background:var(--panel);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-14);padding:var(--space-12) var(--space-13);font-size:var(--type-115);color:var(--muted);line-height:1.6}
/* screen table */
.rulebox{margin:var(--space-12) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-left:var(--bw-3) solid var(--brand);border-radius:0 var(--radius-14) var(--radius-14) 0;padding:var(--space-12) var(--space-14);font-size:var(--type-115);line-height:1.55}
.rulebox .k{font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em10)}
.wrap{margin:var(--space-12) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:100%;font-size:var(--type-115)}
th{position:sticky;top:0;background:var(--hi);font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em9);text-align:right;padding:var(--space-9) var(--space-8);border-bottom:var(--bw-1) solid var(--edge);white-space:nowrap;cursor:pointer;user-select:none}
th.on{color:var(--brand)}th.on::after{content:" ▾";font-size:var(--type-9)}th.on.asc::after{content:" ▴"}
th:first-child,td:first-child{text-align:left;padding-left:var(--space-12);position:sticky;left:0;background:var(--panel)}th:first-child{background:var(--hi)}
td{padding:var(--space-8) var(--space-8);border-bottom:var(--bw-1) solid var(--hi);text-align:right;font-weight:600;white-space:nowrap}
td:first-child{font-weight:800}td:first-child small{display:block;font-size:var(--type-9);color:var(--muted);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
.gd{color:var(--brand)}
.foot{padding:var(--space-9) var(--space-12);font-size:var(--type-10);color:var(--muted);border-top:var(--bw-1) solid var(--edge)}
.note{margin:var(--space-22) var(--space-16) var(--space-8);padding:var(--space-12) var(--space-14);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--muted);line-height:1.65}.note b{color:var(--ink)}
.err{margin:var(--space-16);color:var(--muted);font-size:var(--type-12);text-align:center}
.back{color:var(--brand);text-decoration:none;font-size:var(--type-18);font-weight:800}
</style>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dmy(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]+' '+p[0]):String(iso); }
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
/* icon per screen — by group, with a few named overrides; unknown screens get the group icon */
var ICON={
  momentum:'<svg viewBox="0 0 24 24"><path class="f" d="M4 17l5-6 4 3 7-8v11H4z"/><path d="M4 17l5-6 4 3 7-8"/><path d="M15 6h5v5"/></svg>',
  quality:'<svg viewBox="0 0 24 24"><path class="f" d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  value:'<svg viewBox="0 0 24 24"><path class="f" d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  '52-Week Breakout':'<svg viewBox="0 0 24 24"><path class="f" d="M12 3l3 7h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z"/><path d="M12 3l3 7h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z"/></svg>',
  'Future Giants':'<svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  'Market Leaders':'<svg viewBox="0 0 24 24"><path d="M4 19h16"/><rect class="f" x="6" y="11" width="3" height="8"/><rect x="6" y="11" width="3" height="8"/><rect class="f" x="11" y="7" width="3" height="12"/><rect x="11" y="7" width="3" height="12"/><rect class="f" x="16" y="4" width="3" height="15"/><rect x="16" y="4" width="3" height="15"/></svg>',
  'Multibagger Hunt':'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8.5 13.5l2-2.5 1.5 1.5 2.5-3"/></svg>',
  custom:'<svg viewBox="0 0 24 24"><path d="M4 5h16M6 10h12M8 15h8M10 20h4"/></svg>'
};
function card(c){
  return '<a class="sc" href="/m/screeners?screen='+c.id+'"><span class="dot'+(c.stale?' st':'')+'"></span><div class="ic">'+(ICON[c.name]||ICON[c.group])+'</div>'
    + '<div class="nm">'+esc(c.name)+'</div><div class="n"><b>'+c.members+'</b> name'+(c.members===1?'':'s')+(c.stale?' · ran '+esc(dm(c.last_run)):'')+'</div>'
    + '<div class="rule">'+esc(c.rule||'no rule on record')+'</div></a>';
}
function renderList(d){
  var k=d.key_metrics||{};
  document.getElementById('asof').innerHTML='Last run <b>'+esc(dmy(d.as_of))+'</b> · '+k.screens+' quant screens · '+k.names_today+' names today';
  var h='<div class="km"><div><div class="k">Screens</div><div class="v">'+k.screens+'</div></div><div><div class="k">Names today</div><div class="v">'+k.names_today+'</div></div><div><div class="k">Stale</div><div class="v">'+k.stale+'</div></div></div>';
  (d.groups||[]).forEach(function(g){
    h+='<div class="sec"><h2>'+esc(g.title)+'</h2><span class="hint">'+esc(g.hint)+'</span></div>';
    if(!g.rows.length){ h+='<div class="emp">No quant screen hunts this today.</div>'; return; }
    var cards=g.rows.map(card); while(cards.length%3) cards.push('<a class="sc" style="visibility:hidden"></a>');
    h+='<div class="grid">'+cards.join('')+'</div>';
  });
  h+='<div class="sec"><h2>Build your own</h2><span class="hint">V13 custom screen</span></div><div class="grid"><a class="sc wide" href="/screeners#custom"><div class="ic">'+ICON.custom+'</div><div><div class="nm">Custom screen</div><div class="n">Pick your own GVM, size and momentum cuts.</div><div class="rule">Opens the web builder. Saved screens: none yet.</div></div><span class="go">›</span></a></div>';
  h+='<div class="note"><b>Only quant screens.</b> A screen with a written rule appears here; rank-only client lists do not. Green dot = ran on the latest date; red = stale, with its own date. Tap a screen for its names.</div>';
  document.getElementById('body').innerHTML=h;
}
var ROWS=[], KEY='gvm', ASC=false;
function tbl(){
  var rows=ROWS.slice().sort(function(a,b){ var x=a[KEY], y=b[KEY]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return ASC? x.localeCompare(y) : y.localeCompare(x); return ASC? x-y : y-x; });
  var cols=[['symbol','Name'],['gvm','GVM'],['g','G'],['v','V'],['m','M'],['mcap','Mcap Cr']];
  var th=cols.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var f=function(v){ return v==null?'—':Number(v).toFixed(2); };
  var tr=rows.map(function(r){ return '<tr><td>'+esc(r.symbol)+'<small>'+esc(r.sector||'')+'</small></td><td class="'+((r.gvm||0)>=8?'gd':'')+'">'+f(r.gvm)+'</td><td>'+f(r.g)+'</td><td>'+f(r.v)+'</td><td>'+f(r.m)+'</td><td>'+(r.mcap==null?'—':Math.round(Number(r.mcap)).toLocaleString('en-IN'))+'</td></tr>'; }).join('');
  document.getElementById('tb').innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' names · tap a header to sort · scores from the latest GVM run</div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='symbol'); } tbl(); });
}
function renderScreen(d){
  document.getElementById('pg-title').textContent=d.name; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='Last run <b>'+esc(dmy(d.last_run))+'</b> · '+d.count+' names';
  document.getElementById('body').innerHTML='<div class="rulebox"><div class="k">The rule</div>'+esc(d.rule||'no rule on record')+'</div><div class="wrap" id="tb"></div>'
    + '<div class="note"><b>What this list is.</b> Every name here passed the rule above on the last run. Scores are the latest GVM; G, V, M are its three pillars. Nothing is a recommendation.</div>';
  ROWS=d.rows||[]; tbl();
}
var S=null; try{ S=new URLSearchParams(location.search).get('screen'); }catch(e){}
fetch(S?'/api/mobile/screeners_app/screen?id='+encodeURIComponent(S):'/api/mobile/screeners_app/list',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
  if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
  S ? renderScreen(d) : renderList(d);
}).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load screens.</div>'; });
</script>
