<!-- ══ mobile/screeners.html — Screeners app section. Fable single-mode rewrite 10-Sep-2026
     (SCREENERS_APP_R2_LOCK session_log 42826; design ref design_refs/scorr_app_screeners_R2.html @ 3c4457c;
     APP_BUILD_FIDELITY_V1 42756). Supersedes the cc#1899 build. ONE page, two views:
       /m/screeners             → quant screens only, three groups + Build your own, from /api/mobile/screeners_app/list
       /m/screeners?screen=<id> → the screen's names, sortable table, from /api/mobile/screeners_app/screen?id=
     Contract tokens only; the 48px disc / 26px icon are layout geometry.
     cc#2156 (17-Sep-2026, Screeners PUSH 1/5): the three groups render as horizontal snap rails (geometry copied
     from mobile/sector.html .rl/.tc), one horizontal card per screen with a three-name preview from the list
     endpoint's `top`, equal heights per rail, a dot pager per rail. Class names are sk-* on purpose:
     /static/mobile_app.css carries bare .rail / .sc / .chip / .body rules that would restyle shorter names
     (cc#2155 root cause). The old 3-column .grid/.sc is gone (cc#2159 rebuilt the Build-your-own card as an sk-card).
     cc#2157 (Screeners PUSH 2/5): a card tap opens the NAMES SHEET on this page (renderNamesSheet -- the one shared
     sheet, push 4 reuses it with its own rows) instead of leaving for /m/screeners?screen=<id>; that page stays as
     the 'Full table' target. Body scroll locks while open; pushState so the back button closes the sheet.
     cc#2159 (Screeners PUSH 4/5): /m/screeners?view=custom = the CUSTOM SCREENER view (same route, so no NAV change):
     renderCustom(meta) from /api/mobile/custom_screener/meta -- ten filter rows, three chips each, multi-select,
     live count from /run in a sticky footer, results in the same names sheet. The Build-your-own card points here.
     cc#2160 (Screeners PUSH 5/5): the chip selection is mirrored into the URL (replaceState) so a link reopens to the
     same screen; Share copies that link; count-0 / alone-0 / meta-failure states are explicit, never blank.
     cc#2173 (founder review 17-Sep 12:19): chips are label-only (no per-chip count), the ONE live count sits under the
     subtitle, the footer keeps the buttons only, rows are ~30% shorter.
     TOKEN_MAP  #D4AF37 -> --brand · #3DD68C -> --win · #FF5C6C -> --loss · #131316 -> --panel · #1B1B20 -> --hi ·
     #2A2A32 -> --edge · #F5F2EA -> --ink · #8E8A7E -> --muted -->

/* cc#2157: the names sheet. renderNamesSheet(title, meta, rows, footerHref) is the ONE shared component --
   rows = array (the names, in the order given: never re-sorted here), null = loading, false = error. */
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function cr(v){ if(v==null||isNaN(Number(v))) return '—'; v=Number(v); return v>=100000?'₹'+(v/100000).toFixed(1)+'L Cr':v>=1000?'₹'+(v/1000).toFixed(0)+'k Cr':'₹'+Math.round(v)+' Cr'; }
var SHEET=null, SHEET_SEQ=0, SCROLL_Y=0;
function ensureSheet(){
  if(SHEET) return SHEET;
  var bd=document.createElement('div'); bd.className='sk-bd'; bd.id='sk-bd'; bd.hidden=true;
  var sh=document.createElement('div'); sh.className='sk-sheet'; sh.id='sk-sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true'); sh.hidden=true;
  sh.innerHTML='<div class="sk-sheet-h"><i class="sk-handle" id="sk-handle" role="button" aria-label="Close"></i><div class="sk-sheet-t" id="sk-sheet-t"></div><div class="sk-sheet-m" id="sk-sheet-m"></div><div class="sk-sheet-r" id="sk-sheet-r"></div></div><div class="sk-sheet-b" id="sk-sheet-b"></div><div class="sk-sheet-fx" id="sk-sheet-fx" hidden></div><a class="sk-sheet-f" id="sk-sheet-f" href="#"><span>Full table, sortable</span><span>›</span></a>';
  document.body.appendChild(bd); document.body.appendChild(sh);
  bd.addEventListener('click', closeSheet); document.getElementById('sk-handle').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !sh.hidden) closeSheet(); });
  window.addEventListener('popstate', function(){ if(!sh.hidden) hideSheet(); });   // the back button closes the sheet, never the page
  SHEET={bd:bd, sh:sh}; return SHEET;
}
function pct1(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(1)+'%'; }
function capWord(c){ return ({large:'Large',mid:'Mid',small:'Small',micro:'Micro'})[c]||''; }
function bandWord(b){ return ({STRONG_BUY:'Strong buy',ACCUMULATE:'Accumulate',WATCH:'Watch',AVOID:'Avoid'})[b]||(b||'—'); }
function nameRow(r){   // symbol + sector · mcap | GVM (brand colour from 8) + G/V/M compact; cc#2159: custom rows add Invest score + band + 1-yr
  var left2=(r.mcap!=null)?esc(r.sector||r.segment||'—')+' · '+cr(r.mcap):esc(r.sector||r.segment||'—')+(r.cap?' · '+capWord(r.cap):'');
  var extra=(r.invest_score!=null)?'<div class="sk-gvm-sub">Invest '+f2(r.invest_score)+' · '+esc(bandWord(r.invest_band))+(r.year_return!=null?' · 1-yr '+pct1(r.year_return):'')+'</div>':'';
  return '<div class="sk-row"><div><div class="sk-sym">'+esc(r.symbol)+'</div><div class="sk-sec">'+left2+'</div></div>'
    + '<div><div class="sk-gvm'+((r.gvm||0)>=8?' gd':'')+'">'+f2(r.gvm)+'</div><div class="sk-gvm-sub">G '+f1(r.g)+' · V '+f1(r.v)+' · M '+f1(r.m)+'</div>'+extra+'</div></div>';
}
function renderNamesSheet(title, meta, rows, footerHref){
  var s=ensureSheet(); meta=meta||{};
  document.getElementById('sk-sheet-t').textContent=title||'';
  document.getElementById('sk-sheet-m').innerHTML=meta.text!=null?meta.text:((meta.count!=null?'<b>'+meta.count+'</b> name'+(meta.count===1?'':'s'):'')+(meta.last_run?(meta.count!=null?' · ':'')+'Last run '+esc(dmy(meta.last_run)):''));   // cc#2159: meta.text = a ready line (custom screen)
  document.getElementById('sk-sheet-r').textContent=meta.rule||'';
  var b=document.getElementById('sk-sheet-b');
  if(rows===null) b.innerHTML='<div class="sk-sheet-e">Loading names…</div>';
  else if(rows===false) b.innerHTML='<div class="sk-sheet-e">Could not load. Try again, or open the full table below.</div>';
  else if(!rows.length) b.innerHTML='<div class="sk-sheet-e">No names in this screen on the last run.</div>';
  else b.innerHTML=rows.map(nameRow).join('');
  var f=document.getElementById('sk-sheet-f'); if(footerHref){ f.setAttribute('href',footerHref); f.hidden=false; } else f.hidden=true;
  var fx=document.getElementById('sk-sheet-fx'); if(meta.foot){ fx.innerHTML=meta.foot; fx.hidden=false; } else { fx.innerHTML=''; fx.hidden=true; }   // cc#2159: plain footer block (EOD basis line)
  return s;
}
var SCROLL_RESTORE='auto';
function showSheet(){
  var s=ensureSheet(); if(!s.sh.hidden) return;
  SCROLL_Y=window.scrollY||0;
  // history entry FIRST (while the page still holds its scroll), then the lock -- otherwise the browser stores
  // scroll 0 for the entry it leaves and puts the page back at the top when the back button pops it
  try{ SCROLL_RESTORE=history.scrollRestoration||'auto'; history.scrollRestoration='manual'; history.pushState({skSheet:1},'',location.href); }catch(e){}
  document.body.classList.add('sk-lock'); document.body.style.top=(-SCROLL_Y)+'px';   // scroll lock; rails keep their own scroll
  s.bd.hidden=false; s.sh.hidden=false; document.getElementById('sk-sheet-b').scrollTop=0;
}
function hideSheet(){
  var s=ensureSheet(); if(s.sh.hidden) return;
  s.sh.hidden=true; s.bd.hidden=true; document.body.classList.remove('sk-lock'); document.body.style.top=''; window.scrollTo(0,SCROLL_Y); SHEET_SEQ++;
  try{ history.scrollRestoration=SCROLL_RESTORE; }catch(e){}
}
function closeSheet(){ var s=ensureSheet(); if(s.sh.hidden) return; if(history.state&&history.state.skSheet){ history.back(); } else hideSheet(); }
function openScreenSheet(id, name){
  var href='/m/screeners?screen='+encodeURIComponent(id), my=++SHEET_SEQ;
  renderNamesSheet(name, {}, null, href); showSheet();
  fetch('/api/mobile/screeners_app/screen?id='+encodeURIComponent(id),{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    if(my!==SHEET_SEQ) return;
    if(!d||d.error) renderNamesSheet(name, {}, false, href);
    else renderNamesSheet(d.name||name, {count:d.count, last_run:d.last_run, rule:d.rule}, d.rows||[], href);
  }).catch(function(){ if(my===SHEET_SEQ) renderNamesSheet(name, {}, false, href); });
}
function wirePagers(){   // cc#2156: one dot per card, the active dot follows the snapped card
  document.querySelectorAll('.sk-rail').forEach(function(rail){
    var pg=rail.nextElementSibling, dots=(pg&&pg.classList.contains('sk-pager'))?pg.querySelectorAll('i'):[]; if(!dots.length) return;
    var tick=null;
    function upd(){ tick=null; var k=rail.children; if(k.length<2) return; var step=k[1].offsetLeft-k[0].offsetLeft; if(step<=0) return;
      var i=Math.max(0,Math.min(dots.length-1,Math.round(rail.scrollLeft/step))); dots.forEach(function(x,j){x.classList.toggle('on',j===i);}); }
    rail.addEventListener('scroll',function(){ if(!tick) tick=requestAnimationFrame(upd); },{passive:true});
  });
}
function renderList(d){
  var k=d.key_metrics||{};
  document.getElementById('asof').innerHTML='Last run <b>'+esc(dmy(d.as_of))+'</b> · '+k.screens+' quant screens · '+k.names_today+' names today';
  var h='<div class="km"><div><div class="k">Screens</div><div class="v">'+k.screens+'</div></div><div><div class="k">Names today</div><div class="v">'+k.names_today+'</div></div><div><div class="k">Stale</div><div class="v">'+k.stale+'</div></div></div>';
  (d.groups||[]).forEach(function(g){
    h+='<div class="sec"><h2>'+esc(g.title)+'</h2><span class="hint">'+esc(g.hint)+'</span></div>';
    if(!g.rows.length){ h+='<div class="emp">No quant screen hunts this today.</div>'; return; }
    h+='<div class="sk-rail" id="rail-'+esc(g.key)+'">'+g.rows.map(card).join('')+'</div>'
     + '<div class="sk-pager" aria-hidden="true">'+g.rows.map(function(_,i){return '<i'+(i===0?' class="on"':'')+'></i>';}).join('')+'</div>';
  });
  h+='<div class="sec"><h2>Build your own</h2><span class="hint">buttons, no typing</span></div><div class="sk-one"><a class="sk-card sk-wide" href="/m/screeners?view=custom"><div class="sk-ic">'+ICON.custom+'</div><div class="sk-body"><div class="sk-nm">Custom screener</div><div class="sk-n">Ten filters, three buttons each. Tap what you want.</div><div class="sk-rule">Live count as you tap · the names open right here</div></div><span class="sk-go">›</span></a></div>';   // cc#2159
  h+='<div class="note"><b>Only quant screens.</b> A screen with a written rule appears here; rank-only client lists do not. Green dot = ran on the latest date; red = stale, with its own date. Swipe a row to see the next screen; tap a screen to see its names right here.</div>';
  document.getElementById('body').innerHTML=h;
  wirePagers();
  var body=document.getElementById('body');
  if(!body._skTap){ body._skTap=true; body.addEventListener('click', function(e){   // cc#2157: a card tap opens the sheet; modifier clicks keep the link
    var a=e.target.closest('a.sk-card'); if(!a||!a.getAttribute('data-id')||e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return;   // the custom card has no data-id: it navigates
    e.preventDefault(); openScreenSheet(a.getAttribute('data-id'), a.getAttribute('data-name')); }); }
}
/* cc#2159: the custom screener view. State = CS.sel {filter_key: [button_keys]}; the count comes from /run on every
   tap (debounced, previous fetch aborted); the names sheet shows the rows /run already returned (no second fetch). */
var CS={meta:null, sel:{}, last:null, timer:null, ctrl:null, seq:0}, CS_KEY='scorr_custom_screen_v1';
function csLoadSel(){ try{ var s=JSON.parse(localStorage.getItem(CS_KEY)||'{}'); return (s&&typeof s==='object'&&!Array.isArray(s))?s:{}; }catch(e){ return {}; } }
function csSaveSel(){ try{ if(Object.keys(CS.sel).length) localStorage.setItem(CS_KEY, JSON.stringify(CS.sel)); else localStorage.removeItem(CS_KEY); }catch(e){} }   // a per-viewer convenience, never a saved screen
function csQuery(){ var q=[]; Object.keys(CS.sel).forEach(function(k){ if(CS.sel[k].length) q.push(encodeURIComponent(k)+'='+CS.sel[k].map(encodeURIComponent).join(',')); }); return q.join('&'); }
function csPicked(){ return Object.keys(CS.sel).reduce(function(n,k){ return n+CS.sel[k].length; },0); }
/* cc#2160: URL state. The query string carries the same keys /run takes, so a link reopens to the same screen. */
function csFromUrl(known){ var sel={}; try{ var u=new URLSearchParams(location.search); Object.keys(known).forEach(function(k){ var v=u.getAll(k).join(',').split(',').map(function(s){ return s.trim().toLowerCase(); }).filter(function(s,i,arr){ return s&&known[k].indexOf(s)>=0&&arr.indexOf(s)===i; }); if(v.length) sel[k]=v; }); }catch(e){} return sel; }
function csSyncUrl(){ try{ var q=csQuery(); history.replaceState(history.state, '', '/m/screeners?view=custom'+(q?'&'+q:'')); }catch(e){} }
function csShareUrl(){ var q=csQuery(); return location.origin+'/m/screeners?view=custom'+(q?'&'+q:''); }
function csShare(){
  var url=csShareUrl(), btn=document.getElementById('cs-share'); if(!btn||btn.disabled) return;
  function done(ok){ btn.textContent=ok?'Link copied':'Share'; if(ok) setTimeout(function(){ btn.textContent='Share'; },1500); }
  function fallback(){ try{ window.prompt('Copy this link', url); }catch(e){} done(false); }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ done(true); }).catch(fallback); } else fallback();
}
function loadCustom(){   // cc#2160: a failed /meta says so and offers a retry -- never a blank panel
  document.getElementById('body').innerHTML='<div class="err">Loading filters…</div>';
  fetch('/api/mobile/custom_screener/meta',{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){ if(!d||d.error||!d.filters||!d.filters.length) throw new Error((d&&d.error)||'no filters'); renderCustom(d); })
  .catch(function(){
    document.getElementById('pg-title').textContent='Custom screener'; var bk=document.getElementById('back'); bk.style.display=''; bk.setAttribute('href','/m/screeners');
    document.getElementById('asof').textContent='Could not load';
    document.getElementById('body').innerHTML='<div class="err">Could not load the filters.<br><br><button type="button" class="sk-cs-clear" id="cs-retry">Try again</button></div>';
    document.getElementById('cs-retry').addEventListener('click', loadCustom);
  });
}
function csExclText(n){ return n+' name'+(n===1?' has':'s have')+' no technicals today and '+(n===1?'is':'are')+' left out of trend / 52-week / 1-year filters.'; }
function renderCustom(meta){
  CS.meta=meta; var known={}; (meta.filters||[]).forEach(function(f){ known[f.key]=f.buttons.map(function(b){ return b.key; }); });
  var fromUrl=csFromUrl(known); var saved=Object.keys(fromUrl).length?fromUrl:csLoadSel();   // cc#2160: a link's filters win; localStorage only when the URL carries none
  CS.sel={}; Object.keys(saved).forEach(function(k){ if(known[k]){ var v=(saved[k]||[]).filter(function(b){ return known[k].indexOf(b)>=0; }); if(v.length) CS.sel[k]=v; } });
  csSaveSel(); csSyncUrl();
  document.getElementById('pg-title').textContent='Custom screener'; var bk=document.getElementById('back'); bk.style.display=''; bk.setAttribute('href','/m/screeners');
  var a=meta.as_of||{}; var behind=(a.invest&&a.gvm&&a.invest<a.gvm)?' · <span class="sk-warn">Investment score is one day behind</span>':'';
  document.getElementById('asof').innerHTML='Scored <b>'+esc(dmy(a.gvm))+'</b> · EOD only · '+Number(meta.universe||0).toLocaleString('en-IN')+' names'+behind;
  var h='<div class="sk-cs-head"><div class="sk-cs-t">Custom screener</div><div class="sk-cs-s">Tap what you want. No numbers to type.</div><div class="sk-cs-count"><b id="cs-count">—</b><span id="cs-count-l">names match</span></div></div><div class="sk-cs" id="cs-panel">';   // cc#2173: the one live count sits here
  (meta.filters||[]).forEach(function(f){
    h+='<div class="sk-cs-row" data-key="'+esc(f.key)+'"><div class="sk-cs-h" title="'+esc(f.rule_text||'')+'"><span class="sk-cs-l">'+esc(f.label)+'</span><span class="sk-cs-r">'+esc(f.rule_text||'')+'</span></div><div class="sk-cs-chips">'
      + (f.buttons||[]).slice(0,3).map(function(b){ var on=(CS.sel[f.key]||[]).indexOf(b.key)>=0; return '<button type="button" class="sk-chip'+(on?' on':'')+'" data-key="'+esc(f.key)+'" data-b="'+esc(b.key)+'" aria-pressed="'+(on?'true':'false')+'"><span class="sk-chip-l">'+esc(b.label)+'</span></button>'; }).join('')   // cc#2173: label only; /meta still carries `alone`
      + '</div></div>';
  });
  h+='</div><div class="sk-cs-excl" id="cs-excl" hidden></div>';
  h+='<div class="note"><b>How it works.</b> Buttons in one row are either/or; rows combine. A row you never tap is off. Every button is the same end-of-day band the app shows elsewhere, so a name never passes here and fails there. Nothing is a recommendation.</div><div class="sk-cs-pad"></div>';
  document.getElementById('body').innerHTML=h;
  if(!document.getElementById('cs-foot')){
    var foot=document.createElement('div'); foot.className='sk-cs-foot'; foot.id='cs-foot';
    foot.innerHTML='<button type="button" class="sk-cs-clear" id="cs-clear">Clear</button><button type="button" class="sk-cs-clear" id="cs-share" disabled>Share</button><button type="button" class="sk-cs-show" id="cs-show" disabled>Show names</button>';   // cc#2173: buttons only
    document.body.appendChild(foot);
    document.getElementById('cs-clear').addEventListener('click', function(){ CS.sel={}; csSaveSel(); csSyncUrl(); document.querySelectorAll('#cs-panel .sk-chip').forEach(function(c){ c.classList.remove('on'); c.setAttribute('aria-pressed','false'); }); csRefresh(0); });
    document.getElementById('cs-share').addEventListener('click', csShare);
    document.getElementById('cs-show').addEventListener('click', csShow);
    window.addEventListener('resize', csPlaceFoot);
  }
  csPlaceFoot();
  document.getElementById('cs-panel').addEventListener('click', function(e){
    var hd=e.target.closest('.sk-cs-h'); if(hd){ hd.parentNode.classList.toggle('open'); return; }   // cc#2173: the header line opens the full rule text
    var c=e.target.closest('.sk-chip'); if(!c) return; var k=c.getAttribute('data-key'), b=c.getAttribute('data-b'); var arr=CS.sel[k]||[]; var i=arr.indexOf(b);
    if(i>=0) arr.splice(i,1); else arr.push(b); if(arr.length) CS.sel[k]=arr; else delete CS.sel[k];
    c.classList.toggle('on', i<0); c.setAttribute('aria-pressed', i<0?'true':'false'); csSaveSel(); csSyncUrl(); csRefresh(250);
  });
  csRefresh(0);
}
function csPlaceFoot(){ var f=document.getElementById('cs-foot'), nav=document.querySelector('.bnav'); if(f) f.style.bottom=(nav?nav.offsetHeight:0)+'px'; }   // sits on top of the bottom nav
function csRefresh(delay){
  if(CS.timer) clearTimeout(CS.timer);
  var cnt=document.getElementById('cs-count'); if(!cnt) return; cnt.classList.add('dim');   // dims while loading, never blanks
  CS.timer=setTimeout(function(){
    if(CS.ctrl){ try{ CS.ctrl.abort(); }catch(e){} }
    var ctrl=window.AbortController?new AbortController():null; CS.ctrl=ctrl; var my=++CS.seq; var q=csQuery();
    fetch('/api/mobile/custom_screener/run'+(q?'?'+q:''),{credentials:'same-origin', signal:ctrl?ctrl.signal:undefined}).then(function(r){ return r.json(); }).then(function(d){
      if(my!==CS.seq) return; cnt.classList.remove('dim'); CS.last=d;
      var show=document.getElementById('cs-show'), lab=document.getElementById('cs-count-l'), ex=document.getElementById('cs-excl'), share=document.getElementById('cs-share');
      var picked=csPicked(); if(share) share.disabled=!picked;
      if(!d||d.error){ cnt.textContent='—'; lab.textContent='could not count'; show.disabled=true; return; }
      var n=picked?Number(d.count||0):0;
      cnt.textContent=n.toLocaleString('en-IN');
      lab.textContent=!picked?'names match · pick at least one filter':(n===0?'No name passes all of these today':(n===1?'name matches':'names match'));   // cc#2160: count-0 state
      show.disabled=!(n>0&&picked>0);
      var ne=Number(d.excluded_no_technicals||0); if(ne>0&&picked){ ex.textContent=csExclText(ne); ex.hidden=false; } else { ex.textContent=''; ex.hidden=true; }
    }).catch(function(e){ if(my!==CS.seq||(e&&e.name==='AbortError')) return; cnt.classList.remove('dim'); cnt.textContent='—'; document.getElementById('cs-count-l').textContent='could not count'; document.getElementById('cs-show').disabled=true; });
  }, delay||0);
}
function csShow(){
  var d=CS.last; if(!d||!d.rows||!csPicked()) return;
  var words=(d.applied||[]).map(function(x){ return x.label+': '+((x.buttons_label&&x.buttons_label.length)?x.buttons_label:(x.buttons_chosen||[])).join(' / '); }).join(' · ');
  var a=d.as_of||{}; var foot='EOD basis · GVM '+esc(dmy(a.gvm))+' · Investment '+esc(dmy(a.invest))+' · Technicals '+esc(dmy(a.technicals));
  var ne=Number(d.excluded_no_technicals||0); if(ne>0) foot+='<br>'+esc(csExclText(ne));
  if(Number(d.count||0)>d.rows.length) foot+='<br>Showing the first '+d.rows.length+' of '+Number(d.count).toLocaleString('en-IN')+'.';
  renderNamesSheet('Your screen', {text:'<b>'+Number(d.count||0).toLocaleString('en-IN')+'</b> name'+(d.count===1?'':'s')+' · '+esc(words), foot:foot}, d.rows, null);
  showSheet();
}
var ROWS=[], KEY='gvm', ASC=false;
function tbl(){
  var rows=ROWS.slice().sort(function(a,b){ var x=a[KEY], y=b[KEY]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return ASC? x.localeCompare(y) : y.localeCompare(x); return ASC? x-y : y-x; });
  var cols=[['symbol','Name'],['gvm','GVM'],['g','G'],['v','V'],['m','M'],['mcap','Mcap Cr']];
  var th=cols.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var f=function(v){ return v==null?'—':Number(v).toFixed(2); };
  var tr=rows.map(function(r){ return '<tr><td>'+esc(r.symbol)+'<small>'+esc(r.sector||'')+'</small></td><td class="'+((r.gvm||0)>=8?'gd':'')+'">'+f(r.gvm)+'</td><td>'+f(r.g)+'</td><td>'+f(r.v)+'</td><td>'+f(r.m)+'</td><td>'+(r.mcap==null?'—':Math.round(Number(r.mcap)).toLocaleString('en-IN'))+'</td></tr>'; }).join('');
  document.getElementById('tb').innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' names · tap a header to sort · scores from the latest GVM run</div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='symbol'); } tbl(); });
}
function renderScreen(d){
  document.getElementById('pg-title').textContent=d.name; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='Last run <b>'+esc(dmy(d.last_run))+'</b> · '+d.count+' names';
  document.getElementById('body').innerHTML='<div class="rulebox"><div class="k">The rule</div>'+esc(d.rule||'no rule on record')+'</div><div class="wrap" id="tb"></div>'
    + '<div class="note"><b>What this list is.</b> Every name here passed the rule above on the last run. Scores are the latest GVM; G, V, M are its three pillars. Nothing is a recommendation.</div>';
  ROWS=d.rows||[]; tbl();
}
var S=null, VIEW=null; try{ var U=new URLSearchParams(location.search); S=U.get('screen'); VIEW=U.get('view'); }catch(e){}
if(VIEW==='custom'){ loadCustom(); }
else fetch(S?'/api/mobile/screeners_app/screen?id='+encodeURIComponent(S):'/api/mobile/screeners_app/list',{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
  if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
  S ? renderScreen(d) : renderList(d);
}).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load screens.</div>'; });
</script>
