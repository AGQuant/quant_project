<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
var D=null, TRACK='momentum';
function band(b){ return b==='STRONG_BUY'?'Strong buy':(b==='ACCUMULATE'?'Accumulate':(b==='WATCH'?'Watch':(b||'—'))); }
function trackWord(t){ return t==='reversal'?'Reversal':(t==='momentum'?'Momentum':(t||'—')); }
function gatesHtml(r){ var g=r.gates||{}; return '<span class="iv-gates">'+Object.keys(g).map(function(k){return '<i class="'+(g[k].pass?'ok':'')+'"></i>';}).join('')+'</span>'; }
/* board row: the same content as before (symbol, state pill, band, GVM, gates dots, month %); the score tile is a
   plain bold number with the other track's score as a small muted line under it (cc#2178 item 5). */
function brow(r){
  var st=r.state||'', tag = st==='ENTERED'?'<span class="iv-pill mom">held</span>':(st==='ENTERS'?'<span class="iv-pill win">enters</span>':(st==='GATED'?'<span class="iv-pill">gated</span>':''));
  return '<a class="iv-brow '+(st==='ENTERS'||st==='ENTERED'?'up':(st==='GATED'?'':'mu'))+'" href="/m/check?sym='+encodeURIComponent(r.symbol)+'#ic"><div><div class="iv-bnm">'+esc(r.symbol)+tag+'</div><div class="iv-bsub">'+esc(band(r.band))+' · GVM <b>'+f2(r.gvm)+'</b> · gates '+(r.gates_n!=null?r.gates_n+'/4':'—')+gatesHtml(r)+(r.month_return!=null?' · month '+pct(r.month_return,1):'')+'</div></div>'
    +'<div class="iv-bval"><div class="iv-bn">'+(r.score!=null?Math.round(r.score):'—')+'</div><div class="iv-bc">'+(TRACK==='momentum'?'rev '+(r.rev!=null?Math.round(r.rev):'—'):'mom '+(r.mom!=null?Math.round(r.mom):'—'))+'</div>'
    +(window.ScorrWatchlistAdd?'<div style="margin-top:6px">'+window.ScorrWatchlistAdd.button(r.symbol,'invscan',true)+'</div>':'')+'</div></a>';   /* cc#2196: the watchlist + under the score (shared component; its capture-phase tap never follows this link) */
}
/* exit-reason pill: TARGET / SL / TIME in win / loss / muted; the engine's own exits ("momentum 70.7 < 75.0",
   "alpha -5.4 pct vs NIFTY500") get a short word (SCORE / ALPHA, muted) and the full reason on the sub line. */
function exitKind(reason){
  var r=String(reason||''), u=r.toUpperCase();
  if(u.indexOf('TARGET')===0) return ['TARGET','win'];
  if(u.indexOf('SL')===0||u.indexOf('STOP')>=0) return ['SL','loss'];
  if(u.indexOf('TIME')===0) return ['TIME',''];
  if(u.indexOf('ALPHA')>=0) return ['ALPHA',''];
  if(u.indexOf('MOMENTUM')===0||u.indexOf('REVERSAL')===0) return ['SCORE',''];
  return [r?'EXIT':'—',''];
}
function openCard(p){
  return '<div class="iv-card '+ud(p.net_pct)+'" role="button" tabindex="0" data-iv-open="1">'
    +'<div class="iv-hd"><div class="iv-nm">'+esc(p.symbol)+'<span class="iv-pill '+(p.track==='reversal'?'rev':'mom')+'">'+trackWord(p.track)+'</span></div>'
    +'<div class="iv-val"><div class="iv-big '+cls(p.net_pct)+'">'+pct(p.net_pct)+'</div><div class="iv-small">day '+pct(p.day_pct,1)+'</div></div></div>'
    +'<div class="iv-sub">entered '+esc(dm(p.entered))+' · score '+(p.entry_score!=null?Math.round(p.entry_score):'—')+'</div>'
    +'<div class="iv-sub">cmp <b>'+f2(p.cmp)+'</b>'+(p.cmp==null?' · no price':'')+'</div></div>';
}
function closedCard(p){
  var k=exitKind(p.exit_reason);
  return '<div class="iv-card '+ud(p.net_pct)+'" role="button" tabindex="0" data-iv-closed="1">'
    +'<div class="iv-hd"><div class="iv-nm">'+esc(p.symbol)+'<span class="iv-pill '+k[1]+'">'+k[0]+'</span></div>'
    +'<div class="iv-val"><div class="iv-big '+cls(p.net_pct)+'">'+pct(p.net_pct)+'</div><div class="iv-small">net</div></div></div>'
    +'<div class="iv-sub">exited '+esc(dm(p.exited))+(p.exit_reason?' · '+esc(p.exit_reason):'')+'</div>'
    +'<div class="iv-sub">entry <b>'+f2(p.entry)+'</b> → exit <b>'+f2(p.exit)+'</b></div></div>';
}
/* ── the holdings sheet: one component, two tables (open / closed), rows from the same payload, no second fetch ── */

function ivRows(kind){ var ps=(D&&D.positions)||{}; return (kind==='open'?(ps.open||[]):(ps.closed||[])).slice(); }
function ivSorted(kind){
  var rows=ivRows(kind), k=IV.key, d=IV.dir==='asc'?1:-1;
  rows.sort(function(a,b){ var x=a[k], y=b[k]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    if(typeof x==='number'&&typeof y==='number') return (x-y)*d; return String(x).localeCompare(String(y))*d; });
  return rows;
}
function ivCell(r,k){
  switch(k){
    case 'symbol': return '<a href="/m/check?sym='+encodeURIComponent(r.symbol)+'#ic">'+esc(r.symbol)+'</a>';
    case 'track': return esc(trackWord(r.track));
    case 'entered': case 'exited': return esc(dm(r[k]));
    case 'entry': case 'cmp': case 'exit': return f2(r[k]);
    case 'day_pct': return '<span class="'+cls(r[k])+'">'+pct(r[k],1)+'</span>';
    case 'net_pct': return '<span class="'+cls(r[k])+'">'+pct(r[k])+'</span>';
    case 'entry_score': return r[k]!=null?String(Math.round(r[k])):'—';
    case 'exit_reason': return esc(r[k]||'—');
  }
  return '—';
}
function ivTable(kind){
  var cols=IV_COLS[kind], rows=ivSorted(kind), ps=(D&&D.positions)||{};
  var th=cols.map(function(c){ var on=c[0]===IV.key; return '<th data-k="'+c[0]+'"'+(on?' class="on"':'')+'>'+c[1]+(on?(IV.dir==='asc'?' ▴':' ▾'):'')+'</th>'; }).join('');
  var tr=rows.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+ivCell(r,c[0])+'</td>'; }).join('')+'</tr>'; }).join('');
  var cap = (kind==='closed' && (ps.closed_total||0) > rows.length) ? '<div class="iv-sheet-f">Showing the latest '+rows.length+' of '+ps.closed_total+'.</div>' : '';
  return '<div class="iv-scroll"><table class="iv-tbl"><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div>'+cap
    +'<div class="iv-sheet-f">'+rows.length+' row'+(rows.length===1?'':'s')+' · tap a header to sort · Name opens Check</div>';
}
var IV_SHEET=null, IV_SCROLL=0, IV_RESTORE='auto';
function ivSheet(){
  if(IV_SHEET) return IV_SHEET;
  var bd=document.createElement('div'); bd.className='iv-bd'; bd.id='iv-bd'; bd.hidden=true;
  var sh=document.createElement('div'); sh.className='iv-sheet'; sh.id='iv-sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true'); sh.hidden=true;
  sh.innerHTML='<div class="iv-sheet-h"><i class="iv-handle" id="iv-handle" role="button" aria-label="Close"></i><div class="iv-sheet-t" id="iv-sheet-t"></div><div class="iv-sheet-m" id="iv-sheet-m"></div></div><div class="iv-sheet-b" id="iv-sheet-b"></div>';
  document.body.appendChild(bd); document.body.appendChild(sh);
  bd.addEventListener('click', ivCloseSheet); document.getElementById('iv-handle').addEventListener('click', ivCloseSheet);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !sh.hidden) ivCloseSheet(); });
  window.addEventListener('popstate', function(){ if(!sh.hidden) ivHideSheet(); });
  document.getElementById('iv-sheet-b').addEventListener('click', function(e){
    var th=e.target.closest('th[data-k]'); if(!th) return;
    var k=th.getAttribute('data-k'); if(k===IV.key) IV.dir=(IV.dir==='asc'?'desc':'asc'); else { IV.key=k; IV.dir=(k==='symbol'||k==='track'||k==='exit_reason')?'asc':'desc'; }
    ivDrawSheet();
  });
  IV_SHEET={bd:bd, sh:sh}; return IV_SHEET;
}
function ivDrawSheet(){
  ivSheet(); var ps=(D&&D.positions)||{}, rec=(D&&D.record)||{}, rows=ivRows(IV.kind);
  document.getElementById('iv-sheet-t').textContent = IV.kind==='open' ? 'Open positions · '+rows.length : 'Closed positions · '+(ps.closed_total||rows.length);
  document.getElementById('iv-sheet-m').textContent = IV.kind==='open'
    ? 'both tracks · avg net '+pct(ps.open_avg_net_pct)+' since entry · tap a header to sort'
    : 'record '+(rec.wr_pct!=null?rec.wr_pct+'%':'—')+' · '+(rec.wins||0)+' of '+(rec.closed||0)+' wins · tap a header to sort';
  document.getElementById('iv-sheet-b').innerHTML = rows.length ? ivTable(IV.kind) : '<div class="iv-sheet-f">'+(IV.kind==='open'?'No open position right now.':'Nothing closed yet.')+'</div>';
}
function ivOpenSheet(kind){
  IV.kind=kind; IV.key=(kind==='open'?'net_pct':'exited'); IV.dir='desc'; ivDrawSheet();
  var s=ivSheet(); if(!s.sh.hidden){ document.getElementById('iv-sheet-b').scrollTop=0; return; }
  IV_SCROLL=window.scrollY||0;
  try{ IV_RESTORE=history.scrollRestoration||'auto'; history.scrollRestoration='manual'; history.pushState({ivSheet:1},'',location.href); }catch(e){}   // history entry first, then the lock (cc#2159 lesson)
  document.body.classList.add('iv-lock'); document.body.style.top=(-IV_SCROLL)+'px';
  s.bd.hidden=false; s.sh.hidden=false; document.getElementById('iv-sheet-b').scrollTop=0;
}
function ivHideSheet(){
  var s=ivSheet(); if(s.sh.hidden) return;
  s.sh.hidden=true; s.bd.hidden=true; document.body.classList.remove('iv-lock'); document.body.style.top=''; window.scrollTo(0,IV_SCROLL);
  try{ history.scrollRestoration=IV_RESTORE; }catch(e){}
}
function ivCloseSheet(){ var s=ivSheet(); if(s.sh.hidden) return; if(history.state&&history.state.ivSheet){ history.back(); } else ivHideSheet(); }
function draw(){
  var d=D, ps=d.positions||{}, rec=d.record||{}, ru=d.rule||{};
  var open=ps.open||[], closed=ps.closed||[], enters=(d.enters||[]).filter(function(r){return r.state==='ENTERS';}), board=d.board||[];
  var closedTotal=ps.closed_total||closed.length;
  var h='<div class="hero"><div class="eye">Investment scanner · run '+esc(dm(d.run_date))+' · '+esc(d.track)+' track</div><div class="big"><div class="r">'+open.length+'</div><div class="n">positions open · avg <b class="'+cls(ps.open_avg_net_pct)+'">'+pct(ps.open_avg_net_pct)+'</b> since entry<br>'+enters.length+' would enter on the next run</div></div>'
    +'<div class="kg"><div class="cell"><div class="k">Closed</div><div class="iv-cv">'+(rec.closed||0)+'</div></div><div class="cell"><div class="k">Win rate</div><div class="iv-cv">'+(rec.wr_pct!=null?rec.wr_pct+'%':'—')+'</div></div><div class="cell"><div class="k">Avg net</div><div class="iv-cv '+cls(rec.avg_net_pct)+'">'+pct(rec.avg_net_pct)+'</div></div></div></div>';
  h+='<div class="sec"><h2>Track</h2><span class="hint">scored 0–100</span></div>';
  h+='<div class="seg" id="tr"><span data-t="momentum"'+(TRACK==='momentum'?' class="on"':'')+'>Momentum</span><span data-t="reversal"'+(TRACK==='reversal'?' class="on"':'')+'>Reversal</span></div>';
  /* cc#2178: positions come first -- they are the founder's first question on this page. positions.open / .closed are
     the whole scanner book (both tracks; the pill on each card says which), not the board's track. */
  h+='<div class="sec iv-tap" id="iv-open-h" role="button"><h2>Open positions</h2><span class="hint"><b>'+open.length+'</b> open · avg net <b class="'+cls(ps.open_avg_net_pct)+'">'+pct(ps.open_avg_net_pct)+'</b>'+(open.length?' · <span class="iv-go">table ›</span>':'')+'</span></div>';
  h+= open.length ? '<div class="iv-lst" id="iv-open">'+open.slice().sort(function(a,b){return (b.net_pct||0)-(a.net_pct||0);}).map(openCard).join('')+'</div>' : '<div class="emp"><b>Nothing open</b>No open position right now.</div>';
  h+='<div class="sec iv-tap" id="iv-closed-h" role="button"><h2>Closed positions</h2><span class="hint"><b>'+closedTotal+'</b> closed · record <b>'+(rec.wr_pct!=null?rec.wr_pct+'%':'—')+'</b> · '+(rec.wins||0)+' of '+(rec.closed||0)+' wins</span></div>';
  h+= closed.length ? '<div class="iv-lst" id="iv-closed">'+closed.slice(0,6).map(closedCard).join('')+'</div>'+(closedTotal>6?'<div class="iv-more"><a href="#" id="iv-closed-all">View all '+closedTotal+' ›</a></div>':'') : '<div class="emp"><b>Nothing closed yet</b>No position has exited.</div>';
  h+='<div class="sec"><h2>Enters next run</h2><span class="hint">score over the bar · 4 of 4 gates</span></div>';
  h+= enters.length ? '<div class="iv-lst">'+enters.map(brow).join('')+'</div>' : '<div class="emp"><b>Nothing clears both</b>No name has the score and all four gates today. The board below shows who is close.</div>';
  h+='<div class="sec"><h2>Board</h2><span class="hint">top 20 of '+board.length+' · dots = gates</span></div>';
  h+= board.length ? '<div class="iv-lst">'+board.slice(0,20).map(brow).join('')+'</div>' : '<div class="emp"><b>No board</b>The scanner has not scored this track yet.</div>';
  h+='<div class="card"><div class="ch"><span class="t">The rule</span><span class="n">from the engine</span></div><div class="rule">'+esc(ru.what||'')+'</div><div class="rule"><b>Enter:</b> '+esc(ru.entry||'')+'</div><div class="rule mu">Gates: '+esc((ru.gates||[]).join(' · '))+'</div><div class="rule"><b>Exit:</b> '+esc(ru.exit||'')+'</div><div class="rule mu">'+esc(ru.bands||'')+'</div></div>';
  h+='<div class="note"><b>Research only.</b> '+esc(ru.honesty||'')+'</div>';
  document.getElementById('asof').innerHTML='Run <b>'+esc(dm(d.run_date))+'</b> · '+board.length+' scored on '+esc(d.track)+' · '+open.length+' open';
  document.getElementById('body').innerHTML=h;
  document.getElementById('tr').addEventListener('click', function(e){ var s=e.target.closest('[data-t]'); if(!s) return; load(s.getAttribute('data-t')); });
  var oh=document.getElementById('iv-open-h'), ol=document.getElementById('iv-open');
  if(open.length){ oh.addEventListener('click', function(){ ivOpenSheet('open'); }); ol.addEventListener('click', function(e){ if(e.target.closest('[data-iv-open]')) ivOpenSheet('open'); }); }
  var chh=document.getElementById('iv-closed-h'), cl=document.getElementById('iv-closed'), ca=document.getElementById('iv-closed-all');
  if(closed.length){ chh.addEventListener('click', function(){ ivOpenSheet('closed'); }); cl.addEventListener('click', function(e){ if(e.target.closest('[data-iv-closed]')) ivOpenSheet('closed'); }); }
  if(ca) ca.addEventListener('click', function(e){ e.preventDefault(); ivOpenSheet('closed'); });
  if(!ivSheet().sh.hidden) ivDrawSheet();   // a track switch redraws the page under an open sheet: keep the table current
}
function load(t){
  TRACK=t||'momentum';
  fetch('/api/mobile/invscan?track='+TRACK,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
    D=d; draw();
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the scanner.</div>'; });
}
load('momentum');
</script>
</body></html>
