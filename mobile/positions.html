<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Book · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
<style>
/* cc#891 — Open Book in the shared card grammar. cc#894 row 31 (Fable direct, 17783): QTY now
   shows as a meta tag on every card — it was in the payload all along. */
.net{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.net .k{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.1em}
.net .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;font-weight:800}
.pc2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.kv{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;text-align:center}
.kv .k{font-size:8.5px;color:var(--dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.kv .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;font-weight:700;margin-top:2px}
.star{font-size:13px}
</style>
</head>
<body>
<div class="screen">
  <div class="head"><h1>Open Book</h1><div class="s" id="sub">loading…</div></div>
  <div class="net" id="net" style="display:none"><span class="k">NET P&amp;L</span><span class="v" id="netv"></span><span id="netr" style="margin-left:auto"></span></div>
  <div class="body" id="body"><div class="loading">Loading positions…</div></div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function px(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return x<100?x.toFixed(1):Math.round(x).toLocaleString('en-IN'); }
function inr(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return (x<0?'\u2212':'')+'Rs.'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function pct(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return (x>=0?'+':'')+x.toFixed(2)+'%'; }
function cls(v){ return v==null?'':(Number(v)>=0?'pos':'neg'); }
function railHtml(r){ if(!r) return '';
  var s=(r.state||'CLOSED').toLowerCase();
  return '<span class="rail rail-'+s+'" title="'+esc(r.why||'')+'"><i></i>'+esc(r.state)+'</span>'; }
function starIc(c){ return c ? '<span class="star" title="pivot star">'+(String(c).toLowerCase().indexOf('red')>-1?'\u2b50':'\ud83d\udd35')+'</span>' : ''; }

function card(p){
  var short_=(p.side||'')==='SHORT';
  return '<div class="c '+(short_?'short':'long')+'">'
    + '<div class="meta">'
    + '<span class="tag '+(short_?'bear':'bull')+'">'+esc(p.side)+'</span>'
    + '<span class="tag cat">'+esc(p.basket||'')+'</span>'
    + '<span class="tag">'+(p.qty==null?'--':Number(p.qty).toLocaleString('en-IN'))+' qty</span>'
    + (p.is_new?'<span class="tag edt">NEW</span>':'')
    + starIc(p.star)
    + '<span class="when">'+esc(p.entry_ts||'')+'</span></div>'
    + '<div class="hl">'+esc(p.symbol)
    + '<span class="mono" style="float:right;font-size:13px" class="'+cls(p.pnl)+'">'
    + '<span class="'+cls(p.pnl)+'">'+inr(p.pnl)+'</span></span></div>'
    + '<div class="pc2">'
    + '<div class="kv"><div class="k">Entry \u2192 CMP</div><div class="v">'+px(p.entry)+' \u2192 '+px(p.cmp)+'</div></div>'
    + '<div class="kv"><div class="k">Target / Stop</div><div class="v">'+px(p.target)+' / '+px(p.stop)+'</div></div>'
    + '<div class="kv"><div class="k">Return</div><div class="v '+cls(p.ret_pct)+'">'+pct(p.ret_pct)+'</div></div>'
    + '</div></div>';
}
fetchWithTimeout('/api/mobile/v8_positions').then(function(r){return r.json();}).then(function(d){
  if (d.error) throw new Error(d.error);
  document.getElementById('sub').innerHTML = d.count+' open positions '+railHtml(d.rail);
  if (d.count){
    document.getElementById('net').style.display='flex';
    var nv=document.getElementById('netv'); nv.textContent=inr(d.net_pnl); nv.className='v '+cls(d.net_pnl);
  }
  document.getElementById('body').innerHTML = d.count
    ? d.positions.map(card).join('')
    : '<div class="empty"><b>Book is flat</b>No open positions right now.</div>';
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>'+esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sub').textContent='failed to load';
});
</script>
</body>
</html>
