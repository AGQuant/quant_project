<style>

/* season hero */

.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--bw-3);background:linear-gradient(180deg,var(--brand),transparent)}
.hero .eye{font-size:var(--type-10);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em12)}
.hero .big{display:flex;align-items:baseline;gap:var(--space-10);margin-top:var(--space-6)}
.hero .big .r{font-size:var(--type-34);font-weight:800;line-height:1}.hero .big .n{font-size:var(--type-11);color:var(--muted);line-height:1.4}.hero .big .n b{color:var(--ink)}
.split{margin-top:var(--space-12);height:10px;border-radius:var(--radius-5);overflow:hidden;display:flex;background:var(--hi)}.split i{display:block;height:10px}

/* movers rail */
.rl{display:flex;gap:var(--space-10);overflow-x:auto;padding:var(--space-4) var(--space-16) var(--space-4);scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.rl::-webkit-scrollbar{display:none}

/* table */
.wrap{margin:var(--space-12) var(--space-16) 0;background:var(--panel);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-14);overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

th{position:sticky;top:0;background:var(--hi);font-size:var(--type-9);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em9);text-align:right;padding:var(--space-9) var(--space-8);border-bottom:var(--bw-1) solid var(--edge);white-space:nowrap;cursor:pointer;user-select:none}
th.on{color:var(--brand)}th.on::after{content:" ▾";font-size:var(--type-9)}th.on.asc::after{content:" ▴"}
th:first-child,td:first-child{text-align:left;padding-left:var(--space-12);position:sticky;left:0;background:var(--panel)}th:first-child{background:var(--hi)}
td{padding:var(--space-8) var(--space-8);border-bottom:var(--bw-1) solid var(--hi);text-align:right;font-weight:600;white-space:nowrap}
td:first-child{font-weight:800;max-width:140px;overflow:hidden;text-overflow:ellipsis}td:first-child small{display:block;font-size:var(--type-9);color:var(--muted);font-weight:600}
td a{color:inherit;text-decoration:none}tr:last-child td{border-bottom:none}.gd{color:var(--brand)}
.foot{padding:var(--space-9) var(--space-12);font-size:var(--type-10);color:var(--muted);border-top:var(--bw-1) solid var(--edge)}
.note{margin:var(--space-22) var(--space-16) var(--space-8);padding:var(--space-12) var(--space-14);border:var(--bw-1) dashed var(--edge);border-radius:var(--radius-12);font-size:var(--type-11);color:var(--muted);line-height:1.65}.note b{color:var(--ink)}
.err{margin:var(--space-16);color:var(--muted);font-size:var(--type-12);text-align:center}
.back{color:var(--brand);text-decoration:none;font-size:var(--type-18);font-weight:800}
</style>

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmy(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]+' '+p[0]):String(iso); }
function pct(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(1)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function f1(v){ return v==null?'—':Number(v).toFixed(1); } function f2(v){ return v==null?'—':Number(v).toFixed(2); }
function cr(v){ if(v==null) return '—'; v=Number(v); return v>=1000?'₹'+(v/1000).toFixed(1)+'k Cr':'₹'+Math.round(v)+' Cr'; }
function tok(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function mover(c,dn){
  return '<a class="mc '+(dn?'dn':'')+'" href="/m/results?sym='+encodeURIComponent(c.symbol)+'"><div class="s">'+esc(c.symbol)+'</div><div class="seg">'+esc(c.segment||'')+(c.tier?' · '+c.tier.toLowerCase():'')+'</div>'
    +'<div class="p '+cls(c.pat_yoy)+'">'+pct(c.pat_yoy)+'</div><div class="pl">profit vs last year · sales '+pct(c.sales_yoy)+'</div>'
    +'<div class="g"><span>GVM <b>'+f2(c.gvm)+'</b></span>'+(c.written?'<span class="rd">Read ›</span>':'<span>no write-up</span>')+'</div></a>';
}
function renderSeason(d){
  var s=d.summary||{}, q=(d.season||{}).quarter||'—';
  document.getElementById('asof').innerHTML='Season <b>'+esc(q)+'</b> · '+(s.reported||0)+' of '+(s.total||0)+' filed · '+(s.pct||0)+'%';
  var tot=(s.growing||0)+(s.flat||0)+(s.declining||0)||1;
  var h='<div class="hero"><div class="eye">Result season · '+esc(q)+'</div><div class="big"><div class="r">'+(s.reported||0)+'</div><div class="n">of <b>'+(s.total||0)+'</b> companies have filed<br>'+(s.beats_sector!=null?'<b>'+s.beats_sector+'</b> beat their sector median':'')+'</div></div>'
    +'<div class="split"><i style="width:'+((s.growing||0)/tot*100)+'%;background:'+tok('--win')+'"></i><i style="width:'+((s.flat||0)/tot*100)+'%;background:'+tok('--muted')+'"></i><i style="width:'+((s.declining||0)/tot*100)+'%;background:'+tok('--loss')+'"></i></div>'
    +'<div class="legend"><span><b class="pos">'+(s.growing||0)+'</b> profit up</span><span><b>'+(s.flat||0)+'</b> flat</span><span><b class="neg">'+(s.declining||0)+'</b> profit down</span></div>'
    +'<div class="kg"><div class="cell"><div class="k">Median sales YoY</div><div class="v '+cls(s.median_sales_yoy)+'">'+pct(s.median_sales_yoy)+'</div></div><div class="cell"><div class="k">Median profit YoY</div><div class="v '+cls(s.median_pat_yoy)+'">'+pct(s.median_pat_yoy)+'</div></div><div class="cell"><div class="k">On '+(s.pat_n||0)+' filings</div><div class="v">'+((s.basis||{}).detailed||0)+' full · '+((s.basis||{}).basic||0)+' basic</div></div></div></div>';
  var mv=d.movers||{};
  h+='<div class="sec"><h2>Biggest profit jumps</h2><span class="hint">vs last year · swipe →</span></div>';
  h+= (mv.up||[]).length ? '<div class="rl">'+mv.up.map(function(c){return mover(c,false);}).join('')+'</div>' : '<div class="card"><div class="emp"><b>Nothing yet</b>No filing this season shows profit growth on record.</div></div>';
  h+='<div class="sec"><h2>Biggest profit falls</h2><span class="hint">vs last year · swipe →</span></div>';
  h+= (mv.down||[]).length ? '<div class="rl">'+mv.down.map(function(c){return mover(c,true);}).join('')+'</div>' : '<div class="card"><div class="emp"><b>Nothing yet</b>No filing this season shows a profit fall on record.</div></div>';
  var sec=(d.sectors||[]).filter(function(x){return x.reported;});
  h+='<div class="sec"><h2>Sector by sector</h2><span class="hint">heaviest first · median moves</span></div>';
  h+='<div class="lad"><div class="lr h"><div class="nm" style="font-size:var(--type-9);color:var(--muted);text-transform:uppercase;letter-spacing:var(--track-em8)">Sector · filed</div><div class="v">Sales</div><div class="v">Profit</div></div>'
    + sec.slice(0,10).map(function(x){ return '<div class="lr"><div><div class="nm">'+esc(x.sector)+'</div><div class="sub">'+x.reported+' of '+x.total+' filed'+(x.pct_positive!=null?' · '+x.pct_positive+'% up':'')+(x.tiny?' · thin base':'')+(x.gvm!=null?' · GVM '+f1(x.gvm):'')+'</div></div><div class="v '+cls(x.sales_yoy)+'">'+pct(x.sales_yoy)+'</div><div class="v '+cls(x.pat_yoy)+'">'+pct(x.pat_yoy)+'</div></div>'; }).join('')+'</div>';
  h+='<div class="more">'+(sec.length>10?'+'+(sec.length-10)+' more sectors · ':'')+'<a href="/m/results?view=companies">Every company that filed, sortable ›</a></div>';
  var w=d.written||{}, wr=w.rows||[];
  h+='<div class="sec"><h2>Written up</h2><span class="hint">'+(w.total||0)+' analyses · last '+esc(dm(w.last))+'</span></div>';
  h+= wr.length ? '<div class="wl">'+wr.slice(0,8).map(function(r){ return '<a class="wr" href="/m/results?sym='+encodeURIComponent(r.symbol)+'"><div class="t"><span class="s">'+esc(r.symbol)+'</span><span class="d">'+esc(dm(r.result_date||r.polished_at))+'</span></div><div class="co">'+esc(r.company||'')+'</div><div class="tz">'+esc(r.teaser||'')+'</div></a>'; }).join('')+'</div>' : '<div class="card"><div class="emp"><b>Nothing written yet</b>No result analysis on record for this quarter.</div></div>';
  var up=d.upcoming||[];
  h+='<div class="sec"><h2>Next 10 days</h2><span class="hint">'+up.length+' on the calendar</span></div>';
  h+= up.length ? '<div class="cal">'+up.slice(0,12).map(function(u){ return '<div class="cd"><div class="d">'+esc(dm(u.date))+'</div><div class="s">'+esc(u.symbol)+'</div></div>'; }).join('')+'</div>' : '<div class="card"><div class="emp"><b>Quiet calendar</b>No result dates in the next ten days.</div></div>';
  h+='<div class="note"><b>How to read this.</b> '+esc(d.note||'')+' Write-ups are Scorr editorial from filings and calls, never a recommendation.</div>';
  document.getElementById('body').innerHTML=h;
}
var ROWS=[], KEY='pat_yoy', ASC=false, COLS=[];
function tbl(){
  var rows=ROWS.slice().sort(function(a,b){ var x=a[KEY], y=b[KEY]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return ASC? x.localeCompare(y) : y.localeCompare(x); return ASC? x-y : y-x; });
  var th=COLS.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=rows.map(function(r){ return '<tr>'+COLS.map(function(c){ var v=r[c[0]]; return '<td>'+(c[2]?c[2](v,r):esc(v==null?'—':v))+'</td>'; }).join('')+'</tr>'; }).join('');
  document.getElementById('tb').innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' companies · tap a header to sort · dash = not filed yet</div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='symbol'); } tbl(); });
}
function renderCompanies(d){
  document.getElementById('pg-title').textContent='All filings'; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML='Season <b>'+esc(d.quarter||'—')+'</b> · '+d.count+' companies';
  document.getElementById('body').innerHTML='<div class="wrap" id="tb"></div>';
  ROWS=d.rows||[];
  var pc=function(v){return '<span class="'+cls(v)+'">'+pct(v)+'</span>';};
  COLS=[['symbol','Name',function(v,r){return '<a href="/m/results?sym='+encodeURIComponent(v)+'">'+esc(v)+(r.written?' <span class="gd">•</span>':'')+'<small>'+esc(r.segment||'')+'</small></a>';}],['pat_yoy','Profit YoY',pc],['sales_yoy','Sales YoY',pc],['pat_qoq','Profit QoQ',pc],['gvm','GVM',f2],['pe','P/E',f1],['reported','Filed',function(v){return esc(dm(v));}]];
  tbl();
}
function renderAnalysis(d){
  var n=d.numbers||{};
  document.getElementById('pg-title').textContent=d.symbol; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML=(n.company?'<b>'+esc(n.company)+'</b> · ':'')+esc(n.segment||'')+(d.quarter?' · '+esc(d.quarter):'');
  var h='<div class="strip"><div><div class="k">Profit YoY</div><div class="v '+cls(n.pat_yoy)+'">'+pct(n.pat_yoy)+'</div></div><div><div class="k">Sales YoY</div><div class="v '+cls(n.sales_yoy)+'">'+pct(n.sales_yoy)+'</div></div><div><div class="k">Profit QoQ</div><div class="v '+cls(n.pat_qoq)+'">'+pct(n.pat_qoq)+'</div></div><div><div class="k">GVM</div><div class="v">'+f2(n.gvm)+'</div></div></div>';
  if(n.pat!=null||n.sales!=null) h+='<div class="strip"><div><div class="k">Sales</div><div class="v">'+cr(n.sales)+'</div></div><div><div class="k">Profit</div><div class="v">'+cr(n.pat)+'</div></div><div><div class="k">OPM</div><div class="v">'+(n.opm==null?'—':f1(n.opm)+'%')+'</div></div><div><div class="k">P/E · sector</div><div class="v">'+f1(n.pe)+' · '+f1(n.seg_pe)+'</div></div></div>';
  if(d.has_analysis){
    var secs=d.sections;
    if(secs&&typeof secs==='object'&&!Array.isArray(secs)&&Object.keys(secs).length){
      Object.keys(secs).forEach(function(k){ h+='<div class="card"><div class="ch"><span class="t">'+esc(k.replace(/_/g,' '))+'</span></div><div class="p">'+esc(secs[k])+'</div></div>'; });
    } else h+='<div class="card"><div class="ch"><span class="t">Result analysis</span><span class="n">'+esc(dm(d.polished_at))+'</span></div><div class="p">'+esc(d.analysis||'')+'</div></div>';
    h+='<div class="note"><b>'+esc(d.basis||'Scorr editorial')+'.</b> Written from the filing and the call. Not a recommendation.</div>';
  } else h+='<div class="card"><div class="emp"><b>No write-up for this one</b>'+(n.symbol?'The numbers above are from the filing. Nothing has been written about it yet.':'This symbol has not filed this season, or is outside the tracked universe.')+'</div></div>';
  document.getElementById('body').innerHTML=h;
}
var Q={}; try{ var u=new URLSearchParams(location.search); Q.sym=u.get('sym'); Q.view=u.get('view'); }catch(e){}
var url = Q.sym ? '/api/mobile/results_app/analysis?symbol='+encodeURIComponent(Q.sym) : (Q.view==='companies' ? '/api/mobile/results_app/companies' : '/api/mobile/results_app/season');
fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
  if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
  Q.sym ? renderAnalysis(d) : (Q.view==='companies' ? renderCompanies(d) : renderSeason(d));
}).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load results.</div>'; });
</script>
