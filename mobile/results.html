<!doctype html>
<!-- ══ mobile/results.html — Results app section. Fable single-mode build 10-Sep-2026 (founder: read the web
     APIs, build intuitively). Supersedes the cc#1901 build and the older calendar-first page. ONE page, three views:
       /m/results                → THE SEASON: who has filed, PAT growing/flat/declining bar, medians, biggest movers,
                                   sector table, written-up analyses, upcoming results
       /m/results?view=companies → every reporter this season, sortable
       /m/results?view=past      → Past results: every filer this season, size chips, sortable (cc#2169)
       /m/results?sym=<symbol>   → one company's numbers + the written analysis
     cc#2161 (17-Sep): hero = two tappable median cells + Leading sectors strip. cc#2162: 'Sectors this season' (Top / Under toggle,
     size chips with counts, five rows, View more sheet, ?perf=&size= URL state) replaces the old sector ladder. cc#2163: every
     sector row opens the same sheet with that sector's companies table (/companies?segment=, sideways scroll, sortable). cc#2164:
     ?view=companies&segment= is honoured (title = the sector, Clear filter), movers show Read > only when written, section order =
     hero -> Sectors this season -> Biggest profit jumps -> Biggest profit falls -> Written up -> Upcoming results -> note.
     cc#2168: 'Upcoming results' (30-day window, All / Large / Mid / Small / Micro chips, rows by date, View more sheet, ?up=)
     replaces the Next 10 days grid; a bare BSE code shows its company name.
     Data: /api/mobile/results_app/season · /companies · /analysis?symbol= (results_app_mobile.py V2), which read
     the web Result Corner's own result_corner_v2 and the Results page's own analysis feed. Contract tokens only. -->

<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var w=d.written||{}, wr=w.rows||[];

/* cc#2161: the hero's two cells + the leading-sectors strip. Source = d.sectors (result_corner_v2's own rows, no

  h+= rows.length ? rows.map(function(x){ var n=Number(x.n_used||0); return '<a class="lead-r" data-sector="'+esc(x.sector||'')+'" href="/m/results?view=companies&segment='+encodeURIComponent(x.sector||'')+'"><span class="lead-nm">'+esc(x.sector)+'</span><span class="lead-v '+cls(x[k])+'">'+pct(x[k])+'</span><span class="lead-n">'+n+' filings'+(n<5?'<i>thin</i>':'')+'</span></a>'; }).join('')

/* cc#2162: Sectors this season. Eligible = pat_n >= 3 (the payload's own thin-base rule). Top = pat_yoy desc, Under = asc.

var ST={perf:'top', size:'all', rows:[]}, ST_SIZES=[['all','All'],['large','Large'],['mid','Mid'],['small','Small']];
function stElig(){ return ST.rows.filter(function(x){ var n=Number(x.pat_n!=null?x.pat_n:x.n_used); return n>=3 && x.pat_yoy!=null && !isNaN(Number(x.pat_yoy)); }); }
function stInSize(list,size){ return size==='all'?list:list.filter(function(x){ return String(x.size||'').toLowerCase()===size; }); }
function stSorted(list,perf){ return list.slice().sort(function(a,b){ return perf==='under'?Number(a.pat_yoy)-Number(b.pat_yoy):Number(b.pat_yoy)-Number(a.pat_yoy); }); }
function stView(){ return stSorted(stInSize(stElig(),ST.size),ST.perf); }
function stSizeWord(){ var s=ST_SIZES.filter(function(x){ return x[0]===ST.size; })[0]; return ST.size==='all'?'':s[1]; }
function stRow(x){ var n=Number(x.pat_n!=null?x.pat_n:x.n_used); return '<a class="st-r" data-sector="'+esc(x.sector||'')+'" href="/m/results?view=companies&segment='+encodeURIComponent(x.sector||'')+'"><div><div class="st-nm">'+esc(x.sector)+'</div><div class="st-sub">'+n+' filings · GVM '+esc(x.verdict||'—')+(n<5?'<i>thin</i>':'')+'</div></div><span class="st-p '+cls(x.pat_yoy)+'">'+pct(x.pat_yoy)+'</span><span class="st-s">'+pct(x.sales_yoy)+'</span></a>'; }
function stEmpty(n){ var w=stSizeWord(); return n===0?('No '+(w?w+' ':'')+'sector has 3+ filings this season.'):('Only '+n+' '+(w?w+' ':'')+'sector'+(n===1?' has':'s have')+' 3+ filings this season.'); }
function stSyncUrl(){ try{ var q=[]; if(ST.perf!=='top') q.push('perf='+ST.perf); if(ST.size!=='all') q.push('size='+ST.size); if(typeof UP!=='undefined'&&UP.size!=='all') q.push('up='+UP.size); history.replaceState(history.state,'','/m/results'+(q.length?'?'+q.join('&'):'')); }catch(e){} }   // cc#2168: carries ?up= too
function stDraw(){
  var el=document.getElementById('st'); if(!el) return;

  h+='<div class="st-chips">'+ST_SIZES.map(function(s){ return '<button type="button" class="st-chip" data-size="'+s[0]+'" aria-pressed="'+(ST.size===s[0])+'">'+s[1]+'<small>'+stInSize(elig,s[0]).length+'</small></button>'; }).join('')+'</div>';

function stTapWire(el){   // cc#2163: a sector row opens its companies sheet; modifier clicks keep the link

/* the View more sheet: same pattern as the Screeners names sheet (cc#2157) -- fixed, 78vh, drag handle, backdrop, back button closes */
var ST_SHEET=null, ST_SCROLL=0, ST_RESTORE='auto';

function stOpenSheet(){

/* cc#2168: Upcoming results. Rows = the season payload's 30-day calendar (size from the ranked universe, GVM, display name for a
   bare BSE code). Chips All / Large / Mid / Small / Micro with counts; unranked rows (size null) only under All, tagged; the next
   10 matching rows grouped by date; View more -> the shared sheet with every row in the window; ?up= in the URL. */
var UP={size:'all', rows:[], days:30}, UP_SIZES=[['all','All'],['large','Large'],['mid','Mid'],['small','Small'],['micro','Micro']];
function upIn(list,size){ return size==='all'?list:list.filter(function(x){ return String(x.size||'').toLowerCase()===size; }); }
function upWord(){ var s=UP_SIZES.filter(function(x){ return x[0]===UP.size; })[0]; return UP.size==='all'?'':s[1]; }

function upRows(list){
  var out='', last=null;
  list.forEach(function(x){ var dte=String(x.date||'').slice(0,10); if(dte!==last){ out+='<div class="up-d">'+esc(dm(dte))+'</div>'; last=dte; }
    var href=x.bse_code?null:('/m/results?sym='+encodeURIComponent(x.symbol||'')); var sub=x.bse_code?('BSE code '+esc(x.bse_code)):esc(x.company||'');
    out+='<'+(href?'a href="'+href+'"':'div')+' class="up-r"><div><div class="up-s">'+esc(upName(x))+'</div><div class="up-c">'+sub+(x.size?'':'<i>unranked</i>')+'</div></div><span class="up-g">'+f2(x.gvm)+'<small>GVM</small></span></'+(href?'a':'div')+'>'; });

function upEmpty(){ var w=upWord(); return 'No '+(w?w+' ':'')+'results on the calendar in the next '+UP.days+' days.'; }

  h+='<div class="up-list">'+(ten.length?upRows(ten):'<div class="up-emp">'+upEmpty()+'</div>')+'</div>';

/* cc#2163: a sector's companies in the same sheet -- /companies?segment=<name> (the season's own rows, filtered server-side),

var CO={sector:null, rows:[], meta:null, key:'pat_yoy', asc:false, seq:0};
function stOpenCompanies(sector){

    if(!d||d.error){ coFail(d&&d.error); return; }
    CO.rows=d.rows||[]; CO.meta=d; drawCompanies();
  }).catch(function(){ if(my===CO.seq) coFail(); });
}
function coFail(msg){ document.getElementById('st-sheet-m').textContent='Could not load'; document.getElementById('st-sheet-b').innerHTML='<div class="st-emp">Could not load the companies'+(msg?': '+esc(msg):'')+'. <a href="#" id="co-retry" style="color:var(--brand);font-weight:800;text-decoration:none">Try again</a></div>'; var r=document.getElementById('co-retry'); if(r) r.addEventListener('click', function(e){ e.preventDefault(); stOpenCompanies(CO.sector); }); }
function drawCompanies(){
  var d=CO.meta||{}, m=d.season_medians||{}, n=(d.count!=null?d.count:CO.rows.length), total=d.total;
  document.getElementById('st-sheet-m').textContent=n+' filed'+(total!=null?' of '+total:'')+' · median profit '+pct(m.pat_yoy)+' · sales '+pct(m.sales_yoy);
  var rows=CO.rows.slice().sort(cmpBy(CO.key,CO.asc));
  var cols=[['symbol','Name'],['pat_yoy','Profit YoY'],['pat_qoq','Profit QoQ'],['sales_yoy','Sales YoY'],['sales_qoq','Sales QoQ'],['gvm','GVM']];
  var th=cols.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(CO.key===c[0]?'on'+(CO.asc?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=rows.map(function(r){ var basic=r.basis==='basic'; return '<tr><td><a href="/m/results?sym='+encodeURIComponent(r.symbol)+'">'+esc(r.symbol)+'<span class="st-dot'+(basic?' b':'')+'" title="'+(basic?'CSV-basic':'detailed filing')+'"></span><small>'+esc(r.company||'')+'</small></a></td><td class="'+cls(r.pat_yoy)+'">'+pct(r.pat_yoy)+'</td><td class="'+cls(r.pat_qoq)+'">'+pct(r.pat_qoq)+'</td><td class="'+cls(r.sales_yoy)+'">'+pct(r.sales_yoy)+'</td><td class="'+cls(r.sales_qoq)+'">'+pct(r.sales_qoq)+'</td><td class="st-gv'+((r.gvm||0)>=8?' gd':'')+'">'+f2(r.gvm)+'<small>'+esc(r.verdict||'')+'</small></td></tr>'; }).join('');
  var basicN=CO.rows.filter(function(r){ return r.basis==='basic'; }).length;
  var b=document.getElementById('st-sheet-b');
  if(!rows.length){ b.innerHTML='<div class="st-emp">No company in this sector has filed this season.</div>'; return; }
  b.innerHTML='<div class="st-co"><div class="wrap"><div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div></div>'
    +'<div class="st-co-f">'+(basicN?'CSV-basic rows carry no profit YoY (cc#1192 rule) — sales still shown.<br>':'')+'<a href="/m/results?view=companies&segment='+encodeURIComponent(CO.sector||'')+'">All filings, sortable ›</a></div></div>';
  b.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===CO.key) CO.asc=!CO.asc; else { CO.key=k; CO.asc=(k==='symbol'); } drawCompanies(); });
}
var ROWS=[], KEY='pat_yoy', ASC=false, COLS=[];
function cmpBy(key,asc){ return function(a,b){ var x=a[key], y=b[key]; if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; if(typeof x==='string') return asc? x.localeCompare(y) : y.localeCompare(x); return asc? x-y : y-x; }; }   // cc#2163: one sorter, NULLs last, for the companies view and the sector sheet
function tbl(){
  var rows=ROWS.slice().sort(cmpBy(KEY,ASC));
  var th=COLS.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(KEY===c[0]?'on'+(ASC?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=rows.map(function(r){ return '<tr>'+COLS.map(function(c){ var v=r[c[0]]; return '<td>'+(c[2]?c[2](v,r):esc(v==null?'—':v))+'</td>'; }).join('')+'</tr>'; }).join('');
  document.getElementById('tb').innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="foot">'+rows.length+' companies · tap a header to sort · dash = not filed yet</div>';
  document.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===KEY) ASC=!ASC; else { KEY=k; ASC=(k==='symbol'); } tbl(); });
}
function renderCompanies(d){
  var seg=(Q.segment||d.segment||'');   // cc#2164: a segment filter, from the URL (the fetch already asked for it)
  ROWS=(d.rows||[]).filter(function(r){ return !seg || (r.segment||'')===seg; });
  document.getElementById('pg-title').textContent=seg||'All filings'; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML= seg ? ('<b>'+ROWS.length+'</b> compan'+(ROWS.length===1?'y':'ies')+' · '+esc(seg)+' · <a class="clr" href="/m/results?view=companies">Clear filter</a>') : ('Season <b>'+esc(d.quarter||'—')+'</b> · '+d.count+' companies');
  document.getElementById('body').innerHTML='<div class="wrap" id="tb"></div>';
  var pc=function(v){return '<span class="'+cls(v)+'">'+pct(v)+'</span>';};
  COLS=[['symbol','Name',function(v,r){return '<a href="/m/results?sym='+encodeURIComponent(v)+'">'+esc(v)+(r.written?' <span class="gd">•</span>':'')+'<small>'+esc(r.segment||'')+'</small></a>';}],['pat_yoy','Profit YoY',pc],['sales_yoy','Sales YoY',pc],['pat_qoq','Profit QoQ',pc],['gvm','GVM',f2],['pe','P/E',f1],['reported','Filed',function(v){return esc(dm(v));}]];
  tbl();
}
/* cc#2169: Past results -- /companies rows with a filed date, size chips on top, the page's sortable table (Name · Filed · Sales YoY ·
   Profit YoY · GVM), default Filed desc with NULLs last; chip + sort state in the URL (?view=past&size=&sort=&dir=). */
var PT={rows:[], size:'all', key:'reported', asc:false, total:0}, PT_SIZES=[['all','All'],['large','Large'],['mid','Mid'],['small','Small'],['micro','Micro']];
function ptIn(list,size){ return size==='all'?list:list.filter(function(x){ return String(x.size||'').toLowerCase()===size; }); }
function ptWord(){ var s=PT_SIZES.filter(function(x){ return x[0]===PT.size; })[0]; return PT.size==='all'?'':s[1]; }
function ptSyncUrl(){ try{ var q=['view=past']; if(PT.size!=='all') q.push('size='+PT.size); if(PT.key!=='reported'||PT.asc) q.push('sort='+PT.key+'&dir='+(PT.asc?'asc':'desc')); history.replaceState(history.state,'','/m/results?'+q.join('&')); }catch(e){} }
function renderPast(d){
  document.getElementById('pg-title').textContent='Past results'; var bk=document.getElementById('back'); bk.style.display=''; bk.setAttribute('href','/m/results');
  PT.rows=(d.rows||[]).filter(function(r){ return !!r.reported; }); PT.total=(d.rows||[]).length;
  try{ var u=new URLSearchParams(location.search); var sz=String(u.get('size')||'').toLowerCase(); PT.size=(['large','mid','small','micro'].indexOf(sz)>=0)?sz:'all';
       var sk=u.get('sort'); if(sk&&['symbol','reported','sales_yoy','pat_yoy','gvm'].indexOf(sk)>=0){ PT.key=sk; PT.asc=(u.get('dir')==='asc'); } }catch(e){}
  document.getElementById('asof').innerHTML='Season <b>'+esc(d.quarter||'—')+'</b> · '+PT.rows.length+' filed of '+PT.total;
  document.getElementById('body').innerHTML='<div class="st-chips past-chips" id="pt-chips"></div><div class="wrap" id="pt-tb"></div>';
  ptDraw();
}
function ptDraw(){
  var chips=document.getElementById('pt-chips'), tb=document.getElementById('pt-tb'); if(!chips||!tb) return;
  chips.innerHTML=PT_SIZES.map(function(s){ return '<button type="button" class="up-chip" data-pt="'+s[0]+'" aria-pressed="'+(PT.size===s[0])+'">'+s[1]+'<small>'+ptIn(PT.rows,s[0]).length+'</small></button>'; }).join('');
  chips.querySelectorAll('.up-chip').forEach(function(b){ b.addEventListener('click', function(){ PT.size=b.getAttribute('data-pt'); ptSyncUrl(); ptDraw(); }); });
  var view=ptIn(PT.rows,PT.size).slice().sort(cmpBy(PT.key,PT.asc));
  var cols=[['symbol','Name'],['reported','Filed'],['sales_yoy','Sales YoY'],['pat_yoy','Profit YoY'],['gvm','GVM']];
  var th=cols.map(function(c){ return '<th data-k="'+c[0]+'" class="'+(PT.key===c[0]?'on'+(PT.asc?' asc':''):'')+'">'+c[1]+'</th>'; }).join('');
  var tr=view.map(function(r){ var basic=r.basis==='basic'; return '<tr><td><a href="/m/results?sym='+encodeURIComponent(r.symbol)+'">'+esc(r.symbol)+'<span class="st-dot'+(basic?' b':'')+'" title="'+(basic?'CSV-basic':'detailed filing')+'"></span><small>'+esc(r.company||'')+'</small></a></td><td>'+esc(dm(r.reported))+'</td><td class="'+cls(r.sales_yoy)+'">'+pct(r.sales_yoy)+'</td><td class="'+cls(r.pat_yoy)+'">'+pct(r.pat_yoy)+'</td><td class="st-gv'+((r.gvm||0)>=8?' gd':'')+'">'+f2(r.gvm)+'<small>'+esc(r.verdict||'')+'</small></td></tr>'; }).join('');
  var basicN=view.filter(function(r){ return r.basis==='basic'; }).length;
  if(!view.length){ tb.innerHTML='<div class="up-emp">No '+(ptWord()?ptWord()+' ':'')+'company has filed this season.</div>'; return; }
  tb.innerHTML='<div class="scroll"><table><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table></div><div class="past-foot">'+view.length+' of '+PT.total+' shown · tap a header to sort · dash = not filed or CSV-basic'+(basicN?'<br>CSV-basic rows carry no profit YoY (cc#1192 rule) — sales still shown.':'')+'</div>';
  tb.querySelector('thead').addEventListener('click', function(e){ var t=e.target.closest('th'); if(!t) return; var k=t.getAttribute('data-k'); if(k===PT.key) PT.asc=!PT.asc; else { PT.key=k; PT.asc=(k==='symbol'); } ptSyncUrl(); ptDraw(); });
}
function renderAnalysis(d){
  var n=d.numbers||{};
  document.getElementById('pg-title').textContent=d.symbol; document.getElementById('back').style.display='';
  document.getElementById('asof').innerHTML=(n.company?'<b>'+esc(n.company)+'</b> · ':'')+esc(n.segment||'')+(d.quarter?' · '+esc(d.quarter):'');
  var h='<div class="strip"><div><div class="k">Profit YoY</div><div class="v '+cls(n.pat_yoy)+'">'+pct(n.pat_yoy)+'</div></div><div><div class="k">Sales YoY</div><div class="v '+cls(n.sales_yoy)+'">'+pct(n.sales_yoy)+'</div></div><div><div class="k">Profit QoQ</div><div class="v '+cls(n.pat_qoq)+'">'+pct(n.pat_qoq)+'</div></div><div><div class="k">GVM</div><div class="v">'+f2(n.gvm)+'</div></div></div>';
  if(n.pat!=null||n.sales!=null) h+='<div class="strip"><div><div class="k">Sales</div><div class="v">'+cr(n.sales)+'</div></div><div><div class="k">Profit</div><div class="v">'+cr(n.pat)+'</div></div><div><div class="k">OPM</div><div class="v">'+(n.opm==null?'—':f1(n.opm)+'%')+'</div></div><div><div class="k">P/E · sector</div><div class="v">'+f1(n.pe)+' · '+f1(n.seg_pe)+'</div></div></div>';
  if(d.has_analysis){
    var secs=d.sections;
    if(secs&&typeof secs==='object'&&!Array.isArray(secs)&&Object.keys(secs).length){
      Object.keys(secs).forEach(function(k){ h+='<div class="card"><div class="ch"><span class="t">'+esc(k.replace(/_/g,' '))+'</span></div><div class="p">'+esc(secs[k])+'</div></div>'; });
    } else h+='<div class="card"><div class="ch"><span class="t">Result analysis</span><span class="n">'+esc(dm(d.polished_at))+'</span></div><div class="p">'+esc(d.analysis||'')+'</div></div>';
    h+='<div class="note"><b>'+esc(d.basis||'Scorr editorial')+'.</b> Written from the filing and the call. Not a recommendation.</div>';
  } else h+='<div class="card"><div class="emp"><b>No write-up for this one</b>'+(n.symbol?'The numbers above are from the filing. Nothing has been written about it yet.':'This symbol has not filed this season, or is outside the tracked universe.')+'</div></div>';
  document.getElementById('body').innerHTML=h;
}
var Q={}; try{ var u=new URLSearchParams(location.search); Q.sym=u.get('sym'); Q.view=u.get('view'); Q.segment=(u.get('segment')||'').trim(); }catch(e){}   // cc#2164: ?segment= narrows the companies view
var url = Q.sym ? '/api/mobile/results_app/analysis?symbol='+encodeURIComponent(Q.sym) : (Q.view==='companies' ? '/api/mobile/results_app/companies'+(Q.segment?'?segment='+encodeURIComponent(Q.segment):'') : (Q.view==='past' ? '/api/mobile/results_app/companies' : '/api/mobile/results_app/season'));   // cc#2169: ?view=past
fetch(url,{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
  if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
  Q.sym ? renderAnalysis(d) : (Q.view==='companies' ? renderCompanies(d) : (Q.view==='past' ? renderPast(d) : renderSeason(d)));
}).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load results.</div>'; });
</script>
</body></html>
