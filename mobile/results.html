<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Results · Scorr</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
</head>
<body>
<div class="screen">
  <div class="head"><h1>Results Corner</h1><div class="s" id="sub">loading…</div></div>
  <div class="body" id="body"><div class="loading">Loading calendar…</div></div>
  <div class="cover" id="cover"></div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/intel"><span class="i">▤</span>Intel</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
var HAS = {};   /* symbol -> true when analysis exists */
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function railHtml(r){ if(!r) return '';
  var s=(r.state||'CLOSED').toLowerCase();
  return '<span class="rail rail-'+s+'" title="'+esc(r.why||'')+'"><i></i>'+esc(r.state)+'</span>'; }
function rid(sym){ return 'an-'+sym.replace(/[^A-Za-z0-9]/g,''); }
function row(c){
  var has = !!HAS[c.symbol];
  return '<div class="rrow'+(has?' hasan" onclick="tapAn(\''+esc(c.symbol)+'\')"':'"')+'>'
    + '<span class="sy">'+esc(c.symbol)+'</span>'
    + (c.in_v8?'<span class="tag bull">V8</span>':'')
    + (has?'<span class="tag edt">READ</span>':'')
    + (c.event?'<span class="tag cat">'+esc(String(c.event).toUpperCase())+'</span>':'')
    + '<span class="nm">'+esc(c.name||'')+'</span></div>'
    + (has?'<div id="'+rid(c.symbol)+'"></div>':'');
}
function tapAn(sym){
  var host=document.getElementById(rid(sym));
  if (!host) return;
  if (host.innerHTML){ host.innerHTML=''; return; }
  host.innerHTML='<div class="an"><div class="loading" style="padding:2px">Loading analysis…</div></div>';
  fetchWithTimeout('/api/mobile/result_analysis?symbol='+encodeURIComponent(sym))
    .then(function(r){return r.json();})
    .then(function(d){
      if (d.error||!d.found){ host.innerHTML='<div class="an"><div class="src">No analysis available.</div></div>'; return; }
      host.innerHTML='<div class="an"><div class="read">'
        + String(d.text||'').split(/\n{2,}/).map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('')
        + '</div><div class="src">'+esc(d.quarter||'')+(d.polished_at?' · '+esc(d.polished_at):'')+'</div></div>';
    })
    .catch(function(e){ host.innerHTML='<div class="an"><div class="src">Could not load: '+esc(e.message)+'</div></div>'; });
}
function dayCard(d){
  var v8n = d.companies.filter(function(c){return c.in_v8;}).length;
  var sorted = d.companies.slice().sort(function(a,b){ return (b.in_v8?1:0)-(a.in_v8?1:0); });
  /* cc#1090 P7 dense sweep: the page asks for days=10, so ten day cards. The .rrow company
     rows INSIDE this card stay flat — slab-in-slab is the violation P8 greps for. */
  return '<div class="c ref slab dense"><div class="meta"><span class="dy">'+esc(d.label).toUpperCase()+'</span>'
    + '<span class="tag cat">'+d.n+' companies</span>'
    + (v8n?'<span class="tag bull">'+v8n+' in V8</span>':'')
    + '</div>' + sorted.map(row).join('') + '</div>';
}
Promise.all([
  fetchWithTimeout('/api/mobile/results?days=10&limit=120').then(function(r){return r.json();}),
  fetchWithTimeout('/api/mobile/result_analysis_index').then(function(r){return r.json();}).catch(function(){return null;})
]).then(function(res){
  var d=res[0], ix=res[1];
  if (d.error) throw new Error(d.error);
  if (ix && ix.symbols) ix.symbols.forEach(function(s){ HAS[s]=true; });
  document.getElementById('sub').innerHTML =
    d.total_in_window+' results in the next '+d.window_days+' days '+railHtml(d.rail);
  document.getElementById('body').innerHTML = (d.days||[]).length
    ? d.days.map(dayCard).join('')
    : '<div class="empty"><b>Quiet window</b>No results scheduled in the next '+d.window_days+' days.</div>';
  document.getElementById('cover').textContent = d.coverage||'';
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>'+esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sub').textContent='failed to load';
});
</script>
</body>
</html>
