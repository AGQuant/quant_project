try{var mc=document.querySelector('meta[name="theme-color"]'),fc=getComputedStyle(document.body).getPropertyValue('--field').trim();if(mc&&fc)mc.content=fc;}catch(e){}})();</script>
<!-- cc#1645 P3: shared appshell header (VARIANT B). Existing .screen content below is untouched. -->
<div class="as-hdr"><a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a><div class="as-pg"><span class="t">Intel</span></div><div class="as-slot"></div></div>
<!--
  cc#874 — INTEL, PROMOTED. The frozen review copy stays at previews/intel.html (item 9).
  cc#890 (Claude direct push, CHARTER_OVERRIDE_08AUG2026, session_log 17783) — preview fidelity
  pass: the preview shows ONE open editorial (the primary) and folds every later editorial to
  headline + summary + "Read ›". The live page expanded all of them, which buries the feed a
  screen and a half down. Now: editorial[0] open with body, editorial[1..] folded, tap opens the
  full text in place via the existing openFull(). Everything else already matched the preview.

  Contract: 12 values, all SOURCED (docs/PREVIEW_DATA_CONTRACT.md via /api/mobile/intel, reading
  v_polished_articles — cc#870 suppression inherited).
  DESIGN RULES (16170): header states the age of the NEWEST HEADLINE, never a refresh clock;
  AI Editorial leads; sentiment is a WORD chip; reading type 13.5px minimum; coverage stated.
-->
<div class="screen">

  <div class="head as-hide">
    <h1>Intel</h1>
    <div class="s" id="sub">loading…</div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="body" id="body">
    <div class="loading">Loading intel…</div>
  </div>

  <div class="cover" id="cover"></div>
</div>

<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>

<script>
/* One fetch for the whole screen (item 6). fetchWithTimeout is cc#878's shared helper. */
var STATE = { data: null, cat: 'All', open: {} };   // cc#993: which cards are expanded

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function sentClass(s){
  if (s === 'BULLISH') return 'bull';
  if (s === 'BEARISH') return 'bear';
  if (s === 'CAUTIOUS') return 'caut';
  return 'neut';
}

/* ══ cc#982 — COPY, MIRRORING THE WEB ═══════════════════════════════════════════════════════
   DISPLAY_PARITY (16202): the copied TEXT SHAPE is the web's, not a mobile invention.
   scorr_news.html shareText() is HEADLINE UPPERCASED + blank line + plainText(body), and
   plainText() is ported below character-for-character from that file — strip fenced code, inline
   code, images, link targets (keeping the label), heading hashes, blockquote marks, bold and
   italic wrappers, bullets to "• ", raw HTML tags, then collapse 3+ newlines. Diverging by even
   one rule would mean the same story copies differently depending on which screen you were on.

   FIELD MAP: the web reads headline_clean and (full_summary || summary); this payload carries
   headline and (body || summary), where `body` is the long form. Same intent, this endpoint's
   names — checked against the card renderer above rather than assumed.

   Classes are namespaced `nc-` : this app has collided four times on short class names
   (cc#964 .v/.m, cc#966 .m, cc#967 .v, cc#974 .a), and `.copy-btn` from the web would have been
   the fifth the moment the shared sheet grows one. */
var NC_COPY = 'Copy', NC_OK = 'Copied', NC_BAD = 'Press & hold';

function ncPlain(t){
  return String(t || "")
    .replace(/```[\s\S]*?```/g, "")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/(\*\*|__)(.*?)\1/g, "$2")
    .replace(/(\*|_)(.*?)\1/g, "$2")
    .replace(/^\s*[-*+]\s+/gm, "• ")
    .replace(/<[^>]+>/g, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}
function ncShareText(a){
  var head = String(a.headline || "").toUpperCase();
  var raw  = a.body || a.summary || "";
  return head + "\n\n" + ncPlain(raw);
}
function ncFallbackCopy(text){
  try {
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
/* the tap is swallowed BEFORE anything else: these buttons sit inside a card whose other controls
   fold and expand it (cc#913's bug class — a control that also triggers its container). */
function ncCopy(btn, ev){
  if (ev){ if (ev.preventDefault) ev.preventDefault(); if (ev.stopPropagation) ev.stopPropagation(); }
  var text = btn.getAttribute("data-copy") || "";
  function done(label, cls){
    btn.classList.remove("ok", "bad");
    if (cls) btn.classList.add(cls);
    btn.textContent = label;
    setTimeout(function(){ btn.classList.remove("ok", "bad"); btn.textContent = NC_COPY; }, 1500);
  }
  /* clipboard API needs a secure context and is absent on some /m/ webviews, so the textarea
     fallback is not decoration — it is the path a real user hits. If BOTH fail the button says
     what to do instead, rather than lying with a tick or firing an alert(). */
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(NC_OK, "ok"); },
      function(){ if (ncFallbackCopy(text)) done(NC_OK, "ok"); else done(NC_BAD, "bad"); });
  } else {
    if (ncFallbackCopy(text)) done(NC_OK, "ok"); else done(NC_BAD, "bad");
  }
}
function ncCopyBtn(a){
  var attr = esc(ncShareText(a)).replace(/\n/g, "&#10;");
  return '<button type="button" class="nc-copy" aria-label="Copy article"'
    + ' data-copy="' + attr + '" onclick="ncCopy(this,event)">' + NC_COPY + '</button>';
}

/* mode: 'open' = primary editorial with body; 'folded' = editorial as headline+summary+Read;
   'feed' = agency item. Preview grammar exactly. */
/* cc#1371 item 1 (sentiment capsule) — CHECKED, no change made here. The .tag.bull/.tag.bear/
   .tag.caut/.tag.neut rules (mobile_endpoints.py MOBILE_CSS ~line 1325-1334) already give the
   sentiment tag the EXACT SAME small-pill base as .tag.cat/.tag.edt/.tag.hi (8.5px mono,
   3px/7px padding, one bordered pill), all three sitting in the same .meta flex row. There is no
   oversized standalone banner here to shrink — logged as a QUESTION rather than guessed, since
   the founder screenshot that drove cc#1370/1371 may have been a different surface. */
function card(a, mode){
  var edge = sentClass(a.sentiment);
  var isEd = (mode === 'open' || mode === 'folded');
  var tags = '';
  if (isEd) tags += '<span class="tag edt">AI EDITORIAL</span>';
  else if (a.category) tags += '<span class="tag cat">' + esc(a.category.toUpperCase()) + '</span>';
  if (a.impact) tags += '<span class="tag hi">' + esc(a.impact) + '</span>';
  if (a.sentiment) tags += '<span class="tag ' + edge + '">' + esc(a.sentiment) + '</span>';

  /* cc#993: the FULL text is rendered inside the card and simply hidden until asked for, the
     same shape the web's toggleKb uses. Item 4 of the card: an item with no long body keeps
     behaving exactly as before — summary only, and NO button, because a control that opens
     nothing is a dead affordance (cc#924). */
  var isOpen = !!STATE.open[a.id];
  var full = a.body
    ? '<div class="read" id="body-' + a.id + '"' + (isOpen ? '' : ' style="display:none"') + '>'
      + String(a.body).split(/\n{2,}/).map(function(p){ return '<p>' + esc(p.trim()) + '</p>'; }).join('')
      + '</div>' : '';
  function foldBtn(more){
    return '<button class="fold" id="fold-' + a.id + '" data-more="' + esc(more) + '"'
      + ' onclick="openFull(' + a.id + ')">' + (isOpen ? 'Collapse \u2191' : more) + '</button>';
  }

  var bodyHtml = '';
  if (mode === 'open' && a.body) {
    /* the primary editorial keeps its cc#890 preview: first three paragraphs, then the control.
       Opening swaps the teaser for the full text rather than stacking a second copy under it. */
    var paras = String(a.body).split(/\n{2,}/).slice(0, 3)
      .map(function(p){ return '<p>' + esc(p.trim()) + '</p>'; }).join('');
    bodyHtml = (isOpen ? '' : '<div class="read">' + paras + '</div>')
             + full + foldBtn('Continue reading \u2193');
  } else if (mode === 'folded') {
    if (a.summary) bodyHtml = '<div class="sum">' + esc(a.summary) + '</div>';
    if (a.body) bodyHtml += full + foldBtn('Read \u203a');
  } else if (a.summary) {
    bodyHtml = '<div class="sum">' + esc(a.summary) + '</div>';
    if (a.body) bodyHtml += full + foldBtn('Read \u203a');
  } else if (a.body) {
    bodyHtml = full + foldBtn('Read \u203a');
  }

  var syms = (a.symbols || []).length
    ? '<div class="syms">' + a.symbols.slice(0, 6).map(function(s){
        return '<span class="sy">' + esc(s) + '</span>'; }).join('') + '</div>' : '';

  /* cc#1090 P4: the news card takes the shell, and takes .dense with it. This feed runs 40 items
     — the exact case the modifier exists for, since fifteen full 5px ledges down a screen stop
     reading as depth and start reading as stripes. The card stays tappable (Read > expands it in
     place), so it is a slab and not a pressed block. The .ed and edge modifier classes are
     untouched: they carry the 3px sentiment rail, which is the money language, not the shell. */
  return '<div class="c slab dense ' + (isEd ? 'ed ' : '') + edge + '">'
    + '<div class="meta">' + tags + '<span class="when">' + esc(a.when || '--') + '</span></div>'
    + '<div class="hl">' + esc(a.headline) + '</div>'
    + bodyHtml + syms
    /* cc#1371: the raw third-party source/wire-agency name (a.source) is DROPPED \u2014 universal
       across every news-card surface (founder screenshot feedback 28-Aug, applied here as the
       remainder of cc#1370's web/shared-component pass, commit 78410b0). Keeps only the polish
       timestamp (a.when_full). */
    + '<div class="src">' + (a.when_full ? esc(a.when_full) : '')
    + ncCopyBtn(a) + '</div>'
    + '</div>';
}

/* ── cc#993 · READ MORE EXPANDS THE CARD IN PLACE ──────────────────────────────────────────
   The founder REVERSED this card's original scope item 3 (an overlay) in favour of the website's
   behaviour, so this mirrors scorr_news.html's toggleKb: the body already lives inside the card,
   the button toggles it, and the label flips between reading and collapsing.

   WHAT THIS REPLACES, because it was worse than "inline vs overlay" made it sound: openFull()
   APPENDED a whole new card to the BOTTOM of the feed and smooth-scrolled to it. On a 40-item
   feed that was merely odd. On an all-time feed of 3,565 it would fling the reader to the end of
   everything they had loaded, and nothing brought them back.

   Expanding in place preserves the scroll position by construction — the card grows under the
   thumb and no other DOM moves. The open set lives in STATE.open so a chip switch (which does
   rebuild #body) does not silently collapse what the reader had opened. */
function openFull(id){
  var open = !STATE.open[id];
  STATE.open[id] = open;
  var box = document.getElementById('body-' + id);
  var btn = document.getElementById('fold-' + id);
  if (!box || !btn) { render(); return; }      // not on screen (filtered out) — rebuild instead
  box.style.display = open ? '' : 'none';
  btn.innerHTML = open ? 'Collapse \u2191' : (btn.getAttribute('data-more') || 'Read \u203a');
}

/* ── cc#1001 · CHIPS FROM THE SERVER 60-DAY COUNTS ─────────────────────────────────────────────
   cc#993 built chips from the LOADED set, so AI Editorial (few, deep in the stream) had no chip
   until the reader scrolled far enough to load one. The endpoint now ships category_counts over
   the full 60-day window, so EVERY nonzero chip is visible from first load with a true count. 'All'
   is the header total; a category with zero items in 60 days simply has no chip. */
function chipsHtml(){
  var cc = STATE.data.category_counts || {};
  var order = Object.keys(cc).filter(function(k){ return cc[k] > 0; });
  order.sort(function(x, y){ return cc[y] - cc[x] || x.localeCompare(y); });
  var total = (STATE.data.header && STATE.data.header.count) || 0;
  return [{label:'All', n: total}]
    .concat(order.map(function(k){ return {label:k, n:cc[k]}; }))
    .map(function(c){
      return '<button class="chip' + (c.label === STATE.cat ? ' on' : '') + '" onclick="pick(\'' +
        esc(c.label).replace(/'/g, "\\'") + '\')">' + esc(c.label) +
        ' <span class="n">' + c.n + '</span></button>';
    }).join('');
}

function render(){
  var d = STATE.data;
  /* cc#993: the header stated "in the last 48h" while the query enforced 48h. The query no
     longer does, so the claim goes with it — it now states the real span of what is on offer.
     Never display a window the query does not apply. */
  /* cc#1001: state the TRUE scope the query enforces \u2014 the last 60 days (window_days from the
     endpoint) \u2014 never a window the SQL does not apply; an explicit hours caller shows its window. */
  var hdr = 'newest headline ' + (d.header.newest || '--') + ' \u00b7 ' + d.header.count + ' items';
  if (d.header.window_days) hdr += ' \u00b7 last ' + d.header.window_days + ' days';
  else if (d.header.hours) hdr += ' in the last ' + d.header.hours + 'h';
  document.getElementById('sub').textContent = hdr;

  var total = d.header.count;
  document.getElementById('chips').innerHTML = chipsHtml();

  var eds  = d.editorials || [], feed = d.feed || [];
  if (STATE.cat !== 'All') {
    eds  = eds.filter(function(a){ return a.category === STATE.cat; });
    feed = feed.filter(function(a){ return a.category === STATE.cat; });
  }
  var html = '';
  if (eds.length){
    html += '<div class="sect">TODAY\'S EDITORIAL</div>';
    /* cc#890: preview fidelity — the FIRST editorial is the open reading card; every later
       editorial folds to headline + summary + Read, exactly as the approved preview shows. */
    html += eds.map(function(a, i){ return card(a, i === 0 ? 'open' : 'folded'); }).join('');
  }
  if (feed.length) html += '<div class="sect">THE FEED</div>'
                        + feed.map(function(a){ return card(a, 'feed'); }).join('');
  if (!html) html = '<div class="empty" id="filterEmpty"><b>Nothing in this filter yet</b>'
                  + 'Loading more stories filed under ' + esc(STATE.cat)
                  + ' from the last ' + ((d.header && d.header.window_days) || 60) + ' days\u2026</div>';
  document.getElementById('body').innerHTML = html + sentinelHtml();
  updateCover(eds.length + feed.length, total);
  armSentinel();
}

/* ══ cc#983 — INFINITE SCROLL ═══════════════════════════════════════════════════════════════
   The screen used to fetch 40 items once and stop: the founder's cover line read "showing 2 of
   95" with no way to reach the other 93 without leaving the page.

   WHY APPEND AND NOT RE-RENDER. render() rebuilds #body from scratch, which is right for a
   filter change and wrong for a scroll: rebuilding mid-scroll throws away the DOM under the
   founder's thumb and the browser drops his scroll position with it. So a loaded page is
   APPENDED — the existing cards are never touched — and only the filter path rebuilds.

   WHY A KEYSET CURSOR AND NOT A PAGE NUMBER: see the endpoint. Short version, an OFFSET would
   skip or repeat rows the moment a story is polished while you are scrolling.

   PAGING IS UNFILTERED ON PURPOSE (item 3): the fetch always pulls the next slice of the FULL
   set and the chip filter is applied client-side over everything loaded so far. Filtering
   server-side would make the chip counts lie about a set the client only partly holds. */
var PAGE = { cursor: null, more: true, busy: false, obs: null };

function sentinelHtml(){
  if (!PAGE.more) return '<div class="sum" id="sentinel" style="padding:18px 2px;text-align:center">'
    + 'You are all caught up — showing the last '
    + ((STATE.data && STATE.data.header && STATE.data.header.window_days) || 60) + ' days.</div>';
  return '<div class="sum" id="sentinel" style="padding:18px 2px;text-align:center">'
    + (PAGE.busy ? 'Loading more…' : '\u00a0') + '</div>';
}
function updateCover(shown, total){
  var el = document.getElementById('cover');
  if (el) el.textContent = 'showing ' + shown + ' of ' + total;
}
function visibleCount(){
  var d = STATE.data || {};
  var eds = d.editorials || [], feed = d.feed || [];
  if (STATE.cat !== 'All'){
    eds  = eds.filter(function(a){ return a.category === STATE.cat; });
    feed = feed.filter(function(a){ return a.category === STATE.cat; });
  }
  return eds.length + feed.length;
}
function armSentinel(){
  if (PAGE.obs){ PAGE.obs.disconnect(); PAGE.obs = null; }
  var el = document.getElementById('sentinel');
  if (!el || !PAGE.more) return;
  if (!('IntersectionObserver' in window)) return;   // no observer: the page simply stays one-shot
  PAGE.obs = new IntersectionObserver(function(entries){
    if (entries.some(function(e){ return e.isIntersecting; })) loadMore();
  }, {rootMargin: '400px'});                          // start early so the wait is invisible
  PAGE.obs.observe(el);
}
function loadMore(){
  if (PAGE.busy || !PAGE.more || !PAGE.cursor) return;
  PAGE.busy = true;
  var sent = document.getElementById('sentinel');
  if (sent) sent.textContent = 'Loading more…';
  fetchWithTimeout('/api/mobile/intel?limit=40&cursor=' + encodeURIComponent(PAGE.cursor))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      PAGE.cursor = d.next_cursor || null;
      PAGE.more   = !!(d.has_more && d.next_cursor);
      var d0 = STATE.data;
      /* de-dupe by id even though the keyset cursor should make repeats impossible — a duplicate
         card is the one failure a user would actually SEE, so it is cheap insurance. */
      var seen = {};
      (d0.editorials || []).concat(d0.feed || []).forEach(function(a){ seen[a.id] = 1; });
      var newEds  = (d.editorials || []).filter(function(a){ return !seen[a.id]; });
      var newFeed = (d.feed || []).filter(function(a){ return !seen[a.id]; });
      d0.editorials = (d0.editorials || []).concat(newEds);
      d0.feed       = (d0.feed || []).concat(newFeed);
      appendCards(newEds, newFeed);
      PAGE.busy = false;
      var s2 = document.getElementById('sentinel');
      if (s2) s2.outerHTML = sentinelHtml();
      /* cc#993: the chip counts describe the LOADED set, so they have to be refreshed as pages
         append — otherwise they would freeze at page 1 and understate every category. */
      document.getElementById('chips').innerHTML = chipsHtml();
      updateCover(visibleCount(), (STATE.data.total != null ? STATE.data.total : d.header.count));
      armSentinel();
      ensureFilterFilled();   // cc#1001: keep paging until the filtered category shows an item
    })
    .catch(function(e){
      PAGE.busy = false;
      var s3 = document.getElementById('sentinel');
      if (s3) s3.innerHTML = 'Could not load more \u00b7 '
        + '<button class="chip" onclick="loadMore()">Retry</button>';
    });
}
function appendCards(newEds, newFeed){
  /* respects the active chip: a page loads the full set, but only what matches is rendered now.
     The rest stays in STATE and appears if the founder switches back to All. */
  var eds = newEds, feed = newFeed;
  if (STATE.cat !== 'All'){
    eds  = eds.filter(function(a){ return a.category === STATE.cat; });
    feed = feed.filter(function(a){ return a.category === STATE.cat; });
  }
  if (!eds.length && !feed.length) return;
  /* cc#1001: the auto-fill (ensureFilterFilled) may have rendered the "Nothing in this filter yet"
     placeholder while paging toward this category's first item — remove it before the real cards land. */
  var fe = document.getElementById('filterEmpty'); if (fe) fe.parentNode.removeChild(fe);
  var body = document.getElementById('body');
  var sent = document.getElementById('sentinel');
  var html = '';
  /* every appended editorial is FOLDED: the one 'open' reading card is the first on the screen
     (cc#890), and a scroll must not mint a second one. */
  if (eds.length)  html += eds.map(function(a){ return card(a, 'folded'); }).join('');
  if (feed.length) html += feed.map(function(a){ return card(a, 'feed'); }).join('');
  var frag = document.createElement('div');
  frag.innerHTML = html;
  while (frag.firstChild) body.insertBefore(frag.firstChild, sent);
}

/* cc#1001 (item 4): if the reader filters to a category whose items are not on the loaded pages
   yet (e.g. AI Editorial, sparse and deep), keep paging WITHIN the 60-day window until an item of
   that category appears or the window is exhausted. The chip COUNT stays the server 60-day number;
   only the rendered list lazy-fills. Terminates: PAGE.more goes false at the window edge, or a
   matching item makes visibleCount() > 0. */
function ensureFilterFilled(){
  if (STATE.cat !== 'All' && visibleCount() === 0 && PAGE.more && !PAGE.busy) loadMore();
}
function pick(cat){ STATE.cat = cat; render(); ensureFilterFilled(); }

/* cc#993: no `hours` parameter — the endpoint's default is now the WHOLE table, newest to
   oldest, and the keyset cursor walks it to the true oldest row. */
fetchWithTimeout('/api/mobile/intel?limit=40')
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (d.error) throw new Error(d.error);
    STATE.data = d;
    PAGE.cursor = d.next_cursor || null;
    PAGE.more   = !!(d.has_more && d.next_cursor);
    render();
  })
  .catch(function(e){
    document.getElementById('body').innerHTML =
      '<div class="empty"><b>Could not load intel</b>' + esc(e.message) +
      '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
    document.getElementById('sub').textContent = 'failed to load';
  });
</script>
</body>
</html>
