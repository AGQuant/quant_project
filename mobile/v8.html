<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V8 · Scorr</title>
<link rel="stylesheet" href="/static/mobile_app.css">
<script src="/scorr_card_common.js"></script>
<style>
/* cc#1590 — /m/v8 rebuilt to design_refs/scorr_mobile_v8_R1.html (session_log 36482, founder
   order 02-Sep-2026): MOOD -> OPEN POSITIONS -> SECTORS -> DAY PERFORMANCE -> CLOSED -> FUNNEL.
   Shells (.pressed / .slab.dense / .well-up / .well) come from the shared sheet
   scorr_theme_r5.css, injected by main.py on every /m/* path. Nothing below redeclares them.
   Tokens: the ref's GOLD NIGHT block, declared on #v8p so they are page-local fallbacks and
   never reach another page. Money colours (--up / --down) are the app's own and stay untouched.
   Every rule is scoped under #v8p so the sheet's :root:root guards cannot restyle this page.
   Inner class names avoid the bare classes the shared sheets already declare (.v .c .g .m .bar
   .fill .word .row .sym .meta .more .big .pos .kv): a bare rule from mobile_app.css would add
   its own padding/border to them. So: .cl/.cv, .gword, .sbar, and prefixed names below. */
#v8p{
  --field:#0A0A0C; --panel:#17171B; --well:#131316; --sunk:#0C0C0F;
  --chalk:#F5F2EA; --mute:#8A8A93; --dim:#5E5E66; --line:#2A2A31;
  --gold:#D4AF37; --gold-lo:#7A6320; --gold-hi:#F0D070;
  --up:#2FD48B; --down:#FF5C6C; --amber:#FF9F45;
  --up-d:rgba(47,212,139,.14); --down-d:rgba(255,92,108,.14); --gold-d:rgba(212,175,55,.12);
  --display:'Archivo Black','Space Grotesk',system-ui,sans-serif;
  --body:'Space Grotesk','Sora',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;
  color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
  max-width:430px;margin:0 auto;padding:0 12px 96px;
}
#v8p *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#v8p .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#v8p .up{color:var(--up)} #v8p .dn{color:var(--down)} #v8p .mu{color:var(--mute)} #v8p .gd{color:var(--gold)}
#v8p .top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
#v8p .brand{font-family:var(--display);font-size:20px;letter-spacing:1px;color:var(--chalk)}
#v8p .brand b{color:var(--gold)}
#v8p .live{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mute)}
#v8p .live .dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up)}
#v8p .live .dot.off{background:var(--dim);box-shadow:none}
#v8p .live .pill{border:1px solid var(--line);padding:3px 8px;color:var(--up);clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
#v8p .live .pill.stale{color:var(--amber)}
#v8p .sect{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-family:var(--display);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);transform:skewX(-6deg);transform-origin:left center}
#v8p .sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-lo),transparent)}
#v8p .sect .n{font-family:var(--mono);color:var(--mute);letter-spacing:0;transform:none;font-size:11px}
#v8p .sect .r{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:0;transform:skewX(6deg)}
#v8p .asof{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px;text-align:right}
#v8p .asof.stale{color:var(--amber)}
#v8p .empty{font-size:13px;color:var(--mute);line-height:1.5}
#v8p .empty .chip{margin-top:10px}
#v8p .seg{display:flex;gap:4px;padding:4px;background:var(--well);border:1px solid var(--line);border-radius:9px}
#v8p .seg button{flex:1;border:0;background:transparent;color:var(--mute);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.5px;padding:8px 6px;border-radius:6px;cursor:pointer}
#v8p .seg button.on{background:var(--gold);color:var(--sunk);box-shadow:0 2px 0 var(--gold-lo)}
#v8p .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 9px;border:1px solid var(--line);background:var(--well);color:var(--mute);clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);cursor:pointer}
#v8p .chip.ok{color:var(--up);border-color:rgba(47,212,139,.35);background:var(--up-d)}
#v8p .chip.bad{color:var(--down);border-color:rgba(255,92,108,.35);background:var(--down-d)}
#v8p .chip.gd{color:var(--gold);border-color:rgba(212,175,55,.4);background:var(--gold-d)}
#v8p .tag{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:2px 6px;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
#v8p .tag.long{background:var(--up-d);color:var(--up)} #v8p .tag.short{background:var(--down-d);color:var(--down)}
#v8p .tag.bk{background:var(--gold-d);color:var(--gold)}
#v8p .tag.res{background:var(--well);color:var(--mute);border:1px solid var(--line)}
#v8p .tag.res.t{color:var(--up)} #v8p .tag.res.s{color:var(--down)} #v8p .tag.res.g{color:var(--amber)}
/* 1 · MARKET MOOD hero */
#v8p .hero .eyebrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
#v8p .hero .gword{font-family:var(--display);font-size:56px;line-height:.95;letter-spacing:-1px;margin:8px 0 6px;transform:skewX(-6deg);transform-origin:left center;color:var(--gold)}
#v8p .hero .gword.bear{color:var(--down);text-shadow:0 0 28px rgba(255,92,108,.35)}
#v8p .hero .gword.bull{color:var(--up);text-shadow:0 0 28px rgba(47,212,139,.35)}
#v8p .hero .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
#v8p .hero .sub b{color:var(--chalk);font-family:var(--mono)}
#v8p .checks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
#v8p .ck{padding:8px 6px 7px;text-align:center;border:1px solid var(--line);background:var(--well)}
#v8p .ck .cl{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:var(--mute)}
#v8p .ck .cv{font-family:var(--mono);font-size:15px;font-weight:800;margin-top:2px}
#v8p .ck.bad{border-color:rgba(255,92,108,.35)} #v8p .ck.bad .cv{color:var(--down)}
#v8p .ck.ok{border-color:rgba(47,212,139,.35)} #v8p .ck.ok .cv{color:var(--up)}
#v8p .slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#v8p .slot .l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--mute);margin-bottom:5px}
#v8p .slot .l b{color:var(--chalk);font-size:13px;letter-spacing:0}
#v8p .sbar{height:8px;background:var(--well);border:1px solid var(--line);overflow:hidden;clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
#v8p .sbar i{display:block;height:100%}
#v8p .sbar.buy i{background:linear-gradient(90deg,var(--up),var(--up-d))} #v8p .sbar.sell i{background:linear-gradient(90deg,var(--down),var(--down-d))}
#v8p .hero .foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
/* foot note */
#v8p .tbl-note{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px;line-height:1.5}
/* bottom nav: markup is the app's own (do_not_touch); the active tab takes the ref's gold */
#v8p ~ .bnav .bn.on,.bnav .bn.on{color:var(--gold,#D4AF37);text-shadow:0 0 10px rgba(212,175,55,.35)}
@media (prefers-reduced-motion:reduce){#v8p *{transition:none !important}}
</style>
</head>
<body>
<div id="v8p">
  <div class="top"><div class="brand">V<b>8</b></div><div class="live"><span class="dot off" id="tdot"></span><span id="tclock">V8</span> <span class="pill" id="tpill">loading</span></div></div>
  <div class="sect">Market mood <span class="r" id="mood-r"></span></div>
  <section class="pressed hero" id="sec-mood" aria-label="Market mood gate"><div class="empty">Loading the market gate…</div></section>
  <div style="height:18px"></div>
  <div class="tbl-note" style="text-align:center" id="foot-note">Numbers are the paper book.</div>
</div>
<nav class="bnav">
  <a class="bn" href="/m/home"><span class="i">◧</span>Home</a>
  <a class="bn" href="/m/gvm"><span class="i">◈</span>GVM</a>
  <a class="bn" href="/m/check"><span class="i">◎</span>Check</a>
  <a class="bn" href="/m/trades"><span class="i">☷︎</span>WoT</a>
  <a class="bn" href="/m/models"><span class="i">◍</span>Models</a>
</nav>
<script>
(function(){
'use strict';
/* ── fetch layer ─────────────────────────────────────────────────────────────────────────
   Every URL here was posted in the cc#1590 P1 discovery log. No endpoint is new, none is
   computed on the page: the book numbers are the canon's (rule 13 V8_PNL_CANON_V1). */
var URLS = {
  mood:   '/api/v8/market_mood',
  book:   '/api/mobile/v8book'
};
var STATE = { mood:null, book:null, fetchedAt:null };
function getJ(url){
  return fetchWithTimeout(url).then(function(r){ if(!r.ok) throw new Error(url+' '+r.status); return r.json(); });
}
/* ── format helpers ──────────────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(n){ return (typeof n==='number' && isFinite(n)); }
function inr(n, dp){
  if(!num(n)) return '—';
  var neg = n < 0, a = Math.abs(n);
  var s = a.toFixed(dp==null?0:dp), parts = s.split('.'), x = parts[0];
  var last3 = x.slice(-3), rest = x.slice(0,-3);
  if(rest) last3 = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  return (neg?'−':'') + '₹' + last3 + (parts[1] ? '.'+parts[1] : '');
}
function inrShort(n){
  if(!num(n)) return '—';
  var a = Math.abs(n), sign = n<0?'−':'';
  if(a >= 1e7) return sign+'₹'+(a/1e7).toFixed(2)+'Cr';
  if(a >= 1e5) return sign+'₹'+(a/1e5).toFixed(2)+'L';
  if(a >= 1e3) return sign+'₹'+(a/1e3).toFixed(1)+'k';
  return inr(n);
}
function pct(n, dp){ if(!num(n)) return '—'; var s = n.toFixed(dp==null?2:dp)+'%'; return (n>0?'+':n<0?'−':'') + s.replace('-',''); }
function px(n){ if(!num(n)) return '—'; return n.toLocaleString('en-IN',{maximumFractionDigits:2}); }
function sgn(n){ return !num(n)?'mu':(n>0?'up':n<0?'dn':'mu'); }
function pc(cls, txt){ return '<span class="'+cls+'">'+txt+'</span>'; }
/* IST wall-clock now, as a Date whose getters read IST (same trick as scorrAsofStamp; cc#844:
   never add 330 to a value that is already IST). */
function istNow(){ var n = new Date(); return new Date(n.getTime() + (330 + n.getTimezoneOffset())*60000); }
function hhmm(d){ return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function marketOpen(){ var d = istNow(), dow = d.getDay(), m = d.getHours()*60+d.getMinutes(); return dow>=1 && dow<=5 && m>=555 && m<=930; }
function asofLine(asof, extra){
  var st = window.scorrAsofStamp ? scorrAsofStamp(asof) : {txt:String(asof||''),amber:false};
  if(!st.txt && !extra) return '';
  return '<div class="asof'+(st.amber?' stale':'')+'">'+(extra?esc(extra)+(st.txt?' · ':''):'')+esc(st.txt)+'</div>';
}
function emptyBox(id, words){
  var el = document.getElementById(id); if(!el) return;
  el.innerHTML = '<div class="empty">'+esc(words)+'<br><span class="chip" data-retry="1">Retry</span></div>';
}
/* ── 1 · MARKET MOOD ─────────────────────────────────────────────────────────────────── */
function renderMood(){
  var m = STATE.mood, el = document.getElementById('sec-mood'), r = document.getElementById('mood-r');
  if(!m || !m.checks){ emptyBox('sec-mood', 'Market gate is not available right now.'); return; }
  var checks = m.checks || [], fails = num(m.fails) ? m.fails : checks.filter(function(c){ return !c.pass; }).length;
  var mood = String(m.mood||'—'), cls = /bear/i.test(mood) ? 'bear' : /bull/i.test(mood) ? 'bull' : '';
  var mode = cls==='bear' ? 'Engine is in sell mode.' : cls==='bull' ? 'Engine is in buy mode.' : 'Engine is balanced.';
  var bk = STATE.book || {}, usedL = bk.long && num(bk.long.n) ? bk.long.n : null, usedS = bk.short && num(bk.short.n) ? bk.short.n : null;
  var B = m.buy_slots, S = m.sell_slots;
  var LBL = {'ADR':'ADR','Nifty Day':'DAY','Nifty Week':'WEEK','Nifty Month':'MONTH'};
  var ck = checks.map(function(c){
    var ind = c.indeterminate || !num(c.value);
    var v = ind ? '—' : (c.filter==='ADR' ? c.value.toFixed(2) : pct(c.value, 2));
    return '<div class="ck '+(ind?'':(c.pass?'ok':'bad'))+'" title="'+esc(c.required||'')+'"><div class="cl">'+esc(LBL[c.filter]||c.filter)+'</div><div class="cv">'+v+'</div></div>';
  }).join('');
  function slot(name, used, total, kind){
    var w = (num(used) && num(total) && total>0) ? Math.max(0, Math.min(100, Math.round(used/total*100))) : 0;
    var lbl = num(used) ? used+' / '+(num(total)?total:'—') : (num(total) ? '— / '+total : '—');
    return '<div class="slot"><div class="l"><span>'+name+'</span><b>'+lbl+'</b></div><div class="sbar '+kind+'"><i style="width:'+w+'%"></i></div></div>';
  }
  var sub = mode + ' ' + (num(usedL) && num(usedS)
    ? 'Buy side: <b>'+usedL+' of '+(num(B)?B:'—')+'</b> buy slots, <b>'+usedS+' of '+(num(S)?S:'—')+'</b> sell slots in use.'
    : 'Slots: <b>'+(num(B)?B:'—')+'</b> buy, <b>'+(num(S)?S:'—')+'</b> sell.');
  var ad = m.adr_detail || {};
  var footL = 'ADR '+esc(ad.adr_date||m.checked_at||'')+' · Nifty D/W/M vs prev close';
  var footR = (num(ad.advances)&&num(ad.declines)) ? 'A '+ad.advances+' / D '+ad.declines : esc(m.nifty_source||'');
  el.innerHTML =
    '<div class="eyebrow"><span>Market gate</span><span>'+fails+' of '+checks.length+' checks failed</span></div>'+
    '<div class="gword '+cls+'">'+esc(mood)+'</div>'+
    '<div class="sub">'+sub+'</div>'+
    '<div class="checks">'+ck+'</div>'+
    '<div class="slots">'+slot('BUY SLOTS', usedL, B, 'buy')+slot('SELL SLOTS', usedS, S, 'sell')+'</div>'+
    '<div class="foot"><span>'+footL+'</span><span>'+footR+'</span></div>'+
    asofLine(STATE.fetchedAt, 'gate '+String(m.checked_at||'')+' · '+String(m.breadth_source||''));
  if(r) r.textContent = String(m.checked_at||'');
}
/* ── top bar ──────────────────────────────────────────────────────────────────────────── */
function renderTop(){
  var d = istNow(), open = marketOpen();
  document.getElementById('tdot').className = 'dot' + (open?'':' off');
  document.getElementById('tclock').textContent = (open ? 'Market open' : 'Market closed') + ' · ' + hhmm(d) + ' IST';
  var bk = STATE.book, pill = document.getElementById('tpill');
  if(bk && bk.as_of){
    var st = scorrAsofStamp(bk.as_of);
    pill.textContent = st.txt ? 'Book ' + st.txt : 'Book';
    pill.className = 'pill' + (st.amber ? ' stale' : '');
  } else { pill.textContent = 'Book not loaded'; pill.className = 'pill stale'; }
  var fn = document.getElementById('foot-note');
  if(bk && num(bk.brokerage_per_trade)) fn.textContent = 'Numbers are the paper book. ₹'+bk.brokerage_per_trade+' brokerage per closed trade.';
}
/* ── boot + 5-min refresh ─────────────────────────────────────────────────────────────── */
function renderAll(){ renderTop(); renderMood(); }
function load(){
  return Promise.all([
    getJ(URLS.mood).catch(function(){ return null; }),
    getJ(URLS.book).catch(function(){ return null; })
  ]).then(function(res){
    STATE.mood = res[0]; STATE.book = res[1];
    var d = istNow();
    STATE.fetchedAt = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+hhmm(d);
    renderAll();
  });
}
document.getElementById('v8p').addEventListener('click', function(e){
  var t = e.target.closest('[data-retry]'); if(t){ load(); }
});
load();
setInterval(function(){ if(document.visibilityState === 'visible') load(); }, 300000);
})();
</script>
</body>
</html>
