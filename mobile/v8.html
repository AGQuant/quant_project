<style>
/* cc#915 — this page keeps its own styling, per the cc#900 lesson: a shared-sheet change must
   never be able to restyle the V8 screen out from under it. */

/* 1 · MARKET MOOD */
.mood{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:13px 13px 12px 17px;margin:0 12px 9px;position:relative;overflow:hidden}
.mood::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.mood.bull::before{background:var(--grn)}
.mood.bear::before{background:var(--red)}
.mood.caut::before{background:var(--amber)}
.mood .mv{font-size:19px;font-weight:800;letter-spacing:-.01em}
.mood .mw{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mchip{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:700;
  padding:4px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--mut);
  background:var(--panel2)}
.mchip.ok{color:var(--grn);border-color:rgba(47,212,139,.4)}
.mchip.bad{color:var(--red);border-color:rgba(255,92,108,.4)}
.mchip b{color:var(--txt,#E9EEFB);font-weight:800}
.slotbar{display:flex;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.slotbar div{flex:1;text-align:center}
.slotbar .sk{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.slotbar .sv{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px;font-weight:800;margin-top:2px}

/* 2 · BOOK STAT ROW */
/* cc#976: THREE tiles, not four — one per fact about the active tab. Three cells at 360px get
   107px each instead of 79px, which is what lets "Long / Short" and "net of Rs16,500" fit. */
.bstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:0 12px 9px}
.stfade{animation:stf .15s ease}
@keyframes stf{from{opacity:0}to{opacity:1}}
/* below ~360px four money cells in a row stop being readable however short the string is, so they
   become 2x2 instead of being squeezed. A wrap the layout CHOOSES is fine; a number broken in
   half is not. */
@media (max-width:339px){.bstats{grid-template-columns:1fr 1fr}}
.bst{min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 5px;text-align:center}
.bst .k{font-size:9px;font-weight:800;letter-spacing:.07em;color:var(--dim);text-transform:uppercase}
/* founder 08-Aug: nowrap, never a number broken across two lines. cc#967 raises this to the Home
   trio token (.trio .st .v = 13.5px), so the 08-Aug fit calculation is redone here rather than
   left stale: at 360px the .bstats grid has 336px after the 12px margins, less 3 gaps of 7px,
   giving 78.75px per cell and 68.75px of content after the 5px side padding. At 13.5px Plex Mono
   (~0.6em advance) inrShort's widest 8-character output ("−₹99,999" / "₹1.43Cr") is ~65px, so it
   still fits — verified by measurement, not by this arithmetic alone. Below 360px the rule above
   already drops the row to 2x2 rather than squeezing. */
.bst .v{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:800;font-size:13.5px;
  margin-top:3px;white-space:nowrap;
  /* cc#967 — the tiles were clipping their own numbers, and it was NOT the font size.
     mobile_app.css owns a generic `.v` stat-card class (position:relative, background --panel2,
     1px border, radius 15, padding 15px 15px 12px 19px, margin-bottom 8, cursor pointer). This
     rule only out-specified it on font and margin-top, so all of that chrome applied: 34px of
     horizontal padding plus 2px of border inside a 67px cell left ~31px for the numeral.
     MEASURED: "Rs20,094" renders 52.7px at the OLD 12.5px and 56.9px at 13.5px — so both sizes
     were already being cut. This is a pre-existing defect the type-scale work surfaced, the third
     instance of the same collision (cc#964 found it on the D card, cc#966 on Home news).
     Reset the chrome, keep the tile's own look. */
  background:none;border:0;border-radius:0;padding:0;margin-bottom:0;min-height:0;
  position:static;cursor:inherit;overflow:visible}
.bst .v:before{content:none}
.bst .p{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:700;
  color:var(--dim);margin-top:2px}

/* 3 · INSTRUMENT SWITCH — small, top corner */
.insw{display:flex;gap:4px;align-items:center}
.insw button{min-height:26px;padding:0 9px;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;font-weight:800;letter-spacing:.07em;color:var(--mut);background:var(--panel);
  border:1px solid var(--line2);border-radius:7px;cursor:pointer}
.insw button.on{color:var(--blu,#4D7CFE);border-color:rgba(77,124,254,.5);background:rgba(77,124,254,.12)}
.insw button[disabled]{opacity:.38;cursor:not-allowed}

/* 4 · GROUPING CONTROL */
.grpb{display:flex;gap:6px;margin:0 12px 8px}
.grpb button{flex:1;min-height:30px;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--mut);background:var(--panel);
  border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.grpb button.on{color:var(--blu,#4D7CFE);border-color:rgba(77,124,254,.5);background:rgba(77,124,254,.12)}
.ghd{display:flex;align-items:baseline;gap:8px;margin:12px 12px 6px}
.ghd .gn{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim);flex:1}
.ghd .gs{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:700}

/* 5 · POSITION CARD */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:11px 12px 10px;margin:0 12px 8px}
.pc1{display:flex;align-items:center;gap:7px;min-height:26px}
.pc1 .sy2{font-size:14px;font-weight:800;letter-spacing:.01em}
.tagx{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:800;
  letter-spacing:.08em;padding:2px 6px;border-radius:5px;border:1px solid currentColor}
.tagx.long{color:var(--grn)}
.tagx.short{color:var(--red)}
.pc1 .bk{font-size:10px;color:var(--dim);margin-left:auto;text-align:right;flex:none}
.pvm{font-size:12px;line-height:1;margin-left:-2px}   /* cc#932 pivot marker */
.pc2{display:flex;align-items:baseline;gap:9px;margin:7px 0 2px}
.pc2 .pnl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:18px;font-weight:800;
  letter-spacing:-.01em}
.pc2 .ret{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;font-weight:700}
.pc2 .day{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;color:var(--dim);
  margin-left:auto}
/* the stop -> target rail. 0 = stop, 1 = target, for a long and a short alike. */
.rail2{position:relative;height:6px;border-radius:3px;background:var(--panel2);
  border:1px solid var(--line);margin:9px 0 5px;overflow:visible}
.rail2 .fillx{position:absolute;top:0;bottom:0;left:0;border-radius:3px;opacity:.55}
.rail2 .ent{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mut);border-radius:1px}
.rail2 .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;border:2px solid var(--bg,#0A0F1E)}
.lvls{display:flex;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;color:var(--dim)}
/* ── cc#943/942: two-page book — pills, dots, result badge ────────────────────────────────
   The pills sit exactly where the eye already is (above the first card) and the dots say which
   of two pages you are on, because a swipe with no indicator leaves you guessing whether the
   gesture worked. Both are also the desktop control: a tap toggle, no swipe needed there. */
.bkpg{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.bkpg .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  overflow:hidden;flex:1}
.bkpg .seg button{flex:1;min-height:38px;background:none;border:0;color:var(--dim);
  font-family:inherit;font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  cursor:pointer}
.bkpg .seg button.on{background:rgba(77,124,254,.16);color:var(--txt,#E9EEFB)}
.bkdots{display:flex;gap:5px;flex:none}
.bkdots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.bkdots i.on{background:var(--blu,#4D7CFE)}
.bktot{display:flex;align-items:baseline;gap:8px;padding:0 14px 8px;flex-wrap:wrap}
.bktot b{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:19px;font-weight:800}
.bktot span{font-size:10.5px;color:var(--dim)}
.rbadge{margin:0 auto;font-size:9px;font-weight:800;letter-spacing:.4px;padding:1px 5px;
  border-radius:4px;text-transform:uppercase}
.rbadge.good{background:rgba(47,212,139,.16);color:var(--volt, #2FD48B)}
.rbadge.bad{background:rgba(255,92,108,.16);color:var(--heat, #FF5C6C)}
.rbadge.neut{background:rgba(255,255,255,.07);color:var(--dim)}
.lvls span:nth-child(2){margin-left:auto}
.pc4{display:flex;flex-wrap:wrap;gap:9px;margin-top:7px;padding-top:7px;
  border-top:1px solid var(--line);font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;color:var(--dim)}
.pc4 b{color:var(--mut);font-weight:700}
.norail{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;color:var(--dim);
  margin:8px 0 4px;opacity:.7}
/* ── cc#922 navigation, cc#968 reduced to ONE chip bar ────────────────────────────────────── */
.navwrap{position:sticky;top:0;z-index:20;background:var(--bg,#0A0F1E);
  padding:2px 0 6px;margin-bottom:2px}
/* cc#968: one row that SCROLLS rather than wraps. Seven chips will not fit 360px, and a wrapping
   bar changes height as chips come and go — which moves the list under the founder's thumb every
   time he taps one. A fixed-height scroller never does. The scrollbar is hidden but the overflow
   is real, so a flick still works. */
.chipbar{display:flex;align-items:center;gap:5px;margin:0 12px 5px;overflow-x:auto;
  flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  /* cc#975: pan-x AND pan-y. The card specified pan-x alone, but pan-x literally forbids the
     browser from panning vertically for a gesture that starts on this element — measured: a
     vertical flick with the thumb on the bar scrolled the page 0px. That contradicts the card's
     own requirement that vertical page scroll be unaffected, so both axes are allowed: the bar
     takes horizontal, the page takes vertical, and neither has to guess.
     The cc#968 scroll-snap is GONE: proximity snapping fought short flicks near the end of the
     strip, and a filter bar has no page boundaries worth snapping to. */
  touch-action:pan-x pan-y}
.chipbar::-webkit-scrollbar{display:none}
.chipbar .sub{flex:0 0 auto}
/* a trailing spacer, not padding-right: a scroll container's right padding is dropped at the
   scroll end in several engines, which is exactly how a last chip ends up flush and unreadable. */
.chipbar::after{content:'';flex:0 0 12px;height:1px}
/* the fade sits on .navwrap, which is ALREADY position:sticky above — sticky is a containing
   block for an absolute child, so no position override is added here. Declaring
   .navwrap{position:relative} would have won on source order and silently un-stuck the bar. */
.navwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
  opacity:0;transition:opacity .15s;
  background:linear-gradient(to right,rgba(10,15,30,0),var(--bg,#0A0F1E))}
.navwrap.hasmore::after{opacity:1}
.subr{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 12px 5px}
.subk{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:800;
  letter-spacing:.12em;color:var(--dim);text-transform:uppercase;min-width:38px}
.sub{min-height:28px;padding:0 9px;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;font-weight:700;color:var(--mut);background:var(--panel);
  border:1px solid var(--line);border-radius:14px;cursor:pointer}
.sub i{font-style:normal;color:var(--dim);margin-left:3px}
.sub.on{color:var(--blu,#4D7CFE);border-color:rgba(77,124,254,.55);background:rgba(77,124,254,.12)}
.sub.on i{color:var(--blu,#4D7CFE)}
.sub.clr{color:var(--red);border-color:rgba(255,92,108,.4);letter-spacing:.08em}
.tierlab{display:flex;align-items:center}
/* ── cc#989 · marker legend behind an (i) ──────────────────────────────────────────────────
   `lg-` prefixed on EVERY class, leaves included. cc#986 proved that scoping a short name under
   a prefixed parent is not protection — the sheet's own generic rules still win. */
.lg-i{width:44px;height:44px;margin:-10px 0 -10px 6px;flex:none;display:inline-flex;
  align-items:center;justify-content:center;background:none;border:none;cursor:pointer;
  color:var(--dim);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;
  font-weight:800;line-height:1}
.lg-i span{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border:1px solid currentColor;border-radius:50%}
.lg-i.lg-on{color:var(--blu,#4D7CFE)}
.lg-panel{margin:0 12px 10px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px}
.lg-hd{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin-bottom:9px}
.lg-line{font-size:11.5px;line-height:1.65;color:var(--mut);padding:2px 0}
.lg-line + .lg-line{border-top:1px solid var(--line);margin-top:2px;padding-top:6px}
.lg-none{font-size:11.5px;line-height:1.6;color:var(--dim)}
.ghd{cursor:pointer}
.ghd .gx{font-size:11px;color:var(--dim);min-width:14px;text-align:right}
.tl2{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;color:var(--dim);
  font-weight:600;letter-spacing:0;text-transform:none}
.finote{margin:0 12px 8px;font-size:10.5px;line-height:1.5;color:var(--dim)}
/* ── cc#923: lighter card, detail on tap ──────────────────────────────────────────────────── */
.pcard{cursor:pointer}
.pcard.openx{border-color:var(--line2)}
.pc4 .pex{margin-left:auto;color:var(--blu,#4D7CFE);font-weight:700}
.pmore{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}

/* ══ cc#977 — LOWER MODULES, ported from previews/v8_lower_redesign.html ═══════════════════════
   The preview declared its own :root palette because it was a standalone file. Here the app
   tokens are used instead (--panel/--panel2/--line/--dim/--mut/--grn/--red/--blu): the preview's
   values are the same colours by a different name, and a second palette on the page is exactly
   how a screen starts drifting from the rest of the app. Class names are prefixed `l` — cc#974
   was the fourth collision with a short generic app class, and `.card`/`.hd`/`.body`/`.seg` from
   the preview would have been the fifth. */
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:0 12px 12px;
  overflow:hidden}
.lhd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  min-height:52px;cursor:pointer;gap:10px}
.lhd h2{font-size:17px;font-weight:700;margin:0}
.lright{display:flex;align-items:center;gap:10px;font-family:'IBM Plex Mono',ui-monospace,monospace}
.lchev{color:var(--mut);font-size:18px;line-height:1;transition:transform .18s;flex:none;
  display:inline-block}
.lcard.open .lchev{transform:rotate(90deg)}
.lbody{display:none;padding:0 16px 14px;border-top:1px solid var(--line)}
.lcard.open .lbody{display:block}
.lnote{font-size:11px;color:var(--mut);margin-top:10px;line-height:1.5}
.lwarn{font-size:11px;color:var(--amber);margin-top:8px;line-height:1.5}
.lmore{margin-top:10px;min-height:44px;width:100%;background:none;border:1px dashed var(--line2);
  border-radius:10px;color:var(--mut);font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.lnav{display:flex;justify-content:center;margin-top:12px}
.lnav a,.lnav button{border:1px solid rgba(77,124,254,.55);color:var(--pulse, #cfd9ff);background:none;
  border-radius:12px;padding:0 22px;min-height:44px;font-size:13px;text-decoration:none;
  display:flex;align-items:center;font-family:inherit;cursor:pointer}
/* module 1 */
.lspark{display:flex;align-items:flex-end;gap:3px;height:34px;margin:10px 0 4px}
.lspark i{flex:1;border-radius:2px 2px 0 0;min-height:3px;display:block}
.ldrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.ldrow:last-of-type{border-bottom:0}
.ldrow .dt{color:var(--dim)}
.ldrow .tc{color:var(--mut);font-size:12px;margin-left:auto;margin-right:8px}
.ldrow .pv{font-weight:700;white-space:nowrap}
/* module 2 */
.lpills{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none;
  touch-action:pan-x pan-y}
.lpills::-webkit-scrollbar{display:none}
.lpill{flex:none;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);
  border-radius:20px;padding:0 14px;min-height:36px;font-size:12.5px;cursor:pointer;
  font-family:inherit}
.lpill.on{background:rgba(77,124,254,.16);border-color:var(--blu);color:var(--pulse, #cfd9ff);font-weight:600}
.lpill i{font-style:normal;color:var(--mut);margin-left:4px}
.lfrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lfrow:last-of-type{border-bottom:0}
.lfrow .rank{width:20px;color:var(--mut);font-size:12px;text-align:right;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.lfrow .sym{font-weight:700;font-size:14px;border-bottom:1px dotted rgba(148,166,210,.45);
  cursor:pointer}
.lfrow .why{margin-left:auto;color:var(--dim);font-size:12px;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.lfrow .sc{font-weight:700;font-size:13.5px;width:44px;text-align:right;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
/* module 3 */
.lseggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lseg{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  cursor:pointer;min-width:0}
.lseg .nm{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lseg .v{font-size:15px;font-weight:700;margin-top:2px;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.lseg .n{font-size:10.5px;color:var(--mut);margin-top:1px}
.lsegwide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.lsegwide .v{font-size:17px}
/* item 5 · the signals line, and the Open Book chevron on the positions header */
.sigline{margin:0 12px 10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;font-size:12px;color:var(--dim)}
.sigline b{color:var(--txt,#E9EEFB)}
.tlgo{margin-left:auto;color:var(--mut);text-decoration:none;font-size:16px;padding:0 6px;
  min-height:44px;display:inline-flex;align-items:center}
</style>
