<script>
var STATE = { d: null, open: -1, funnels: {}, ledgerOpen: false, ledger: null, sm: null,
              mood: null, book: null, group: 'period', instrument: 'equity',
              sub: {}, pop: null, fold: {}, stars: {}, act: {}, legend: null,
              gates: {}, gateOpen: null,   // cc#986: per-symbol gate detail, and which one is open
              legendOpen: false,           // cc#989: marker legend, on demand behind the (i)
              page: 'open' };   // cc#943: which face of the book is showing   // cc#932: pivot markers by symbol

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pxv(v){ if (v==null||isNaN(Number(v))) return '--';
  var x=Number(v); return x<100?x.toFixed(1):Math.round(x).toLocaleString('en-IN'); }
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return (x < 0 ? '−' : '') + '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
/* cc#907's short scale, same rule, because a stat cell here is a quarter of a phone too */
function inrShort(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v), sign = x < 0 ? '−' : '', a = Math.abs(x);
  /* decimals shrink as the magnitude grows, so the STRING never does. Measuring the old version
     caught the case the eye misses: ₹100.00Cr is 9 characters and did not fit a 360px phone.
     With this ladder the widest possible output is 8 — "−₹99,999" or "−₹14.3Cr" — which fits
     every cell it is used in, at every viewport down to 320px. */
  if (a >= 1e7){
    var cr = a / 1e7;
    return sign + '₹' + (cr >= 100 ? Math.round(cr) : cr.toFixed(cr >= 10 ? 1 : 2)) + 'Cr';
  }
  if (a >= 1e5){
    var l = a / 1e5;
    return sign + '₹' + l.toFixed(l >= 10 ? 1 : 2) + 'L';
  }
  return sign + '₹' + Math.round(a).toLocaleString('en-IN');
}
function pctv(v, dp){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v); return (x >= 0 ? '+' : '') + x.toFixed(dp == null ? 2 : dp) + '%';
}
function cls(v){ return v == null ? '' : (Number(v) >= 0 ? 'grn' : 'redx'); }
function railCls(r){
  var s = (r && r.state || 'CLOSED').toUpperCase();
  return s === 'LIVE' ? 'live' : s === 'STALE' ? 'stale' : 'closed';
}
function strip(sym){
  try { if (window.ScorrCardRow) return window.ScorrCardRow(sym); } catch(e) {}
  return '';
}
function moodCls(m){
  m = (m || '').toLowerCase();
  if (m.indexOf('bull') > -1) return 'bull';
  if (m.indexOf('bear') > -1) return 'bear';
  return 'caut';
}

/* ══ 1 · MARKET MOOD + SLOTS ═══════════════════════════════════════════════════════════════
   Built from market_mood()'s OWN keys — mood, checks[], fails, buy_slots, sell_slots,
   total_slots, slot_note, checked_at. cc#887 caught this endpoint being read for verdict /
   gate_open / as_of, none of which it returns, so the gate card printed three nulls for weeks.
   Nothing here is invented: a chip exists only because checks[] carried it. */
function moodBlock(){
  var m = STATE.mood;
  if (!m) return '';
  /* cc#921 — THE REAL KEYS, READ FROM market_mood() THIS TIME. It returns each check as
     {filter, value, required, pass, indeterminate}. There is no label, no name and no ok — and
     cc#915 read exactly those three. So every chip printed a NAKED NUMBER with no colour: the
     bare "0.58" the founder saw is the ADR check. This is the cc#887/888 class of mistake and I
     made it again; fixed against the source rather than against another guess.
     Each chip now leads with WHAT the number is, and carries its pass rule in the title.
     REMOVED: the commentary line under the mood word. It was slot_note, whose literal value is
     "standard pool only (cc#502) -- no ring-fenced pools" — internal jargon quoting a card
     number on a retail screen. It told the founder nothing and it is gone. */
  var chips = (m.checks || []).map(function(c){
    var k = c.indeterminate ? '' : (c.pass ? ' ok' : ' bad');
    var v = (c.value == null) ? '--'
          : (typeof c.value === 'number' ? Number(c.value).toFixed(2) : String(c.value));
    return '<span class="mchip' + k + '" title="' + esc(String(c.filter || '')
      + (c.required ? ' · needs ' + c.required : '')) + '">'
      + '<b>' + esc(c.filter || '--') + '</b> ' + esc(v) + '</span>';
  }).join('');
  var slots = (m.buy_slots == null && m.sell_slots == null && m.total_slots == null) ? ''
    : '<div class="slotbar">'
      + '<div><div class="sk">Buy slots</div><div class="sv grn">' + (m.buy_slots == null ? '--' : m.buy_slots) + '</div></div>'
      + '<div><div class="sk">Sell slots</div><div class="sv redx">' + (m.sell_slots == null ? '--' : m.sell_slots) + '</div></div>'
      + '<div><div class="sk">Total</div><div class="sv">' + (m.total_slots == null ? '--' : m.total_slots) + '</div></div>'
      + '</div>';
  return '<div class="mood ' + moodCls(m.mood) + '">'
    + '<div class="mv">' + esc(m.mood || '--') + '</div>'
    + (chips ? '<div class="mchips">' + chips + '</div>' : '')
    + slots
    + (m.checked_at ? '<div class="mw" style="margin-top:8px;font-size:10px">Checked ' + esc(String(m.checked_at)) + '</div>' : '')
    + '</div>';
}

/* ══ 2 · BOOK STAT ROW ═════════════════════════════════════════════════════════════════════
   Open / Unrealised / Realised / Win-Loss. Realised and W/L come from /api/mobile/trades, which
   already computes them the web way (net of Rs.500 a trade, W/L = clean TARGET vs SL). They are
   NOT recomputed here — one computation, one answer, so this page cannot drift from the Home
   card or the web daylog.
   W/L RULE (card item 3): counts AND rate, and with no closed trades BOTH render "--", never a
   0% that reads like a real losing record. */
function statsBlock(){
  /* ══ cc#976 — ONE REACTIVE STAT ROW ═══════════════════════════════════════════════════════
     Was four static tiles ABOVE the tabs mixing both books at once: OPEN and UNREALISED describe
     the open book, REALISED and WIN/LOSS describe the closed one, and whichever tab you were on,
     half the row was about the other. Now it is THREE tiles that describe the ACTIVE tab, and it
     sits UNDER the tabs because that is what it is describing.

     Every figure comes from the cc#970 canon payload. Nothing is computed here — not the rate,
     not the brokerage netting, not the side split. That is the whole point of rule 13, and it is
     also why the old W/L rate arithmetic in this function is gone rather than moved. */
  var b = STATE.book;
  if (!b) return '';
  var open = STATE.page === 'open';
  function cell(k, v, p, c){
    return '<div class="bst"><div class="k">' + k + '</div>'
      + '<div class="v ' + (c || '') + '">' + v + '</div>'
      + '<div class="p">' + (p || '') + '</div></div>';
  }
  var cells;
  if (open){
    var L = b.long || {}, S = b.short || {};
    var split = ((L.n || 0) + '/' + (S.n || 0));
    cells = cell('Open', (b.open != null ? b.open : '--'),
                 (b.deployed != null ? inrShort(b.deployed) + ' in' : ''))
          + cell('Unrealised', inrShort(b.unrealised),
                 (b.unrealised_pct != null ? pctv(b.unrealised_pct) : ''), cls(b.unrealised))
          + cell('Long / Short', split, 'open per side');
  } else {
    /* ACCURACY prints a dash, never 0%, when nothing is decided — the cc#912 rule, and the canon
       already returns null rather than a zero for exactly this reason. Colour follows the RATE,
       not the mere presence of a number: a 2W/8L record must not render green. */
    var r = b.win_rate;
    cells = cell('Trades', (b.trades != null ? b.trades : '--'), 'closed')
          + cell('Accuracy', (r == null ? '--' : Math.round(r) + '%'),
                 (b.decided ? (b.wins + 'W/' + b.losses + 'L') : 'no verdicts'),
                 r == null ? '' : (r >= 50 ? 'grn' : 'redx'))
          + cell('Net', inrShort(b.realised),
                 (b.brokerage ? 'net of \u20B9' + Math.round(b.brokerage).toLocaleString('en-IN') : 'net'),
                 cls(b.realised));
  }
  /* keyed on the page so the browser rebuilds the node on a tab change and the fade actually
     runs; without the key it would patch text in place and never animate. */
  return '<div class="bstats stfade" data-page="' + (open ? 'open' : 'realised') + '">' + cells + '</div>';
}

/* ══ 3 · INSTRUMENT SWITCH ═════════════════════════════════════════════════════════════════
   Equity is the default and, today, the only real view. The Futures button is rendered but
   DISABLED with the reason on it, because the data carries no instrument field: v8_paper_positions
   is (id, symbol, side, basket, entry_price, entry_ts, qty, target, stop_loss, pp, pivot_date,
   status) and CMP is pinned to the spot bar by design (cc#367). Shipping an enabled Futures tab
   would be an empty box pretending to be a view. */
function inswBlock(){
  /* cc#924: the disabled FUTURES button relied on a hover title, and a phone has no hover — so
     the reason was invisible and the control was just dead. The button is HIDDEN until the data
     can back it (futures_available), leaving EQUITY as a plain label, and the reason is printed
     as a visible line in the book below instead. A control that cannot do anything is worse than
     no control; the fact still gets stated, just where it can actually be read. */
  var b = STATE.book;
  var fa = b ? b.futures_available : false;
  if (!fa) return '<button class="on" disabled>EQUITY</button>';
  return ['equity','futures'].map(function(x){
    return '<button class="' + (STATE.instrument === x ? 'on' : '') + '"'
      + ' onclick="setInstrument(\'' + x + '\')">' + x.toUpperCase() + '</button>';
  }).join('');
}
function setInstrument(x){ STATE.instrument = x; renderHead(); renderBook(); }   /* cc#1110 */

/* ══ 4 · NAVIGATION — GROUPING x SUBFILTER (cc#922) ════════════════════════════════════════
   The founder's words: navigation is poor, and the three cuts need a subfilter layer that a
   retail user gets without instructions. The interaction, stated for sign-off:

     ROW 1  GROUP BY: Period | Type | Side — a segmented control, exactly one active. It decides
            how the list is SPLIT INTO SECTIONS. Unchanged in meaning from cc#915.
     ROW 2  NARROW BY: chips for the OTHER TWO dimensions only, because filtering by the same
            dimension you are grouping by would just hide sections and teach nothing. Each chip
            carries its own live count. Tap to apply, tap again to clear. At most one chip per
            dimension, so the combinations stay explainable — "Period, only LONG" or "Type, only
            this week". A CLEAR chip appears when anything is on.

   THE COUNTS ARE FACETED, which is the part that makes it feel intuitive rather than fiddly:
   a chip's count is computed with every OTHER dimension's filter applied but NOT its own. So
   switching LONG to SHORT shows what you would actually get, and a chip never shows a count you
   cannot reach. A chip that would yield nothing is not rendered at all — no dead ends.

   Client-side throughout: /api/mobile/v8book already ships every field these cuts need, so no
   endpoint changed. Sticky while the list scrolls, per the observation. */
/* cc#968: GROUPING IS NOT A USER CHOICE ANY MORE. The PERIOD/TYPE/SIDE meta-buttons put two
   interaction models on one screen — buttons that changed how the list was SPLIT next to chips
   that changed which rows SURVIVED — and nothing on screen said which did which. One model now:
   CHIPS FILTER, PERIOD HEADERS GROUP. GROUPS[] and setGroup() are deleted, not hidden. */
var DIMS   = { basket: 'Type', side: 'Side' };
var GROUP_BY = 'period';                      // fixed, the cc#924 grouping
function setSub(dim, val){
  STATE.sub = STATE.sub || {};
  if (STATE.sub[dim] === val) delete STATE.sub[dim]; else STATE.sub[dim] = val;
  renderBook();   /* cc#1110 */
}
function clearSub(){ STATE.sub = {}; renderBook(); }   /* cc#1110 */

function weekStart(d){                        // Monday 00:00 of d's week
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function periodOf(p){
  if (!p.entry_date) return 'Undated';
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var q = p.entry_date.split('-');
  var e = new Date(Number(q[0]), Number(q[1]) - 1, Number(q[2]));
  if (e.getTime() === today.getTime()) return 'Today';
  var ws = weekStart(today);
  if (e >= ws) return 'This week';
  var lw = new Date(ws); lw.setDate(lw.getDate() - 7);
  if (e >= lw) return 'Last week';
  return 'Older';
}
var PERIOD_ORDER = ['Today','This week','Last week','Older','Undated'];
var DIMKEY = {
  period: periodOf,
  basket: function(p){ return p.basket_label || p.basket || '--'; },
  side:   function(p){ return p.side === 'SHORT' ? 'SHORT' : 'LONG'; }
};

/* rows passing every active subfilter, optionally ignoring one dimension (for faceted counts) */
function applySub(list, ignore){
  var sub = STATE.sub || {};
  return list.filter(function(p){
    for (var d in sub){
      if (!sub.hasOwnProperty(d) || d === ignore) continue;
      if (DIMKEY[d](p) !== sub[d]) return false;
    }
    return true;
  });
}
/* cc#968 — ONE CHIP BAR. [All n] then the two side chips then the four type chips, in one
   horizontally scrollable row directly under the headline.

   SELECTION: one SIDE chip and one TYPE chip may be active together (Short + Sell Momentum is a
   real question), tapping an active chip clears that dimension, and All clears everything. That
   is applySub()'s existing behaviour — it already ANDs across dimensions and stores one value per
   dimension — so the rule did not need new logic, only a smaller bar to drive it.

   COUNTS stay FACETED, which is the one thing worth keeping from the old bar: each chip counts
   with every OTHER dimension's filter applied but not its own, so switching Long to Short shows
   what you will actually get and a chip never advertises a count you cannot reach. A chip that
   would yield nothing is not rendered — no dead ends. */
function chipBar(all){
  var sub = STATE.sub || {};
  var anyOn = Object.keys(sub).length > 0;
  var h = '<button class="sub' + (anyOn ? '' : ' on') + '" onclick="clearSub()">All <i>'
        + all.length + '</i></button>';
  ['side', 'basket'].forEach(function(d){
    var pool = applySub(all, d);               // faceted: this dimension's own filter excluded
    var counts = {}, order = [];
    pool.forEach(function(p){
      var k = DIMKEY[d](p);
      if (counts[k] == null){ counts[k] = 0; order.push(k); }
      counts[k]++;
    });
    order.sort();
    order.forEach(function(k){
      if (!counts[k]) return;                  // a dead end is not offered
      var on = sub[d] === k;
      h += '<button class="sub' + (on ? ' on' : '') + '"'
        + ' onclick="setSub(\'' + d + '\',\'' + esc(k).replace(/'/g, "\\'") + '\')">'
        + esc(k) + ' <i>' + counts[k] + '</i></button>';
    });
  });
  return '<div class="chipbar">' + h + '</div>';
}

function groupPositions(list){
  var keyf = DIMKEY[GROUP_BY] || periodOf;
  var map = {}, order = [];
  list.forEach(function(p){
    var k = keyf(p);
    if (!map[k]){ map[k] = []; order.push(k); }
    map[k].push(p);
  });
  /* period is the only grouping now, so the canonical period order always applies. A group the
     filter emptied simply never appears in `map`, so it hides WITH its header by construction. */
  order = PERIOD_ORDER.filter(function(k){ return map[k]; });
  return order.map(function(k){ return { key: k, rows: map[k] }; });
}

/* ══ 5 · POSITION CARD (cc#923) ════════════════════════════════════════════════════════════
   Lighter by default, complete on tap. The founder does not want a C·A·R·D strip on every card
   — it repeated 18 times down the screen and competed with the numbers that matter.

   COLLAPSED the card answers "how is this trade doing": symbol, side, basket, P&L, return, day
   move, the stop->target rail, and FOUR facts — qty, entry, cmp, days held. Those four are the
   size, the price in, the price now, and how long it has been running.
   EXPANDED adds the C·A·R·D strip plus what was cut: capital deployed, the exact entry stamp,
   the target and stop levels, and this position's own price time.

   TAP RULES, and why one tap can never fire both: tapping the CARD expands it (bubble-phase
   onclick). Tapping the SYMBOL opens the cc#898 sheet — that handler is CAPTURE-phase and calls
   stopPropagation, so it runs first and the card's own onclick never sees the event. No
   data-scorr-skip here: putting it on the card would suppress the symbol sheet too, which is the
   opposite of what is wanted. */
function posTap(id){
  STATE.pop = (STATE.pop === id) ? null : id;
  renderBook();   /* cc#1110 */
}
/* cc#932 PIVOT_STAR_V2 marker (session_log 18052). SAME ENDPOINT as /dashboard —
   /api/v8/pivot_star — and the SAME server-supplied glyph and note, so the two surfaces cannot
   disagree (DISPLAY_PARITY 16202, "same component/endpoint, no fork"). Nothing is re-derived
   here: colour follows star_color, shape follows glyph, and the tooltip is the server's own
   facts-only star_note(), which is the V1 hard wall this card keeps. */
function pivotMark(sym){
  var s = (STATE.stars || {})[sym];
  if (!s) return '';
  var col = s.star_color === 'BLUE' ? '#4d7cfe' : '#f87171';
  /* cc#1018 MARKER_GLYPH_V3 (21764) retires the sell circle: BOTH sides draw a star, the colour
     alone carries the side. Drawn unconditionally, not read from the server `glyph` field, because
     a phone holding a CACHED pre-V3 payload still carries glyph='circle' for SELL and the old
     direction fallback did the same, so either read leaves a path that can still paint a sell circle.
     No shape variation is left to carry, so there is nothing to fork on; /dashboard's pivotStar()
     does exactly the same. */
  return '<span class="pvm" style="color:' + col + '" title="' + esc(s.note || '') + '">'
    + '\u2605</span>';
}
/* cc#1024 MARKER_GLYPH_V5 (session_log 22296): unusual activity is a LIGHTNING BOLT on both
   sides, retiring the cc#933 side-glyph rule and with it the last shape-by-side rule on the
   board. Volume and OI say "something is happening here", never "up" or "down", so the one
   marker with no direction in it was the last one still drawing one. Drawn unconditionally,
   never from the served glyph field -- a phone holding a cached pre-V5 payload still carries
   glyph='circle'/'star'. No colour styling: it is an emoji and renders in its own. */
function actMark(sym){
  var a = (STATE.act || {})[sym];
  if (!a) return '';
  return '<span class="pvm" title="' + esc(a.note || '') + '">\u26A1</span>';
}
/* cc#943/942 — ONE card renderer, TWO pages. The card explicitly asks for the realised page to
   use the SAME layout so the eye does not have to relearn it, and the way to guarantee that is a
   single function, not a second one that starts identical and drifts. `mode` swaps only what has
   to change: an open position shows CMP, day-move and a progress rail; a closed one shows the
   exit price, the exit reason and no rail — a finished trade has no progress left to draw, and a
   full or empty bar would both be a claim the data does not make. Every class name, every line
   position and the P&L typography are shared. */
function posCard(p, mode){
  var realised = (mode === 'realised');
  var val = realised ? p.realised : p.unrealised;
  var col = (val == null) ? 'var(--mut)'
          : (val >= 0 ? 'var(--grn,#2FD48B)' : 'var(--red,#FF5C6C)');
  var rail;
  if (realised){
    /* Same slot as the rail, so the two pages stay the same height per card: the levels line
       survives (it is still true — this is what the trade was aiming at) with the outcome badge. */
    var rc = p.result === 'TARGET' ? 'good' : (p.result === 'SL' ? 'bad' : 'neut');
    rail = '<div class="lvls"><span>SL ' + pxv(p.stop_loss) + '</span>'
      + '<span class="rbadge ' + rc + '">' + esc(p.result || 'CLOSED') + '</span>'
      + '<span>T ' + pxv(p.target) + '</span></div>';
  } else if (p.progress == null){
    rail = '<div class="norail">no target/stop</div>';   // cc#923: a quiet placeholder, not a sentence
  } else {
    var pctW = (p.progress * 100).toFixed(1);
    var ep = null;
    if (p.target != null && p.stop_loss != null && p.entry_price != null && p.target !== p.stop_loss){
      var span = p.side === 'SHORT' ? (p.stop_loss - p.target) : (p.target - p.stop_loss);
      var trav = p.side === 'SHORT' ? (p.stop_loss - p.entry_price) : (p.entry_price - p.stop_loss);
      if (span) ep = Math.max(0, Math.min(1, trav / span)) * 100;
    }
    rail = '<div class="rail2">'
      + '<div class="fillx" style="width:' + pctW + '%;background:' + col + '"></div>'
      + (ep == null ? '' : '<div class="ent" style="left:' + ep.toFixed(1) + '%"></div>')
      + '<div class="dot" style="left:' + pctW + '%;background:' + col + '"></div></div>'
      + '<div class="lvls"><span>SL ' + pxv(p.stop_loss) + '</span><span>T ' + pxv(p.target) + '</span></div>';
  }
  var open = STATE.pop === p.id;
  var more = open
    ? '<div class="pmore">' + strip(p.symbol)
      + '<div class="pc4" style="border-top:0;margin-top:8px;padding-top:0">'
      + '<span><b>' + inrShort(p.deployed) + '</b> deployed</span>'
      + '<span>target <b>' + pxv(p.target) + '</b></span>'
      + '<span>stop <b>' + pxv(p.stop_loss) + '</b></span>'
      + '<span>in ' + esc(p.entry_label || '--') + '</span>'
      + (realised ? '<span>out ' + esc(p.exit_label || '--') + '</span>'
                  : (p.cmp_at ? '<span>price ' + esc(p.cmp_at) + '</span>' : ''))
      + '</div></div>'
    : '';
  return '<div class="pcard' + (open ? ' openx' : '') + '" onclick="posTap(' + p.id + ')">'
    + '<div class="pc1"><span class="sy2">' + esc(p.symbol) + '</span>'
    + (realised ? '' : pivotMark(p.symbol) + actMark(p.symbol))
    + '<span class="tagx ' + (p.side === 'SHORT' ? 'short' : 'long') + '">' + esc(p.side) + '</span>'
    + '<span class="bk">' + esc(p.basket_label || '') + '</span></div>'
    + '<div class="pc2"><span class="pnl ' + cls(val) + '">' + inr(val) + '</span>'
    + '<span class="ret ' + cls(p.return_pct) + '">' + pctv(p.return_pct) + '</span>'
    + (realised ? '<span class="day">out ' + esc(p.exit_label || '--') + '</span>'
                : '<span class="day">day ' + pctv(p.day_pct) + '</span>')
    + '</div>'
    + rail
    + '<div class="pc4">'
    + '<span><b>' + Number(p.qty || 0).toLocaleString('en-IN') + '</b> qty</span>'
    + '<span>entry <b>' + pxv(p.entry_price) + '</b></span>'
    + '<span>' + (realised ? 'exit <b>' + pxv(p.exit_price) : 'cmp <b>' + pxv(p.cmp)) + '</b></span>'
    + '<span><b>' + (p.days_held == null ? '--' : p.days_held + 'd') + '</b> held</span>'
    + '<span class="pex">' + (open ? 'less ▴' : 'more ▾') + '</span>'
    + '</div>' + more + '</div>';
}

/* ══ cc#943 / cc#942 — ONE BOOK, TWO PAGES ════════════════════════════════════════════════════
   These two cards are the same founder request filed twice on the same day; built once.
   Page 1 unrealised (open positions), page 2 realised (closed trades), identical layout, reached
   by a horizontal swipe or by tapping the segmented pills. Both pages come from ONE payload, so
   they are guaranteed to be the same book at the same instant — a second fetch could land the
   pages on different scopes, which is exactly the drift cc#894 was filed for. */
function setBookPage(pg){
  if (STATE.page === pg) return;
  STATE.page = pg;
  STATE.pop = null;          // an expanded card belongs to the page it was opened on
  renderBook();   /* cc#1110 */
}
function bookHeader(b){
  var open = STATE.page === 'open';
  var v = open ? b.unrealised : b.realised;
  var pctv2 = open ? b.unrealised_pct : b.realised_pct;
  /* cc#968 item 2: with a chip active the headline states the FILTERED subset, because a total
     that ignores the filter under it is the number the founder would have to mentally undo.
     UNFILTERED the headline stays the payload's own figure — which on the realised page is the
     cc#970 canon, NET of brokerage. A filtered realised subtotal is deliberately GROSS of
     brokerage and labelled `sum`, not `realised`: brokerage is a whole-book cost and slicing it
     per chip would invent a per-slice fee the book never charged. */
  var _srcAll = open ? (b.positions || []) : (b.closed || []);
  var _filtered = Object.keys(STATE.sub || {}).length ? applySub(_srcAll) : null;
  var _fn = _filtered ? _filtered.length : null;
  if (_filtered){
    var _sum = 0, _known = false;
    _filtered.forEach(function(p){
      var x = open ? p.unrealised : p.realised;
      if (x != null){ _sum += x; _known = true; }
    });
    v = _known ? _sum : null;
    pctv2 = null;                       // a % of deployed for a slice is not on the payload
  }
  var seg = '<div class="bkpg"><div class="seg">'
    + '<button class="' + (open ? 'on' : '') + '" onclick="setBookPage(\'open\')">Unrealised</button>'
    + '<button class="' + (open ? '' : 'on') + '" onclick="setBookPage(\'realised\')">Realised</button>'
    + '</div><div class="bkdots"><i class="' + (open ? 'on' : '') + '"></i>'
    + '<i class="' + (open ? '' : 'on') + '"></i></div></div>';
  /* Same slot, same font on both pages — only the label and the number change (item 2). The win
     rate appears on the realised page only, because an open book has not won or lost anything
     yet, and a rate that counts unrealised P&L as a "win" would be a claim about a trade that is
     still running. A dash, never 0%, when nothing has closed. */
  /* cc#976 item 3 — THE BIG HEADLINE IS GONE. It printed the same unrealised/realised figure the
     stat row prints one line below it, so the page stated its own P&L twice. What the headline
     carried that the tiles do not is the FILTER state, so that survives as a thin line and only
     when a chip is active: unfiltered, the tiles say it all and this renders nothing.
     The whole-book win rate / brokerage / side-split tail that cc#968 gated is gone with it —
     those facts now live in the REALISED tiles, where they belong to the tab that owns them. */
  var line = '';
  if (_fn != null){
    var _sv = _known ? _sum : null;
    line = '<div class="bktot"><b class="' + cls(_sv) + '">' + inr(_sv) + '</b>'
      + '<span>' + _fn + (open ? ' open' : ' closed') + ' · filtered</span></div>';
  }
  return seg + statsBlock() + line;
}

function sideSplit(b){
  var L = b.rec_long || {}, S = b.rec_short || {};
  if (!L.decided && !S.decided) return '';   // no verdicts either side: say nothing, invent nothing
  function one(k, r){
    var rt = (r.rate == null) ? null : Number(r.rate);
    /* same founder bands as the Home face: >=60 green, 40-60 amber, <40 red; a dash is dim. */
    var col = (rt == null) ? 'var(--mut)'
            : (rt >= 60 ? 'var(--grn)' : (rt >= 40 ? 'var(--amber)' : 'var(--red)'));
    return '<b style="color:' + col + ';font-weight:700">' + k + ' '
      + (rt == null ? '—' : rt.toFixed(0) + '%') + '</b>'
      + (r.decided ? ' <span style="opacity:.75">' + r.wins + '/' + r.decided + '</span>' : '');
  }
  return '<br>' + one('Long', L) + ' · ' + one('Short', S);
}

function realisedBlock(b){
  var all = b.closed || [];
  if (!all.length)
    return '<div class="empty" style="margin:0 12px"><b>Nothing closed yet</b>'
      + 'No trades have been booked in this era.</div>';
  /* cc#968 item 4: ONE implementation, both pages. Closed trades carry the same `side` and
     `basket_label` fields the open rows do, so chipBar()/applySub() work here unchanged — the
     realised page did not need its own filter model, only the same one. */
  var bar = '<div class="navwrap">' + chipBar(all) + '</div>';
  var rows = applySub(all);
  if (!rows.length)
    return bar + '<div class="empty" style="margin:0 12px"><b>Nothing matches</b>'
      + 'Clear a filter to see trades again.</div>';
  /* Default sort: most recent exit first (item 4 / item 3). Sorted HERE on a real date key rather
     than trusting arrival order — the endpoint orders by exit_ts DESC today, and relying on that
     silently is how a list ends up in the wrong order the day the query changes. */
  var g = rows.slice().sort(function(a, c){
    var x = a.exit_ts || '', y = c.exit_ts || '';
    return x < y ? 1 : (x > y ? -1 : (c.id - a.id));
  });
  return bar + g.map(function(p){ return posCard(p, 'realised'); }).join('');
}

function bookBlock(){
  var b = STATE.book;
  if (b === 'loading') return '<div class="loading" style="padding:10px 14px">Loading the book…</div>';
  if (!b) return '<div class="more" style="margin:0 12px">Open book unavailable.</div>';

  var hdr = bookHeader(b);
  if (STATE.page === 'realised')
    return '<div id="bookpg" class="bookpg">' + hdr + realisedBlock(b) + '</div>';

  if (!b.positions.length)
    return '<div id="bookpg" class="bookpg">' + hdr
      + '<div class="empty" style="margin:0 12px"><b>No open positions</b>The book is flat.</div></div>';

  var all = b.positions;
  var rows = applySub(all);
  var h = '<div class="navwrap">' + chipBar(all) + '</div>';

  if (!rows.length)
    return '<div id="bookpg" class="bookpg">' + hdr + h
      + '<div class="empty" style="margin:0 12px"><b>Nothing matches</b>'
      + 'Clear a filter to see positions again.</div></div>';

  /* cc#924 item 3: on a big book the Older bucket starts collapsed — it is history, and it
     should not push today's positions off the first screen. Threshold is the book size, not the
     bucket's, because that is what makes the screen long. */
  var bulky = all.length > 12;
  h += groupPositions(rows).map(function(grp){
    var sum = 0, known = false;
    grp.rows.forEach(function(p){ if (p.unrealised != null){ sum += p.unrealised; known = true; } });
    var collapsed = (STATE.fold[grp.key] != null)
      ? STATE.fold[grp.key]
      : (bulky && grp.key === 'Older');
    return '<div class="ghd" onclick="foldGrp(\'' + esc(grp.key).replace(/'/g, "\\'") + '\')">'
      + '<span class="gn">' + esc(grp.key) + ' · ' + grp.rows.length + '</span>'
      + '<span class="gs ' + (known ? cls(sum) : '') + '">' + (known ? inrShort(sum) : '--') + '</span>'
      + '<span class="gx">' + (collapsed ? '▾' : '▴') + '</span></div>'
      + (collapsed ? '' : grp.rows.map(function(p){ return posCard(p, 'open'); }).join(''));
  }).join('');
  return '<div id="bookpg" class="bookpg">' + hdr + h + '</div>';
}
function foldGrp(k){
  var cur = STATE.fold[k];
  var bulky = (STATE.book && STATE.book.positions.length > 12);
  if (cur == null) cur = (bulky && k === 'Older');
  STATE.fold[k] = !cur;
  renderBook();   /* cc#1110 */
}

/* ── everything below is the screen as it already was: signals stack, ledger, more, legend ── */
/* ── cc#986 · FILTER FUNNEL ────────────────────────────────────────────────────────────────────
   What used to be here was a shape-guesser that ended in "funnel shape unrecognised". It never
   recognised anything because /api/v8/funnel/{basket} was answering 422 — its route decorator had
   been stranded on the wrong function since cc#424 (fixed in v8_endpoints.py in this same commit).
   This reads ONE mobile endpoint that serves the WEB's own funnel_detail + stock_passcount, so
   there is no second funnel implementation and no shape to guess. */
function funnelBlock(slug){
  var f = STATE.funnels[slug];
  if (f === undefined) return '';
  if (f === 'loading') return '<div class="fun">funnel: loading…</div>';
  if (!f) return '<div class="fun">funnel unavailable</div>';

  var h = '<div class="fn-wrap">';
  var st = f.stages || [];
  if (f.stages_error) {
    h += '<div class="fun">stage counts unavailable — ' + esc(f.stages_error) + '</div>';
  } else if (st.length) {
    var uni = Number(f.universe) || 0;
    h += '<div class="fn-h">Filter funnel · ' + (uni ? uni + ' in universe' : 'universe --') + '</div>'
      + '<div class="fn-st">'
      + st.map(function(s){
          /* The bar is survivors as a share of the universe. With no universe there is no bar —
             a full-width bar over an unknown denominator would be a made-up 100%. */
          var w = (uni && s.survivors != null) ? Math.max(0, Math.min(100, s.survivors / uni * 100)) : null;
          return '<span class="fn-g">' + esc(s.metric || s.key || '') + '</span>'
            + '<span class="fn-p">' + (s.survivors == null ? '--' : s.survivors) + '</span>'
            + '<span class="fn-k">' + (s.killed ? '-' + s.killed : '') + '</span>'
            + (w == null ? '<span class="fn-bar"></span>'
                         : '<span class="fn-bar"><i style="width:' + w.toFixed(1) + '%"></i></span>');
        }).join('')
      + '</div>';
    if (f.final != null) h += '<div class="fn-sum"><b>' + f.final + '</b> clear every gate '
      + '(strict AND)' + (f.as_of ? ' · ' + esc(f.as_of) : '') + '</div>';
  }

  if (f.rows_error) {
    h += '<div class="fun">pass list unavailable — ' + esc(f.rows_error) + '</div>';
    return h + '</div>';
  }
  var rows = f.rows || [];
  if (!rows.length) {
    /* Says WHY it is empty. "None clear every gate" and "all of them are already open" are two
       different facts and the reader should not have to guess which one this is. */
    h += '<div class="fn-sum">' + esc(f.message || 'Nothing passing and un-opened right now.') + '</div>';
    return h + '</div>';
  }
  h += '<div class="fn-h" style="padding-top:9px">Passing · not opened yet</div>';
  rows.forEach(function(r){
    var key = slug + '|' + r.symbol;
    var open = STATE.gateOpen === key;
    h += '<button class="fn-sym" onclick="togGate(event,\'' + esc(slug) + '\',\'' + esc(r.symbol) + '\')">'
      + '<span class="fn-s">' + esc(r.symbol) + '</span>'
      + '<span class="fn-b">' + (r.passed == null ? '' : r.passed + '/' + r.total)
        + (r.gvm == null ? '' : ' · GVM ' + Number(r.gvm).toFixed(2)) + '</span>'
      + '<span class="fn-x">' + (open ? '▴' : '▾') + '</span></button>';
    if (open) h += gateBody(key, r.symbol);
  });
  if (f.truncated > 0) h += '<div class="more">and ' + f.truncated + ' more passing, not opened</div>';
  return h + '</div>';
}

function gateBody(key, sym){
  var g = STATE.gates[key];
  if (g === undefined || g === 'loading') return '<div class="fn-body"><div class="fun">loading gates…</div></div>';
  if (!g) return '<div class="fn-body"><div class="fun">gate detail unavailable for ' + esc(sym) + '</div></div>';
  var rows = g.rows || [];
  if (!rows.length) return '<div class="fn-body"><div class="fun">no gate rows returned</div></div>';
  /* ACTUAL vs REQUIRED with a pass mark per gate, exactly as the endpoint returns them. Nothing is
     recomputed here and nothing is filled in — a gate the engine could not evaluate shows its own
     "--" rather than a guessed verdict. */
  return '<div class="fn-body">'
    + rows.map(function(r){
        return '<div class="fn-gate">'
          + '<span class="fn-n">' + esc(String(r.filter || '').replace(/_/g, ' ')) + '</span>'
          + '<span class="fn-v">' + esc(String(r.actual == null ? '--' : r.actual)) + '</span>'
          + '<span class="' + (r.pass ? 'fn-ok' : 'fn-no') + '">' + (r.pass ? '✓' : '✕') + '</span>'
          + (r.required ? '<span class="fn-q">needs ' + esc(String(r.required)) + '</span>' : '')
          + '</div>';
      }).join('')
    + '<div class="fn-sum"><b>' + (g.passed == null ? '--' : g.passed) + '</b> of '
      + (g.total == null ? '--' : g.total) + ' gates passed'
      + (g.cmp != null ? ' · CMP ' + Number(g.cmp).toFixed(2) : '') + '</div>'
    + '<div class="syrow"><span class="sy2">' + esc(sym) + '</span>' + strip(sym) + '</div>'
    + '</div>';
}

/* cc#986: ONE loader for the funnel payload, used by the lower-section module (the live surface)
   and by the basket-card path alike, so there is a single place that knows the endpoint. */
/* cc#989 · the legend is SERVER copy, rendered verbatim. /api/v8/pivot_star ships it (the text
   lives in v8_pivot_star.py so /dashboard and /m/v8 cannot word it differently — DISPLAY_PARITY
   16202, cc#932/933 rule) and it already enumerates all four marker families: amber Trade Check,
   blue/red pivot reversal, green unusual activity, and the shape-is-side rule. I checked before
   writing anything — no server-side line needed adding, and nothing here is hand-written. */
function legendPanel(){
  var L = STATE.legend;
  if (!L || !L.length)
    return '<div class="lg-panel"><div class="lg-hd">Marker legend</div>'
      + '<div class="lg-none">The legend could not be loaded this session. It comes from '
      + '/api/v8/pivot_star, so the markers on screen are still real \u2014 only this reference '
      + 'text is missing. Pull to refresh.</div></div>';
  return '<div class="lg-panel"><div class="lg-hd">Marker legend</div>'
    + L.map(function(x){ return '<div class="lg-line">' + esc(x) + '</div>'; }).join('')
    + '</div>';
}
function togLegend(ev){
  if (ev) ev.stopPropagation();          /* the card underneath has its own click handler */
  STATE.legendOpen = !STATE.legendOpen;
  renderLegend();   /* cc#1110: the panel node only — never the page under it */
}
/* Tap anywhere outside the panel or the (i) closes it. Bound ONCE on the document, not re-bound
   on every render — render() rewrites this subtree constantly and a per-render listener would
   stack up one handler per paint. */
if (!window.__lgBound){
  window.__lgBound = true;
  document.addEventListener('click', function(e){
    if (!STATE.legendOpen) return;
    var t = e.target;
    if (t && t.closest && (t.closest('.lg-panel') || t.closest('.lg-i'))) return;
    STATE.legendOpen = false; renderLegend();   /* cc#1110 */
  });
}

function ensureFunnel(slug){
  if (!slug || STATE.funnels[slug] !== undefined) return;
  STATE.funnels[slug] = 'loading';
  fetchWithTimeout('/api/mobile/v8funnel?basket=' + encodeURIComponent(slug))
    .then(function(r){ return r.json(); })
    .then(function(f){
      var b = (f && f.baskets && f.baskets[0]) || null;
      STATE.funnels[slug] = (b && !f.error) ? b : null;
      renderLower();   /* cc#1110 */
    })
    .catch(function(){ STATE.funnels[slug] = null; renderLower(); });
}

function togGate(ev, slug, sym){
  /* stopPropagation, or the tap bubbles to the basket card's own onclick and collapses the whole
     basket the instant you try to open a symbol inside it. */
  if (ev) { ev.stopPropagation(); if (ev.preventDefault) ev.preventDefault(); }
  var key = slug + '|' + sym;
  if (STATE.gateOpen === key) { STATE.gateOpen = null; renderLower(); return; }   /* cc#1110 */
  STATE.gateOpen = key;
  if (STATE.gates[key] === undefined) {
    STATE.gates[key] = 'loading';
    var f = STATE.funnels[slug];
    /* The path comes from the SERVER payload. There is no generic /stock_detail/{basket} route —
       the four are per-basket (br_/sr_/sm_/bm_) — so the map is made once, server-side, and the
       client never guesses which prefix a basket uses. */
    var base = (f && f.detail_path) || null;
    if (!base) { STATE.gates[key] = null; renderLower(); return; }   /* cc#1110 */
    fetchWithTimeout(base + encodeURIComponent(sym))
      .then(function(r){ return r.json(); })
      .then(function(d){ STATE.gates[key] = (d && !d.detail && !d.error) ? d : null; renderLower(); })
      .catch(function(){ STATE.gates[key] = null; renderLower(); });
  }
  renderLower();   /* cc#1110 */
}
function basketCard(b, i, rcls){
  var open = STATE.open === i;
  var buy = String(b.slug || '').indexOf('sell') !== 0;
  var last = (b.symbols && b.symbols[0] && b.symbols[0].at) ? 'Last new signal ' + esc(b.symbols[0].at) : 'No new signals';
  var h = '<div class="vc ' + rcls + (open ? ' openx' : '') + '" onclick="tog(event,' + i + ',\'' + esc(b.slug) + '\')">'
    + '<div class="vrow"><div class="ttl"><div class="n">' + esc(b.label) + '</div>'
    + '<div class="m">' + last + '</div></div>'
    + '<div class="val"><div class="v ' + (buy ? 'grn' : 'redx') + '">' + b.signals + '</div>'
    + '<div class="u">signal' + (b.signals === 1 ? '' : 's') + '</div></div>'
    + '<div class="v-chev">›</div></div>';
  if (open){
    h += funnelBlock(b.slug);
    h += (b.symbols || []).map(function(s){
      return '<div class="syrow"><span class="sy2">' + esc(s.symbol) + '</span>'
        + strip(s.symbol)
        + '<span class="at">' + esc(s.at || '') + '</span></div>';
    }).join('');
    if (b.truncated > 0) h += '<div class="more">and ' + b.truncated + ' more today</div>';
    if (!(b.symbols || []).length) h += '<div class="more">no symbols recorded</div>';
  }
  return h + '</div>';
}
function ledgerBlock(){
  var L = STATE.ledger;
  if (L === 'loading') return '<div class="more">loading ledger…</div>';
  if (!L) return '';
  var h = (L.trades || []).map(function(t){
    return '<div class="trow"><span class="sy2">' + esc(t.symbol)
      + ' <span class="mut" style="font-size:9.5px">' + esc(t.side) + ' · ' + esc(t.basket || '') + '</span></span>'
      + strip(t.symbol)
      + '<span class="mono2 mut">' + pxv(t.entry) + ' → ' + pxv(t.exit) + '</span>'
      + '<span class="mono2 ' + ((t.pnl || 0) >= 0 ? 'grn' : 'redx') + '">' + inr(t.pnl) + '</span></div>';
  }).join('');
  h += '<div class="fun" style="margin-top:12px"><b>DAY LOG</b></div>';
  h += (L.day_log || []).map(function(d){
    return '<div class="trow"><span class="sy2">' + esc(d.label) + '</span>'
      + '<span class="mono2 mut">' + d.n + ' trades · ' + d.wins + 'W/' + d.losses + 'L</span>'
      + '<span class="mono2 ' + ((d.pnl || 0) >= 0 ? 'grn' : 'redx') + '">' + inr(d.pnl) + '</span></div>';
  }).join('') || '<div class="more">no closed trades in the window</div>';
  return h;
}

/* ══ cc#1110 — SCOPED RENDER ══════════════════════════════════════════════════════════════════
   render() used to write document.getElementById('body').innerHTML for the WHOLE page, and every
   one of ~15 handlers called it: expanding a position, folding a group, switching a filter chip,
   opening a funnel symbol, toggling the legend, and a document-level click-away listener. So a tap
   on one card rebuilt every card on the screen. That is the shake the founder reported — the
   browser drops and re-lays-out the entire subtree, the scroll anchor goes with it, and any CSS
   entry animation on any section replays.

   The page is now five containers created ONCE, each re-rendered on its own:
     #sec-mood   mood + slots
     #sec-book   the book: tier label, legend slot, positions/trades
     #sec-sig    the one-line signal count
     #sec-lower  the three lower modules (funnel, day-wise, segments)
     #sec-more   the static More stack — painted at boot and never again
   A handler now touches only the section it belongs to. render() itself stays as the boot paint
   and as the one call that repaints everything, so nothing depends on remembering to add a new
   section to it. */
function shell(){
  var b = document.getElementById('body');
  if (document.getElementById('sec-book')) return;      /* already built — never rebuild it */
  b.innerHTML = '<div id="sec-mood"></div><div id="sec-book"></div><div id="sec-sig"></div>'
              + '<div id="sec-lower"></div><div id="sec-more"></div>';
}
function put(id, html){
  var el = document.getElementById(id);
  if (el) el.innerHTML = html;
}
function renderHead(){
  var d = STATE.d; if (!d) return;
  document.getElementById('sub').textContent = 'Long-short · ' + d.universe + ' symbols';
  var g = d.gate || {};
  var gc = document.getElementById('gate');
  gc.textContent = g.verdict ? 'GATE · ' + g.verdict.toUpperCase() : 'GATE --';
  gc.className = 'gatec' + (g.open === true ? ' open' : g.open === false ? ' shut' : '');
  document.getElementById('insw').innerHTML = inswBlock();
}
function renderMood(){ if (STATE.d) put('sec-mood', moodBlock()); }
function renderBook(){
  if (!STATE.d) return;
  put('sec-book', bookSection());
  bindBookSwipe();      /* both listeners sat on nodes this section just replaced */
  bindChipBar();
}
function renderSig(){
  var d = STATE.d; if (!d) return;
  var sigN = d.signals_today || 0;
  put('sec-sig', '<div class="sigline">' + (sigN
        ? '<b>' + sigN + '</b> signal' + (sigN === 1 ? '' : 's') + ' today'
          + ' <span class="m">· see Funnel below</span>'
        : 'No baskets signalled today.') + '</div>');
}
function renderLower(){ if (STATE.d) put('sec-lower', lowerModules()); }
function renderMore(){
  put('sec-more', '<div class="tierlab">More</div><div class="stack">'
    + '<a class="vc ref" href="/m/results"><div class="vrow">'
    + '<div class="ttl"><div class="n">Results</div><div class="m">Who reports next · blackout risk</div></div>'
    + '<div class="v-chev">›</div></div></a>'
    + '<a class="vc ref" href="/m/intel"><div class="vrow">'
    + '<div class="ttl"><div class="n">Intel</div><div class="m">Polished market news</div></div>'
    + '<div class="v-chev">›</div></div></a>'
    /* cc#991: the Wall of Trades — every entry and exit across every engine, not just V8's. It
       belongs in More rather than in the book above, because the book on this screen is the V8
       book and the wall deliberately is not. */
    + '<a class="vc ref" href="/m/trades"><div class="vrow">'
    + '<div class="ttl"><div class="n">Wall of Trades</div>'
    + '<div class="m">Every entry &amp; exit · all engines</div></div>'
    + '<div class="v-chev">›</div></div></a>'
    + '</div>');
}
/* cc#1110 item 3: the legend is inserted and removed as its own node. It used to toggle a flag and
   repaint the page, which is how an (i) button came to repaint the book under it. */
function renderLegend(){
  var slot = document.getElementById('lg-slot');
  if (slot) slot.innerHTML = STATE.legendOpen ? legendPanel() : '';
  var btn = document.querySelector('.lg-i');
  if (btn){
    btn.className = 'lg-i' + (STATE.legendOpen ? ' lg-on' : '');
    btn.setAttribute('aria-expanded', STATE.legendOpen ? 'true' : 'false');
  }
}

function render(){
  /* cc#1110 item 5: a failed /api/mobile/v8 leaves STATE.d null while the lower-module fetch is
     still in flight; when it resolved it called render() and died on d.rail, taking every handler
     on the page with it. The guard is the whole fix — the error box stays, and nothing throws. */
  if (!STATE.d) return;
  shell();
  renderHead();
  renderMood();
  renderBook();
  renderSig();
  renderLower();
  renderMore();
}

function bookSection(){
  var d = STATE.d;
  var rcls = railCls(d.rail);

  /* founder layout, top to bottom: mood+slots, book stats, switch (in the header), positions */
  /* cc#976 item 2: statsBlock moved OUT of here. It describes the active book page, so it is
     rendered by bookHeader() directly under the Unrealised/Realised tabs instead of floating
     above them as a second, unrelated metrics surface. */
  var h = '';
  /* cc#923 item 4: ONE as-of for the whole book, from the newest price stamp across positions —
     it was repeated on every card. cc#924 item 2: the futures reason is printed here, where a
     phone can actually read it, instead of in a hover title on a dead button. */
  var bk = STATE.book, asof = '';
  if (bk && bk.positions && bk.positions.length){
    var ts = bk.positions.map(function(p){ return p.cmp_at; }).filter(Boolean).sort();
    if (ts.length) asof = 'prices ' + esc(ts[ts.length - 1]);
  }
  /* cc#943: the label follows the page — "Open positions" over a list of closed trades would be
     the screen contradicting itself. The as-of stamp is a LIVE-PRICE stamp, so it belongs to the
     unrealised page only; a closed trade's price is its exit, not a quote that can go stale. */
  var realisedPg = (STATE.page === 'realised');
  /* cc#977 item 1: the Open Book nav CARD is gone, but its destination is not — the link lives
     here as a small chevron on the section it actually describes. */
  /* cc#989: the marker legend comes back as ON-DEMAND reference, not the permanent box cc#977
     deliberately removed. The (i) sits on the header of the section whose symbols carry the
     markers. It is never a dead button: with no legend loaded it opens and says so (cc#924). */
  h += '<div class="tierlab">' + (realisedPg ? 'Realised trades' : 'Open positions')
    + ((!realisedPg && asof) ? ' <span class="tl2">· ' + asof + '</span>' : '')
    + '<button class="lg-i' + (STATE.legendOpen ? ' lg-on' : '') + '" onclick="togLegend(event)"'
    + ' aria-label="What the markers mean" aria-expanded="' + (STATE.legendOpen ? 'true' : 'false')
    + '"><span>i</span></button>'
    + '<a class="tlgo" href="/m/positions" aria-label="Open Book, full screen">\u203a</a></div>'
    /* cc#1110 item 3: a stable slot the legend is inserted into and removed from, so opening it
       never repaints the book below. */
    + '<div id="lg-slot">' + (STATE.legendOpen ? legendPanel() : '') + '</div>'
    /* cc#977 item 1: the instrument_note dev paragraph ("V8 paper positions carry no instrument
       column...") is GONE. It was an engineering note explaining a schema limitation, rendered as
       if it were product copy. The FUT/EQ switch already shows the constraint by being disabled. */
    + bookBlock();

  return h;
}

/* cc#975: the right-edge fade only appears when there IS something further right, and clears when
   you reach the end — a fade over nothing is a hint that lies. Re-evaluated on scroll and on
   every render, because filtering changes how many chips there are. */
function bindChipBar(){
  var bar = document.querySelector('.chipbar');
  if (!bar) return;
  var sync = function(){
    var more = bar.scrollWidth - bar.clientWidth - bar.scrollLeft > 2;
    bar.parentNode.classList.toggle('hasmore', more);
  };
  bar.addEventListener('scroll', sync, {passive: true});
  sync();
}

/* ══ cc#977 — THE THREE LOWER MODULES ═══════════════════════════════════════════════════════
   Ported from previews/v8_lower_redesign.html (Fable first-build, ed43948) and wired to real
   data. The preview file stays untouched as the design record.

   ONE FETCH, /api/mobile/v8lower, because the three modules render together: the funnel is keyed
   to the newest signal_date and the segments to the newest v8_metrics score_date, so three
   separate requests could straddle a tick and let the modules disagree about "today".

   EVERY P&L FIGURE IS THE CANON (rule 13). Module 1's header total is book_canon()['realised']
   itself, not a sum of the rows it lists — so the module headline cannot drift from the stat
   tiles above it. The payload also ships day_sum, and the module SAYS SO if the two ever differ
   rather than quietly rendering one of them. Verified against the DB at build time: 11 day rows
   covering all 33 fresh-era trades, summing to 349,612.45 = the canon realised, exactly. */
var LOW = { d: null, err: null, open: { m1: true, m2: false, m3: false }, basket: null, segAll: false, dayAll: false };

function loadLower(){
  fetchWithTimeout('/api/mobile/v8lower')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.error) throw new Error(d.error);
      LOW.d = d; LOW.err = null;
      if (!LOW.basket && d.funnel && d.funnel.length) LOW.basket = d.funnel[0].basket;
      ensureFunnel(LOW.basket);   // cc#986: the selected basket's filter funnel, loaded with it
      renderLower();   /* cc#1110 */
    })
    .catch(function(e){ LOW.err = e.message || 'unavailable'; renderLower(); });   /* cc#1110 */
}
function lowTg(k){ LOW.open[k] = !LOW.open[k]; renderLower(); }   /* cc#1110 */
function lowBasket(b){ LOW.basket = b; ensureFunnel(b); renderLower(); }   /* cc#1110 */
function lowSegAll(){ LOW.segAll = !LOW.segAll; renderLower(); }   /* cc#1110 */
function lowDayAll(){ LOW.dayAll = !LOW.dayAll; renderLower(); }   /* cc#1110 */

function lowCard(key, title, right, body){
  var on = !!LOW.open[key];
  return '<div class="lcard' + (on ? ' open' : '') + '">'
    + '<div class="lhd" onclick="lowTg(\'' + key + '\')"><h2>' + title + '</h2>'
    + '<div class="lright">' + right + '<span class="lchev">\u203a</span></div></div>'
    + '<div class="lbody">' + body + '</div></div>';
}

function lowerModules(){
  if (LOW.err)
    return '<div class="lcard open"><div class="lhd"><h2>Lower section</h2></div>'
      + '<div class="lbody"><div class="more">Could not load: ' + esc(LOW.err)
      + ' <button class="v10rty" onclick="loadLower()">Retry</button></div></div></div>';
  if (!LOW.d)
    return '<div class="lcard open"><div class="lhd"><h2>Loading…</h2></div>'
      + '<div class="lbody"><div class="more">Fetching day log, funnel and segments…</div></div></div>';
  var d = LOW.d;
  return m1(d) + m2(d) + m3(d);
}

/* ── module 1 · day-wise net P&L ───────────────────────────────────────────────────────────── */
function m1(d){
  var rows = d.day_rows || [];
  var total = d.realised;
  /* the drift line. The header states the CANON total; day_sum is the same book added up a
     different way. They agree today (both 349,612.45). If they ever stop agreeing, the card says
     so out loud instead of picking one — a silent mismatch is how two screens start lying. */
  var drift = (d.day_sum != null && total != null && Math.abs(d.day_sum - total) > 0.5);
  var shown = LOW.dayAll ? rows : rows.slice(0, 7);
  var mx = 0;
  rows.forEach(function(r){ mx = Math.max(mx, Math.abs(r.net || 0)); });
  var spark = '<div class="lspark">' + rows.slice(0, 24).reverse().map(function(r){
      var v = r.net || 0, hpx = mx ? Math.max(3, Math.round(Math.abs(v) / mx * 34)) : 3;
      return '<i style="height:' + hpx + 'px;background:' + (v >= 0 ? 'var(--grn)' : 'var(--red)')
           + ';opacity:.85"></i>';
    }).join('') + '</div>';
  var list = shown.map(function(r){
    return '<div class="ldrow"><span class="dt">' + esc(r.label) + '</span>'
      + '<span class="tc">' + r.n + ' trade' + (r.n === 1 ? '' : 's')
      + (r.wins || r.losses ? ' · ' + r.wins + 'W/' + r.losses + 'L' : '') + '</span>'
      + '<span class="pv ' + cls(r.net) + '">' + inrShort(r.net) + '</span></div>';
  }).join('') || '<div class="more">No closed trades in this era yet.</div>';
  var more = (rows.length > shown.length)
    ? '<button class="lmore" onclick="lowDayAll()">' + (rows.length - shown.length)
      + ' more day' + (rows.length - shown.length === 1 ? '' : 's') + '…</button>'
    : (LOW.dayAll && rows.length > 7 ? '<button class="lmore" onclick="lowDayAll()">show less</button>' : '');
  var right = '<span class="' + cls(total) + '" style="font-weight:700">' + inrShort(total) + '</span>'
            + '<span class="m" style="font-size:12px">' + rows.length + ' day'
            + (rows.length === 1 ? '' : 's') + '</span>';
  var body = spark + list + more
    + (drift ? '<div class="lwarn">Day rows sum to ' + inrShort(d.day_sum)
               + ' against a canon total of ' + inrShort(total) + ' — reporting both.</div>' : '')
    /* the Trade Ledger destination the nav card used to own (item 1) */
    + '<div class="lnav"><button onclick="togLedger(event)">Trade ledger \u203a</button></div>'
    + (STATE.ledgerOpen ? ledgerBlock() : '')
    + '<div class="lnote">Net of \u20B9500 a closed trade · fresh era · retired baskets excluded.</div>';
  return lowCard('m1', 'Day-wise Net P&L', right, body);
}

/* ── module 2 · funnel top 10 ──────────────────────────────────────────────────────────────── */
function m2(d){
  var fs = d.funnel || [];
  if (!fs.length)
    return lowCard('m2', 'Funnel · Top 10', '<span class="m" style="font-size:12px">0 baskets</span>',
      '<div class="more">No qualifiers today.</div>');
  var cur = null;
  fs.forEach(function(f){ if (f.basket === LOW.basket) cur = f; });
  if (!cur) cur = fs[0];
  var pills = '<div class="lpills">' + fs.map(function(f){
      return '<button class="lpill' + (f.basket === cur.basket ? ' on' : '') + '"'
        + ' onclick="lowBasket(\'' + esc(f.basket) + '\')">' + esc(f.label)
        + ' <i>' + f.n + '</i></button>';
    }).join('') + '</div>';
  /* cc#985: the qualifying score is metrics->>'filter_score' out of filter_total — how many of
     THIS basket's own filter rules the symbol passed — which is what the web funnel shows and
     what "qualified" actually means. It is rendered as 9/10, not as a bare 9.0: the denominator
     differs per basket (10, 9 and 8 across the three live baskets today), so a lone numerator
     would silently compare unlike things down the column. cc#977 wrote `score` here, a column
     that does not exist, and took the whole endpoint down — see cc#985. */
  var list = (cur.rows || []).map(function(r, i){
    var sc = (r.score == null) ? '--'
           : (Number(r.score) + (r.score_total ? '/' + Number(r.score_total) : ''));
    return '<div class="lfrow"><span class="rank">' + (i + 1) + '</span>'
      + '<span class="sym" onclick="ScorrSymbolCard&&ScorrSymbolCard.open(\'' + esc(r.symbol) + '\')"'
      + ' data-sym="' + esc(r.symbol) + '">' + esc(r.symbol) + '</span>'
      + '<span class="why">' + (r.cmp == null ? '' : '\u20B9' + Math.round(r.cmp).toLocaleString('en-IN'))
      + (r.gvm == null ? '' : ' \u00b7 GVM ' + Number(r.gvm).toFixed(1)) + '</span>'
      + '<span class="sc">' + sc + '</span></div>';
  }).join('') || '<div class="more">No qualifiers today.</div>';
  var right = '<span class="m mono" style="font-size:12px">' + fs.length + ' basket'
            + (fs.length === 1 ? '' : 's') + '</span>';
  /* cc#986: the FILTER FUNNEL for the selected basket — stage counts, then the symbols that
     clear every gate but have no open position yet. It sits under the qualifier list because it
     answers the next question: not "what qualified" but "what passed and has not been taken". */
  var body = pills + list
    + funnelBlock(cur.basket)
    + '<div class="lnav"><a href="/m/screeners">Open full funnel \u203a</a></div>'
    + '<div class="lnote">Qualifiers for ' + esc(d.signal_date || 'the latest session')
    + ' · score is the basket\u2019s own qualifying score.</div>';
  return lowCard('m2', 'Funnel · Top 10', right, body);
}

/* ── module 3 · segments ───────────────────────────────────────────────────────────────────── */
function m3(d){
  /* cc#1042: these are the 22 curated Scorr THEMES the website shows, served ready-made by
     /m/api/v8lower, which calls the very same v8_theme_sectors() the web "All Futures" tab reads.
     The phone does no grouping of its own any more — it used to build 55 groups off the raw
     gvm_scores.segment column, 18 of them one stock deep.
     A theme that failed the server's 3-member guard arrives with day_pct null: it STAYS in the
     list and renders an em-dash, because dropping it would misreport the group set as smaller
     than it is, and printing 0.00% would be a lie. */
  var all  = d.segments || [];
  var segs = all.filter(function(s){ return s.day_pct != null; });
  var mute = all.filter(function(s){ return s.day_pct == null; });
  if (!all.length)
    return lowCard('m3', 'Segments', '<span class="m" style="font-size:12px">--</span>',
      '<div class="more">No segment data for the latest session.</div>');
  /* cc#1042 item 7: 22 tiles is a long scroll on a phone, so the default is the TOP 10 BY ABSOLUTE
     move — the ten themes that actually did something today, up or down, rather than five winners
     and five losers taken off the ends of a sorted list. Expand shows every theme, em-dashes too. */
  var byMove = segs.slice().sort(function(a, b){ return Math.abs(b.day_pct) - Math.abs(a.day_pct); });
  var shown  = LOW.segAll ? segs.concat(mute) : byMove.slice(0, 10);
  var nf = d.nifty;
  var head = nf
    ? '<div class="lseg lsegwide"><div><div class="nm">NIFTY 50</div>'
      + '<div class="n">' + (d.segment_count || all.length) + ' themes</div></div>'
      + '<div class="v ' + cls(nf.chg_pct) + '">' + (nf.chg_pct == null ? '--' : pctv(nf.chg_pct)) + '</div></div>'
    : '';
  var grid = '<div class="lseggrid">' + head + shown.map(function(s){
      var tot = s.members_total || s.n;
      /* cc#1110 item 1: these tiles used to each carry onclick=location.href='/m/sector'. Ten to
         twenty-two invisible full-page links sat in the middle of a stats grid, so a tap meant to
         read a number navigated away instead — the founder's "the page reloads". A grid of stats
         is not a nav control. The destination is not lost: it is ONE labelled link row at the
         bottom of this module, the same .lnav pattern modules 1 and 2 already use. */
      return '<div class="lseg"'
        + (s.suppressed ? ' title="' + esc(s.suppressed) + '"' : '') + '>'
        + '<div class="nm">' + esc(s.segment) + '</div>'
        + '<div class="v ' + (s.day_pct == null ? '' : cls(s.day_pct)) + '">'
        + (s.day_pct == null ? '—' : pctv(s.day_pct)) + '</div>'
        + '<div class="n">' + s.n + (s.n === tot ? '' : '/' + tot)
        + ' stock' + (tot === 1 ? '' : 's') + '</div></div>';
    }).join('') + '</div>';
  var right = '<span class="m mono" style="font-size:12px">' + all.length + '</span>';
  var body = grid
    + '<button class="lmore" onclick="lowSegAll()">'
    + (LOW.segAll ? 'show top 10 movers only' : 'show all ' + all.length + ' themes') + '</button>'
    /* cc#1042: the note here used to claim the move covered "every stock in the segment". It did
       not — the query behind it started FROM v8_metrics, which holds only the ~209 futures names,
       so the label described a computation that was not running (cc#1020 moved that wording in the
       wrong direction). The text below states exactly what runs: the cc#338 equal-weight average
       over each theme's futures members, which is deliberate — this book trades one lot per name,
       so the largest stock must not outvote the rest of its theme. */
    + '<div class="lnote">The 22 Scorr themes — same groups, same numbers as the website. Day move '
    + 'is the equal-weight average across a theme’s futures members, so one big name cannot carry '
    + 'the theme. A theme with fewer than 3 priced members shows —, never a number.</div>'
    /* cc#1110 item 1: the sector-intel destination, once, where it can be seen and chosen. */
    + '<div class="lnav"><a href="/m/sector">Sector intel ›</a></div>';
  return lowCard('m3', 'Segments · ' + (d.segment_count || all.length), right, body);
}

/* ══ cc#943 / cc#942 — HORIZONTAL SWIPE BETWEEN THE TWO PAGES ═════════════════════════════════
   Bound after every render because render() replaces the node the listeners were on.

   THE GESTURE HAS TO PROVE ITSELF HORIZONTAL FIRST, and this is not a nicety. The book is a tall
   scrolling list; a swipe handler that claims the touch immediately would fight every attempt to
   scroll past it. So the axis is decided once, on the first movement past a 10px threshold, and a
   vertical decision hands the touch straight back to the page and never looks at it again — the
   same rule the V10 chart drag already uses on Home, deliberately, so the two gestures behave
   identically. touchmove is passive:false ONLY because a horizontal swipe must be able to cancel
   the page's own scroll; nothing else is prevented.

   A tap inside a card must still expand it, so a movement under 45px does nothing at all. */
var BSW = null;
function bindBookSwipe(){
  var el = document.getElementById('bookpg');
  if (!el) return;
  el.addEventListener('touchstart', function(e){
    /* cc#975: a touch that STARTS inside a horizontal scroller is that scroller's, not the page
       deck's. #bookpg wraps the cc#968 chip bar, so without this the swipe handler claimed every
       horizontal drag on the chips: axis resolved to 'x', preventDefault() cancelled the browser's
       native scroll of .chipbar, and touchend past 45px flipped Unrealised/Realised instead. The
       bar was always scrollABLE — scrollWidth exceeded clientWidth the whole time — it was simply
       never allowed to scroll. Nothing is wrong with the CSS; the gesture was being taken. */
    if (e.target && e.target.closest && e.target.closest('.chipbar')){ BSW = null; return; }
    var t = e.touches[0];
    BSW = { x: t.clientX, y: t.clientY, axis: null };
  }, {passive: true});
  el.addEventListener('touchmove', function(e){
    if (!BSW) return;
    var t = e.touches[0], dx = t.clientX - BSW.x, dy = t.clientY - BSW.y;
    /* cc#1110 item 4: the axis was claimed at 10px on a bare |dx| > |dy|, so a thumb scrolling a
       tall book at a slight angle resolved to 'x' within a few pixels, preventDefault() killed the
       native scroll for the rest of the gesture, and the list stuck then snapped. The claim now
       needs 24px of travel AND horizontal dominance of 1.5x — a diagonal scroll stays vertical,
       and a deliberate page swipe still resolves well inside the 45px commit threshold. Once the
       axis is 'y' nothing is ever prevented, which was already true and stays true. */
    if (BSW.axis === null){
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      BSW.axis = (Math.abs(dx) > Math.abs(dy) * 1.5) ? 'x' : 'y';
    }
    if (BSW.axis === 'x' && e.cancelable) e.preventDefault();
  }, {passive: false});
  el.addEventListener('touchend', function(e){
    if (!BSW || BSW.axis !== 'x'){ BSW = null; return; }
    var t = (e.changedTouches && e.changedTouches[0]) || null;
    var dx = t ? t.clientX - BSW.x : 0;
    BSW = null;
    if (Math.abs(dx) < 45) return;                       // a tap or a twitch, not a page turn
    setBookPage(dx < 0 ? 'realised' : 'open');           // left = forward to realised, right = back
  }, {passive: true});
}

function tog(ev, i, slug){
  if (ev && ev.target && ev.target.closest && ev.target.closest('.scorr-card-strip')) return;
  STATE.open = (STATE.open === i ? -1 : i);
  if (STATE.open === i && STATE.funnels[slug] === undefined){
    ensureFunnel(slug); renderLower();   /* cc#1110 */
    return;
  }
  renderLower();   /* cc#1110 */
}
function togLedger(ev){
  if (ev && ev.target && ev.target.closest && ev.target.closest('.scorr-card-strip')) return;
  STATE.ledgerOpen = !STATE.ledgerOpen;
  renderLower();   /* cc#1110 */
}

Promise.all([
  fetchWithTimeout('/api/mobile/v8').then(function(r){ return r.json(); }),
  fetchWithTimeout('/api/v8/market_mood').then(function(r){ return r.json(); }).catch(function(){ return null; }),
  fetchWithTimeout('/api/mobile/trades?limit=20&days=30').then(function(r){ return r.json(); }).catch(function(){ return null; }),
  fetchWithTimeout('/api/mobile/v8book').then(function(r){ return r.json(); }).catch(function(){ return null; }),
  fetchWithTimeout('/api/v8/pivot_star').then(function(r){ return r.json(); }).catch(function(){ return null; })
]).then(function(res){
  var d = res[0], mood = res[1], L = res[2], bk = res[3], ps = res[4];
  // cc#932: a failed marker fetch must never blank the book — same guard the web uses.
  if (ps && ps.stars) ps.stars.forEach(function(x){ STATE.stars[x.symbol] = x; });
  // cc#933: activity markers ride in their own list — a symbol can carry a pivot marker AND an
  // activity marker, so they are kept in separate maps rather than one that would drop the second.
  if (ps && ps.activity) ps.activity.forEach(function(a){ STATE.act[a.symbol] = a; });
  if (ps && ps.legend) STATE.legend = ps.legend;
  if (d.error) throw new Error(d.error);
  STATE.d = d;
  STATE.mood = (mood && !mood.error) ? mood : null;
  if (L && !L.error){ STATE.ledger = L; STATE.sm = L.summary || null; }
  STATE.book = (bk && !bk.error) ? bk : null;
  render();
  /* cc#1110 item 5: loadLower() used to be the FIRST line of this callback, above the d.error
     throw. On a failed /api/mobile/v8 it still fired, and when its fetch resolved it called
     render() with STATE.d null — a TypeError on d.rail that killed every handler on the page,
     leaving the error box sitting over a screen where nothing worked. It now starts only after
     the payload is known good, and render() guards on STATE.d as well, so neither half can
     reintroduce it alone. The lower modules still fetch alongside and still never block the
     book — the call is after the paint, not after an await. */
  loadLower();
}).catch(function(e){
  document.getElementById('body').innerHTML =
    '<div class="empty"><b>Could not load</b>' + esc(e.message)
    + '<div style="margin-top:12px"><button class="chip" onclick="location.reload()">Retry</button></div></div>';
  document.getElementById('sub').textContent = 'failed to load';
});
</script>
</body>
