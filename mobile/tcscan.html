<script>
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dm(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3?(p[2]+' '+MON[Number(p[1])-1]):String(iso); }
function dmt(ts){ if(!ts) return '—'; var s=String(ts); return dm(s)+' '+s.slice(11,16); }
function pct(v,d){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(d==null?2:d)+'%'; }
function cls(v){ return v==null?'':(Number(v)>0?'pos':(Number(v)<0?'neg':'')); }
function ud(v){ return v==null?'mu':(Number(v)>0?'up':(Number(v)<0?'dn':'mu')); }
function inr(v,s){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x<0?'−':(s&&x>0?'+':''))+'₹'+Math.abs(Math.round(x)).toLocaleString('en-IN'); }
function f2(v){ return v==null?'—':Number(v).toFixed(2); }
var D=null, SIDE='ALL', DATE='', OSORT='pnl_desc';
/* cc#2101 item 5: exit-reason badge, established from the real API values (grep'd tc_scanner_endpoints.py,
   not guessed) -- OPEN/SL/TARGET/TIME are the only reasons this engine ever writes. Same .tag.res.{t|s|g}
   pill shape mobile/v8.html's resTag() uses (word lists differ, shape matches). */
function tcTagRes(reason){
  var r = String(reason||''); if(!r || r==='OPEN') return '';
  var c = r.indexOf('TARGET')===0 ? 't' : r==='TIME' ? 'g' : 's';
  var txt = r==='TIME' ? 'TIME STOP' : r;
  return '<span class="tag res '+c+'">'+esc(txt)+'</span>';
}
/* cc#2101 item 3: SL/entry/CMP/target rail -- TC Scanner had no bar before this card. Built on the
   shared scorr_position_row.js geometry (trkAxis/trkFrac/trkTickStyle; trkFixLabels runs after draw(), cc#2177), this page's own
   f2() price formatter and field names (target/sl/entry/cmp, not V8's stop_loss/entry_price). */
function tcTrkLabels(r, fz, fc, slEnd, tgtEnd){
  var ts = window.ScorrPositionRow.trkTickStyle;
  var enPx = f2(r.entry), cmpPx = r.cmp!=null ? f2(r.cmp) : '—';
  var bottom = '<i class="lbl end '+slEnd+'">SL '+f2(r.sl)+'</i><i class="lbl end '+tgtEnd+'">TGT '+f2(r.target)+'</i>';
  var top = fz == null
    ? '<i class="lbl tick cmp" style="'+ts(fc)+'">CMP '+cmpPx+'</i>'
    : '<i class="lbl tick entry" style="'+ts(fz)+'">ENTRY '+enPx+'</i>'
      + '<i class="lbl tick cmp" style="'+ts(fc)+'">CMP '+cmpPx+'</i>';
  return bottom + top;
}
/* cc#2101: replaces trow(). Row is no longer a bare <a href> link -- it matches V8's position-row
   shape (rail + TC capsule + tap-reveal C.A.R.D strip). item 4: pnl_pct stays the headline number
   (this engine's own convention, target/stop are percent-defined), pnl_rs/lot stays secondary --
   unchanged from before this card. item 2: r.score is used directly, no mkTc()-style lookup needed. */
function positionRow(r){
  var live = r.exit_reason==='OPEN';
  var SPR = window.ScorrPositionRow;
  var ax = SPR.trkAxis({target:r.target, stop_loss:r.sl});
  var mark = live ? r.cmp : r.exit;
  var fz = ax ? SPR.trkFrac(r.entry, ax) : null;
  var fc = ax ? SPR.trkFrac(mark, ax) : null;
  var trk;
  if(!ax || fc == null){
    trk = '<div class="trk none" title="no target or stop on this position"></div>';
  } else {
    var slFrac = SPR.trkFrac(r.sl, ax), slEnd = slFrac <= 0.5 ? 'l' : 'r', tgtEnd = slEnd==='l' ? 'r' : 'l';
    var pnlCls = r.pnl_pct==null ? 'flat' : (r.pnl_pct>0 ? 'win' : r.pnl_pct<0 ? 'loss' : 'flat');
    var fillFrom = (fz == null ? fc : fz);
    /* cc#2105 item 3a: win/loss background zones, split at the entry tick. ax.lo/ax.hi are built
       from exactly {target, sl} (trkAxis above), so slFrac is always exactly 0 or 1 -- SL sits at
       one extreme of the axis, target at the other, by construction, never a partial fraction.
       tgtFrac is therefore just the opposite extreme. No zones without a real entry fraction (fz
       null -- unknown/non-finite entry) -- same "nothing rendered instead of a guess" rule
       tcTrkLabels already applies to its own ENTRY tick. */
    var zones = '';
    if (fz != null) {
      var tgtFrac = 1 - slFrac;
      var lossL = Math.min(fz, slFrac), lossW = Math.abs(fz - slFrac);
      var winL = Math.min(fz, tgtFrac), winW = Math.abs(fz - tgtFrac);
      zones = '<i class="zone loss" style="left:'+Math.round(lossL*100)+'%;width:'+Math.round(lossW*100)+'%"></i>'
        + '<i class="zone win" style="left:'+Math.round(winL*100)+'%;width:'+Math.round(winW*100)+'%"></i>';
    }
    trk = '<div class="trk pnl-'+pnlCls+'">'
      + zones
      + '<i class="tfill" style="left:'+Math.round(Math.min(fillFrom,fc)*100)+'%;width:'+Math.round(Math.abs(fc-fillFrom)*100)+'%"></i>'
      + (fz==null?'':'<i class="z" style="left:'+Math.round(fz*100)+'%"></i>')
      + '<i class="cmp" style="left:'+Math.round(fc*100)+'%"></i>'
      + tcTrkLabels(r, fz, fc, slEnd, tgtEnd)
      + '</div>';
  }
  /* cc#2105 item 2: sub-line leads with the CURRENT marker (cmp, or out+exit) rather than
     restating "in {entry} -> ...": entry is already on the bar itself (tcTrkLabels' ENTRY tick,
     unchanged by this card, both live and closed), so repeating it here would just be the same
     number twice. Matches the mockup's own lean "cmp 156.65 - timestamp" shape while staying
     correct for the closed case the mockup never depicted (out <exit> - timestamp, no cmp). */
  var subMain = live ? (r.cmp!=null ? 'cmp <b>'+f2(r.cmp)+'</b>' : 'no price') : 'out <b>'+f2(r.exit)+'</b>';
  var sub = subMain + ' · ' + esc(dmt(live?r.entry_ts:r.exit_ts));
  var tc = '<span class="tcw">'+SPR.fnTcCapsule(r.score)+'</span>';
  // item 3: no marker/flag signal source exists for TC Scanner (unlike V8's mkFired/mkKeys) -- that
  // slot is simply not rendered, per the card's own explicit allowance, never fabricated.
  // cc#2105: the TC capsule moved up into .sub (above) -- mkrow now carries only the exit-reason
  // tag, do_not_touch's own instruction (tcTagRes stays in mkrow, unaffected by this card). Empty
  // for every OPEN row (tcTagRes returns '' for reason==='OPEN'); the bare <div> then collapses to
  // zero height same as it always has, nothing new to guard.
  var mkrow = tcTagRes(r.exit_reason);
  return '<div class="scorr-prow '+ud(r.pnl_pct)+'" data-card-strip="'+esc(r.symbol)+'">'
    + '<div class="hd"><div class="nm">'+esc(r.symbol)+'<span class="tag '+(r.side==='BUY'?'b':'s')+'">'+(r.side==='BUY'?'Long':'Short')+'</span></div>'
    + '<div class="v"><div class="n '+cls(r.pnl_pct)+'">'+pct(r.pnl_pct)+'</div><div class="c">'+(r.pnl_rs!=null?'('+inr(r.pnl_rs,true)+'/lot)':'(no lot)')+'</div></div></div>'
    + '<div class="sub">'+sub+tc+'</div>'
    + trk
    + '<div class="mkrow">'+mkrow+'</div>'
    + '<div class="rowstrip" style="display:none"></div></div>';
}
function pick(o){ var a=[]; if(SIDE!=='SHORT') a=a.concat(o.buy||[]); if(SIDE!=='LONG') a=a.concat(o.sell||[]); return a; }
/* cc#2101 item 6: sort control for the Open list, which was always P&L-desc with no user choice. */
var OSORT_OPTS = [['pnl_desc','P&L ↓'],['pnl_asc','P&L ↑'],['new','Newest'],['old','Oldest']];
function sortOpen(rows){
  var r = rows.slice();
  if(OSORT==='pnl_desc') r.sort(function(a,b){return (b.pnl_pct||0)-(a.pnl_pct||0);});
  else if(OSORT==='pnl_asc') r.sort(function(a,b){return (a.pnl_pct||0)-(b.pnl_pct||0);});
  else if(OSORT==='new') r.sort(function(a,b){return String(b.entry_ts||'').localeCompare(String(a.entry_ts||''));});
  else if(OSORT==='old') r.sort(function(a,b){return String(a.entry_ts||'').localeCompare(String(b.entry_ts||''));});
  return r;
}
/* cc#2176: the hero rail. Four cards since cc#2213, every figure from the payload: open.by_side.BUY / .SELL
   (unrealised at one lot -- the endpoint sums the SAME per-row pnl_rs the rows below print, per
   side) and record.BUY / .SELL (realised since start per side -- the same _record ROLLUP query; its ALL row is no longer drawn).
   A missing figure is a dash with its reason, never 0. */
function pts(v){ if(v==null||isNaN(Number(v))) return '—'; var x=Number(v); return (x>0?'+':(x<0?'−':''))+Math.abs(x).toFixed(1)+' pts'; }
function tkAcc(rec, barCls){
  var r=rec||{};
  if(!r.closed) return '<div class="tk-acc"><div class="tk-al">Record <b>—</b> · nothing closed yet</div></div>';
  return '<div class="tk-acc"><div class="tk-al">Record <b>'+(r.wr_pct!=null?r.wr_pct+'%':'—')+'</b> · '+r.wins+' of '+r.closed+' wins</div>'
    + '<div class="tk-bar"><i class="'+barCls+'" style="width:'+(r.wr_pct||0)+'%"></i></div></div>';
}
function tkSideCard(name, sideCls, bs, rec){
  var s=bs||{}, n=s.count||0, big, sub;
  if(!n){ big='<div class="tk-big">—</div>'; sub='<div class="tk-sub">Nothing open on the '+name.toLowerCase()+' side</div>'; }
  else if(s.unrealised_rs==null){ big='<div class="tk-big">—</div>'; sub='<div class="tk-sub"><b>'+n+'</b> open · 0 of '+n+' priced · '+(s.rows_without_lot?'no lot size on record':'no price on record')+'</div>'; }
  else { big='<div class="tk-big '+cls(s.unrealised_rs)+'">'+inr(s.unrealised_rs,true)+'</div>'; sub='<div class="tk-sub"><b>'+n+'</b> open · '+(s.priced||0)+' of '+n+' priced · '+pts(s.unrealised_pts_pct)+'</div>'; }
  return '<div class="tk-card '+sideCls+'" data-tk="'+sideCls+'"><div class="tk-ceye">'+name+' · unrealised</div>'+big+sub+tkAcc(rec, sideCls)+'</div>';
}
/* cc#2213: the realised card is per SIDE now (was one Net card over rec.ALL, cc#2176). Same body as
   before -- big rupee figure at one lot, the pts/count/since line, the shared tkAcc() record bar --
   with the eyebrow, data-tk and accent class parameterised; the ::after accent follows the existing
   .tk-card.tk-long / .tk-card.tk-short rules, no new colour. rec is record.BUY or record.SELL from
   the same ROLLUP query the two unrealised cards' record bars already read. */
function tkRealisedSideCard(name, sideCls, rec){
  var r=rec||{}, big, sub;
  if(!r.closed){ big='<div class="tk-big">—</div>'; sub='<div class="tk-sub">Nothing closed yet</div>'; }
  else if(r.net_rs_one_lot==null){ big='<div class="tk-big">—</div>'; sub='<div class="tk-sub">'+pts(r.net_pts_pct)+' · <b>'+r.closed+'</b> signal'+(r.closed===1?'':'s')+' · no lot size on record</div>'; }
  else { big='<div class="tk-big '+cls(r.net_rs_one_lot)+'">'+inr(r.net_rs_one_lot,true)+'</div>'; sub='<div class="tk-sub">'+pts(r.net_pts_pct)+' · <b>'+r.closed+'</b> signal'+(r.closed===1?'':'s')+' · since '+esc(dm(r.since))+'</div>'; }
  return '<div class="tk-card '+sideCls+'" data-tk="'+sideCls+'"><div class="tk-ceye">'+name+' · 1 lot · realised</div>'+big+sub+tkAcc(r,sideCls)+'</div>';
}
/* dots follow the rail: index = scrollLeft over one card pitch (card width + gap), the same
   scroll-position math as home.html's heroDots() / v8's posDots. A tap on a dot scrolls to that card. */
function tkPitch(tr){ var c=tr.children; if(c.length<2) return c.length?c[0].getBoundingClientRect().width:1; return c[1].offsetLeft-c[0].offsetLeft; }
function tkDots(){
  var tr=document.getElementById('tk-rail'), dots=document.getElementById('tk-dots'); if(!tr||!dots) return;
  var i=Math.max(0,Math.min(tr.children.length-1,Math.round(tr.scrollLeft/tkPitch(tr))));
  Array.prototype.forEach.call(dots.children,function(el,j){ el.className=(j===i?'on':''); });
}
function draw(){
  var d=D, o=d.open||{}, c=d.closed||{}, ob=o.book||{}, cb=c.book||{}, rec=d.record||{}, rb=rec.BUY||{}, rs=rec.SELL||{}, sp=d.spec||{};
  var openRows=sortOpen(pick(o)), closedRows=pick(c);
  var bs=o.by_side||{};   // cc#2213: rec.ALL is no longer drawn -- the realised card is per side
  var tkPrev=document.getElementById('tk-rail'), tkLeft=tkPrev?tkPrev.scrollLeft:0;   // keep the rail where it was across a redraw
  var h='<div class="tk-head"><div class="tk-eye">TC scanner · paper book · one lot per signal</div><div class="tk-tot"><b>'+(o.count||0)+'</b> open now · unrealised <b class="'+(ob.priced?cls(ob.unrealised_rs_one_lot):'')+'">'+(ob.priced?inr(ob.unrealised_rs_one_lot,true):'—')+'</b> · '+(ob.priced||0)+' of '+(ob.n||0)+' priced'+(ob.rows_without_cmp?' · '+ob.rows_without_cmp+' without a price':'')+'</div></div>';
  var tkCards=[tkSideCard('Long','tk-long',bs.BUY,rb), tkSideCard('Short','tk-short',bs.SELL,rs), tkRealisedSideCard('Long','tk-long',rb), tkRealisedSideCard('Short','tk-short',rs)];   // cc#2213: Long unreal, Short unreal, Long realised, Short realised
  h+='<div class="tk-rail" id="tk-rail">'+tkCards.join('')+'</div>'
    +'<div class="tk-dots" id="tk-dots">'+tkCards.map(function(_,i){ return '<i'+(i?'':' class="on"')+'></i>'; }).join('')+'</div>';   // one dot per card, never a hardcoded count
  h+='<div class="sec"><h2>Book</h2><span class="hint">since '+esc(dm(rb.since||rs.since))+'</span></div>';
  h+='<div class="seg" id="side">'+['ALL','LONG','SHORT'].map(function(s){return '<span data-s="'+s+'"'+(s===SIDE?' class="on"':'')+'>'+s.charAt(0)+s.slice(1).toLowerCase()+'</span>';}).join('')+'</div>';
  h+='<div class="sec"><h2>Open</h2><span class="hint">'+openRows.length+'</span></div>';
  h+='<div class="sortbar" id="osort">'+OSORT_OPTS.map(function(o){return '<span class="chip'+(o[0]===OSORT?' on':'')+'" data-osort="'+o[0]+'">'+o[1]+'</span>';}).join('')+'</div>';
  h+= openRows.length ? '<div class="lst">'+openRows.map(positionRow).join('')+'</div>' : '<div class="emp"><b>Nothing open</b>No hold is live on this side right now.</div>';
  h+='<div class="sec"><h2>Closed on</h2><span class="hint">'+esc(dm(d.date))+' · realised <b class="'+cls(cb.realised_rs_one_lot)+'">'+inr(cb.realised_rs_one_lot,true)+'</b></span></div>';
  h+='<div class="chips" id="days">'+(d.exit_days||[]).map(function(x){return '<span class="chip'+(x===d.date?' on':'')+'" data-d="'+x+'">'+esc(dm(x))+'</span>';}).join('')+'</div>';
  h+= closedRows.length ? '<div class="lst" style="margin-top:8px">'+closedRows.map(positionRow).join('')+'</div>' : '<div class="emp"><b>No exits that day</b>Pick another date above. Last closure was '+esc(dm(d.last_closure))+'.</div>';
  h+='<div class="card"><div class="ch"><span class="t">The rule</span><span class="n">'+esc(sp.version||'')+'</span></div><div class="rule">Every '+esc(sp.cadence_min)+' minutes, all futures names are scored on four buckets. A name <b>enters</b> when a bucket clears its bar: '+(sp.entry_rules||[]).map(function(e){return esc(e.bucket)+' ≥ '+esc(e.threshold);}).join(' · ')+'. Target <b>+'+esc(sp.target_pct)+'%</b>, stop <b>−'+esc(sp.sl_pct)+'%</b>, out after <b>'+esc(sp.hold_days)+' days</b> whatever happens. Stop is checked before target inside a bar.</div><div class="rule mu">'+esc(sp.exit_basis||'')+'</div></div>';
  h+='<div class="note"><b>Track record, plainly.</b> '+esc(d.note||'')+' As of '+esc(d.as_of||'')+'.</div>';
  document.getElementById('asof').innerHTML='As of <b>'+esc(d.as_of||'')+'</b> · '+(o.count||0)+' open · last closure '+esc(dm(d.last_closure));
  document.getElementById('body').innerHTML=h;
  /* cc#2177: run the shared label-collision pass on every rendered rail (the cc#1726 rule, the same
     call mobile/v8.html makes after its own render): ENTRY drops below the rail when it would touch
     CMP, and is nudged clear of the SL / TGT end labels. This page built its rails on the shared
     geometry (cc#2101) but never called the pass, so close prices printed "CMP 1053ENTRY 1065.20". */
  if(window.ScorrPositionRow&&window.ScorrPositionRow.trkFixLabels) window.ScorrPositionRow.trkFixLabels(document.getElementById('body'));
  var tkr=document.getElementById('tk-rail');
  if(tkr){ if(tkLeft) tkr.scrollLeft=tkLeft; tkDots(); tkr.addEventListener('scroll', tkDots, {passive:true});
    document.getElementById('tk-dots').addEventListener('click', function(e){ var i=Array.prototype.indexOf.call(e.currentTarget.children, e.target); if(i<0) return; tkr.scrollTo({left:i*tkPitch(tkr), behavior:'smooth'}); }); }
  document.getElementById('side').addEventListener('click', function(e){ var s=e.target.closest('[data-s]'); if(!s) return; SIDE=s.getAttribute('data-s'); draw(); });
  document.getElementById('days').addEventListener('click', function(e){ var s=e.target.closest('[data-d]'); if(!s) return; load(s.getAttribute('data-d')); });
  document.getElementById('osort').addEventListener('click', function(e){ var s=e.target.closest('[data-osort]'); if(!s) return; OSORT=s.getAttribute('data-osort'); draw(); });
}
function load(dt){
  DATE=dt||'';
  fetch('/api/mobile/tcscan'+(DATE?'?date='+DATE:''),{credentials:'same-origin'}).then(function(r){return r.json();}).then(function(d){
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">Could not load: '+esc(d.error)+'</div>'; return; }
    D=d; draw();
  }).catch(function(){ document.getElementById('body').innerHTML='<div class="err">Could not load the scanner book.</div>'; });
}
/* cc#2101 item 7: C.A.R.D tap-reveal, same guard+toggle pattern as mobile/v8.html's own #v8p
   delegate -- wired ONCE on #body (a stable container across redraws, unlike #side/#days/#osort
   which are recreated by every innerHTML=h and so rebind inside draw() itself). */
document.getElementById('body').addEventListener('click', function(e){
  if(e.target.closest('.scorr-card-strip')) return;   // a tap on the strip's own C/A/R/D pill must not also collapse the row it lives in
  var cst = e.target.closest('[data-card-strip]'); if(cst){ window.ScorrPositionRow.cardStripToggle(cst); return; }
});
load('');
/* cc#2177: a rotation changes the rail width and with it where the labels land -- redraw from the
   cached payload so the collision pass runs again on the new geometry (150 ms debounce). */
var tkRz=null; window.addEventListener('resize', function(){ clearTimeout(tkRz); tkRz=setTimeout(function(){ if(D) draw(); }, 150); });
</script>
</body></html>
