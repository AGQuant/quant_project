<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY DIGEST</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<!-- APP_QA_R4 P4: same two shared assets P3 links — one theme layer, one shell, no copies. -->
<link rel="stylesheet" href="/static/scorr_themes.css">
<link rel="stylesheet" href="/static/scorr_appshell.css">
<script src="/static/scorr_appshell.js" defer></script>
<style>
/* DAILY DIGEST — implements design_refs/scorr_digest_mobile_R1.html (b8949f6), R5.1 tokens */
:root{--field:#0D1322;--panel:#161F33;--hi:#1C2740;--edge:#26334F;--chalk:#EAF0FA;--muted:#8A97B0;
--volt:#C8F542;--heat:#FF4D6D;--aqua:#35E0FF;--pulse:#7C5CFF;--amber:#FF9F45;--cut:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B14;font-family:'Space Grotesk',sans-serif;color:var(--chalk)}
.phone{max-width:480px;margin:0 auto;background:var(--field);min-height:100vh;padding-bottom:70px;
 background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px)}
.num{font-family:'JetBrains Mono',monospace}
.skew{font-family:'Archivo Black';transform:skewX(-6deg);display:inline-block;transform-origin:left center;text-transform:uppercase}
.eyebrow{display:flex;align-items:center;gap:10px;margin:20px 18px 10px;font-size:11px;font-weight:700;
 letter-spacing:2.5px;color:var(--aqua);text-shadow:0 0 12px rgba(53,224,255,.4)}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
/* cc#1090 P4 then P6 · ALL TWELVE .card BLOCKS NOW TAKE .slab, and it took both pushes to get
   there honestly. P4 adopted ten and left GLOBAL TAPE and INTERNALS flat, because "tape blocks
   stay flat" and because raising a block whose whole content is already raised tiles is the mud
   the nesting rule warns about. P6 is the push that owns exactly that pair — raised tiles .slab,
   inner readouts .well — so the two blocks raise HERE and their .tile children sink to .well at
   the same time. Neither half works alone: a slab full of raised tiles is the violation, and a
   well inside a flat card is a hole in nothing.
   This rule is left standing rather than deleted: the ruling-1 override at (0,3,0) takes the cut
   off what adopted and leaves it on anything that has not. */
.card{background:var(--panel);border:1px solid var(--edge);margin:0 14px 12px;padding:16px;position:relative;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.rail::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:4px;background:var(--rc,var(--amber))}
.chip{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1px;border:1px solid var(--edge);
 background:var(--hi);padding:4px 9px;display:inline-block;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
.w{border-color:#3E5A18;background:#18240E;color:var(--volt)}
.l{border-color:#5A2634;background:#241019;color:#FF8FA5}
.n{border-color:#5A4218;background:#241D0E;color:var(--amber)}
/* cc#1109: CLOSED is not a warning. The state chip was permanently amber, which read as
   "something needs attention" on every evening and all weekend. */
.mu{border-color:var(--edge);background:var(--hi);color:var(--muted)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
 flex-wrap:wrap;gap:2px 10px}
.grp h3{font-family:'Archivo Black';font-size:15px;transform:skewX(-6deg);color:var(--chalk)}
.grp .note{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:1px;text-align:right}
/* cc#1111 item 1: the CMP note is one SENTENCE — "CMP 24,078 · LIVE · below PP 0.76%". As a bare
   flex item with no width control it wrapped wherever it ran out of room, and on a 390px screen
   that landed mid-phrase: "below PP" on one line and a naked "0.76%" on the next, disconnected
   from the words that give it meaning. Two rules fix it and neither changes a value. The note is
   allowed to take the WHOLE next line under the symbol (flex-wrap on .grp above, plus flex-basis
   here once it cannot sit alongside), and each clause inside it is unbreakable, so a wrap can
   only ever fall on a separator. */
.grp .note{white-space:normal}
.grp .note .cl{white-space:nowrap}
@media (max-width:430px){
  .grp{align-items:flex-start}
  .grp .note{flex:1 0 100%;text-align:left}
}
.tile{background:var(--hi);border:1px solid var(--edge);padding:8px 9px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
/* APP_QA_R5 P5 · ref design_refs/scorr_digest_mobile_R2.html @ c77cae9.
   9.5px is the FLOOR — the tile label and the wk line were at 9px, which is the drift R2 names. */
.tile .lb{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .vv{font-family:'JetBrains Mono';font-weight:800;font-size:14px;margin-top:3px}
.tile .wk{font-family:'JetBrains Mono';font-weight:700;font-size:12px;color:var(--muted);margin-top:1px}
/* the DAY|WEEK switch — ref .gsw/.ghd, 52x30 chips, in-memory state, default DAY */
.ghd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gsw{display:flex;gap:3px;background:var(--hi);border:1px solid var(--edge);padding:2px;
 clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
.gsw button{min-width:52px;min-height:30px;border:0;background:transparent;cursor:pointer;
 font-family:'JetBrains Mono';font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
.gsw button.on{background:var(--panel);color:var(--aqua);text-shadow:0 0 8px rgba(53,224,255,.4)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--edge);font-size:12.5px}
.mrow:first-of-type{border-top:none}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.plink{color:var(--pulse);font-weight:700;font-size:12.5px;text-decoration:none}
.foot{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:.6px;margin:6px 18px 20px}
/* cc#1096 R7-D2 · THE PIVOT ROW COULD NOT HOLD ITS COLUMNS. Founder frame 1:44: BANKNIFTY read
   56,69757,09457,55557,952 as one string, with the last value clipped mid-digit at the card edge.

   WHAT WAS ACTUALLY WRONG, and it is three things stacked, not one:
     gap:0        there was NO column separation at all. Five numbers sat shoulder to shoulder and
                  the only thing keeping them apart was slack inside each cell — luck, not layout.
     flex:1 with the default min-width:auto means a cell can never shrink below its own text, so
                  the moment a value is wider than its share the row grows past the card instead
                  of the columns giving way.
     nothing capped the overflow, so the spill landed under .card's clip-path and lost digits.
   At default text scale on a 360px viewport the values measure 28px in a 60px cell and it looks
   fine, which is why this survived review. It is one text-width step from breaking, and Chrome
   for Android's text scaling is exactly that step.

   THE FIX IS THE GRID, so the columns are declared instead of emergent: five equal tracks, a real
   6px gutter, min-width:0 so tracks share fairly, and overflow-x:auto so that if the content
   genuinely cannot fit, the row SCROLLS rather than hiding a digit. Nothing here touches a pivot
   value or the maths behind it — the numbers are rendered exactly as before. */
/* cc#1111 item 2: the wrap exists ONLY to carry the edge fade. .ladder is the scroller and an
   ::after on it would scroll away with the content instead of sitting at the clipped edge. */
.ladwrap{position:relative}
.ladwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
 opacity:0;transition:opacity .15s;
 background:linear-gradient(to right,rgba(10,15,30,0),var(--bg,#0A0F1E))}
.ladwrap.hasmore::after{opacity:1}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(max-content,1fr));gap:6px;align-items:start;
 margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.rung{min-width:0;text-align:center;font-family:'JetBrains Mono';font-size:10px;padding:5px 0;border-top:2px solid var(--edge);color:var(--muted)}
.rung b{display:block;white-space:nowrap;margin-top:2px}
.unavail{font-size:11px;color:var(--muted);font-family:'JetBrains Mono'}
</style>
</head>
<body data-theme="goldnight" class="as-shell">
<!-- APP_QA_R5 P6 (was R4 P4): goldnight FORCED this sprint; stored theme read and kept, not applied. Original note: stored theme applied as the first statement inside <body>, before paint. -->
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){/* preserved, not applied while the sprint gate stands */}}catch(e){}
document.body.setAttribute('data-theme','goldnight');})();</script>
<div class="phone">
<!-- APP_QA_R4 P4 · SHELL VARIANT A (tool page), ref design_refs/scorr_appshell_R1.html @ a20ae0d.
     #dd-date and #dd-state move into the shell's slot with their ids intact — the page still
     fills them, the shell only defines where they sit (ref rule 6). Nothing below this header
     changed and no loader was touched (rule 5). -->
<div class="as-hdr">
  <a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a>
  <div class="as-pg"><span class="t">Daily Digest</span>
    <div class="s" id="dd-date">THE MORNING READ</div></div>
  <div class="as-slot"><span id="dd-state" class="chip n">—</span></div>
</div>
<div id="app"><div class="card slab"><div class="unavail">Building the read…</div></div></div>
<div class="foot">DAILY DIGEST · every claim tied to a number shown above · research only</div>
</div>

<script>
/* ONE payload: /api/digest/v3 (digest_v3.py, binding spec 965 v2.3). cc#1114 removed the second
   read (/api/v10/trades/paired, for ENGINE YESTERDAY) along with the section it fed, so this page
   now makes exactly one request. APP_SECTION_DISTRIBUTION_V1 still holds: positions live on Index
   Intel, the digest tells what happened. */
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num=(v,d=0)=>(typeof v==='number'?v:Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:d});
const sgn=(n,d=2)=>(n>=0?'+':'')+Number(n).toFixed(d);
const cx=n=>n>=0?'var(--volt)':'var(--heat)';
const senti=s=>{const t=String(s||'').toLowerCase();
  return /bull|posi/.test(t)?'var(--volt)':/bear|nega/.test(t)?'var(--heat)':/caut/.test(t)?'var(--amber)':'var(--muted)';};

/* APP_QA_R5 P5 · in-memory only, per the ref: the choice lasts the visit and is deliberately
   NOT persisted — the digest is a morning read, and a stale WEEK selection from yesterday would
   silently change what the founder thinks he is looking at. Default DAY. */
var TAPE_MODE='day';
function tile(t){
  const d=t.day_chg_pct!=null?Number(t.day_chg_pct):null;
  /* week comes from the PAYLOAD (global_heatstrip computes close vs close 5 of the symbol's OWN
     sessions back and nulls under 6 sessions) — never recomputed here, never defaulted to 0. */
  const w=t.week_chg_pct!=null?Number(t.week_chg_pct):(t.wk_chg_pct!=null?Number(t.wk_chg_pct):null);
  const v=TAPE_MODE==='week'?w:d;
  /* cc#1109 INVERTED TILES. Colour used to be the sign of the number, which is wrong for any
     symbol whose direction is inverted — INDIA VIX falls when the market calms, and a falling
     VIX was painting red. The payload ALREADY carries day_band / week_band with the inversion
     applied (global_heatstrip sets inverted:true on INDIAVIX), so the band is read, never
     recomputed here — one composer, same rule as the week number above. Sign is the fallback
     only when a tile ships no band. */
  const band=TAPE_MODE==='week'?t.week_band:t.day_band;
  const col=v==null?'var(--muted)'
           :(band?(String(band).indexOf('up')===0?'var(--volt)':(String(band).indexOf('down')===0?'var(--heat)':'var(--muted)'))
                 :cx(v));
  return `<div class="tile well"><div class="lb">${esc(t.name||t.symbol||'—')}</div>
    <div class="vv" style="color:${col}">${v!=null?sgn(v)+'%':'—'}</div></div>`;
}
/* re-renders the grid IN PLACE: same cells, same order, only the % swaps (ref). */
function setTapeMode(m){
  if(m===TAPE_MODE)return;
  TAPE_MODE=m;
  var g=document.getElementById('gtiles');
  if(g&&window.__TILES)g.innerHTML=window.__TILES.map(tile).join('');
  var bs=document.querySelectorAll('#gsw button');
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===m);
}
function ladder(ix){
  const rungs=ix.rungs||[];
  if(!rungs.length)return `<div class="unavail">${esc(ix.reason||'no pivot ladder')}</div>`;
  const cmp=ix.cmp!=null?Number(ix.cmp):null;
  const order=['S2','S1','PP','R1','R2'];
  const bp=rungs.find(r=>r.label==='PP');
  const side=(cmp!=null&&bp)?(cmp>bp.value?'above':'below'):null;
  /* cc#1111: .cl marks a clause that must not break. "below PP 0.76%" is one phrase — the number
     means nothing on a line of its own. */
  const sideTxt=side?`<span class="cl" style="color:${side==='above'?'var(--volt)':'var(--heat)'}">${side} PP ${bp.dist_pct!=null?Math.abs(bp.dist_pct).toFixed(2)+'%':''}</span>`:'';
  const cells=order.map(L=>{const r=rungs.find(x=>x.label===L);
    const col=L==='PP'?'var(--amber)':(L[0]==='S'?'#5A2634':'#3E5A18');
    return `<div class="rung" style="border-color:${col}${L==='PP'?';color:var(--amber)':''}">${L}<br><b style="color:var(--chalk)">${r?num(r.value):'—'}</b></div>`;}).join('');
  return `<div class="grp" style="margin-top:14px"><h3>${esc(ix.symbol)}</h3>
    <span class="note"><span class="cl">CMP <b class="num" style="color:var(--chalk)">${cmp!=null?num(cmp):'—'}</b></span> · <span class="cl">${esc(ix.tier||'')}</span> · ${sideTxt}</span></div>
    <div class="ladwrap"><div class="ladder">${cells}</div></div>`;
}

/* cc#1111 item 2: .ladder has overflow-x:auto, but a clipped column with no scrollbar and no fade
   gives a reader no reason to believe a fifth column exists — on the founder's screenshot R2 was
   simply cut flush at the screen edge. This is the same fade-when-scrollable rule the chip bar and
   the mobile nav already use: the cue appears only while there IS more to the right, and clears at
   the end, because a fade over nothing is a hint that lies. Bound per ladder, and re-bound after
   every boot render since the nodes are replaced. */
function bindLadders(){
  document.querySelectorAll('.ladder').forEach(function(el){
    var wrap=el.parentNode;
    var sync=function(){
      wrap.classList.toggle('hasmore', el.scrollWidth-el.clientWidth-el.scrollLeft > 2);
    };
    el.addEventListener('scroll', sync, {passive:true});
    sync();
  });
}

async function boot(){
  let d=null;
  try{ d=await (await fetch('/api/digest/v3')).json(); }catch(e){}
  /* cc#1114: the ENGINE YESTERDAY · V10 section is GONE by founder decision — on a day with no
     exits it was a one-line empty state and a link to a page the closing paragraph already links
     to. The /api/v10/trades/paired fetch went with it rather than being left running for a
     section that no longer renders; nothing else on this page read its result. The cc#1109 fix
     that put this filter on the server's prev_trading_date is not lost — the basis still ships in
     the payload and /m/v8 is where the book lives. */
  if(!d||d.error||!d.sections){
    document.getElementById('app').innerHTML=`<div class="card slab"><div class="unavail">Digest payload unavailable${d&&d.error?': '+esc(d.error):''}. /api/digest/v3 did not answer — nothing is invented in its place.</div></div>`;
    return;
  }
  const S=d.sections, mr=d.market_read||{};
  document.getElementById('dd-date').textContent=(d.date_ist||'')+' · the morning read';
  /* cc#1109: the chip follows market.state instead of sitting on a static amber. OPEN reads as
     live, CLOSED reads as quiet, PRE-OPEN and CAS keep the amber that means "not yet / not any
     more". The label text is unchanged. */
  const st=document.getElementById('dd-state'); st.textContent=(d.market&&d.market.label)||'—';
  const mst=(d.market&&d.market.state)||'';
  st.className='chip '+(mst==='OPEN'?'w':(mst==='CLOSED'?'mu':(mst?'n':'n')));

  const tiles=(S.global_tape&&S.global_tape.tiles)||[];
  window.__TILES=tiles;   /* APP_QA_R5 P5: kept so the switch re-renders without a refetch */
  const eodNote=S.global_tape&&S.global_tape.eod_note;
  const lad=(S.ladders&&S.ladders.indexes)||[];
  const itl=S.internals||{}, adr=itl.adr||null, pcr=itl.pcr||[];
  const rep=S.reporting_today||{}, yr=S.yesterday_results||{};
  const wm=(S.what_moved&&S.what_moved.items)||[], ge=(S.global_events&&S.global_events.items)||[];
  const tally=yr.tally||{};

  const bias=(mr.bias||'—').toUpperCase();
  const railC=/BULL/.test(bias)?'var(--volt)':/CAUT/.test(bias)?'var(--amber)':'var(--muted)';

  const yrRows=(yr.companies||[]).slice(0,6).map(c=>{
    const cls=c.read==='BULLISH'?'w':c.read==='CAUTIOUS'?'l':c.read==='PENDING'?'n':'';
    /* cc#1096 D3: same resolution as the chips above — a numeric BSE code is shown as the
       company name, because there is no NSE symbol to resolve it to. */
    return `<div class="mrow"><b>${esc(c.label||c.ticker)}</b>
      <span style="flex:1;font-size:11.5px;color:var(--muted)">${esc(c.headline||c.pending_reason||'')}</span>
      <span class="chip ${cls}" style="font-size:9.5px;padding:1px 6px">${esc(c.read||'—')}</span></div>`;}).join('')
    ||'<div class="unavail">No reporters yesterday.</div>';

  const newsRows=items=>items.slice(0,4).map(n=>
    `<div class="mrow"><span class="sdot" style="background:${senti(n.sentiment)}"></span>
     <span style="flex:1">${esc(n.headline)}</span></div>`).join('')||'<div class="unavail">No items.</div>';

  document.getElementById('app').innerHTML=`
  <div class="card slab rail" style="--rc:${railC};margin-top:12px">
    <div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">MARKET READ</div>
    <span class="skew" style="font-size:36px;line-height:.95">${esc(mr.bias||'—')}</span>
    <div style="height:6px;width:150px;background:linear-gradient(90deg,var(--chalk),transparent);transform:skewX(-24deg);margin:6px 0 10px;opacity:.85"></div>
    <div class="num" style="font-size:12px;color:var(--muted)">${(mr.support||[]).map(esc).join(' · ')||'—'}</div>
  </div>

  <div class="eyebrow">GLOBAL TAPE${S.global_tape&&S.global_tape.tier?' · '+esc(S.global_tape.tier):''}</div>
  <div class="card slab">
    <div class="ghd"><span style="font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted)">CHANGE</span>
      <div class="gsw" id="gsw"><button type="button" data-v="day" class="on" onclick="setTapeMode('day')">DAY</button><button type="button" data-v="week" onclick="setTapeMode('week')">WEEK</button></div></div>
    ${tiles.length?`<div id="gtiles" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">${tiles.map(tile).join('')}</div>`:'<div class="unavail">No live global tiles available.</div>'}
    ${eodNote?`<div style="font-size:9.5px;color:var(--amber);font-family:'JetBrains Mono';margin-top:8px">${esc(eodNote)}</div>`:''}
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:6px">${esc((S.global_tape&&S.global_tape.read)||'')} · WEEK = close vs close 5 sessions back, from the payload · no history shows an em-dash, never 0</div>
  </div>

  <div class="eyebrow">TODAY'S MAP · PIVOT LADDERS</div>
  <div class="card slab">${lad.length?lad.map(ladder).join(''):'<div class="unavail">No ladder data.</div>'}
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:10px">the day's reference levels — the live position lives on <a class="plink" href="/m/v10">INDEX INTEL →</a></div>
  </div>

  <div class="eyebrow">INTERNALS</div>
  <div class="card slab">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px">
      <div class="tile well"><div class="lb">BREADTH${itl.adr_stale?' · STALE':''}</div>
        <div class="vv" style="color:${adr&&adr.adr!=null?(adr.adr>=1?'var(--volt)':'var(--heat)'):'var(--muted)'}">${adr&&adr.adr!=null?Number(adr.adr).toFixed(2):'—'}</div>
        <div class="wk">${adr?adr.advances+'A / '+adr.declines+'D':''}</div></div>
      ${pcr.slice(0,2).map(p=>`<div class="tile well"><div class="lb">PCR ${esc(p.underlying)}${itl.pcr_stale?' · STALE':''}</div>
        <div class="vv" style="color:${p.pcr!=null?(p.pcr>1?'var(--volt)':'var(--amber)'):'var(--muted)'}">${p.pcr!=null?Number(p.pcr).toFixed(2):'—'}</div>
        <div class="wk">${esc(p.date||'')}</div></div>`).join('')}
    </div>
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:8px">${esc(itl.read||'')}</div>
  </div>

  <div class="eyebrow">REPORTING TODAY</div>
  <div class="card slab">
    <div class="grp"><h3>${rep.count!=null?rep.count+' companies':'—'}</h3><span class="note">TOP BY MARKET CAP</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:7px">
      ${/* cc#1096 D3: label, never the raw ticker. The payload resolves a BSE-only reporter to its
             company name server-side (digest_v3._label) and marks it is_symbol:false, so a bare
             scrip code can no longer reach a chip. Falls back to the ticker only if an older
             payload has no label at all. */''}
      ${(rep.companies||[]).slice(0,6).map(c=>`<span class="chip"${c.is_symbol===false?' title="BSE-listed, no NSE symbol"':''}>${esc(c.label||c.ticker)}</span>`).join('')||'<span class="unavail">No scheduled reporters today.</span>'}
      ${rep.count>6?`<span class="chip" style="color:var(--muted)">+${rep.count-6} more</span>`:''}</div>
  </div>

  <div class="eyebrow">YESTERDAY'S RESULTS · SCORED</div>
  <div class="card slab">
    <div class="grp"><h3>Top ${(yr.companies||[]).length} of ${yr.reported_total!=null?yr.reported_total:'—'}</h3>
      <span class="note"><b style="color:var(--volt)">${tally.bullish||0} bull</b> · <b style="color:var(--heat)">${tally.cautious||0} caut</b> · <b style="color:var(--muted)">${tally.neutral||0} neut · ${tally.pending||0} pending</b></span></div>
    ${yrRows}
    <div style="margin-top:8px;font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono'">${esc(yr.match_rule||'')}</div>
  </div>

  <div class="eyebrow">WHAT MOVED · DOMESTIC</div>
  <div class="card slab">${newsRows(wm)}</div>

  <div class="eyebrow">GLOBAL EVENTS</div>
  <div class="card slab">${newsRows(ge)}</div>

  <div class="card slab rail" style="--rc:${railC}">
    <div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">THE CLOSE OF THE READ</div>
    <div style="font-size:13px;line-height:1.55">Bias <b style="color:${railC}">${esc(mr.bias||'—')}</b> — ${(mr.support||[]).map(esc).join(' · ')||'no supporting numbers available'}. Levels above are the day's map; the live desk owns the positions. <a class="plink" href="/m/v10">INDEX INTEL →</a></div>
  </div>`;
  bindLadders();   /* cc#1111: the ladders only exist after this paint */
}
boot();
</script>
