<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<!-- APP_QA_R4 P4: same two shared assets P3 links — one theme layer, one shell, no copies. -->
<link rel="stylesheet" href="/static/scorr_themes.css">
<link rel="stylesheet" href="/static/scorr_appshell.css">
<script src="/static/scorr_appshell.js" defer></script>
<!-- cc#1129: the shared news row. /m/home dropped its own use of this (cc#1322 moved LIVE NEWS
     off that page); this page's LIVE NEWS card (cc#1325) is now its only consumer, alongside
     scorr_v10_signal.html's separate copy. Linked directly rather than via _MOBILE_HEAD: /m/digest
     is deliberately NOT in _PWA_INJECT_PATHS. It IS in PROTECTED, so main.py's middleware still
     rewrites this src with the ?v= build stamp, which the 1-day cache header on the route depends
     on. -->
<script src="/scorr_news_row.js"></script>
<style>
/* DAILY DIGEST — implements design_refs/scorr_digest_mobile_R1.html (b8949f6), R5.1 tokens */
:root{--field:#0D1322;--panel:#161F33;--hi:#1C2740;--edge:#26334F;--chalk:#EAF0FA;--muted:#8A97B0;
--volt:#C8F542;--heat:#FF4D6D;--aqua:#35E0FF;--pulse:#7C5CFF;--amber:#FF9F45;--cut:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B14;font-family:'Space Grotesk',sans-serif;color:var(--chalk)}
.phone{max-width:480px;margin:0 auto;background:var(--field);min-height:100vh;padding-bottom:var(--space-70);
 background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px)}
.num{font-family:'JetBrains Mono',monospace}
.skew{font-family:'Archivo Black';transform:skewX(-6deg);display:inline-block;transform-origin:left center;text-transform:uppercase}
.eyebrow{display:flex;align-items:center;gap:var(--space-10);margin:var(--space-20) var(--space-18) var(--space-10);font-size:var(--type-11);font-weight:700;
 letter-spacing:var(--track-px16);color:var(--aqua);text-shadow:0 0 12px rgba(53,224,255,.4)}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
/* cc#1090 P4 then P6 · ALL TWELVE .card BLOCKS NOW TAKE .slab, and it took both pushes to get
   there honestly. P4 adopted ten and left GLOBAL TAPE and INTERNALS flat, because "tape blocks
   stay flat" and because raising a block whose whole content is already raised tiles is the mud
   the nesting rule warns about. P6 is the push that owns exactly that pair — raised tiles .slab,
   inner readouts .well — so the two blocks raise HERE and their .tile children sink to .well at
   the same time. Neither half works alone: a slab full of raised tiles is the violation, and a
   well inside a flat card is a hole in nothing.
   This rule is left standing rather than deleted: the ruling-1 override at (0,3,0) takes the cut
   off what adopted and leaves it on anything that has not. */
.card{background:var(--panel);border:var(--bw-1) solid var(--edge);margin:0 var(--space-14) var(--space-12);padding:var(--space-16);position:relative;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
/* cc#1234 · ONE SENTIMENT LINE, AND IT IS THICKER. Founder: "2 green lines not required, one
   bigger green line is enough." 5px -> 8px, which is 1.6x and inside the 1.5-2x the card asks for.
   The bar is absolutely positioned, so its width takes no layout space and nothing shifts.
   WHAT THE SECOND LINE ACTUALLY WAS. The card describes it as a full-viewport-height rail on the
   page edge. There is no such rule — I swept this page's own <style>, scorr_themes.css and
   scorr_appshell.css and `.rail::before` is the ONLY left-edge bar any of them define, then
   rendered the page and looked for any element narrower than 14px and taller than 300px: zero.
   The two green lines are TWO CARDS both carrying .rail — MARKET READ and THE CLOSE OF THE READ —
   sitting at the same left offset with a card between them, which on a scrolling phone reads as
   one long rail broken by a gap. So the fix is to drop the second card's rail, not to hunt a
   page-edge element that does not exist. */
.rail::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:var(--space-8);border-radius:var(--radius-4);background:var(--rc,var(--amber))}
.chip{font-family:'JetBrains Mono';font-size:var(--type-105);font-weight:700;letter-spacing:var(--track-px10);border:var(--bw-1) solid var(--edge);
 background:var(--hi);padding:var(--space-4) var(--space-9);display:inline-block;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
/* cc#1308 — the peer BEAT/MISS badge (raBeatMissBlock) was riding .chip, and .chip's own
   box-sizing:border-box plus a run of var()-driven padding on a badge sitting inline between two
   other spans rendered several times its text size on the founder's phone — a box, not a pill.
   A DEDICATED CLASS rather than patching .chip: .chip is the page's general tappable-tag look
   (clipped corner, border-box) and is used elsewhere on this page too (SHARED_CSS_RULE_V1) — a fix
   aimed at "make this one badge small" has no business changing every other chip's shape.
   inline-flex + fixed px padding (not the space-* scale) + line-height:1 + width/height:auto is
   the small-capsule contract: nothing here can be stretched wide by an inherited box model, a flex
   parent, or a token that resolves oddly, because none of those degrees of freedom are open to it. */
.pchip{font-family:'JetBrains Mono';font-size:11px;font-weight:800;letter-spacing:var(--track-px10);
 display:inline-flex;align-items:center;justify-content:center;width:auto;height:auto;line-height:1;
 white-space:nowrap;padding:3px 8px;border-radius:10px;border:var(--bw-1) solid var(--edge);
 background:var(--hi);vertical-align:middle}
.w{border-color:#3E5A18;background:#18240E;color:var(--volt)}
.l{border-color:#5A2634;background:#241019;color:#FF8FA5}
.n{border-color:#5A4218;background:#241D0E;color:var(--amber)}
/* cc#1109: CLOSED is not a warning. The state chip was permanently amber, which read as
   "something needs attention" on every evening and all weekend. */
.mu{border-color:var(--edge);background:var(--hi);color:var(--chalk)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-10);
 flex-wrap:wrap;gap:var(--space-2) var(--space-10)}
.grp h3{font-family:'Archivo Black';font-size:var(--type-15);transform:skewX(-6deg);color:var(--chalk)}
.grp .note{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--chalk);letter-spacing:var(--track-px10);text-align:right}
/* cc#1111 item 1: the CMP note is one SENTENCE — "CMP 24,078 · LIVE · below PP 0.76%". As a bare
   flex item with no width control it wrapped wherever it ran out of room, and on a 390px screen
   that landed mid-phrase: "below PP" on one line and a naked "0.76%" on the next, disconnected
   from the words that give it meaning. Two rules fix it and neither changes a value. The note is
   allowed to take the WHOLE next line under the symbol (flex-wrap on .grp above, plus flex-basis
   here once it cannot sit alongside), and each clause inside it is unbreakable, so a wrap can
   only ever fall on a separator. */
.grp .note{white-space:normal}
.grp .note .cl{white-space:nowrap}
@media (max-width:430px){
  .grp{align-items:flex-start}
  .grp .note{flex:1 0 100%;text-align:left}
}
.tile{background:var(--hi);border:var(--bw-1) solid var(--edge);padding:var(--space-8) var(--space-9);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
/* APP_QA_R5 P5 · ref design_refs/scorr_digest_mobile_R2.html @ c77cae9.
   9.5px is the FLOOR — the tile label and the wk line were at 9px, which is the drift R2 names. */
.tile .lb{font-size:var(--type-105);font-weight:700;letter-spacing:var(--track-px12);color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .vv{font-family:'JetBrains Mono';font-weight:800;font-size:var(--type-14);margin-top:var(--space-3)}
.tile .wk{font-family:'JetBrains Mono';font-weight:700;font-size:var(--type-12);color:var(--chalk);margin-top:var(--space-1)}
/* the DAY|WEEK switch — ref .gsw/.ghd, 52x30 chips, in-memory state, default DAY */
.ghd{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-10)}
.gsw{display:flex;gap:var(--space-3);background:var(--hi);border:var(--bw-1) solid var(--edge);padding:var(--space-2);
 clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
.gsw button{min-width:52px;min-height:30px;border:0;background:transparent;cursor:pointer;
 font-family:'JetBrains Mono';font-size:var(--type-10);font-weight:800;letter-spacing:var(--track-px14);color:var(--chalk)}
.gsw button.on{background:var(--panel);color:var(--aqua);text-shadow:0 0 8px rgba(53,224,255,.4)}
.mrow{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-9) 0;border-top:var(--bw-1) solid var(--edge);font-size:var(--type-125)}
.mrow:first-of-type{border-top:none}
/* cc#1190 · LATEST RESULT ANALYSIS. GOLD NIGHT tokens only — every colour here is a var already
   declared at the top of this file, no new literal. */
/* cc#1237 scope 3 · FOUR EQUAL CHIPS IN ONE ROW, per design ref scorr_digest_results_R1
   (design_refs/scorr_digest_results_R1.html, 09bc13a). The ref's .tiers is flex with .tier{flex:1},
   i.e. the four tiers split the width evenly and the row NEVER wraps. flex-wrap:wrap was the old
   behaviour and it is what let SMALL drop to a second line on a narrow phone, which is half of why
   the block read as untidy. min-width:0 goes with flex:1 or a long label refuses to shrink and
   pushes the row wider than the card. */
.rchips{display:flex;gap:var(--space-6);margin-bottom:var(--space-10);flex-wrap:nowrap}
.rchip{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden}
.rchip{min-height:34px;padding:var(--space-5) var(--space-4);cursor:pointer;font-family:'JetBrains Mono';font-size:var(--type-10);
 font-weight:800;letter-spacing:var(--track-px12);color:var(--chalk);background:var(--hi);
 border:var(--bw-1) solid var(--edge);clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
.rchip.on{color:var(--aqua);border-color:var(--aqua);text-shadow:0 0 8px rgba(53,224,255,.4)}
.rchip .num{color:var(--chalk);font-weight:800}
.rchip.on .num{color:var(--aqua)}
/* Each page is one snap slide and every page holds exactly RA_PAGE rows. min-height is set from
   that count, not guessed: without it a final short page collapses and the deck jumps height
   mid-swipe, which reads as a broken carousel rather than a short page. */
/* cc#1252 · min-width:0 IS LOad-BEARING, not tidiness. flex:0 0 100% asks for exactly the track
   width, but a flex item still cannot shrink below its CONTENT minimum, and one unbreakable token
   in one row is enough to override the basis. Measured at 360px with a 60-character token in a
   single news row: this page went 298px -> 711.281px while its siblings stayed 307px, so the deck
   no longer had one pitch at all, and deckPark missed its target by 1653px — it opened on the
   wrong page. min-width:0 lets the page shrink to the basis it already asked for, so an
   over-long token wraps or clips inside the page instead of resizing it. */
.rpage{flex:0 0 100%;min-width:0;scroll-snap-align:start;min-height:212px;display:flex;flex-direction:column;gap:var(--space-8)}
/* cc#1237 · THE ROW IS A GRID NOW, AND THAT IS THE WHOLE FIX FOR THE OVERLAP.
   The founder's 16:24 screenshot showed the verdict banner sitting on top of the symbol name and
   the summary cut mid-word. The old row was ONE flex line — .rmain took the remaining width and
   the read chip was a sibling competing for the same axis, so a long symbol and a wide banner had
   nothing arbitrating between them. R1's answer is two columns and two rows: the name block and
   the pill each own a cell on row 1, and the summary spans both on row 2. Overlap stops being
   unlikely and becomes impossible — grid cells do not intersect.
   Each row also gets its own surface and border per the ref (.r) instead of the shared .mrow
   top-border, which is what makes four rows read as four cards rather than one ruled list. */
.rrow{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;
 column-gap:var(--space-10);row-gap:var(--space-5);align-items:center;
 background:var(--hi);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-10);
 padding:var(--space-11) var(--space-12)}
.rmain{grid-column:1;grid-row:1;min-width:0}
.rtop{display:flex;align-items:baseline;gap:var(--space-8);min-width:0}
.rtop b{font-size:var(--type-14);white-space:nowrap}
.rq{font-size:var(--type-9);color:var(--chalk);letter-spacing:var(--track-px9);white-space:nowrap}
.rt{font-size:var(--type-85);font-weight:800;letter-spacing:var(--track-px11);color:var(--aqua);
 font-family:'JetBrains Mono';white-space:nowrap}
/* cc#1255 · THE VERDICT PILL AND ITS RULES ARE DELETED, not left orphaned. RESULT_ROW_DOTS_ONLY
   (29663) retires the three words, so .rvd has nothing left to paint — and dead CSS for a class
   nobody emits is how a later render check ends up proving a rule that is no longer on the page.
   The .w/.l/.mu chip classes it borrowed are the page's own and stay where they are; only the
   pill geometry goes. The row's second column is now empty, and the grid keeps its `1fr auto`
   because `auto` collapses to nothing when there is nothing in it. */
/* cc#1238 · RESULT TRAFFIC DOT (RESULT_DOT_RULE_V1, session_log 29519). Deliberately the SAME
   7px circle and the SAME three tokens as scorr_news_row.js's .nrdot, because the card asks for
   the news dots' visual language rather than a new one — up/ct/dn are that module's own class
   names and reusing them keeps the two readable as one system. It sits INSIDE .rtop, which is a
   flex row, so the R1 grid is untouched: the dot costs the name cell a few pixels and no column.
   Named .rtdot and not .rdot on purpose — #rdots is the pager, and two things called rdot on one
   page is the collision this file has already had five times on short class names. */
.rtdot{width:7px;height:7px;border-radius:50%;flex:none;align-self:center}
.rtdot.up{background:var(--volt)}
.rtdot.ct{background:var(--amber)}
.rtdot.dn{background:var(--heat)}
/* the sheet's one-line note when only one of the two checks could be computed */
.rbasis{font-size:var(--type-95);color:var(--chalk);margin-top:var(--space-8);line-height:1.5}
/* The verdict is one sentence but the source is prose and the longest measured is 987 characters,
   so it is clamped to two lines. Unclamped, one long row would push the other three off its page
   and the "4 rows per page" the card asks for would quietly stop being true.
   cc#1237 MOVES IT TO ONE LINE AND SPANS IT ACROSS BOTH COLUMNS, per R1's .line. Two lines was
   the right call while the summary shared a flex line with the pill; on the grid it has the full
   row width to itself, so one line carries as much text as two used to and every row on a page is
   now the same height — which is what stops the "summary cut mid-word" reading, because the clamp
   ends at a line boundary rather than at whatever the flex box happened to leave. */
.rv{grid-column:1 / -1;grid-row:2;font-size:var(--type-12);line-height:1.45;color:var(--chalk);
 display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* cc#1255 · TWO LINES, using the space the verdict pill vacated. The sentence stopped being a
   caption under a headline word and became the row's actual content, so one line was no longer
   enough — a one-line clamp cut most of these verdicts mid-clause. Three would push four rows off
   a phone screen and turn a deck into a scroll, so two is the ruling's number and it is enough for
   the sentences result_analysis_v2 actually holds. Kept as a MODIFIER rather than changed on .rv,
   because .rv is shared and the other users of it still want one line. */
.rv2{-webkit-line-clamp:2}
.rrow{cursor:pointer}
/* cc#1237 · THE CHEVRON IS GONE. R1 has no affordance glyph on the row: the whole row is the tap
   target and it already was (the onclick has been on .rrow since cc#1190). The chevron occupied a
   third flex cell that the grid has no column for, and keeping it would have re-introduced the
   width competition the grid exists to end. Nothing about the tap changes. */
/* cc#1237 · THE PAGER IS ONE ROW AT THE FOOT, dots plus "1 OF N", per R1's .pager. It replaces the
   per-page "1 of 5" caption that sat ABOVE each slide (.rpg) — that caption was inside the scroll
   track, so on a narrow phone it clipped at the track edge, which is the third defect in the
   founder's screenshot. The label is a SIBLING of #rdots, never a child: deckDots() rewrites
   className on every child of the dots element, so a label inside it would be turned into a dot. */
.rpager{display:flex;align-items:center;justify-content:center;gap:var(--space-8)}
.rpager .idots{margin-top:0}
.rplbl{font-family:'JetBrains Mono';font-size:var(--type-9);color:var(--chalk);
 letter-spacing:var(--track-px12);white-space:nowrap}
/* ── cc#1190 scope 3/4 · THE SHEET ───────────────────────────────────────────────────────────
   MIRRORS /m/home's news sheet — same veil, same 78vh ceiling, same grab handle, same slide-up,
   same body lock — but it is NOT the same CSS, and that is a finding rather than a shortcut.
   The card says "the SAME bottom-sheet component the news rows use". There is no such component:
   scorr_news_row.js ships a stylesheet for the ROW only, and home's sheet is page-local CSS in
   mobile/home.html built on that page's token set (--t-sunk, --txt). This page's tokens are
   --hi/--edge/--chalk/--muted, so copying those rules would resolve half of them to nothing.
   Extracting the sheet into a real shared component is the right fix and it is a bigger change
   than this card scopes, on a second surface — logged for its own card. */
.rveil{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:80}
.rsheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;
 z-index:81;background:var(--panel);border-top:var(--bw-1) solid var(--edge);border-radius:var(--radius-16) var(--radius-16) 0 0;
 box-shadow:0 -12px 34px rgba(0,0,0,.6);animation:rup .22s cubic-bezier(.2,.9,.3,1)}
@keyframes rup{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.rsheet{animation:none}}
.rgrab{width:38px;height:4px;border-radius:var(--radius-2);background:var(--edge);margin:var(--space-9) auto var(--space-4);flex:none}
.rshd{padding:var(--space-4) var(--space-18) var(--space-10);border-bottom:var(--bw-1) solid var(--edge);flex:none}
.rshd .sy{font-family:'Archivo Black';font-size:var(--type-17);transform:skewX(-6deg);display:inline-block}
.rshd .co{font-size:var(--type-125);color:var(--chalk);margin-top:var(--space-2)}
.rshd .meta{font-family:'JetBrains Mono';font-size:var(--type-95);letter-spacing:var(--track-px10);color:var(--chalk);
 margin-top:var(--space-5);display:flex;gap:var(--space-8);flex-wrap:wrap}
.rsb{overflow-y:auto;padding:var(--space-12) var(--space-18) 26px;-webkit-overflow-scrolling:touch}
.rsp{font-size:var(--type-13);line-height:1.6;color:var(--chalk);margin-bottom:var(--space-10)}
.rsp.hd{font-family:'JetBrains Mono';font-size:var(--type-105);font-weight:800;letter-spacing:var(--track-px15);
 color:var(--aqua);margin:var(--space-16) 0 var(--space-6)}
/* cc#1357 · the close button was RENDERED but invisible: --type-22 is defined nowhere, so the
   font-size fell back to the inherited body size, leaving a small bare chalk glyph with no button
   chrome floating beside the Archivo Black symbol — the founder's "no way to close". It now looks
   like a button: the page's own chip chrome (--hi fill, --edge border), a literal 22px glyph
   (no phantom token), same 44px target, same absolute spot. The back (←) variant shares it. */
.rsx{min-width:44px;min-height:44px;position:absolute;right:8px;top:6px;
 display:flex;align-items:center;justify-content:center;
 background:var(--hi);border:var(--bw-1) solid var(--edge);border-radius:var(--radius-10);
 color:var(--chalk);font-size:22px;cursor:pointer;line-height:1}
/* the peers button takes the page's own bevel language — .chip is what every other tappable
   thing here uses, at full width and tap height */
.rpeer{display:block;width:100%;box-sizing:border-box;min-height:44px;margin:var(--space-14) 0 var(--space-4);
 cursor:pointer;text-align:center;font-family:'JetBrains Mono';font-size:var(--type-105);font-weight:800;
 letter-spacing:var(--track-px15);color:var(--aqua);background:var(--hi);border:var(--bw-1) solid var(--aqua);
 clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.rptab{width:100%;border-collapse:collapse;margin-top:var(--space-10);font-family:'JetBrains Mono';font-size:var(--type-10)}
.rptab th{text-align:right;padding:var(--space-5) var(--space-4);color:var(--chalk);font-size:var(--type-85);letter-spacing:var(--track-px10);
 border-bottom:var(--bw-1) solid var(--edge);white-space:nowrap}
.rptab th:first-child,.rptab td:first-child{text-align:left}
.rptab td{text-align:right;padding:var(--space-7) var(--space-4);border-bottom:var(--bw-1) solid var(--edge);white-space:nowrap}
.rptab tr.self td{background:var(--hi);color:var(--chalk);font-weight:800}
.rptab tr.un td{color:var(--chalk);opacity:.65}
.rptab tr.tap{cursor:pointer}
.rpwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* cc#1309: the only markup that ever carried .rfoot (the VIEW DETAIL footer) is removed from
   raPaint. Left here rather than deleted — a future footer action would want this exact look and
   the class name is still checked defensively at the click-delegation guard below. */
.rfoot{display:flex;gap:var(--space-8);margin-top:var(--space-14);flex-wrap:wrap}
.rfoot a{flex:1;min-width:130px;min-height:44px;display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-family:'JetBrains Mono';font-size:var(--type-10);font-weight:800;letter-spacing:var(--track-px13);
 color:var(--pulse);background:var(--hi);border:var(--bw-1) solid var(--edge);
 clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
.rmore{display:block;width:100%;box-sizing:border-box;min-height:44px;margin-top:var(--space-10);text-align:center;
 line-height:44px;text-decoration:none;font-family:'JetBrains Mono';font-size:var(--type-10);font-weight:800;
 letter-spacing:var(--track-px15);color:var(--pulse);background:var(--hi);border:var(--bw-1) solid var(--edge);
 clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.plink{color:var(--pulse);font-weight:700;font-size:var(--type-125);text-decoration:none}
.foot{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--chalk);letter-spacing:var(--track-px8);margin:var(--space-6) var(--space-18) var(--space-20)}
/* cc#1096 R7-D2 · THE PIVOT ROW COULD NOT HOLD ITS COLUMNS. Founder frame 1:44: BANKNIFTY read
   56,69757,09457,55557,952 as one string, with the last value clipped mid-digit at the card edge.

   WHAT WAS ACTUALLY WRONG, and it is three things stacked, not one:
     gap:0        there was NO column separation at all. Five numbers sat shoulder to shoulder and
                  the only thing keeping them apart was slack inside each cell — luck, not layout.
     flex:1 with the default min-width:auto means a cell can never shrink below its own text, so
                  the moment a value is wider than its share the row grows past the card instead
                  of the columns giving way.
     nothing capped the overflow, so the spill landed under .card's clip-path and lost digits.
   At default text scale on a 360px viewport the values measure 28px in a 60px cell and it looks
   fine, which is why this survived review. It is one text-width step from breaking, and Chrome
   for Android's text scaling is exactly that step.

   THE FIX IS THE GRID, so the columns are declared instead of emergent: five equal tracks, a real
   6px gutter, min-width:0 so tracks share fairly, and overflow-x:auto so that if the content
   genuinely cannot fit, the row SCROLLS rather than hiding a digit. Nothing here touches a pivot
   value or the maths behind it — the numbers are rendered exactly as before. */
/* cc#1111 item 2: the wrap exists ONLY to carry the edge fade. .ladder is the scroller and an
   ::after on it would scroll away with the content instead of sitting at the clipped edge. */
/* cc#1124: the fade DID ship in cc#1111 (b254a91) — it was there and it did nothing, for two
   reasons that had to be fixed together.
   ONE, it faded to the wrong colour. The gradient ended at var(--bg), the PAGE background, but the
   ladder sits inside a .card whose surface is var(--panel). Fading a panel toward the page colour
   is a smear, not an edge — over the card it was very close to invisible, which is exactly what
   the founder reported: clipped flush, no cue. It now ends at var(--panel), the surface it is
   actually drawn on.
   TWO, and this is the real fix, the ladder should not need to scroll at all. The tracks were
   minmax(max-content,1fr): the MINIMUM of every track was its own content width, so five columns
   each demanded their full number and the grid overflowed by construction on any phone — the
   min-width:0 on .rung could never help, because the floor was on the TRACK, not the item.
   minmax(0,1fr) makes five EQUAL tracks that share whatever the card gives them (founder-approved
   revision: cells fill the width evenly rather than each holding out for a fixed minimum). On a
   360px phone that is ~61px a column against ~54px of "24,712.55" at 10px mono, so all five fit
   and there is nothing to scroll. The scroller and the fade both stay as the FALLBACK for a
   narrower screen or a longer number. No pivot value, no dist_pct maths and no column order is
   touched here — this is width and colour only. */
.ladwrap{position:relative}
.ladwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
 opacity:0;transition:opacity .15s;
 background:linear-gradient(to right,rgba(0,0,0,0),var(--panel))}
.ladwrap.hasmore::after{opacity:1}
/* cc#1186 · each index gets its own .well-grammar sub-tile so NIFTY50 and BANKNIFTY read as two
   instruments, not one run-on block — same raised-tile language as the GLOBAL TAPE tiles. */
/* cc#1235: the tile's own padding comes in with the rows — 11/10 top and bottom against a block
   that is now 30px shorter was the wrapper still sized for the old ladder. Left/right stays 12px
   so the value column keeps the same distance from the tile edge it always had. */
.lad-ix{background:var(--hi);border:var(--bw-1) solid var(--edge);padding:var(--space-9) var(--space-12) var(--space-9);margin-top:var(--space-10);
 clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.lad-ix:first-child{margin-top:0}
.lad-ix .ladwrap::after{background:linear-gradient(to right,rgba(0,0,0,0),var(--hi))}
/* cc#1127 — THIRD ATTEMPT, AND THE FIRST ONE WITH A STRUCTURAL GUARANTEE. cc#1111 and cc#1124
   (mine) both made the numbers USUALLY fit. Neither made overlap IMPOSSIBLE, which is why it came
   back as glyph soup on his phone while every measurement here said fine.
   WHAT ACTUALLY HAPPENED. The grid was never wrong: five equal tracks, no container overflow,
   measured clean at 320/360/390/412px. The value text was held off its neighbours only by being
   narrower than its track, and four things conspire the moment it is not — .rung b is nowrap so
   it cannot wrap, .rung had no overflow containment so it painted outside its track,
   text-align:center threw that overflow BOTH ways so one value hit both neighbours at once, and
   the text width depends on the FONT and the DEVICE TEXT SCALE, neither of which this page
   controlled. Reproduced with a real monospace face at 2x text scaling: the value overflows a
   54.8px cell by 17.5px and all four adjacent pairs overlap.
   THE GUARANTEE IS overflow:hidden ON THE CELL. A cell's text can no longer paint outside its own
   grid track under ANY font, any text scale, any language — the geometry forbids it, rather than
   the arithmetic happening to work out. That is the structural property the previous two fixes
   lacked, and it is why this one cannot regress the same way.
   THE OTHER TWO RULES STOP IT EVER NEEDING TO CLIP. text-size-adjust:100% neutralises mobile text
   inflation, which is the input that broke the arithmetic. And the value size is now tied to the
   viewport instead of pinned at 10px, so it shrinks with the cell: at 320px it is 8.3px against a
   46.8px cell (a 6-char value needs ~30px, 36% headroom), at 412px 10.7px against 65.2px.
   ellipsis is the last-resort cue if a value somehow still cannot fit — a clipped number that
   says it is clipped, never one silently painted over its neighbour. */
/* cc#1136 · ROUND 4 — the ellipsis clause above is WITHDRAWN, and both reasons are mine to own.
   ONE: that "last resort" fired on every value on his phone. Device font scaling in the founder's
   PWA browser defeats text-size-adjust, so the clamp could not shrink far enough, every .rung b
   overflowed, and the whole ladder rendered as 23,… — a number that has lost its digits is worse
   than one that needs a swipe. TWO: the scroll fallback I described in the cc#1127 result as the
   live safety net was DEAD CODE. minmax(0,1fr) tracks cannot exceed their container, so
   overflow-x:auto had nothing to scroll and .hasmore could never fire. I stated it as a working
   fallback and it was not one.
   THE RULING: numbers are NEVER ellipsized. Either five full columns fit, or the row becomes a
   real scroller with the edge fade. Transplanted verbatim from the approved design ref
   ladder_scrollmode_R1 per APPROVED_REF_EXACT_SPEC_RULE_V1 — three CSS changes and nothing else.
   WHY THE MEASUREMENT CANNOT BE FOOLED: scrollWidth vs clientWidth is the BROWSER reporting its
   own rendering after whatever font scale the device applied. It is not a prediction from font
   metrics, which is what every previous round got wrong. overflow:hidden on .rung stays, so the
   cc#1127 anti-overlap guarantee is untouched — the two rules cover different failures. */
/* cc#1187 · THE LADDER IS NOW VERTICAL, and this is a surrender that should have come two rounds
   ago. Four fixes (cc#1096/1111/1124/1127) plus two honest fallbacks (cc#1136 measured scroll,
   cc#1186 fixed sizes) all fought the same fight: five full Indian-format index values across a
   phone width the page does not control, under a device text scale it also does not control.
   Founder's 17:38 screenshot: Samsung text scaling inflates even fixed px, R2 off the edge again.
   A pivot ladder's five levels are REFERENCE data — all five must be visible at once, and a level
   you have to swipe for is a level you will not check at a glance. Vertical rows are immune by
   construction: one level per row, the value right-aligned with the whole card width to itself.
   It is also the shape traders already read — a ladder. R2 at the top, S2 at the floor.
   The grid, scrollmode, fade and measurement below are all retired WITH their failure mode. */
/* cc#1235 · THE LADDER GETS SMALLER, AND THE LABEL SHRINKS WITH IT. cc#1187 won the fight over
   whether all five levels are visible; it left them at headline weight. Six rows of 14px number
   on a 26px pitch made one index tile 223px, so the two tiles plus the card ran 495px — the
   ladder read like the page's headline when it is REFERENCE data you glance at.
   WHAT MOVED AND WHY EACH ONE. The value drops 14px -> 10px. The label drops WITH it, 10px ->
   8.5px, and that second move is the one that matters: the card asked for 55-65% of the old
   value size, which is 7.7-9.1px, and at that size the value would have been AT OR UNDER the
   10px label and stopped being the dominant thing in its own row. Shrinking the label first is
   what buys the value room to come down at all. 10px against 8.5px keeps the value ahead by the
   same ratio the old 14/10 pair had, so the eye still lands on the number, not its name.
   Row padding 5px -> 4px and the ladder's top gap 8px -> 6px close the rhythm so six rows read as
   one block rather than six separate lines.
   HIERARCHY IS UNTOUCHED — every cue below this comment is the same rule it was: CMP keeps its
   aqua label and aqua bar, PP keeps amber on both label and value, the label column keeps its
   fixed 26px track, and the above/below-PP subline and the CLOSED/WEEKEND clause live in .grp,
   which this change does not reach. Only sizes moved. */
.ladder{margin-top:var(--space-6)}
.lrow{display:flex;align-items:baseline;gap:var(--space-10);padding:var(--space-4) 0;border-top:var(--bw-1) solid var(--edge)}
.lrow:first-child{border-top:none}
.lrow .ll{font-family:'JetBrains Mono';font-size:var(--type-85);font-weight:700;letter-spacing:var(--track-px14);
 color:var(--muted);flex:none;width:26px}
.lrow .lbar{flex:1;height:2px;border-radius:var(--radius-2);background:var(--edge);opacity:.55}
.lrow .lv{font-family:'JetBrains Mono';font-weight:800;font-size:var(--type-10);letter-spacing:0;
 font-variant-numeric:tabular-nums;color:var(--chalk);flex:none}
.lrow.pp .ll,.lrow.pp .lv{color:var(--amber)}
.lrow.cmprow .ll{color:var(--aqua)}
.lrow.cmprow .lbar{background:var(--aqua);opacity:.8}
/* cc#1187: .rung/.rung b retired — the ladder is vertical rows now (see .lrow above) */
/* ══ cc#1314 · THE LADDER IS AN SVG NOW, founder-approved v3 — over TWO live breaks with cc#1306's
   HTML chips replaced by an HTML/CSS proportional line (v1, v2). Both v1 and v2 used ordinary DOM
   text (div/span, font-size in px) and both rendered numbers far larger than specified on the
   founder's real device, even AFTER a minimum-gap fix closed the collision hole v1 had — same CSS
   that looked correct in every other context. That is Android OS-level font-boosting applied to
   page text, which text-size-adjust does not stop in his PWA (cc#1136, and now confirmed a second
   time). SVG <text> sizes itself against the SVG's own internal viewBox coordinate system, not the
   page's font scale — it is a different rendering pipeline the OS boost does not reach. Approved
   on-device via scorr_digest_mobile_PIVOT_LINE_PREVIEW_v3.html (SVG text, includes the exact
   numbers that broke live + a worse cluster) before this landed here.
   .pline is now an <svg>, not a flex/grid container — ticks, the CMP dot, Day High/Low satellites
   and every label are SVG shapes/text drawn in ladder(ix)'s own JS, not HTML markup this CSS lays
   out. What stays CSS: colour tokens and the blink animation (opacity, not border/box-shadow,
   since SVG shapes take fill/stroke, not a CSS border). */
.pline{display:block;width:100%;height:auto}
.ptrk{stroke:var(--edge);stroke-width:1}
.ptick{fill:var(--hi);stroke:var(--muted);stroke-width:1}
.ptick.s{stroke:var(--heat)}
.ptick.r{stroke:var(--volt)}
.ptick.pp{stroke:var(--amber);fill:var(--amber)}
.plab{font-family:'JetBrains Mono',monospace;font-size:7.6px;letter-spacing:.02em;fill:var(--chalk)}
.pval{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:8.6px;fill:var(--chalk)}
.pval.pp{fill:var(--amber)}
.plab.cmp,.pval.cmp{fill:var(--aqua)}
.pval.cmp{font-size:9.4px}
/* CMP is the one marker that MOVES on every tick, so it is the one marker that should look
   alive — the founder's own words (cc#1306) were "red or green blink if day positive", refined
   into the two-signal agreement rule verbatim in ladder(ix). opacity-blink, not the border-glow
   cc#1306's HTML chip used, because an SVG circle takes fill/stroke rather than a CSS border. */
.pdot.grn{fill:var(--volt);stroke:var(--volt);animation:pBlinkG 1.5s ease-in-out infinite}
.pdot.red{fill:var(--heat);stroke:var(--heat);animation:pBlinkR 1.5s ease-in-out infinite}
.pdot.amb{fill:var(--amber);stroke:var(--amber)}
@keyframes pBlinkG{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes pBlinkR{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pdot.grn,.pdot.red{animation:none}}
.pdaylbl{font-family:'JetBrains Mono',monospace;font-size:7.6px;fill:var(--chalk)}
.pdaydot{fill:var(--muted)}
.pdaystem{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2;opacity:.55}
/* cc#1126 · the digest header's second row. PAGE-SCOPED under .dg-hdr: scorr_appshell.css is
   shared with /m/v10 and the other shell pages, and this is a digest layout decision, not a shell
   one. WHY IT CANNOT OVERLAP: the subtitle and the chip are flex SIBLINGS in a row. Flex items do
   not overlap — the chip is flex:none so it keeps its full label, the subtitle takes what is left
   with min-width:0 and ellipsises instead of wrapping, and if the chip ever grows wider than the
   whole row the wrap sends it to its own line rather than on top of anything. Three outcomes, all
   legible, none overlapping. Chip logic and countdown text are untouched — this is layout only. */
.dg-hdr{flex-wrap:wrap;row-gap:var(--space-5)}
.dg-hdr .as-pg{flex:1 1 auto;min-width:0}
.dg-sub{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4) var(--space-10);min-width:0}
/* flex-basis 0, NOT auto. With basis:auto the subtitle's base size is its full content width, so
   it and the chip together exceeded the row and the chip wrapped to a THIRD line — a 116px sticky
   header on a phone. Basis 0 makes the subtitle grow into whatever the chip leaves and ellipsise
   instead of forcing a wrap. The DATE survives every truncation because it is at the start of the
   string; "the morning read" is the decorative half and is the part that goes. */
.dg-sub .s{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-sub .as-slot{flex:none;margin-left:auto}
.unavail{font-size:var(--type-11);color:var(--chalk);font-family:'JetBrains Mono'}
/* cc#1121 · the INTERNALS deck. Same mechanism as mobile/home.html's hero deck — a scroll-snap
   flex track and a dot row — so the swipe feels identical to the one already on Home rather than
   being a second implementation with its own quirks. align-items:flex-start for the reason spelled
   out on .swipe-t there: a shorter card should end at its own content, not stretch to the tallest. */
.iswipe{margin:var(--space-2) 0 0}
.iswipe-t{display:flex;align-items:flex-start;gap:var(--space-9);overflow-x:auto;scroll-snap-type:x mandatory;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.iswipe-t::-webkit-scrollbar{display:none}
.ic{flex:0 0 100%;min-width:0;scroll-snap-align:center;background:var(--hi);border:var(--bw-1) solid var(--edge);
 padding:var(--space-14) var(--space-15) var(--space-13);clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.ichd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-8)}
.ichd .lb{font-family:'JetBrains Mono';font-size:var(--type-105);letter-spacing:var(--track-px15);color:var(--chalk)}
.ibars{font-family:'JetBrains Mono';font-size:var(--type-85);letter-spacing:var(--track-px9);color:var(--dim,var(--muted));white-space:nowrap}
/* cc#1188: the value is the headline of the card and now sizes like one; the 86A/120D sub-line is
   REMOVED by founder ruling (22-Aug) — the split lives in the ADR maths, not on the face. */
.ic .vv{font-family:'JetBrains Mono';font-size:var(--type-34);font-weight:700;line-height:1.1;margin-top:var(--space-5)}
/* Fixed height so swiping between cards never resizes the deck under the finger.
   cc#1188: doubled — the founder asked for a larger card and the chart is what earns the space. */
/* cc#1258 · height is AUTO now, not 72px. The svg keeps its own 72px; the axis row below adds its
   own height, and a fixed 72px on the wrapper would have clipped the labels away entirely. */
.ichart{margin-top:var(--space-12)}
.isvg{display:block;width:100%;height:72px;overflow:visible}
/* cc#1258 · THE TICK LABELS LIVE IN HTML, NOT IN THE SVG, and that is not a style preference.
   .isvg is preserveAspectRatio="none" so the viewBox is stretched horizontally to whatever width
   the card happens to be — which is exactly what makes the chart resolution-independent, and
   exactly what would smear <text> into distorted glyphs. Positioning the labels in HTML over the
   same 0-100 coordinate space keeps the type upright at every width. */
.ixax{position:relative;height:12px;margin-top:var(--space-4)}
.ixt{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;
 font-family:'JetBrains Mono';font-size:var(--type-8);letter-spacing:var(--track-px9);
 color:var(--dim,var(--muted))}
.ixt.d{color:var(--chalk)}          /* a day boundary reads a shade stronger than a time inside one */
.ixt.lo{transform:none;left:0}      /* clamped so an edge tick cannot hang off the card */
.ixt.hi{transform:none;left:auto;right:0}
.idots{display:flex;justify-content:center;gap:var(--space-5);margin-top:var(--space-8)}
.idots i{width:5px;height:5px;border-radius:50%;background:var(--edge);transition:.2s;cursor:pointer}
.idots i.on{background:var(--amber);width:15px;border-radius:var(--radius-3)}

/* ══ cc#1325 · LIVE NEWS — ported verbatim from scorr_v10_signal.html (cc#1322), replacing WHAT
   MOVED + GLOBAL EVENTS entirely, per the founder's decision after three unresolved rounds on
   this page's OWN news-sheet bug (cc#1312/cc#1323). No colour remapping needed this time — the
   two files' :root blocks are byte-identical (checked, not assumed: diffed to zero). */

<div class="foot">DAILY DIGEST · every claim tied to a number shown above · research only</div>

<script>
/* ONE payload: /api/digest/v3 (digest_v3.py, binding spec 965 v2.3). cc#1114 removed the second
   read (/api/v10/trades/paired, for ENGINE YESTERDAY) along with the section it fed, so this page
   now makes exactly one request. APP_SECTION_DISTRIBUTION_V1 still holds: positions live on Index
   Intel, the digest tells what happened. */
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num=(v,d=0)=>(typeof v==='number'?v:Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:d});
const sgn=(n,d=2)=>(n>=0?'+':'')+Number(n).toFixed(d);
const cx=n=>n>=0?'var(--volt)':'var(--heat)';
const senti=s=>{const t=String(s||'').toLowerCase();
  return /bull|posi/.test(t)?'var(--volt)':/bear|nega/.test(t)?'var(--heat)':/caut/.test(t)?'var(--amber)':'var(--muted)';};

/* APP_QA_R5 P5 · in-memory only, per the ref: the choice lasts the visit and is deliberately
   NOT persisted — the digest is a morning read, and a stale WEEK selection from yesterday would
   silently change what the founder thinks he is looking at. Default DAY. */
var TAPE_MODE='day';
function tile(t){
  const d=t.day_chg_pct!=null?Number(t.day_chg_pct):null;
  /* week comes from the PAYLOAD (global_heatstrip computes close vs close 5 of the symbol's OWN
     sessions back and nulls under 6 sessions) — never recomputed here, never defaulted to 0. */
  const w=t.week_chg_pct!=null?Number(t.week_chg_pct):(t.wk_chg_pct!=null?Number(t.wk_chg_pct):null);
  const v=TAPE_MODE==='week'?w:d;
  /* cc#1109 INVERTED TILES. Colour used to be the sign of the number, which is wrong for any
     symbol whose direction is inverted — INDIA VIX falls when the market calms, and a falling
     VIX was painting red. The payload ALREADY carries day_band / week_band with the inversion
     applied (global_heatstrip sets inverted:true on INDIAVIX), so the band is read, never
     recomputed here — one composer, same rule as the week number above. Sign is the fallback
     only when a tile ships no band. */
  /* cc#1123: "mid" is the volatility middle tier — a VIX move smaller than 5% either way. It is
     amber, matching the --amber this page already uses (#FF9F45, the same value as the NIFTY name
     on the Home hero's index line), so neutral reads as neutral rather than as a muted non-answer.
     Everything else about this mapping is unchanged, and the thresholds themselves are NOT decided
     here — global_heatstrip._band() is the single composer, per cc#1123 task 4. */
  const band=TAPE_MODE==='week'?t.week_band:t.day_band;
  const col=v==null?'var(--muted)'
           :(band?(String(band)==='mid'?'var(--amber)'
                  :(String(band).indexOf('up')===0?'var(--volt)':(String(band).indexOf('down')===0?'var(--heat)':'var(--muted)')))
                 :cx(v));
  return `<div class="tile well"><div class="lb">${esc(t.name||t.symbol||'—')}</div>
    <div class="vv" style="color:${col}">${v!=null?sgn(v)+'%':'—'}</div></div>`;
}
/* re-renders the grid IN PLACE: same cells, same order, only the % swaps (ref). */
function setTapeMode(m){
  if(m===TAPE_MODE)return;
  TAPE_MODE=m;
  var g=document.getElementById('gtiles');
  if(g&&window.__TILES)g.innerHTML=window.__TILES.map(tile).join('');
  var bs=document.querySelectorAll('#gsw button');
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===m);
}
function ladder(ix){
  const rungs=ix.rungs||[];
  if(!rungs.length)return `<div class="unavail">${esc(ix.reason||'no pivot ladder')}</div>`;
  const cmp=ix.cmp!=null?Number(ix.cmp):null;
  const order=['S2','S1','PP','R1','R2'];
  const bp=rungs.find(r=>r.label==='PP');
  const side=(cmp!=null&&bp)?(cmp>bp.value?'above':'below'):null;
  /* cc#1111: .cl marks a clause that must not break. "below PP 0.76%" is one phrase — the number
     means nothing on a line of its own. */
  const sideTxt=side?`<span class="cl" style="color:${side==='above'?'var(--volt)':'var(--heat)'}">${side} PP ${bp.dist_pct!=null?Math.abs(bp.dist_pct).toFixed(2)+'%':''}</span>`:'';
  /* cc#1257 · RENDERED IN PAYLOAD ORDER, and that is the whole point of this change.
     cc#1187 put R2 at the top "the way a ladder hangs"; rule 29630 overrules it — people read the
     lower number on top, so supports come first. But the ORDER IS NOT FLIPPED HERE. This function
     used to carry its own ['R2','R1','PP','S1','S2'] and look each level up by label, which made
     it a SECOND copy of the ordering that could silently disagree with the web digest rendering
     the same payload. It is deleted. digest_v3 now sorts the rungs ascending by value and hands
     back cmp_slot as the insertion index, and both digest surfaces simply render what they are
     given — one sort, at the source, per scope 3.
     The local fallback exists only for a payload that predates the sort (a client holding an old
     bundle mid-deploy); it computes the same slot from the values rather than guessing. */
  /* cc#1314 v3 · dotState is the colour rule verbatim, unchanged from v2: GREEN only when the day
     is up AND cmp is above PP (agreement), RED only when the day is down AND cmp is below PP
     (agreement), AMBER otherwise — a null day_chg_pct or a disagreement never gets rounded toward
     a direction. */
  const dayChg=ix.day_chg_pct!=null?Number(ix.day_chg_pct):null;
  const dayUp=dayChg!=null?dayChg>=0:null;
  const aboveP=side==='above'?true:(side==='below'?false:null);
  const dotState=(dayUp===true&&aboveP===true)?'grn':(dayUp===false&&aboveP===false)?'red':'amb';
  /* CORE vs SATELLITE split (unchanged from v2): DAY HIGH/DAY LOW sit off the S2..R2 scale and
     the above/below rotation entirely, so a wide day range can never compress the pivot spacing. */
  const coreRungs=rungs.filter(r=>r.label!=='DAY HIGH'&&r.label!=='DAY LOW');
  const dayRungs=rungs.filter(r=>r.label==='DAY HIGH'||r.label==='DAY LOW');
  const rvals=coreRungs.map(r=>r.value).filter(v=>v!=null);
  const minV=rvals.length?Math.min.apply(null,rvals):null, maxV=rvals.length?Math.max.apply(null,rvals):null;
  const spanV=(minV!=null&&maxV!=null&&maxV>minV)?(maxV-minV):null;
  const posOf=v=>spanV==null?50:Math.max(0,Math.min(100,((v-minV)/spanV)*100));
  const hlCls=r=>r.label==='PP'?'pp':(/^S/.test(r.label)?'s':'r');
  /* MIN_GAP declutter (unchanged from the take-2 fix): forward-then-backward pass so two
     proportionally-close values (CMP landing a few points from PP is a NORMAL market state, not
     an edge case — this is what actually broke live, twice, before this rule existed) never stack
     their tick/dot on top of each other. Position nudges, the printed number never does. */
  const MIN_GAP=9;
  function declutter(arr){
    const pts=arr.filter(it=>it.pos!=null);
    for(let i=1;i<pts.length;i++){ if(pts[i].pos-pts[i-1].pos<MIN_GAP)pts[i].pos=pts[i-1].pos+MIN_GAP; }
    for(let i=pts.length-1;i>=0;i--){
      if(pts[i].pos>100)pts[i].pos=100;
      if(i>0&&pts[i].pos-pts[i-1].pos<MIN_GAP)pts[i-1].pos=pts[i].pos-MIN_GAP;
    }
    for(let i=0;i<pts.length;i++)pts[i].pos=Math.max(0,Math.min(100,pts[i].pos));
  }
  const coreSlot=coreRungs.filter(r=>r.value!=null&&cmp!=null&&Number(r.value)<cmp).length;
  let items=[];
  coreRungs.forEach((r,i)=>{
    if(cmp!=null&&i===coreSlot)items.push({cmp:true,value:cmp});
    items.push({label:r.label,value:r.value,cls:hlCls(r)});
  });
  if(cmp!=null&&coreSlot>=coreRungs.length)items.push({cmp:true,value:cmp});
  items.forEach(it=>{it.pos=it.value!=null?posOf(it.value):null;});
  declutter(items);
  const n=items.length;
  /* cc#1314 v3 · THE LINE IS AN SVG NOW, founder-approved after two live breaks with HTML/CSS text
     (see the CSS block above for why). W/H/TRK_Y/PAD are the SVG's own internal viewBox units, not
     page pixels — the viewBox scales to whatever width the card actually has, same as this file's
     other inline SVGs (iChart). xOf converts a 0-100 declutter position into an x coordinate
     inside that viewBox.
     cc#1324 · H 76->94, TRK_Y 38->50: the founder could not see the Day High/Low label — measured
     why, headlessly, rather than eyeballing it. getBBox() on .pdaylbl at the old y=6 baseline
     returned bbox.y = -1.21, i.e. the glyph itself started 1.2 viewBox units ABOVE y=0 and was
     genuinely clipped by the SVG's own bounds, not merely cramped. Pushing TRK_Y down gives the
     day band real headroom above it (checked post-fix: bbox.y = +2.79, comfortably inside), and
     the taller H is the "more vertical space" the founder asked for directly — both from one
     change. Below-track spacing (TRK_Y+18/+29) is untouched and still clears H's bottom edge with
     room to spare. */
  const W=340,H=94,TRK_Y=50,PAD=6;
  const xOf=pct=>PAD+(pct/100)*(W-2*PAD);
  let svg=`<line class="ptrk" x1="${PAD}" y1="${TRK_Y}" x2="${W-PAD}" y2="${TRK_Y}"/>`;
  items.forEach(function(it,i){
    const x=xOf(it.pos!=null?it.pos:50);
    const half=(i%2===0)?'above':'below';
    const labY=half==='above'?TRK_Y-28:TRK_Y+18;
    const valY=half==='above'?TRK_Y-17:TRK_Y+29;
    /* text-anchor keeps the first/last item's text INSIDE the viewBox instead of centring off the
       edge — the SVG equivalent of v1/v2's .lo/.hi classes, same structural (not measured) rule. */
    const anchor=(i===0)?'start':(i===n-1?'end':'middle');
    const tx=(i===0)?x+2:(i===n-1?x-2:x);
    if(it.cmp){
      svg+=`<circle class="pdot ${dotState}" cx="${x}" cy="${TRK_Y}" r="4.4"/>`
        + `<text class="plab cmp" x="${tx}" y="${labY}" text-anchor="${anchor}">CMP</text>`
        + `<text class="pval cmp" x="${tx}" y="${valY}" text-anchor="${anchor}">${esc(num(it.value))}</text>`;
    }else{
      svg+=`<circle class="ptick ${it.cls}" cx="${x}" cy="${TRK_Y}" r="2.6"/>`
        + `<text class="plab" x="${tx}" y="${labY}" text-anchor="${anchor}">${esc(it.label)}</text>`
        + `<text class="pval ${it.cls==='pp'?'pp':''}" x="${tx}" y="${valY}" text-anchor="${anchor}">`
        + (it.value!=null?esc(num(it.value)):'—')+'</text>';
    }
  });
  /* Day High/Day Low satellites: same posOf scale, same declutter pass against EACH OTHER, drawn
     above the core row with a dashed stem down to the track — clamped honestly to the edge if a
     day extreme falls outside the core range, same off-scale rule the core CMP dot follows. */
  const dayItems=dayRungs.map(r=>({r:r,pos:r.value!=null?posOf(r.value):null}));
  declutter(dayItems);
  dayItems.forEach(function(di,i){
    const r=di.r;
    if(r.value==null)return;
    const x=xOf(di.pos);
    const short=r.label==='DAY HIGH'?'H':'L';
    const anchor=(x<PAD+14)?'start':(x>W-PAD-14?'end':'middle');
    svg+=`<line class="pdaystem" x1="${x}" y1="12" x2="${x}" y2="${TRK_Y-5}"/>`
      + `<circle class="pdaydot" cx="${x}" cy="14" r="1.6"/>`
      + `<text class="pdaylbl" x="${x}" y="10" text-anchor="${anchor}">${short} ${esc(num(r.value))}</text>`;
  });
  /* cc#1186 SESSION-HONEST STATE. ix.tier printed LIVE at 16:56 with the market an hour closed
     (founder screenshot 21-Aug) — the payload tier is a feed property, not a clock. The clause
     now follows d.market.state, the SAME composer the header chip already reads, via window.__MK:
     tier prints only while the market is OPEN; otherwise the market label (CLOSED / PRE-OPEN /
     CAS) prints, muted. One composer, no second clock, and the card can no longer disagree with
     the chip above it. */
  const mk=window.__MK||{};
  const stTxt=mk.state==='OPEN'?esc(ix.tier||''):`<span style="color:var(--chalk)">${esc(mk.label||'')}</span>`;
  return `<div class="lad-ix"><div class="grp"><h3>${esc(ix.symbol)}</h3>
    <span class="note"><span class="cl">${stTxt}</span> · ${sideTxt}</span></div>
    <svg class="pline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${svg}</svg></div>`;
}

/* cc#1111 item 2: .ladder has overflow-x:auto, but a clipped column with no scrollbar and no fade
   gives a reader no reason to believe a fifth column exists — on the founder's screenshot R2 was
   simply cut flush at the screen edge. This is the same fade-when-scrollable rule the chip bar and
   the mobile nav already use: the cue appears only while there IS more to the right, and clears at
   the end, because a fade over nothing is a hint that lies. Bound per ladder, and re-bound after
   every boot render since the nodes are replaced. */
/* ── cc#1121 · INTERNALS becomes a four-card swipe deck with 5-min history ────────────────────
   Four cards, not three: BREADTH earns its own because advances and declines are stored in
   adr_intraday alongside adr, at the same 5-min cadence and the same depth — so there is a real
   series behind it, not a single number with a chart bolted on.
   The swipe is the deck pattern this app family already uses (mobile/home.html's hero deck):
   CSS scroll-snap on a flex track plus a dot row that follows the finger. No new gesture code and
   nothing to fight the page's own vertical scroll.
   TODAY'S NUMBER STAYS THE HEADLINE. The chart sits under it, and neither the value nor its
   colour rule changed — both still come from the daily payload exactly as the three tiles did. */
function intCard(key, label, val, col, sub, stale){
  /* cc#1188: `sub` is accepted and DROPPED — founder ruling 22-Aug removed the 86A/120D line from
     the face. Kept in the signature so no call site changes and the split stays one edit from
     returning if he ever wants it back. data-ib/data-ic instead of ids: the loop track clones
     this markup and ids must stay unique. */
  return `<div class="ic"><div class="ichd"><span class="lb">${label}${stale?' · STALE':''}</span>
      <span class="ibars" data-ib="${key}">…</span></div>
    <div class="vv" style="color:${col}">${val}</div>
    <div class="ichart" data-ic="${key}"></div></div>`;
}
/* cc#1188 · CONTINUOUS SWIPE. The track renders the card set THREE times and starts the view on
   the middle set. Whenever a snap settles inside the first or last set, the view is jumped one
   whole set toward the middle with behavior:'auto' — the clone under the finger is pixel-identical
   (iChart draws into every clone), so the jump cannot be seen and the swipe never hits a wall in
   either direction. Dots read index modulo the real count. */
/* cc#1190 · THE HELPERS TAKE A DECK ID NOW, because this page has TWO decks.
   They were written for the internals deck and hardcoded #itrack, #idots and a single IN_N.
   A second deck reusing them would have driven the internals track from the results track's
   scroll and read both dot rows off one count. Forking them into iDots2/iWrap2 was the other
   option and it is the wrong one - one continuous-swipe implementation, parameterised, is the
   rule this app already follows for scorr_mobile_cards.js.
   iDots() and iWrap() survive as the internals deck's own names so every existing call site,
   including the onscroll= attribute in the markup, is untouched. DECKS holds the REAL card count
   per track, replacing the single IN_N. */
var DECKS={}, DECK_TMR={};
/* THE PITCH IS THE SLIDE WIDTH PLUS THE GAP, NOT clientWidth, and that was wrong before this card
   touched it. .iswipe-t is a flex row with gap:9px, so a slide advances by width+9 while the
   helpers stepped by clientWidth — 9px short per slide, compounding across a set. On the
   internals deck (6 cards) scroll-snap mandatory drags it back onto a snap point each time, which
   is why it has never looked broken; on a deck with more slides per set the dots start reading the
   wrong index. Measured here rather than hardcoded, so a future gap change cannot desync it. */
/* cc#1239 · A REGISTRY, NOT A GROWING TERNARY. deckPark resolved its dots element with
   `trackId==='itrack'?'idots':'rdots'`, which silently made every future deck the results deck's.
   This card adds two more (Domestic and Global news), so the mapping is declared once here and a
   new deck registers itself rather than editing a conditional that already had the shape of a bug. */
var DECK_DOTS={itrack:'idots',rtrack:'rdots',nwdtrack:'nwddots',nwgtrack:'nwgdots'};
/* cc#1252 · PITCH COMES FROM THE LAYOUT, NOT FROM A RECT. This is the cc#1245 fix ported from
   scorr_v10_signal.html, where the same helper reported 333.484 against a true pitch of 333 and
   left every deck 29px short over 11 pages. getBoundingClientRect().width is sub-pixel, and the
   error is multiplied by the page index at every call site. The delta between two consecutive
   children is the pitch the browser actually laid out, with no rounding to accumulate.
   The rect path is KEPT as the single-child fallback, because with one child there is no delta to
   take and a deck of one page has no drift to suffer. */
function deckPitch(tr){
  var k=tr.children;
  if(k.length>1)return Math.max(1,k[1].offsetLeft-k[0].offsetLeft);
  if(!k.length)return Math.max(1,tr.clientWidth);
  var cs=getComputedStyle(tr);
  var gap=parseFloat(cs.columnGap||cs.gap||0)||0;
  return Math.max(1,k[0].getBoundingClientRect().width+gap);
}
/* cc#1252 · offsetLeft is relative to the OFFSET PARENT, not the scroll container, so it carries a
   constant ancestor offset. The DELTA between two pages is exact — that is what deckPitch uses —
   but the absolute value is not a scroll position until the first page's offset is subtracted.
   Scrolling to a page by its OWN offset, rather than by index times pitch, is what makes the rest
   position exactly where the browser put that page. Same shape as v10's dkAt. */
function deckAt(tr,i){
  var k=tr.children;
  if(!k.length)return 0;
  return k[i]?(k[i].offsetLeft-k[0].offsetLeft):i*deckPitch(tr);
}
function deckDots(trackId,dotsId){
  var tr=document.getElementById(trackId), dots=document.getElementById(dotsId), n=DECKS[trackId];
  if(!tr||!dots||!n)return;
  var w=deckPitch(tr);
  var i=Math.round(tr.scrollLeft/w)%n;
  Array.prototype.forEach.call(dots.children,function(el,j){
    el.className=(j===i?'on':'');
    el.onclick=function(){
      var cur=Math.round(tr.scrollLeft/w);
      tr.scrollTo({left:deckAt(tr,cur-(cur%n)+j),behavior:'smooth'});
    };
  });
  /* cc#1237: hand the resolved page index back. The results pager prints "1 OF N" beside these
     dots and it must never disagree with which dot is lit, so it reads THIS number rather than
     recomputing scrollLeft/pitch itself. Additive - iDots()/iWrap() ignore the return value. */
  return i;
}
function deckWrap(trackId,dotsId){
  deckDots(trackId,dotsId);
  if(DECK_TMR[trackId])clearTimeout(DECK_TMR[trackId]);
  DECK_TMR[trackId]=setTimeout(function(){
    var tr=document.getElementById(trackId), n=DECKS[trackId];
    if(!tr||!n)return;
    var w=deckPitch(tr), i=Math.round(tr.scrollLeft/w);
    var to=(i<n)?i+n:(i>=2*n)?i-n:-1;
    if(to>=0)tr.scrollTo({left:deckAt(tr,to),behavior:'auto'});
  },90);
}
/* park a freshly rendered deck on the MIDDLE set, instantly, before it is ever seen */
function deckPark(trackId){
  var tr=document.getElementById(trackId), n=DECKS[trackId];
  /* cc#1252: park ON the middle set's first page by its own offsetLeft rather than by arithmetic,
     so the rest position is exactly where the browser laid that page out. */
  if(tr&&n)tr.scrollTo({left:deckAt(tr,n),behavior:'auto'});
  var i=deckDots(trackId,DECK_DOTS[trackId]);
  if(trackId==='rtrack')raPagerLabel(i);
}
function iDots(){ deckDots('itrack','idots'); }

/* cc#1237 scope 2 · R1 ROW ANATOMY. The row is a grid: name block left on row 1, verdict pill

/* cc#1330 · pure JS pagination, no DOM. Cheap at any RA_MAX — it is only ever array slicing over

/* ══ cc#1330 · WINDOWED RENDERING FOR THE RESULTS DECK ══════════════════════════════════════
   ROOT CAUSE, confirmed by reading the live post-cc#1329 code, not guessed: raDeck() used to
   build the swipe track as set+set+set — the full page-set rendered THREE TIMES in the DOM, the
   technique every other deck on this page (itrack, nwdtrack, nwgtrack, via the shared deckPark/
   deckWrap/deckDots trio) still uses to fake an infinite loop: park on the middle copy, and
   silently re-center by exactly one copy-width whenever a scroll settles near either outer copy.
   That is fine at the scale those decks stay at. It was fine here too when RA_MAX capped this
   deck at 5 pages (15 page-divs, ~60 rows). cc#1329 uncapped RA_MAX — a deliberate, correct
   founder decision, kept as-is, NOT reverted here — and nobody re-checked whether tripling still
   scaled at the new page counts. ALL tier is now ~159 pages × 3 = ~477 page-divs, up to ~1,900
   row elements rebuilt via host.innerHTML on every tier switch. That synchronous DOM replacement
   immediately followed by deckPark's scrollTo is what read as the shake and the scroll-jump.

   THE FIX IS A DIFFERENT RENDERING STRATEGY FOR THIS DECK, not a timing patch on the old one — a
   delay before scrollTo would only mask the shake without touching the DOM-scale problem underneath.
   This deck now renders a WINDOW of at most 3 real page-divs at a time (the current page plus one
   buffer page on each side, fewer at the first/last page), never a copy of anything. Swiping to
   the end of a window settles, then rebuilds the window around the new center — same technique in
   spirit, sized to 1-3 real pages instead of the entire filtered set. This is applied uniformly
   at every tier/page-count rather than only above some threshold: one code path is one thing to
   verify, and the spec's own two suggested directions both leave that choice to CC/Fable.

   TRADE-OFF, STATED PLAINLY: this deck no longer loops infinitely — swiping past the last real
   page (or before the first) just stops, the same as any ordinary paginated list, rather than
   wrapping back around. The founder's card explicitly authorises exactly this ("abandoning the
   infinite-loop triple-buffer illusion for large counts specifically"). itrack/nwdtrack/nwgtrack
   are UNTOUCHED — they stay small enough that the old shared triple-buffer approach is correct
   for them, and this card is scoped to the deck that actually broke.

   The shared deckAt()/deckPitch() helpers ARE reused below — they only ever read whatever is
   currently in the DOM (children[0]/children[1] offsets), so they work identically whether that
   DOM holds 3 copies of everything or 3 real neighbouring pages. deckPark/deckWrap/deckDots
   themselves are NOT reused, because their re-centering logic assumes copy-identical content,
   which a real 3-page window does not have. */
var RA_WIN_LO=0, RA_WIN_CENTER=0, RA_WIN_TMR=null;
function raWinDotsSync(center){
  var dots=document.getElementById('rdots');
  if(!dots)return;
  Array.prototype.forEach.call(dots.children,function(el,j){el.className=(j===center?'on':'');});
}
/* Renders pages[center-1..center+1] (clamped at the real ends) into #rtrack and parks on the
   centre page's own offset, instantly — same "park by the child's actual offsetLeft, not by
   arithmetic" discipline deckAt already uses, so the rest position is exactly where the browser
   laid that child out rather than a computed guess that can drift by a pixel. Called on first
   paint (center 0), on a tier switch (center 0, "reset to page 1" per the card), on a dot tap
   (jump straight to that page), and from raWinScroll below (settle after a swipe). */
function raWinRender(center){
  var pages=raPagesArr();
  if(!pages.length)return;
  center=Math.max(0,Math.min(center,pages.length-1));
  var lo=Math.max(0,center-1), hi=Math.min(pages.length-1,center+1);
  var tr=document.getElementById('rtrack');
  if(!tr)return;
  var html='';
  for(var i=lo;i<=hi;i++)html+=raPageHtml(pages[i]);
  tr.innerHTML=html;
  RA_WIN_LO=lo; RA_WIN_CENTER=center;
  tr.scrollTo({left:deckAt(tr,center-lo),behavior:'auto'});
  raWinDotsSync(center);
  raPagerLabel(center);
}
function raWinInit(){ raWinRender(0); }
/* Debounced settle handler, same 90ms shape as deckWrap's — long enough that mid-swipe scroll
   events do not each trigger a rebuild, short enough that it still reads as instant once the
   swipe stops. Maps the settled scroll position back to a REAL page index (RA_WIN_LO + which
   child is centred) and, only if that differs from the page already centred, rebuilds the
   window there. Landing back on the same centre (a swipe that snapped back, or a stray scroll
   event) does nothing — there is nothing stale to refresh. */
function raWinScroll(){
  if(RA_WIN_TMR)clearTimeout(RA_WIN_TMR);
  RA_WIN_TMR=setTimeout(function(){
    var tr=document.getElementById('rtrack');
    if(!tr)return;
    var w=deckPitch(tr), childIdx=Math.round(tr.scrollLeft/w);
    var newCenter=RA_WIN_LO+childIdx;
    if(newCenter!==RA_WIN_CENTER)raWinRender(newCenter);
  },90);

function rnAgo(ts){
  if (!ts) return '';

var RN_SW = { x:0, y:0, armed:false, just:false };

    if (!e.touches || e.touches.length !== 1){ RN_SW.armed = false; return; }
    RN_SW.x = e.touches[0].clientX; RN_SW.y = e.touches[0].clientY; RN_SW.armed = true;
  }, { passive:true });

  box.addEventListener('touchmove', function(e){

function loadRawNews(){

    .then(function(d){

      RN.polish = (d.articles || [])
        .filter(function(a){ return a && String(a.headline_clean || '').trim(); })
        .filter(function(a){

  requestAnimationFrame(function(){

function nwClose(){

function nwBindSheet(sheet){

  sheet.addEventListener('touchstart', function(e){

  }, { passive: true });

    var t = e.changedTouches && e.changedTouches[0];
    if (!t || !sb) return;

    if (t.clientY - NW.y > 60) nwClose();

document.addEventListener('keydown', function(e){

/* ── cc#1190 scope 3/4/5 · THE SHEET ─────────────────────────────────────────────────────────
   RA_SEEN is the back-stack for peer hops. Tapping a peer swaps the sheet to that symbol, and
   without a stack the only way back was to close and re-find the row you came from. */
var RA_OPEN=null, RA_SEEN=[], RA_PEERS=null, RA_PSHOW=false;

function raClose(){
  var v=document.getElementById('rveil'), s=document.getElementById('rsheet');
  if(v)v.remove(); if(s)s.remove();
  document.body.style.overflow='';
  RA_OPEN=null; RA_SEEN=[]; RA_PEERS=null; RA_PSHOW=false;
}
/* cc#1239 · THE SHEET SHELL, LIFTED OUT OF raOpen SO NEWS CAN USE IT. The card says extend the
   sheet the app already uses and never fork it, and this is the literal form of that: one veil,
   one #rsheet element, one body-scroll lock, one close path. Results and news differ only in what
   they paint INTO it. Lifted verbatim from raOpen — no behaviour changed for results. */
function sheetEnsure(){
  /* cc#1323 · SELF-HEALING GUARD, not a re-attempt of the cc#1312 rAF fix. Two rounds of static
     reading could not construct or explain the reported shape — a blurred veil PERSISTING with no
     sheet content, outlasting the tap that opened it — through the ghost-click race (that removes
     veil+sheet TOGETHER, a flash, not a lingering half-open state) or through an async exception
     (nwOpen has no async code at all; raOpen's is already caught by its own .then().catch() chain,
     verified by re-reading it). Whatever the root cause turns out to be, this makes the DESCRIBED
     STATE impossible to get stuck in: the old guard only ever checked #rsheet, so if #rveil ever
     existed WITHOUT a matching #rsheet (exactly the reported shape) sheetEnsure() would see no
     #rsheet and try to create a SECOND veil on top of the orphaned one, doing nothing to clear it.
     Now it checks BOTH and tears down whatever is there — the orphan or a mismatched pair — before
     building fresh, so the next tap on a row self-heals instead of staying stuck. */
  var exSheet=document.getElementById('rsheet'), exVeil=document.getElementById('rveil');
  if(exSheet&&exVeil)return;   /* normal case: sheet already open, caller swaps its content in place */
  if(exSheet||exVeil){
    if(exSheet)exSheet.remove();
    if(exVeil)exVeil.remove();
    document.body.style.overflow='';
  }
  var v=document.createElement('div'); v.id='rveil'; v.className='rveil';
  var s=document.createElement('div'); s.id='rsheet'; s.className='rsheet';
  document.body.appendChild(v); document.body.appendChild(s);
  document.body.style.overflow='hidden';   /* the sheet owns the gesture while it is open */
  /* cc#1312: the veil's close handler used to bind right here, synchronously, which put it live
     for the SAME tap that opened the sheet. A full-screen element inserted under the finger
     mid-event can pick up the synthesized click meant for the row that opened it — mobile Chrome
     composes that click from the touch's final on-screen point, and elementFromPoint there is now
     the veil, not the row, once it is in the DOM. Binding one frame later leaves the veil closable
     on every genuine tap AFTER this one, but not on the tap that created it. */
  requestAnimationFrame(function(){ if(v.parentNode)v.onclick=raClose; });
}
/* ── cc#1260 · A FAILED SHEET MUST NEVER LEAVE A BLOCKING OVERLAY ────────────────────────────
   The reported symptom is the shape of this bug class exactly: sheetEnsure() mounts the veil
   FIRST, and every painter runs after it. Any throw between those two points leaves a full-screen
   veil over an empty, zero-height sheet — the page looks dead, and the only reason it is not
   permanently dead is that the veil happens to carry an onclick.
   That is one unguarded expression away at all times, on every surface that uses this sheet, so
   the guard belongs at the seam rather than on whichever painter is suspected today. sheetPaint
   runs the build inside try/catch: on a throw it paints the honest minimal view the card asks for
   instead of nothing, and if even that fails it tears the whole thing down. There is no path left
   where an exception can end with a veil and no way out. */
function sheetPaint(build, minimal){
  var s=document.getElementById('rsheet');
  if(!s){ raClose(); return false; }
  try{
    s.innerHTML=build();
    return true;
  }catch(e){
    try{ if(window.console&&console.error)console.error('cc#1260 sheet render failed', e); }catch(_){}
    try{
      /* The honest minimal view: whatever the caller could still say about the item. Never a
         fabricated body — an empty sheet that says it is empty beats a blank one that looks
         broken, and both beat a silent overlay. */
      s.innerHTML='<div class="rgrab"></div>'
        + '<div class="rshd" style="position:relative">'
        + '<button class="rsx" onclick="raClose()" aria-label="close">&times;</button>'
        + '<div class="co" style="font-size:var(--type-14);line-height:1.35">'
        + (minimal||'This item could not be opened.') + '</div></div>'
        + '<div class="rsb"><div class="rsp" style="color:var(--chalk)">'
        + 'The detail failed to render. Nothing is invented in its place.</div></div>';
      return false;
    }catch(e2){ raClose(); return false; }
  }
}

   gesture with the sheet open, or a return to a frozen page, can restore the veil with nothing

   Short line, has letters, and every letter is uppercase. */
function raIsHead(line){

  return letters.length>1 && line.length<=60 && letters===letters.toUpperCase();
