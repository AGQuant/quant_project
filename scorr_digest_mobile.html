/* THE X AXIS IS TIME, NOT BAR INDEX, and that is load-bearing rather than pedantic. NIFTY PCR has
   ZERO rows for 18-Aug while BANKNIFTY has 71. Drawn by index, 17-Aug would sit flush against
   19-Aug and a missing session would read as a continuous market. The server sends every TRADING
   date in the span (weekdays minus nse_holidays) and each point's session slot plus its fraction
   through that session, so a session with no data keeps its slot and shows up as a gap — tinted,
   counted underneath, and named in the payload as empty_sessions.
   BASELINE. 1.00 for ADR and both PCRs, 0 for BREADTH A-D. These are not arbitrary: 1.00 is the
   line the tile's own colour rule already turns on (advances beating declines, put writers over
   call writers), so a bar above the baseline is green for the same reason the big number is. */
function iChart(s){
  /* cc#1188: hosts are matched by data attribute, PLURAL, because the loop track renders the card
     set three times (see the deck note) and an id may only exist once. Every clone gets the same
     drawing, so the wrap jump lands on pixels identical to the ones it left. */
  var hosts=document.querySelectorAll('[data-ic="'+s.key+'"]');
  if(!hosts.length)return;
  /* cc#1258 · the header answers WHEN, not HOW MANY. "200 BARS" told the reader the size of an
     internal window, which is implementation detail; "5-MIN · 21 AUG 15:15" tells them the
     resolution and how fresh the last bar is, which is the thing a stale chart hides.
     THE TIMESTAMP COMES FROM THE DATA, NEVER THE CLIENT CLOCK. s.last is formatted server-side
     from the series' own last row, and adr_intraday.ts is a naive column carrying IST, so that
     string is already IST wall time with no conversion to get wrong. Reading a phone's clock here
     would print the reader's timezone over Indian market data — the exact naive-column trap this
     card warns about. Only the presentation changes: "21-Aug 15:15" -> "21 AUG 15:15". */
  var stamp=String(s.last||'').replace('-',' ').toUpperCase();
  document.querySelectorAll('[data-ib="'+s.key+'"]').forEach(function(bl){
    bl.textContent=s.bars?('5-MIN'+(stamp?' · '+stamp:'')):'NO HISTORY';
  });
  if(!s.bars){
    hosts.forEach(function(h){h.innerHTML='<div class="unavail">'+esc(s.note||'no intraday history stored')+'</div>';});
    return;
  }
  /* cc#1307 · NO GAP BETWEEN DAYS, founder ruling over the cc#1121/cc#1236 "enumerate the full
     calendar so a feed hole reads as a hole" design. That design is not wrong about the DATA — a
     day with zero bars really is missing and _internals_series still reports it, unnamed nowhere
     — it was wrong about the SPACE: reserving a full session-width slot for a day with nothing in
     it draws a blank rectangle between two real trading days, which is exactly the "dark blank
     rectangle between 20 Aug and 21 Aug" the founder photographed.
     THE FIX IS COMPRESSION, NOT DELETION. liveSessions drops empty_sessions from the x-axis
     entirely — every index below is computed against liveSessions.length, never s.sessions.length
     — so days with data sit adjacent with the line running straight through, and a day with none
     simply consumes no width. s.points never carries a session index that IS empty (the backend
     only emits a point where a bar exists), so `remap` always has an entry for every p.s used
     below; nothing here can look up a hole that was never indexed. The `holes` rectangle this
     used to draw for empty_sessions is removed with the slot it was drawn into — there is no
     longer an x position for it to occupy. */
  var emptySet={}; (s.empty_sessions||[]).forEach(function(d){emptySet[d]=true;});
  var liveSessions=(s.sessions||[]).filter(function(d){return !emptySet[d];});
  var remap={};
  (s.sessions||[]).forEach(function(d,i){if(!emptySet[d])remap[i]=liveSessions.indexOf(d);});
  var W=100, H=72, n=Math.max(1,liveSessions.length);
  var base=(s.key==='breadth')?0:1;
  var vs=s.points.map(function(p){return p.v;});
  /* ROBUST SCALE, AND THE CLIPPING IS SHOWN RATHER THAN HIDDEN. Measured on the live series before
     choosing this: NIFTY PCR's last 200 bars run 0.631 to 3.255, but the 95th percentile is 0.979
     and the median 0.928 — ONE bar carries that top. On a full-range axis the other 199 sit inside
     the bottom eighth of the card and the chart says nothing. The axis is therefore the 2nd-98th
     percentile, and any bar outside it is drawn to the edge with an amber cap and COUNTED in the
     line underneath, with the true extreme printed. A silent truncation would be the dishonest
     version of this; a chart that cannot be read is the useless one. */
  var iq=function(a,q){
    var b=a.slice().sort(function(x,y){return x-y;});
    var i=(b.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
    return lo===hi?b[lo]:b[lo]+(b[hi]-b[lo])*(i-lo);
  };
  /* CLIP ONLY THE SIDE THAT ACTUALLY NEEDS IT. A flat 2nd-98th window clips both ends whether or
     not there is anything extreme there, and the first version of this said "5 bars off-scale" on
     the NIFTY series when exactly ONE bar is an outlier — the other four were ordinary low bars
     sitting just under the 2nd percentile. Lumping them together makes the caption misleading in
     the direction that matters. A side is clipped only when its tail runs more than two
     inter-quantile spans past the window; otherwise the real extreme is kept. */
  var q02=iq(vs,0.02), q98=iq(vs,0.98), iqr=(q98-q02)||Math.abs(base)||1;
  var vmin=Math.min.apply(null,vs), vmax=Math.max.apply(null,vs);
  var top=Math.max((vmax-q98>2*iqr)?q98:vmax, base);
  var bot=Math.min((q02-vmin>2*iqr)?q02:vmin, base);
  var span=(top-bot)||1;
  var y=function(v){return H-(Math.max(bot,Math.min(top,v))-bot)/span*H;};
  /* cc#1137: over/omin/omax are gone with the caption they existed to write. `clipped` STAYS —
     it is what draws the amber clamped-point marker, and the in-chart honesty is not negotiable. */
  var yb=y(base);
  /* cc#1128 — A LINE, NOT BARS (founder ruling on the cc#1121 output: 200 dense bars read as a
     solid block, which is true — at ~0.5px a bar there is no shape left to see).
     THE LINE BREAKS RATHER THAN LYING. It is not one continuous stroke: a segment ends wherever
     the data actually stops. Two kinds of break, both real — the overnight boundary between
     sessions, and a hole inside a session (17-Aug's NIFTY feed stops at 11:20 and resumes at
     14:00). Detected from the x distance between consecutive points against the nominal 5-minute
     step, so a gap is never interpolated across. That is the same honesty rule as the empty
     session slots: nothing is drawn where nothing was recorded.
     COLOUR FOLLOWS THE READ, so the stroke turns at the baseline — green above 1.00, red below —
     matching the colour rule the headline number already uses. Runs of the same side are emitted
     as one polyline, and the crossing point belongs to both runs so the stroke stays joined. */
  var step=(W/n)/78, brk=step*2.5;      /* 78 five-min bars fill one session slot */
  /* cc#1236 · EDGE is the most missing session edge an overnight join is allowed to span, ~60 min
     of the 375-min slot. It exists because the real series does NOT run the full session: measured
     on adr_intraday 12-Aug to 20-Aug, every day stores 68-72 bars running 09:20 to 15:15, so a
     normal boundary already carries 15 min of tail plus 5 min of head. That is 4.2 five-minute
     steps — past brk (2.5) — so a plain distance test can never join a normal night, which is why
     the boundary needs its own rule rather than a looser brk. 60 min separates that ordinary
     short close from a genuine outage by a wide margin: 17-Aug's feed stopped at 11:20, leaving a
     tail of 250 min, and that one still breaks. */
  var EDGE=12/78;
  var pxs=s.points.map(function(p){
    var clipped=(p.v>top||p.v<bot);
    /* f is clamped just under 1: a 15:30 bar comes through as f=1.0, which lands on the exact
       leading edge of the NEXT session's slot. Harmless most days, wrong on the day after is
       empty — the closing bar would draw inside the tinted hole and look like data in a session
       that has none. A slot covers [s, s+1), so the last bar belongs at its end, not past it. */
    /* cc#1236 carries f through: the boundary rule asks how much of a SESSION is missing at each
       side of the night, which x cannot answer once it has been folded into slot coordinates. */
    var f=Math.min(p.f,0.995);
    /* cc#1307: p.s is the ORIGINAL (uncompressed) session index the backend sent; remap[p.s] is
       always defined because points only ever exist for sessions that have data. */
    var s2=remap[p.s];
    return {x:(s2+f)/n*W, y:y(p.v), s:s2, f:f, up:(p.v>=base), clipped:clipped, v:p.v};
  });
  var runs=[], cur=null;
  pxs.forEach(function(q,i){
    var prev=i?pxs[i-1]:null;
    /* cc#1128 SAID EVERY SESSION IS ITS OWN STROKE. That is now WRONG, by founder ruling
       (INTRADAY_CHART_SESSION_JOIN_RULE_V1, session_log 29510) — consecutive sessions abut, the
       line runs through the divider, and the divider alone says where the night was. The old
       reasoning is kept because the trap it names is real: the last bar of a session and the
       first of the next land at almost the same x, so a distance test cannot tell an overnight
       gap from a five-minute one. The answer is not to break on every boundary, it is to STOP
       ASKING x AT A BOUNDARY.
       SO THE TEST SPLITS IN TWO, one question per kind of gap.
       INSIDE a session the distance test is the whole authority and is unchanged: a hole between
       bars is real missing data and is never bridged (17-Aug NIFTY stops 11:20, resumes 14:00).
       ACROSS a boundary x is meaningless, so it is not consulted. Two things break the line
       instead: a SKIPPED session (s jumps by more than one — a dead day sits in between, already
       tinted, and a stroke across it would draw a market that did not trade), or a session EDGE
       so ragged that the join would span an outage rather than a night (EDGE above).
       WHAT THIS DOES NOT DO: it never interpolates. A joined boundary draws one segment between
       two bars that were both recorded. Nothing is invented at either end. */
    var gap = !prev ? false
            : (q.s===prev.s) ? (q.x-prev.x>brk)
            : (q.s-prev.s>1 || (1-prev.f)>EDGE || q.f>EDGE);
    if(!cur||gap){                       /* first point, or the data genuinely stopped */
      cur={up:q.up,pts:[[q.x,q.y]]}; runs.push(cur); return;
    }
    if(q.up!==cur.up){                   /* crossed the baseline: both runs share this point */
      cur.pts.push([q.x,q.y]);
      cur={up:q.up,pts:[[prev.x,prev.y],[q.x,q.y]]}; runs.push(cur); return;
    }
    cur.pts.push([q.x,q.y]);
  });
  var body=runs.filter(function(r){return r.pts.length>1;}).map(function(r){
    return '<polyline fill="none" stroke="'+(r.up?'var(--volt)':'var(--heat)')
      +'" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="'
      +r.pts.map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ')+'"/>';
  }).join('')
  /* a single stored bar with no neighbour to join has no line to be part of, so it is drawn as a
     dot rather than dropped — one reading is still a reading. */
  + runs.filter(function(r){return r.pts.length===1;}).map(function(r){
      return '<circle cx="'+r.pts[0][0].toFixed(2)+'" cy="'+r.pts[0][1].toFixed(2)+'" r=".7" fill="'
        +(r.up?'var(--volt)':'var(--heat)')+'"/>';
    }).join('')
  /* off-scale points are CLAMPED and MARKED, never quietly flattened into the line */
  + pxs.filter(function(q){return q.clipped;}).map(function(q){
      return '<circle cx="'+q.x.toFixed(2)+'" cy="'+q.y.toFixed(2)+'" r="1.1" fill="var(--amber)"/>';
    }).join('');
  var marks='';
  for(var i=1;i<n;i++){
    var xd=(i/n*W).toFixed(2);
    marks+='<line x1="'+xd+'" y1="0" x2="'+xd+'" y2="'+H+'" stroke="var(--edge)" stroke-width=".3"/>';
  }
  marks+='<line x1="0" y1="'+yb.toFixed(2)+'" x2="'+W+'" y2="'+yb.toFixed(2)
       +'" stroke="var(--muted)" stroke-width=".3" stroke-dasharray="1.5 1.5" opacity=".7"/>';
  /* cc#1307: the empty_sessions tinted rect is gone — liveSessions above already dropped those
     days from the x-axis, so there is no slot left for a hole rectangle to occupy. */
  var svg='<svg class="isvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    +marks+body+'</svg>';
  /* cc#1258 · SPARSE DATE/TIME TICKS, sharing the x-space the chart already uses.
     A date tick sits at the START of each session, which is the SAME x the cc#1236 day divider is
     drawn at (i/n*W), so the label and the line cannot drift apart — they are computed from the
     one session index, not measured against each other.
     THINNED, because clutter is the failure mode on a phone: at most four date ticks, taking every
     k-th session; and only when that leaves three or fewer does a TIME tick get added, inside the
     last session, so the axis shows both kinds without ever crowding. That keeps the total in the
     3-5 the card asks for whether the window holds three sessions or ten.
     THE DATE IS PARSED BY SPLITTING THE STRING, NOT BY new Date(). '2026-08-21' goes through
     Date.parse as UTC midnight, and formatting that back in a browser west of Greenwich returns
     the 20th — a silent off-by-one-day on a chart axis, which is worse than no axis. Splitting the
     ISO string cannot move the date, whatever timezone the reader is in. */
  var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function dlab(iso){
    var p=String(iso||'').split('-');
    if(p.length<3)return '';
    return String(Number(p[2]))+' '+(MON[Number(p[1])-1]||'');
  }
  /* cc#1307: date ticks are placed against liveSessions, the same compressed axis the line and
     the day-divider marks now use — s.sessions (the full calendar, holes included) would put a
     tick at an x no longer occupied by anything. */
  var sess=liveSessions, ticks=[];
  var stepS=Math.ceil(sess.length/4)||1;
  for(var si=0; si<sess.length; si+=stepS){
    ticks.push({x:si/n*W, t:dlab(sess[si]), day:true});
  }
  if(ticks.length<=3 && sess.length){
    /* 12:00 placed at its TRUE fraction of the session, the same (mins-open)/375 the points use,
       so the label lands where a 12:00 bar actually is rather than at a convenient midpoint. */
    /* 555 = 09:15 and 375 = the session length in minutes, mirroring digest_v3's
       _SESSION_OPEN_MIN and _SESSION_MIN — the same two numbers that produced every point's f, so
       the tick is placed on the identical scale rather than an approximation of it. */
    var f12=(720-555)/375;
    ticks.push({x:(sess.length-1+f12)/n*W, t:'12:00', day:false});
  }
  ticks.sort(function(a,b){return a.x-b.x;});
  var ax='<div class="ixax">'+ticks.filter(function(t){return t.t;}).map(function(t){
    var cls='ixt'+(t.day?' d':'')+(t.x<8?' lo':(t.x>92?' hi':''));
    var pos=(t.x<8||t.x>92)?'':'left:'+t.x.toFixed(2)+'%';
    return '<span class="'+cls+'"'+(pos?' style="'+pos+'"':'')+'>'+t.t+'</span>';
  }).join('')+'</div>';
  hosts.forEach(function(h){h.innerHTML=svg+ax;});
}
/* Fetched separately from the digest payload and only after the page has painted — four series of
   200 points is not something the first render should wait on. A failure costs the charts and
   nothing else: the numbers above them are already on screen from /api/digest/v3. */
function loadInternals(){
  fetch('/api/digest/internals/series')
    .then(function(r){return r.json();})
    .then(function(d){(d.series||[]).forEach(iChart);})
    .catch(function(){});
}

/* cc#1136 · fitLadders — transplanted from design ref ladder_scrollmode_R1, which merges the
   cc#1111 fade binding into the measurement (an allowed seam; the fade behaviour is identical).
   THE MEASUREMENT IS THE WHOLE POINT. Every previous round PREDICTED whether the numbers would
   fit, from font metrics I could not see. This asks the browser what it actually rendered:
   b.scrollWidth > b.clientWidth means this value is wider than its cell, right now, on this
   device, after whatever font scale the user set. No device font scaling can defeat it, because
   it is not a prediction — it is the browser reporting itself.
   Equal tracks are tried FIRST and scrollmode is entered only when a value genuinely does not
   fit, so a normal phone still gets five clean columns and nothing to swipe. */
function fitLadders(){
  /* cc#1187: NO-OP by design, kept so the cc#1161 font hooks and boot() call sites stay valid.
     Vertical rows have nothing to measure — a row cannot overflow sideways — and deleting the
     hooks would be a wider diff for zero behaviour. If the ladder ever goes horizontal again
     (it should not), the hooks are already wired. */
}
/* Re-measure when the box changes under the content. One debounced listener for both events —
   an orientation change is a resize the layout has to survive, and a rotation into portrait is
   exactly where five columns stop fitting. */
var LAD_RAF=null;
function fitLaddersSoon(){
  if(LAD_RAF) return;
  LAD_RAF=requestAnimationFrame(function(){ LAD_RAF=null; fitLadders(); });
}
addEventListener('resize', fitLaddersSoon);
addEventListener('orientationchange', fitLaddersSoon);
/* cc#1161 · A FONT LOAD IS A RESIZE THAT FIRES NO RESIZE EVENT, and that is the whole bug.
   fitLadders() measured once at boot paint. JetBrains Mono arrives async from Google Fonts, so on
   a real phone the measurement ran against the FALLBACK face — narrower — decided the values fit,
   left equal-track mode on, and then the real font painted wider and .rung's overflow:hidden (the
   cc#1127 anti-overlap guarantee, which stays) clipped the digits with no ellipsis. Nothing
   re-measured, because a font swap is not a resize and not an orientation change. That is exactly
   what the founder photographed at 16:07 on 20-Aug.
   NOTHING ABOUT THE MEASUREMENT CHANGES HERE. Same function, same scrollWidth-vs-clientWidth
   question, same CSS, same tracks, same fade. This card adds WHEN it measures and never HOW.
   THREE HOOKS, because they fail in different ways and none of them is reliable alone.
   fonts.ready settles once after the initial font set resolves. loadingdone also fires for a face
   that arrives LATER — a second weight, a slow retry — which fonts.ready has already stopped
   caring about. window load is the belt for a browser with no Font Loading API at all, where the
   other two simply never run.
   THEY CANNOT STACK. Every one of them goes through fitLaddersSoon, which is already rAF-debounced
   and returns early while a frame is pending, so three hooks firing in the same frame do one
   measurement between them. The existing resize and orientationchange listeners are untouched. */
if (document.fonts) {
  if (document.fonts.ready && document.fonts.ready.then) document.fonts.ready.then(fitLaddersSoon);
  if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitLaddersSoon);
}
addEventListener('load', fitLaddersSoon);

async function boot(){
  let d=null;
  try{ d=await (await fetch('/api/digest/v3')).json(); }catch(e){}
  /* cc#1114: the ENGINE YESTERDAY · V10 section is GONE by founder decision — on a day with no
     exits it was a one-line empty state and a link to a page the closing paragraph already links
     to. The /api/v10/trades/paired fetch went with it rather than being left running for a
     section that no longer renders; nothing else on this page read its result. The cc#1109 fix
     that put this filter on the server's prev_trading_date is not lost — the basis still ships in
     the payload and /m/v8 is where the book lives. */
  if(!d||d.error||!d.sections){
    document.getElementById('app').innerHTML=`<div class="card slab"><div class="unavail">Digest payload unavailable${d&&d.error?': '+esc(d.error):''}. /api/digest/v3 did not answer — nothing is invented in its place.</div></div>`;
    return;
  }
  const S=d.sections, mr=d.market_read||{};
  document.getElementById('dd-date').textContent=(d.date_ist||'')+' · the morning read';
  /* cc#1109: the chip follows market.state instead of sitting on a static amber. OPEN reads as
     live, CLOSED reads as quiet, PRE-OPEN and CAS keep the amber that means "not yet / not any
     more". The label text is unchanged. */
  const st=document.getElementById('dd-state'); st.textContent=(d.market&&d.market.label)||'—';
  const mst=(d.market&&d.market.state)||'';
  st.className='chip '+(mst==='OPEN'?'w':(mst==='CLOSED'?'mu':(mst?'n':'n')));
  window.__MK={state:mst,label:(d.market&&d.market.label)||''};   /* cc#1186: the ladder state
     clause reads this — set before the render below, same payload, same composer as the chip */

  const tiles=(S.global_tape&&S.global_tape.tiles)||[];
  window.__TILES=tiles;   /* APP_QA_R5 P5: kept so the switch re-renders without a refetch */
  const eodNote=S.global_tape&&S.global_tape.eod_note;
  const lad=(S.ladders&&S.ladders.indexes)||[];
  const itl=S.internals||{}, adr=itl.adr||null, pcr=itl.pcr||[];
  const rep=S.reporting_today||{};
  /* cc#1190: the results card now reads results_analysed. RA is a module-level global on purpose
     — the tier chips re-render the deck on tap, outside this render pass, and they need the list.
     yesterday_results is still ON the payload and still read by the WEB digest; this page simply
     stopped being its consumer. */
  RA = S.results_analysed || {};
  const ra = RA, raT = ra.tally || {};
  const raLatest = (ra.companies && ra.companies[0] && ra.companies[0].polished_ist) || '';

  const bias=(mr.bias||'—').toUpperCase();
  const railC=/BULL/.test(bias)?'var(--volt)':/CAUT/.test(bias)?'var(--amber)':'var(--muted)';

  /* cc#1190: the yrRows builder is DELETED with the card it fed. Its cc#1096 D3 BSE-code
     resolution is not lost — result_analysis_v2 is keyed on NSE symbols, so there is no numeric
     code to resolve on this deck. */

  document.getElementById('app').innerHTML=`
  <div class="card slab rail" style="--rc:${railC};margin-top:12px">
    <div style="font-size:10px;letter-spacing:2px;color:var(--chalk);margin-bottom:6px">MARKET READ</div>
    <span class="skew" style="font-size:36px;line-height:.95">${esc(mr.bias||'—')}</span>
    <div style="height:6px;width:150px;background:linear-gradient(90deg,var(--chalk),transparent);transform:skewX(-24deg);margin:6px 0 10px;opacity:.85"></div>
    <div class="num" style="font-size:12px;color:var(--chalk)">${(mr.support||[]).map(esc).join(' · ')||'—'}</div>
  </div>

  <div class="eyebrow">GLOBAL TAPE${S.global_tape&&S.global_tape.tier?' · '+esc(S.global_tape.tier):''}</div>
  <div class="card slab">
    <div class="ghd"><span style="font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--chalk)">CHANGE</span>
      <div class="gsw" id="gsw"><button type="button" data-v="day" class="on" onclick="setTapeMode('day')">DAY</button><button type="button" data-v="week" onclick="setTapeMode('week')">WEEK</button></div></div>
    ${tiles.length?`<div id="gtiles" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">${tiles.map(tile).join('')}</div>`:'<div class="unavail">No live global tiles available.</div>'}
    ${eodNote?`<div style="font-size:9.5px;color:var(--amber);font-family:'JetBrains Mono';margin-top:8px">${esc(eodNote)}</div>`:''}
    <div style="font-size:9.5px;color:var(--chalk);font-family:'JetBrains Mono';margin-top:6px">${esc((S.global_tape&&S.global_tape.read)||'')} · WEEK = close vs close 5 sessions back, from the payload · no history shows an em-dash, never 0</div>
  </div>

  <div class="eyebrow">TODAY'S MAP · PIVOT LADDERS</div>
  <div class="card slab">${lad.length?lad.map(ladder).join(''):'<div class="unavail">No ladder data.</div>'}
    <div style="font-size:9.5px;color:var(--chalk);font-family:'JetBrains Mono';margin-top:10px">the day's reference levels — the live position lives on <a class="plink" href="/m/v10">INDEX INTEL →</a></div>
  </div>

  <div class="eyebrow">INTERNALS</div>
  <div class="card slab">
    ${(()=>{const cards=[
      intCard('adr', 'ADR', adr&&adr.adr!=null?Number(adr.adr).toFixed(2):'—',
                adr&&adr.adr!=null?(adr.adr>=1?'var(--volt)':'var(--heat)'):'var(--muted)',
                null, itl.adr_stale)
      /* cc#1250 · BREADTH A-D pane removed from this deck by founder order (23-Aug 18:32). It is
         a DISPLAY removal and nothing else: adr.advances / adr.declines still arrive in the same
         payload, the breadth series is still computed, still stored, and still served by
         /api/digest/internals/series, and the web digest's Advance/Decline tile is untouched.
         The pager needs no edit — DECKS.itrack is cards.length, so it counts what is actually
         here and drops from four to three on its own. */
      ].concat(pcr.slice(0,2).map(p=>intCard('pcr_'+String(p.underlying||'').toLowerCase(),
                'PCR '+esc(p.underlying), p.pcr!=null?Number(p.pcr).toFixed(2):'—',
                p.pcr!=null?(p.pcr>1?'var(--volt)':'var(--amber)'):'var(--muted)',
                null, itl.pcr_stale)));
      DECKS.itrack=cards.length;
      const set=cards.join('');
      /* three sets — see the continuous-swipe note on iWrap. The footer read line that sat under
         the dots is REMOVED (founder ruling 22-Aug), and the .wk sub-lines went with it, so the
         deck is the whole card now. */
      return `<div class="iswipe"><div class="iswipe-t" id="itrack" onscroll="iWrap()">${set}${set}${set}</div><div class="idots" id="idots">${
        Array.from({length:DECKS.itrack},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('')
      }</div></div>`;})()}
  </div>

  <div class="eyebrow">REPORTING TODAY</div>
  <div class="card slab">
    <div class="grp"><h3>${rep.count!=null?rep.count+' companies':'—'}</h3><span class="note">TOP BY MARKET CAP</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:7px">
      ${/* cc#1096 D3: label, never the raw ticker. The payload resolves a BSE-only reporter to its
             company name server-side (digest_v3._label) and marks it is_symbol:false, so a bare
             scrip code can no longer reach a chip. Falls back to the ticker only if an older
             payload has no label at all. */''}
      ${(rep.companies||[]).slice(0,6).map(c=>`<span class="chip"${c.is_symbol===false?' title="BSE-listed, no NSE symbol"':''}>${esc(c.label||c.ticker)}</span>`).join('')||'<span class="unavail">No scheduled reporters today.</span>'}
      ${rep.count>6?`<span class="chip" style="color:var(--chalk)">+${rep.count-6} more</span>`:''}</div>
  </div>

  <div class="eyebrow">LATEST RESULT ANALYSIS</div>
  <div class="card slab">
    <div class="grp"><h3>${raList().shown.length} of ${ra.total!=null?ra.total:'—'} analysed</h3>
      <span class="note">${raTally(raT)}${raLatest?` · latest ${esc(raLatest)}`:''}</span></div>
    <div id="rawrap">${raChips()}${raDeck()}</div>
  </div>

  <div class="eyebrow">LIVE NEWS</div>
  <div class="card slab">
    <div class="grp"><h3>Live News</h3><a class="plink" id="rnCount" href="/m/intel" style="font-size:var(--type-95)">loading…</a></div>
    <div id="nwTabs"></div>
    <div class="newslist" id="rnBox"><div class="unavail">Loading headlines…</div></div>
  </div>

  <!-- cc#1234: this card's own .rail is REMOVED — it was the second green line. The Market Read
       card above keeps the single, thicker sentiment bar. Nothing else changes here: the verdict
       text, the bias word and its colour are untouched, and the bar took no layout space, so the
       content sits exactly where it did. -->
  <div class="card slab">
    <div style="font-size:10px;letter-spacing:2px;color:var(--chalk);margin-bottom:6px">THE CLOSE OF THE READ</div>
    <div style="font-size:13px;line-height:1.55">Bias <b style="color:${railC}">${esc(mr.bias||'—')}</b> — ${(mr.support||[]).map(esc).join(' · ')||'no supporting numbers available'}. Levels above are the day's map; the live desk owns the positions. <a class="plink" href="/m/v10">INDEX INTEL →</a></div>
  </div>`;
  fitLadders();    /* cc#1136: measure-then-fit; the ladders only exist after this paint */
  /* cc#1188: start each deck on the MIDDLE set, instantly, before its first paint — the user
     never sees the parking move. cc#1190: two decks now, one call each. deckPark also refreshes
     the dots, which is what the separate iDots() here used to do (cc#1121: the deck's nodes are
     replaced on every render, so the dot handlers must be rebound). */
  deckPark('itrack');
  raWinInit();      /* cc#1330: rtrack no longer uses deckPark — see the RA_WIN* block */
  loadInternals();
  /* cc#1325: LIVE NEWS paints its placeholder in the template above; loadRawNews() fills it in
     after, same sequencing this component already used on Index Intel (cc#1322). */
  loadRawNews();
}
boot();
</script>
