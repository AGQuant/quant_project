<style>
/* DAILY DIGEST — implements design_refs/scorr_digest_mobile_R1.html (b8949f6), R5.1 tokens */
:root{--field:#0D1322;--panel:#161F33;--hi:#1C2740;--edge:#26334F;--chalk:#EAF0FA;--muted:#8A97B0;
--volt:#C8F542;--heat:#FF4D6D;--aqua:#35E0FF;--pulse:#7C5CFF;--amber:#FF9F45;--cut:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B14;font-family:'Space Grotesk',sans-serif;color:var(--chalk)}
.phone{max-width:480px;margin:0 auto;background:var(--field);min-height:100vh;padding-bottom:70px;
 background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px)}
.num{font-family:'JetBrains Mono',monospace}
.skew{font-family:'Archivo Black';transform:skewX(-6deg);display:inline-block;transform-origin:left center;text-transform:uppercase}
.eyebrow{display:flex;align-items:center;gap:10px;margin:20px 18px 10px;font-size:11px;font-weight:700;
 letter-spacing:2.5px;color:var(--aqua);text-shadow:0 0 12px rgba(53,224,255,.4)}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
/* cc#1090 P4 then P6 · ALL TWELVE .card BLOCKS NOW TAKE .slab, and it took both pushes to get
   there honestly. P4 adopted ten and left GLOBAL TAPE and INTERNALS flat, because "tape blocks
   stay flat" and because raising a block whose whole content is already raised tiles is the mud
   the nesting rule warns about. P6 is the push that owns exactly that pair — raised tiles .slab,
   inner readouts .well — so the two blocks raise HERE and their .tile children sink to .well at
   the same time. Neither half works alone: a slab full of raised tiles is the violation, and a
   well inside a flat card is a hole in nothing.
   This rule is left standing rather than deleted: the ruling-1 override at (0,3,0) takes the cut
   off what adopted and leaves it on anything that has not. */
.card{background:var(--panel);border:1px solid var(--edge);margin:0 14px 12px;padding:16px;position:relative;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.rail::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:4px;background:var(--rc,var(--amber))}
.chip{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1px;border:1px solid var(--edge);
 background:var(--hi);padding:4px 9px;display:inline-block;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
.w{border-color:#3E5A18;background:#18240E;color:var(--volt)}
.l{border-color:#5A2634;background:#241019;color:#FF8FA5}
.n{border-color:#5A4218;background:#241D0E;color:var(--amber)}
/* cc#1109: CLOSED is not a warning. The state chip was permanently amber, which read as
   "something needs attention" on every evening and all weekend. */
.mu{border-color:var(--edge);background:var(--hi);color:var(--muted)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
 flex-wrap:wrap;gap:2px 10px}
.grp h3{font-family:'Archivo Black';font-size:15px;transform:skewX(-6deg);color:var(--chalk)}
.grp .note{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:1px;text-align:right}
/* cc#1111 item 1: the CMP note is one SENTENCE — "CMP 24,078 · LIVE · below PP 0.76%". As a bare
   flex item with no width control it wrapped wherever it ran out of room, and on a 390px screen
   that landed mid-phrase: "below PP" on one line and a naked "0.76%" on the next, disconnected
   from the words that give it meaning. Two rules fix it and neither changes a value. The note is
   allowed to take the WHOLE next line under the symbol (flex-wrap on .grp above, plus flex-basis
   here once it cannot sit alongside), and each clause inside it is unbreakable, so a wrap can
   only ever fall on a separator. */
.grp .note{white-space:normal}
.grp .note .cl{white-space:nowrap}
@media (max-width:430px){
  .grp{align-items:flex-start}
  .grp .note{flex:1 0 100%;text-align:left}
}
.tile{background:var(--hi);border:1px solid var(--edge);padding:8px 9px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
/* APP_QA_R5 P5 · ref design_refs/scorr_digest_mobile_R2.html @ c77cae9.
   9.5px is the FLOOR — the tile label and the wk line were at 9px, which is the drift R2 names. */
.tile .lb{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .vv{font-family:'JetBrains Mono';font-weight:800;font-size:14px;margin-top:3px}
.tile .wk{font-family:'JetBrains Mono';font-weight:700;font-size:12px;color:var(--muted);margin-top:1px}
/* the DAY|WEEK switch — ref .gsw/.ghd, 52x30 chips, in-memory state, default DAY */
.ghd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gsw{display:flex;gap:3px;background:var(--hi);border:1px solid var(--edge);padding:2px;
 clip-path:polygon(4px 0,100% 0,100% 100%,0 100%,0 4px)}
.gsw button{min-width:52px;min-height:30px;border:0;background:transparent;cursor:pointer;
 font-family:'JetBrains Mono';font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted)}
.gsw button.on{background:var(--panel);color:var(--aqua);text-shadow:0 0 8px rgba(53,224,255,.4)}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--edge);font-size:12.5px}
.mrow:first-of-type{border-top:none}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.plink{color:var(--pulse);font-weight:700;font-size:12.5px;text-decoration:none}
.foot{font-family:'JetBrains Mono';font-size:9.5px;color:var(--muted);letter-spacing:.6px;margin:6px 18px 20px}
/* cc#1096 R7-D2 · THE PIVOT ROW COULD NOT HOLD ITS COLUMNS. Founder frame 1:44: BANKNIFTY read
   56,69757,09457,55557,952 as one string, with the last value clipped mid-digit at the card edge.

   WHAT WAS ACTUALLY WRONG, and it is three things stacked, not one:
     gap:0        there was NO column separation at all. Five numbers sat shoulder to shoulder and
                  the only thing keeping them apart was slack inside each cell — luck, not layout.
     flex:1 with the default min-width:auto means a cell can never shrink below its own text, so
                  the moment a value is wider than its share the row grows past the card instead
                  of the columns giving way.
     nothing capped the overflow, so the spill landed under .card's clip-path and lost digits.
   At default text scale on a 360px viewport the values measure 28px in a 60px cell and it looks
   fine, which is why this survived review. It is one text-width step from breaking, and Chrome
   for Android's text scaling is exactly that step.

   THE FIX IS THE GRID, so the columns are declared instead of emergent: five equal tracks, a real
   6px gutter, min-width:0 so tracks share fairly, and overflow-x:auto so that if the content
   genuinely cannot fit, the row SCROLLS rather than hiding a digit. Nothing here touches a pivot
   value or the maths behind it — the numbers are rendered exactly as before. */
/* cc#1111 item 2: the wrap exists ONLY to carry the edge fade. .ladder is the scroller and an
   ::after on it would scroll away with the content instead of sitting at the clipped edge. */
/* cc#1124: the fade DID ship in cc#1111 (b254a91) — it was there and it did nothing, for two
   reasons that had to be fixed together.
   ONE, it faded to the wrong colour. The gradient ended at var(--bg), the PAGE background, but the
   ladder sits inside a .card whose surface is var(--panel). Fading a panel toward the page colour
   is a smear, not an edge — over the card it was very close to invisible, which is exactly what
   the founder reported: clipped flush, no cue. It now ends at var(--panel), the surface it is
   actually drawn on.
   TWO, and this is the real fix, the ladder should not need to scroll at all. The tracks were
   minmax(max-content,1fr): the MINIMUM of every track was its own content width, so five columns
   each demanded their full number and the grid overflowed by construction on any phone — the
   min-width:0 on .rung could never help, because the floor was on the TRACK, not the item.
   minmax(0,1fr) makes five EQUAL tracks that share whatever the card gives them (founder-approved
   revision: cells fill the width evenly rather than each holding out for a fixed minimum). On a
   360px phone that is ~61px a column against ~54px of "24,712.55" at 10px mono, so all five fit
   and there is nothing to scroll. The scroller and the fade both stay as the FALLBACK for a
   narrower screen or a longer number. No pivot value, no dist_pct maths and no column order is
   touched here — this is width and colour only. */
.ladwrap{position:relative}
.ladwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
 opacity:0;transition:opacity .15s;
 background:linear-gradient(to right,rgba(0,0,0,0),var(--panel))}
.ladwrap.hasmore::after{opacity:1}
/* cc#1127 — THIRD ATTEMPT, AND THE FIRST ONE WITH A STRUCTURAL GUARANTEE. cc#1111 and cc#1124
   (mine) both made the numbers USUALLY fit. Neither made overlap IMPOSSIBLE, which is why it came
   back as glyph soup on his phone while every measurement here said fine.
   WHAT ACTUALLY HAPPENED. The grid was never wrong: five equal tracks, no container overflow,
   measured clean at 320/360/390/412px. The value text was held off its neighbours only by being
   narrower than its track, and four things conspire the moment it is not — .rung b is nowrap so
   it cannot wrap, .rung had no overflow containment so it painted outside its track,
   text-align:center threw that overflow BOTH ways so one value hit both neighbours at once, and
   the text width depends on the FONT and the DEVICE TEXT SCALE, neither of which this page
   controlled. Reproduced with a real monospace face at 2x text scaling: the value overflows a
   54.8px cell by 17.5px and all four adjacent pairs overlap.
   THE GUARANTEE IS overflow:hidden ON THE CELL. A cell's text can no longer paint outside its own
   grid track under ANY font, any text scale, any language — the geometry forbids it, rather than
   the arithmetic happening to work out. That is the structural property the previous two fixes
   lacked, and it is why this one cannot regress the same way.
   THE OTHER TWO RULES STOP IT EVER NEEDING TO CLIP. text-size-adjust:100% neutralises mobile text
   inflation, which is the input that broke the arithmetic. And the value size is now tied to the
   viewport instead of pinned at 10px, so it shrinks with the cell: at 320px it is 8.3px against a
   46.8px cell (a 6-char value needs ~30px, 36% headroom), at 412px 10.7px against 65.2px.
   ellipsis is the last-resort cue if a value somehow still cannot fit — a clipped number that
   says it is clipped, never one silently painted over its neighbour. */
/* cc#1136 · ROUND 4 — the ellipsis clause above is WITHDRAWN, and both reasons are mine to own.
   ONE: that "last resort" fired on every value on his phone. Device font scaling in the founder's
   PWA browser defeats text-size-adjust, so the clamp could not shrink far enough, every .rung b
   overflowed, and the whole ladder rendered as 23,… — a number that has lost its digits is worse
   than one that needs a swipe. TWO: the scroll fallback I described in the cc#1127 result as the
   live safety net was DEAD CODE. minmax(0,1fr) tracks cannot exceed their container, so
   overflow-x:auto had nothing to scroll and .hasmore could never fire. I stated it as a working
   fallback and it was not one.
   THE RULING: numbers are NEVER ellipsized. Either five full columns fit, or the row becomes a
   real scroller with the edge fade. Transplanted verbatim from the approved design ref
   ladder_scrollmode_R1 per APPROVED_REF_EXACT_SPEC_RULE_V1 — three CSS changes and nothing else.
   WHY THE MEASUREMENT CANNOT BE FOOLED: scrollWidth vs clientWidth is the BROWSER reporting its
   own rendering after whatever font scale the device applied. It is not a prediction from font
   metrics, which is what every previous round got wrong. overflow:hidden on .rung stays, so the
   cc#1127 anti-overlap guarantee is untouched — the two rules cover different failures. */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:start;
 margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ladder::-webkit-scrollbar{display:none}
/* measured scroll mode: tracks widen to the full number, the row scrolls, the fade engages */
.ladder.scrollmode{grid-template-columns:repeat(5,minmax(max-content,1fr))}
.rung{min-width:0;overflow:hidden;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;
 font-size:clamp(8px,2.6vw,11px);padding:5px 0;border-top:2px solid var(--edge);color:var(--muted);
 -webkit-text-size-adjust:100%;text-size-adjust:100%}
/* no overflow:hidden and no text-overflow on the b — a digit is never traded for an ellipsis */
.rung b{display:block;white-space:nowrap;margin-top:2px;
 font-variant-numeric:tabular-nums}
/* cc#1126 · the digest header's second row. PAGE-SCOPED under .dg-hdr: scorr_appshell.css is
   shared with /m/v10 and the other shell pages, and this is a digest layout decision, not a shell
   one. WHY IT CANNOT OVERLAP: the subtitle and the chip are flex SIBLINGS in a row. Flex items do
   not overlap — the chip is flex:none so it keeps its full label, the subtitle takes what is left
   with min-width:0 and ellipsises instead of wrapping, and if the chip ever grows wider than the
   whole row the wrap sends it to its own line rather than on top of anything. Three outcomes, all
   legible, none overlapping. Chip logic and countdown text are untouched — this is layout only. */
.dg-hdr{flex-wrap:wrap;row-gap:5px}
.dg-hdr .as-pg{flex:1 1 auto;min-width:0}
.dg-sub{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
/* flex-basis 0, NOT auto. With basis:auto the subtitle's base size is its full content width, so
   it and the chip together exceeded the row and the chip wrapped to a THIRD line — a 116px sticky
   header on a phone. Basis 0 makes the subtitle grow into whatever the chip leaves and ellipsise
   instead of forcing a wrap. The DATE survives every truncation because it is at the start of the
   string; "the morning read" is the decorative half and is the part that goes. */
.dg-sub .s{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-sub .as-slot{flex:none;margin-left:auto}
.unavail{font-size:11px;color:var(--muted);font-family:'JetBrains Mono'}
/* cc#1121 · the INTERNALS deck. Same mechanism as mobile/home.html's hero deck — a scroll-snap
   flex track and a dot row — so the swipe feels identical to the one already on Home rather than
   being a second implementation with its own quirks. align-items:flex-start for the reason spelled
   out on .swipe-t there: a shorter card should end at its own content, not stretch to the tallest. */
.iswipe{margin:2px 0 0}
.iswipe-t{display:flex;align-items:flex-start;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.iswipe-t::-webkit-scrollbar{display:none}
.ic{flex:0 0 100%;min-width:0;scroll-snap-align:center;background:var(--hi);border:1px solid var(--edge);
 padding:10px 11px 9px;clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.ichd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ichd .lb{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:1.4px;color:var(--muted)}
.ibars{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.8px;color:var(--dim,var(--muted));white-space:nowrap}
.ic .vv{font-family:'JetBrains Mono';font-size:24px;font-weight:700;line-height:1.15;margin-top:3px}
.ic .wk{font-family:'JetBrains Mono';font-size:9px;color:var(--muted);letter-spacing:.6px}
/* Fixed height so swiping between cards never resizes the deck under the finger. */
.ichart{height:34px;margin-top:9px}
.isvg{display:block;width:100%;height:34px;overflow:visible}
.idots{display:flex;justify-content:center;gap:5px;margin-top:8px}
.idots i{width:5px;height:5px;border-radius:50%;background:var(--edge);transition:.2s;cursor:pointer}
.idots i.on{background:var(--amber);width:15px;border-radius:3px}
</style>
</head>
<body data-theme="goldnight" class="as-shell">
<!-- APP_QA_R5 P6 (was R4 P4): goldnight FORCED this sprint; stored theme read and kept, not applied. Original note: stored theme applied as the first statement inside <body>, before paint. -->
<script>(function(){try{var t=localStorage.getItem('scorr_theme');
if(t){/* cc#1119: the sprint gate is lifted for the two DARK themes. Only goldnight and dark are
     applied; a stored goldday is KEPT and simply not used, so nothing is rewritten by omission and
     White-Golden ships the day its 44 missing light values are specified. */}}catch(e){}
document.body.setAttribute('data-theme',(t==='dark'||t==='goldnight')?t:'goldnight');})();</script>
<div class="phone">
<!-- APP_QA_R4 P4 · SHELL VARIANT A (tool page), ref design_refs/scorr_appshell_R1.html @ a20ae0d.
     #dd-date and #dd-state move into the shell's slot with their ids intact — the page still
     fills them, the shell only defines where they sit (ref rule 6). Nothing below this header
     changed and no loader was touched (rule 5). -->
<!-- cc#1126: TWO ROWS. As one row this was wordmark + title/subtitle + state chip all competing
     for 332px, and the chip is the widest thing in it ("PRE-OPEN · 2h 40m TO BELL"). .as-slot is
     flex:none so the chip took what it needed and .as-pg absorbed the loss — about 90px, which is
     why the subtitle wrapped one word per line and collided with the chip.
     Row 1 is identity: wordmark and page title. Row 2 is the state line: date/subtitle on the
     left, chip right-aligned. Markup only — .as-hdr, .as-wm, .as-pg and .as-slot keep their
     shared classes, so the appshell's wordmark menu and back control are untouched, and the two
     ids the page fills keep their names. -->
<div class="as-hdr dg-hdr">
  <a class="as-wm" href="/m/home" aria-label="Scorr home">SC<i>O</i>RR</a>
  <div class="as-pg"><span class="t">Daily Digest</span></div>
  <div class="dg-sub">
    <div class="s" id="dd-date">THE MORNING READ</div>
    <div class="as-slot"><span id="dd-state" class="chip n">—</span></div>
  </div>
</div>
<div id="app"><div class="card slab"><div class="unavail">Building the read…</div></div></div>
<div class="foot">DAILY DIGEST · every claim tied to a number shown above · research only</div>

<script>
/* ONE payload: /api/digest/v3 (digest_v3.py, binding spec 965 v2.3). cc#1114 removed the second
   read (/api/v10/trades/paired, for ENGINE YESTERDAY) along with the section it fed, so this page
   now makes exactly one request. APP_SECTION_DISTRIBUTION_V1 still holds: positions live on Index
   Intel, the digest tells what happened. */
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num=(v,d=0)=>(typeof v==='number'?v:Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:d});
const sgn=(n,d=2)=>(n>=0?'+':'')+Number(n).toFixed(d);
const cx=n=>n>=0?'var(--volt)':'var(--heat)';
const senti=s=>{const t=String(s||'').toLowerCase();
  return /bull|posi/.test(t)?'var(--volt)':/bear|nega/.test(t)?'var(--heat)':/caut/.test(t)?'var(--amber)':'var(--muted)';};

/* APP_QA_R5 P5 · in-memory only, per the ref: the choice lasts the visit and is deliberately
   NOT persisted — the digest is a morning read, and a stale WEEK selection from yesterday would
   silently change what the founder thinks he is looking at. Default DAY. */
var TAPE_MODE='day';
function tile(t){
  const d=t.day_chg_pct!=null?Number(t.day_chg_pct):null;
  /* week comes from the PAYLOAD (global_heatstrip computes close vs close 5 of the symbol's OWN
     sessions back and nulls under 6 sessions) — never recomputed here, never defaulted to 0. */
  const w=t.week_chg_pct!=null?Number(t.week_chg_pct):(t.wk_chg_pct!=null?Number(t.wk_chg_pct):null);
  const v=TAPE_MODE==='week'?w:d;
  /* cc#1109 INVERTED TILES. Colour used to be the sign of the number, which is wrong for any
     symbol whose direction is inverted — INDIA VIX falls when the market calms, and a falling
     VIX was painting red. The payload ALREADY carries day_band / week_band with the inversion
     applied (global_heatstrip sets inverted:true on INDIAVIX), so the band is read, never
     recomputed here — one composer, same rule as the week number above. Sign is the fallback
     only when a tile ships no band. */
  /* cc#1123: "mid" is the volatility middle tier — a VIX move smaller than 5% either way. It is
     amber, matching the --amber this page already uses (#FF9F45, the same value as the NIFTY name
     on the Home hero's index line), so neutral reads as neutral rather than as a muted non-answer.
     Everything else about this mapping is unchanged, and the thresholds themselves are NOT decided
     here — global_heatstrip._band() is the single composer, per cc#1123 task 4. */
  const band=TAPE_MODE==='week'?t.week_band:t.day_band;
  const col=v==null?'var(--muted)'
           :(band?(String(band)==='mid'?'var(--amber)'
                  :(String(band).indexOf('up')===0?'var(--volt)':(String(band).indexOf('down')===0?'var(--heat)':'var(--muted)')))
                 :cx(v));
  return `<div class="tile well"><div class="lb">${esc(t.name||t.symbol||'—')}</div>
    <div class="vv" style="color:${col}">${v!=null?sgn(v)+'%':'—'}</div></div>`;
}
/* re-renders the grid IN PLACE: same cells, same order, only the % swaps (ref). */
function setTapeMode(m){
  if(m===TAPE_MODE)return;
  TAPE_MODE=m;
  var g=document.getElementById('gtiles');
  if(g&&window.__TILES)g.innerHTML=window.__TILES.map(tile).join('');
  var bs=document.querySelectorAll('#gsw button');
  for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===m);
}
function ladder(ix){
  const rungs=ix.rungs||[];
  if(!rungs.length)return `<div class="unavail">${esc(ix.reason||'no pivot ladder')}</div>`;
  const cmp=ix.cmp!=null?Number(ix.cmp):null;
  const order=['S2','S1','PP','R1','R2'];
  const bp=rungs.find(r=>r.label==='PP');
  const side=(cmp!=null&&bp)?(cmp>bp.value?'above':'below'):null;
  /* cc#1111: .cl marks a clause that must not break. "below PP 0.76%" is one phrase — the number
     means nothing on a line of its own. */
  const sideTxt=side?`<span class="cl" style="color:${side==='above'?'var(--volt)':'var(--heat)'}">${side} PP ${bp.dist_pct!=null?Math.abs(bp.dist_pct).toFixed(2)+'%':''}</span>`:'';
  const cells=order.map(L=>{const r=rungs.find(x=>x.label===L);
    const col=L==='PP'?'var(--amber)':(L[0]==='S'?'#5A2634':'#3E5A18');
    return `<div class="rung" style="border-color:${col}${L==='PP'?';color:var(--amber)':''}">${L}<br><b style="color:var(--chalk)">${r?num(r.value):'—'}</b></div>`;}).join('');
  return `<div class="grp" style="margin-top:14px"><h3>${esc(ix.symbol)}</h3>
    <span class="note"><span class="cl">CMP <b class="num" style="color:var(--chalk)">${cmp!=null?num(cmp):'—'}</b></span> · <span class="cl">${esc(ix.tier||'')}</span> · ${sideTxt}</span></div>
    <div class="ladwrap"><div class="ladder">${cells}</div></div>`;
}

/* cc#1111 item 2: .ladder has overflow-x:auto, but a clipped column with no scrollbar and no fade
   gives a reader no reason to believe a fifth column exists — on the founder's screenshot R2 was
   simply cut flush at the screen edge. This is the same fade-when-scrollable rule the chip bar and
   the mobile nav already use: the cue appears only while there IS more to the right, and clears at
   the end, because a fade over nothing is a hint that lies. Bound per ladder, and re-bound after
   every boot render since the nodes are replaced. */
/* ── cc#1121 · INTERNALS becomes a four-card swipe deck with 5-min history ────────────────────
   Four cards, not three: BREADTH earns its own because advances and declines are stored in
   adr_intraday alongside adr, at the same 5-min cadence and the same depth — so there is a real
   series behind it, not a single number with a chart bolted on.
   The swipe is the deck pattern this app family already uses (mobile/home.html's hero deck):
   CSS scroll-snap on a flex track plus a dot row that follows the finger. No new gesture code and
   nothing to fight the page's own vertical scroll.
   TODAY'S NUMBER STAYS THE HEADLINE. The chart sits under it, and neither the value nor its
   colour rule changed — both still come from the daily payload exactly as the three tiles did. */
function intCard(key, label, val, col, sub, stale){
  return `<div class="ic"><div class="ichd"><span class="lb">${label}${stale?' · STALE':''}</span>
      <span class="ibars" id="ib-${key}">…</span></div>
    <div class="vv" style="color:${col}">${val}</div>
    <div class="wk">${sub||''}</div>
    <div class="ichart" id="ic-${key}"></div></div>`;
}
function iDots(){
  var tr=document.getElementById('itrack'), dots=document.getElementById('idots');
  if(!tr||!dots)return;
  var i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
  Array.prototype.forEach.call(dots.children,function(el,j){
    el.className=(j===i?'on':'');
    el.onclick=function(){tr.scrollTo({left:j*tr.clientWidth,behavior:'smooth'});};
  });
}
/* THE X AXIS IS TIME, NOT BAR INDEX, and that is load-bearing rather than pedantic. NIFTY PCR has
   ZERO rows for 18-Aug while BANKNIFTY has 71. Drawn by index, 17-Aug would sit flush against
   19-Aug and a missing session would read as a continuous market. The server sends every TRADING
   date in the span (weekdays minus nse_holidays) and each point's session slot plus its fraction
   through that session, so a session with no data keeps its slot and shows up as a gap — tinted,
   counted underneath, and named in the payload as empty_sessions.
   BASELINE. 1.00 for ADR and both PCRs, 0 for BREADTH A-D. These are not arbitrary: 1.00 is the
   line the tile's own colour rule already turns on (advances beating declines, put writers over
   call writers), so a bar above the baseline is green for the same reason the big number is. */
function iChart(s){
  var host=document.getElementById('ic-'+s.key);
  if(!host)return;
  var bl=document.getElementById('ib-'+s.key);
  if(bl)bl.textContent=s.bars?(s.bars+' BARS · 5-MIN'):'NO HISTORY';
  if(!s.bars){
    host.innerHTML='<div class="unavail">'+esc(s.note||'no intraday history stored')+'</div>';
    return;
  }
  var W=100, H=34, n=Math.max(1,(s.sessions||[]).length);
  var base=(s.key==='breadth')?0:1;
  var vs=s.points.map(function(p){return p.v;});
  /* ROBUST SCALE, AND THE CLIPPING IS SHOWN RATHER THAN HIDDEN. Measured on the live series before
     choosing this: NIFTY PCR's last 200 bars run 0.631 to 3.255, but the 95th percentile is 0.979
     and the median 0.928 — ONE bar carries that top. On a full-range axis the other 199 sit inside
     the bottom eighth of the card and the chart says nothing. The axis is therefore the 2nd-98th
     percentile, and any bar outside it is drawn to the edge with an amber cap and COUNTED in the
     line underneath, with the true extreme printed. A silent truncation would be the dishonest
     version of this; a chart that cannot be read is the useless one. */
  var iq=function(a,q){
    var b=a.slice().sort(function(x,y){return x-y;});
    var i=(b.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i);
    return lo===hi?b[lo]:b[lo]+(b[hi]-b[lo])*(i-lo);
  };
  /* CLIP ONLY THE SIDE THAT ACTUALLY NEEDS IT. A flat 2nd-98th window clips both ends whether or
     not there is anything extreme there, and the first version of this said "5 bars off-scale" on
     the NIFTY series when exactly ONE bar is an outlier — the other four were ordinary low bars
     sitting just under the 2nd percentile. Lumping them together makes the caption misleading in
     the direction that matters. A side is clipped only when its tail runs more than two
     inter-quantile spans past the window; otherwise the real extreme is kept. */
  var q02=iq(vs,0.02), q98=iq(vs,0.98), iqr=(q98-q02)||Math.abs(base)||1;
  var vmin=Math.min.apply(null,vs), vmax=Math.max.apply(null,vs);
  var top=Math.max((vmax-q98>2*iqr)?q98:vmax, base);
  var bot=Math.min((q02-vmin>2*iqr)?q02:vmin, base);
  var span=(top-bot)||1;
  var y=function(v){return H-(Math.max(bot,Math.min(top,v))-bot)/span*H;};
  /* cc#1137: over/omin/omax are gone with the caption they existed to write. `clipped` STAYS —
     it is what draws the amber clamped-point marker, and the in-chart honesty is not negotiable. */
  var yb=y(base);
  /* cc#1128 — A LINE, NOT BARS (founder ruling on the cc#1121 output: 200 dense bars read as a
     solid block, which is true — at ~0.5px a bar there is no shape left to see).
     THE LINE BREAKS RATHER THAN LYING. It is not one continuous stroke: a segment ends wherever
     the data actually stops. Two kinds of break, both real — the overnight boundary between
     sessions, and a hole inside a session (17-Aug's NIFTY feed stops at 11:20 and resumes at
     14:00). Detected from the x distance between consecutive points against the nominal 5-minute
     step, so a gap is never interpolated across. That is the same honesty rule as the empty
     session slots: nothing is drawn where nothing was recorded.
     COLOUR FOLLOWS THE READ, so the stroke turns at the baseline — green above 1.00, red below —
     matching the colour rule the headline number already uses. Runs of the same side are emitted
     as one polyline, and the crossing point belongs to both runs so the stroke stays joined. */
  var step=(W/n)/78, brk=step*2.5;      /* 78 five-min bars fill one session slot */
  var pxs=s.points.map(function(p){
    var clipped=(p.v>top||p.v<bot);
    /* f is clamped just under 1: a 15:30 bar comes through as f=1.0, which lands on the exact
       leading edge of the NEXT session's slot. Harmless most days, wrong on the day after is
       empty — the closing bar would draw inside the tinted hole and look like data in a session
       that has none. A slot covers [s, s+1), so the last bar belongs at its end, not past it. */
    return {x:(p.s+Math.min(p.f,0.995))/n*W, y:y(p.v), s:p.s, up:(p.v>=base), clipped:clipped, v:p.v};
  });
  var runs=[], cur=null;
  pxs.forEach(function(q,i){
    var prev=i?pxs[i-1]:null;
    /* EVERY SESSION IS ITS OWN STROKE. A distance test alone is not enough: the last bar of one
       session sits at f=1.0 and the first of the next at f=0.0, which land on the SAME x, so the
       overnight gap measured as zero and the line ran straight through 15:30 into the next
       09:15 — drawing a continuous market across a closed one. The session index is the
       authority; the distance test then catches holes INSIDE a session. */
    var gap=prev&&(q.s!==prev.s||q.x-prev.x>brk);
    if(!cur||gap){                       /* first point, or the data genuinely stopped */
      cur={up:q.up,pts:[[q.x,q.y]]}; runs.push(cur); return;
    }
    if(q.up!==cur.up){                   /* crossed the baseline: both runs share this point */
      cur.pts.push([q.x,q.y]);
      cur={up:q.up,pts:[[prev.x,prev.y],[q.x,q.y]]}; runs.push(cur); return;
    }
    cur.pts.push([q.x,q.y]);
  });
  var body=runs.filter(function(r){return r.pts.length>1;}).map(function(r){
    return '<polyline fill="none" stroke="'+(r.up?'var(--volt)':'var(--heat)')
      +'" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="'
      +r.pts.map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ')+'"/>';
  }).join('')
  /* a single stored bar with no neighbour to join has no line to be part of, so it is drawn as a
     dot rather than dropped — one reading is still a reading. */
  + runs.filter(function(r){return r.pts.length===1;}).map(function(r){
      return '<circle cx="'+r.pts[0][0].toFixed(2)+'" cy="'+r.pts[0][1].toFixed(2)+'" r=".7" fill="'
        +(r.up?'var(--volt)':'var(--heat)')+'"/>';
    }).join('')
  /* off-scale points are CLAMPED and MARKED, never quietly flattened into the line */
  + pxs.filter(function(q){return q.clipped;}).map(function(q){
      return '<circle cx="'+q.x.toFixed(2)+'" cy="'+q.y.toFixed(2)+'" r="1.1" fill="var(--amber)"/>';
    }).join('');
  var marks='';
  for(var i=1;i<n;i++){
    var xd=(i/n*W).toFixed(2);
    marks+='<line x1="'+xd+'" y1="0" x2="'+xd+'" y2="'+H+'" stroke="var(--edge)" stroke-width=".3"/>';
  }
  marks+='<line x1="0" y1="'+yb.toFixed(2)+'" x2="'+W+'" y2="'+yb.toFixed(2)
       +'" stroke="var(--muted)" stroke-width=".3" stroke-dasharray="1.5 1.5" opacity=".7"/>';
  var holes=(s.empty_sessions||[]).map(function(d){
    var i=(s.sessions||[]).indexOf(d);
    if(i<0)return '';
    return '<rect x="'+(i/n*W).toFixed(2)+'" y="0" width="'+(W/n).toFixed(2)+'" height="'+H
      +'" fill="var(--heat)" opacity=".09"/>';
  }).join('');
  host.innerHTML='<svg class="isvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    +holes+marks+body+'</svg>';
}
/* Fetched separately from the digest payload and only after the page has painted — four series of
   200 points is not something the first render should wait on. A failure costs the charts and
   nothing else: the numbers above them are already on screen from /api/digest/v3. */
function loadInternals(){
  fetch('/api/digest/internals/series')
    .then(function(r){return r.json();})
    .then(function(d){(d.series||[]).forEach(iChart);})
    .catch(function(){});
}

/* cc#1136 · fitLadders — transplanted from design ref ladder_scrollmode_R1, which merges the
   cc#1111 fade binding into the measurement (an allowed seam; the fade behaviour is identical).
   THE MEASUREMENT IS THE WHOLE POINT. Every previous round PREDICTED whether the numbers would
   fit, from font metrics I could not see. This asks the browser what it actually rendered:
   b.scrollWidth > b.clientWidth means this value is wider than its cell, right now, on this
   device, after whatever font scale the user set. No device font scaling can defeat it, because
   it is not a prediction — it is the browser reporting itself.
   Equal tracks are tried FIRST and scrollmode is entered only when a value genuinely does not
   fit, so a normal phone still gets five clean columns and nothing to swipe. */
function fitLadders(){
  document.querySelectorAll('.ladder').forEach(function(el){
    el.classList.remove('scrollmode');       /* always measure in equal-track mode */
    var over=false;
    el.querySelectorAll('.rung b').forEach(function(b){
      if(b.scrollWidth > b.clientWidth+1) over=true;
    });
    if(over) el.classList.add('scrollmode');
    var wrap=el.parentNode;
    var sync=function(){
      wrap.classList.toggle('hasmore', el.scrollWidth-el.clientWidth-el.scrollLeft > 2);
    };
    el.onscroll=sync;                        /* onscroll, not addEventListener: re-measuring must
                                                not stack a second handler on the same node */
    sync();
  });
}
/* Re-measure when the box changes under the content. One debounced listener for both events —
   an orientation change is a resize the layout has to survive, and a rotation into portrait is
   exactly where five columns stop fitting. */
var LAD_RAF=null;
function fitLaddersSoon(){
  if(LAD_RAF) return;
  LAD_RAF=requestAnimationFrame(function(){ LAD_RAF=null; fitLadders(); });
}
addEventListener('resize', fitLaddersSoon);
addEventListener('orientationchange', fitLaddersSoon);

async function boot(){
  let d=null;
  try{ d=await (await fetch('/api/digest/v3')).json(); }catch(e){}
  /* cc#1114: the ENGINE YESTERDAY · V10 section is GONE by founder decision — on a day with no
     exits it was a one-line empty state and a link to a page the closing paragraph already links
     to. The /api/v10/trades/paired fetch went with it rather than being left running for a
     section that no longer renders; nothing else on this page read its result. The cc#1109 fix
     that put this filter on the server's prev_trading_date is not lost — the basis still ships in
     the payload and /m/v8 is where the book lives. */
  if(!d||d.error||!d.sections){
    document.getElementById('app').innerHTML=`<div class="card slab"><div class="unavail">Digest payload unavailable${d&&d.error?': '+esc(d.error):''}. /api/digest/v3 did not answer — nothing is invented in its place.</div></div>`;
    return;
  }
  const S=d.sections, mr=d.market_read||{};
  document.getElementById('dd-date').textContent=(d.date_ist||'')+' · the morning read';
  /* cc#1109: the chip follows market.state instead of sitting on a static amber. OPEN reads as
     live, CLOSED reads as quiet, PRE-OPEN and CAS keep the amber that means "not yet / not any
     more". The label text is unchanged. */
  const st=document.getElementById('dd-state'); st.textContent=(d.market&&d.market.label)||'—';
  const mst=(d.market&&d.market.state)||'';
  st.className='chip '+(mst==='OPEN'?'w':(mst==='CLOSED'?'mu':(mst?'n':'n')));

  const tiles=(S.global_tape&&S.global_tape.tiles)||[];
  window.__TILES=tiles;   /* APP_QA_R5 P5: kept so the switch re-renders without a refetch */
  const eodNote=S.global_tape&&S.global_tape.eod_note;
  const lad=(S.ladders&&S.ladders.indexes)||[];
  const itl=S.internals||{}, adr=itl.adr||null, pcr=itl.pcr||[];
  const rep=S.reporting_today||{}, yr=S.yesterday_results||{};
  const wm=(S.what_moved&&S.what_moved.items)||[], ge=(S.global_events&&S.global_events.items)||[];
  const tally=yr.tally||{};

  const bias=(mr.bias||'—').toUpperCase();
  const railC=/BULL/.test(bias)?'var(--volt)':/CAUT/.test(bias)?'var(--amber)':'var(--muted)';

  const yrRows=(yr.companies||[]).slice(0,6).map(c=>{
    const cls=c.read==='BULLISH'?'w':c.read==='CAUTIOUS'?'l':c.read==='PENDING'?'n':'';
    /* cc#1096 D3: same resolution as the chips above — a numeric BSE code is shown as the
       company name, because there is no NSE symbol to resolve it to. */
    return `<div class="mrow"><b>${esc(c.label||c.ticker)}</b>
      <span style="flex:1;font-size:11.5px;color:var(--muted)">${esc(c.headline||c.pending_reason||'')}</span>
      <span class="chip ${cls}" style="font-size:9.5px;padding:1px 6px">${esc(c.read||'—')}</span></div>`;}).join('')
    ||'<div class="unavail">No reporters yesterday.</div>';

  /* cc#1129: WHAT MOVED and GLOBAL EVENTS now use the shared row (scorr_news_row.js), the same
     one /m/home's LIVE NEWS uses. The old row was a dot plus a wrapped headline in a plain box —
     no category, no time, no hierarchy. The category comes from the SECTION, not from a per-row
     field, because digest_v3._news queries one category at a time and the caller therefore knows
     it exactly; nothing is inferred. Time-ago is computed from polished_news.published_time, the
     POLISH time, which is what _news already selects — POLISH_LANDING_RULE, never published_at.
     No chevron and no onclick: these rows do not open anything on this page, and an affordance
     that leads nowhere is worse than none. Ordering is untouched — the payload arrives sorted on
     polish time and is rendered in the order it arrives. */
  const newsRows=(items,cat)=>window.ScorrNewsRow
    ? ScorrNewsRow.list(items,{limit:4,category:cat,chevron:false,
        empty:'<div class="unavail">No items.</div>'})
    /* the component is a blocking tag above, so this only runs if the asset itself failed to
       load — in which case the headlines still render rather than the section going blank. */
    : (items.slice(0,4).map(n=>`<div class="mrow"><span class="sdot" style="background:${senti(n.sentiment)}"></span>
       <span style="flex:1">${esc(n.headline)}</span></div>`).join('')||'<div class="unavail">No items.</div>');

  document.getElementById('app').innerHTML=`
  <div class="card slab rail" style="--rc:${railC};margin-top:12px">
    <div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">MARKET READ</div>
    <span class="skew" style="font-size:36px;line-height:.95">${esc(mr.bias||'—')}</span>
    <div style="height:6px;width:150px;background:linear-gradient(90deg,var(--chalk),transparent);transform:skewX(-24deg);margin:6px 0 10px;opacity:.85"></div>
    <div class="num" style="font-size:12px;color:var(--muted)">${(mr.support||[]).map(esc).join(' · ')||'—'}</div>
  </div>

  <div class="eyebrow">GLOBAL TAPE${S.global_tape&&S.global_tape.tier?' · '+esc(S.global_tape.tier):''}</div>
  <div class="card slab">
    <div class="ghd"><span style="font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--muted)">CHANGE</span>
      <div class="gsw" id="gsw"><button type="button" data-v="day" class="on" onclick="setTapeMode('day')">DAY</button><button type="button" data-v="week" onclick="setTapeMode('week')">WEEK</button></div></div>
    ${tiles.length?`<div id="gtiles" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px">${tiles.map(tile).join('')}</div>`:'<div class="unavail">No live global tiles available.</div>'}
    ${eodNote?`<div style="font-size:9.5px;color:var(--amber);font-family:'JetBrains Mono';margin-top:8px">${esc(eodNote)}</div>`:''}
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:6px">${esc((S.global_tape&&S.global_tape.read)||'')} · WEEK = close vs close 5 sessions back, from the payload · no history shows an em-dash, never 0</div>
  </div>

  <div class="eyebrow">TODAY'S MAP · PIVOT LADDERS</div>
  <div class="card slab">${lad.length?lad.map(ladder).join(''):'<div class="unavail">No ladder data.</div>'}
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:10px">the day's reference levels — the live position lives on <a class="plink" href="/m/v10">INDEX INTEL →</a></div>
  </div>

  <div class="eyebrow">INTERNALS</div>
  <div class="card slab">
    <div class="iswipe"><div class="iswipe-t" id="itrack" onscroll="iDots()">
      ${intCard('adr', 'ADR', adr&&adr.adr!=null?Number(adr.adr).toFixed(2):'—',
                adr&&adr.adr!=null?(adr.adr>=1?'var(--volt)':'var(--heat)'):'var(--muted)',
                adr?adr.advances+'A / '+adr.declines+'D':'', itl.adr_stale)}
      ${intCard('breadth', 'BREADTH A-D',
                adr&&adr.advances!=null&&adr.declines!=null?sgn(adr.advances-adr.declines,0):'—',
                adr&&adr.advances!=null&&adr.declines!=null?(adr.advances>=adr.declines?'var(--volt)':'var(--heat)'):'var(--muted)',
                adr?adr.advances+'A / '+adr.declines+'D':'', itl.adr_stale)}
      ${pcr.slice(0,2).map(p=>intCard('pcr_'+String(p.underlying||'').toLowerCase(),
                'PCR '+esc(p.underlying), p.pcr!=null?Number(p.pcr).toFixed(2):'—',
                p.pcr!=null?(p.pcr>1?'var(--volt)':'var(--amber)'):'var(--muted)',
                esc(p.date||''), itl.pcr_stale)).join('')}
    </div><div class="idots" id="idots">${
      /* one dot per card that actually rendered. Hardcoding four would leave a dead dot on a day
         pcr_daily carries only one underlying, and a dot that scrolls to nothing is a lie about
         how much there is to swipe. */
      Array.from({length:2+pcr.slice(0,2).length},(_,i)=>`<i class="${i?'':'on'}"></i>`).join('')
    }</div></div>
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:8px">${esc(itl.read||'')}</div>
  </div>

  <div class="eyebrow">REPORTING TODAY</div>
  <div class="card slab">
    <div class="grp"><h3>${rep.count!=null?rep.count+' companies':'—'}</h3><span class="note">TOP BY MARKET CAP</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:7px">
      ${/* cc#1096 D3: label, never the raw ticker. The payload resolves a BSE-only reporter to its
             company name server-side (digest_v3._label) and marks it is_symbol:false, so a bare
             scrip code can no longer reach a chip. Falls back to the ticker only if an older
             payload has no label at all. */''}
      ${(rep.companies||[]).slice(0,6).map(c=>`<span class="chip"${c.is_symbol===false?' title="BSE-listed, no NSE symbol"':''}>${esc(c.label||c.ticker)}</span>`).join('')||'<span class="unavail">No scheduled reporters today.</span>'}
      ${rep.count>6?`<span class="chip" style="color:var(--muted)">+${rep.count-6} more</span>`:''}</div>
  </div>

  <div class="eyebrow">YESTERDAY'S RESULTS · SCORED</div>
  <div class="card slab">
    <div class="grp"><h3>Top ${(yr.companies||[]).length} of ${yr.reported_total!=null?yr.reported_total:'—'}</h3>
      <span class="note"><b style="color:var(--volt)">${tally.bullish||0} bull</b> · <b style="color:var(--heat)">${tally.cautious||0} caut</b> · <b style="color:var(--muted)">${tally.neutral||0} neut · ${tally.pending||0} pending</b></span></div>
    ${yrRows}
    <div style="margin-top:8px;font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono'">${esc(yr.match_rule||'')}</div>
  </div>

  <div class="eyebrow">WHAT MOVED · DOMESTIC</div>
  <div class="card slab">${newsRows(wm,'Domestic')}</div>

  <div class="eyebrow">GLOBAL EVENTS</div>
  <div class="card slab">${newsRows(ge,'Global')}</div>

  <div class="card slab rail" style="--rc:${railC}">
    <div style="font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:6px">THE CLOSE OF THE READ</div>
    <div style="font-size:13px;line-height:1.55">Bias <b style="color:${railC}">${esc(mr.bias||'—')}</b> — ${(mr.support||[]).map(esc).join(' · ')||'no supporting numbers available'}. Levels above are the day's map; the live desk owns the positions. <a class="plink" href="/m/v10">INDEX INTEL →</a></div>
  </div>`;
  fitLadders();    /* cc#1136: measure-then-fit; the ladders only exist after this paint */
  iDots();         /* cc#1121: same reason — the deck's nodes are replaced on every render */
  loadInternals();
}
