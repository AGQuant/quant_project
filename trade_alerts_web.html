<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerts</title>
<style>
  /* cc#1536 — the WEB renderer of the Alerts feed. Layout grammar copied from
     trade_wall_web.html (tabs / .card / table / .twa form controls), not invented: the two pages
     sit adjacent on the nav and must read as one product. Tokens (--bg, --panel, --line, --mut …)
     come from main.py's injected token sheet, same as every desktop page.
     cc#1831: the .ov / .ov-box create-alert modal that used to live in this block moved to
     scorr_alert_create.js — this page no longer owns any modal markup or CSS.
     cc#2082 (session_log 40507 ALERTS_PURE_DISPLAY_V1, founder 14-Sep): this page is now PURE
     DISPLAY of APPROVED trades only — approval happens on Wall of Trades (session_log 36394
     WOT_APPROVAL_SURFACE_V1), not here. THIS IS THE SINGLE REFERENCE for that split going
     forward — see session_log 45648 WOT_ALERTS_CANON_V1 (cc#2084) if this is ever in question
     again. No Approve/Dismiss/override control exists on this page any more. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 64px}
  h1{font-size:19px;font-weight:800;margin:4px 0 2px;display:inline-block}
  .hd-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sub{font-size:12px;color:var(--mut);margin-bottom:14px;line-height:1.5}
  .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:6px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs:last-of-type{margin-bottom:10px}
  .tab{flex:0 0 auto;padding:8px 13px;border-radius:9px;border:1px solid var(--line);
       background:var(--panel);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;
       white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{border-color:var(--blu)}
  .tab.on{background:var(--blu);border-color:var(--blu);color:#fff}
  .tab .n{font-size:10.5px;font-weight:800;opacity:.72}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
  .meta{font-size:11px;color:var(--dim);padding:12px 16px 0;line-height:1.5}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 10px;
           font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
           border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
  tbody tr:hover{background:var(--card2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .sym{font-weight:800}
  .long{color:var(--grn);font-weight:700} .short{color:var(--red);font-weight:700}
  .empty{padding:26px 8px;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.6}
  .al-tag{font-family:ui-monospace,monospace;font-size:10px;color:var(--mut)}
  .al-st{font:700 10px ui-monospace,monospace;letter-spacing:.06em;border-radius:5px;
         padding:2px 7px;white-space:nowrap;border:1px solid var(--line2);color:var(--mut)}
  .al-st.approved{color:var(--grn);border-color:var(--grn)}
  .al-why{font-size:10.5px;color:var(--mut,#8A8A93)}
  .al-badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:5px;border:1px solid var(--line,#2A2A31)}
  .al-badge.ok{color:var(--grn,#2FD48B);border-color:var(--grn,#2FD48B)}
  .al-badge.no{color:var(--mut,#8A8A93)}
  .al-eng{font:600 10px ui-monospace,monospace;color:var(--mut);border:1px solid var(--line2);
          border-radius:5px;padding:2px 6px;white-space:nowrap}
  .al-notes{white-space:normal;max-width:260px;font-size:12px;color:var(--mut);line-height:1.45}
  /* cc#1693: TRIGGER's second muted line (the moved WHEN text) and the TC /100 cell -- .tc-buy/
     .tc-sell/.tc-opp mirror v8_dashboard.html tcCell()'s own colouring (buy=green, sell=red, an
     amber border when the winning card opposes the alert's own direction). */
  .al-tag2{display:block;font-family:ui-monospace,monospace;font-size:9.5px;color:var(--dim);margin-top:2px}
  .tc-num{font:800 13px ui-monospace,monospace}
  .tc-band{display:inline-block;margin-left:6px;font-size:8.5px;font-weight:800;letter-spacing:.4px;
           padding:1px 6px;border-radius:999px;border:1px solid transparent;cursor:help}
  .tc-buy{color:var(--grn);background:rgba(47,212,139,.12)}
  .tc-sell{color:var(--red);background:rgba(255,92,108,.12)}
  .tc-opp{border-color:var(--amber)}
  .th-asof{display:block;font-size:8.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:2px}
  .tw-btn{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
          color:var(--txt);font-size:12.5px;font-weight:700;cursor:pointer;min-height:38px}
  .tw-btn:hover{border-color:var(--blu)}
  .twa{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  @media(max-width:760px){
    .wrap{padding:12px 10px 64px}
    thead th,tbody td{padding:7px 6px;font-size:12px}
  }
</style>
</head>
<body>

<div id="scorr-nav"></div>
<div class="wrap">
  <div class="hd-row">
    <h1>Alerts</h1>
  </div>
  <div class="sub" id="subline">
    Pure display of approved trades — realised and unrealised, one book. Approving happens on
    <b>Wall of Trades</b>, not here (session_log 40507 ALERTS_PURE_DISPLAY_V1). This page computes
    nothing of its own — it renders <b>/api/alerts/list</b>, the same endpoint the app screen reads.
    <!-- cc#1831: "+ New alert" (manual/custom creation) moved to Wall of Trades (/trades) --
         ALERTS_PURE_DISPLAY_V1 (session_log 40507). -->
  </div>

  <div class="tabs" id="tabsInstrument"></div>
  <div class="tabs" id="tabsBook"></div>

  <div class="card">
    <div class="meta" id="meta">Loading…</div>
    <div class="scroll"><table id="tbl">
      <thead id="thead"></thead>
      <tbody id="body"></tbody>
    </table></div>
  </div>
</div>

<!-- cc#1831: the "+ New alert" modal that lived here moved to scorr_alert_create.js and now
     opens from Wall of Trades (/trades) -- see the comment above #subline. -->

<script src="/scorr_card_common.js"></script>
<script>
/* cc#1536 — desktop Alerts. ONE COMPUTATION, TWO RENDERERS (the trade_wall precedent): the app
   screen (/m/alerts) and this page both read /api/alerts/list. Nothing about an alert is derived
   here beyond the two client-side filters below.

   ORDER: NEWEST-first, the API's own contract.

   cc#2082 (founder 14-Sep, session_log 40507 part_1+3 + cc#2028's gap): this page is now PURE
   DISPLAY of approved trades ONLY -- Approve/Dismiss/override, the pending/triggered/dismissed
   concept, and QB rebalance_due notices are ALL GONE from this page. Two independent tab rows
   replace the old single status-tab row:
     Row 1 INSTRUMENT = Equity / Future / Options -- the SAME classification trade_wall_endpoints.
       py's own INSTRUMENT filter is built on (cc#992's ENGINE/INSTRUMENT MAP), reached here via
       resolve_close_state()'s origin.instrument (trade_alerts_endpoints.py, cc#1781) rather than a
       second hand-typed engine map -- that resolver already does the one case a bare source_engine
       string cannot (V10/Index Intel is FUTURES or OPTIONS per-row, from `leg`, and trade_alerts
       itself carries no leg column) via a real lookup, not a guess. A manual alert (source_engine
       NULL, no origin) is EQUITY -- verified, not assumed: scorr_alert_create.js's only symbol
       picker is /api/gvm/search, a stock search, so a manual alert can never be a futures/options
       trigger. Counts are over the WHOLE approved book regardless of the other row's current
       selection, matching trade_wall_endpoints.py's own stated convention ("Instrument/status
       counts are over the WHOLE wall").
     Row 2 BOOK = Open / Closed -- trade_alert_levels.closed_at via that SAME resolve_close_state
       call, the identical distinction trade_wall_approved.py's own Approved tab already computes
       (cc#1781 TRADE_ALERT_CLOSE_PRIORITY_V1) -- not a second, different open/closed rule.
   No "All" option on either row -- the founder's own tab list names exactly Equity/Future/
   Options/Open/Closed, five tabs, nothing more.
   Realised/unrealised P&L (session_log 40507 part_2) is NOT built by this card: nothing of the
   kind existed on this page before this change (checked, not assumed), and item 5 of this card's
   own scope says keep-what-exists rather than build fresh -- flagged as an open item in the task
   result, same as this card's own QB-placement question, not invented here. */
var STATE = { alerts: [], instrument: 'EQUITY', book: 'open' };
var INSTRUMENTS = ['EQUITY', 'FUTURES', 'OPTIONS'];
var INSTRUMENT_LABEL = { EQUITY: 'Equity', FUTURES: 'Future', OPTIONS: 'Options' };  // founder's own words
var BOOKS = ['open', 'closed'];
var BOOK_LABEL = { open: 'Open', closed: 'Closed' };
/* cc#1693 (founder 04-Sep screenshot: "Hide When and Notes column and show only Action column
   along with TC score replacing notes"). HIDE, not delete -- same shape as SHOW_VOL_TILES /
   SHOW_GATE_CHIP (scorr_v10_signal.html). One line each to restore. WHEN's information is not
   lost: it is already in ACTION for approved rows; NOTES text is kept as a title= tooltip on the
   SYMBOL cell so a founder note stays reachable on hover. Untouched by cc#2082 -- unrelated toggle. */
var SHOW_ALERT_WHEN = false;
var SHOW_ALERT_NOTES = false;
/* cc#1693: TC /100 -- the SAME per-symbol, side-aware score the V8 dashboard Open Positions TC
   column reads, GET /api/trade-check/position-stars-v2 (tc_position_stars_v2.py). Built as OWN
   {symbol|dir_side: item}, not the raw LONG/SHORT-keyed dict the endpoint returns, so the lookup
   matches an alert's BUY/SELL direction directly.
   FIELD CORRECTED after checking the dashboard's own source, not just its label: v8_dashboard.html
   L4039-4041 names this TC_BEST_OF_FOUR_V1 (cc#1603, founder 02-Sep 15:34) and states the column's
   headline VALUE is best_any_score100 (best of the 4 cards, ANY direction) -- the position's own-
   side card "rides along for the hover, never as the headline." */
var TC_MAP = {}, TC_ASOF = null;

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* API timestamps are "YYYY-MM-DD HH:MM:SS...+00:00" (UTC) -> IST, minute precision. Same
   conversion as the app screen. */
function istStamp(ts){
  if (!ts) return '';
  var d = new Date(String(ts).replace(' ', 'T'));
  if (isNaN(d)) return String(ts).slice(0, 16);
  var i = new Date(d.getTime() + (330 + d.getTimezoneOffset()) * 60000);
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i.getMonth()];
  var hh = ('0' + i.getHours()).slice(-2), mm = ('0' + i.getMinutes()).slice(-2);
  return i.getDate() + ' ' + mo + ' · ' + hh + ':' + mm;
}
function fmtPx(v){ return v == null ? '—' : Number(v).toLocaleString('en-IN', {maximumFractionDigits: 2}); }

/* cc#1693: TC /100 cell, built to MATCH v8_dashboard.html's tcCell() exactly (same headline,
   same cap, same tooltip shape) rather than reinvent it. Em dash when no row exists for that
   symbol+direction -- never 0, never invented. Untouched by cc#2082. */
function tcAlertCell(a){
  var t = TC_MAP[a.symbol + '|' + a.direction];
  if (!t || t.best_any_score100 == null) return '<td class="al-tag">—</td>';
  var buy = String(t.best_any_bucket || '').indexOf('BUY') === 0;
  var opp = !!t.best_any_opposes_position;
  var sideTip = (t.score100 != null)
    ? ('on this alert\'s side: ' + (t.verdict10 || '--') + ' ' + Number(t.score100).toFixed(0))
    : 'on this alert\'s side: no card scored';
  var cap = t.best_any_bucket
    ? '<span class="tc-band ' + (buy ? 'tc-buy' : 'tc-sell') + (opp ? ' tc-opp' : '') + '" title="'
      + (opp ? 'strongest card is against this alert\'s direction · ' : '') + esc(sideTip) + '">'
      + esc(t.best_any_bucket) + '</span>'
    : '';
  return '<td title="' + esc(sideTip) + '"><span class="tc-num">' + Number(t.best_any_score100).toFixed(0) + '</span>' + cap + '</td>';
}
function theadHtml(){
  var asof = scorrAsofStamp(TC_ASOF);
  var tcHdr = 'TC /100' + (asof.txt ? '<span class="th-asof">as of ' + esc(asof.txt) + '</span>' : '');
  return '<tr><th>Symbol</th><th>Dir</th><th>Status</th><th>Engine</th><th>Trigger</th>'
    + (SHOW_ALERT_WHEN ? '<th>When</th>' : '')
    + (SHOW_ALERT_NOTES ? '<th>Notes</th>' : '<th>' + tcHdr + '</th>')
    + '<th>Action</th></tr>';
}

/* cc#2082: counts are over the WHOLE approved book regardless of the OTHER row's current
   selection -- trade_wall_endpoints.py's own stated convention for its two-level filter, matched
   here rather than a narrower (and inconsistent-with-the-sibling-page) "count only what the other
   filter also allows". */
function instrumentTabsHtml(){
  var n = { EQUITY: 0, FUTURES: 0, OPTIONS: 0 };
  STATE.alerts.forEach(function(a){ var k = a.instrument || 'EQUITY'; if (n[k] != null) n[k]++; });
  return INSTRUMENTS.map(function(k){
    return '<button class="tab' + (k === STATE.instrument ? ' on' : '') + '" onclick="pickInstrument(\'' + k + '\')">'
      + INSTRUMENT_LABEL[k] + ' <span class="n">' + n[k] + '</span></button>';
  }).join('');
}
function bookTabsHtml(){
  var n = { open: 0, closed: 0 };
  STATE.alerts.forEach(function(a){ n[a.closed ? 'closed' : 'open']++; });
  return BOOKS.map(function(k){
    return '<button class="tab' + (k === STATE.book ? ' on' : '') + '" onclick="pickBook(\'' + k + '\')">'
      + BOOK_LABEL[k] + ' <span class="n">' + n[k] + '</span></button>';
  }).join('');
}

function rowHtml(a){
  /* cc#2082: every row reaching this page is now status='approved' by construction (load() only
     ever fetches status=approved and additionally drops kind='rebalance_due' -- see load() below)
     -- the pending/triggered/dismissed render paths, the Approve/Dismiss/override buttons, and the
     separate QB rebalance_due template are all DELETED, not hidden, per this card's own verify
     clause ("grep confirms zero Approve/Dismiss/override markup or handlers remain"). */
  var dirCls = a.direction === 'BUY' ? 'long' : 'short';
  /* cc#1531: a signal-approved row (approve_signal — never was 'triggered') carries a sentinel
     trigger_price/trigger_condition, not a real watch level. Suppress the trigger cell for those
     rows only; a manual triggered -> approved alert keeps its real trigger context. */
  var isSignalApproval = !a.triggered_at;
  var trig = isSignalApproval ? '—'
    : ('crosses ' + (a.trigger_condition === 'ABOVE' ? '≥ ' : '≤ ') + fmtPx(a.trigger_price));
  var when = 'approved ' + (a.approved_at ? istStamp(a.approved_at) : '') + ' @ ' + fmtPx(a.approved_price)
    + (a.approved_via ? ' · via ' + a.approved_via : '');
  var trigSub = when ? '<span class="al-tag2">' + esc(when) + '</span>' : '';
  /* cc#2082 item 3: the Book split rides in the same Action cell as the approval badge -- Closed
     shown as a second, distinct badge (.al-badge.no, the same "settled/no further action" visual
     family Dismissed already used pre-this-card) alongside Approved, never replacing it: a closed
     row is still, factually, an approved trade. */
  var act = '<div class="twa"><span class="al-badge ok">Approved' + (a.approved_price != null ? ' @ ' + fmtPx(a.approved_price) : '')
      + (a.approved_at ? ' · ' + istStamp(a.approved_at) : '') + '</span>'
      + (a.closed ? ('<span class="al-badge no">Closed' + (a.closed_at ? ' · ' + istStamp(a.closed_at) : '')
                     + (a.close_price != null ? ' @ ' + fmtPx(a.close_price) : '') + '</span>') : '')
      + (a.notes && /override before trigger/.test(a.notes) ? '<span class="al-why">founder override before trigger</span>' : '') + '</div>';
  return '<tr id="al-' + a.id + '">'
    + '<td class="sym"' + (a.notes ? ' title="' + esc(a.notes) + '"' : '') + '>' + esc(a.symbol) + '</td>'
    + '<td class="' + dirCls + '">' + esc(a.direction) + '</td>'
    + '<td><span class="al-st approved">APPROVED</span></td>'
    + '<td>' + (a.source_engine ? '<span class="al-eng">' + esc(a.source_engine) + '</span>' : '<span class="al-tag">manual</span>') + '</td>'
    + '<td class="al-tag">' + esc(trig) + trigSub + '</td>'
    + (SHOW_ALERT_WHEN ? '<td class="al-tag">' + esc(when) + '</td>' : '')
    + (SHOW_ALERT_NOTES ? '<td class="al-notes">' + esc(a.notes || '') + '</td>' : tcAlertCell(a))
    + '<td>' + act + '</td>'
    + '</tr>';
}

function render(){
  document.getElementById('tabsInstrument').innerHTML = instrumentTabsHtml();
  document.getElementById('tabsBook').innerHTML = bookTabsHtml();
  document.getElementById('thead').innerHTML = theadHtml();
  var view = STATE.alerts.filter(function(a){
    var inst = a.instrument || 'EQUITY';
    var bk = a.closed ? 'closed' : 'open';
    return inst === STATE.instrument && bk === STATE.book;
  });
  document.getElementById('meta').textContent =
    'showing ' + view.length + ' of ' + STATE.alerts.length + ' approved alerts · '
    + INSTRUMENT_LABEL[STATE.instrument] + ' · ' + BOOK_LABEL[STATE.book];
  var cols = 5 + (SHOW_ALERT_WHEN ? 1 : 0) + 2;   // symbol/dir/status/engine/trigger + when? + (tc-or-notes) + action
  document.getElementById('body').innerHTML = view.length
    ? view.map(rowHtml).join('')
    : '<tr><td colspan="' + cols + '" class="empty">No ' + INSTRUMENT_LABEL[STATE.instrument].toLowerCase()
      + ' ' + BOOK_LABEL[STATE.book].toLowerCase() + ' alerts.</td></tr>';
}

function pickInstrument(k){ if (k === STATE.instrument) return; STATE.instrument = k; render(); }
function pickBook(k){ if (k === STATE.book) return; STATE.book = k; render(); }

function load(){
  /* cc#2082: status=approved server-side -- pending/triggered/dismissed rows have no home on this
     page at all any more, so there is no reason to fetch or ship them. kind='rebalance_due' rows
     (QB basket notices) are dropped client-side per this card's own scope item 2 -- they do not
     belong on a pure-display TRADE P&L page; where they should surface instead is NOT decided by
     this card (an open placement question, same as cc#2028 left it -- not invented here). */
  fetchWithTimeout('/api/alerts/list?status=approved&limit=200')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      STATE.alerts = (d.alerts || []).filter(function(a){ return a.kind !== 'rebalance_due'; });
      render();
    })
    .catch(function(e){
      document.getElementById('meta').textContent = 'Could not load alerts — ' + e.message;
      document.getElementById('body').innerHTML =
        '<tr><td colspan="7" class="empty">Could not load alerts. '
        + '<button class="tw-btn" onclick="load()">Retry</button></td></tr>';
    });
}
load();
/* the engine sweeps every 5 minutes (cc#1504); refresh on the same cadence so a just-approved /
   just-closed row does not wait on a manual reload. In-place, filter preserved. */
setInterval(load, 300000);

/* cc#1693: TC /100 -- a second, independent fetch of the SAME batch endpoint the V8 dashboard
   reads (no params, returns every current symbol+side row). Failure here degrades every TC cell
   to em dash (tcAlertCell already treats a missing TC_MAP entry that way) rather than blocking
   the alerts list itself -- the two fetches are deliberately independent. Untouched by cc#2082. */
function loadTc(){
  fetchWithTimeout('/api/trade-check/position-stars-v2')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var rows = d.rows || [];
      var map = {}, asof = null;
      rows.forEach(function(it){
        if (!it || !it.symbol || !it.dir_side) return;
        map[it.symbol + '|' + it.dir_side] = it;
        if (it.computed_at && (!asof || it.computed_at > asof)) asof = it.computed_at;
      });
      TC_MAP = map; TC_ASOF = asof;
      render();
    })
    .catch(function(){ /* TC_MAP stays whatever it was (empty on first load) -- every cell already
                           degrades to em dash, never a broken render over a missing score feed */ });
}
loadTc();
setInterval(loadTc, 300000);

/* cc#1831: the create-alert flow (FORM / alOpen / alClose / alSearch / alSym / alPick / alSubmit)
   that used to live here moved to scorr_alert_create.js (window.ScorrAlertCreate) and now opens
   from Wall of Trades (/trades). This page no longer offers alert creation at all -- see the
   comment above #subline. */
</script>
</body>
</html>
