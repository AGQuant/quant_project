<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Dashboard · Scorr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
/* cc#651 part_2 — Adaptive Dashboard: the client-facing shelf of Portfolio Health Reports.
   Theme tokens mirror scorr_health.html (light default, dark via [data-theme="dark"]). */
/* cc#1203 push 16: this page's light AND dark palettes both moved to the injected contract.
   Every dark value it declared was already the contract's exactly; the light values shift a
   little (ground ECEEF3 to F5F7FB, green 0B6E42 to 0E9F62, red B52432 to DE3A52, blue 1847DF to
   3563E9, amber 8F5C07 to B47B10, faint B8BECC to 93A0BE), which is one light palette replacing
   another rather than a page losing its own.

   --ink was RENAMED, not deleted. On this page --ink is the TEXT colour - 07111F on light,
   E9EEFB on dark - while the contract's --ink is 0A0F1E, the near-black GROUND. Same name,
   opposite ends of the page. Deleting the block without the rename would have put near-black
   text on a near-black page in dark mode. It says --txt now. */
:root{}

html,body{margin:0;padding:0;background:var(--bg);}
.adx,.adx *,.adx *::before,.adx *::after{box-sizing:border-box;margin:0;padding:0;}
.adx{color:var(--txt);font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;max-width:1180px;margin:0 auto;}
.adx .pos{color:var(--grn);} .adx .neg{color:var(--red);}
.adx a{text-decoration:none;color:inherit;}
/* masthead pill-safe (clears fixed theme/logout pills) */
.adx .mast{background:var(--mast);color:#fff;padding:28px 120px 24px 32px;}
.adx .mast .k{font-size:9px;font-weight:600;letter-spacing:1.2px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:10px;}
.adx .mast h1{font-family:'Sora',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.05;}
.adx .mast .sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:6px;letter-spacing:.2px;}
.adx .wrap{background:var(--paper);padding:24px 32px 60px;}
.adx .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.adx .card{display:block;border:1px solid var(--rule);border-radius:8px;background:var(--bg);padding:16px 18px;transition:border-color .12s,background .12s;min-height:44px;}
.adx .card:hover{border-color:var(--blu);background:var(--hover);}
.adx .card .nm{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.adx .card .meta{font-size:10.5px;color:var(--muted);margin-top:3px;}
.adx .card .strip{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;}
.adx .card .strip .b .l{font-size:8.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);}
.adx .card .strip .b .v{font-size:14px;font-weight:600;margin-top:2px;letter-spacing:-.3px;}
.adx .card .go{font-size:10px;font-weight:600;letter-spacing:.3px;color:var(--blu);margin-top:14px;}
.adx .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:12px;}
/* cc#1215: below 1024px Pay-in and Payout collapse away and Net pay-in stays. On a narrow screen
   the net is the number worth keeping, and eleven columns on a phone is not a table, it is a
   horizontal scroll pretending to be one. */
@media(max-width:1023px){.adx .lg{display:none;}}
/* cc#1212 — the ledger sheet. There was no popout on this page to reuse, so this is built on the
   page's own tokens rather than importing a pattern from elsewhere: it inherits the theme the
   contract sets, in both directions, with nothing hardcoded.
   Scrolling is INSIDE the sheet, never the page behind it, and the table scrolls inside the
   sheet - so a narrow phone gets a horizontally scrollable table rather than a page that shifts
   sideways under the reader's thumb. */
.adx-lx{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;
        background:rgba(3,7,20,.55);padding:16px;}
.adx-lx.open{display:flex;}
.adx-lx .pan{background:var(--paper);color:var(--txt);border:1px solid var(--rule);border-radius:10px;
        width:100%;max-width:760px;max-height:84vh;display:flex;flex-direction:column;overflow:hidden;
        font-family:'IBM Plex Mono',monospace;box-shadow:0 24px 60px rgba(3,7,20,.35);}
.adx-lx .hd{padding:16px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:12px;}
.adx-lx .hd h3{font-family:'Sora',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.2px;flex:1;}
.adx-lx .hd .sb{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:400;}
.adx-lx .x{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
        border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--muted);
        cursor:pointer;font-size:16px;line-height:1;font-family:inherit;}
.adx-lx .x:hover{color:var(--txt);border-color:var(--blu);}
.adx-lx .bd{overflow:auto;padding:0;}
.adx-lx table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:640px;}
.adx-lx th{text-align:left;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;
        text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);
        position:sticky;top:0;background:var(--paper);}
.adx-lx td{padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;}
.adx-lx td.n{text-align:right;font-variant-numeric:tabular-nums;}
.adx-lx tr.int td{color:var(--faint);}
.adx-lx .chip{display:inline-block;padding:2px 7px;border-radius:9px;font-size:9px;font-weight:700;
        letter-spacing:.4px;text-transform:uppercase;}
.adx-lx .chip.in{color:var(--grn);background:var(--grn-t);}
.adx-lx .chip.out{color:var(--red);background:var(--red-t);}
.adx-lx .chip.intr{color:var(--faint);background:var(--hover);}
.adx-lx tfoot td{font-weight:700;border-top:1px solid var(--rule);border-bottom:none;background:var(--hover);}
.adx-lx .ft{padding:12px 18px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--muted);}
.adx .lgbtn{display:inline-block;margin-top:10px;padding:0 12px;min-height:44px;line-height:44px;
        font-size:10.5px;font-weight:700;letter-spacing:.3px;color:var(--blu);border:1px solid var(--rule);
        border-radius:8px;cursor:pointer;font-family:inherit;background:transparent;}
.adx .lgbtn:hover{border-color:var(--blu);background:var(--hover);}
@media(max-width:600px){.adx-lx .pan{max-height:92vh;}}
.adx .empty a{color:var(--blu);font-weight:600;}
@media print{ .no-print,#scorr-lo,#scorr-th{display:none !important;} }
@media (max-width:767px){
  .adx .mast{padding:70px 20px 20px;}
  .adx .mast h1{font-size:26px;}
  .adx .wrap{padding:20px 16px 60px;}
  .adx .grid{grid-template-columns:1fr;}
  .adx .card .nm{font-size:16px;}
  .adx .card .strip .b .v{font-size:15px;}
}
</style>
</head>
<body>
<div id="scorr-nav"></div>
<div class="adx">
  <div class="mast">
    <div class="k">Scorr · Client Reports</div>
    <h1>Adaptive Dashboard</h1>
    <div class="sub"><span id="adx-count">—</span> saved portfolios · tap a client to open their Portfolio Health Report</div>
  </div>
  <div class="wrap">
    <div id="adx-toolbar" style="display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      <input id="adx-search" type="text" placeholder="Search clients…" autocomplete="off"
        style="flex:1;min-width:180px;max-width:320px;padding:9px 12px;font-size:14px;border:1px solid var(--rule,#dfe3ea);border-radius:8px;background:var(--bg,#fff);color:inherit;">
      <div style="display:inline-flex;border:1px solid var(--rule,#dfe3ea);border-radius:8px;overflow:hidden;flex:none;">
        <button id="adx-tab-cards" type="button" style="padding:8px 15px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:transparent;color:inherit;">Cards</button>
        <button id="adx-tab-table" type="button" style="padding:8px 15px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:transparent;color:inherit;">Table</button>
      </div>
    </div>
    <div id="adx-list"><div class="empty">Loading client reports…</div></div>
  </div>
</div>
<!-- cc#1273: Basket Rebalance sheets -->
<div id="adx-basket-sheet" class="adx-lx" style="z-index:9999;">
  <div class="pan">
    <div class="hd">
      <div><h3>Rebalance baskets</h3><div class="sb" id="adx-basket-sub"></div></div>
      <button class="x" type="button" aria-label="Close" onclick="closeBasketsSheet()">✕</button>
    </div>
    <div class="bd" id="adx-basket-list" style="padding:0;"></div>
  </div>
</div>
<div id="adx-repair-sheet" class="adx-lx" style="z-index:9999;">
  <div class="pan">
    <div class="hd">
      <div><h3>Repair sheet</h3><div class="sb" id="adx-repair-sub"></div></div>
      <button class="x" type="button" aria-label="Close" onclick="closeRepairSheet()">✕</button>
    </div>
    <div class="bd">
      <table style="width:100%;border-collapse:collapse;font-size:11.5px;min-width:640px;">
        <thead>
          <tr>
            <th style="text-align:left;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);">Symbol</th>
            <th style="text-align:right;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);">Target qty</th>
            <th style="text-align:right;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);">Current qty</th>
            <th style="text-align:center;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);">Action</th>
            <th style="text-align:right;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);">Qty</th>
            <th style="text-align:right;padding:9px 12px;font-size:9.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);">Indicative ₹</th>
          </tr>
        </thead>
        <tbody id="adx-repair-rows"></tbody>
      </table>
      <div style="padding:12px 18px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--muted);">Indicative only — not an order. Reconfirm price before dealing.</div>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  // cc#764: card/table toggle (SmartGain Table/Ladder pattern) + live client search + sortable table.
  // Default = cards when <=6 clients, table when more; choice remembered in-session. Data from the cc#756
  // enriched /api/health/portfolios (client name / tracking_date / holdings / invested / current / P&L).
  var listEl=document.getElementById('adx-list'), countEl=document.getElementById('adx-count'),
      toolbar=document.getElementById('adx-toolbar'), searchEl=document.getElementById('adx-search'),
      tabCards=document.getElementById('adx-tab-cards'), tabTable=document.getElementById('adx-tab-table');
  function inr(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '₹'+Math.round(n).toLocaleString('en-IN'); }
  /* cc#1212 — 2-dp money for the ledger sheet, where a rounded rupee hides the paise that make a
     voucher reconcile. The shelf keeps 0 dp; only the row-level ledger uses this. */
  /* cc#1212: the three ledger blocks for a client card. Returns an empty string when there is
     no ledger at all - a card with nothing to say stays quiet, which is the rule the alpha chip
     on the same card already follows. */
  function ledgerBlocks(p){
    if(p.net_payin==null && p.payin_total==null && p.payout_total==null) return '';
    var dash='<span title="no ledger on record">—</span>';
    function b(label, val, extra){
      return '<div class="b"><div class="l">'+label+'</div><div class="v">'
        + (val==null ? dash : inr(val)) + (extra||'') + '</div></div>';
    }
    var manual = (p.net_payin!=null && p.invested!=null
                  && Math.abs(p.net_payin - p.invested) > 1000)
      ? ' <span title="Invested is set manually for this account" style="color:var(--faint);font-weight:400;">*</span>'
      : '';
    return b('Pay-in', p.payin_total) + b('Payout', p.payout_total)
         + b('Net pay-in', p.net_payin, manual);
  }
  function inr2(n){ if(n===null||n===undefined||isNaN(n)) return '—';
    return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  /* ── cc#1212 LEDGER SHEET ─────────────────────────────────────────────────────────────────
     ONE handler, exported on window, because cc#1213 and cc#1215 are both told to open this
     same sheet and told not to fork it. Anything that wants a ledger calls ScorrLedger.open().
     Fetched lazily on first open and cached per portfolio: a reader who opens, closes and
     reopens the same client should not re-hit the endpoint, and a reader who never opens one
     should not pay for it at page load. */
  var LEDGER_CACHE={};
  function ledgerEl(){
    var el=document.getElementById('adx-ledger');
    if(el) return el;
    el=document.createElement('div'); el.id='adx-ledger'; el.className='adx-lx';
    el.innerHTML='<div class="pan" role="dialog" aria-modal="true" aria-labelledby="adx-lg-t">'
      + '<div class="hd"><div style="flex:1"><h3 id="adx-lg-t"></h3><div class="sb"></div></div>'
      + '<button class="x" type="button" aria-label="Close">✕</button></div>'
      + '<div class="bd"></div><div class="ft"></div></div>';
    document.body.appendChild(el);
    /* Close on the X, on the backdrop, and on Esc. A sheet that can only be closed one way is a
       trap on a phone, where the backdrop is the biggest target on the screen. */
    el.querySelector('.x').addEventListener('click', closeLedger);
    el.addEventListener('click', function(e){ if(e.target===el) closeLedger(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeLedger(); });
    return el;
  }
  function closeLedger(){ var el=document.getElementById('adx-ledger'); if(el) el.classList.remove('open'); }
  function renderLedger(el, name, d){
    var rows=d.rows||[];
    el.querySelector('h3').textContent=(name||d.name||'Client')+' — Ledger';
    var span = rows.length ? (dmy(rows[0].txn_date)+' to '+dmy(rows[rows.length-1].txn_date)) : '';
    var intn = (d.internal_rows||0);
    el.querySelector('.sb').textContent = rows.length
      ? (span+' · '+rows.length+' row'+(rows.length===1?'':'s')
         + (intn ? ' · '+intn+' internal, not counted' : ''))
      : 'No ledger on record';
    if(!rows.length){ el.querySelector('.bd').innerHTML=
        '<div class="empty">No ledger rows for this client.</div>';
      el.querySelector('.ft').textContent=''; return; }
    var body=rows.map(function(r){
      var isIn=(r.txn_type==='PAYIN'), open=(r.segment==='OPENING');
      /* An OPENING row is a balance carried in, not a receipt. It is shown in the Pay-in column
         and counted, but its chip says so rather than calling it a pay-in. */
      var chip = r.is_internal ? '<span class="chip intr">Internal</span>'
               : open ? '<span class="chip intr">Opening</span>'
               : isIn ? '<span class="chip in">Pay-in</span>' : '<span class="chip out">Payout</span>';
      return '<tr class="'+(r.is_internal?'int':'')+'">'
        + '<td>'+dmy(r.txn_date)+'</td>'
        + '<td>'+esc(r.segment||'—')+'</td>'
        + '<td>'+esc(r.voucher_no||'—')+'</td>'
        + '<td>'+chip+'</td>'
        + '<td class="n">'+(isIn?inr2(r.amount):'')+'</td>'
        + '<td class="n">'+(isIn?'':inr2(r.amount))+'</td></tr>';
    }).join('');
    el.querySelector('.bd').innerHTML='<table><thead><tr>'
      + '<th>Date</th><th>Segment</th><th>Voucher</th><th>Type</th>'
      + '<th style="text-align:right">Pay-in</th><th style="text-align:right">Payout</th></tr></thead>'
      + '<tbody>'+body+'</tbody><tfoot>'
      + '<tr><td colspan="4">Total</td><td class="n">'+inr2(d.payin_total)+'</td>'
      +     '<td class="n">'+inr2(d.payout_total)+'</td></tr>'
      + '<tr><td colspan="4">Net pay-in</td><td class="n" colspan="2">'+inr2(d.net_payin)+'</td></tr>'
      + '</tfoot></table>';
    el.querySelector('.ft').textContent = intn
      ? 'Internal rows are shown for completeness and are not counted in the totals.'
      : 'Totals cover every row listed.';
  }
  function openLedger(pid, name){
    var el=ledgerEl(); el.classList.add('open');
    if(LEDGER_CACHE[pid]){ renderLedger(el, name, LEDGER_CACHE[pid]); return; }
    el.querySelector('h3').textContent=(name||'Client')+' — Ledger';
    el.querySelector('.sb').textContent='Loading…';
    el.querySelector('.bd').innerHTML='<div class="empty">Loading ledger…</div>';
    el.querySelector('.ft').textContent='';
    fetch('/api/health/ledger?pid='+encodeURIComponent(pid), {credentials:'same-origin'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){ LEDGER_CACHE[pid]=d; renderLedger(el, name, d); })
      /* A failed fetch says so in the sheet. It must never leave "Loading…" on screen, which a
         reader would take for a slow network rather than a dead endpoint. */
      .catch(function(e){ el.querySelector('.sb').textContent='';
        el.querySelector('.bd').innerHTML='<div class="empty">Could not load the ledger ('+esc(e.message)+').</div>'; });
  }
  window.ScorrLedger={open:openLedger, close:closeLedger};
  function dmy(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10)||'—';
    var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear(); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null)?'':String(s); return d.innerHTML; }
  function pnlStr(pnl,pc){ if(pnl==null) return '—';
    return (pnl>=0?'+':'−')+'₹'+Math.abs(Math.round(pnl)).toLocaleString('en-IN')
      +(pc==null?'':' ('+(pc>=0?'+':'−')+Math.abs(pc).toFixed(1)+'%)'); }
  var ALL=[], VIEW='cards', SORT={key:'pnl_pct',dir:-1};
  function clientName(p){ return (p.client&&p.client.name)||p.name||('Portfolio '+p.id); }
  function asOf(p){ return (p.client&&p.client.tracking_date)||p.created_at; }
  /* cc#1098 — THE TRACKING START DATE, AND ONLY THAT. asOf() above falls back to created_at when
     tracking_date is NULL, which is fine for a freshness stamp and WRONG under a "from" label: it
     would print the moment the portfolio row was created as if it were the day the client's money
     started being tracked. Portfolio 181 has a NULL tracking_date today, so this is a live path,
     not a hypothetical. No fallback here, deliberately — a missing start date is shown by SAYING
     NOTHING, never by substituting a different date that happens to be available.
     asOf() is left exactly as it is; the table view still uses it. */
  /* cc#1205: the served start_date first. This used to read ONLY client_index.tracking_date,
     which is the THIRD fallback and the only free-text one — so eight of nine clients showed an
     em-dash in a column they had a real date for, sitting in hr_portfolios.alpha_start_date all
     along. The endpoint now resolves alpha -> meta -> client_index and says which it used, so
     the page reads one field instead of guessing. The old read stays as the last resort for a
     payload served by an older deploy. */
  function startDate(p){ return p.start_date || (p.client && p.client.tracking_date) || null; }
  function filtered(){ var q=(searchEl.value||'').trim().toLowerCase();
    return q?ALL.filter(function(p){ return clientName(p).toLowerCase().indexOf(q)>-1; }):ALL.slice(); }
  function setView(v){ VIEW=v; try{ sessionStorage.setItem('adx_view',v); }catch(e){}
    tabCards.style.background=(v==='cards')?'var(--grn,#0b6e42)':'transparent'; tabCards.style.color=(v==='cards')?'#fff':'inherit';
    tabTable.style.background=(v==='table')?'var(--grn,#0b6e42)':'transparent'; tabTable.style.color=(v==='table')?'#fff':'inherit';
    render(); }
  function render(){ var ps=filtered(); if(VIEW==='table') renderTable(ps); else renderCards(ps); }
  function renderCards(ps){
    if(!ps.length){ listEl.innerHTML='<div class="empty">No matching clients.</div>'; return; }
    var cards=ps.map(function(p){ var col=(p.pnl==null?'var(--muted)':(p.pnl>=0?'var(--grn)':'var(--red)'));
      return '<a class="card" href="/health?pid='+p.id+'&wl=1">'
        + '<div class="nm">'+esc(clientName(p))+'</div>'
        /* cc#1098: client id · tracking start · holdings, on ONE line. The "from" segment is
           dropped entirely when there is no tracking_date, so the line reads "#181 · 25 holdings"
           rather than carrying an empty or invented date. Same .meta class, same font size. */
        + '<div class="meta">#'+esc(p.id)
          + (startDate(p) ? ' · from '+dmy(startDate(p)) : '')
          + ' · '+(p.n_holdings||0)+' holdings</div>'
        + '<div class="strip">'
        +   '<div class="b"><div class="l">Invested</div><div class="v">'+inr(p.invested)+'</div></div>'
        +   '<div class="b"><div class="l">Current</div><div class="v">'+inr(p.current)+'</div></div>'
        +   '<div class="b"><div class="l">P&amp;L</div><div class="v" style="color:'+col+'">'+pnlStr(p.pnl,p.pnl_pct)+'</div>'
        +     /* cc#1205: alpha rides UNDER the P&L it is derived from, and only when it exists —
                 no chip at all rather than an em-dash chip, so a card with nothing to say is
                 quiet instead of cluttered. */
              (p.alpha_pct==null?'':'<div style="font-size:10.5px;font-weight:700;margin-top:2px;color:'

  }).catch(function(e){
    listEl.innerHTML='<div class="empty" style="text-align:left;line-height:1.6;">'
      +'<div style="font-weight:600;margin-bottom:4px;">Could not load reports.</div>'
      +'<div style="font-size:12.5px;opacity:.8;">'+esc(String(e&&e.message||e))+'</div>'
      +'<div style="font-size:12.5px;margin-top:8px;"><a href="/adaptive">Retry</a> · '
      +'<a href="/health">Health tab</a></div></div>';
  });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
