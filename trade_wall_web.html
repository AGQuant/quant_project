<!DOCTYPE html>
<html lang="en">
<head>
<!-- cc#1203 push 6: head and body tags are NEW here, and they are the fix for a live
     defect, not tidying. This file opened with a doctype and an html tag but had NO head and NO
     body tag of any kind. main.py's shared-asset injections all anchor on the closing head or
     closing body tag: the token sheet and theme boot look for one then fall back to the other,
     and the logout pill, theme button and pwa.js tag each do a plain one-shot replace on the
     closing body tag. None of them could match, so none of them ran. The proof is three lines
     below — this page ships an empty nav placeholder div that pwa.js is supposed to fill, and
     pwa.js was never on the page to fill it. /trades has been serving a blank navbar since
     cc#991. Same shape, same cause as /digest in push 5; found by the sweep in that push.
     The page's own style block stays in head where it already was. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wall of Trades</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 64px}
  h1{font-size:19px;font-weight:800;margin:4px 0 2px;display:inline-block}
  .hd-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sub{font-size:12px;color:var(--mut);margin-bottom:14px;line-height:1.5}
  .tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:10px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:8px 13px;border-radius:9px;border:1px solid var(--line);
       background:var(--panel);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;
       white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{border-color:var(--blu)}
  .tab.on{background:var(--blu);border-color:var(--blu);color:#fff}
  .tab .n{font-size:10.5px;font-weight:800;opacity:.72}
  /* cc#1295: three-level hierarchy — status (bigger, primary) -> instrument -> engine bucket. */
  .tabs.lvl1 .tab{font-size:13.5px;padding:9px 16px}
  .tabs.lvl3 .tab{font-size:11.5px;padding:6px 11px;min-height:32px}
  /* cc#1691: two grouped rows instead of four stacked full-width ones. .tw-frow holds a pair of
     labelled .tw-fgrp groups; wraps to more lines only when a group genuinely does not fit
     (narrow phones), exactly two rows at 1180px+ per the card. The .tabs children keep their own
     flex-wrap so a long chip list inside one group still wraps ONLY that group, never the row. */
  .tw-frow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .tw-fgrp{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:38px}
  .tw-fgrp .tabs{margin:0;padding:0;overflow:visible}
  .tw-flbl{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:800;letter-spacing:.12em;
           text-transform:uppercase;color:var(--dim);flex:none}
  .tw-fsep{width:1px;align-self:stretch;background:var(--line);flex:none;min-height:24px}
  @media(max-width:900px){.tw-fsep{display:none}}
  .ibtn{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
        background:var(--panel);color:var(--mut);font-size:13px;font-weight:800;cursor:pointer;
        display:inline-flex;align-items:center;justify-content:center;font-style:italic;font-family:Georgia,serif}
  .ibtn:hover{border-color:var(--blu);color:var(--blu)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
  .meta{font-size:11px;color:var(--dim);padding:12px 16px 0;line-height:1.5}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 10px;
           font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
           border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
  tbody tr:hover{background:var(--card2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  /* cc#1734: Closed book DETAIL is decoded text; it ellipsises (full text on hover) before the
     numbers would shrink, so the tab fits a laptop width with no horizontal scroll. */
  .tw-detail{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:1280px){ .tw-detail{max-width:150px} }
  .tw-csum{font-size:11.5px;color:var(--mut);margin:-4px 0 8px}
  .tw-csum b{color:var(--txt)}
  .sym{font-weight:800}
  .pos{color:var(--grn)} .neg{color:var(--red)}
  /* cc#1735: Approved tab — inline level inputs, saved tick, warnings, greyed closed rows */
  .tw-lvl{width:86px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);
    color:var(--txt);font-size:12px;text-align:right;font-family:inherit}
  .tw-lvl:focus{outline:none;border-color:var(--blu)}
  .tw-lvl.saving{opacity:.6}
  .tw-saved{display:block;font-size:10px;color:var(--grn);margin-top:2px;min-height:12px}
  .tw-saved.warn{color:#eab308}
  .tw-saved.err{color:var(--red)}
  .tw-close-btn{padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--txt);
    font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .tw-close-btn:hover{border-color:var(--red);color:var(--red)}
  tr.tw-closed td{opacity:.55}
  /* cc#1736: suppressed-in-position rows (revealed on demand) are greyed; the note names the position */
  tr.tw-suppressed td{opacity:.55}
  .tw-supp{display:block;font-size:10px;color:#eab308;margin-top:2px}
  .tw-rev{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:#eab308;border:1px solid #eab308;margin-right:4px}
  .tw-supp-link{cursor:pointer;text-decoration:underline dotted;color:#eab308}
  .tw-cmp-lbl{display:block;font-size:10px;color:var(--mut)}
  .long{color:var(--grn);font-weight:700} .short{color:var(--red);font-weight:700}
  .empty{padding:26px 8px;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.6}
  .tw-tag{font-family:ui-monospace,monospace;font-size:10px;color:var(--mut)}
  /* cc#1532: QB Basket only — the batch-write clock time, honestly labelled "computed" so it is
     never mistaken for a market entry time. Sits under the existing date, smaller/dimmer. */
  .tw-computed{display:block;font-family:ui-monospace,monospace;font-size:9px;color:var(--dim)}
  .tw-day{font-family:ui-monospace,monospace;font-size:10px;font-weight:800;letter-spacing:.12em;
          text-transform:uppercase;color:var(--dim);background:var(--card2)}
  .tw-more{padding:16px;text-align:center;font-family:ui-monospace,monospace;font-size:11px;color:var(--mut)}
  .tw-btn{padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
          color:var(--txt);font-size:12.5px;font-weight:700;cursor:pointer;min-height:38px}
  .ov{display:none;position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:9998;
      align-items:center;justify-content:center;padding:20px}
  .ov.open{display:flex}
  .ov-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:420px;
          width:100%;padding:18px}
  .ov-box h2{font-size:14px;margin:0 0 4px}
  .ov-box .s{font-size:11px;color:var(--mut);margin-bottom:12px}
  .ov-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
          border-bottom:1px solid var(--line2);font-size:12.5px}
  .ov-row:last-child{border-bottom:none}
  .ov-close{margin-top:14px;width:100%}
  /* cc#1525 built an Approve/Alert cluster here; cc#1537 (founder confirmed 31-Aug) removed it —
     the wall is pure display, /alerts is the sole approve surface. What survives is the
     read-only APPROVED badge (a GET off approved_map, showing a decision already taken). */
  .twa{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .twa-ok{font:700 10.5px ui-monospace,monospace;color:var(--grn);white-space:nowrap}
.twa-no{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--mut,#8A8A93);border:1px solid var(--line,#2A2A31)}
.twa-via{display:block;font-size:10px;color:var(--mut,#8A8A93);margin-top:2px}
.twa-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.twa-btn{font:inherit;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:4px 9px;border-radius:5px;cursor:pointer;border:1px solid var(--line,#2A2A31);background:transparent}
.twa-approve{color:var(--grn,#2FD48B);border-color:var(--grn,#2FD48B)}
.twa-dismiss{color:var(--mut,#8A8A93)}
/* cc#1760: the approval window — a disabled APPROVE keeps its place and its colour at reduced
   strength; the header note states the rule and the server's clock beside the subline. */
.twa-approve[disabled]{opacity:.42;cursor:not-allowed}
.tw-win{display:inline-block;margin-top:6px;font:600 11px var(--f-m,ui-monospace,monospace);letter-spacing:.02em;padding:3px 9px;border-radius:6px;border:1px solid var(--line2,#2a3350);color:var(--mut,#8A8A93)}
.tw-win.open{color:var(--grn,#2FD48B);border-color:var(--grn,#2FD48B)}
.twa-btn:disabled{opacity:.5;cursor:default}
.twa-msg{font-size:10px;color:var(--mut,#8A8A93)}
  @media(max-width:760px){
    .wrap{padding:12px 10px 64px}
    thead th,tbody td{padding:7px 6px;font-size:12px}
  }
</style>
</head>
<body>

<!-- cc#1277 scope 1-2: the nav placeholder was INSIDE .wrap{max-width:1240px;padding:16px}, the
     only page reviewed this session that boxed it. pwa.js's .scorr-cnav gives every link
     flex-shrink:1 with nowrap text, so in a 1208px box the items compress and their text paints
     over the neighbour ("Adaptive DashboardOMax", "Fable Roon"). Every working page ships the
     placeholder directly under <body> at full viewport width — matched here, nothing invented. -->
<div id="scorr-nav"></div>
<div class="wrap">
  <div class="hd-row">
    <h1>Wall of Trades</h1>
    <!-- cc#1733: the (i) opens the shared ScorrInfoSheet (cc#1697/cc#1708 shell) with universe /
         entry / exit per engine from /api/tradewall/engine-rules -- every cell read from config,
         plus the cc#1295 other-engines list as its last section. openOther() stays as the
         fallback when the shared sheet is not on the page. -->
    <button class="ibtn" onclick="openWallInfo()" title="Universe, entry and exit rules per engine">i</button>
  </div>
  <!-- cc#1587: subline is set by JS per mode — approved-only (default) or the engine hierarchy
       when app_config.wot_buckets_enabled is widened. The engines text lives in SUB_ENGINES. -->
  <div class="sub" id="subline">Approved trades only. This page computes nothing of its own —
    it renders <b>/api/tradewall</b>, the same endpoint the app reads.</div>

  <!-- cc#1691 (founder 04-Sep screenshot: "show filter box intuitively in 2 rows not take 4"):
       the four level containers below are UNCHANGED — same ids, same classes, so render()'s
       .innerHTML assignments (statusTabsHtml/instrumentTabsHtml/bucketTabsHtml/stateTabsHtml)
       and every chip's onclick/state key are byte-identical to before. Only the wrapper markup
       around them changed, from four stacked full-width divs to two grouped rows: row 1 =
       BOOK (status) + INSTRUMENT, row 2 = ENGINE (bucket) + STATUS (approval state), a labelled
       .tw-fgrp pair per row separated by a thin .tw-fsep rule. -->
  <div class="tw-frow">
    <div class="tw-fgrp"><span class="tw-flbl">Book</span>
      <!-- level 1: status -->
      <div class="tabs lvl1" id="tabsStatus"></div>
    </div>
    <span class="tw-fsep"></span>
    <div class="tw-fgrp"><span class="tw-flbl">Instrument</span>
      <!-- level 2: instrument -->
      <div class="tabs" id="tabsInstrument"></div>
    </div>
  </div>
  <div class="tw-frow">
    <div class="tw-fgrp"><span class="tw-flbl">Engine</span>
      <!-- level 3: engine bucket -->
      <div class="tabs lvl3" id="tabsBucket"></div>
    </div>
    <span class="tw-fsep"></span>
    <div class="tw-fgrp"><span class="tw-flbl">Status</span>
      <!-- cc#1609: level 4, open rows only — approval state -->
      <div class="tabs lvl3" id="tabsState"></div>
    </div>
  </div>

  <div class="card">
    <div class="meta" id="meta">Loading…</div>
    <div class="tw-csum" id="closedSummary" hidden></div>   <!-- cc#1734: Closed book summary line -->
    <div class="scroll"><table id="tbl">
      <thead id="thead"></thead>
      <tbody id="body"></tbody>
    </table></div>
    <div class="tw-more" id="more"></div>
  </div>
</div>

<div class="ov" id="otherOv" onclick="if(event.target===this)closeOther()">
  <div class="ov-box">
    <h2>Other engines</h2>
    <div class="s">Engines with a real trade book that are not one of the 5 primary buckets above.</div>
    <div id="otherBody">Loading…</div>
    <button class="tw-btn ov-close" onclick="closeOther()">Close</button>
  </div>
</div>

<script src="/scorr_card_common.js"></script>
<script>
/* cc#991/cc#1295 — the WEB renderer of the Wall of Trades.

   ONE COMPUTATION, TWO RENDERERS. The app screen (/m/trades) and this page both read
   /api/tradewall. Nothing about a trade is derived here; the union, the engine labels, the
   instrument classes, side mapping and the timestamp handling all live in trade_wall_endpoints.py.

   cc#1295 (founder direct 24-Aug, session_log 30420 WALL_OF_TRADES_GROUPS_V2): the wall moved
   from four flat groups + an Entry/Exit event toggle to a three-level hierarchy — STATUS (Open |
   Closed, default Open) -> INSTRUMENT (Futures | Equity) -> tagged ENGINE BUCKETS. Every row now
   represents one POSITION (entry+exit together when closed), not a flat entry/exit event, so a
   Closed row always carries its realised P&L in the same row as its entry.

   THE DAY-PRECISION HONESTY RULE CARRIES OVER: a day-precision event (quant baskets, investment
   scanner — DATE columns with no time) prints its date only, never a fabricated clock time. */
var BUCKETS = {
  FUTURES: ['V8', 'TC Scanner', 'Index Intel'],
  EQUITY: ['QB Basket', 'Investment Scanner', 'Screeners'],   /* cc#1733: third equity source */
};
var STATE = { events: [], counts: {}, statusCounts: {}, byEngine: {}, total: null,
              status: 'open', instrument: 'FUTURES', bucket: 'V8',
              /* cc#1587 WOT_APPROVED_ONLY_V1: 'approved' = the flat approved-trades list (the
                 default, app_config wot_buckets_enabled = ["approved_alerts"]); 'engines' = the
                 three-level engine hierarchy above, used only when the flag names other buckets.
                 The mode is read from the API response, never assumed, so widening the flag
                 brings the old wall back with no deploy. */
              mode: 'approved', approvedAsOf: null,
              /* cc#1760: the approval window as the SERVER states it (payload approval_window, refreshed
                 from /api/alerts/approval_window every minute) — the APPROVE button reads this, never a
                 client clock. null until the first payload = treated as closed, so a button is never
                 enabled on a guess. */
              approvalWindow: null,
              /* cc#1609: engine 'ALL' = every engine of the instrument; stateFilter over open rows */
              stateFilter: 'pending-approval', approvalCounts: null,
              /* cc#1735: the Approved tab's own payload */
              approvedRows: [], approvedCount: null, approvedTabAsOf: null, approvedNote: null };
var PAGE  = { cursor: null, more: true, busy: false };
var LIMIT = 100;

function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function inr(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '';
  var x = Number(v);
  return (x < 0 ? '−' : '') + '₹' + Math.abs(Math.round(x)).toLocaleString('en-IN');
}
function pctFmt(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '';
  var x = Number(v);
  return (x >= 0 ? '+' : '') + x.toFixed(2) + '%';
}
function px(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '--';
  var x = Number(v);
  return x < 100 ? x.toFixed(2) : Math.round(x).toLocaleString('en-IN');
}
function qty(v){
  if (v === null || v === undefined || isNaN(Number(v))) return '';
  return Math.round(Number(v)).toLocaleString('en-IN');
}
function sideCls(s){ return s === 'SHORT' ? 'short' : 'long'; }

/* cc#1295 verify 5: Closed rows always show realised P&L — pnl (rupees) when the engine sizes
   positions, else pnl_pct (percent) for a signal-only engine like TC Scanner / Investment
   Scanner. Never both blank on a genuinely closed row with real prices; an em-dash only appears
   when the source data itself is incomplete (never fabricated). */
/* cc#1763 rule: EQUITY rows (QB Basket, Investment Scanner, Screeners) are PERCENT ONLY in both
   P&L columns, even where the engine served a rupee (the baskets run different capital bases —
   Rs 5L quant, Rs 1L model portfolio — so a rupee is not comparable across the equity book). The
   API still serves pnl; this surface does not print it for equity. */
function isEquity(e){ return e.instrument === 'EQUITY'; }
function pnlCell(e){
  if (isEquity(e)){
    if (e.pnl_pct !== null && e.pnl_pct !== undefined)
      return '<td class="num ' + (Number(e.pnl_pct) >= 0 ? 'pos' : 'neg') + '" title="equity: percent only, on price alone (cc#1763)">' + pctFmt(e.pnl_pct) + '</td>';
    return '<td class="num">--</td>';
  }
  if (e.pnl !== null && e.pnl !== undefined){
    var cls = Number(e.pnl) >= 0 ? 'pos' : 'neg';
    /* cc#1762: an open row's rupee is INDICATIVE (engine entry -> CMP as of); the hover says so */
    var ttl = e.pnl_basis === 'indicative'
      ? ' title="' + esc('indicative: engine entry ' + px2(e.entry_price) + (e.entry && e.entry.when_full ? ' on ' + e.entry.when_full : '')
          + ' -> CMP' + (e.cmp != null ? ' ' + px2(e.cmp) : '') + (e.cmp_ts ? ' as of ' + e.cmp_ts + ' IST' : '') + ' x ' + (e.qty != null ? e.qty : '?')) + '"'
      : '';
    /* cc#1763: a TC Scanner rupee is ONE LOT (qty = futures_universe.lot_size) — the percent rides
       beside it, since lot sizes differ by symbol and percent is the only like-for-like sense */
    if (e.pnl_basis === 'one-lot'){
      ttl = ' title="' + esc('one lot of ' + (e.qty != null ? qty(e.qty) : '?') + ' (futures_universe.lot_size) x price move; display only, the engine exits on percent'
        + (e.cmp != null ? ' · CMP ' + px2(e.cmp) : '') + (e.cmp_ts ? ' as of ' + e.cmp_ts + ' IST' : '')) + '"';
      return '<td class="num ' + cls + '"' + ttl + '>' + inr(e.pnl)
        + '<span class="tw-cmp-lbl">' + (e.pnl_pct != null ? pctFmt(e.pnl_pct) + ' · ' : '') + '1 lot</span></td>';
    }
    return '<td class="num ' + cls + '"' + ttl + '>' + inr(e.pnl) + '</td>';
  }
  /* cc#1763 item 5: no lot_size for the symbol -> the rupee is BLANK; the percent still prints,
     LABELLED, so a percent never sits in the rupee column pretending to be one */
  if (e.pnl_basis === 'no-lot' && e.pnl_pct !== null && e.pnl_pct !== undefined)
    return '<td class="num ' + (Number(e.pnl_pct) >= 0 ? 'pos' : 'neg') + '" title="no lot size in futures_universe for ' + esc(e.symbol) + ' — rupees blank, percent on price alone">'
      + pctFmt(e.pnl_pct) + '<span class="tw-cmp-lbl">no lot size · %</span></td>';
  /* cc#1762 item 5: a V8 row whose symbol has no CMP is BLANK — never entry price standing in
     for CMP (that renders a false 0.00), never a stale mark carried forward unsaid. */
  if (e.pnl_basis === 'no-cmp') return '<td class="num tw-nocmp" title="no CMP for ' + esc(e.symbol) + ' — both P&L cells blank"></td>';
  if (e.pnl_pct !== null && e.pnl_pct !== undefined){
    var cls2 = Number(e.pnl_pct) >= 0 ? 'pos' : 'neg';
    return '<td class="num ' + cls2 + '">' + pctFmt(e.pnl_pct) + '</td>';
  }
  return '<td class="num">--</td>';
}

/* cc#1734: the two Closed-book P&L cells. Rupees ONLY when the engine served pnl; percent when it
   served pnl_pct, else — for a rupee row whose entry and exit prices are both present — computed
   from those prices and LABELLED computed. A blank is honest; a converted number would not be. */
function rsCell(e){
  if (e.pnl === null || e.pnl === undefined) return '<td class="num"></td>';
  if (isEquity(e)) return '<td class="num" title="equity: percent only (cc#1763) — see the P&L % column"></td>';
  /* cc#1763: a TC Scanner closed row's rupee is ONE LOT (futures_universe.lot_size), said so */
  var lot = e.qty_basis === 'one-lot' ? '<span class="tw-cmp-lbl">1 lot' + (e.qty != null ? ' of ' + qty(e.qty) : '') + '</span>' : '';
  return '<td class="num ' + (Number(e.pnl) >= 0 ? 'pos' : 'neg') + '"' + (lot ? ' title="one lot x price move, display only"' : '') + '>' + inr(e.pnl) + lot + '</td>';
}
function pctCell(e){
  if (e.pnl_pct !== null && e.pnl_pct !== undefined)
    return '<td class="num ' + (Number(e.pnl_pct) >= 0 ? 'pos' : 'neg') + '">' + pctFmt(e.pnl_pct) + '</td>';
  if (e.pnl !== null && e.pnl !== undefined && e.entry_price && e.exit_price){
    var p = (Number(e.exit_price) - Number(e.entry_price)) / Number(e.entry_price) * 100 * (e.side === 'SHORT' ? -1 : 1);
    return '<td class="num ' + (p >= 0 ? 'pos' : 'neg') + '" title="computed from entry and exit price, not served by the engine">'
      + pctFmt(Math.round(p * 100) / 100) + '<span class="tw-computed">computed</span></td>';
  }
  return '<td class="num"></td>';
}
/* cc#1734 scope 3: DETAIL decode — the map is SERVED (d.decode: engine close words + the shared
   basket label map); a code missing from it prints raw, the raw codes stay on hover. */
function decodeResult(code){
  if (!code) return '';
  var m = (STATE.decode || {}).exit_reasons || {};
  if (m[code]) return m[code];
  var i = String(code).indexOf(' (');
  if (i > 0 && m[String(code).slice(0, i)]) return m[String(code).slice(0, i)] + String(code).slice(i);
  return String(code);

function loadMore(){

  document.getElementById('more').innerHTML = moreHtml();
  fetchWithTimeout(url(PAGE.cursor))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      PAGE.cursor = d.next_cursor || null;
      PAGE.more   = !!(d.has_more && d.next_cursor);
      var seen = {};
      STATE.events.forEach(function(e){ seen[e.id] = 1; });
      var fresh = (d.events || []).filter(function(e){ return !seen[e.id]; });
      STATE.events = STATE.events.concat(fresh);
      PAGE.busy = false;
      render();
    })
    .catch(function(e){
      PAGE.busy = false;
      document.getElementById('more').innerHTML =
        'Could not load more · <button class="tw-btn" onclick="loadMore()">Retry</button>';
    });

function pickStatus(k){

/* cc#1761 (founder 06-Sep "when click Future / Equity in Wall of Trades always keep default All"):

   row carried over, which landed the founder on "No open positions for QB Basket in state

function pickInstrument(k){

function pickBucket(eng){
  if (eng === STATE.bucket) return;

  STATE.bucket = eng;

function boot(keepCounts){
  if (STATE.status === 'approved' && STATE.mode !== 'approved') return bootApprovedTab();   /* cc#1735 */
  fetchWithTimeout(url(null))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      if (d.approval_window) STATE.approvalWindow = d.approval_window;   /* cc#1760 */
      /* cc#1587: the server says which buckets are on. Approved-only = the flat list; anything
         wider = the engine hierarchy. The first fetch is always approved-shaped (ALL/ALL); if the
         flag turns out to be wider, switch mode and refetch with the hierarchy's own scope. */
      var be = d.buckets_enabled || [];
      var approvedOnly = be.length === 1 && be[0] === 'approved_alerts';
      if (STATE.mode === 'approved' && !approvedOnly){
        STATE.mode = 'engines'; STATE.events = [];
        PAGE.cursor = null; PAGE.more = true; PAGE.busy = false;
        return boot(false);
      }
      STATE.approvedAsOf = d.approved_as_of || null;
      STATE.cmpAsOf = d.cmp_as_of || null;            /* cc#1762: newest V8 mark, stated in the meta line */
      if (d.pnl_basis) STATE.pnlBasis = d.pnl_basis;  /* cc#1762: the two bases, in the API's words */
      if (d.v8_open_book) STATE.v8OpenBook = d.v8_open_book;
      STATE.tcOpenBook = d.tc_open_book || null;         /* cc#1763: whole TC open book at one lot */
      if (d.approval_counts) STATE.approvalCounts = d.approval_counts;
      STATE.events = d.events || [];
      if (!keepCounts || STATE.total == null){
        STATE.counts = d.counts || {};
        STATE.statusCounts = d.status_counts || {};
        STATE.total  = d.total;
      }
      STATE.byEngine = d.by_engine || {};
      if (d.closed_summary) STATE.closedSummary = d.closed_summary;   /* cc#1734 */
      if (d.decode) STATE.decode = d.decode;                            /* cc#1734 */
      STATE.asOf  = d.as_of;
      PAGE.cursor = d.next_cursor || null;
      PAGE.more   = !!(d.has_more && d.next_cursor);
      render();
      if (STATE.mode !== 'approved') twLoadApproved();   /* cc#1525 scope 4: paint APPROVED before the user touches anything */
    })
    .catch(function(e){
      document.getElementById('meta').textContent = 'Could not load the wall — ' + e.message;
      document.getElementById('body').innerHTML =
        '<tr><td colspan="' + (STATE.mode === 'approved' ? 6 : 9) + '" class="empty">Could not load the wall.</td></tr>';
      document.getElementById('more').innerHTML = '';
    });
}

/* cc#1295: the i-button — engines with a real book that are not one of the 5 primary buckets
   (QSR today, any future minor engine the same way). Loaded lazily on first open, not on boot. */
var OTHER_LOADED = false;
function openOther(){
  document.getElementById('otherOv').classList.add('open');
  if (OTHER_LOADED) return;
  fetchWithTimeout('/api/tradewall/other-engines')
    .then(function(r){ return r.json(); })
    .then(function(d){
      OTHER_LOADED = true;
      var list = d.engines || [];
      document.getElementById('otherBody').innerHTML = list.length
        ? list.map(function(e){
            return '<div class="ov-row"><span>' + esc(e.name) + '</span>'
              + '<span>' + e.open + ' open &middot; ' + e.closed + ' closed</span></div>';
          }).join('')
        : '<div class="empty">No other engines with a trade book right now.</div>';
    })
    .catch(function(e){
      document.getElementById('otherBody').innerHTML =
        '<div class="empty">Could not load — ' + esc(e.message) + '</div>';
    });
}
function closeOther(){ document.getElementById('otherOv').classList.remove('open'); }

/* ══ cc#1735: APPROVED TAB — the approved book with Entry level, editable Target / Stop loss and a
   Close action. Reads /api/tradewall/approved; writes go to /api/tradewall/approved/levels and
   /close (trade_wall_approved.py, sidecar table, never an ALTER on trade_alerts). Entry level is
   the approved price at the approval timestamp — the header says so. CMP/P&L blank when the
   resolver has no price; never carried forward, never zeroed. ═══════════════════════════════ */
/* cc#1735: prices on this tab keep 2 decimals — an approved_price of 3550.50 must not print as
   3,551, since the founder sets levels against the exact number. */
function px2(v){ if (v == null || v === '') return ''; var n = Number(v); if (!isFinite(n)) return ''; return n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function bootApprovedTab(){
  fetchWithTimeout('/api/tradewall/approved')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.error) throw new Error(d.error);
      STATE.approvedRows = d.rows || [];
      STATE.approvedCount = d.count;
      STATE.approvedTabAsOf = d.as_of || null;
      STATE.approvedNote = d.entry_level_note || null;
      STATE.approvedOpen = d.open_count; STATE.approvedClosed = d.closed_count;
      render();
    })
    .catch(function(e){
      document.getElementById('meta').textContent = 'Could not load the approved book — ' + e.message;
      document.getElementById('body').innerHTML = '<tr><td colspan="10" class="empty">Could not load the approved book.</td></tr>';
      document.getElementById('more').innerHTML = '';
    });
}
function approvedTabTheadHtml(){
  return '<tr><th>Symbol</th><th>Side</th><th>Engine</th><th>Approved at (IST)</th><th class="num">Entry level</th>'
    + '<th class="num">CMP</th><th class="num">Target</th><th class="num">Stop loss</th><th class="num">P&amp;L</th><th>Close</th></tr>';
}
function lvlInput(r, key){
  var v = r[key];
  return '<input class="tw-lvl" type="number" step="0.05" min="0" inputmode="decimal" data-id="' + r.id + '" data-k="' + key + '"'
    + ' data-orig="' + (v == null ? '' : v) + '" value="' + (v == null ? '' : v) + '" placeholder="set"'
    + ' onblur="saveLevel(this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}">'
    + '<span class="tw-saved" id="lvlmsg-' + r.id + '-' + key + '"></span>';
}
function approvedTabRowsHtml(list){
  return list.map(function(r){
    var pnlCls = r.pnl == null ? '' : (r.pnl > 0 ? 'pos' : (r.pnl < 0 ? 'neg' : ''));
    var pnlTxt = r.pnl == null ? '' : (px2(r.pnl) + (r.pnl_pct == null ? '' : ' (' + (r.pnl_pct > 0 ? '+' : '') + r.pnl_pct.toFixed(2) + '%)'));
    var cmpCell = r.closed
      ? '<td class="num tw-tag">closed</td>'
      : '<td class="num">' + (r.cmp == null ? '' : px2(r.cmp))
        + (r.cmp == null ? '<span class="tw-cmp-lbl">no price</span>'
           : '<span class="tw-cmp-lbl">' + esc(r.cmp_label || '') + (r.cmp_date ? ' ' + esc(r.cmp_date) : '') + '</span>') + '</td>';
    var tgt = r.closed ? '<td class="num">' + (r.target_price == null ? '—' : px2(r.target_price)) + '</td>' : '<td class="num">' + lvlInput(r, 'target_price') + '</td>';
    var sl  = r.closed ? '<td class="num">' + (r.stop_loss == null ? '—' : px2(r.stop_loss)) + '</td>' : '<td class="num">' + lvlInput(r, 'stop_loss') + '</td>';
    var closeCell = r.closed
      ? '<td class="tw-tag">closed ' + esc(r.closed_at || '') + ' @ ' + px2(r.close_price) + (r.close_reason ? ' · ' + esc(r.close_reason) : '') + '</td>'
      : '<td><button class="tw-close-btn" onclick="closeApproved(' + r.id + ')">Close</button></td>';
    return '<tr' + (r.closed ? ' class="tw-closed"' : '') + ' id="aprow-' + r.id + '">'
      + '<td class="sym">' + esc(r.symbol) + '</td>'
      + '<td class="' + sideCls(r.side) + '">' + esc(r.side) + '</td>'
      + '<td>' + esc(r.engine) + '</td>'
      + '<td class="tw-tag">' + esc(r.approved_at || '--') + (r.approved_via ? '<span class="tw-cmp-lbl">' + esc(r.approved_via) + '</span>' : '') + '</td>'
      + '<td class="num">' + px2(r.entry_level) + '</td>'
      + cmpCell + tgt + sl
      + '<td class="num ' + pnlCls + '">' + pnlTxt + (r.pnl_basis === 'realised' ? '<span class="tw-cmp-lbl">realised</span>' : '')
        /* cc#1762: what the rupee is multiplied by — position qty for a V8-linked alert, else per share */
        + (r.pnl == null ? '' : '<span class="tw-cmp-lbl">' + (r.qty != null ? 'x ' + esc(String(r.qty)) + ' qty' : 'per share') + '</span>') + '</td>'
      + closeCell
      + '</tr>';
  }).join('');
}
function renderApprovedTab(){
  setSubline();
  document.getElementById('tabsStatus').innerHTML = statusTabsHtml();
  document.getElementById('tabsInstrument').innerHTML = '';
  document.getElementById('tabsBucket').innerHTML = '';
  document.getElementById('tabsState').innerHTML = '';
  document.getElementById('thead').innerHTML = approvedTabTheadHtml();
  var rows = STATE.approvedRows || [];
  document.getElementById('meta').textContent =
    (STATE.approvedOpen == null ? rows.length : STATE.approvedOpen) + ' approved open · ' + (STATE.approvedClosed || 0) + ' closed'
    + ' · Entry level = the approved price at that timestamp (never the trigger, never a later price)'
    + (STATE.approvedTabAsOf ? ' · CMP as of ' + STATE.approvedTabAsOf + ' IST (label per row)' : '');
  document.getElementById('body').innerHTML = rows.length
    ? approvedTabRowsHtml(rows)
    : '<tr><td colspan="10" class="empty">No approved positions yet. Approve a signal on the Open tab or on /alerts.</td></tr>';
  document.getElementById('more').innerHTML = '';
}
function postJson(u, body){
  return fetch(u, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ j._status = r.status; return j; }); });
}
function saveLevel(el){
  var id = el.getAttribute('data-id'), k = el.getAttribute('data-k');
  var raw = String(el.value || '').trim(), orig = String(el.getAttribute('data-orig') || '');
  var msg = document.getElementById('lvlmsg-' + id + '-' + k);
  if (raw === orig) return;                         /* nothing changed */
  if (raw !== '' && !(parseFloat(raw) > 0)){ if (msg){ msg.textContent = 'positive number'; msg.className = 'tw-saved err'; } return; }
  var body = { alert_id: parseInt(id, 10), via: 'web-wall' }; body[k] = raw === '' ? null : parseFloat(raw);
  el.classList.add('saving'); if (msg){ msg.textContent = 'saving…'; msg.className = 'tw-saved'; }
  postJson('/api/tradewall/approved/levels', body).then(function(j){
    el.classList.remove('saving');
    if (j.error){ if (msg){ msg.textContent = j.error; msg.className = 'tw-saved err'; } return; }
    var saved = (j.levels || {})[k];
    el.value = saved == null ? '' : saved; el.setAttribute('data-orig', saved == null ? '' : saved);
    var w = (j.warnings || []).filter(function(x){ return x.indexOf(k === 'stop_loss' ? 'stop loss' : 'target') === 0; });
    if (msg){
      msg.textContent = (saved == null ? 'cleared' : 'saved ' + saved) + (j.levels && j.levels.updated_at ? ' · ' + j.levels.updated_at : '') + (w.length ? ' · ' + w[0] : '');
      msg.className = 'tw-saved' + (w.length ? ' warn' : '');
    }
    /* keep the row's P&L honest without a full reload: levels do not change P&L, so nothing else moves */
    var row = (STATE.approvedRows || []).filter(function(r){ return String(r.id) === String(id); })[0];
    if (row) row[k] = saved;
  }).catch(function(e){ el.classList.remove('saving'); if (msg){ msg.textContent = 'failed — ' + e.message; msg.className = 'tw-saved err'; } });
}
function closeApproved(id){
  var row = (STATE.approvedRows || []).filter(function(r){ return String(r.id) === String(id); })[0];
  if (!row) return;
  var def = row.cmp == null ? '' : String(row.cmp);
  var p = window.prompt('Close ' + row.symbol + ' (' + row.side + ', entry ' + row.entry_level + ').\n'
    + 'Close price — defaults to the current CMP but EDIT it to the price you actually exited at:', def);
  if (p === null) return;
  var price = parseFloat(String(p).trim());
  if (!(price > 0)){ window.alert('Close price must be a positive number. Nothing recorded.'); return; }
  var reason = window.prompt('Close reason (optional — target hit / stop hit / discretionary / other):', '');
  if (reason === null) return;
  postJson('/api/tradewall/approved/close', { alert_id: row.id, close_price: price, close_reason: reason, via: 'web-wall' })
    .then(function(j){
      if (j.error){ window.alert('Not recorded — ' + j.error); if (j._status === 409) bootApprovedTab(); return; }
      bootApprovedTab();   /* re-read: closed row greys out with close price, time and realised P&L */
    })
    .catch(function(e){ window.alert('Close failed — ' + e.message); });
}

/* cc#1733: the engine-rules (i) sheet. One table, one row per engine unit (basket / screen /
   index), five columns; the epochs on one line at the top so a reader knows why older signals
   are not listed; the cc#1295 other-engines list kept as the last section. Payload is served,
   never typed here -- a cell that reads "not specified in config" is the API saying so. */
function openWallInfo(){
  if (!window.ScorrInfoSheet){ openOther(); return; }
  ScorrInfoSheet.open('Wall of Trades · engine rules', '<div class="empty">Loading…</div>');
  Promise.all([
    fetchWithTimeout('/api/tradewall/engine-rules').then(function(r){ return r.json(); }),
    fetchWithTimeout('/api/tradewall/other-engines').then(function(r){ return r.json(); }).catch(function(){ return {engines: []}; })
  ]).then(function(res){
    var d = res[0] || {}, o = res[1] || {};
    var top = '<b>Wall epoch</b> ' + esc(d.wall_epoch || '--') + ' · <b>Equity fresh-signals epoch</b> '
      + esc(d.equity_epoch || '--') + ' (' + esc(d.equity_epoch_source || '') + ') — QB Basket, Investment Scanner and Screeners '
      + 'rows entered before that date are not listed; futures buckets are gated by the wall epoch only.';
    var rows = d.engines || [];
    var tbl = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:11.5px">'
      + '<thead><tr>' + ['Engine','Instrument','Universe','Entry rule','Exit rule'].map(function(c){
          return '<th style="text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap">' + c + '</th>'; }).join('')
      + '</tr></thead><tbody>'
      + rows.map(function(r){
          var eng = esc(r.engine) + (r.sub ? ' <span style="color:var(--mut)">· ' + esc(r.sub) + '</span>' : '');
          return '<tr>'
            + '<td style="padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top" title="' + esc(r.source || '') + '">' + eng + '</td>'
            + '<td style="padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top">' + esc(r.instrument || '') + '</td>'
            + '<td style="padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top">' + esc(r.universe || '') + '</td>'
            + '<td style="padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top">' + esc(r.entry || '') + '</td>'
            + '<td style="padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top">' + esc(r.exit || '') + '</td>'
            + '</tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<div class="isheet-hon">Source per row on hover. "' + esc(d.not_in_config_marker || 'not specified in config')
      + '" = no machine-readable rule; the source names where the behaviour lives.</div>';
    var others = (o.engines || []);
    var otherHtml = others.length
      ? others.map(function(e){ return '<div class="ov-row"><span>' + esc(e.name) + '</span><span>' + e.open + ' open · ' + e.closed + ' closed</span></div>'; }).join('')
      : 'No other engines with a trade book right now.';
    ScorrInfoSheet.setBody(
      ScorrInfoSheet.section('Scope', top)
      + ScorrInfoSheet.section('Engines on the wall (' + rows.length + ')', tbl)
      + ScorrInfoSheet.section('Other engines not on the wall', otherHtml));
  }).catch(function(e){
    ScorrInfoSheet.setBody('<div class="empty">Could not load — ' + esc(e.message) + '</div>');
  });
}
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeOther();
});

/* ══ cc#1525 put Approve + Alert clusters on open engine-signal rows; cc#1537 (founder explicit,
   31-Aug: "wall of trade purely display, on alert tab for approve") REMOVED them. The wall
   writes NOTHING — approval and alert creation live only on /alerts (cc#1536) and /m/alerts.
   What survives is the read-only APPROVED badge: /api/alerts/approved_map is a GET, and showing
   a decision already taken is exactly what a display-only wall should do. source_ref stays
   symbol + '@' + entry.ts AS SERVED — the one key every approve surface writes, so the badge
   matches wherever the founder clicked. */
var TWA = { approved: {} };

function twRef(e){ return e.symbol + '@' + ((e.entry && e.entry.ts) || ''); }
function twStampFull(sIn){ var t = String(sIn || ''); return t.length >= 16 ? t.slice(0, 16) : t; }
function twStampTime(sIn){
  try {
    var d = new Date(String(sIn).replace(' ', 'T'));
    if (!isNaN(d)) return d.toLocaleTimeString('en-IN',
      { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
  } catch (_e) {}
  return String(sIn || '').slice(11, 16);
}
/* cc#1609 WOT_APPROVAL_SURFACE_V1: the wall is the approval surface. Each open engine row reads
   its state from the API (state + approval, joined server-side from trade_alerts) and shows
   APPROVE / DISMISS while pending, or the decision taken. The approved_map paint stays as a
   fallback for a payload without `state`. */
function twDirection(e){ return e.side === 'SHORT' ? 'SELL' : 'BUY'; }
function twCell(e){
  if (STATE.status !== 'open') return '';
  if (e.src === 'alert') return '<td></td>';   /* an approval row IS the approval record */
  var st = e.state, ap = e.approval;
  if (!st){
    var mapHit = (TWA.approved[e.engine] || {})[twRef(e)];
    if (mapHit){ st = 'approved'; ap = mapHit; } else st = 'pending-approval';
  }
  if (st === 'approved'){
    return '<td><div class="twa"><span class="twa-ok">APPROVED'
      + (ap && ap.approved_price != null ? ' @ ' + px(ap.approved_price) : '')
      + (ap && ap.approved_at ? ' · ' + twStampTime(ap.approved_at) : '') + '</span>'
      + (ap && ap.approved_via ? '<span class="twa-via">via ' + esc(ap.approved_via) + '</span>' : '') + '</div></td>';
  }
  if (st === 'dismissed'){
    return '<td><div class="twa"><span class="twa-no">DISMISSED</span></div></td>';
  }
  var k = esc(e.id);
  /* cc#1736: a suppressed row keeps APPROVE / DISMISS (item 5) — the rule declutters, it does not disarm */
  var supp = st === 'suppressed-in-position' ? '<span class="tw-supp">suppressed · already in position</span>' : '';
  /* cc#1760 (founder 06-Sep "approve button ... enable between 9.15 to 15.15 during market hours
     only"): APPROVE is DISABLED, not hidden, outside the window the server states — a missing
     button looks broken, a disabled one with its reason teaches the rule. The reason rides on the
     title (hover / tap) and in the header note. DISMISS is never gated: it is housekeeping on a
     queue, not a position, and blocking it would leave stale signals stuck overnight. */
  var aw = STATE.approvalWindow, awOpen = !!(aw && aw.open);
  var awTitle = awOpen ? 'Approve at the live price' : ((aw && aw.reason) || 'Approvals open 09:15-15:15 IST on trading days · window state not loaded yet');
  return '<td><div class="twa twa-act" data-rowid="' + k + '">' + supp
    + '<button type="button" class="twa-btn twa-approve" data-act="approve" data-rowid="' + k + '"' + (awOpen ? '' : ' disabled aria-disabled="true"') + ' title="' + esc(awTitle) + '">APPROVE</button>'
    + '<button type="button" class="twa-btn twa-dismiss" data-act="dismiss" data-rowid="' + k + '" title="Dismiss — always available">DISMISS</button>'
    + '<span class="twa-msg" id="twa-msg-' + k + '"></span></div></td>';
}
function twFind(id){ for (var i = 0; i < STATE.events.length; i++) if (String(STATE.events[i].id) === String(id)) return STATE.events[i]; return null; }
function twAct(act, id, btn){
  var e = twFind(id); if (!e) return;
  var msg = document.getElementById('twa-msg-' + id);
  if (act === 'approve' && !(STATE.approvalWindow && STATE.approvalWindow.open)){
    /* cc#1760: belt and braces — the server refuses too (403 with the same reason) */
    if (msg) msg.textContent = 'not recorded: ' + ((STATE.approvalWindow && STATE.approvalWindow.reason) || 'approvals open 09:15-15:15 IST on trading days');
    return;
  }
  var wrap = btn && btn.parentNode; if (wrap) [].forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled = true; });
  if (msg) msg.textContent = act === 'approve' ? 'approving at live price…' : 'dismissing…';
  var body = { source_engine: e.engine, source_ref: twRef(e), symbol: e.symbol, direction: twDirection(e), kind: 'entry' };
  if (act === 'approve') body.approved_via = 'web-wall'; else body.dismissed_via = 'web-wall';
  fetchWithTimeout('/api/alerts/' + (act === 'approve' ? 'approve_signal' : 'dismiss_signal'),
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, status: r.status, d: d }; }); })
    .then(function(res){
      var d = res.d || {};
      if (!res.ok || d.error || !d.alert){
        var why = d.detail || d.error || ('HTTP ' + res.status);
        if (msg) msg.textContent = 'not recorded: ' + why;
        if (wrap) [].forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled = false; });
        return;
      }
      var a = d.alert;
      e.state = a.status;
      e.approval = { id: a.id, approved_price: a.approved_price, approved_at: a.approved_at, approved_via: a.approved_via, notes: a.notes };
      render();
    })
    .catch(function(err){
      if (msg) msg.textContent = 'not recorded: ' + (err && err.message ? err.message : 'network');
      if (wrap) [].forEach.call(wrap.querySelectorAll('button'), function(b){ b.disabled = false; });
    });
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest && ev.target.closest('.twa-btn'); if (!b) return;
  twAct(b.getAttribute('data-act'), b.getAttribute('data-rowid'), b);
});
function twLoadApproved(){
  if (STATE.status !== 'open') return;
  (BUCKETS[STATE.instrument] || []).forEach(function(eng){
    fetchWithTimeout('/api/alerts/approved_map?engine=' + encodeURIComponent(eng))
      .then(function(r){ return r.json(); })
      .then(function(d){ TWA.approved[eng] = d.map || {}; render(); })
      .catch(function(_e){ /* the map is a paint optimisation — a miss just means no stamps yet */ });
  });
}

boot(false);

/* ── cc#1760 · THE APPROVAL WINDOW ON THE PAGE ──────────────────────────────────────────────
   The state comes from the SERVER (payload approval_window = guards.approval_window: 09:15-15:15
   IST on an NSE trading day, holidays from nse_holidays), never from a browser clock or a weekday
   test, so the button and the POST that refuses outside the window agree by construction. This
   page does not poll, so the window is re-read every minute from /api/alerts/approval_window:
   a page opened at 15:10 disables APPROVE at 15:15 on its own, and one opened at 09:10 enables
   it at 09:15. A flip re-renders the rows; otherwise only the note's clock is refreshed. */
function twWindowNote(){
  var w = STATE.approvalWindow;
  if (!w) return '<div class="tw-win">Approve: window state not loaded yet — treated as closed</div>';
  var when = w.now_ist ? ' · server ' + esc(String(w.now_ist).slice(11, 16)) + ' IST' : '';
  return w.open
    ? '<div class="tw-win open">Approve open · closes ' + esc(w.closes || '15:15') + ' IST' + when + '</div>'
    : '<div class="tw-win">Approve disabled · ' + esc(w.reason || (w.rule || 'Approvals open 09:15-15:15 IST on trading days')) + '</div>';
}
function twRefreshWindow(){
  fetchWithTimeout('/api/alerts/approval_window')
    .then(function(r){ return r.json(); })
    .then(function(w){
      if (!w || typeof w.open !== 'boolean') return;
      var was = STATE.approvalWindow ? STATE.approvalWindow.open : null;
      STATE.approvalWindow = w;
      if (STATE.mode !== 'engines') return;
      if (was !== w.open) { render(); return; }
      var el = document.querySelector('.tw-win'); if (el) el.outerHTML = twWindowNote();
    })
    .catch(function(){ /* keep the last server-stated window; never guess it open */ });
}
setInterval(twRefreshWindow, 60000);
</script>
