<!-- ═══ 2. BODY RENDER — the three states live here (mobile/home.html) ═══ -->
<script type="text/plain" id="ref-render">
function renderHeroPositions(){
  var rec = POS.data[POS.sym] || {};
  var cmp = posCmp(POS.sym);
  var fut = rec.fut, opt = rec.opt;
  var futBadge = fut ? dirBadge(fut.side, fut.side === 'BUY' ? 'LONG' : 'SHORT') : '';
  var optBadge = opt ? dirBadge(opt.side, Math.round(Number(opt.opt_strike)) + ' ' + opt.opt_type
      + (opt.side === 'SELL' ? ' · wrt' : ' · bot')) : '';
  /* cc#1569 · EMPTY STATE PER SECTION. "Empty" is the exact condition posRangeBar()/posDecayBar()
     already treat as no-position (fut with no stop/target; opt absent) -- an OPT leg with a missing
     live premium is a real open position and keeps its own unavail line. An empty section renders
     ONE centred block (.legempty: muted section name above, message below) that fills that
     section's share of #heroPositionsBody (.legwrap.empty grows), with the .leghd heading left in
     flow above it. Sections WITH rows are byte-identical to before -- only the empty branch moved. */
  var futEmpty = !fut || fut.stop == null || fut.target == null;
  var optEmpty = !opt;
  var legEmpty = function(nm, msg){
    return '<div class="legempty"><span class="nm">' + nm + '</span><span class="msg">' + msg + '</span></div>';
  };
  var body = document.getElementById('heroPositionsBody');
  /* cc#1569 P3 · BOTH EMPTY collapses to ONE centred block: "No open <symbol> position" with a muted
     "Futures or options" line under it. The two section blocks and the divider are not rendered at
     all (divider hidden by absence, not by a style toggle). VIEW LOGS is outside this body and keeps
     its pinned place. Mixed (one leg open, one empty) never comes here -- it uses the P2 block. */
  /* cc#1569 P4 · the symbol word is the toggle's own LABEL (POS_SYMS: NIFTY50 -> "NIFTY"), not the
     internal key — the card must read "No open NIFTY position", the same word the pill shows. */
  var symLabel = (POS_SYMS.filter(function(s){ return s.key === POS.sym; })[0] || {}).label || POS.sym;
  if (body && futEmpty && optEmpty){
    body.innerHTML = posFeedAlertHtml(rec.feed_alert)
      + '<div class="posempty"><span class="msg">No open ' + esc(symLabel) + ' position</span>'
      + '<span class="sub">Futures or options</span></div>';
  } else if (body) body.innerHTML =
      posFeedAlertHtml(rec.feed_alert)
      + '<div class="legwrap' + (futEmpty ? ' empty' : '') + '"><div class="leghd"><span class="nm">FUTURES</span>' + futBadge + '</div>'
      + (futEmpty ? legEmpty('Futures', 'No open futures position') : posRangeBar(fut, cmp)) + '</div>'
      + '<div class="legdiv"></div>'
      + '<div class="legwrap' + (optEmpty ? ' empty' : '') + '"><div class="leghd"><span class="nm">OPTIONS</span>' + optBadge + '</div>'
      + (optEmpty ? legEmpty('Options', 'No open options position') : posDecayBar(opt)) + '</div>';
  var tg = document.getElementById('heroPositionsToggle');
  if (tg) tg.innerHTML = posToggleHtml();
  var btn = document.getElementById('heroPositionsBtn');
  /* cc#1403 · RESTORED (cc#1393 removed it with the button, now back as VIEW LOGS). cc#1386 scope
     item 5's own note still applies unchanged: the card does not say which leg the founder was
     last looking at, so VIEW LOGS opens on FUT — same default openV10()/the modal itself already
     carried before cc#1383 gave it an explicit-leg 3rd param. */
  /* cc#1480 (founder 30-Aug): VIEW LOGS opens the OPTIONS log only, switch hidden — was 'FUT'. */
  if (btn) btn.setAttribute('onclick', "openV10(event,'" + POS.sym + "','OPT',true)");
  /* cc#1382's lesson again: this swap can shrink the card (Loading -> a real, possibly shorter,
     range/decay layout; a symbol toggle to a leg with no open position -> a much shorter unavail
     block), and ResizeObserver does not fire on a shrink pinned at the old min-height -- explicit
     resync, rAF-wrapped so the write commits before syncHeroCardHeights measures. Re-levels ALL 4
     cards via cc#1382's generalized loop, not just this one -- confirmed in this task's own
     verification, not assumed from the function's name. */
  requestAnimationFrame(syncHeroCardHeights);
}
</script>
