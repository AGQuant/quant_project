<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVM Pillar Popout — R1</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1E; --panel:#0F1629; --card:#111A30; --border:#1E2A45;
  --g:#34D399; --v:#F59E0B; --m:#60A5FA;
  --red:#F87171; --text:#E5EAF5; --dim:#8B96AD;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;padding:40px;min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- Pillar boxes ---------- */
.pillars{display:flex;gap:16px;max-width:640px}
.pill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:18px 14px;text-align:center;cursor:pointer;position:relative;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.pill:hover{transform:translateY(-3px)}
.pill.g:hover{border-color:var(--g);box-shadow:0 0 18px rgba(52,211,153,.15)}
.pill.v:hover{border-color:var(--v);box-shadow:0 0 18px rgba(245,158,11,.15)}
.pill.m:hover{border-color:var(--m);box-shadow:0 0 18px rgba(96,165,250,.15)}
.pill .letter{font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
.pill.g .letter{color:var(--g)}.pill.v .letter{color:var(--v)}.pill.m .letter{color:var(--m)}
.pill .score{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600}
.pill.g .score{color:var(--g)}.pill.v .score{color:var(--v)}.pill.m .score{color:var(--m)}
.pill .label{font-size:11px;color:var(--dim);margin-top:4px}
.pill .expand{position:absolute;top:8px;right:10px;font-size:11px;color:var(--dim);opacity:0;transition:opacity .15s}
.pill:hover .expand{opacity:1}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,7,15,.72);backdrop-filter:blur(6px);
  display:none;align-items:flex-start;justify-content:center;padding:6vh 20px;z-index:100;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  max-width:1080px;width:100%;padding:0;animation:pop .18s ease;overflow:hidden}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;
  padding:18px 24px;border-bottom:1px solid var(--border)}
.mhead .title{display:flex;align-items:center;gap:12px}
.mhead .badge{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px}
.badge.g{background:rgba(52,211,153,.12);color:var(--g);border:1px solid rgba(52,211,153,.4)}
.badge.v{background:rgba(245,158,11,.12);color:var(--v);border:1px solid rgba(245,158,11,.4)}
.badge.m{background:rgba(96,165,250,.12);color:var(--m);border:1px solid rgba(96,165,250,.4)}
.mhead h2{font-size:15px;font-weight:600}
.mhead .sub{font-size:11px;color:var(--dim)}
.mhead .bigscore{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600}
.mhead .bigscore.g{color:var(--g)}.mhead .bigscore.v{color:var(--v)}.mhead .bigscore.m{color:var(--m)}
.close{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;
  width:32px;height:32px;cursor:pointer;font-size:16px;margin-left:18px}
.close:hover{color:var(--text);border-color:var(--dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:20px 24px 24px}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative}
.mcard .name{font-size:11.5px;font-weight:600;line-height:1.35;margin-bottom:6px;padding-right:36px}
.mcard .chip{position:absolute;top:10px;right:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
.mcard .val{font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:4px}
.mcard .peer{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
.sc-hi{border-color:rgba(52,211,153,.5)}.sc-hi .name,.sc-hi .chip{color:var(--g)}
.sc-mid{border-color:rgba(245,158,11,.5)}.sc-mid .name,.sc-mid .chip{color:var(--v)}
.sc-lo{border-color:rgba(248,113,113,.5)}.sc-lo .name,.sc-lo .chip{color:var(--red)}

@media (max-width:640px){
  body{padding:20px}
  .overlay{padding:0}
  .modal{border-radius:16px 16px 0 0;min-height:100vh;max-width:100%;align-self:flex-end;animation:slide .22s ease}
  @keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>

<p style="color:var(--dim);font-size:12px;margin-bottom:16px">R1 reference — click any pillar box. Existing inline detail sections remain unchanged below (not shown here).</p>

<div class="pillars">
  <div class="pill g" onclick="openModal('g')">
    <span class="expand">⤢</span>
    <div class="letter">G</div><div class="score">6.88</div><div class="label">Profitability</div>
  </div>
  <div class="pill v" onclick="openModal('v')">
    <span class="expand">⤢</span>
    <div class="letter">V</div><div class="score">6.25</div><div class="label">Valuation</div>
  </div>
  <div class="pill m" onclick="openModal('m')">
    <span class="expand">⤢</span>
    <div class="letter">M</div><div class="score">9.69</div><div class="label">Price returns</div>
  </div>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhead">
      <div class="title">
        <div class="badge" id="mbadge">G</div>
        <div><h2 id="mtitle">G — Growth</h2><div class="sub" id="msub">Profitability · 14 metrics</div></div>
      </div>
      <div style="display:flex;align-items:center">
        <div class="bigscore" id="mscore">6.88</div>
        <button class="close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="grid" id="mgrid"></div>
  </div>
</div>

<script>
const DATA = {
 g:{title:"G — Growth",sub:"Profitability · 14 metrics",score:"6.88",cls:"g",cards:[
  ["Sales 5Y CAGR","7.19%","peer 10.99%","#8/8","5.0","mid"],
  ["Sales 3Y CAGR","9.08%","peer 16.52%","#8/8","3.8","lo"],
  ["Profit 5Y CAGR","1.48%","peer 11.13%","#7/7","2.5","lo"],
  ["Profit 3Y CAGR","4.21%","peer 28.57%","#7/7","3.8","lo"],
  ["QoQ Sales Growth","29.10%","peer 25.57%","#4/8","8.8","hi"],
  ["QoQ Profit Growth","125.60%","peer 41.98%","#2/8","10.0","hi"],
  ["Operating Margin","27.08%","peer 21.00%","#3/8","10.0","hi"],
  ["OPM Expansion","60.63%","peer 30.09%","#2/8","8.8","hi"],
  ["Dividend Yield","0.12%","peer 0.12%","#4/8","5.0","mid"],
  ["Return on Capital (ROCE)","17.76%","peer 15.22%","#2/8","8.8","hi"],
  ["Interest Coverage","9.91x","peer 7.39x","#3/8","8.8","hi"],
  ["Institutional Holding (FII+DII)","16.53%","peer 15.01%","#1/8","7.5","hi"],
  ["Change in Net Instl (FII+DII)","0.43%","peer 0.10%","#1/8","7.5","hi"]
 ]},
 v:{title:"V — Value",sub:"Valuation · 8 metrics",score:"6.25",cls:"v",cards:[
  ["Valuation (PE)","79.42x","peer 34.99x","#7/7","2.5","lo"],
  ["Forward PE","67.80x","peer 30.40x","#7/7","3.8","lo"],
  ["Historical PE (5Y avg)","Expensive +137.2%","peer median 25.99x","#6/8","","mid"],
  ["Price / Book","18.31x","peer 4.56x","#8/8","3.8","lo"],
  ["EV / EBITDA","52.59x","peer 21.77x","#7/8","3.8","lo"],
  ["PEG Ratio","18.70x","peer 1.41x","#7/7","2.5","lo"],
  ["Annual Upside (FY27e)","17.00%","peer 16.00%","#4/8","8.8","hi"]
 ]},
 m:{title:"M — Momentum",sub:"Price returns · 8 metrics",score:"9.69",cls:"m",cards:[
  ["1M Return","+8.4%","peer +3.1%","#1/8","10.0","hi"],
  ["3M Return","+16.2%","peer +7.5%","#1/8","10.0","hi"],
  ["6M Return","+24.9%","peer +11.2%","#2/8","10.0","hi"],
  ["1Y Return","+41.7%","peer +18.4%","#1/8","10.0","hi"],
  ["vs 50 DMA","+5.2%","peer +1.9%","#2/8","8.8","hi"],
  ["vs 200 DMA","+18.6%","peer +8.3%","#1/8","10.0","hi"],
  ["Relative Strength (Nifty)","+22.1%","peer +9.0%","#1/8","10.0","hi"],
  ["52W High Distance","-2.4%","peer -8.7%","#2/8","8.8","hi"]
 ]}
};
function openModal(k){
  const d=DATA[k];
  document.getElementById('mbadge').textContent=k.toUpperCase();
  document.getElementById('mbadge').className='badge '+d.cls;
  document.getElementById('mtitle').textContent=d.title;
  document.getElementById('msub').textContent=d.sub;
  const s=document.getElementById('mscore');s.textContent=d.score;s.className='bigscore '+d.cls;
  document.getElementById('mgrid').innerHTML=d.cards.map(c=>
    `<div class="mcard sc-${c[5]}"><div class="name">${c[0]}</div>`+
    (c[4]?`<div class="chip">${c[4]}</div>`:'')+
    `<div class="val mono">${c[1]}</div><div class="peer"><span>${c[2]}</span><span>${c[3]}</span></div></div>`).join('');
  document.getElementById('ov').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('ov').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
</html>
