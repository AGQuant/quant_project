<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Scanner</title>
<style>
  /* cc#1286 — colours ride the injected token contract (cc#1203); this page declares shape
     only, like /trades and /intraday. Layout pattern: the TC Scanner tab's stat-tiles +
     tabbed table, rebuilt for the two-track board. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px;margin:0 auto;padding:16px 16px 64px}
  h1{font-size:19px;font-weight:800;margin:4px 0 2px}
  .sub{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .l{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
  .tile .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
  .tile .s{font-size:10px;color:var(--dim);margin-top:1px}
  .bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
       color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;min-height:38px}
  .tab.on{background:var(--blu);border-color:var(--blu);color:#fff}
  select,label.ck{font-size:11.5px;color:var(--mut)}
  select{padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt)}
  label.ck{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:0 4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .meta{font-size:11px;color:var(--dim);padding:12px 16px 0}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:7px 10px;font-size:10px;
           font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
           border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
  tbody tr:hover{background:var(--card2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .sym{font-weight:800}
  .score{font-weight:800;font-size:14px}
  .band{font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:5px;border:1px solid}
  .band.SB{color:var(--grn);background:var(--grn-d);border-color:var(--grn)}
  .band.AC{color:var(--blu);background:var(--blu-row,rgba(77,124,254,.12));border-color:var(--blu)}
  .band.WA{color:var(--amber);background:var(--amber-bg,rgba(255,159,69,.12));border-color:var(--amber)}
  .band.AV{color:var(--mut);border-color:var(--line2)}
  .tag{font-family:ui-monospace,monospace;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;
       margin-right:4px;display:inline-block;margin-bottom:2px}
  .tag.b{color:var(--pulse,#7A5CFF);background:rgba(122,92,255,.12);border:1px solid rgba(122,92,255,.4)}
  .tag.m{color:var(--grn);background:var(--grn-d);border:1px solid var(--grn)}
  .tag.g{color:var(--cyan,#22d3ee);background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.45)}
  .inpos{font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--grn);border:1px solid var(--grn);
         background:var(--grn-d);padding:2px 7px;border-radius:5px}
  .trig{font-size:10.5px}
  .trig b{font-weight:700}
  .trig .ok{color:var(--grn)} .trig .pend{color:var(--amber)} .trig .none{color:var(--mut)}
  .ih{font-size:10px;color:var(--amber);font-style:italic}
  .empty{padding:26px 8px;text-align:center;color:var(--mut);font-size:12.5px}
  .q{color:var(--dim);font-size:10.5px}
  /* cc#1297: Open/Closed Positions card, above the universe stat tiles per founder placement. */
  .pos{color:var(--grn)} .neg{color:var(--red)}
  #posCard{margin-bottom:14px}
  #posCard .bar{padding:12px 16px 0;margin-bottom:0}
  @media(max-width:760px){.wrap{padding:12px 10px 64px} thead th,tbody td{padding:7px 6px;font-size:12px}}

  /* cc#1697: title (i) button + rules sheet. h1 becomes a flex row so the button sits right after
     the title text. cc#1708: the .ibtn / .isheet-* styles and the overlay DOM moved into
     scorr_card_common.js (window.ScorrInfoSheet) so the Quant Basket cards share ONE sheet. */
  .h1row{display:flex;align-items:center;gap:8px}
  .h1row h1{margin:4px 0 2px}
</style>
</head>
<body>
<div id="scorr-nav"></div>
<div class="wrap">
  <div class="h1row">
    <h1>Investment Scanner</h1>
    <button class="ibtn" onclick="openInfoSheet()" aria-label="How the Investment Scanner enters and exits" title="How the Investment Scanner enters and exits">i</button>
  </div>
  <div class="sub">TWO-TRACK /100 · GATED ENTRIES · GVM UNIVERSE + BASKETS · EOD</div>

  <!-- cc#1297: Open/Closed Positions, above the universe stats — founder said above universe
       explicitly. Long-only (V1 writes BUY only, cc#1295) so no side column. -->
  <div class="card" id="posCard">
    <div class="bar">
      <button class="tab on" id="tabPosOpen" onclick="pickPos('open')">Open</button>
      <button class="tab" id="tabPosClosed" onclick="pickPos('exited')">Closed</button>
    </div>
    <div class="meta" id="posMeta">Loading…</div>
    <div class="scroll"><table>
      <thead id="posThead"></thead>
      <tbody id="posBody"></tbody>
    </table></div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="bar">
    <button class="tab on" id="tabMom" onclick="pick('momentum')">▲ Momentum</button>
    <button class="tab" id="tabRev" onclick="pick('reversal')">↻ Reversal</button>
    <span style="flex:1"></span>
    <select id="fBand" onchange="render()">
      <option value="">All bands</option><option>STRONG_BUY</option>
      <option>ACCUMULATE</option><option>WATCH</option><option>AVOID</option>
    </select>
    <select id="fTag" onchange="render()"><option value="">All legs</option></select>
    <label class="ck"><input type="checkbox" id="fIn" onchange="render()"> entered only</label>
  </div>

  <div class="card">
    <div class="meta" id="meta">Loading…</div>
    <div class="scroll"><table>
      <thead id="thead"></thead>
      <tbody id="body"></tbody>
    </table></div>
  </div>
</div>

<!-- cc#1708: the (i) sheet overlay is now the shared ScorrInfoSheet (scorr_card_common.js) -->


<script src="/scorr_card_common.js"></script>
<script>
var TRACK='momentum', DATA={momentum:null, reversal:null};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function n1(v){return v==null?'—':Number(v).toFixed(1);}
function n2(v){return v==null?'—':Number(v).toFixed(2);}

function bandCls(b){return b==='STRONG_BUY'?'SB':b==='ACCUMULATE'?'AC':b==='WATCH'?'WA':'AV';}
function tagHtml(t){
  var cls=t.indexOf('basket:')===0?'b':t==='screen:momentum'?'m':'g';
  var label=t.indexOf('basket:')===0?t.slice(7):t==='screen:momentum'?'momentum':'gv rising';
  return '<span class="tag '+cls+'">'+esc(label)+'</span>';
}
/* cc#1286 scope 3: the reversal trigger state in words, from the score row's own S1 component.
   90+ = confirmed turn is the DESIGN — say it, don't imply it. */
function trigHtml(s1){
  if(!s1) return '<span class="trig none">S1 · insufficient history</span>';
  var t=s1.touched_sessions_ago;
  if(t==null) return '<span class="trig none">S1 not touched (7 sessions)</span>';
  if(s1.credit>0) return '<span class="trig ok"><b>S1 reclaim confirmed</b> · touched '+t+'s ago · above PP</span>';
  return '<span class="trig pend"><b>reclaim pending</b> · S1 touched '+t+'s ago · '+(s1.above_pp?'above':'below')+' PP</span>';
}

function tiles(){
  var d=DATA[TRACK]; if(!d) return;
  var rows=d.rows||[];
  var sb=rows.filter(function(r){return r.band==='STRONG_BUY';}).length;
  var inpos=rows.filter(function(r){return r.state&&r.state.status==='open';}).length;
  var ih=rows.filter(function(r){return r.insufficient_history;}).length;
  document.getElementById('tiles').innerHTML=
    '<div class="tile"><div class="l">Universe scored</div><div class="v">'+rows.length+'</div><div class="s">'+esc(d.run_date||'—')+'</div></div>'
   +'<div class="tile"><div class="l">Strong buy</div><div class="v">'+sb+'</div><div class="s">score ≥ 84</div></div>'
   +'<div class="tile"><div class="l">Entered</div><div class="v">'+inpos+'</div><div class="s">open scanner positions</div></div>'
   +'<div class="tile"><div class="l">Insufficient history</div><div class="v">'+ih+'</div><div class="s">deltas honestly absent</div></div>';
}

function fillTagFilter(){
  var d=DATA[TRACK]; if(!d) return;
  var seen={}, sel=document.getElementById('fTag'), cur=sel.value;
  (d.rows||[]).forEach(function(r){(r.tags||[]).forEach(function(t){seen[t]=1;});});
  var opts='<option value="">All legs</option>';
  Object.keys(seen).sort().forEach(function(t){opts+='<option'+(t===cur?' selected':'')+'>'+esc(t)+'</option>';});
  sel.innerHTML=opts;
}

function render(){
  var d=DATA[TRACK];
  if(!d){document.getElementById('body').innerHTML='<tr><td colspan="9" class="empty">Loading…</td></tr>';return;}
  var band=document.getElementById('fBand').value,
      tag=document.getElementById('fTag').value,
      only=document.getElementById('fIn').checked;
  var rows=(d.rows||[]).filter(function(r){
    if(band && r.band!==band) return false;
    if(tag && (r.tags||[]).indexOf(tag)<0) return false;
    if(only && !(r.state&&r.state.status==='open')) return false;
    return true;
  });
  var rev=TRACK==='reversal';
  document.getElementById('thead').innerHTML='<tr><th>#</th><th>Symbol</th><th class="num">Score /100</th><th>Band</th>'
    +'<th class="num">G · V · M</th><th class="num">'+(rev?'52w pos':'52w pos')+'</th>'
    +(rev?'<th>Trigger</th>':'<th class="num">RSI(m) · Vol×</th>')
    +'<th>Legs</th><th>Position</th></tr>';
  document.getElementById('body').innerHTML=rows.length?rows.map(function(r,i){
    var pillars=r.insufficient_history
      ? n1(r.g)+' · '+n1(r.v)+' · '+n1(r.m)+' <span class="ih">insufficient history</span>'
      : n1(r.g)+' · '+n1(r.v)+' · '+n1(r.m);
    return '<tr>'
      +'<td class="q">#'+(i+1)+'</td>'
      +'<td class="sym">'+esc(r.symbol)+'</td>'
      +'<td class="num score">'+n1(r.score)+'</td>'
      +'<td><span class="band '+bandCls(r.band)+'">'+esc((r.band||'').replace('_',' '))+'</span></td>'
      +'<td class="num">'+pillars+'</td>'
      +'<td class="num">'+n1(r.wk52)+'</td>'
      +(rev?'<td>'+trigHtml(r.s1)+'</td>'
           :'<td class="num">'+n1(r.rsi_month)+' · '+n2(r.vol_ratio_21)+'</td>')
      +'<td>'+(r.tags||[]).map(tagHtml).join('')+'</td>'
      +'<td>'+(r.state&&r.state.status==='open'
              ?'<span class="inpos">IN · '+esc(r.state.track)+' · '+esc(r.state.entered_at)+'</span>'
              :'<span class="q">—</span>')+'</td>'
      +'</tr>';
  }).join(''):'<tr><td colspan="9" class="empty">No rows for this filter.</td></tr>';
  document.getElementById('meta').textContent='showing '+rows.length+' of '+(d.rows||[]).length
    +' · '+TRACK+' track · as of '+(d.run_date||'—')+' · EOD, refreshed nightly after the GVM write';
  tiles();
}

function pick(t){
  TRACK=t;
  document.getElementById('tabMom').classList.toggle('on',t==='momentum');
  document.getElementById('tabRev').classList.toggle('on',t==='reversal');
  if(DATA[t]){fillTagFilter();render();} else load(t);
}
function load(t){
  (window.fetchWithTimeout||fetch)('/api/inv-scanner/board?track='+t+'&limit=150')
    .then(function(r){return r.json();})
    .then(function(d){
      DATA[t]=d;
      if(TRACK===t){fillTagFilter();render();}
      // cc#1697: a click on (i) before either fetch resolves shows a loading state — self-heal
      // once real data (and its meta) actually lands, instead of staying stuck on that message.
      if(window.ScorrInfoSheet&&window.ScorrInfoSheet.isOpen())renderInfoSheet();   // cc#1708: shared sheet
    })
    .catch(function(e){document.getElementById('meta').textContent='Could not load — '+e.message;});
}

/* cc#1297: Open/Closed Positions card. One fetch of /api/inv-scanner/state (already split by
   status server-side), the page just picks which bucket to show — it computes no P&L itself,
   the endpoint returns entry/exit price, live CMP and both P&L% figures already resolved. */
var POS_STATUS='open', POS_ROWS=null;
function pctCls(v){return v==null?'':(v>=0?'pos':'neg');}
function pctFmt(v){return v==null?'—':(v>=0?'+':'')+v.toFixed(2)+'%';}

function pickPos(s){
  POS_STATUS=s;
  document.getElementById('tabPosOpen').classList.toggle('on',s==='open');
  document.getElementById('tabPosClosed').classList.toggle('on',s==='exited');
  renderPos();
}

function renderPos(){
  if(POS_ROWS===null){
    document.getElementById('posThead').innerHTML='';
    document.getElementById('posBody').innerHTML='<tr><td class="empty">Loading…</td></tr>';
    document.getElementById('posMeta').textContent='Loading…';
    return;
  }
  var rows=POS_ROWS.filter(function(r){return r.status===POS_STATUS;});
  if(POS_STATUS==='open'){
    document.getElementById('posThead').innerHTML='<tr><th>Symbol</th><th>Track</th>'
      +'<th class="num" title="score at entry, on the qualifying track">Entry Score</th><th>Entered</th><th class="num">Entry Price</th>'
      +'<th class="num">CMP</th><th class="num">Day P&amp;L</th><th class="num">Net P&amp;L</th></tr>';
    document.getElementById('posBody').innerHTML=rows.length?rows.map(function(r){
      return '<tr><td class="sym">'+esc(r.symbol)+'</td><td>'+esc(r.entry_track)+'</td>'
        +'<td class="num">'+n1(r.entry_score)+'</td><td>'+esc(r.entered_at)+'</td>'
        +'<td class="num">'+n2(r.entry_price)+'</td><td class="num">'+n2(r.cmp)+'</td>'
        +'<td class="num '+pctCls(r.day_pnl_pct)+'">'+pctFmt(r.day_pnl_pct)+'</td>'
        +'<td class="num '+pctCls(r.net_pnl_pct)+'">'+pctFmt(r.net_pnl_pct)+'</td></tr>';
    }).join(''):'<tr><td colspan="8" class="empty">No open scanner positions</td></tr>';
  } else {
    document.getElementById('posThead').innerHTML='<tr><th>Symbol</th><th>Track</th>'
      +'<th class="num" title="score at entry, on the qualifying track">Entry Score</th><th>Entered</th><th>Exited</th><th>Exit Reason</th>'
      +'<th class="num">Entry Price</th><th class="num">Exit Price</th><th class="num">Net P&amp;L</th></tr>';
    document.getElementById('posBody').innerHTML=rows.length?rows.map(function(r){
      return '<tr><td class="sym">'+esc(r.symbol)+'</td><td>'+esc(r.entry_track)+'</td>'
        +'<td class="num">'+n1(r.entry_score)+'</td><td>'+esc(r.entered_at)+'</td>'
        +'<td>'+esc(r.exited_at||'—')+'</td><td class="q">'+esc(r.exit_reason||'—')+'</td>'
        +'<td class="num">'+n2(r.entry_price)+'</td><td class="num">'+n2(r.exit_price)+'</td>'
        +'<td class="num '+pctCls(r.net_pnl_pct)+'">'+pctFmt(r.net_pnl_pct)+'</td></tr>';
    }).join(''):'<tr><td colspan="9" class="empty">No closed positions yet</td></tr>';
  }
  document.getElementById('posMeta').textContent=rows.length+' '+(POS_STATUS==='open'?'open':'closed')
    +' position'+(rows.length===1?'':'s');
}

function loadPos(){
  (window.fetchWithTimeout||fetch)('/api/inv-scanner/state')
    .then(function(r){return r.json();})
    .then(function(d){POS_ROWS=d.rows||[]; renderPos();})
    .catch(function(e){document.getElementById('posMeta').textContent='Could not load — '+e.message;});
}

// cc#1697: the (i) sheet. Every number below is interpolated from meta on the board payload
// (inv_scanner_endpoints.py) — nothing here is typed into the HTML. Falls back to whichever
// track has already loaded; if neither has, opens with a loading state and fills in once one
// resolves (boot() kicks off both fetches on page load, so this is normally instant).
function infoSheetHtml(meta){
  if(!meta) return '<div class="isheet-sec"><div class="isheet-v">Could not load the rules — try again in a moment.</div></div>';
  var gates=(meta.entry.gates||[]).map(function(g){return '<li>'+esc(g)+'</li>';}).join('');
  return ''
    +'<div class="isheet-sec"><div class="isheet-k">What it is</div><div class="isheet-v">'+esc(meta.what_it_is)+'</div></div>'
    +'<div class="isheet-sec"><div class="isheet-k">Who is scanned</div><div class="isheet-v">'+esc(meta.universe)+'</div></div>'
    +'<div class="isheet-sec"><div class="isheet-k">Entry</div><div class="isheet-v">'+esc(meta.entry.rule)+'<ul>'+gates+'</ul></div></div>'
    +'<div class="isheet-sec"><div class="isheet-k">Exit</div><div class="isheet-v">'+esc(meta.exit.rule)+'</div></div>'
    +'<div class="isheet-sec"><div class="isheet-k">Bands</div><div class="isheet-v">'+esc(meta.bands.rule)+'</div></div>'
    +'<div class="isheet-hon">'+esc(meta.honesty)+'</div>';
}
// cc#1708: open/close/render go through the shared ScorrInfoSheet (scorr_card_common.js); the
// page keeps its own infoSheetHtml(meta) — content is still interpolated from the board payload.
var ISHEET_TITLE='How the Investment Scanner enters and exits';
function renderInfoSheet(){
  var d=DATA.momentum||DATA.reversal;
  if(window.ScorrInfoSheet) window.ScorrInfoSheet.setBody(infoSheetHtml(d&&d.meta));
}
function openInfoSheet(){
  if(!window.ScorrInfoSheet) return;
  var d=DATA.momentum||DATA.reversal;
  window.ScorrInfoSheet.open(ISHEET_TITLE, infoSheetHtml(d&&d.meta));
}
function closeInfoSheet(){
  if(window.ScorrInfoSheet) window.ScorrInfoSheet.close();
}

function boot(){load('momentum');load('reversal');loadPos();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body>
</html>
