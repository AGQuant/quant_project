<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDEX INTEL</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<!-- APP_QA_R4 P3: the shared theme layer + app shell. Both are shared assets, not copies —
     P4 and P5 link the same two files. -->
<link rel="stylesheet" href="/static/scorr_themes.css">
<link rel="stylesheet" href="/static/scorr_appshell.css">
<script src="/static/scorr_appshell.js" defer></script>
<style>
/* INDEX INTEL — implements design_refs/scorr_indexintel_mobile_R1.html (bb2fde7), R5.1 tokens */
:root{--field:#0D1322;--panel:#161F33;--hi:#1C2740;--edge:#26334F;--chalk:#EAF0FA;--muted:#8A97B0;
--volt:#C8F542;--heat:#FF4D6D;--aqua:#35E0FF;--pulse:#7C5CFF;--amber:#FF9F45;--cut:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070B14;font-family:'Space Grotesk',sans-serif;color:var(--chalk)}
.phone{max-width:480px;margin:0 auto;background:var(--field);min-height:100vh;padding-bottom:var(--space-70);
 background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.014) 0 2px,transparent 2px 9px)}
.num{font-family:'JetBrains Mono',monospace}
.skew{font-family:'Archivo Black';transform:skewX(-6deg);display:inline-block;transform-origin:left center;text-transform:uppercase}
.eyebrow{display:flex;align-items:center;gap:var(--space-10);margin:var(--space-20) var(--space-18) var(--space-10);font-size:var(--type-11);font-weight:700;
 letter-spacing:var(--track-px16);color:var(--aqua);text-shadow:0 0 12px rgba(53,224,255,.4)}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.card{background:var(--panel);border:var(--bw-1) solid var(--edge);margin:0 var(--space-14) var(--space-12);padding:var(--space-16);position:relative;
 clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,0 100%)}
.rail::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:var(--radius-4);background:var(--rc,var(--muted))}
.chip{font-family:'JetBrains Mono';font-size:var(--type-105);font-weight:700;letter-spacing:var(--track-px10);border:var(--bw-1) solid var(--edge);
 background:var(--hi);padding:var(--space-4) var(--space-9);display:inline-block;clip-path:polygon(5px 0,100% 0,100% 100%,0 100%,0 5px)}
.w{border-color:#3E5A18;background:#18240E;color:var(--volt)}
.l{border-color:#5A2634;background:#241019;color:#FF8FA5}
.n{border-color:#5A4218;background:#241D0E;color:var(--amber)}
.vitals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-9)}
.vital{background:var(--hi);border:var(--bw-1) solid var(--edge);padding:var(--space-9);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.vital .lb{font-size:var(--type-95);letter-spacing:var(--track-px12);color:var(--muted)}
.vital .vv{font-family:'JetBrains Mono';font-weight:800;font-size:var(--type-14);margin-top:var(--space-4)}
.vital .sb{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--muted);margin-top:var(--space-2)}
.mrow{display:flex;align-items:center;gap:var(--space-10);padding:var(--space-8) 0;border-top:var(--bw-1) solid var(--edge);font-size:var(--type-125)}
.mrow:first-of-type{border-top:none}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-10)}
.grp h3{font-family:'Archivo Black';font-size:var(--type-15);transform:skewX(-6deg);color:var(--chalk)}
.grp .note{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--muted);letter-spacing:var(--track-px10);text-align:right}
.foot{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--muted);letter-spacing:var(--track-px8);margin:var(--space-6) var(--space-18) var(--space-20)}
.tbl{width:100%;font-size:var(--type-115);font-family:'JetBrains Mono'}
.tbl td{padding:var(--space-6) var(--space-4);border-top:var(--bw-1) solid var(--edge)}
.tbl tr:first-child td{border-top:none}
/* ══ cc#1242 · VOLATILITY & FLOW BECOMES A 4-CARD DECK ═══════════════════════════════════════
   THE DECK HELPERS ARE PORTED FROM scorr_digest_mobile.html, NOT INVENTED, and that is worth
   naming rather than hiding: this page had no deck of its own, and the app now has the same
   scroll-snap + dot-pager gesture written page-local in two files. Copying beats inventing a third
   dialect, but the right home is a shared module and neither file is it. That is a separate card,
   not something to smuggle in here — flagged in the forum.
   Everything here is scoped under .vswipe/.vpage/.vdots, all new class names, so nothing on this
   page or any other can be restyled by accident. */
.vswipe{margin:0 var(--space-14) var(--space-12)}
.vswipe-t{display:flex;gap:var(--space-9);overflow-x:auto;scroll-snap-type:x mandatory;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
.vswipe-t::-webkit-scrollbar{display:none}
/* min-width:0 IS LOAD-BEARING, and the closed book is what proved it. A flex item will not shrink
   below its CONTENT's minimum, whatever its flex-basis says — so a page whose rows carry fixed-width
   cells came out 324px wide inside a 300px track and the last 24px, which is where the exit-reason
   chip sits, was clipped by the track's own overflow. flex:0 0 100% looked like it settled the
   width and did not. With min-width:0 the page is exactly the track width and the row's flexible
   cell (the symbol) takes the squeeze and ellipsises, which is what it is there for.
   The other two decks never showed this because their rows have no fixed-width cells. */
.vpage{flex:0 0 100%;min-width:0;scroll-snap-align:start}
/* cc#1401 · ONE CARD PER SWIPE, same fix cc#1350 shipped for Home's three decks — mandatory snap
   alone lets a hard fling's momentum carry past the immediate next page to wherever it settles,
   so a fast swipe on this page's own 4-page decks (Volatility & Flow, Stock F&O Radar) could skip
   2-3 pages. scroll-snap-stop:always forbids the scroller from passing ANY snap point mid-gesture,
   so every fling, however hard, stops at the next page. Reused verbatim, not reinvented: this page
   was missing the companion rule entirely (grepped, confirmed absent) despite copying the same
   .vswipe-t/scroll-snap-type:x mandatory deck pattern from mobile/home.html (cc#1242's own comment
   above). Pure CSS, no JS — same as cc#1350's own precedent. */
.vswipe-t > .vpage{scroll-snap-stop:always}
/* a deck nested inside a .card must not re-apply the track's own page margin — the card already
   pads, and doubling it is what made this track narrower than its pages in the first place. */
.card .vswipe{margin-left:0;margin-right:0}
.vpage .card{margin:0}
.vdots{display:flex;justify-content:center;gap:var(--space-5);margin-top:var(--space-8)}
.vdots i{width:5px;height:5px;border-radius:50%;background:var(--edge);transition:.2s;cursor:pointer}
.vdots i.on{background:var(--amber);width:15px;border-radius:var(--radius-3)}
/* ── the OI histogram, spec 6055 section 7 anatomy ──────────────────────────────────────────
   Call OI grows UP from a centre axis in red, Put OI grows DOWN in green. That pairing is the
   convention the spec fixes and it is the opposite of a naive "green is good": a call wall is
   resistance overhead, a put wall is support beneath, so the colour marks WHERE the writers are,
   not whether the news is welcome. Bars are % heights against the largest OI on the card, so the
   two halves share one scale and a tall put bar and a tall call bar mean the same quantity. */
.oib{position:relative;display:flex;align-items:stretch;gap:var(--space-2);height:132px;margin-top:var(--space-10);padding:26px 0}
/* cc#1355 · the reserved strips grow 11→26px so the mover delta labels fit beside the wall tags */
.oic{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.oic .up{flex:1;display:flex;align-items:flex-end}
.oic .dn{flex:1;display:flex;align-items:flex-start}
.oic .up i,.oic .dn i{display:block;width:100%;background:var(--heat);opacity:.85}
.oic .dn i{background:var(--volt)}
.oic.mp .up i,.oic.mp .dn i{background:var(--amber);opacity:1}
.oiax{height:var(--bw-1);background:var(--edge)}
.oispot{position:absolute;top:0;bottom:0;width:0;border-left:var(--bw-1) dashed var(--aqua);pointer-events:none}
/* The wall tags sit in the 11px the chart reserves above and below its bars, so a tag can never
   land on top of the bar it is labelling. transform:translateX(-50%) centres each tag on its own
   column rather than starting at it, which matters at the chart edges where the wall is often the
   first or last strike. */
.oiwall{position:absolute;font-family:'JetBrains Mono';font-size:var(--type-8);letter-spacing:var(--track-px8);
 white-space:nowrap;transform:translateX(-50%);pointer-events:none}
.oiwall.cw{top:0;color:var(--heat)}
.oiwall.pw{bottom:0;color:var(--volt)}
.oichg{position:absolute;transform:translateX(-50%);font-family:'JetBrains Mono';font-size:var(--type-8);
  letter-spacing:var(--track-px8);white-space:nowrap;pointer-events:none}
.oichg.ce{top:13px;color:var(--heat)}
.oichg.pe{bottom:13px;color:var(--volt)}
/* cc#1261 · STRIKE LABELS UNDER THE BARS. The CALL WALL / PUT WALL tags above name WHICH bar
   matters; these name WHAT IT IS, so the x-axis reads without hunting back to the readout line.
   Same absolute positioning and the same (i+0.5)/count centring the wall tags use, so a number
   sits on the column it belongs to rather than half a column off. Sparse by construction: only
   the three strikes that carry meaning, deduped and thinned — see the builder. */
.oixs{position:relative;height:12px;margin-top:var(--space-3)}
.oix{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;
 font-family:'JetBrains Mono';font-size:var(--type-8);letter-spacing:var(--track-px8);
 pointer-events:none}
.oix.pw{color:var(--volt)}                 /* the same colours the bars and wall tags already use, */
.oix.cw{color:var(--heat)}                 /* so a label needs no legend to say what it names */
.oix.mp{color:var(--amber)}
.oix.lo{transform:none;left:0}             /* clamped: an edge strike cannot hang off the card */
.oix.hi{transform:none;left:auto;right:0}
.oird{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--muted);margin-top:var(--space-10);
 line-height:1.6}
.oird b{color:var(--chalk)}
.asof{font-family:'JetBrains Mono';font-size:var(--type-9);letter-spacing:var(--track-px10);color:var(--muted)}
.asof.stale{color:var(--amber)}
/* cc#1361 · this card's own text chrome, one type step up from the shared classes */
.oiasof{font-size:var(--type-10)}
.oird.oifacts{font-size:var(--type-105)}
/* ── the pivot ladder, same rungs and same numbers as the digest ladders ─────────────────── */
.plad{display:flex;flex-direction:column;gap:var(--space-4);margin-top:var(--space-10)}
.prg{display:flex;align-items:center;gap:var(--space-9);padding:var(--space-5) var(--space-8);
 background:var(--hi);border:var(--bw-1) solid var(--edge)}
.prg .rl{font-family:'JetBrains Mono';font-size:var(--type-95);letter-spacing:var(--track-px11);
 color:var(--muted);width:26px;flex:none}
.prg .rv{font-family:'JetBrains Mono';font-size:var(--type-125);font-weight:800;flex:1;text-align:right}
.prg.pp{border-color:var(--amber)}
.prg.pp .rl,.prg.pp .rv{color:var(--amber)}
.prg.cmp{background:transparent;border-color:var(--aqua)}
.prg.cmp .rl,.prg.cmp .rv{color:var(--aqua)}
/* ══ cc#1243 · THE HEADER IS TWO ROWS, AND THE FIX IS PAGE-LOCAL ON PURPOSE ══════════════════
   WHAT WAS ACTUALLY BROKEN, measured before touching anything: the subtitle rendered at 20px tall
   against a 10px line-height at BOTH 360 and 390 — two lines — and at 10px (one line) only at 430.
   The desktop header was ported without a mobile pass, so the status slot took its width from the
   right and the identity block got whatever was left, which on a 360 phone is not enough for
   "NIFTY · BANKNIFTY · THE LIVE DESK". Giving row 2 the full width is the whole fix; the ellipsis
   below is the belt-and-braces for a longer subtitle, not the mechanism.

   SCOPED HERE, NOT IN THE APPSHELL, AND THAT IS THE LOAD-BEARING DECISION. .as-hdr lives in
   SCORR_APPSHELL_CSS, which is a SHARED sheet — every /m/ page on the shell links it. Restyling
   .as-hdr there would silently re-lay-out the header of every one of them, which is exactly the
   cc#1108 failure (a look shipped through a shared selector landing on surfaces nobody was
   designing for) and what SHARED_CSS_RULE_V1 exists to prevent. So the overrides are keyed to
   .ii-hdr, a class that exists only on this page, and the shared file is not touched at all.
   The web Index Intel is a different file entirely (v10_dashboard.html) and has no .as-hdr, so no
   media query is needed to protect it — the scoping is by FILE, the strongest kind available. */
.as-hdr.ii-hdr{flex-direction:column;align-items:stretch;gap:var(--space-6)}
.ii-r1{display:flex;align-items:center;gap:var(--space-9)}
.ii-r1 .ii-sp{flex:1}
/* 44px both ways per MOBILE_UX_STANDARD_V1 — a back control that is only as big as its glyph is
   not a tap target. The chevron is drawn optically smaller than its box, which is the point. */
.ii-back{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
 margin-left:var(--space-n10);font-size:var(--type-24);line-height:1;color:var(--muted);
 text-decoration:none;flex:none}
/* flex-end, not baseline. `align-items:baseline` aligns a flex child by its FIRST baseline, and
   .as-pg's first baseline is the TITLE's — which put the clock level with INDEX INTEL instead of
   with the subtitle. The card lists the clock alongside the subtitle, and pairing the two small
   mono elements is also the better read. flex-end aligns their bottoms, and at the same 10px
   mono line-height that is their baseline to within a pixel. */
.ii-r2{display:flex;align-items:flex-end;gap:var(--space-10)}
.ii-r2 .as-pg{flex:1;min-width:0}
/* ONE LINE EACH, and min-width:0 above is what actually allows the ellipsis: a flex child defaults
   to min-width:auto and refuses to shrink below its content, so text-overflow never engages. */
.as-hdr.ii-hdr .as-pg .t{white-space:nowrap}
.as-hdr.ii-hdr .as-pg .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-hdr.ii-hdr #asof{flex:none;white-space:nowrap;font-family:'JetBrains Mono';
 font-size:var(--type-95);color:var(--muted)}
/* cc#1393 · THE BOOK · V10 and The Record are removed from this page (founder ask), and every CSS
   rule that fed only those two blocks goes with them — the cc#1244/1245/1247/1248/1262/1263/1264
   book-row, closed-book, chip and trade-journey rules that lived here (.bkrow/.bk1/.bk2/.bkside/
   .bkpnl/.bkleg, .clchips/.clchip/.pfchips/.pfgrid, .rchips/.rchip/.rcstrip/.rcpage/.rctr/.rctop/
   .rcwho/.rcsym/.rcleg/.rcside/.rcrsn/.rcpnl/.rcjr/.rclp/.rck/.rcd/.rcp/.rcright/.rcarrow/.rcexit/
   .clpg). The step-2 dead-code audit for this task also found NINE rules with zero live consumers
   ANYWHERE in this file, even before today: .clpage/.clrow/.cld/.cls/.clp/.clv/.cllg/.clside/
   .clrsn/.clwr — residue of an older table-row "closed list" design that rcRow's card layout (cc#
   1264) already superseded, left behind uncleaned at the time. They are not something this task's
   own JS removal orphaned, but a dedicated cleanup pass on this exact page is the reasonable place
   to take known-dead CSS out rather than leave it for the next person to re-discover, so they go
   too — disclosed here as pre-existing dead, not created dead by today's removal. .vitals/.vital
   stay: SHOW_VOL_TILES's own tiles use that pair and are untouched by this task. */
/* ── cc#1248 · the buildup state strip and its table ───────────────────────────────────── */
.bustate{display:flex;align-items:baseline;gap:var(--space-8);margin:var(--space-8) 0 var(--space-10)}
.bubadge{font-size:var(--type-105);padding:var(--space-4) var(--space-10)}
.busub{font-family:'JetBrains Mono';font-size:var(--type-9);color:var(--muted);letter-spacing:var(--track-px8)}
.butbl{width:100%;border-collapse:collapse;font-size:var(--type-105);table-layout:fixed}
.butbl th{font-size:var(--type-85);color:var(--muted);letter-spacing:var(--track-px8);text-align:right;
 padding:var(--space-4) var(--space-3);border-bottom:var(--bw-1) solid var(--edge);font-weight:400}
.butbl th:first-child,.butbl td:first-child{text-align:left;padding-left:var(--space-2)}
/* COLUMN WIDTHS ARE EXPLICIT BECAUSE table-layout:fixed SPLITS EVENLY OTHERWISE, and an even sixth
   is not enough for a symbol: AXISBANK, BRITANNIA and BHARTIARTL all truncated on the first render.
   The five numeric columns are sized to their widest real value at this font — "+26.39L" is the
   widest OI delta in the universe, "-1.68%" the widest day move, "14,820" the widest futures price
   — and the remainder goes to SYMBOL, which is the only column whose content is a name rather than
   a number. GMRAIRPORT and CUMMINSIND are the longest in the F&O list at ten characters and both
   fit. Percentages rather than pixels so the same allocation holds from 360 to 430. */
/* cc#1440: both .butbl tables (Volume Flow AND Futures Buildup) are SEVEN columns now — the
   RVOL/VOL P pair everywhere per canon V2. SYMBOL keeps the remainder; the six numeric columns
   split evenly. Flagged for the live 360px check — GMRAIRPORT/CUMMINSIND at 22% is tighter than
   the 27% the original comment measured. */
.butbl th:nth-child(1),.butbl td:nth-child(1){width:22%}
.butbl th:nth-child(2),.butbl td:nth-child(2){width:13%}
.butbl th:nth-child(3),.butbl td:nth-child(3){width:13%}
.butbl th:nth-child(4),.butbl td:nth-child(4){width:13%}
.butbl th:nth-child(5),.butbl td:nth-child(5){width:13%}
.butbl th:nth-child(6),.butbl td:nth-child(6){width:13%}
.butbl th:nth-child(7),.butbl td:nth-child(7){width:13%}
/* cc#1447: Volume Flow dropped FUT, so its tables are SIX columns while Futures Buildup stays
   seven on the shared .butbl widths above. .vftbl re-splits VF's six: SYMBOL takes 27% (more
   room for the GMRAIRPORT-length names the 22% split was tight on), five numerics 14.6% each. */
.butbl.vftbl th:nth-child(1),.butbl.vftbl td:nth-child(1){width:27%}
.butbl.vftbl th:nth-child(n+2),.butbl.vftbl td:nth-child(n+2){width:14.6%}
.butbl td{padding:var(--space-8) var(--space-2);text-align:right;border-bottom:var(--bw-1) solid var(--edge);
 font-family:'JetBrains Mono';overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.butbl tr:last-child td{border-bottom:none}
.butbl td.sym{font-weight:700;font-family:'Space Grotesk',sans-serif}
.butbl .up{color:var(--volt)} .butbl .dn{color:var(--heat)} .butbl .am{color:var(--amber)}
/* cc#1430: Volume Flow's own sort-header state — scoped to .vfsort so the Futures Buildup .butbl
   (a plain, unsorted table sharing the same class for its column widths) is untouched. */
.butbl th.vfsort{cursor:pointer;user-select:none}
.butbl th.vfsort.on{color:var(--chalk)}
.unavail{font-size:var(--type-11);color:var(--muted);font-family:'JetBrains Mono'}
/* LABEL_AMBER_V1 (founder 09:05 17-Aug): index NAME labels are amber across the app. */
.idxnm{color:var(--amber)}

/* ══ cc#1368 · VOLUME FLOW — green-bar volume vs red-bar volume, replacing LIVE NEWS ═══════════
   The news section moved to the Daily Digest (cc#1365/1366 gave it ordering, history paging and
   archive search there); a second copy here was pure duplication — founder 27-Aug. In its place:
   two stacked cards ranking the F&O universe by where the VOLUME traded over the last N 5-min
   ticks — on rising bars (accumulation) or falling bars (distribution). It is a VOLUME read and
   is labelled VOLUME FLOW, nothing stronger: we do not capture the order book, so no name here
   may claim to read it.
   The row table reuses .butbl wholesale — same six columns, same explicit widths, same ellipsis
   behaviour the F&O radar already proved at 360px — rather than inventing a third table dialect.
   The bottom sheet is the same anatomy the news sheet had, re-pointed at this page's own tokens
   where the news copy carried literal hex (its grab-handle grey, its border black) — those
   literals leave with it and do not come back. */
.vfhd{display:flex;align-items:center;gap:var(--space-6);margin-bottom:var(--space-10)}
.vfhd h3{font-family:'Archivo Black';font-size:var(--type-15);transform:skewX(-6deg);color:var(--chalk)}
.vfhd .sp{flex:1}
.vfib{min-width:30px;min-height:30px;border-radius:50%;background:var(--hi);border:var(--bw-1) solid var(--edge);
 color:var(--aqua);font-family:'JetBrains Mono';font-weight:800;font-size:var(--type-115);cursor:pointer;
 display:inline-flex;align-items:center;justify-content:center}
.vfchips{display:flex;gap:var(--space-5);margin-bottom:var(--space-10)}
.vfchip{flex:1;min-height:32px;font-family:'JetBrains Mono';font-size:var(--type-95);font-weight:700;
 letter-spacing:var(--track-px8);background:var(--hi);color:var(--muted);border:var(--bw-1) solid var(--edge);
 border-radius:var(--radius-5);cursor:pointer}
.vfchip.on{border-color:var(--aqua);color:var(--aqua)}
.vfasof{font-family:'JetBrains Mono';font-size:var(--type-95);color:var(--muted);letter-spacing:var(--track-px8);
 margin-top:var(--space-8)}
.vfmore{width:100%;min-height:40px;margin-top:var(--space-8);font-family:'JetBrains Mono';font-size:var(--type-10);
 font-weight:700;letter-spacing:var(--track-em9);color:var(--chalk);background:var(--hi);
 border:var(--bw-1) solid var(--edge);border-radius:var(--radius-7);cursor:pointer}
.vfveil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
.vfsheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;display:flex;flex-direction:column;z-index:81;
 background:var(--panel);border-top:var(--bw-1) solid var(--edge);border-radius:var(--radius-18) var(--radius-18) 0 0}
.vfgrab{width:38px;height:4px;border-radius:var(--radius-2);background:var(--edge);margin:var(--space-9) auto var(--space-6);flex-shrink:0}
.vfsb{overflow-y:auto;padding:var(--space-4) var(--space-16) 26px;-webkit-overflow-scrolling:touch}
.vfsh{font-family:'Archivo Black';font-size:var(--type-14);transform:skewX(-6deg);color:var(--chalk);
 margin-bottom:var(--space-10);text-transform:uppercase}
.vfg{font-size:var(--type-125);line-height:1.6;color:var(--chalk)}
.vfg p{margin:0 0 var(--space-9)}
.vfg b{color:var(--aqua)}
</style>

<script>
/* Wiring follows v10_dashboard.html loaders exactly (payload-first rule, 23359). Every loader
   behind its own try/catch; a failed feed states itself and never blanks the page. */
const $=id=>document.getElementById(id);
const num=(v,d=0)=>(typeof v==='number'?v:Number(v)||0).toLocaleString('en-IN',{maximumFractionDigits:d});
const sgn=(n,d=2)=>(n>=0?'+':'')+Number(n).toFixed(d);
const fK=n=>Math.abs(n)>=1e7?(n/1e7).toFixed(2)+'Cr':Math.abs(n)>=1e5?(n/1e5).toFixed(2)+'L':num(n);
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cx=n=>n>=0?'var(--volt)':'var(--heat)';
const gj=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json()};
const IST=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));

const D={mood:null,sig:{},lm:{},vix:null,adr:null,pcr:{},mp:null,open:[],build:null,div:null,cand:{},
  /* cc#1242: the deck's own reads. mp stays the NIFTY max pain the old vitals tile used; mpB is
     the BANKNIFTY one the page never asked for, which is the whole of what 6055 saw. */
  mpB:null, oi:{}, piv:null};

async function loadAll(){
  const T=[
    async()=>{D.mood=await gj('/api/v8/market_mood')},
    async()=>{D.sig.N=await gj('/api/v10/signal?symbol=NIFTY50').catch(()=>null);
              D.sig.B=await gj('/api/v10/signal?symbol=BANKNIFTY').catch(()=>null)},
    async()=>{const m=await gj('/api/v8/live_metrics');(m.rows||[]).forEach(r=>{
              if(r.symbol==='NIFTY50')D.lm.N=r; if(r.symbol==='BANKNIFTY')D.lm.B=r;})},
    async()=>{D.vix=await gj('/api/v10/vix')},
    async()=>{D.adr=await gj('/api/v8/adr')},
    async()=>{D.pcr.N=await gj('/api/daily/pcr?underlying=NIFTY&days=8').catch(()=>null);
              D.pcr.B=await gj('/api/daily/pcr?underlying=BANKNIFTY&days=8').catch(()=>null)},
    async()=>{D.mp=await gj('/api/v10/maxpain?symbol=NIFTY')},
    /* cc#1242 · NO ENDPOINT WAS EXTENDED AND NONE NEEDED TO BE. /maxpain and /strike_oi have both
       taken a `symbol` since cc#542/cc#1155 and _MAXPAIN_SPOT already maps BANKNIFTY to its spot;
       what was NIFTY-only was this page's call list, not the API. Verified against real rows before
       building: BANKNIFTY 61 strikes on expiry 2026-08-25 at tick 2026-08-20 15:35, and
       max_pain.max_pain() over that chain returns 57600 without tripping its own guard. */
    async()=>{D.mpB=await gj('/api/v10/maxpain?symbol=BANKNIFTY').catch(()=>null)},
    async()=>{D.oi.N=await gj('/api/v10/strike_oi?symbol=NIFTY&n=7').catch(()=>null);
              D.oi.B=await gj('/api/v10/strike_oi?symbol=BANKNIFTY&n=7').catch(()=>null)},
    /* the SAME table the digest ladders read (v8_paper_pivots via /api/paper/pivots), so the two
       surfaces cannot print different pivots for the same session. */
    async()=>{D.piv=await gj('/api/paper/pivots?symbol=NIFTY50,BANKNIFTY').catch(()=>null)},
    /* D.open / /api/v10/positions STAYS — cc#1393 removes THE BOOK · V10 (the block that read
       D.open into openF/totO/openDeck) but sigCard() (SHOW_SIGNAL_TILES, currently off) still
       reads D.open directly per-symbol, so the fetch and the state field are both kept live. */
    async()=>{const p=await gj('/api/v10/positions');D.open=p.open_positions||p.rows||[]},
    /* cc#1393: the /api/v10/trades/legs fetch (D.closed/D.psum/D.stats/D.counts) is removed — it
       fed ONLY The Record, which is removed with it. D.psum was already dead before this task
       (fetched, never read anywhere); D.closed/D.stats/D.counts had exactly one consumer each,
       all inside the removed rc-function family. cc#1263/1264's own findings about the endpoint
       (one row per closed leg vs per trade, and why /performance stays unused here) are historical
       context for a fetch that no longer exists, so the comments retiring it go with it. */
    /* cc#1248: limit 5 -> 250. The endpoint returns TOP-N-BY-DAY-MOVE slices, so a SHORT_COVER
       symbol sitting mid-table was outside both slices and could never be bucketed. At 250 the two
       slices each cover the whole 208-symbol universe and their union is every row. This is a query
       parameter, not a read-path change — the endpoint already classifies all four states. */
    async()=>{D.build=await gj('/api/v10/buildup?limit=250')},
    async()=>{D.div=await gj('/api/v10/divergence')},
  ];
  await Promise.all(T.map(f=>f().catch(e=>console.warn('[intel]',e.message))));
}

function pcrParse(p){ /* latest non-null = cur; nulls counted as stated gaps, never plotted as 0 */
  const rows=(p&&(p.rows||p.data))||[]; let cur=null,gaps=0; const series=[];
  rows.forEach(r=>{const v=(r.pcr==null?null:Number(r.pcr));
    if(v==null){gaps++}else{series.push(v); if(cur==null)cur=v;}});
  return {cur,gaps,series:series.slice(0,8).reverse()};
}
function spark(vals,color){
  if(!vals||vals.length<2)return '<div class="unavail">no series</div>';
  const w=200,h=34,mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-((v-mn)/sp)*(h-8)).toFixed(1)}`).join(' ');
  const last=pts.split(' ').pop();
  return `<svg viewBox="0 0 ${w} ${h}" style="display:block;width:100%;height:${h}px">
    <polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/>
    <circle cx="${last.split(',')[0]}" cy="${last.split(',')[1]}" r="3" fill="${color}"/></svg>`;
}
function pcrBand(v){return v==null?['NO DATA','']:(v<0.7?['BEARISH','l']:v<0.9?['BULLISH','w']:v<1.1?['NEUTRAL','n']:['BEARISH','l']);}

/* ── cc#1241 · THE TWO SIGNAL TILES ARE HIDDEN, NOT DELETED ──────────────────────────────────
   Founder order, 23-Aug 16:56: hide the NIFTY and BANKNIFTY signal tile cards on the MOBILE Index
   Intel page. One flag, because the card says hide rather than delete and this is the form of hide
   that is one line to reverse: sigCard() below is kept whole, the /api/v10/signal fetches in boot()
   are kept, and nothing about the V10 engine, its scheduler or its position tracking is involved at
   all — this file is a page template and touches none of them.
   THE HIDE IS SCOPED BY FILE, WHICH IS WHY WEB CANNOT BE AFFECTED. scorr_v10_signal.html is served
   at /m/v10 and nowhere else (v10_page_endpoints.py:32/76). The web Index Intel is a different
   file, v10_dashboard.html, which has no sigCard at all — checked, zero occurrences. So there is no
   shared component to scope around and no CSS selector that could leak across.
   The eyebrow goes with the tiles. Leaving "THE SIGNALS · V10 ST+EMA" over nothing would be an
   orphan heading, and the section that follows moves straight up under the header. */
var SHOW_SIGNAL_TILES = false;
/* ══ cc#1242 · THE VOLATILITY & FLOW DECK ═══════════════════════════════════════════════════
   Four cards, one gesture: MAX PAIN NIFTY -> MAX PAIN BANKNIFTY -> PIVOT NIFTY -> PIVOT BANKNIFTY.
   The old section (VIX tile, A/D tile, compact max-pain tile, the two PCR sparklines) is HIDDEN
   behind SHOW_VOL_TILES, the same shape of hide cc#1241 used an hour ago: markup kept, one line to
   restore, and no engine, endpoint, scheduler or data pipeline involved — this file is a page
   template and reads them, nothing more.
   STATE IS PER CARD BY CONSTRUCTION (the cc#1232 principle). Each card renders from its own slice
   of the payload and holds no expanded/collapsed flag at all, so there is nothing a swipe could
   carry from one card to the next. */
var SHOW_VOL_TILES = false;

/* cc#1244 · THE HELPERS TAKE A TRACK ID NOW. cc#1242 wrote them for one deck with 'vtrack' baked
   in; this card adds a second deck to the same page and 1245/1248 add more. Copying them per deck
   is how a page ends up with four dialects of one gesture, so the state moves into a registry and
   the functions take an id. Adding a deck is now one DK entry and one wrapper, not forty lines.
   (The wider duplication — these helpers also exist page-local in scorr_digest_mobile.html — still
   wants a shared module. That is raised in the forum as its own card, not smuggled in here.) */
/* cc#1393: btrack/ctrack are gone with THE BOOK · V10 and The Record, the two decks that used
   them — vtrack (VOLATILITY & FLOW) and utrack (buildup states) are untouched. */
var DK = { vtrack:{dots:'vdots', n:0, tmr:null}, utrack:{dots:'udots', n:0, tmr:null} };
var VDECK = 0;   /* kept: cc#1242's volDeck() assigns it, and it mirrors DK.vtrack.n */
/* PITCH COMES FROM LAYOUT OFFSETS, NOT FROM A MEASURED WIDTH PLUS THE GAP, and cc#1245 is where
   that stopped being academic. getBoundingClientRect().width returns a SUB-PIXEL number — 324.484
   here — so width+gap gave a pitch of 333.484 against a true layout pitch of 333. Under a pixel per
   page, and invisible on a 2-card deck. The closed book has ELEVEN pages: parking at n*pitch landed
   3,668 where page 11 actually starts at 3,697, so the deck rested 29px off its own boundary and
   the next page's chips showed at the card edge. offsetLeft is the integer position the browser
   actually laid the page out at, so consecutive offsets give the pitch exactly and nothing
   accumulates. The same width+gap pattern sits in scorr_digest_mobile.html's deckPitch; its decks
   are small enough that the drift stays under two pixels, but it is the same latent bug and it is
   named in the forum rather than left for the next long deck to find. */
function dkPitch(tr){
  var k = tr.children;
  if(k.length > 1) return Math.max(1, k[1].offsetLeft - k[0].offsetLeft);
  if(!k.length) return Math.max(1, tr.clientWidth);
  var cs = getComputedStyle(tr), gap = parseFloat(cs.columnGap || cs.gap || 0) || 0;
  return Math.max(1, k[0].getBoundingClientRect().width + gap);
}
/* offsetLeft is relative to the OFFSET PARENT, not to the scroll container, so it carries a
   constant ancestor offset (14px here, the track's own margin). The DELTA between two pages is
   still exact — that is what dkPitch uses — but the absolute value is not a scroll position.
   Subtracting the first page's offset converts it into one. Measured: parking by the raw offset
   left every deck 14px short of its own boundary; this lands all three exactly. */
function dkAt(tr, i){
  var k = tr.children;
  if(!k.length) return 0;
  var el = k[i];
  return el ? (el.offsetLeft - k[0].offsetLeft) : i * dkPitch(tr);
}
function dkDots(id){
  var d = DK[id]; if(!d) return 0;
  var tr = document.getElementById(id), dots = document.getElementById(d.dots);
  if(!tr || !dots || !d.n) return 0;
  var w = dkPitch(tr), i = Math.round(tr.scrollLeft / w) % d.n;
  Array.prototype.forEach.call(dots.children, function(el, j){
    el.className = (j === i ? 'on' : '');
    el.onclick = function(){
      var cur = Math.round(tr.scrollLeft / w), t = cur - (cur % d.n) + j;
      tr.scrollTo({left: dkAt(tr, t), behavior:'smooth'});
    };
  });
  return i;
}
/* the triple-set wrap, same as the digest decks: three copies of the card set and a silent jump
   back to the middle one, so a swipe never hits a wall in either direction. */
function dkWrap(id){
  var d = DK[id]; if(!d) return;
  dkDots(id);
  if(d.tmr) clearTimeout(d.tmr);
  d.tmr = setTimeout(function(){
    var tr = document.getElementById(id);
    if(!tr || !d.n) return;
    var w = dkPitch(tr), i = Math.round(tr.scrollLeft / w);
    var to = (i < d.n) ? i + d.n : (i >= 2 * d.n) ? i - d.n : -1;
    if(to >= 0) tr.scrollTo({left: dkAt(tr, to), behavior:'auto'});
  }, 90);
}
function dkPark(id){
  var d = DK[id]; if(!d) return;
  var tr = document.getElementById(id);
  /* park ON the middle set's first page by its own offsetLeft rather than by arithmetic, so the
     rest position is exactly where the browser laid that page out. */
  if(tr && d.n) tr.scrollTo({left: dkAt(tr, d.n), behavior:'auto'});
  dkDots(id);
}
function vWrap(){ dkWrap('vtrack'); }
function vPark(){ dkPark('vtrack'); }

/* ── as-of honesty (scope 5) ────────────────────────────────────────────────────────────────
   The chain tick is a NAIVE IST timestamp (the cc#844 class of bug: subtracting a UTC now() from
   it invents a 330-minute offset), so nothing here computes an age in minutes. It compares DATES
   only and says plainly whether the chain predates the last session. option_chain held ZERO rows
   for 21-Aug — the outage cc#1233 is about — so on a page opened today this stamp reads stale, and
   that is the correct reading rather than a defect. */
function chainAsOf(tick){
  if(!tick) return {txt:'chain tick unknown', stale:true};
  var d = String(tick).slice(0, 10), t = String(tick).slice(11, 16);
  var today = IST().toISOString().slice(0, 10);
  return {txt:'OI as of ' + d + (t ? ' ' + t : '') + ' IST', stale:(d < today), day:d};
}
function oiUnavail(name, why){
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Max Pain ' + esc(name) + '</h3></div>'
    + '<div class="unavail">' + esc(why) + '</div></div></div>';
}

/* ── the histogram, spec 6055 section 7 ─────────────────────────────────────────────────── */
function oiCard(name, oi, mp){
  if(!oi || oi.status === 'no_data' || !(oi.strikes || []).length)
    return oiUnavail(name, 'No option chain for this expiry yet — nothing is drawn in its place.');
  var rows = oi.strikes, mpStrike = (mp && mp.status === 'ok') ? Number(mp.max_pain_strike) : null;
  /* cc#1354 · one-sided tick (26-Aug: NIFTY PE feed gap). The server flags it; the card
     keeps drawing the side that exists, suppresses the dead side's WALL tag, axis label and
     footer value (they would be fabricated — the wall reduce() lands on rows[0] when a side
     is all zeros), and states the gap in one line. Identical in both oiCard twins. */
  var peDead = oi.one_sided === 'PE_MISSING', ceDead = oi.one_sided === 'CE_MISSING';
  /* cc#1355 · change since open + PCR (session_log 32043). Bar HEIGHT stays the OI level;
     BRIGHTNESS carries the change: building = full + glow, quiet = .55, unwinding = .35. A bar
     with no delta (no 09:20 baseline row, or a side dead in either tick) keeps the stylesheet
     default — no signal is not a signal. Delta labels go only on the top 3 movers per side over
     a threshold chosen from live data (26-Aug session: median |chg| 325 = noise, top real mover
     42.5k, walls at 55L): label th = max(25k, 2% of side max OI), classify th = max(10k, 0.5%). */
  var CE_COL = 'var(--heat)', PE_COL = 'var(--volt)';
  var hasCh = rows.some(function(r){ return r.ce_chg != null || r.pe_chg != null; });
  var maxCe = Math.max.apply(null, rows.map(function(r){ return r.call_oi || 0; })) || 1;
  var maxPe = Math.max.apply(null, rows.map(function(r){ return r.put_oi || 0; })) || 1;
  var thLab = { ce: Math.max(25000, .02 * maxCe), pe: Math.max(25000, .02 * maxPe) };
  var thCls = { ce: Math.max(10000, .005 * maxCe), pe: Math.max(10000, .005 * maxPe) };
  var bri = function(chg, th, glow){
    if(!hasCh || chg == null) return '';
    if(chg >= th)  return 'opacity:1;box-shadow:0 0 8px ' + glow + ';';
    if(chg <= -th) return 'opacity:.35;';
    return 'opacity:.55;';
  };
  var fCh = function(v){ var a = Math.abs(v), s = v > 0 ? '+' : '-';
    return s + (a >= 1e5 ? (a / 1e5).toFixed(1) + 'L' : a >= 1e3 ? Math.round(a / 1e3) + 'k' : String(a)); };
  var peak = Math.max.apply(null, rows.map(function(r){ return Math.max(r.call_oi || 0, r.put_oi || 0); })) || 1;
  var callWall = rows.reduce(function(a, b){ return (b.call_oi || 0) > (a.call_oi || 0) ? b : a; }, rows[0]);
  var putWall  = rows.reduce(function(a, b){ return (b.put_oi  || 0) > (a.put_oi  || 0) ? b : a; }, rows[0]);
  var cols = rows.map(function(r){
    var isMp = (mpStrike != null && Number(r.strike) === mpStrike);
    return '<div class="oic' + (isMp ? ' mp' : '') + '" title="' + r.strike + '">'
      + '<div class="up"><i style="height:' + (100 * (r.call_oi || 0) / peak).toFixed(1) + '%;'
      +   (isMp ? '' : bri(r.ce_chg, thCls.ce, CE_COL)) + '"></i></div>'
      + '<div class="oiax"></div>'
      + '<div class="dn"><i style="height:' + (100 * (r.put_oi || 0) / peak).toFixed(1) + '%;'
      +   (isMp ? '' : bri(r.pe_chg, thCls.pe, PE_COL)) + '"></i></div>'
      + '</div>';
  }).join('');
  /* the dashed spot line, placed by interpolating spot across the rendered strike span rather than
     snapped to the nearest column — snapping would draw spot ON a strike it is not at. */
  var lo = Number(rows[0].strike), hi = Number(rows[rows.length - 1].strike), spotLine = '';
  if(oi.spot != null && hi > lo){
    var f = Math.max(0, Math.min(1, (Number(oi.spot) - lo) / (hi - lo)));
    spotLine = '<div class="oispot" style="left:' + (f * 100).toFixed(2) + '%"></div>';
  }
  /* the two wall tags, placed on their own columns. The x of column i is the centre of its share
     of the track, which is (i + 0.5) / count — not i / count, or every tag would sit a half-column
     left of the bar it names. */
  var cwI = rows.indexOf(callWall), pwI = rows.indexOf(putWall), tags = '';
  var colPct = function(i){ return (100 * (i + 0.5) / rows.length).toFixed(2); };
  /* cc#1355 · one word of change on the wall itself, and delta labels on the top movers */
  var wallWord = function(w, key, th){
    if(!hasCh || !w || w[key] == null) return '';
    return w[key] >= th ? ' · building' : (w[key] <= -th ? ' · fading' : '');
  };
  if(cwI >= 0 && !ceDead) tags += '<div class="oiwall cw" style="left:' + colPct(cwI) + '%">CALL WALL'
    + wallWord(callWall, 'ce_chg', thCls.ce) + '</div>';
  if(pwI >= 0 && !peDead) tags += '<div class="oiwall pw" style="left:' + colPct(pwI) + '%">PUT WALL'
    + wallWord(putWall, 'pe_chg', thCls.pe) + '</div>';
  if(hasCh){
    [['ce_chg', thLab.ce, 'ce'], ['pe_chg', thLab.pe, 'pe']].forEach(function(sd){
      rows.map(function(r, i){ return { i: i, c: r[sd[0]] }; })
          .filter(function(m){ return m.c != null && Math.abs(m.c) >= sd[1]; })
          .sort(function(a, b){ return Math.abs(b.c) - Math.abs(a.c); })
          .slice(0, 3)
          .forEach(function(m){
            tags += '<span class="oichg ' + sd[2] + '" style="left:' + colPct(m.i) + '%">' + fCh(m.c) + '</span>';
          });
    });
  }
  /* cc#1261 · the three strikes that carry meaning, printed under the bars they belong to.
     TWO WAYS THIS GETS UGLY AND BOTH ARE HANDLED. The max pain strike is very often ALSO the call
     or put wall, which would stack two labels on one column — so a strike already claimed is
     skipped rather than drawn twice. And when two of the three sit on neighbouring columns the
     numbers collide into an unreadable smear, so a label closer than 18% of the track to the one
     before it is dropped. Fewer, legible labels beat three that overlap; the readout line below
     still carries all three numbers, so nothing is lost by dropping one from the axis. */
  var mpI = mpStrike == null ? -1 : rows.findIndex(function(r){ return Number(r.strike) === mpStrike; });
  var picked = [], xs = '';
  [[peDead ? -1 : pwI, 'pw'], [mpI, 'mp'], [ceDead ? -1 : cwI, 'cw']].forEach(function(p){
    if(p[0] < 0) return;
    var v = Number(rows[p[0]].strike);
    for(var k = 0; k < picked.length; k++) if(picked[k].v === v) return;   /* same strike twice */
    picked.push({ i: p[0], v: v, cls: p[1] });
  });
  picked.sort(function(a, b){ return a.i - b.i; });
  var lastPct = null;
  picked.forEach(function(q){
    var pct = Number(colPct(q.i));
    if(lastPct != null && Math.abs(pct - lastPct) < 18) return;            /* too close to read */
    lastPct = pct;
    var edge = pct < 8 ? ' lo' : (pct > 92 ? ' hi' : '');
    var pos = edge ? '' : ' style="left:' + pct.toFixed(2) + '%"';
    xs += '<span class="oix ' + q.cls + edge + '"' + pos + '>' + num(q.v) + '</span>';
  });
  xs = xs ? '<div class="oixs">' + xs + '</div>' : '';
  var ao = chainAsOf(oi.chain_tick);
  /* cc#1355 · the as-of line carries the whole context: tick · vs open · PCR (32043) */
  /* cc#1361 · short stamp: '26-Aug 15:35 · vs 09:20 · PCR 1.05' (founder 08:43) — falls back to
     the long chainAsOf text only when the tick is missing entirely. */
  var aoTxt = (function(){
    var t = String(oi.chain_tick || '');
    if(t.length < 16) return ao.txt;
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return parseInt(t.slice(8, 10), 10) + '-' + (M[parseInt(t.slice(5, 7), 10) - 1] || '') + ' ' + t.slice(11, 16);
  })()
    + (oi.baseline_tick && hasCh ? ' · vs ' + String(oi.baseline_tick).slice(11, 16) : '')
    + (oi.pcr != null ? ' · PCR ' + Number(oi.pcr).toFixed(2) : '');
  var story = '';
  if(hasCh){
    /* cc#1363 · plain-words read after the fact (session_log 32095, phrases VERBATIM). A read is
       flow description, never prediction, and it gates harder than the fact: the fact renders at
       the classify threshold, the read only at the LABEL threshold (thLab), only when the side's
       deltas exist at all (hasCh/one_sided already decide that), and a BUILD read additionally
       needs its strike on the writers' side of spot — CE above, PE below; 32095 defines no phrase
       for the other positions, so none is invented. When BOTH outer builds earn their read in one
       tick, the two reads collapse into the single range read at the line's end. */
    var READS = { ceB: 'resistance forming — cautious', peB: 'support forming — bullish',
                  ceU: 'ceiling weakening — bullish tilt', peU: 'floor weakening — bearish tilt',
                  range: 'range forming — sellers boxing both sides' };
    var spotN = oi.spot != null ? Number(oi.spot) : null;
    var sideBits = function(key, wall, thC, thL, isCe){
      var mv = rows.filter(function(r){ return r[key] != null; });
      if(!mv.length) return null;
      var bld = mv.reduce(function(a, b){ return b[key] > a[key] ? b : a; });
      var unw = mv.reduce(function(a, b){ return b[key] < a[key] ? b : a; });
      var o = { bTxt: '', uTxt: '', bRead: false, uRead: false };
      if(bld[key] >= thC){
        o.bTxt = 'build ' + num(bld.strike) + ' ' + fCh(bld[key]);
        o.bRead = bld[key] >= thL && spotN != null
          && (isCe ? Number(bld.strike) > spotN : Number(bld.strike) < spotN);
      }
      if(unw[key] <= -thC){
        o.uTxt = 'unwind ' + num(unw.strike) + ' ' + fCh(unw[key])
          + (wall && Number(unw.strike) === Number(wall.strike) ? ' — wall weakening' : '');
        o.uRead = -unw[key] >= thL;
      }
      return (o.bTxt || o.uTxt) ? o : null;
    };
    var ce = ceDead ? null : sideBits('ce_chg', callWall, thCls.ce, thLab.ce, true);
    var pe = peDead ? null : sideBits('pe_chg', putWall, thCls.pe, thLab.pe, false);
    var rangeOn = !!(ce && pe && ce.bRead && pe.bRead);
    var sideTxt = function(label, o, bWord, uWord){
      if(!o) return '';
      var bits = [];
      if(o.bTxt) bits.push(o.bTxt + (o.bRead && !rangeOn ? ' · ' + bWord : ''));
      if(o.uTxt) bits.push(o.uTxt + (o.uRead ? ' · ' + uWord : ''));
      return bits.length ? label + ' ' + bits.join(' · ') : '';
    };
    var st = [sideTxt('calls', ce, READS.ceB, READS.ceU),
              sideTxt('puts', pe, READS.peB, READS.peU)]
             .filter(Boolean).join(' &nbsp;·&nbsp; ')
             + (rangeOn ? ' &nbsp;·&nbsp; ' + READS.range : '');
    if(st) story = '<div class="oird">' + st + '</div>';
  } else if(oi.baseline_tick == null && !oi.one_sided){
    /* 32043 honesty rule 3: no baseline -> deltas omitted AND the card says so */
    story = '<div class="oird">no 09:20 baseline this session — OI change hidden</div>';
  }
  var basis = oi.spot_basis === 'live' ? 'live' : 'prev close';
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Max Pain ' + esc(name) + '</h3>'
    + '<span class="asof oiasof' + (ao.stale ? ' stale' : '') + '">' + esc(aoTxt) + '</span></div>'
    + '<div class="oib">' + cols + spotLine + tags + '</div>'

       have gone stale and started lying on its own. */

    + 'MP <b class="num">' + (mpStrike != null ? num(mpStrike) : '—') + '</b>'
    + ' · spot <b class="num">' + (oi.spot != null ? num(oi.spot) : '—') + '</b><span style="font-size:.8em"> (' + basis + ')</span>'
    + ' · PW <b class="num">' + (peDead ? '—' : num(putWall.strike)) + '</b>'
    + ' · CW <b class="num">' + (ceDead ? '—' : num(callWall.strike)) + '</b>'
    + '</div>'
    + story
    + (oi.one_sided ? '<div class="oird" style="color:var(--amber,#f5b94a)">'
        + (peDead ? 'puts' : 'calls') + ' absent this tick</div>' : '')
    + '</div></div>';
}

/* ── the pivot ladder ───────────────────────────────────────────────────────────────────── */
function pivRow(lbl, v, cls){
  return '<div class="prg' + (cls ? ' ' + cls : '') + '"><span class="rl">' + esc(lbl) + '</span>'
    + '<span class="rv">' + (v != null ? num(v) : '—') + '</span></div>';
}
function pivCard(name, row, cmp){
  if(!row) return '<div class="vpage"><div class="card"><div class="grp"><h3>Pivot Range ' + esc(name)
    + '</h3></div><div class="unavail">No stored pivot row for this index.</div></div></div>';
  /* the CMP marker is placed BETWEEN the rungs it actually sits between, so the ladder reads as a
     map rather than a list with a number bolted on the end. */
  /* cc#1257 · ASCENDING BY VALUE, rule 29630 — supports on top, because that is the order people
     read numbers in. This card cannot inherit the digest payload: it is built from a flat row
     (row.r2, row.r1, …) off a different endpoint, not from a rungs array. So it applies THE SAME
     RULE rather than a copied list — sort by value. That matters: a hardcoded
     ['S2','S1','PP','R1','R2'] here would be a second ordering able to drift away from the
     digest's, and expressing the rule instead of the result is what keeps the two in step without
     anything to remember.
     THE CMP TEST FLIPS WITH THE ORDER, and it would be an easy thing to miss. Descending, CMP went
     before the first level at or BELOW it. Ascending, it goes before the first level ABOVE it —
     the same "between the levels it really sits between", read from the other end. Leaving the old
     comparison in place would have quietly parked the price at the wrong rung on every card. */
  var rungs = [['R2', row.r2], ['R1', row.r1], ['PP', row.pp], ['S1', row.s1], ['S2', row.s2]]
                .filter(function(r){ return r[1] != null; })
                .sort(function(a, b){ return Number(a[1]) - Number(b[1]); });
  var html = '', placed = false;
  rungs.forEach(function(r){
    if(!placed && cmp != null && Number(cmp) <= Number(r[1])){
      html += pivRow('CMP', cmp, 'cmp'); placed = true;
    }
    html += pivRow(r[0], r[1], r[0] === 'PP' ? 'pp' : '');
  });
  if(!placed && cmp != null) html += pivRow('CMP', cmp, 'cmp');
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Pivot Range ' + esc(name) + '</h3>'
    + '<span class="asof">' + esc(row.pivot_date || '—') + '</span></div>'
    + '<div class="plad">' + html + '</div></div></div>';
}

function volDeck(){
  var pv = D.piv, list = Array.isArray(pv) ? pv : ((pv && (pv.rows || pv.data)) || []);
  var byS = {};
  list.forEach(function(r){ if(r && r.symbol) byS[String(r.symbol).toUpperCase()] = r; });
  var cards = [
    oiCard('NIFTY', D.oi.N, D.mp),
    oiCard('BANKNIFTY', D.oi.B, D.mpB),
    pivCard('NIFTY', byS.NIFTY50, (D.lm.N || {}).cmp),
    pivCard('BANKNIFTY', byS.BANKNIFTY, (D.lm.B || {}).cmp)
  ];
  VDECK = DK.vtrack.n = cards.length;
  var set = cards.join('');
  var dots = cards.map(function(_, j){ return '<i class="' + (j ? '' : 'on') + '"></i>'; }).join('');
  return '<div class="vswipe"><div class="vswipe-t" id="vtrack" onscroll="vWrap()">'
       + set + set + set + '</div><div class="vdots" id="vdots">' + dots + '</div></div>';
}

  const st=ok?(s.st_dir==='up'?'BUY':'SELL'):null, ema=ok?(s.gate_zone==='buy'?'BUY':'SELL'):null;
  const pos=D.open.find(p=>((p.symbol||'').toUpperCase()===(key==='N'?'NIFTY50':'BANKNIFTY'))&&!p.opt_type);
  const state = pos?`Pos <b style="color:${pos.direction==='SHORT'?'var(--heat)':'var(--volt)'}">${esc(pos.direction)}</b> @ <b class="num">${num(pos.entry_price)}</b> · uP&L <b class="num" style="color:${cx(Number(pos.unrealised_pnl)||0)}">₹${num(pos.unrealised_pnl||0)}</b>`
    : ok&&sigw!=='FLAT'?`Entry <b class="num">${num(s.price)}</b> · live signal, no open leg`
    : ok?`<span style="color:var(--amber)">FLAT — awaiting aligned flip (window 09:20–15:20)</span>`
    : `<span style="color:var(--amber)">Engine snapshot not available yet — first tick lands after the bell</span>`;
  return `<div class="card rail" style="--rc:${rc}">
    <div class="grp"><h3><span class="idxnm">${name}</span> <span style="color:${rc}">${sigw}</span></h3>
      <span class="note">ST150/3·10m · EMA3/10·30m</span></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      ${st?`<span class="chip ${st==='BUY'?'w':'l'}">${st==='BUY'?'W':'L'} ST ${st}</span>`:'<span class="chip">ST —</span>'}
      ${ema?`<span class="chip ${ema==='BUY'?'w':'l'}">${ema==='BUY'?'W':'L'} EMA ${ema}</span>`:'<span class="chip">EMA —</span>'}
      ${ok&&s.flip_ts?`<span class="chip" style="color:var(--muted)">FLIP ${esc(String(s.flip_ts).slice(5,16))}</span>`:''}</div>
    <div style="display:flex;align-items:baseline;gap:10px">
      <span class="num" style="font-size:30px;font-weight:800">${cmp!=null?num(cmp):'—'}</span>
      <span class="num" style="color:${day!=null?cx(day):'var(--muted)'};font-weight:700">${day!=null?sgn(day)+'%':''}</span></div>
    <div class="vitals" style="margin-top:12px">
      <div class="vital"><div class="lb">ST BAND</div><div class="vv num" style="color:var(--amber)">${ok&&s.st_band?num(s.st_band):'—'}</div></div>
      <div class="vital"><div class="lb">STOP</div><div class="vv num" style="color:var(--heat)">${ok&&s.stop?num(s.stop):'—'}</div></div>
      <div class="vital"><div class="lb">TARGET</div><div class="vv num" style="color:var(--volt)">${ok&&s.target?num(s.target):'—'}</div></div></div>
    <div style="margin-top:10px;font-family:'JetBrains Mono';font-size:11px;color:var(--muted)">${state}</div>
  </div>`;
}

/* ══ cc#1368 · VOLUME FLOW — replaces LIVE NEWS (the news lives in the Daily Digest now) ════════
   One fetch per filter change, painted into the two card shells render() lays down. VF.data is
   the whole endpoint payload and vfPaint() derives BOTH cards from it, so a tick change, a fresh
   fetch and the 5-min refresh can never disagree about what is on screen. The endpoint excludes
   thin windows and zero-volume symbols server-side and stamps as_of from the latest tick it
   actually used; the card face repeats that stamp verbatim, so this surface cannot present stale
   as live. The tick chips live on the top card and drive both lists — two synced chip rows would
   be two controls for one state, which is how surfaces drift apart. */
var VF = { ticks: 100, data: null, err: null, loading: false };
var VF_TICKS = [25, 50, 100, 500];

function vfLoad(){
  VF.loading = true; VF.err = null;
  gj('/api/volume-flow?ticks=' + VF.ticks)
    .then(function(d){ VF.data = d; VF.loading = false; vfPaint(); })
    .catch(function(e){ VF.err = e.message; VF.loading = false; vfPaint(); });
}

function vfSetTicks(n){
  if (VF.ticks === n || VF.loading) return;
  VF.ticks = n;
  vfPaint();     /* the chip flips .on immediately… */
  vfLoad();      /* …and exactly ONE fetch follows per change (spec 3) */
}

function vfAsof(){
  var d = VF.data;
  if (!d || !d.as_of) return 'no tick yet';
  var t = String(d.as_of);   /* intraday ts are IST-naive — slice, never re-zone */
  return 'as of ' + t.slice(11, 16) + ' IST · ' + t.slice(8, 10) + '/' + t.slice(5, 7)
       + ' · ' + d.shown + ' of ' + d.universe + ' scanned';
}

function vfCell(v, pct){
  if (v == null) return '<td class="am">—</td>';
  if (pct) return '<td class="' + (v >= 0 ? 'up' : 'dn') + '">' + sgn(v) + '%</td>';
  return '<td>' + Number(v).toFixed(2) + 'x</td>';
}

/* cc#1430/1431 · TAP-TO-SORT — ONE shared sort mechanism (per cc#1431's own instruction: the two
   cards "must end up sharing ONE sort mechanism, not two"), used by both Volume Flow's vf* table
   below and Futures Buildup's bu* table further down. Same visual convention
   scorr_result_corner.html's sector table already uses (▲/▼ appended to the header label, click
   toggles direction, switching to a fresh column resets to THAT column's own default), reused
   rather than inventing a second pattern.

   _sortByState(list, state, getters) reorders a list per one {key, dir} state object — nulls
   always sort last regardless of direction (never coerced to a fake zero). _sortTh(...) builds one
   <th> with the ▲/▼ indicator and a caller-supplied onclick expression, so each card's own click
   handler (vfSort/buSort below) can do its own repaint — the two cards' data and layout genuinely
   differ, only the sort/compare/render-header logic is shared. */
function _sortByState(list, state, getters){
  if (!state || !state.key) return list;
  var get = getters[state.key];
  return list.slice().sort(function(a, b){
    var av = get(a), bv = get(b);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;    // nulls sort last regardless of direction — never implies zero
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * state.dir;
    return (av - bv) * state.dir;
  });
}
function _sortTh(label, key, state, onclickExpr){
  var on = state && state.key === key;
  // cc#1437: an unsorted header used to show no mark at all -- CSS cursor:pointer is the only
  // other cue, and that has no touchscreen equivalent, so a phone reader had nothing telling them
  // the header was tappable until they happened to try one. A persistent neutral ↕ replaces the
  // empty string; the active column still gets the single ▲/▼ it already did. No new CSS needed --
  // .vfsort (unsorted) already inherits .butbl th's own muted colour, .vfsort.on already brightens
  // to --chalk, so the glyph is dim until tapped and bright once active, same as the label text.
  var arrow = on ? (state.dir === 1 ? ' ▲' : ' ▼') : ' ↕';
  return '<th class="vfsort' + (on ? ' on' : '') + '" onclick="' + onclickExpr + '">' + label + arrow + '</th>';
}

/* Volume Flow (cc#1430): one sort state PER SIDE (bullish/bearish are independent lists), shared
   between the inline 5-row card and the VIEW MORE sheet for that side — sorting inline and then
   opening VIEW MORE shows the same order, not a reset back to the server's original ranking.
   SYMBOL defaults ascending on first tap; the five numeric columns default descending (highest
   first — the qualifying-flow reason the row is on the card at all). */
var VF_SORT = { bullish: { key: null, dir: 1 }, bearish: { key: null, dir: 1 } };
/* cc#1438 (VOLUME_METRICS_CANON_V1.1): VOLX/VOLD columns become RVOL/DELIV — the sort keys, the
   getters and the payload fields all follow the endpoint's new rvol/deliv_ratio keys. */
var VF_SORT_GETTERS = {
  SYMBOL: function(r){ return (r.symbol || '').toUpperCase(); },
  DAY:    function(r){ return r.day_chg_pct; },
  WK:     function(r){ return r.week_chg_pct; },
  /* cc#1447: FUT getter removed with the column (founder: confusing beside DAY). The endpoint
     still serves fut_chg_pct untouched — display-only removal. */
  RVOL:   function(r){ return r.rvol; },
  VOLP:   function(r){ return r.vol_p; },   /* cc#1440 (canon V2): yesterday's RVOL at close */
  DELIV:  function(r){ return r.deliv_ratio; },
};
var VF_SORT_DEFAULT_DIR = { SYMBOL: 1, DAY: -1, WK: -1, RVOL: -1, VOLP: -1, DELIV: -1 };

function vfSortList(list, side){
  return _sortByState(list, VF_SORT[side], VF_SORT_GETTERS);
}

function vfSort(side, key){
  var s = VF_SORT[side];
  if (s.key === key) s.dir = -s.dir;
  else { s.key = key; s.dir = VF_SORT_DEFAULT_DIR[key]; }
  vfCard(side);
  if (VF_SHEET.open && VF_SHEET.side === side) vfMore(side);   // sheet is open on THIS side — re-render it sorted too
}

function vfTh(label, key, side){
  return _sortTh(label, key, VF_SORT[side], "vfSort('" + side + "','" + key + "')");
}

function vfRows(list, n, side){
  var sorted = side ? vfSortList(list, side) : list;
  var rows = (n ? sorted.slice(0, n) : sorted).map(function(r){
    return '<tr><td class="sym">' + esc(r.symbol) + '</td>'
      + vfCell(r.day_chg_pct, 1) + vfCell(r.week_chg_pct, 1)
      + vfCell(r.rvol, 0) + vfCell(r.vol_p, 0) + vfCell(r.deliv_ratio, 0) + '</tr>';
  }).join('');
  var head = side
    ? (vfTh('SYMBOL', 'SYMBOL', side) + vfTh('DAY', 'DAY', side) + vfTh('WK', 'WK', side)
       + vfTh('RVOL', 'RVOL', side) + vfTh('VOL P', 'VOLP', side)
       + vfTh('DELIV', 'DELIV', side))
    : '<th>SYMBOL</th><th>DAY</th><th>WK</th><th>RVOL</th><th>VOL P</th><th>DELIV</th>';
  /* cc#1447: .vftbl re-splits the widths for SIX columns (buildup's .butbl stays seven). One
     renderer serves the compact card AND the VIEW MORE sheet, so both drop FUT together. */
  return '<table class="butbl vftbl"><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function vfChips(){
  return '<div class="vfchips">' + VF_TICKS.map(function(n){
    return '<button type="button" class="vfchip' + (n === VF.ticks ? ' on' : '')
      + '" onclick="vfSetTicks(' + n + ')">' + n + '</button>';
  }).join('') + '</div>';
}

function vfCard(side){
  var box = document.getElementById(side === 'bullish' ? 'vfBull' : 'vfBear');
  if (!box) return;
  var head = '<div class="vfhd"><h3>' + (side === 'bullish' ? 'Bullish Flow' : 'Bearish Flow')
    + '</h3><span class="sp"></span>'
    + '<button type="button" class="vfib" onclick="vfGuide()" aria-label="How to read this card">i</button></div>'
    + (side === 'bullish' ? vfChips() : '');
  var body;
  if (VF.err){
    body = '<div class="unavail">Volume flow unavailable: ' + esc(VF.err) + '</div>';
  } else if (!VF.data){
    body = '<div class="unavail">Loading volume flow…</div>';
  } else {
    var list = VF.data[side] || [];
    if (!list.length){
      body = '<div class="unavail">No symbol has 60%+ of its volume on '
        + (side === 'bullish' ? 'green' : 'red') + ' ticks in this window.</div>';
    } else {
      body = vfRows(list, 5, side)
        + (list.length > 5
           ? '<button type="button" class="vfmore" onclick="vfMore(\'' + side + '\')">VIEW MORE · '
             + list.length + ' QUALIFY</button>'
           : '');
    }
  }
  box.innerHTML = head + body
    + '<div class="vfasof">' + esc(vfAsof()) + (VF.loading ? ' · updating…' : '') + '</div>';
}

function vfPaint(){ vfCard('bullish'); vfCard('bearish'); }

var VF_SHEET = { open: false, scrollY: 0 };

function vfSheet(html){
  vfSheetClose();
  VF_SHEET.scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
  var veil = document.createElement('div');
  veil.className = 'vfveil';
  var sheet = document.createElement('div');
  sheet.className = 'vfsheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = '<div class="vfgrab"></div><div class="vfsb">' + html + '</div>';
  document.body.appendChild(veil);
  document.body.appendChild(sheet);
  document.body.style.overflow = 'hidden';
  VF_SHEET.open = true;
  /* cc#1312's close-race fix travels with the pattern it fixed: a full-screen veil inserted under
     the finger mid-event can catch the SAME tap's synthesized click and close the sheet before it
     is ever seen — bind the close one frame later, so every tap AFTER this one closes it. */
  requestAnimationFrame(function(){
    if (!veil.parentNode) return;
    veil.onclick = vfSheetClose;
    var g = sheet.querySelector('.vfgrab');
    if (g) g.onclick = vfSheetClose;
  });
}

function vfSheetClose(){
  var v = document.querySelector('.vfveil'), s = document.querySelector('.vfsheet');
  if (v) v.remove();
  if (s) s.remove();
  if (VF_SHEET.open){
    document.body.style.overflow = '';
    window.scrollTo(0, VF_SHEET.scrollY);
    VF_SHEET.open = false;
    VF_SHEET.side = null;   // cc#1430: stale side must not make a later vfSort() try to re-render a closed sheet
  }
}

document.addEventListener('keydown', function(e){
  if (VF_SHEET.open && (e.key === 'Escape' || e.keyCode === 27)) vfSheetClose();
});

function vfMore(side){
  if (!VF.data) return;
  var list = VF.data[side] || [];
  if (!list.length) return;
  VF_SHEET.side = side;   // cc#1430: so vfSort() knows to re-render this sheet if its own side is re-sorted
  vfSheet('<div class="vfsh">' + (side === 'bullish' ? 'Bullish' : 'Bearish') + ' Flow · '
    + list.length + ' qualify · ' + VF.ticks + ' ticks</div>'
    + vfRows(list, 0, side)
    + '<div class="vfasof">' + esc(vfAsof()) + '</div>');
}

function vfGuide(){
  vfSheet('<div class="vfsh">How to read Volume Flow</div><div class="vfg">'
    + '<p><b>The idea.</b> Every 5 minutes is one tick. A green tick closes above its open. A red tick closes below. We add up the traded volume on each side.</p>'
    + '<p><b>Flow ratio.</b> Green volume as a share of green + red volume. 0.70 means 70% of the volume traded on rising ticks — buyers were doing the volume. The lists are ranked by this.</p>'
    + '<p><b>The two lists.</b> Bullish = 60% or more of the volume on green ticks. Bearish = 60% or more on red ticks. Names in between are noise and are left out.</p>'
    + '<p><b>DAY / WK.</b> Price change vs yesterday\'s close, and vs the close 5 trading days back.</p>'
    + '<p><b>RVOL.</b> Today\'s volume so far vs the average volume by the SAME time of day over the last 21 sessions. 2.00x means twice the typical pace. Blank while a symbol\'s profile is still building.</p>'
    + '<p><b>VOL P.</b> Yesterday\'s RVOL read at the close — one fixed number for the whole prior session. Above 1.00x means yesterday finished a heavier-than-typical day. Same maths as RVOL, just read at yesterday\'s close instead of live.</p>'
    + '<p><b>DELIV.</b> The last 3 days\' average delivered quantity vs the 20 trading days before that (windows don\'t overlap, so a fresh spike can\'t hide inside its own baseline). Above 1.00x means more shares actually changed hands for keeps — conviction, not churn. Delivery data lands after close, so this is yesterday\'s read during a live session.</p>'
    + '<p><b>Ticks filter.</b> How far back we look: 25 ≈ 2 hours, 50 ≈ 4 hours, 100 ≈ 1.3 trading days, 500 ≈ 1 week. The filter on the top card drives both lists.</p>'
    + '<p><b>Honesty.</b> This is a volume read only — we do not see the order book, so it is never called order flow. A dash means the data is missing; we never fill it in.</p>'
    + '</div>');
}

function render(){
  const m=D.mood||{};
  const gate=(m.mood||'—').toUpperCase(), fails=m.fails!=null?m.fails:'—';
  $('gatechip').textContent=`GATE · ${gate} · ${fails}F`;
  $('gatechip').className='chip '+(/BEAR/i.test(gate)?'l':/BULL/i.test(gate)?'w':'n');
  $('asof').textContent=IST().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+' IST';

  const vix=D.vix||{}, vc=vix.cur!=null?Number(vix.cur):null;
  const vlab=vc==null?'—':vc<15?'CALM':vc<20?'MODERATE':'ELEVATED';
  const adr=D.adr||{}, ar=adr.adr!=null?Number(adr.adr):null;
  const mp=D.mp&&D.mp.status==='ok'?D.mp:null;
  const pN=pcrParse(D.pcr.N), pB=pcrParse(D.pcr.B);
  const [bnL,bnC]=pcrBand(pN.cur), [bbL,bbC]=pcrBand(pB.cur);

  /* cc#1393: openF/totO/openDeck (fed THE BOOK · V10) are gone with that card — D.open itself
     stays untouched for sigCard() (SHOW_SIGNAL_TILES). */
  /* cc#1248: bl/bs/brow are gone with the two-column list they fed — buildupDeck() reads
     D.build directly and buckets by the signal the endpoint already computes. */
  const dv=(D.div&&D.div.rows||[]).slice(0,4);
  const drow=r=>`<div class="mrow"><b>${esc(r.symbol)}</b><span class="chip n" style="font-size:9px;padding:1px 6px">${esc((r.signals||[]).join(' · ')||'—')}</span><span style="flex:1"></span><span class="num" style="color:var(--muted)">${r.age_min!=null?r.age_min+'m':'—'}</span></div>`;

  $('app').innerHTML=`
  ${SHOW_SIGNAL_TILES ? `<div class="eyebrow">THE SIGNALS · V10 ST+EMA</div>
  ${sigCard('NIFTY','N')}
  ${sigCard('BANKNIFTY','B')}
  ` : ''}
  <div class="eyebrow">VOLATILITY &amp; FLOW</div>
  ${volDeck()}
  ${SHOW_VOL_TILES ? `<div class="card">
    <div class="vitals">
      <div class="vital"><div class="lb">INDIA VIX</div><div class="vv num" style="color:${vc==null?'var(--muted)':vc<15?'var(--volt)':vc<20?'var(--amber)':'var(--heat)'}">${vc!=null?vc.toFixed(2):'—'}</div><div class="sb">${vix.chg!=null?sgn(Number(vix.chg)):''} · ${vlab}</div></div>
      <div class="vital"><div class="lb">A/D · N500</div><div class="vv num" style="color:${ar==null?'var(--muted)':ar>=1?'var(--volt)':'var(--heat)'}">${ar!=null?ar.toFixed(2):'—'}</div><div class="sb">${adr.advances!=null?adr.advances+'A / '+adr.declines+'D':''}</div></div>
      <div class="vital"><div class="lb">MAX PAIN</div><div class="vv num" style="color:var(--aqua)">${mp?num(mp.max_pain_strike):'—'}</div><div class="sb" style="color:${mp?(mp.distance>=0?'var(--heat)':'var(--volt)'):'var(--muted)'}">${mp?sgn(Number(mp.distance),0)+' vs spot':'chain pending'}</div></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:14px">
      <div style="flex:1"><div style="display:flex;justify-content:space-between"><span style="font-size:10px;color:var(--muted);letter-spacing:1.5px">PCR NIFTY</span><span class="chip ${bnC}" style="font-size:9px;padding:2px 6px">${bnL}${pN.cur!=null?' '+pN.cur.toFixed(2):''}</span></div>${spark(pN.series,'#FF9F45')}</div>
      <div style="flex:1"><div style="display:flex;justify-content:space-between"><span style="font-size:10px;color:var(--muted);letter-spacing:1.5px">PCR BNK</span><span class="chip ${bbC}" style="font-size:9px;padding:2px 6px">${bbL}${pB.cur!=null?' '+pB.cur.toFixed(2):''}</span></div>${spark(pB.series,'#C8F542')}</div>
    </div>
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:6px">7-day daily PCR${(pN.gaps+pB.gaps)?` · ${pN.gaps+pB.gaps} day(s) no reading — gaps stated, never zero`:''}</div>
  </div>` : ''}

  <div class="eyebrow">STOCK F&amp;O RADAR · LIVE 5-MIN</div>
  ${buildupDeck()}
  ${SHOW_DIVERGENCE ? `<div class="card">
    <div class="grp"><h3>Fut ⇄ Equity Divergence</h3><span class="note">FLAG &gt; ±${D.div&&D.div.threshold!=null?D.div.threshold:1}%</span></div>
    ${dv.length?dv.map(drow).join(''):'<div class="unavail">No divergence signals above threshold</div>'}
  </div>` : ''}

  <div class="eyebrow">VOLUME FLOW · GREEN vs RED</div>
  <div class="card" id="vfBull"><div class="unavail">Loading volume flow…</div></div>
  <div class="card" id="vfBear"><div class="unavail">Loading volume flow…</div></div>`;
  /* render() rebuilds #app wholesale every 5 minutes, which wipes the two flow shells — repaint
     them from VF.data straight away so a refresh never blanks the cards while the fetch is out. */
  vfPaint();
}

async function boot(){ await loadAll(); render(); vPark(); uPark(); vfLoad(); }   /* cc#1242: park on the middle set before the deck is ever seen, so the first swipe left wraps instead of hitting a wall. cc#1368: VOLUME FLOW paints its placeholder with render() above, vfLoad() fills it after — the same sequencing LIVE NEWS had before it moved to the Daily Digest. cc#1393: bPark()/cPark() are gone with btrack/ctrack. */
boot();
setInterval(async()=>{ const d=IST(),m=d.getHours()*60+d.getMinutes();
  if(d.getDay()>=1&&d.getDay()<=5&&m>=555&&m<=935){ await loadAll(); render(); vfLoad(); } },300000);
</script>
