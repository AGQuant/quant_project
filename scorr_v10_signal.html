   file, v10_dashboard.html, which has no sigCard at all — checked, zero occurrences. So there is no
   shared component to scope around and no CSS selector that could leak across.
   The eyebrow goes with the tiles. Leaving "THE SIGNALS · V10 ST+EMA" over nothing would be an
   orphan heading, and the section that follows moves straight up under the header. */
var SHOW_SIGNAL_TILES = false;
/* ══ cc#1242 · THE VOLATILITY & FLOW DECK ═══════════════════════════════════════════════════
   Four cards, one gesture: MAX PAIN NIFTY -> MAX PAIN BANKNIFTY -> PIVOT NIFTY -> PIVOT BANKNIFTY.
   The old section (VIX tile, A/D tile, compact max-pain tile, the two PCR sparklines) is HIDDEN
   behind SHOW_VOL_TILES, the same shape of hide cc#1241 used an hour ago: markup kept, one line to
   restore, and no engine, endpoint, scheduler or data pipeline involved — this file is a page
   template and reads them, nothing more.
   STATE IS PER CARD BY CONSTRUCTION (the cc#1232 principle). Each card renders from its own slice
   of the payload and holds no expanded/collapsed flag at all, so there is nothing a swipe could
   carry from one card to the next. */
var SHOW_VOL_TILES = false;

/* cc#1244 · THE HELPERS TAKE A TRACK ID NOW. cc#1242 wrote them for one deck with 'vtrack' baked
   in; this card adds a second deck to the same page and 1245/1248 add more. Copying them per deck
   is how a page ends up with four dialects of one gesture, so the state moves into a registry and
   the functions take an id. Adding a deck is now one DK entry and one wrapper, not forty lines.
   (The wider duplication — these helpers also exist page-local in scorr_digest_mobile.html — still
   wants a shared module. That is raised in the forum as its own card, not smuggled in here.) */
var DK = { vtrack:{dots:'vdots', n:0, tmr:null}, btrack:{dots:'bdots', n:0, tmr:null},
           ctrack:{dots:'cdots', n:0, tmr:null}, utrack:{dots:'udots', n:0, tmr:null} };
var VDECK = 0;   /* kept: cc#1242's volDeck() assigns it, and it mirrors DK.vtrack.n */
/* PITCH COMES FROM LAYOUT OFFSETS, NOT FROM A MEASURED WIDTH PLUS THE GAP, and cc#1245 is where
   that stopped being academic. getBoundingClientRect().width returns a SUB-PIXEL number — 324.484
   here — so width+gap gave a pitch of 333.484 against a true layout pitch of 333. Under a pixel per
   page, and invisible on a 2-card deck. The closed book has ELEVEN pages: parking at n*pitch landed
   3,668 where page 11 actually starts at 3,697, so the deck rested 29px off its own boundary and
   the next page's chips showed at the card edge. offsetLeft is the integer position the browser
   actually laid the page out at, so consecutive offsets give the pitch exactly and nothing
   accumulates. The same width+gap pattern sits in scorr_digest_mobile.html's deckPitch; its decks
   are small enough that the drift stays under two pixels, but it is the same latent bug and it is
   named in the forum rather than left for the next long deck to find. */
function dkPitch(tr){
  var k = tr.children;
  if(k.length > 1) return Math.max(1, k[1].offsetLeft - k[0].offsetLeft);
  if(!k.length) return Math.max(1, tr.clientWidth);
  var cs = getComputedStyle(tr), gap = parseFloat(cs.columnGap || cs.gap || 0) || 0;
  return Math.max(1, k[0].getBoundingClientRect().width + gap);
}
/* offsetLeft is relative to the OFFSET PARENT, not to the scroll container, so it carries a
   constant ancestor offset (14px here, the track's own margin). The DELTA between two pages is
   still exact — that is what dkPitch uses — but the absolute value is not a scroll position.
   Subtracting the first page's offset converts it into one. Measured: parking by the raw offset
   left every deck 14px short of its own boundary; this lands all three exactly. */
function dkAt(tr, i){
  var k = tr.children;
  if(!k.length) return 0;
  var el = k[i];
  return el ? (el.offsetLeft - k[0].offsetLeft) : i * dkPitch(tr);
}
function dkDots(id){
  var d = DK[id]; if(!d) return 0;
  var tr = document.getElementById(id), dots = document.getElementById(d.dots);
  if(!tr || !dots || !d.n) return 0;
  var w = dkPitch(tr), i = Math.round(tr.scrollLeft / w) % d.n;
  Array.prototype.forEach.call(dots.children, function(el, j){
    el.className = (j === i ? 'on' : '');
    el.onclick = function(){
      var cur = Math.round(tr.scrollLeft / w), t = cur - (cur % d.n) + j;
      tr.scrollTo({left: dkAt(tr, t), behavior:'smooth'});
    };
  });
  return i;
}
/* the triple-set wrap, same as the digest decks: three copies of the card set and a silent jump
   back to the middle one, so a swipe never hits a wall in either direction. */
function dkWrap(id){
  var d = DK[id]; if(!d) return;
  dkDots(id);
  if(d.tmr) clearTimeout(d.tmr);
  d.tmr = setTimeout(function(){
    var tr = document.getElementById(id);
    if(!tr || !d.n) return;
    var w = dkPitch(tr), i = Math.round(tr.scrollLeft / w);
    var to = (i < d.n) ? i + d.n : (i >= 2 * d.n) ? i - d.n : -1;
    if(to >= 0) tr.scrollTo({left: dkAt(tr, to), behavior:'auto'});
  }, 90);
}
function dkPark(id){
  var d = DK[id]; if(!d) return;
  var tr = document.getElementById(id);
  /* park ON the middle set's first page by its own offsetLeft rather than by arithmetic, so the
     rest position is exactly where the browser laid that page out. */
  if(tr && d.n) tr.scrollTo({left: dkAt(tr, d.n), behavior:'auto'});
  dkDots(id);
}
function vWrap(){ dkWrap('vtrack'); }
function vPark(){ dkPark('vtrack'); }
function bWrap(){ dkWrap('btrack'); }
function bPark(){ dkPark('btrack'); }

/* ── as-of honesty (scope 5) ────────────────────────────────────────────────────────────────
   The chain tick is a NAIVE IST timestamp (the cc#844 class of bug: subtracting a UTC now() from
   it invents a 330-minute offset), so nothing here computes an age in minutes. It compares DATES
   only and says plainly whether the chain predates the last session. option_chain held ZERO rows
   for 21-Aug — the outage cc#1233 is about — so on a page opened today this stamp reads stale, and
   that is the correct reading rather than a defect. */
function chainAsOf(tick){
  if(!tick) return {txt:'chain tick unknown', stale:true};
  var d = String(tick).slice(0, 10), t = String(tick).slice(11, 16);
  var today = IST().toISOString().slice(0, 10);
  return {txt:'OI as of ' + d + (t ? ' ' + t : '') + ' IST', stale:(d < today), day:d};
}
function oiUnavail(name, why){
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Max Pain ' + esc(name) + '</h3></div>'
    + '<div class="unavail">' + esc(why) + '</div></div></div>';
}

/* ── the histogram, spec 6055 section 7 ─────────────────────────────────────────────────── */
function oiCard(name, oi, mp){
  if(!oi || oi.status === 'no_data' || !(oi.strikes || []).length)
    return oiUnavail(name, 'No option chain for this expiry yet — nothing is drawn in its place.');
  var rows = oi.strikes, mpStrike = (mp && mp.status === 'ok') ? Number(mp.max_pain_strike) : null;
  /* cc#1354 · one-sided tick (26-Aug: NIFTY PE feed gap). The server flags it; the card
     keeps drawing the side that exists, suppresses the dead side's WALL tag, axis label and
     footer value (they would be fabricated — the wall reduce() lands on rows[0] when a side
     is all zeros), and states the gap in one line. Identical in both oiCard twins. */
  var peDead = oi.one_sided === 'PE_MISSING', ceDead = oi.one_sided === 'CE_MISSING';
  /* cc#1355 · change since open + PCR (session_log 32043). Bar HEIGHT stays the OI level;
     BRIGHTNESS carries the change: building = full + glow, quiet = .55, unwinding = .35. A bar
     with no delta (no 09:20 baseline row, or a side dead in either tick) keeps the stylesheet
     default — no signal is not a signal. Delta labels go only on the top 3 movers per side over
     a threshold chosen from live data (26-Aug session: median |chg| 325 = noise, top real mover
     42.5k, walls at 55L): label th = max(25k, 2% of side max OI), classify th = max(10k, 0.5%). */
  var CE_COL = 'var(--heat)', PE_COL = 'var(--volt)';
  var hasCh = rows.some(function(r){ return r.ce_chg != null || r.pe_chg != null; });
  var maxCe = Math.max.apply(null, rows.map(function(r){ return r.call_oi || 0; })) || 1;
  var maxPe = Math.max.apply(null, rows.map(function(r){ return r.put_oi || 0; })) || 1;
  var thLab = { ce: Math.max(25000, .02 * maxCe), pe: Math.max(25000, .02 * maxPe) };
  var thCls = { ce: Math.max(10000, .005 * maxCe), pe: Math.max(10000, .005 * maxPe) };
  var bri = function(chg, th, glow){
    if(!hasCh || chg == null) return '';
    if(chg >= th)  return 'opacity:1;box-shadow:0 0 8px ' + glow + ';';
    if(chg <= -th) return 'opacity:.35;';
    return 'opacity:.55;';
  };
  var fCh = function(v){ var a = Math.abs(v), s = v > 0 ? '+' : '-';
    return s + (a >= 1e5 ? (a / 1e5).toFixed(1) + 'L' : a >= 1e3 ? Math.round(a / 1e3) + 'k' : String(a)); };
  var peak = Math.max.apply(null, rows.map(function(r){ return Math.max(r.call_oi || 0, r.put_oi || 0); })) || 1;
  var callWall = rows.reduce(function(a, b){ return (b.call_oi || 0) > (a.call_oi || 0) ? b : a; }, rows[0]);
  var putWall  = rows.reduce(function(a, b){ return (b.put_oi  || 0) > (a.put_oi  || 0) ? b : a; }, rows[0]);
  var cols = rows.map(function(r){
    var isMp = (mpStrike != null && Number(r.strike) === mpStrike);
    return '<div class="oic' + (isMp ? ' mp' : '') + '" title="' + r.strike + '">'
      + '<div class="up"><i style="height:' + (100 * (r.call_oi || 0) / peak).toFixed(1) + '%;'
      +   (isMp ? '' : bri(r.ce_chg, thCls.ce, CE_COL)) + '"></i></div>'
      + '<div class="oiax"></div>'
      + '<div class="dn"><i style="height:' + (100 * (r.put_oi || 0) / peak).toFixed(1) + '%;'
      +   (isMp ? '' : bri(r.pe_chg, thCls.pe, PE_COL)) + '"></i></div>'
      + '</div>';
  }).join('');
  /* the dashed spot line, placed by interpolating spot across the rendered strike span rather than
     snapped to the nearest column — snapping would draw spot ON a strike it is not at. */
  var lo = Number(rows[0].strike), hi = Number(rows[rows.length - 1].strike), spotLine = '';
  if(oi.spot != null && hi > lo){
    var f = Math.max(0, Math.min(1, (Number(oi.spot) - lo) / (hi - lo)));
    spotLine = '<div class="oispot" style="left:' + (f * 100).toFixed(2) + '%"></div>';
  }
  /* the two wall tags, placed on their own columns. The x of column i is the centre of its share
     of the track, which is (i + 0.5) / count — not i / count, or every tag would sit a half-column
     left of the bar it names. */
  var cwI = rows.indexOf(callWall), pwI = rows.indexOf(putWall), tags = '';
  var colPct = function(i){ return (100 * (i + 0.5) / rows.length).toFixed(2); };
  /* cc#1355 · one word of change on the wall itself, and delta labels on the top movers */
  var wallWord = function(w, key, th){
    if(!hasCh || !w || w[key] == null) return '';
    return w[key] >= th ? ' · building' : (w[key] <= -th ? ' · fading' : '');
  };
  if(cwI >= 0 && !ceDead) tags += '<div class="oiwall cw" style="left:' + colPct(cwI) + '%">CALL WALL'
    + wallWord(callWall, 'ce_chg', thCls.ce) + '</div>';
  if(pwI >= 0 && !peDead) tags += '<div class="oiwall pw" style="left:' + colPct(pwI) + '%">PUT WALL'
    + wallWord(putWall, 'pe_chg', thCls.pe) + '</div>';
  if(hasCh){
    [['ce_chg', thLab.ce, 'ce'], ['pe_chg', thLab.pe, 'pe']].forEach(function(sd){
      rows.map(function(r, i){ return { i: i, c: r[sd[0]] }; })
          .filter(function(m){ return m.c != null && Math.abs(m.c) >= sd[1]; })
          .sort(function(a, b){ return Math.abs(b.c) - Math.abs(a.c); })
          .slice(0, 3)
          .forEach(function(m){
            tags += '<span class="oichg ' + sd[2] + '" style="left:' + colPct(m.i) + '%">' + fCh(m.c) + '</span>';
          });
    });
  }
  /* cc#1261 · the three strikes that carry meaning, printed under the bars they belong to.
     TWO WAYS THIS GETS UGLY AND BOTH ARE HANDLED. The max pain strike is very often ALSO the call
     or put wall, which would stack two labels on one column — so a strike already claimed is
     skipped rather than drawn twice. And when two of the three sit on neighbouring columns the
     numbers collide into an unreadable smear, so a label closer than 18% of the track to the one
     before it is dropped. Fewer, legible labels beat three that overlap; the readout line below
     still carries all three numbers, so nothing is lost by dropping one from the axis. */
  var mpI = mpStrike == null ? -1 : rows.findIndex(function(r){ return Number(r.strike) === mpStrike; });
  var picked = [], xs = '';
  [[peDead ? -1 : pwI, 'pw'], [mpI, 'mp'], [ceDead ? -1 : cwI, 'cw']].forEach(function(p){
    if(p[0] < 0) return;
    var v = Number(rows[p[0]].strike);
    for(var k = 0; k < picked.length; k++) if(picked[k].v === v) return;   /* same strike twice */
    picked.push({ i: p[0], v: v, cls: p[1] });
  });
  picked.sort(function(a, b){ return a.i - b.i; });
  var lastPct = null;
  picked.forEach(function(q){
    var pct = Number(colPct(q.i));
    if(lastPct != null && Math.abs(pct - lastPct) < 18) return;            /* too close to read */
    lastPct = pct;
    var edge = pct < 8 ? ' lo' : (pct > 92 ? ' hi' : '');
    var pos = edge ? '' : ' style="left:' + pct.toFixed(2) + '%"';
    xs += '<span class="oix ' + q.cls + edge + '"' + pos + '>' + num(q.v) + '</span>';
  });
  xs = xs ? '<div class="oixs">' + xs + '</div>' : '';
  var ao = chainAsOf(oi.chain_tick);
  /* cc#1355 · the as-of line carries the whole context: tick · vs open · PCR (32043) */
  /* cc#1361 · short stamp: '26-Aug 15:35 · vs 09:20 · PCR 1.05' (founder 08:43) — falls back to
     the long chainAsOf text only when the tick is missing entirely. */
  var aoTxt = (function(){
    var t = String(oi.chain_tick || '');
    if(t.length < 16) return ao.txt;
    var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return parseInt(t.slice(8, 10), 10) + '-' + (M[parseInt(t.slice(5, 7), 10) - 1] || '') + ' ' + t.slice(11, 16);
  })()
    + (oi.baseline_tick && hasCh ? ' · vs ' + String(oi.baseline_tick).slice(11, 16) : '')
    + (oi.pcr != null ? ' · PCR ' + Number(oi.pcr).toFixed(2) : '');
  var story = '';
  if(hasCh){
    /* cc#1363 · plain-words read after the fact (session_log 32095, phrases VERBATIM). A read is
       flow description, never prediction, and it gates harder than the fact: the fact renders at
       the classify threshold, the read only at the LABEL threshold (thLab), only when the side's
       deltas exist at all (hasCh/one_sided already decide that), and a BUILD read additionally
       needs its strike on the writers' side of spot — CE above, PE below; 32095 defines no phrase
       for the other positions, so none is invented. When BOTH outer builds earn their read in one
       tick, the two reads collapse into the single range read at the line's end. */
    var READS = { ceB: 'resistance forming — cautious', peB: 'support forming — bullish',
                  ceU: 'ceiling weakening — bullish tilt', peU: 'floor weakening — bearish tilt',
                  range: 'range forming — sellers boxing both sides' };
    var spotN = oi.spot != null ? Number(oi.spot) : null;
    var sideBits = function(key, wall, thC, thL, isCe){
      var mv = rows.filter(function(r){ return r[key] != null; });
      if(!mv.length) return null;
      var bld = mv.reduce(function(a, b){ return b[key] > a[key] ? b : a; });
      var unw = mv.reduce(function(a, b){ return b[key] < a[key] ? b : a; });
      var o = { bTxt: '', uTxt: '', bRead: false, uRead: false };
      if(bld[key] >= thC){
        o.bTxt = 'build ' + num(bld.strike) + ' ' + fCh(bld[key]);
        o.bRead = bld[key] >= thL && spotN != null
          && (isCe ? Number(bld.strike) > spotN : Number(bld.strike) < spotN);
      }
      if(unw[key] <= -thC){
        o.uTxt = 'unwind ' + num(unw.strike) + ' ' + fCh(unw[key])
          + (wall && Number(unw.strike) === Number(wall.strike) ? ' — wall weakening' : '');
        o.uRead = -unw[key] >= thL;
      }
      return (o.bTxt || o.uTxt) ? o : null;
    };
    var ce = ceDead ? null : sideBits('ce_chg', callWall, thCls.ce, thLab.ce, true);
    var pe = peDead ? null : sideBits('pe_chg', putWall, thCls.pe, thLab.pe, false);
    var rangeOn = !!(ce && pe && ce.bRead && pe.bRead);
    var sideTxt = function(label, o, bWord, uWord){
      if(!o) return '';
      var bits = [];
      if(o.bTxt) bits.push(o.bTxt + (o.bRead && !rangeOn ? ' · ' + bWord : ''));
      if(o.uTxt) bits.push(o.uTxt + (o.uRead ? ' · ' + uWord : ''));
      return bits.length ? label + ' ' + bits.join(' · ') : '';
    };
    var st = [sideTxt('calls', ce, READS.ceB, READS.ceU),
              sideTxt('puts', pe, READS.peB, READS.peU)]
             .filter(Boolean).join(' &nbsp;·&nbsp; ')
             + (rangeOn ? ' &nbsp;·&nbsp; ' + READS.range : '');
    if(st) story = '<div class="oird">' + st + '</div>';
  } else if(oi.baseline_tick == null && !oi.one_sided){
    /* 32043 honesty rule 3: no baseline -> deltas omitted AND the card says so */
    story = '<div class="oird">no 09:20 baseline this session — OI change hidden</div>';
  }
  var basis = oi.spot_basis === 'live' ? 'live' : 'prev close';
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Max Pain ' + esc(name) + '</h3>'
    + '<span class="asof oiasof' + (ao.stale ? ' stale' : '') + '">' + esc(aoTxt) + '</span></div>'
    + '<div class="oib">' + cols + spotLine + tags + '</div>'
    + xs
    /* cc#1261 · NUMBERS ONLY, ONE LINE. The commentary sentence is gone and the <br> that split
       the readout in two goes with it: the founder asked for the key numbers, not a paragraph
       under them, and MP / spot / put wall / call wall / expiry is the whole of what he reads.
       THE STALENESS SIGNAL DID NOT NEED BUILDING - the as-of stamp top-right already carries
       .stale, and .asof.stale is already amber, so removing the sentence loses no information at
       all. It was saying in a sentence what the stamp beside it was already saying in a colour,
       and the sentence additionally hardcoded a date ("21-Aug has no rows at all") that would
       have gone stale and started lying on its own. */
    /* cc#1361 · footer, founder 08:43: line 1 = the facts one step larger (expiry dropped from
       the card face — it lives in Index Intel), line 2 = the cc#1355 story, then the shortened
       gap note only on a one-sided tick. Em-dash honesty (cc#1354) unchanged. */
    + '<div class="oird oifacts">'
    + 'MP <b class="num">' + (mpStrike != null ? num(mpStrike) : '—') + '</b>'
    + ' · spot <b class="num">' + (oi.spot != null ? num(oi.spot) : '—') + '</b><span style="font-size:.8em"> (' + basis + ')</span>'
    + ' · PW <b class="num">' + (peDead ? '—' : num(putWall.strike)) + '</b>'
    + ' · CW <b class="num">' + (ceDead ? '—' : num(callWall.strike)) + '</b>'
    + '</div>'
    + story
    + (oi.one_sided ? '<div class="oird" style="color:var(--amber,#f5b94a)">'
        + (peDead ? 'puts' : 'calls') + ' absent this tick</div>' : '')
    + '</div></div>';
}

/* ── the pivot ladder ───────────────────────────────────────────────────────────────────── */
function pivRow(lbl, v, cls){
  return '<div class="prg' + (cls ? ' ' + cls : '') + '"><span class="rl">' + esc(lbl) + '</span>'
    + '<span class="rv">' + (v != null ? num(v) : '—') + '</span></div>';
}
function pivCard(name, row, cmp){
  if(!row) return '<div class="vpage"><div class="card"><div class="grp"><h3>Pivot Range ' + esc(name)
    + '</h3></div><div class="unavail">No stored pivot row for this index.</div></div></div>';
  /* the CMP marker is placed BETWEEN the rungs it actually sits between, so the ladder reads as a
     map rather than a list with a number bolted on the end. */
  /* cc#1257 · ASCENDING BY VALUE, rule 29630 — supports on top, because that is the order people
     read numbers in. This card cannot inherit the digest payload: it is built from a flat row
     (row.r2, row.r1, …) off a different endpoint, not from a rungs array. So it applies THE SAME
     RULE rather than a copied list — sort by value. That matters: a hardcoded
     ['S2','S1','PP','R1','R2'] here would be a second ordering able to drift away from the
     digest's, and expressing the rule instead of the result is what keeps the two in step without
     anything to remember.
     THE CMP TEST FLIPS WITH THE ORDER, and it would be an easy thing to miss. Descending, CMP went
     before the first level at or BELOW it. Ascending, it goes before the first level ABOVE it —
     the same "between the levels it really sits between", read from the other end. Leaving the old
     comparison in place would have quietly parked the price at the wrong rung on every card. */
  var rungs = [['R2', row.r2], ['R1', row.r1], ['PP', row.pp], ['S1', row.s1], ['S2', row.s2]]
                .filter(function(r){ return r[1] != null; })
                .sort(function(a, b){ return Number(a[1]) - Number(b[1]); });
  var html = '', placed = false;
  rungs.forEach(function(r){
    if(!placed && cmp != null && Number(cmp) <= Number(r[1])){
      html += pivRow('CMP', cmp, 'cmp'); placed = true;
    }
    html += pivRow(r[0], r[1], r[0] === 'PP' ? 'pp' : '');
  });
  if(!placed && cmp != null) html += pivRow('CMP', cmp, 'cmp');
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Pivot Range ' + esc(name) + '</h3>'
    + '<span class="asof">' + esc(row.pivot_date || '—') + '</span></div>'
    + '<div class="plad">' + html + '</div></div></div>';
}

function volDeck(){
  var pv = D.piv, list = Array.isArray(pv) ? pv : ((pv && (pv.rows || pv.data)) || []);
  var byS = {};
  list.forEach(function(r){ if(r && r.symbol) byS[String(r.symbol).toUpperCase()] = r; });
  var cards = [
    oiCard('NIFTY', D.oi.N, D.mp),
    oiCard('BANKNIFTY', D.oi.B, D.mpB),
    pivCard('NIFTY', byS.NIFTY50, (D.lm.N || {}).cmp),
    pivCard('BANKNIFTY', byS.BANKNIFTY, (D.lm.B || {}).cmp)
  ];
  VDECK = DK.vtrack.n = cards.length;
  var set = cards.join('');
  var dots = cards.map(function(_, j){ return '<i class="' + (j ? '' : 'on') + '"></i>'; }).join('');
  return '<div class="vswipe"><div class="vswipe-t" id="vtrack" onscroll="vWrap()">'
       + set + set + set + '</div><div class="vdots" id="vdots">' + dots + '</div></div>';
}

/* ══ cc#1244 · THE OPEN BOOK, AND THE EMPTY GREEN CHIPS ═════════════════════════════════════
   THE ROOT CAUSE OF THE EMPTY CHIP, named with the line. The old row wrote:
       <span class="chip ${(p.direction==='SHORT')?'l':'w'}">${esc(p.direction||'')}</span>
   /api/v10/positions serves v10_st_ema.get_open_positions(), whose SELECT is
       "SELECT symbol, leg, side, entry_price, entry_ts, stop, target, lot_size, opt_strike,
        opt_type, opt_expiry FROM v10_positions WHERE status='OPEN'"
   There is no `direction` column and the payload has never carried one — the field is `side`,
   BUY or SELL. So p.direction was undefined on every row, which did TWO things at once and that
   is why it looked like a styling bug rather than a data one: the text resolved to '' via
   (undefined || ''), and the class fell through the ternary to 'w', which is the GREEN chip.
   An empty green box, on every open row, exactly as photographed. Confirmed against the live
   table: all four open legs carry side BUY/SELL and no direction.

   WHERE ELSE THE SAME PATTERN IS USED ON THIS PAGE — I grepped rather than assumed. Three chip
   sites exist: this one, the WR chip in the closed header, and the reason chip on each closed row.
   The other two read `wr` (a number computed right above them) and `t.reason` (defaulted to
   'EXIT'), so they always have text, and the closed rows read t.direction from paired_trades,
   which DOES emit direction — v10_endpoints.paired_trades line 85 sets it from the FUT leg's side.
   So the open-row chip was the only genuinely empty one, and the fix is to read the field that
   exists. sigCard carried the identical `pos.direction` bug; it is hidden by cc#1241 but the
   helper below is written so the value comes from one place if it ever comes back.

   THE DECK: two cards BY INSTRUMENT per the founder's 17:02 revision, not per index. Card 1 holds
   both futures legs, card 2 both option legs, each with its own combined uP&L in the header.
   Per-card state cannot leak on swipe because there is none — each card renders from its own
   filtered slice and holds no flag (the cc#1232 principle, made structural rather than managed). */
/* ══ cc#1245 · THE CLOSED BOOK, PAGED THROUGH THE WHOLE HISTORY ═════════════════════════════
   THE SCOPE 4 GATE DOES NOT TRIP AND NO READ PATH NEEDED EXTENDING. The page already fetches
   /api/v10/trades/paired?limit=200 and the closed book is 52 trades, so the FULL history has been
   sitting in the client all along — `cl.slice(0,5)` was throwing 47 of them away after they had
   already been downloaded. Paging is pure presentation here; nothing about the endpoint or the
   engine is touched. 52 at 5 a page is 11 pages, which is exactly the "1/11" the card predicted.

   WHAT FUT/OPT CAN MEAN HERE, CHECKED AGAINST THE DATA RATHER THAN ASSUMED. A row in this list is
   a PAIRED trade (cc#941): a futures position plus an optional written hedge, grouped on
   (symbol, entry_ts). Counted on the live table: 52 trades, 43 carrying a hedge leg, 9 futures
   only, and ZERO with no futures leg. So there is no such thing as an option-only trade in this
   book, and the only split the data actually supports is hedged vs unhedged — which partitions
   cleanly, 9 + 43 = 52, and gives both buttons something real to do. FUT shows the 9 that ran
   naked, OPT the 43 that carried a written leg. Stated on the card thread rather than left to be
   inferred from the counts.

   FILTER STATE IS PER PAGE-LOAD by construction: CL_FILTER is a module global set only by a tap,
   so leaving the page and coming back re-runs boot() and it is back to ALL. */
/* ══ cc#1247 · PERFORMANCE, PER SEGMENT ═════════════════════════════════════════════════════
   THE SCOPE 3 GATE DOES NOT TRIP. /api/v10/performance already served by_symbol and by_leg, but
   each carried only trades / wins / pnl — no win rate and no profit factor per cut. Adding them is
   READ-PATH AGGREGATION: two more aggregate columns on queries that already grouped exactly these
   rows, struck with the SAME formulas the overall card uses. No engine logic, no new table, no
   changed definition. v10_st_ema._cut_stats is where it lives.

   THE SEGMENTS ARE LEG ROWS, NOT PAIRED TRADES, and that is why the counts add up the way they do.
   v10_trades stores one trade as up to two rows, so ALL is 95 legs: NIFTY50 49 + BANKNIFTY 46 = 95,
   and FUT 52 + OPT 43 = 95. Both cuts partition the same 95 rows two different ways. The card's own
   ALL figures (95 / 49.5% / 1.59) are unchanged because they are read from exactly the same total
   block as before.

   EM-DASH, NEVER A FABRICATED ZERO. A segment with no trades has no win rate — 0.0% would read as
   "lost every trade" rather than "has none" — and a segment that has never taken a loss has no
   profit factor, because the denominator is zero rather than small. The endpoint returns null for
   both and this renders an em-dash. */
/* ══ cc#1248 · FUTURES BUILDUP, FOUR CARDS ══════════════════════════════════════════════════
   THE SCOPE 3 GATE DOES NOT TRIP AND NOTHING WAS EXTENDED. /api/v10/buildup already classifies all
   four states in its own _row() — LONG_BUILD, SHORT_BUILD, SHORT_COVER, LONG_UNWIND — and already
   serves every column R1 asks for: symbol, price, day_1d, oi_chg, vol_ratio (populated since
   cc#819 bug_2) and basis, plus an oi_feed_pending flag. The only change is the limit above.

   THE OI-PENDING RULE IS KEPT AND IT MATTERS THAT IT IS NOT NEEDED TODAY. The endpoint classifies
   ONLY when oi_chg is present and returns NEUTRAL otherwise, so a symbol can never be labelled a
   buildup state on price alone. Counted on the live table for the latest session: 208 symbols, 208
   with oi_chg. So oi_feed_pending is false and every badge below is earned. When the feed does drop
   the header says so and the four cards go honestly empty rather than re-classifying on price.

   DELTA BASIS. The endpoint anchors day% on the PREVIOUS SESSION's futures close, and the two
   sessions here are 19-Aug and 20-Aug. There is no 21-Aug row in futures_basis at all — the same
   outage cc#1233 covers — so the anchor steps back to a real session rather than bridging a missing
   day. The as-of line prints the session it actually read.

   Card order is the founder's, locked in R1 @ 31d9a02, and it is NOT the order the enum happens to
   produce: long buildup, short covering, short buildup, long unwinding. */
var SHOW_DIVERGENCE = false;
var BU_STATES = [
  {k:'LONG_BUILD',  t:'LONG BUILDUP',   sub:'PRICE UP · OI UP',     cls:'w', mark:'▲'},
  {k:'SHORT_COVER', t:'SHORT COVERING', sub:'PRICE UP · OI DOWN',   cls:'w', mark:'▲'},
  {k:'SHORT_BUILD', t:'SHORT BUILDUP',  sub:'PRICE DOWN · OI UP',   cls:'l', mark:'▼'},
  {k:'LONG_UNWIND', t:'LONG UNWINDING', sub:'PRICE DOWN · OI DOWN', cls:'l', mark:'▼'}
];
function buRows(k){
  var bd = D.build || {};
  /* the two slices overlap, so dedupe by symbol before bucketing — otherwise a symbol appearing in
     both lists would be counted twice inside its own state. */
  var seen = {}, all = [];
  (bd.long_buildup || []).concat(bd.short_buildup || []).forEach(function(r){
    if (r && r.symbol && !seen[r.symbol]) { seen[r.symbol] = 1; all.push(r); }
  });
  return all.filter(function(r){ return r.signal === k; })
            .sort(function(a, b){ return Math.abs(b.day_1d || 0) - Math.abs(a.day_1d || 0); })
            .slice(0, 5);
}
function buNum(v, dp, suffix, colour){
  if (v === null || v === undefined) return '<td>—</td>';
  var n = Number(v);
  var cls = colour ? (n > 0 ? ' class="up"' : n < 0 ? ' class="dn"' : '') : '';
  return '<td' + cls + '>' + (colour && n > 0 ? '+' : '') + n.toFixed(dp) + (suffix || '') + '</td>';
}
function buCard(st){
  var rows = buRows(st.k), bd = D.build || {};
  var body;
  if (bd.oi_feed_pending){
    /* the 6055 rule, literally: with OI pending there IS no buildup state, so nothing is classified
       and the card says why instead of showing a price-only list under a buildup badge. */
    body = '<div class="unavail">OI feed pending — buildup state needs open interest, and it is not '
         + 'being guessed from the price move.</div>';
  } else if (!rows.length){
    body = '<div class="unavail">No ' + esc(st.t.toLowerCase()) + ' on this session.</div>';
  } else {
    body = '<table class="butbl"><thead><tr><th>SYMBOL</th><th>FUT</th><th>DAY%</th>'
      + '<th>OI Δ</th><th>VOL×</th><th>BASIS</th></tr></thead><tbody>'
      + rows.map(function(r){
          return '<tr><td class="sym">' + esc(r.symbol) + '</td>'
            + '<td>' + (r.price != null ? num(r.price) : '—') + '</td>'
            + buNum(r.day_1d, 2, '%', true)
            + (r.oi_chg == null ? '<td>—</td>'
               : '<td class="' + (r.oi_chg > 0 ? 'up' : r.oi_chg < 0 ? 'dn' : '') + '">'
                 + (r.oi_chg > 0 ? '+' : '') + fK(r.oi_chg) + '</td>')
            + (r.vol_ratio == null ? '<td>—</td>'
               : '<td class="am">' + Number(r.vol_ratio).toFixed(1) + '×</td>')
            + buNum(r.basis, 1, '', true)
            + '</tr>';
        }).join('') + '</tbody></table>';
  }
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>Futures Buildup</h3>'
    + '<span class="asof">' + esc(bd.session || 'LIVE 5-MIN') + '</span></div>'
    + '<div class="bustate"><span class="chip ' + st.cls + ' bubadge">' + st.mark + ' ' + st.t + '</span>'
    + '<span class="busub">' + st.sub + '</span></div>'
    + body + '</div></div>';
}
function buildupDeck(){
  var cards = BU_STATES.map(buCard);
  DK.utrack.n = cards.length;
  var set = cards.join('');
  var dots = cards.map(function(_, j){ return '<i class="' + (j ? '' : 'on') + '"></i>'; }).join('');
  /* the eyebrow stays in the page template where it always was — emitting it here as well is how
     the combined render came back with STOCK F&O RADAR twice. */
  return '<div class="vswipe"><div class="vswipe-t" id="utrack" onscroll="uWrap()">'
       + set + set + set + '</div><div class="rpager"><div class="vdots" id="udots">' + dots + '</div>'
       + '<span class="clpg" id="upg">1 / 4 · LONG BUILDUP</span></div></div>';
}
function uLabel(i){
  var el = document.getElementById('upg'), st = BU_STATES[i || 0];
  if (el && st) el.textContent = ((i || 0) + 1) + ' / ' + BU_STATES.length + ' · ' + st.t;
}
function uWrap(){ dkWrap('utrack'); uLabel(dkDots('utrack')); }
function uPark(){ dkPark('utrack'); uLabel(dkDots('utrack')); }

/* ══ cc#1264 · THE RECORD — the closed book and its stats, MERGED INTO ONE CARD ═════════════
   This replaces two cards that had been telling one story badly. cc#1245 built a Closed list with
   its own ALL/FUT/OPT chips; cc#1247 built a Performance card with its own ALL/NIFTY/BANKNIFTY/
   FUT/OPT chips. Two chip rows, two selections, two subtitles — and nothing stopping the page from
   showing OPTIONS stats above a list filtered to FUT. R2 makes them one card with one control.

   ONE STATE, AND IT IS ONE VARIABLE. RC_SEG drives the chips, the stat strip, the trade list and
   the subtitle together. There is no second selection to fall out of step with the first, which is
   the structural version of the fix rather than the managed one: nothing has to be remembered to
   keep them in sync, because there is only one thing to remember.

   THE STRIP AND THE LIST READ THE SAME PAYLOAD. /api/v10/trades/legs returns the rows AND the
   per-segment stats folded over exactly those rows, so a strip saying 43 trades sits above a list
   holding 43. The old Performance card read /api/v10/performance, which cuts over ALL of
   v10_trades with no exit_ts filter — the same numbers today only because nothing is open.

   SEGMENT STATE IS PER PAGE-LOAD by construction, as before: RC_SEG is a module global set only by
   a tap, so leaving and returning re-runs boot() and it is back to ALL.

   THE DECK ID STAYS ctrack. It is the same deck doing the same job with different rows inside it,
   so it keeps its DK entry, its dots and its scroll wrappers rather than acquiring a fourth
   near-identical copy of the paging machinery. */
var RC_SEGS  = ['ALL','NIFTY','BANKNIFTY','FUT','OPT'];
var RC_SEG   = 'ALL';
var RC_PER   = 5;
var RC_PAGES = 0;

/* cc#1263's rule, unchanged and now used by both halves of the card: the leg column classifies,
   and nothing else does. NIFTY and BANKNIFTY are SYMBOL cuts and FUT/OPT are LEG cuts, so the two
   pairs partition the same 95 rows two different ways — 49+46 and 52+43 both come to 95. */
function rcLeg(t){ return String(t && t.leg || 'FUT').toUpperCase(); }
function rcMatch(t, k){
  if (k === 'NIFTY')     return t.symbol === 'NIFTY50';
  if (k === 'BANKNIFTY') return t.symbol === 'BANKNIFTY';
  if (k === 'FUT' || k === 'OPT') return rcLeg(t) === k;
  return true;                                   /* ALL */
}
function rcList(){ return (D.closed || []).filter(function(t){ return rcMatch(t, RC_SEG); }); }
function rcStat(k){ return (D.stats || {})[k] || {}; }

/* ── number faces, per R2 scope 6 ──────────────────────────────────────────────────────────
   THE SIGN IS ALWAYS DRAWN ON A P&L, including a positive one. A bare "₹13,419" beside a bare
   "₹5,762" makes the reader lean on the colour alone to tell a win from a loss, and colour is the
   one channel that does not survive a screenshot, a colour-blind reader or a bright phone outdoors.
   PRICES GET TWO DECIMALS AND en-IN GROUPING, which is why an option premium comes out 177.00 and
   61.25 with no separator while an index price comes out 24,303.70 with one — the same rule
   applied to numbers of different size, not two rules. */
function rcMoney(v){
  if (v == null) return '—';
  var n = Number(v);
  return (n < 0 ? '−' : '+') + '₹' + num(Math.abs(n));
}
function rcBig(v){
  if (v == null) return '—';
  var n = Number(v);
  return (n < 0 ? '−' : '+') + '₹' + fK(Math.abs(n));
}
function rcPrice(v){
  if (v == null) return '—';
  return Number(v).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
/* "19-Aug 15:15" -> "19-Aug". The journey line carries the DAY on each end; the minute belongs to
   a trade detail, not to a five-row glance. */
function rcDay(s){ return String(s || '').slice(0, 6); }

function rcNote(){
  /* the subtitle names the basis, always. cc#1190 shipped a card whose heading said ALL over
     filtered numbers; a subtitle that does not move when the selection does is that same lie. */
  return 'LIVE PAPER · CLOSED LEGS' + (RC_SEG === 'ALL' ? '' : ' · ' + RC_SEG);
}

function rcChips(){
  /* counts come from the endpoint's own fold over the rows it shipped in the same response, so a
     chip cannot disagree with the list behind it — the cc#1263 failure, made impossible rather
     than fixed. A segment the payload does not carry shows an em-dash, never a 0. */
  var c = D.counts || {};
  return '<div class="clchips pfchips">' + RC_SEGS.map(function(k){
    var n = c[k];
    return '<button class="rchip clchip' + (k === RC_SEG ? ' on' : '') + '" onclick="rcPick(\'' + k + '\')">'
         + k + ' <span class="num">' + (n == null ? '—' : n) + '</span></button>';
  }).join('') + '</div>';
}

function rcBox(lb, val, colour){
  return '<div class="vital"><div class="lb">' + lb + '</div>'
       + '<div class="vv num"' + (colour ? ' style="color:' + colour + '"' : '') + '>' + val + '</div></div>';
}
function rcStrip(){
  /* EM-DASH, NEVER A FABRICATED ZERO — cc#1247's rule, kept and extended to the P&L box. The
     endpoint returns null for win rate and profit factor on an empty segment, but it returns a
     REAL 0.0 for the sum, because the sum of nothing genuinely is zero. Printing "+₹0" under
     TRADES 0 would still read as "this segment traded and broke even", so the P&L box follows the
     trade count rather than the value: no trades, no number. */
  var d   = rcStat(RC_SEG);
  var t   = (d.trades == null) ? '—' : d.trades;
  var wr  = (d.win_rate == null) ? '—' : d.win_rate + '%';
  var pfv = (d.profit_factor == null) ? '—' : Number(d.profit_factor).toFixed(2);
  var pnl = d.trades ? rcBig(d.pnl) : '—';
  return '<div class="vitals pfgrid rcstrip">'
    + rcBox('TRADES', t)
    + rcBox('WIN RATE', wr)
    + rcBox('PROFIT F.', pfv,
            d.profit_factor == null ? '' : (d.profit_factor >= 1 ? 'var(--volt)' : 'var(--heat)'))
    + rcBox('NET P&amp;L', pnl, d.trades ? cx(Number(d.pnl)) : '')
    + '</div>';
}

/* ── the trade-book row, per R2 ────────────────────────────────────────────────────────────
   A row is one LEG and reads as a JOURNEY: who traded, what it made, then where it opened and
   where it closed. pnl not net_pnl — net is the pair's result, and printing it on a hedge row
   would show the whole trade's money beside the option's own prices. Side is the leg's own side
   too: a hedge sits opposite its future by construction, so stamping the trade direction on it
   would state the reverse of what that leg actually did. */
function rcRow(t){
  var pn   = (t.pnl == null) ? null : Number(t.pnl);
  /* cc#1263's rule, still needed: several option legs carry an exit_reason like
     "SL [CC#746: WRITTEN-PE LABEL CORRECTED BUY->SELL; P&L UNCHANGED]" — a provenance stamp
     written into the same column. The bracket and everything after it is dropped from the LABEL
     only; nothing is edited in the data and the outcome word is still the real one. */
  var rsn  = String(t.reason || 'EXIT').toUpperCase().split(' [')[0].trim() || 'EXIT';
  var lbl  = (rsn === 'TARGET') ? 'TGT' : rsn;
  var win  = (rsn === 'TARGET' || rsn === 'TGT');
  var shrt = (t.direction === 'SHORT');
  return '<div class="rctr">'
    + '<div class="rctop">'
    +   '<div class="rcwho">'
    +     '<span class="rcsym">' + esc(t.symbol) + '</span>'
    +     '<span class="rcleg">' + esc(t.label || rcLeg(t)) + '</span>'
    +     '<span class="chip ' + (shrt ? 'l' : 'w') + ' rcside">' + (shrt ? 'S' : 'L') + '</span>'
    +   '</div>'
    +   '<div class="rcpnl num" style="color:' + (pn != null ? cx(pn) : 'var(--muted)') + '">'
    +     rcMoney(pn) + '</div>'
    + '</div>'
    + '<div class="rcjr">'
    +   '<div class="rclp"><span class="rck">OPEN</span>'
    +     '<span class="rcd">' + esc(rcDay(t.entry_ist)) + '</span>'
    +     '<span class="rcp num">' + rcPrice(t.entry_price) + '</span></div>'
    +   '<div class="rcarrow">→</div>'
    +   '<div class="rclp rcright"><span class="rck">CLOSE</span>'
    +     '<span class="rcd">' + esc(rcDay(t.exit_ist)) + '</span>'
    +     '<span class="rcp num">' + rcPrice(t.exit_price) + '</span></div>'
    +   '<div class="rcexit"><span class="chip ' + (rsn === 'SL' ? 'l' : win ? 'w' : 'mu')
    +     ' rcrsn">' + esc(lbl) + '</span></div>'
    + '</div>'
    + '</div>';
}

function rcDeck(){
  var rows = rcList();
  if (!rows.length){
    /* HONEST EMPTY STATE: the deck is emptied rather than left holding the previous segment's
       pages, and the line says which filter found nothing rather than implying the book is. */
    DK.ctrack.n = 0;
    RC_PAGES = 0;
    return '<div class="unavail">No closed trades'
         + (RC_SEG === 'ALL' ? '.' : ' in ' + RC_SEG + '.') + '</div>';
  }
  var pages = [];
  for (var i = 0; i < rows.length; i += RC_PER) pages.push(rows.slice(i, i + RC_PER));
  DK.ctrack.n = pages.length;
  RC_PAGES = pages.length;
  var set = pages.map(function(pg){
    return '<div class="vpage"><div class="rcpage">' + pg.map(rcRow).join('') + '</div></div>';
  }).join('');
  var dots = pages.map(function(_, j){ return '<i class="' + (j ? '' : 'on') + '"></i>'; }).join('');
  /* A dot per page reads fine at 2 and is unreadable at 19, so the count carries the position and
     the dots stay as the familiar affordance. */
  return '<div class="vswipe"><div class="vswipe-t" id="ctrack" onscroll="cWrap()">'
       + set + set + set + '</div><div class="rpager"><div class="vdots" id="cdots">' + dots + '</div>'
       + '<span class="clpg" id="clpg">1 / ' + pages.length + '</span></div></div>';
}

/* Re-render the CHIPS and the STRIP with the deck, not just the deck. cc#1190 shipped exactly this
   bug: the rows filtered correctly and the active chip never moved, so the screen showed filtered
   rows under a highlighted ALL — working filter, lying page. Here the strip is in the same blast
   radius, which is the whole point of merging the two cards. */
function rcPick(k){
  if (RC_SEGS.indexOf(k) < 0) return;
  RC_SEG = k;
  var host = document.getElementById('rcwrap'), note = document.getElementById('rcnote');
  if (!host) return;
  host.innerHTML = rcChips() + rcStrip() + rcDeck();
  if (note) note.textContent = rcNote();
  dkPark('ctrack');
}
function rcLabel(i){
  var el = document.getElementById('clpg');
  if (el && RC_PAGES) el.textContent = ((i || 0) + 1) + ' / ' + RC_PAGES;
}
function cWrap(){ dkWrap('ctrack'); rcLabel(dkDots('ctrack')); }
function cPark(){ dkPark('ctrack'); rcLabel(dkDots('ctrack')); }

function posSide(p){
  /* ONE place decides LONG/SHORT, reading `side` because that is the field the endpoint sends.
     `direction` is accepted first only so that a future payload adding it needs no change here. */
  var d = p && (p.direction || p.side);
  if (!d) return null;                     // absent stays absent — no chip beats a blank chip
  d = String(d).toUpperCase();
  if (d === 'SHORT' || d === 'SELL') return 'SHORT';
  if (d === 'LONG'  || d === 'BUY')  return 'LONG';
  return d;
}
function bookDir(p){
  /* cc#1327 — the badge must say the VIEW the leg expresses (Bullish/Bearish), not the raw
     buy/sell mechanics posSide() reports. A written PUT is a bullish position; posSide() calls
     it SHORT, which next to a LONG futures leg expressing that SAME view reads as a reversal —
     the exact "shown as peers they read as two separate trades" bug v10_endpoints.py's paired_
     trades() doctrine (cc#941/1158) already fixed once, resurfacing here on a different card.
     Per-leg opt_type+side is the classifier: /api/v10/positions serves raw legs with no parent-
     signal direction field reachable per row, so there is nothing more reliable to read.
     FUT and a bought CALL follow side directly (LONG=Bullish, SHORT=Bearish); a PUT flips it
     (LONG a put=Bearish, a WRITTEN/SHORT put=Bullish) since selling downside protection is the
     bullish side of that contract. */
  var side = posSide(p);
  if (!side) return null;
  var long = side === 'LONG';
  var pe = p.opt_type && String(p.opt_type).toUpperCase() === 'PE';
  return (pe ? !long : long) ? 'Bullish' : 'Bearish';
}
function bookRow(p){
  var dirv = bookDir(p), pn = Number(p.unrealised_pnl) || 0;
  var leg = p.opt_type
    ? esc(String(p.opt_strike || '')) + ' ' + esc(p.opt_type) + '·wrt'
    : 'FUT';
  /* em-dash where the value is genuinely absent, per the card's data-honesty line: the option
     legs carry no stop or target in v10_positions and must not borrow the futures leg's. */
  var lv = function(v){ return (v === null || v === undefined || v === '') ? '—' : num(v); };
  return '<div class="bkrow">'
    + '<div class="bk1"><b>' + esc(p.symbol) + '</b> <span class="bkleg">' + leg + '</span>'
    + (dirv ? '<span class="chip ' + (dirv === 'Bearish' ? 'l' : 'w') + ' bkside">' + dirv + '</span>' : '')
    + '<span class="bkpnl num" style="color:' + cx(pn) + '">₹' + num(pn) + '</span></div>'
    + '<div class="bk2">'
    + '<span>OPEN <b class="num">' + esc(String(p.entry_ts || p.entry_ist || '').slice(0, 10) || '—') + '</b></span>'
    + '<span>ENTRY <b class="num">' + lv(p.entry_price) + '</b></span>'
    + '<span>CMP <b class="num">' + lv(p.cmp) + '</b></span>'
    /* cc#1262 · TGT and STOP are FUTURES-ONLY now. The comment above already says the option legs
       carry no stop or target in v10_positions, so on an OPTIONS row these two fields were a
       guaranteed pair of em-dashes — two labels and no information, taking a third of the line.
       The row already knows which it is: p.opt_type is the same flag bookDeck splits the two cards
       on, so this needs no new argument and cannot disagree with which card the row landed in.
       FUTURES keeps them exactly as they were, values untouched. */
    + (p.opt_type ? ''
        : '<span>TGT <b class="num">' + lv(p.target) + '</b></span>'
        + '<span>STOP <b class="num">' + lv(p.stop) + '</b></span>')
    + '</div></div>';
}
function bookCard(label, rows){
  if(!rows.length)
    return '<div class="vpage"><div class="card"><div class="grp"><h3>' + esc(label) + '</h3></div>'
         + '<div class="unavail">No open ' + esc(label.toLowerCase()) + ' leg.</div></div></div>';
  var tot = rows.reduce(function(a, p){ return a + (Number(p.unrealised_pnl) || 0); }, 0);
  return '<div class="vpage"><div class="card">'
    + '<div class="grp"><h3>' + esc(label) + '</h3>'
    + '<span class="num" style="font-weight:800;color:' + cx(tot) + '">₹' + num(tot) + '</span></div>'
    + rows.map(bookRow).join('') + '</div></div>';
}
function bookDeck(open){
  open = open || [];
  var futs = open.filter(function(p){ return !p.opt_type; });
  var opts = open.filter(function(p){ return !!p.opt_type; });
  var cards = [bookCard('FUTURES', futs), bookCard('OPTIONS', opts)];
  DK.btrack.n = cards.length;
  var set = cards.join('');
  var dots = cards.map(function(_, j){ return '<i class="' + (j ? '' : 'on') + '"></i>'; }).join('');
  return '<div class="vswipe"><div class="vswipe-t" id="btrack" onscroll="bWrap()">'
       + set + set + set + '</div><div class="vdots" id="bdots">' + dots + '</div></div>';
}

function sigCard(name,key){
  const s=D.sig[key], lm=D.lm[key]||{};
  const cmp=lm.cmp!=null?Number(lm.cmp):null, day=lm.day_pct!=null?Number(lm.day_pct):null;
  const ok=s&&s.status==='ok';
  const sigw=ok?(s.signal==='BUY'?'LONG':s.signal==='SELL'?'SHORT':'FLAT'):'FLAT';
  const rc=sigw==='LONG'?'var(--volt)':sigw==='SHORT'?'var(--heat)':'var(--amber)';
  const st=ok?(s.st_dir==='up'?'BUY':'SELL'):null, ema=ok?(s.gate_zone==='buy'?'BUY':'SELL'):null;
  const pos=D.open.find(p=>((p.symbol||'').toUpperCase()===(key==='N'?'NIFTY50':'BANKNIFTY'))&&!p.opt_type);
  const state = pos?`Pos <b style="color:${pos.direction==='SHORT'?'var(--heat)':'var(--volt)'}">${esc(pos.direction)}</b> @ <b class="num">${num(pos.entry_price)}</b> · uP&L <b class="num" style="color:${cx(Number(pos.unrealised_pnl)||0)}">₹${num(pos.unrealised_pnl||0)}</b>`
    : ok&&sigw!=='FLAT'?`Entry <b class="num">${num(s.price)}</b> · live signal, no open leg`
    : ok?`<span style="color:var(--amber)">FLAT — awaiting aligned flip (window 09:20–15:20)</span>`
    : `<span style="color:var(--amber)">Engine snapshot not available yet — first tick lands after the bell</span>`;
  return `<div class="card rail" style="--rc:${rc}">
    <div class="grp"><h3><span class="idxnm">${name}</span> <span style="color:${rc}">${sigw}</span></h3>
      <span class="note">ST150/3·10m · EMA3/10·30m</span></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      ${st?`<span class="chip ${st==='BUY'?'w':'l'}">${st==='BUY'?'W':'L'} ST ${st}</span>`:'<span class="chip">ST —</span>'}
      ${ema?`<span class="chip ${ema==='BUY'?'w':'l'}">${ema==='BUY'?'W':'L'} EMA ${ema}</span>`:'<span class="chip">EMA —</span>'}
      ${ok&&s.flip_ts?`<span class="chip" style="color:var(--muted)">FLIP ${esc(String(s.flip_ts).slice(5,16))}</span>`:''}</div>
    <div style="display:flex;align-items:baseline;gap:10px">
      <span class="num" style="font-size:30px;font-weight:800">${cmp!=null?num(cmp):'—'}</span>
      <span class="num" style="color:${day!=null?cx(day):'var(--muted)'};font-weight:700">${day!=null?sgn(day)+'%':''}</span></div>
    <div class="vitals" style="margin-top:12px">
      <div class="vital"><div class="lb">ST BAND</div><div class="vv num" style="color:var(--amber)">${ok&&s.st_band?num(s.st_band):'—'}</div></div>
      <div class="vital"><div class="lb">STOP</div><div class="vv num" style="color:var(--heat)">${ok&&s.stop?num(s.stop):'—'}</div></div>
      <div class="vital"><div class="lb">TARGET</div><div class="vv num" style="color:var(--volt)">${ok&&s.target?num(s.target):'—'}</div></div></div>
    <div style="margin-top:10px;font-family:'JetBrains Mono';font-size:11px;color:var(--muted)">${state}</div>
  </div>`;
}

/* ══ cc#1322 · LIVE NEWS — ported from mobile/home.html, last section on this page ═══════════════
   Behaviour is unchanged from Home: same endpoints, same RAW/POLISH split, same paging, same
   bottom-sheet peek including the cc#1312 round-2 fix (search that marker below). The only
   adaptation beyond colour tokens (see the CSS block's own note) is the fetch call: home.html uses
   fetchWithTimeout() from /scorr_card_common.js, which this page does not load -- that file is a
   1000+ line shared component library with its own nav-ownership and card-sheet singletons, and
   pulling in all of it just for one timeout wrapper would be a bigger blast-radius risk than the
   thing it fixes. This page already has its own get-JSON helper (gj, used by every other loader
   above) and uses that instead -- same endpoints, same params, same error handling, no import. */
function rnAgo(ts){
  if (!ts) return '';
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'just now';
  var m = Math.floor(s / 60); if (m < 60) return m + ' min ago';
  var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}
var RN = { items: [], page: 0, per: 6, mode: 'polish', raw: [], polish: [] };
/* cc#1326 · POLISH-only category filter, by icon rather than a chip row (founder's own word).
   RAW carries no category on the payload at all (founder confirmed directly) so the icon only
   ever shows on the POLISH tab. RN.polish/RN.raw stay the FULL unfiltered sets from the fetch;
   RN.items is always the derived, currently-visible slice -- rnApplyMode() is the one place that
   decides it, so a mode switch, a filter pick and a fresh fetch can never compute it three
   different ways. */
var RN_CAT = 'ALL';
var RN_CATS = ['AI Editorial','Domestic','Global','IPO','Stock Views'];
var RN_FILTER_OPEN = false;

function rnApplyMode(){
  var src = (RN.mode === 'polish') ? RN.polish : RN.raw;
  RN.items = (RN.mode === 'polish' && RN_CAT !== 'ALL')
    ? src.filter(function(n){ return n.category === RN_CAT; }) : src;
}

function nwSetMode(m){
  if (RN.mode === m) return;
  RN.mode = m;
  RN.page = 0;
  RN_FILTER_OPEN = false;
  rnApplyMode();
  rnPaint();
}

function nwFilterToggle(ev){
  if (ev){ ev.preventDefault(); ev.stopPropagation(); }
  RN_FILTER_OPEN = !RN_FILTER_OPEN;
  nwPaintTabs();
}
function nwFilterPick(cat){
  RN_CAT = cat;
  RN.page = 0;
  RN_FILTER_OPEN = false;
  rnApplyMode();
  rnPaint();
}
/* click-outside-closes, bound once. .nwfilter wraps both the icon and its open menu, so a tap
   anywhere else in the document (including the tabs, the deck, another card) closes it -- the
   same "does this belong to the control" test rnBindSwipe's capture listener uses below. */
document.addEventListener('click', function(e){
  if (RN_FILTER_OPEN && !e.target.closest('.nwfilter')){ RN_FILTER_OPEN = false; nwPaintTabs(); }
});

function rnPages(){ return Math.max(1, Math.ceil(RN.items.length / RN.per)); }

function rnGo(ev, delta){
  if (ev){
    if (ev.preventDefault) ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
  }
  var last = rnPages() - 1;
  var next = Math.min(last, Math.max(0, RN.page + delta));
  if (next === RN.page) return;
  RN.page = next;
  rnPaint();
}

var RN_SW = { x:0, y:0, armed:false, just:false };

function rnBindSwipe(){
  var box = document.getElementById('rnBox');
  if (!box || box._rnSwipeBound) return;
  box._rnSwipeBound = true;

  box.addEventListener('touchstart', function(e){
    if (!e.touches || e.touches.length !== 1){ RN_SW.armed = false; return; }
    RN_SW.x = e.touches[0].clientX; RN_SW.y = e.touches[0].clientY; RN_SW.armed = true;
  }, { passive:true });

  box.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) RN_SW.armed = false;
  }, { passive:true });

  box.addEventListener('touchend', function(e){
    if (!RN_SW.armed) return;
    RN_SW.armed = false;
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    var dx = t.clientX - RN_SW.x, dy = t.clientY - RN_SW.y;
    if (Math.abs(dx) < 50 || Math.abs(dx) <= 2 * Math.abs(dy)) return;
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    RN_SW.just = true;
    setTimeout(function(){ RN_SW.just = false; }, 400);
    rnGo(null, dx < 0 ? 1 : -1);
  }, { passive:false });

  box.addEventListener('click', function(e){
    if (!RN_SW.just) return;
    if (e.preventDefault) e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
  }, true);
}

function rnCatShort(c){
  return window.ScorrNewsRow ? ScorrNewsRow.catShort(c) : '';
}

function rnPaint(){
  var box = document.getElementById('rnBox');
  if (!box) return;
  if (window.ScorrNewsRow) ScorrNewsRow.injectCss();
  nwPaintTabs();
  if (!RN.items.length){
    box.innerHTML = '<div class="unavail" style="padding:8px 0">No '
      + (RN.mode === 'polish' ? 'polished articles' : 'headlines') + ' in the last 48 hours.</div>';
    return;
  }
  var pages = rnPages(), p = RN.page;
  var slice = RN.items.slice(p * RN.per, p * RN.per + RN.per);
  var isRaw = RN.mode === 'raw';
  var rows = slice.map(function(n, i){
    var idx = p * RN.per + i;
    var dot = window.ScorrNewsRow
      ? '<span class="nrdot ' + ScorrNewsRow.sentiClass(n.sentiment) + '"></span>' : '';
    /* cc#1326 · RAW rows are NOT tappable — founder confirmed directly: a raw item has no
       polished body behind it, so a peek sheet would have nothing real to open (nwOpen's own
       fallback already said as much: "polished version not yet available"). A <div>, not a
       <button>, and no onclick at all, rather than a button that quietly does nothing. Full row
       width for the headline (no sibling timestamp column to share it with) and the age moves to
       its own line below in smaller/lighter text — the founder's own layout ask, 25-Aug. */
    if (isRaw){
      var ago2 = esc(rnAgo(n.published_at) || '');
      return '<div class="nwrow nwraw">' + dot
        + '<div class="nwrawbody"><span class="h">' + esc(n.headline) + '</span>'
        + (ago2 ? '<span class="t2">' + ago2 + '</span>' : '') + '</div></div>';
    }
    var tag = n.category ? '<span class="nwcat">' + esc(rnCatShort(n.category)) + '</span>' : '';
    return '<button type="button" class="nwrow" onclick="nwOpen(' + idx + ')">'
      + dot
      + '<span class="h">' + esc(n.headline) + '</span>'
      + '<span class="t">' + esc(rnAgo(n.published_at) || '') + '</span>'
      + tag + '</button>';
  }).join('');
  /* the fixed six-row reservation (cc#1204) only makes sense for POLISH's fixed-height rows —
     padding an auto-height RAW row with an empty filler achieves nothing, so RAW skips it. */
  if (!isRaw) for (var _pad = slice.length; _pad < RN.per; _pad++)
    rows += '<div class="nwrow nwpad" aria-hidden="true"></div>';
  var ctl = '<div class="rnpg" onclick="event.preventDefault();event.stopPropagation()">'
    + '<button class="rnb" onclick="rnGo(event,-1)"' + (p === 0 ? ' disabled' : '') + '>‹ Prev</button>'
    + '<span class="rnp">' + (p + 1) + ' / ' + pages + '</span>'
    + '<button class="rnb" onclick="rnGo(event,1)"' + (p >= pages - 1 ? ' disabled' : '') + '>Next ›</button>'
    + '</div>';
  box.innerHTML = '<div class="rnlist' + (isRaw ? ' raw' : '') + '">' + rows + '</div>' + ctl;
  nwPaintTabs();
}

function nwFilterMenuHtml(){
  if (RN.mode !== 'polish' || !RN_FILTER_OPEN) return '';
  var counts = {};
  RN.polish.forEach(function(n){ if (n.category) counts[n.category] = (counts[n.category] || 0) + 1; });
  var opts = [{ t:'ALL', n: RN.polish.length }].concat(
    RN_CATS.filter(function(c){ return counts[c] > 0; }).map(function(c){ return { t:c, n:counts[c] }; }));
  return '<div class="nwfmenu">' + opts.map(function(o){
    return '<button type="button" class="nwfitem' + (o.t === RN_CAT ? ' on' : '') + '" onclick="nwFilterPick(\''
      + o.t.replace(/'/g,"\\'") + '\')">' + esc(o.t) + ' <span class="n">' + o.n + '</span></button>';
  }).join('') + '</div>';
}

function nwPaintTabs(){
  var el = document.getElementById('nwTabs');
  if (!el) return;
  function tab(mode, label, n){
    return '<button type="button" class="nwtab' + (RN.mode === mode ? ' on' : '') + '"'
      + ' onclick="nwSetMode(\'' + mode + '\')">' + label
      + '<small>' + n + '</small></button>';
  }
  /* cc#1326: the filter icon lives next to the tabs, POLISH-only, per the founder's own word
     "icon" (not another chip row like cc#1321's, which this exact class of crowding problem
     already taught this codebase to avoid on a 5-option set). */
  var filterBtn = (RN.mode === 'polish')
    ? '<button type="button" class="nwfico' + (RN_CAT !== 'ALL' ? ' on' : '') + '" onclick="nwFilterToggle(event)" aria-label="Filter by category">⚙</button>'
    : '';
  el.innerHTML = '<div class="nwtabsrow"><div class="nwtabs">' + tab('polish', 'POLISH', RN.polish.length)
    + tab('raw', 'RAW', RN.raw.length) + '</div>'
    + (filterBtn ? '<div class="nwfilter">' + filterBtn + nwFilterMenuHtml() + '</div>' : '') + '</div>';
}

function loadRawNews(){
  var box = document.getElementById('rnBox'), cnt = document.getElementById('rnCount');
  if (!box) return;
  gj('/api/news/live?hours=72&per_cat=300')  /* cc#1331: founder-direct, 48->72 */
    .then(function(d){
      if (!d || d.error) throw new Error((d && d.error) || 'no data');
      var arr = (d.domestic || []).concat(d.company || []);
      arr.sort(function(a, b){
        return new Date(b.published_at || 0) - new Date(a.published_at || 0);
      });
      if (cnt) cnt.textContent = arr.length + ' raw headlines ›';
      var items = arr.filter(function(n){ return n && String(n.headline || '').trim(); });
      RN.raw = items;
      if (RN.mode === 'raw' || !RN.polish.length){ RN.page = 0; rnApplyMode(); }
      rnPaint();
      rnBindSwipe();
    })
    .catch(function(e){
      if (cnt) cnt.textContent = 'unavailable ›';
      box.innerHTML = '<div class="unavail" style="padding:8px 0">Live news unavailable: ' + esc(e.message) + '</div>';
    });
  gj('/api/news/polished?category=all&limit=300')  /* cc#1331: backend cap was 100, raised to 300 */
    .then(function(d){
      if (!d || d.error) throw new Error((d && d.error) || 'no data');
      var cutoff = Date.now() - 48 * 3600 * 1000;
      RN.polish = (d.articles || [])
        .filter(function(a){ return a && String(a.headline_clean || '').trim(); })
        .filter(function(a){
          var t = new Date(a.published_time || 0).getTime();
          return isFinite(t) && t >= cutoff;
        })
        .map(function(a){
          return { headline: a.headline_clean, published_at: a.published_time,
                   sentiment: a.sentiment, impact: a.impact,
                   category: a.category || '',
                   body: a.full_summary || a.summary || '', polished: true };
        });
      if (RN.mode === 'polish'){ RN.page = 0; rnApplyMode(); }
      rnPaint();
      rnBindSwipe();
    })
    .catch(function(){
      RN.polish = [];
      if (RN.mode === 'polish'){ RN.mode = 'raw'; RN.page = 0; rnApplyMode(); }
      rnPaint();
    });
}

var NW = { open: false, y: 0, scrollY: 0 };

function nwMd(txt){
  var safe = esc(String(txt == null ? '' : txt));
  return safe.split(/\n\s*\n/).map(function(para){
    var t = para.trim();
    if (!t) return '';
    return '<p>' + t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

function nwChip(v, kind){
  if (!v) return '';
  var t = String(v).toUpperCase();
  var cls = kind === 'impact'
    ? (t === 'HIGH' ? 'hi' : 'nt')
    : (t === 'BULLISH' ? 'up' : (t === 'BEARISH' ? 'dn' : 'nt'));
  return '<span class="nwchip ' + cls + '">' + esc(kind === 'impact' ? t + ' IMPACT' : t) + '</span>';
}

function nwOpen(idx){
  var n = RN.items[idx];
  if (!n) return;
  nwClose();
  NW.scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;

  var meta = '';
  var ago = rnAgo(n.published_at);
  if (ago) meta += '<span>' + esc(ago) + '</span>';
  meta += nwChip(n.sentiment, 'sentiment') + nwChip(n.impact, 'impact');

  var body = String(n.body || '').trim()
    ? '<div class="nwbd">' + nwMd(n.body) + '</div>'
    : '<div class="nwnone">raw feed item — polished version not yet available.</div>';

  var veil = document.createElement('div');
  veil.className = 'nwveil';

  var sheet = document.createElement('div');
  sheet.className = 'nwsheet';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-modal', 'true');
  sheet.innerHTML = '<div class="nwgrab"></div>'
    + '<div class="nwsb"><div class="nwsh">' + esc(n.headline) + '</div>'
    + '<div class="nwsm">' + meta + '</div>' + body + '</div>';

  document.body.appendChild(veil);
  document.body.appendChild(sheet);
  document.body.style.overflow = 'hidden';
  NW.open = true;
  nwBindSheet(sheet);
  /* cc#1312 round 2 · THE SAME FIX THAT LANDED ON HOME, travelling WITH the ported code rather
     than getting silently dropped. veil.onclick bound synchronously here would be live for the
     SAME tap that opened the sheet -- a full-screen element inserted under the finger mid-event
     can pick up the browser's synthesized click, closing the sheet before it is ever seen. Binding
     one requestAnimationFrame later keeps it closable on every genuine tap after this one, not the
     tap that created it. */
  requestAnimationFrame(function(){
    if (!veil.parentNode) return;
    veil.onclick = nwClose;
    var grab = sheet.querySelector('.nwgrab');
    if (grab) grab.onclick = nwClose;
  });
}

function nwClose(){
  var v = document.querySelector('.nwveil'), s = document.querySelector('.nwsheet');
  if (v) v.remove();
  if (s) s.remove();
  if (NW.open){
    document.body.style.overflow = '';
    window.scrollTo(0, NW.scrollY);
    NW.open = false;
  }
}

function nwBindSheet(sheet){
  var sb = sheet.querySelector('.nwsb');
  sheet.addEventListener('touchstart', function(e){
    NW.y = (e.touches && e.touches[0]) ? e.touches[0].clientY : 0;
  }, { passive: true });
  sheet.addEventListener('touchend', function(e){
    var t = e.changedTouches && e.changedTouches[0];
    if (!t || !sb) return;
    if (sb.scrollTop > 4) return;
    if (t.clientY - NW.y > 60) nwClose();
  }, { passive: true });
}

document.addEventListener('keydown', function(e){
  if (NW.open && (e.key === 'Escape' || e.keyCode === 27)) nwClose();
});

function render(){

  const pN=pcrParse(D.pcr.N), pB=pcrParse(D.pcr.B);
  const [bnL,bnC]=pcrBand(pN.cur), [bbL,bbC]=pcrBand(pB.cur);

  const openF=D.open, totO=openF.reduce((a,p)=>a+(Number(p.unrealised_pnl)||0),0);
  const openDeck=bookDeck(openF);

  /* cc#1264: cl / wr / totC / pf are GONE with the two cards they fed. The Record's header carries
     no numbers of its own — the stat strip is the header — so nothing here recomputes a win rate or
     a total that the strip already serves from the endpoint. cc#1263's finding still holds and is
     worth keeping written down: a pair's net IS the sum of its legs, so the all-time total is
     Rs 155,051.75 whether it is summed over 95 legs or 52 pairs, while the WIN RATE legitimately
     differs between the two because it asks a narrower question of a different set. */
  /* cc#1248: bl/bs/brow are gone with the two-column list they fed — buildupDeck() reads
     D.build directly and buckets by the signal the endpoint already computes. */
  const dv=(D.div&&D.div.rows||[]).slice(0,4);
  const drow=r=>`<div class="mrow"><b>${esc(r.symbol)}</b><span class="chip n" style="font-size:9px;padding:1px 6px">${esc((r.signals||[]).join(' · ')||'—')}</span><span style="flex:1"></span><span class="num" style="color:var(--muted)">${r.age_min!=null?r.age_min+'m':'—'}</span></div>`;

  $('app').innerHTML=`
  ${SHOW_SIGNAL_TILES ? `<div class="eyebrow">THE SIGNALS · V10 ST+EMA</div>
  ${sigCard('NIFTY','N')}
  ${sigCard('BANKNIFTY','B')}
  ` : ''}
  <div class="eyebrow">VOLATILITY &amp; FLOW</div>
  ${volDeck()}
  ${SHOW_VOL_TILES ? `<div class="card">
    <div class="vitals">
      <div class="vital"><div class="lb">INDIA VIX</div><div class="vv num" style="color:${vc==null?'var(--muted)':vc<15?'var(--volt)':vc<20?'var(--amber)':'var(--heat)'}">${vc!=null?vc.toFixed(2):'—'}</div><div class="sb">${vix.chg!=null?sgn(Number(vix.chg)):''} · ${vlab}</div></div>
      <div class="vital"><div class="lb">A/D · N500</div><div class="vv num" style="color:${ar==null?'var(--muted)':ar>=1?'var(--volt)':'var(--heat)'}">${ar!=null?ar.toFixed(2):'—'}</div><div class="sb">${adr.advances!=null?adr.advances+'A / '+adr.declines+'D':''}</div></div>
      <div class="vital"><div class="lb">MAX PAIN</div><div class="vv num" style="color:var(--aqua)">${mp?num(mp.max_pain_strike):'—'}</div><div class="sb" style="color:${mp?(mp.distance>=0?'var(--heat)':'var(--volt)'):'var(--muted)'}">${mp?sgn(Number(mp.distance),0)+' vs spot':'chain pending'}</div></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:14px">
      <div style="flex:1"><div style="display:flex;justify-content:space-between"><span style="font-size:10px;color:var(--muted);letter-spacing:1.5px">PCR NIFTY</span><span class="chip ${bnC}" style="font-size:9px;padding:2px 6px">${bnL}${pN.cur!=null?' '+pN.cur.toFixed(2):''}</span></div>${spark(pN.series,'#FF9F45')}</div>
      <div style="flex:1"><div style="display:flex;justify-content:space-between"><span style="font-size:10px;color:var(--muted);letter-spacing:1.5px">PCR BNK</span><span class="chip ${bbC}" style="font-size:9px;padding:2px 6px">${bbL}${pB.cur!=null?' '+pB.cur.toFixed(2):''}</span></div>${spark(pB.series,'#C8F542')}</div>
    </div>
    <div style="font-size:9.5px;color:var(--muted);font-family:'JetBrains Mono';margin-top:6px">7-day daily PCR${(pN.gaps+pB.gaps)?` · ${pN.gaps+pB.gaps} day(s) no reading — gaps stated, never zero`:''}</div>
  </div>` : ''}

  <div class="eyebrow">THE BOOK · V10</div>
  <div class="card" style="padding-bottom:var(--space-10)">
    <div class="grp"><h3>Open · ${openF.length}</h3><span class="num" style="font-weight:800;color:${cx(totO)}">₹${num(totO)}</span></div>
  </div>
  ${openDeck}
  <div class="card">
    <div class="grp"><h3>The Record</h3><span class="note" id="rcnote">${rcNote()}</span></div>
    <div id="rcwrap">${rcChips()}${rcStrip()}${rcDeck()}</div>
  </div>

  <div class="eyebrow">STOCK F&amp;O RADAR · LIVE 5-MIN</div>
  ${buildupDeck()}
  ${SHOW_DIVERGENCE ? `<div class="card">
    <div class="grp"><h3>Fut ⇄ Equity Divergence</h3><span class="note">FLAG &gt; ±${D.div&&D.div.threshold!=null?D.div.threshold:1}%</span></div>
    ${dv.length?dv.map(drow).join(''):'<div class="unavail">No divergence signals above threshold</div>'}
  </div>` : ''}

  <div class="eyebrow">ENGINE</div>
  <div class="card" style="padding:12px 16px">
    <span style="font-size:12.5px;color:var(--muted)">V10 config · ST 150/3·10m · EMA 3/10·30m · FUT + ATM write · entry 09:20–15:20 IST · locked 16-Jun</span>
  </div>

  <div class="eyebrow">LIVE NEWS</div>
  <div class="card">
    <div class="grp"><h3>Live News</h3><a class="plink" id="rnCount" href="/m/intel" style="font-size:var(--type-95)">loading…</a></div>
    <div id="nwTabs"></div>
    <div class="newslist" id="rnBox"><div class="unavail">Loading headlines…</div></div>
  </div>`;
}

async function boot(){ await loadAll(); render(); vPark(); bPark(); cPark(); uPark(); loadRawNews(); }   /* cc#1242: park on the middle set before the deck is ever seen, so the first swipe left wraps instead of hitting a wall. cc#1322: LIVE NEWS paints its placeholder with render() above, loadRawNews() fills it after, same sequencing as it had on Home. */
boot();
setInterval(async()=>{ const d=IST(),m=d.getHours()*60+d.getMinutes();
  if(d.getDay()>=1&&d.getDay()<=5&&m>=555&&m<=935){ await loadAll(); render(); } },300000);
</script>
